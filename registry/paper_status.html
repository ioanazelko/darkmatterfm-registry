<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper status viewer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #20242d;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a94a6;
    --accept: #2ecc71;
    --reject: #ff6b6b;
    --warn: #f5b041;
    --accent: #66a3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { padding: 16px 24px 80px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .card.accept .value { color: var(--accept); }
  .card.reject .value { color: var(--reject); }
  .card.warn .value { color: var(--warn); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .bars { display: grid; gap: 4px; }
  .bar-row { display: grid; grid-template-columns: minmax(180px, 220px) 1fr 60px; gap: 8px; align-items: center; font-size: 12px; }
  .bar-row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .name.muted { color: var(--muted); }
  .bar-track { background: var(--panel-2); height: 10px; border-radius: 4px; overflow: hidden; display: flex; }
  .bar-fill { height: 100%; background: var(--accept); }
  .bar-fill.reject { background: var(--reject); }
  .bar-fill.warn { background: var(--warn); }
  .bar-row .count { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .filters input, .filters select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font: inherit;
  }
  .filters input[type="search"] { min-width: 260px; }
  .filters .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--panel-2); cursor: pointer; user-select: none; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); position: sticky; top: 0; }
  th .arrow { opacity: 0.4; font-size: 10px; }
  th.sorted .arrow { opacity: 1; color: var(--accent); }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  td.paper { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--accent); }
  td.shard { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  td.status-cell { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  td.status-cell.accepted { color: var(--accept); }
  td.status-cell.rejected { color: var(--reject); }
  td.status-cell.error { color: var(--warn); }
  td.count { text-align: right; font-variant-numeric: tabular-nums; }
  td.reason { color: var(--text); max-width: 600px; }
  td.reason.empty { color: var(--muted); font-style: italic; }

  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .pager button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }

  .legend { display: inline-flex; gap: 14px; font-size: 11px; color: var(--muted); align-items: center; margin-left: 12px; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Paper status viewer</h1>
  <div class="sub">3,458 papers · source: models/all_paper_status.jsonl</div>
</header>
<main>
  <section class="cards" id="summaryCards"></section>

  <section class="panel">
    <h2>Accepted model cards per paper
      <span class="legend"><span><span class="dot" style="background: var(--accept)"></span>papers</span></span>
    </h2>
    <div class="bars" id="cardCountBars"></div>
  </section>

  <section class="panel">
    <h2>Top shards by paper count
      <span class="legend">
        <span><span class="dot" style="background: var(--accept)"></span>accepted</span>
        <span><span class="dot" style="background: var(--reject)"></span>rejected</span>
      </span>
    </h2>
    <div class="bars" id="shardBars"></div>
  </section>

  <section class="panel">
    <h2>Common rejection-reason keywords</h2>
    <div class="bars" id="keywordBars"></div>
  </section>

  <section>
    <div class="filters">
      <input id="search" type="search" placeholder="Search paper id, shard, reason…">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="accepted">Accepted only</option>
        <option value="rejected">Rejected only</option>
        <option value="error">Error only</option>
      </select>
      <select id="shardFilter"><option value="">All shards</option></select>
      <span class="meta" id="rowMeta"></span>
    </div>
    <table id="table">
      <thead>
        <tr>
          <th data-sort="paper_id">Paper ID <span class="arrow">↕</span></th>
          <th data-sort="shard">Shard <span class="arrow">↕</span></th>
          <th data-sort="status">Status <span class="arrow">↕</span></th>
          <th data-sort="accepted_model_card_count">Cards <span class="arrow">↕</span></th>
          <th data-sort="rejection_reason">Rejection reason <span class="arrow">↕</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pager">
      <button id="prevBtn">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next ›</button>
    </div>
  </section>
</main>

<script>
  const rows = JSON.parse(document.getElementById('data').textContent);
  const PAGE = 100;
  const state = { search: '', status: '', shard: '', sortKey: 'paper_id', sortDir: 1, page: 0 };

  // --- summary cards ---
  const totals = { accepted: 0, rejected: 0, error: 0, cards: 0, shards: new Set() };
  for (const r of rows) {
    if (r.status === 'accepted') totals.accepted += 1;
    if (r.status === 'rejected') totals.rejected += 1;
    if (r.status === 'error') totals.error += 1;
    totals.cards += (r.accepted_model_card_count || 0);
    if (r.shard) totals.shards.add(r.shard);
  }
  const cards = [
    { label: 'Total papers', value: rows.length.toLocaleString(), cls: '' },
    { label: 'Accepted', value: totals.accepted.toLocaleString(), cls: 'accept' },
    { label: 'Rejected', value: totals.rejected.toLocaleString(), cls: 'reject' },
    { label: 'Errored', value: totals.error.toLocaleString(), cls: 'warn' },
    { label: 'Model cards emitted', value: totals.cards.toLocaleString(), cls: '' },
    { label: 'Shards', value: totals.shards.size.toLocaleString(), cls: '' },
    { label: 'Acceptance rate', value: (100 * totals.accepted / rows.length).toFixed(1) + '%', cls: '' },
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(c =>
    `<div class="card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join('');

  // --- card count histogram ---
  const countBuckets = new Map();
  for (const r of rows) {
    const k = r.accepted_model_card_count ?? 0;
    countBuckets.set(k, (countBuckets.get(k) || 0) + 1);
  }
  const countMax = Math.max(...countBuckets.values());
  const countSorted = [...countBuckets.entries()].sort((a, b) => a[0] - b[0]);
  document.getElementById('cardCountBars').innerHTML = countSorted.map(([k, v]) => `
    <div class="bar-row">
      <span class="name ${k === 0 ? 'muted' : ''}">${k} card${k === 1 ? '' : 's'}${k === 0 ? ' (rejected)' : ''}</span>
      <div class="bar-track"><div class="bar-fill ${k === 0 ? 'reject' : ''}" style="width: ${(100 * v / countMax).toFixed(2)}%"></div></div>
      <span class="count">${v.toLocaleString()}</span>
    </div>
  `).join('');

  // --- top shards ---
  const shardStats = new Map();
  for (const r of rows) {
    const s = r.shard || '(none)';
    if (!shardStats.has(s)) shardStats.set(s, { accepted: 0, rejected: 0 });
    const obj = shardStats.get(s);
    if (r.status === 'accepted') obj.accepted += 1;
    else if (r.status === 'rejected') obj.rejected += 1;
  }
  const shardSorted = [...shardStats.entries()]
    .map(([k, v]) => ({ shard: k, accepted: v.accepted, rejected: v.rejected, total: v.accepted + v.rejected }))
    .sort((a, b) => b.total - a.total);
  const shardMax = shardSorted.length ? shardSorted[0].total : 1;
  const TOP_SHARDS = 20;
  document.getElementById('shardBars').innerHTML = shardSorted.slice(0, TOP_SHARDS).map(s => {
    const aPct = (100 * s.accepted / shardMax).toFixed(2);
    const rPct = (100 * s.rejected / shardMax).toFixed(2);
    return `
      <div class="bar-row">
        <span class="name" title="${s.shard}">${s.shard.replace(/^data\//, '')}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width: ${aPct}%"></div>
          <div class="bar-fill reject" style="width: ${rPct}%"></div>
        </div>
        <span class="count">${s.accepted}/${s.total}</span>
      </div>
    `;
  }).join('');

  // --- rejection keyword tally ---
  const STOP = new Set(['the','a','an','and','or','of','for','to','in','on','at','by','with','no','not','is','are','this','that','as','it','its','from','be','was','were','can','only','any','all','non','new','also','model','models','dm']);
  const kw = new Map();
  for (const r of rows) {
    if (!r.rejection_reason) continue;
    const tokens = r.rejection_reason.toLowerCase().match(/[a-z][a-z\-]{2,}/g) || [];
    const seen = new Set();
    for (const t of tokens) {
      if (STOP.has(t) || seen.has(t)) continue;
      seen.add(t);
      kw.set(t, (kw.get(t) || 0) + 1);
    }
  }
  const kwSorted = [...kw.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
  const kwMax = kwSorted.length ? kwSorted[0][1] : 1;
  document.getElementById('keywordBars').innerHTML = kwSorted.map(([k, v]) => `
    <div class="bar-row keyword" data-keyword="${k}" style="cursor: pointer">
      <span class="name">${k}</span>
      <div class="bar-track"><div class="bar-fill reject" style="width: ${(100 * v / kwMax).toFixed(2)}%"></div></div>
      <span class="count">${v.toLocaleString()}</span>
    </div>
  `).join('');
  document.querySelectorAll('.keyword').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('search').value = el.dataset.keyword;
      document.getElementById('statusFilter').value = 'rejected';
      state.search = el.dataset.keyword;
      state.status = 'rejected';
      state.page = 0;
      render();
      document.getElementById('table').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // --- shard filter populate ---
  const shardSelect = document.getElementById('shardFilter');
  shardSorted.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.shard;
    opt.textContent = `${s.shard.replace(/^data\//, '')}  (${s.total})`;
    shardSelect.appendChild(opt);
  });

  // --- filters / sort / paging ---
  function compare(a, b, key) {
    let av = a[key], bv = b[key];
    if (key === 'accepted_model_card_count') { av = av ?? 0; bv = bv ?? 0; return av - bv; }
    av = (av ?? '').toString().toLowerCase();
    bv = (bv ?? '').toString().toLowerCase();
    if (av < bv) return -1;
    if (av > bv) return 1;
    return 0;
  }

  function filtered() {
    const q = state.search.toLowerCase();
    return rows.filter(r => {
      if (state.status && r.status !== state.status) return false;
      if (state.shard && r.shard !== state.shard) return false;
      if (!q) return true;
      return (r.paper_id || '').toLowerCase().includes(q)
        || (r.shard || '').toLowerCase().includes(q)
        || (r.rejection_reason || '').toLowerCase().includes(q)
        || (r.source_member || '').toLowerCase().includes(q);
    }).sort((a, b) => state.sortDir * compare(a, b, state.sortKey));
  }

  function render() {
    const data = filtered();
    const pages = Math.max(1, Math.ceil(data.length / PAGE));
    if (state.page >= pages) state.page = pages - 1;
    if (state.page < 0) state.page = 0;
    const start = state.page * PAGE;
    const slice = data.slice(start, start + PAGE);
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = slice.map(r => `
      <tr>
        <td class="paper">${esc(r.paper_id)}</td>
        <td class="shard" title="${esc(r.shard)}">${esc((r.shard || '').replace(/^data\//, ''))}</td>
        <td class="status-cell ${r.status}">${esc(r.status || '')}</td>
        <td class="count">${r.accepted_model_card_count ?? 0}</td>
        <td class="reason ${r.rejection_reason ? '' : 'empty'}">${r.rejection_reason ? esc(r.rejection_reason) : '—'}</td>
      </tr>
    `).join('');
    document.getElementById('rowMeta').textContent = `${data.length.toLocaleString()} of ${rows.length.toLocaleString()} rows`;
    document.getElementById('pageInfo').textContent = `Page ${state.page + 1} / ${pages}`;
    document.getElementById('prevBtn').disabled = state.page === 0;
    document.getElementById('nextBtn').disabled = state.page >= pages - 1;
    document.querySelectorAll('th').forEach(th => {
      th.classList.toggle('sorted', th.dataset.sort === state.sortKey);
      const a = th.querySelector('.arrow');
      if (a) a.textContent = th.dataset.sort === state.sortKey ? (state.sortDir === 1 ? '↑' : '↓') : '↕';
    });
  }

  function esc(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; state.page = 0; render(); });
  document.getElementById('statusFilter').addEventListener('change', e => { state.status = e.target.value; state.page = 0; render(); });
  document.getElementById('shardFilter').addEventListener('change', e => { state.shard = e.target.value; state.page = 0; render(); });
  document.getElementById('prevBtn').addEventListener('click', () => { state.page -= 1; render(); });
  document.getElementById('nextBtn').addEventListener('click', () => { state.page += 1; render(); });
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (state.sortKey === k) state.sortDir *= -1;
      else { state.sortKey = k; state.sortDir = 1; }
      state.page = 0;
      render();
    });
  });

  render();
</script>
</body>
</html>
