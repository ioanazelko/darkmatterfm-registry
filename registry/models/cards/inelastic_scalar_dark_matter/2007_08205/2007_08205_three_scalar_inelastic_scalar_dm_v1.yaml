    value: multi-TeV range
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2007_08205'
    notes: The paper describes the cutoff as presumably in the multi-TeV range.
  embedded_in_larger_framework: unknown
  notes: The paper gives the relevant scalar potential, soft splitting terms, trilinear scalar couplings,
    and effective Yukawa terms to electrons and muons. It does not present a UV completion of the effective
    lepton operators.
