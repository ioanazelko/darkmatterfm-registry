  regimes:
  - m_DM around O(100 MeV) with keV-scale splitting
  - light mediator coupled mainly to electrons and muons
  - added Z3 scalar depleted below O(10^-3) of the relic density
observables:
- caveats:
  - The XENON1T excess is treated as a historical anomaly; no likelihood was rerun.
  channel: direct_detection
  effect_direction: spectral_line
  environments:
  - XENON1T detector
  - local Milky Way halo
  id: obs_scalar_xenon1t_electron_recoil
  key_quantities:
  - description: Mass splitting needed for the electron recoil energy.
    name: scalar mass splitting
    range: order keV; about 2 keV preferred by source discussion
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: delta_m
    unit: keV
  - description: Dark scalar mass; source prefers a few hundred MeV to a few GeV.
    name: light scalar dark matter mass
    range: few hundred MeV to few GeV
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: m_phi
  - description: Mediator coupling driving down-scattering.
    name: inelastic coupling
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: g_12
  linked_constraints:
  - con_xenon1t_recoil_profile
  linked_routes:
  - route_scalar_inelastic_relic_precision
  name: Inelastic scalar down-scattering electron recoil spectrum
  notes: null
  observability: high
  predicted_effect: A keV-scale splitting between scalar components lets inelastic down-scattering on
    electrons produce the 1-5 keV recoil profile, with the source emphasizing a peak around 2 keV.
  redshift_range: z=0 direct detection
  relevance: critical
  scale_range: electron recoil energies 1-5 keV
  source_reference_ids:
  - arxiv:2007.08205
  - arxiv:2006.12461
  - arxiv:2006.15672
  subchannel: XENON1T electron recoils
- caveats:
  - Collider/visible-decay constraints depend on mediator branching ratios.
  channel: precision_laboratory
  effect_direction: rate_change
  environments:
  - muon g-2 experiments
  id: obs_scalar_muon_gminus2
  key_quantities:
  - description: Effective scalar coupling to muons.
    name: muon Yukawa coupling
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: y_mu
  - description: Mediator mass entering the loop expression.
    name: scalar mediator mass
    range: 0.2-3 GeV region discussed for visible constraints
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: m_s
    unit: GeV
  - description: Source discrepancy target.
    name: muon anomaly
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: Delta a_mu
    value: (261 +/- 63 +/- 48) x 1e-11
  linked_constraints:
  - con_muon_gminus2_yukawa_band
  linked_routes:
  - route_scalar_inelastic_relic_precision
  name: Scalar-mediator contribution to muon g-2
  notes: null
  observability: high
  predicted_effect: The leptophilic scalar mediator gives a one-loop positive contribution to the muon
    anomalous magnetic moment, selecting a band in the y_mu - m_s parameter plane.
  redshift_range: not_applicable
  relevance: high
  scale_range: GeV-scale mediator
  source_reference_ids:
  - arxiv:2007.08205
  subchannel: muon anomalous magnetic moment
- caveats:
  - No relic-density or CMB likelihood was rerun.
  channel: cosmology
  effect_direction: rate_change
  environments:
  - early Universe
  - CMB energy-injection epoch
  id: obs_scalar_relic_cmb_branching
  key_quantities:
  - description: Thermal annihilation scale discussed for relic abundance and CMB injection.
    name: annihilation cross section
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: <sigma v>
    unit: cm^3 s^-1
    value: about 1e-26
  - description: Branching ratio to visible particles constrained by CMB energy injection.
    name: visible branching fraction
    range: less than about 1e-2 (m_phi/1 GeV)
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: Br(phi -> SM)
  - description: Process controlling the added scalar relic fraction.
    name: Z3 scalar semi-annihilation rate
    role: core
    source_reference_ids:
    - arxiv:2007.08205
    status: inferred
    symbol: semi-annihilation
  linked_constraints:
  - con_cmb_visible_branching
  - con_relic_semiannihilation
  linked_routes:
  - route_scalar_inelastic_relic_precision
  name: Thermal relic abundance with suppressed visible annihilation
  notes: null
  observability: medium
  predicted_effect: The same scalar sector can set the relic abundance, but CMB energy-injection constraints
    require suppressing mediator decays to Standard Model particles; an added Z3 scalar allows semi-annihilation
    and invisible/dark decays.
  redshift_range: freeze-out through recombination
  relevance: high
  scale_range: homogeneous cosmological abundance
  source_reference_ids:
  - arxiv:2007.08205
  subchannel: thermal relic and CMB energy injection
constraints:
- allowed_regions:
  - KeV-scale splitting with light scalar DM can reproduce the 1-5 keV electron-recoil excess profile.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'yes'
    description: The XENON1T low-energy electron-recoil excess is interpreted as a dark-matter signal.
    id: xenon1t-excess-signal
    impact_if_violated: If the excess is background or disappears, this observable becomes a null constraint
      rather than a target.
    scope: direct detection fit
    source_reference_ids:
    - arxiv:2007.08205
    - arxiv:2006.12461
    status: assumed
  benchmark_implications:
  - The inelastic coupling g_12 is central to the direct-detection signal.
  caveats:
  - The anomaly is historical and was not statistically reanalyzed.
  constrained_parameters:
  - delta_m
  - m_phi
  - g_12
  - y_e
  - sigma_e
  constraint_type: direct_detection
  data_release: XENON1T electron recoil excess as used by the source
  excluded_regions:
  - Elastic or too-heavy dark matter scenarios fail to reproduce the low-energy recoil profile in the
    source discussion.
  id: con_xenon1t_recoil_profile
  likelihood_available: 'no'
  likelihood_reference: null
  name: XENON1T electron-recoil profile fit
  notes: null
  observable_channel: electron recoils
  recasting_needed: 'yes'
  robustness: low
  source_reference_ids:
  - arxiv:2007.08205
  - arxiv:2006.12461
  - arxiv:2006.15672
- allowed_regions:
  - The source reports a y_mu - m_s band consistent with Delta a_mu=(261 +/- 63 +/- 48) x 1e-11, with
    visible-search limits having little bearing under the source branching assumptions.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: partial
    description: Visible-search limits are weakened because the mediator dominantly decays to dark scalars
      when kinematically allowed.
    id: mediator-branching
    impact_if_violated: If visible branching ratios are large, e+e- constraints on y_mu/y_e strengthen.
    scope: laboratory constraints
    source_reference_ids:
    - arxiv:2007.08205
    status: assumed
  benchmark_implications:
  - Muon g-2 and XENON1T can be addressed within the same three-scalar setup.
  caveats:
  - No current g-2 world-average update was applied.
  constrained_parameters:
  - y_mu
  - m_s
  constraint_type: laboratory
  data_release: Muon g-2 discrepancy used by the source
  excluded_regions:
  - Couplings outside the one-loop band do not explain the muon g-2 discrepancy.
  id: con_muon_gminus2_yukawa_band
  likelihood_available: 'no'
  likelihood_reference: null
  name: Muon g-2 scalar-mediator band
  notes: null
  observable_channel: precision_laboratory
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:2007.08205
- allowed_regions:
  - Visible branching fraction below roughly 1e-2 (m_phi/1 GeV), implemented through an enlarged dark
    sector, can evade the source CMB concern.
  applies: 'yes'
  assumptions:
  - can_be_relaxed: partial
    description: The source p_ann argument maps annihilation energy injection to the Planck CMB bound.
    id: planck-pann-mapping
    impact_if_violated: Different deposition efficiencies or branching fractions alter the limit.
    scope: CMB energy injection
    source_reference_ids:
    - arxiv:2007.08205
    status: assumed
  benchmark_implications:
  - The exact Z3 scalar is introduced to keep visible energy injection small while preserving relic-density
    depletion.
  caveats:
  - No CMB likelihood or deposition-efficiency calculation was rerun.
  constrained_parameters:
  - <sigma v>
  - m_phi
  - Br(phi -> SM)
  - p_ann
  constraint_type: cosmological
  data_release: Planck p_ann limit quoted by source
  excluded_regions:
  - Prompt mediator decay to e+e- with thermal annihilation cross section conflicts with CMB energy-injection
    constraints.
  id: con_cmb_visible_branching
  likelihood_available: 'no'
  likelihood_reference: null
  name: CMB energy-injection bound on visible mediator decays
  notes: null
  observable_channel: cmb
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:2007.08205
- allowed_regions:
  - Semi-annihilation of the Z3 scalar helps make its relic component subdominant while the main scalar
    components provide the required abundance.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: partial
    description: The Z3 symmetry remains exact and the added scalar does not acquire a vacuum expectation
      value.
    id: z3-sector-stability
    impact_if_violated: Breaking Z3 or changing the spectrum changes stability and relic fractions.
    scope: dark-sector relic density
    source_reference_ids:
    - arxiv:2007.08205
    status: assumed
  benchmark_implications:
  - The three-scalar economy is retained only with dark-sector branching and semi-annihilation choices.
  caveats:
  - Relic density was not recomputed.
  constrained_parameters:
  - semi-annihilation couplings
  - m_phi
  - m_Z3 scalar
  - g_ij
  constraint_type: cosmological
  data_release: Planck relic abundance as source context
  excluded_regions:
  - Without the added dark-sector depletion channels, the source scenario can conflict with CMB or abundance
    requirements.
  id: con_relic_semiannihilation
  likelihood_available: 'no'
  likelihood_reference: null
  name: Relic-density control through Z3 scalar semi-annihilation
  notes: null
  observable_channel: dark matter abundance
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:2007.08205
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - The direct-detection signal target is a historical XENON1T excess, not a confirmed discovery.
    constraint_ids:
    - con_xenon1t_recoil_profile
    - con_muon_gminus2_yukawa_band
    - con_cmb_visible_branching
    - con_relic_semiannihilation
    derived_quantities:
    - electron recoil spectrum
    - Delta a_mu
    - thermal relic density
    - p_ann
    - visible branching fraction
    description: Connect the three-scalar spectrum and leptophilic mediator to XENON1T electron recoils,
      muon g-2, relic abundance, and CMB energy injection.
    forward_model_chain:
    - inputs:
      - delta_m
      - m_phi
      - g_12
      - y_e
      - halo velocity distribution
      notes: null
      outputs:
      - differential electron recoil rate
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Heavy-mediator and Maxwellian halo assumptions in source.
    - inputs:
      - y_mu
      - m_s
      notes: null
      outputs:
      - Delta a_mu
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: One-loop scalar mediator contribution.
    - inputs:
      - annihilation and semi-annihilation rates
      - dark-sector branching fractions
      notes: Not run in this batch.
      outputs:
      - relic density
      - visible energy injection
      step_id: s3
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Needed for precise abundance/CMB recast.
    - inputs:
      - recoil spectrum
      - XENON1T data
      - CMB p_ann limit
      notes: null
      outputs:
      - allowed parameter region
      step_id: s4
      step_type: likelihood
      tool_or_code: null
      validity: Requires public or reconstructed likelihoods.
    id: route_scalar_inelastic_relic_precision
    input_parameters:
    - m_phi
    - delta_m
    - m_s
    - g_12
    - y_mu
    - y_e
    - semi-annihilation couplings
    likelihoods:
    - XENON1T electron recoil likelihood
    - muon g-2 Gaussian target
    - Planck p_ann bound
    - thermal relic-density target
    observable_ids:
    - obs_scalar_xenon1t_electron_recoil
    - obs_scalar_muon_gminus2
    - obs_scalar_relic_cmb_branching
    required_code_resources:
    - direct-detection electron-ionization calculator
    - relic-density solver with semi-annihilation
    - CMB energy-injection recast
    route_status: planned
    source_model_features:
    - nearly degenerate scalar DM components
    - keV inelastic splitting
    - leptophilic scalar mediator
    - Z3 scalar for dark-sector branching
    - semi-annihilation
    validation_tests:
    - recover 1-5 keV recoil spectrum with around 2 keV peak
    - recover g-2 y_mu-m_s band
    - recover visible branching requirement below about 1e-2 (m_phi/1 GeV)
