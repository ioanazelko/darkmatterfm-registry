  - three-extra-scalar XENON1T dark matter scenario
  short_description: A simplified dark-sector model with a nearly degenerate complex scalar dark matter
    pair, a light leptophilic scalar mediator, and an additional Z3-stabilized scalar introduced to obtain
    the relic abundance while evading late-time energy injection.
  historical_origin_or_motivation: Introduced in the paper to simultaneously address the muon anomalous
    magnetic moment, the reported XENON1T electron-recoil excess through inelastic down-scattering, and
    the dark matter relic abundance.
  status: speculative
  model_kind: simplified_model
