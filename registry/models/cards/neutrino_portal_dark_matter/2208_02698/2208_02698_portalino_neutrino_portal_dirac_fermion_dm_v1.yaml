theory_to_observable_routing:
  routes:
  - agent_notes: The primary paper implements the relic scan but not a reusable public end-to-end recast.
    caveats:
    - Full neutrino flavor model is parameterized rather than specified.
    constraint_ids:
    - con_relic_target
    - con_higgs_portal_direct_detection
    - con_bbn_cmb_portalino
    - con_fermi_dwarf_gamma
    derived_quantities:
    - Omega_X h^2
    - Portalino lifetime
    - spin-independent cross section
    - late-time annihilation rate and cascade spectrum
    description: Propagate Portalino-model parameters from thermal freeze-out to direct, cosmological,
      and indirect observables.
    forward_model_chain:
    - inputs:
      - particle spectrum
      - couplings
      notes: Primary paper reports micrOMEGAs relic calculations.
      outputs:
      - Omega_X h^2
      step_id: s1
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs model implementation
      validity: Valid for the simplified model implemented by the paper.
    - inputs:
      - m_n
      - mixing
      - decoupling temperature
      notes: Used to identify BBN/CMB exposure.
      outputs:
      - tau_n
      - Delta N_eff
      step_id: s2
      step_type: analytic_formula
      tool_or_code: Portalino lifetime and N_eff estimates
      validity: Approximate; sensitive to decay channels and thermal history.
    - inputs:
      - cross sections
      - cascade spectra
      notes: Fermi cascade recast not fully implemented here.
      outputs:
      - excluded or allowed benchmark flags
      step_id: s3
      step_type: recasting
      tool_or_code: direct-detection and Fermi-LAT comparisons
      validity: Needs experiment-specific likelihoods for production use.
    id: route_freezeout_to_searches
    input_parameters:
    - m_X
    - m_n
    - m_A_d
    - g
    - lambda_X
    - lambda_Hphi
    - active-Portalino mixing
    likelihoods:
    - Planck/N_eff likelihood if recast
    - Fermi-LAT dSph likelihood or tabulated limits
    - direct-detection SI limit curves
    observable_ids:
    - obs_thermal_relic_resonance
    - obs_higgs_portal_direct_detection
    - obs_portalino_lifetime_neff
    - obs_cascade_gamma_rays
    required_code_resources:
    - micrOMEGAs
    - Portalino decay calculator
    - Fermi-LAT dwarf likelihood or validated limit tables
    route_status: partially_implemented
    source_model_features:
    - Z3-stabilized Dirac fermion X
    - hidden U(1)_d vector and Portalino states
    - Higgs and neutrino portals
    validation_tests:
    - reproduce primary relic-density resonance plots
    - check BBN-before-decay boundary
    - compare standard-channel Fermi-LAT limits before cascade recast
