  likelihood_reference: null
  name: LHC and LEP B-L gauge-boson exclusions
  notes: null
  observable_channel: dilepton/Zprime
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - src_2312_06777_primary
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - Needs a current-data recast for production use.
    constraint_ids:
    - con_planck_neff
    - con_bbn_neff
    derived_quantities:
    - Delta N_eff
    - relic abundance
    description: Evolve phi_1, chi, and right-handed-neutrino abundances to predict thermal plus nonthermal
      Delta N_eff.
    forward_model_chain:
    - inputs:
      - interaction rates
      - initial thermal abundances
      notes: Primary paper gives the coupled abundance equations.
      outputs:
      - Y_phi1
      - Y_chi
      - rho_nuR
      step_id: s1
      step_type: boltzmann_solver
      tool_or_code: custom Boltzmann equations from primary paper
      validity: valid for the paper benchmark assumptions
    - inputs:
      - Delta N_eff
      notes: No public likelihood packaged here.
      outputs:
      - Planck/BBN pass-fail
      step_id: s2
      step_type: likelihood
      tool_or_code: null
      validity: uses quoted bounds
    id: route_neff_boltzmann
    input_parameters:
    - m_Zprime
    - g_BL
    - m_phi1
    - lambda_H_phi1
    - y_phi1
    - m_chi
    likelihoods:
    - Planck/BBN quoted bounds
    observable_ids:
    - obs_neff_rhnu
    required_code_resources:
    - Boltzmann solver implementation
    - current CMB likelihood for recast
    route_status: planned
    source_model_features:
    - gauged B-L portal
    - phi_1 freeze-out and decay
    - light Dirac neutrinos
    validation_tests:
    - reproduce figures for Delta N_eff contours
    - check relic density Omega h^2 near 0.12
  - agent_notes: null
    caveats:
    - FSL alone is a compressed proxy for structure data.
    constraint_ids:
    - con_structure_fsl
    derived_quantities:
    - lambda_FSL
    - transfer_function
    description: Map the nonthermal DM distribution to free-streaming length and small-scale-structure
      limits.
    forward_model_chain:
    - inputs:
      - momentum distribution
      - m_chi
      notes: The paper uses FSL as the structure diagnostic.
      outputs:
      - lambda_FSL
      step_id: s1
      step_type: analytic_formula
      tool_or_code: appendix formulae in primary paper
      validity: approximate
    - inputs:
      - lambda_FSL
      notes: A Lyman-alpha transfer-function likelihood would be stronger.
      outputs:
      - allowed/disfavoured structure region
      step_id: s2
      step_type: recasting
      tool_or_code: null
      validity: qualitative without full likelihood
    id: route_free_streaming
    input_parameters:
    - m_chi
    - production_temperature
    - distribution_function
    likelihoods:
    - Lyman-alpha recast required
    observable_ids:
    - obs_free_streaming
    required_code_resources:
    - Boltzmann hierarchy or transfer-function emulator
    route_status: planned
    source_model_features:
    - FIMP production from phi_1 decays
    - light dark matter
    validation_tests:
    - compare lambda_FSL with paper appendix values
  - agent_notes: null
    caveats:
    - The primary paper does not publish a likelihood grid.
    constraint_ids:
    - con_zprime_lhc_lep
    derived_quantities:
    - dilepton cross section
    - m_Zprime/g_BL
    description: Overlay published Zprime collider exclusions on the B-L portal parameter plane.
    forward_model_chain:
    - inputs:
      - m_Zprime
      - g_BL
      notes: Use ATLAS/CMS/LEP exclusions quoted by the primary paper.
      outputs:
      - collider exclusion mask
      step_id: s1
      step_type: recasting
      tool_or_code: null
      validity: approximate without detector recast
    id: route_zprime_recast
    input_parameters:
    - m_Zprime
    - g_BL
    likelihoods:
    - published collider limits
    observable_ids:
    - obs_zprime_collider
    required_code_resources:
    - Zprime collider recast
    route_status: planned
    source_model_features:
    - B-L gauge boson
    - SM fermion B-L charges
    validation_tests:
    - recover the excluded region shown in the paper
