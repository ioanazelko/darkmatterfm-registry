identity:
  name: Dark matter from early decays
  family: decay_produced_dark_matter
  aliases:
  - DDM -> DM + L decay model
  - early-decay warm dark matter
  short_description: A nonthermal dark matter scenario in which the present dark matter daughter is produced
    by decays of a heavier neutral parent particle with lifetime of order days to a year or smaller, giving
    the daughter a primordial velocity dispersion and a small-scale power cutoff.
  historical_origin_or_motivation: Motivated in the paper by gravitino LSP scenarios where a WIMP/NLSP
    decays gravitationally, and by the possibility of reducing small-scale CDM substructure.
  status: speculative
  model_kind: phenomenological_parameterization
