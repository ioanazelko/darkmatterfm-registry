    remain viable in the primary discussion.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'yes'
    description: The reionization statement uses semi-analytic collapsed-fraction modeling rather than
      a full radiation-hydrodynamic calculation.
    id: semi-analytic-reionization
    impact_if_violated: A full model can change the excluded region.
    notes: null
    scope: reionization consistency
    source_reference_ids:
    - arxiv:astro-ph/0507300
    status: approximate
  benchmark_implications:
  - Small values of Q can help create cores and reduce substructure but increase reionization pressure.
  caveats:
  - Astrophysical source efficiency and feedback are nuisance uncertainties.
  constrained_parameters:
  - Q
  - alpha_c
  - tau
  - p_CM
  constraint_type: astrophysical
  data_release: null
  excluded_regions:
  - Scenarios that suppress early halo formation too strongly can fail the requirement that the universe
    be reionized by z about 6.
  id: con_decay_substructure_reionization
  likelihood_available: 'no'
  likelihood_reference: null
  name: Small-halo benefit versus reionization timing
  notes: null
  observable_channel: small_scale_structure
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:astro-ph/0507300
- allowed_regions:
  - Related gravitino-LSP studies find viable NLSP/gravitino regions after applying CMB and BBN decay
    constraints.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'yes'
    description: BBN/CMB limits depend on the visible branching fractions and NLSP identity.
    id: visible-products-model-dependent
    impact_if_violated: Changing the decay channel changes the strength of the bound.
    notes: null
    scope: early-universe energy injection
    source_reference_ids:
    - arxiv:astro-ph/0507300
    - arxiv:hep-ph/0404231
    status: assumed
  benchmark_implications:
  - A neutral or dominantly invisible decay channel is easier to keep viable.
  caveats:
  - No BBN network or spectral-distortion likelihood was rerun in this batch.
  constrained_parameters:
  - tau
  - visible branching fraction
  - parent relic abundance
  constraint_type: cosmological
  data_release: null
  excluded_regions:
  - Visible electromagnetic or hadronic products large enough to spoil light-element abundances or the
    CMB blackbody are excluded.
  id: con_decay_bbn_cmb_reionization
  likelihood_available: 'no'
  likelihood_reference: null
  name: Visible-decay BBN and CMB consistency
  notes: null
  observable_channel: bbn_cmb
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:astro-ph/0507300
  - arxiv:hep-ph/0404231
theory_to_observable_routing:
  routes:
  - agent_notes: Primary-paper observables are clear, but modern constraints require a dedicated nonthermal
      recast.
    caveats:
    - Baryonic feedback and source-efficiency uncertainties are substantial.
    constraint_ids:
    - con_decay_lss_wdm_equivalent
    - con_decay_substructure_reionization
    - con_decay_bbn_cmb_reionization
    derived_quantities:
    - daughter f(p)
    - alpha_c
    - Q
    - matter transfer function
    - collapsed fraction
    - halo concentration response
    description: Map early parent decays into a daughter phase-space distribution, matter transfer function,
      and small-structure/reionization observables.
    forward_model_chain:
    - inputs:
      - M
      - m
      - p_CM
      - tau
      notes: null
      outputs:
      - daughter momentum distribution
      - Q
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Primary paper gives analytic nonthermal distribution for the decay case.
    - inputs:
      - f(p)
      - tau
      - cosmological parameters
      notes: null
      outputs:
      - linear matter power spectrum
      step_id: s2
      step_type: boltzmann_solver
      tool_or_code: CAMB/CLASS-style transfer solver
      validity: Needed for a modern WDM/Ly-alpha recast; not run here.
    - inputs:
      - matter power spectrum
      - source-efficiency assumptions
      notes: null
      outputs:
      - reionization redshift
      - collapsed fraction
      step_id: s3
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Useful for reproducing the primary reionization consistency test.
    - inputs:
      - transfer function
      - daughter velocity distribution
      notes: null
      outputs:
      - subhalo abundance
      - halo density profiles
      step_id: s4
      step_type: simulation
      tool_or_code: null
      validity: Needed for robust dwarf-scale predictions.
    id: route_decay_to_structure
    input_parameters:
    - tau
    - M
    - m
    - p_CM
    - parent abundance
    - visible branching fraction
    likelihoods:
    - Ly-alpha likelihood unavailable in this batch
    - BBN/CMB energy-injection likelihood not rerun
    observable_ids:
    - obs_decay_power_cutoff
    - obs_decay_halo_substructure
    - obs_decay_energy_injection
    required_code_resources:
    - Boltzmann solver accepting nonthermal f(p)
    - halo/subhalo simulation or emulator
    - reionization semi-analytic module
    route_status: planned
    source_model_features:
    - neutral parent DDM -> stable DM + light daughter
    - nonthermal daughter momentum
    - finite primordial phase-space density
    validation_tests:
    - Recover alpha_c about 0.1 h^-1 Mpc comparison to 1 keV WDM variance
    - Check reionization by z about 6 for benchmark choices
