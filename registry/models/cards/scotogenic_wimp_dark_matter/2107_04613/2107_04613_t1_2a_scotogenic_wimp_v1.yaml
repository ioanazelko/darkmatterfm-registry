  dark_matter_candidate:
    name: 'lightest Z2-odd neutral state: chi_1^0, eta_1^0, or A^0'
    spin: 0 or 1/2
    statistics: unknown
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - Weyl fermion doublets psi_1 and psi_2
  - Weyl fermion singlet F
  - scalar doublet eta
  - real scalar singlet S
  - charged scalar eta^+
  - charged fermion psi^+-
  mediators:
  - Higgs boson
  - electroweak gauge bosons
  - heavier Z2-odd scalars and fermions
  dark_radiation_species: []
  excited_or_degenerate_states:
  - second neutral fermion and charged fermion nearly degenerate with doublet-like fermion dark matter
  long_lived_particles: []
  unstable_parent_particles:
  - heavier Z2-odd fermions and scalars
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 mirror symmetry makes all new fields odd and Standard Model fields
    even, stabilizing the lightest Z2-odd particle.
  symmetries:
  - name: Z2 mirror symmetry
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the dark-matter analysis
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - vector
  standard_model_targets:
  - Higgs doublet
  - Standard Model lepton doublets
  - right-handed charged leptons
  - electroweak gauge bosons
  dark_sector_couplings:
  - scalar-potential couplings among H, eta, and S
  - Yukawa couplings y_1 and y_2 mixing singlet and doublet fermions with the Higgs
  - lepton-sector couplings g_Psi, g_F, and g_R
  mediator_types:
  - scalar
