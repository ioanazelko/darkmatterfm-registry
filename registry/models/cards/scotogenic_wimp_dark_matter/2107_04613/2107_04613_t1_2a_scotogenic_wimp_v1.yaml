    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - pair annihilation of the lightest Z2-odd state
  - coannihilation with nearly degenerate Z2-odd fermions in the doublet-dominated fermion regime
  decay_channels:
  - heavier Z2-odd states decay to Standard Model particles plus missing energy when kinematically allowed
  self_scattering_channels: []
  cp_structure: The scalar sector contains CP-even and CP-odd neutral scalars eta_1^0 and A^0.
  flavor_structure: Couplings g_Psi and g_F are tied to neutrino masses through a Casas-Ibarra parametrization;
    g_R affects charged-lepton flavor observables.
  tree_or_loop_level: both
