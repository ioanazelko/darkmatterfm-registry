identity:
  name: T1-2A scotogenic WIMP dark matter model
  family: scotogenic_wimp_dark_matter
  aliases:
  - T1-2A scotogenic framework
  short_description: A Z2-odd scotogenic extension of the Standard Model with two Weyl fermion doublets,
    a Weyl fermion singlet, a scalar doublet, and a real scalar singlet; the lightest neutral Z2-odd scalar
    or fermion is a WIMP dark matter candidate while neutrino masses are generated radiatively.
  historical_origin_or_motivation: The model links the unexplained cold dark matter abundance to loop-induced
    Majorana neutrino masses.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - scotogenic model
  - radiative neutrino mass
  - WIMP dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes scalar, fermion, and lepton-interaction Lagrangian terms and implements the
    T1-2A model for one-loop spectrum and relic-density calculations.
