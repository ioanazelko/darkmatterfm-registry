  short_description: A thermal composite scalar dark matter model in which the Higgs and dark matter scalar
    are pseudo-Nambu-Goldstone bosons of an SO(6)/SO(5) composite sector, with Higgs-portal and derivative
    interactions controlling relic abundance and searches.
  historical_origin_or_motivation: The paper explores composite rather than fundamental thermal dark matter,
    motivated by tying both the Higgs and dark matter scalar to strong dynamics and pseudo-Nambu-Goldstone
    structure.
  status: speculative
  model_kind: effective_field_theory
