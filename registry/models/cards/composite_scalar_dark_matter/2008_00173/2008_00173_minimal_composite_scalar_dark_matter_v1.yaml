  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes an effective Lagrangian for the pseudo-Nambu-Goldstone Higgs and CSDM fields
    after decoupling other composite-sector freedoms.
