  short_description: A warm dark matter variant of Ma's radiative seesaw model in which the lightest Z_2-odd
    Majorana fermion N_1 has keV-scale mass, is thermally produced, and its overabundance is diluted by
    out-of-equilibrium N_2 decay through a virtual inert scalar.
  historical_origin_or_motivation: Developed to realize warm dark matter in the radiative seesaw model
    without adding an extra entropy-producing singlet particle.
  status: speculative
  model_kind: simplified_model
