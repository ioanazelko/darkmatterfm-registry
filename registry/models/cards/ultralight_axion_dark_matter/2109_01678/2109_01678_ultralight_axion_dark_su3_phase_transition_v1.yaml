- id: con_dark_neff_glueball
  name: Dark radiation and glueball overclosure constraints
  constraint_type: cosmological
  observable_channel: Delta N_eff and late dark glueballs
  applies: 'yes'
  constrained_parameters:
  - T_d/T
  - Delta N_eff
  - m_dGB
  - Lambda_a
  excluded_regions:
  - Dark sectors hotter than the quoted T_d/T scale can overproduce Delta N_eff; stable dark glueballs
    would overclose or behave as unwanted dark matter.
  allowed_regions:
  - The primary estimate requires T_d about 0.36 T or cooler and a mechanism for dark glueballs to decay
    or annihilate.
  benchmark_implications:
  - The dark sector must be colder than the SM before BBN/CMB and cannot leave stable glueballs unless
    they are part of the intended relic inventory.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: Primary paper Delta N_eff and glueball discussion
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: cool-decoupled-dark-sector
    description: The dark SU(3)d sector decoupled early enough to be cooler than the Standard Model plasma.
    scope: Delta N_eff
    status: assumed
    impact_if_violated: A hotter sector violates radiation-density bounds.
    can_be_relaxed: partial
    source_reference_ids:
    - '2109_01678'
    notes: null
  - id: glueball-disposal
    description: Dark glueballs decay or annihilate efficiently after confinement.
    scope: post-transition relics
    status: assumed
    impact_if_violated: Stable glueballs dominate the energy density as an unintended component.
    can_be_relaxed: 'no'
    source_reference_ids:
    - '2109_01678'
    notes: null
  caveats:
  - The glueball decay channel is not specified in the primary model card.
  source_reference_ids:
  - '2109_01678'
  notes: null
theory_to_observable_routing:
  routes:
  - id: route_dark_su3_axion_pbh
    description: Tie the dark SU(3)d confinement scale to ultralight-axion mass, primordial SMBH formation,
      N_eff/glueball constraints, and phase-transition GWs.
    source_model_features:
    - dark SU(3)d confining first-order phase transition
    - ultralight axion coupled to dark gluons
    - cold decoupled dark sector
    input_parameters:
    - Lambda_a
    - f_a
    - T_d/T
    - transition strength
    - initial misalignment
    derived_quantities:
    - m_a
    - Omega_a
    - PBH/SMBH mass scale
    - Delta N_eff
    - Omega_GW(f)
    forward_model_chain:
    - step_id: axion_mass_abundance
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - Lambda_a
      - f_a
      - initial misalignment
      outputs:
      - m_a
      - Omega_a
      validity: valid for misalignment-dominated axion production
      notes: null
    - step_id: phase_transition_pbh
      step_type: semi_analytic_model
      tool_or_code: null
      inputs:
      - T_d
      - transition dynamics
      outputs:
      - SMBH-seed mass scale
      validity: phenomenological; collapse simulation not included
      notes: null
    - step_id: radiation_gw_constraints
      step_type: recasting
      tool_or_code: null
      inputs:
      - T_d/T
      - transition strength
      - beta/H
      - m_dGB
      outputs:
      - Delta N_eff
      - GW spectrum
      - glueball viability
      validity: requires model-specific transition calculation
      notes: null
    observable_ids:
    - obs_dark_su3_smbh_pbh
    - obs_ultralight_axion_structure
    - obs_dark_phase_transition_gw
    constraint_ids:
    - con_ula_lya_mass
    - con_dark_neff_glueball
    likelihoods: []
    required_code_resources:
    - ULA transfer-function calculation
    - dark phase-transition GW calculator
    - Delta N_eff module
    validation_tests:
    - recover m_a near 10^-20 eV for Lambda_a near 10 keV
    - check T_d/T about 0.36 bound
    route_status: planned
    agent_notes: null
    caveats:
    - The FOPT and glueball-disposal assumptions control viability.
