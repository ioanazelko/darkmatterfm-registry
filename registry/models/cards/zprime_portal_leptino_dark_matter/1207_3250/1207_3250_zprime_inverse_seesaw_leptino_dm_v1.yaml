parameters:
  core:
  - name: dark matter mass
    symbol: M_S2
    description: Mass of the lightest odd leptino after U(1) breaking.
    value: O(1) TeV; resonant cases require about half the mediator mass
    role: core
    status: inferred
    source_reference_ids: []
  - name: Z-prime mass
    symbol: M_Zprime
    description: Mass of the new gauge boson that can mediate resonant annihilation.
    value: multi-TeV; paper discusses 2 TeV examples and upper reach around 3.5-5.0 TeV depending on gauge
      mixing
    unit: TeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: heavy Higgs mass
    symbol: M_H2
    description: Mass of the scalar associated with U(1) breaking and heavy-Higgs resonance annihilation.
    value: up to about 1.8-3.0 TeV in example resonant regions
    unit: TeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: U(1) breaking vacuum expectation value
    symbol: v_prime
    description: Singlet scalar VEV setting heavy-neutrino, S2, and Z-prime masses.
    value: TeV scale; example v_prime = 15 TeV in neutrino benchmark
    unit: TeV
    role: core
    status: assumed
    source_reference_ids: []
  - name: B-L gauge coupling
    symbol: g_BL
    description: Gauge coupling controlling Z-prime annihilation and collider reach.
    value: example viable Z-prime resonance around g_BL between 0.21 and 0.33 for M_Zprime = 2 TeV and
      g_2 = 0
    role: core
    status: inferred
    source_reference_ids: []
  - name: gauge mixing coupling
    symbol: g_2
    description: Gauge mixing between hypercharge and the extra U(1); a width-minimizing value is derived.
    value: g_2 = 0 or g_2_min = -10/13 g_BL for one leptino generation
    role: core
    status: inferred
    source_reference_ids: []
  - name: S2 Yukawa coupling
    symbol: y_s2
    description: Yukawa coupling giving M_S2 after U(1) breaking.
    value: M_S2 = sqrt(2) y_s2 v_prime in the paper notation
    role: core
    status: inferred
    source_reference_ids: []
