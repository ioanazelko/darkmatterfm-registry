identity:
  name: Z-prime inverse-seesaw odd leptino dark matter
  family: zprime_portal_leptino_dark_matter
  aliases:
  - leptonic dark matter
  - odd S2 leptino dark matter
  - minimal Z-prime inverse seesaw dark matter
  short_description: Renormalizable minimal Z-prime extension with fractional-lepton-number singlet fermions;
    an unbroken Z2 makes the lightest odd leptino S2 stable, and its thermal relic abundance is obtained
    through resonant Z-prime or heavy-Higgs annihilation.
  historical_origin_or_motivation: Designed to connect inverse-seesaw neutrino masses, a stable dark matter
    candidate, and possible resonant leptogenesis in a natural renormalizable U(1) extension.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - minimal Z-prime model
  - U(1) extension coupled to hypercharge and B-L
  - inverse seesaw neutrino mass mechanism
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper presents gauge, scalar, and Yukawa sectors with all renormalizable terms allowed by
    the charge assignments and Z2 symmetry.
particle_content:
  dark_matter_candidate:
    name: lightest odd leptino S2
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
