  unstable_parent_particles:
  - heavier leptinos in multi-generation extensions
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An unbroken Z2 symmetry makes S2 odd while ordinary Standard Model fields and
    S1 are even; the lightest odd S2 state is stable on cosmological timescales.
  symmetries:
  - name: Z2 parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the dark matter construction
    breaking_scale: null
  - name: U(1) gauge extension related to B-L and hypercharge
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the new singlet scalar vacuum expectation value v_prime
    breaking_scale:
      name: U(1) breaking scale
      symbol: v_prime
      description: Singlet scalar vacuum expectation value setting the Z-prime and S2 masses.
      value: TeV scale; example 15 TeV
      role: core
      status: assumed
      source_reference_ids: []
  topological_defects_possible: unknown
