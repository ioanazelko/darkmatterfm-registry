  family: singlino_neutralino_dark_matter
  aliases:
  - sNMSSM singlino LSP benchmark lines
  - NMSSM with additional bino-singlino cascade
  short_description: A semi-constrained NMSSM benchmark construction with similar squark, slepton, and
    gaugino spectra to cMSSM points but with an additional singlino-like neutralino LSP that changes cascade
    decays and can serve as a dark matter candidate only in suitable relic-density histories or resonance
    regions.
  historical_origin_or_motivation: The paper uses the NMSSM singlet superfield to add a singlino-like
    neutralino below the bino-like neutralino and studies how this affects LHC supersymmetry searches
    relative to cMSSM benchmarks.
  status: benchmark
  model_kind: benchmark_mapping
