    paper focuses on N1 as the lightest odd state.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken
    breaking_scale: null
  - name: U(1)_L lepton number
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by the scalar singlet vacuum expectation value, yielding a Majoron
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - other
  standard_model_targets:
  - leptons
  - Higgs doublet
  - electroweak gauge bosons
  - heavy fermion final states through scalar mixing
  dark_sector_couplings:
  - Yukawa coupling of lepton doublets to eta and N
  - singlet coupling generating Majorana masses for N_i
  - scalar-potential mixing between the singlet and Higgs doublet
  mediator_types:
  - inert scalar doublet components
  - mixed CP-even scalars
  interaction_operators:
  - L eta N Yukawa interaction
  - singlet N N Majorana-mass-generating interaction
  - Higgs-singlet scalar mixing terms
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - N1 N1 to b bbar in the low-mass region
  - N1 N1 to electroweak gauge bosons in the high-mass region
  - N1 N1 to Majorons, required to be subdominant at freeze-out
  - t-channel annihilation through inert scalars
  decay_channels: []
  self_scattering_channels: []
  cp_structure: CP-even singlet-Higgs mixing and CP-odd Majoron sector are discussed; detailed CP phases
    are not extracted.
  flavor_structure: The numerical analysis assumes real diagonal Y^eta and Y^N matrices and fits neutrino
    oscillation data through the charged-lepton sector.
  tree_or_loop_level: both
