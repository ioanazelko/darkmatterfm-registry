identity:
  name: Scotogenic Majorana fermion dark matter with spontaneous lepton-number breaking
  family: radiative_neutrino_mass_fermion_dark_matter
  aliases:
  - fermion dark matter from spontaneous lepton number breaking
  - scotogenic Majorana fermion dark matter with Majoron
  short_description: A scotogenic extension in which the lightest Z2-odd Majorana fermion N1 is stable
    dark matter, Majorana masses arise from a lepton-number-carrying scalar singlet vev, and scalar singlet-Higgs
    mixing opens an s-channel annihilation portal below the TeV scale.
  historical_origin_or_motivation: The paper links loop-level neutrino mass generation to a fermion dark
    matter candidate and adds spontaneous lepton-number breaking to the scotogenic setup.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - scotogenic radiative neutrino mass model
  - spontaneously broken global lepton number
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the renormalizable SM x U(1)_L x Z2 invariant leptonic Lagrangian and scalar
    potential for the added singlet, inert doublet, and Majorana fermions.
particle_content:
  dark_matter_candidate:
    name: N1, the lightest Z2-odd Majorana fermion
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert scalar doublet eta
  - heavier Majorana fermions N2 and N3
  - lepton-number-carrying scalar singlet
  - Majoron J
  - extra CP-even scalar from singlet-Higgs mixing
