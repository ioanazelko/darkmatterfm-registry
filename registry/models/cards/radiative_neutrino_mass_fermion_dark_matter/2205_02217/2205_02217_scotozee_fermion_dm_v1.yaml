      - DM candidate
      - couplings
      notes: null
      outputs:
      - Omega h^2
      - dominant annihilation channels
      step_id: step_relic
      step_type: simulation
      tool_or_code: MicrOMEGAs
      validity: Standard thermal freeze-out.
