identity:
  name: Low-reheat Standard Model neutrino warm dark matter
  family: warm_dark_matter
  aliases:
  - Standard Model neutrinos as warm dark matter
  - low-reheat active neutrino WDM
  short_description: A nonstandard low-reheating cosmology in which active Standard Model tau or muon
    neutrinos never reach chemical equilibrium, leaving a suppressed number density that permits a keV-scale
    neutrino to behave as warm dark matter.
  historical_origin_or_motivation: Motivated by revisiting the usual hot-neutrino dark matter bound when
    the last radiation era may have started at a reheating temperature of only a few MeV.
  status: speculative
  model_kind: phenomenological_parameterization
