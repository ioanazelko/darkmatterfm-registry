  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Spontaneous U(1)_{B-L} breaking by an even-charged scalar leaves a residual Z_2^{B-L};
    the Q_{B-L}=8 fermion does not mix with the odd-charged fermions and is stable.
  symmetries:
  - name: U(1)_{B-L}
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the Q_{B-L}=2 scalar vev
    breaking_scale:
