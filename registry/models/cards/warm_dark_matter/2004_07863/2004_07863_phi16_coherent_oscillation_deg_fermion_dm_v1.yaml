  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the gauge symmetry, anomaly-canceling chiral fermions, B-L-breaking scalar, Yukawa
    terms, and Planck-suppressed operators that set the sub-keV fermion mass.
