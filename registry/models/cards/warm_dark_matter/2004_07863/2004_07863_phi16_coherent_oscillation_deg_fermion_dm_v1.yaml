      symbol: V_{B-L}
      range: (2-3) x 10^15
      unit: GeV
      role: core
      status: inferred
  - name: residual Z_2^{B-L}
    type: discrete
    exact_or_approximate: exact
    breaking: not described
    breaking_scale: null
  topological_defects_possible: unknown
