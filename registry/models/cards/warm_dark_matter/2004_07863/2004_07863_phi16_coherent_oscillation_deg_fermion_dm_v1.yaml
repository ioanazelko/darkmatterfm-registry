  - inflaton/SM reheating sector
  dark_sector_couplings:
  - y_* phi_16^* psi_8 psi_8
  - U(1)_{B-L} gauge interaction through A prime
  - Yukawa couplings of the Q_{B-L}=2 scalar to heavy right-handed neutrinos and heavy chiral fermions
  mediator_types:
  - B-L gauge boson
  - complex scalar mother particle
  - inflaton source field
  interaction_operators:
  - phi_16 -> psi_8 psi_8
