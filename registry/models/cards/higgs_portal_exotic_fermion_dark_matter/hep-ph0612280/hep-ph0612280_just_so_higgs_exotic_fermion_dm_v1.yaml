  short_description: A minimal effective Standard Model extension with two scalar electroweak doublets,
    two Weyl fermion doublets, and one Weyl fermion singlet, where an imposed parity leaves the lightest
    neutral exotic fermion stable but its calculated thermal relic abundance is too small for all of dark
    matter.
  historical_origin_or_motivation: The model is motivated by satisfying one-loop Veltman-like cancellations
    for the little hierarchy problem while adding a stable neutral exotic fermion that can be tested as
    a dark-matter candidate.
  status: speculative
  model_kind: effective_field_theory
