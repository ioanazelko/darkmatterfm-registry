theory_to_observable_routing:
  routes:
  - id: route_model3_dark_loops
    description: Route Model 3 from Z2-odd loop particles to flavor observables, relic abundance, and
      direct detection.
    source_model_features:
    - Z2-odd scalar SU(2)L doublets
    - vectorlike singlet fermion
    - Yukawa couplings to quarks and leptons
    - Higgs portal scalar potential
    input_parameters:
    - m_S
    - m_A
    - fermion mass
    - colored scalar mass
    - lambda_hS
    - y_Q_i
    - y_L_i
    derived_quantities:
    - Wilson coefficients for b -> s l+l-
    - Delta a_mu
    - thermal relic density
    - spin-independent cross section
    forward_model_chain:
    - step_id: flavor_loops
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - new particle masses
      - Yukawa couplings
      outputs:
      - B-anomaly Wilson coefficients
      - Delta a_mu
      validity: one-loop perturbative regime
      notes: Primary paper compares flavor constraints before DM constraints.
    - step_id: thermal_relic
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      inputs:
      - spectrum
      - couplings
      outputs:
      - Omega h^2
      - annihilation/coannihilation contributions
      validity: standard freeze-out
      notes: Paper solves the Boltzmann equation numerically and rejects freeze-in for these couplings.
    - step_id: direct_detection
      step_type: recasting
      tool_or_code: PandaX/XENON/LZ comparisons
      inputs:
      - sigma_SI
      - m_S
      outputs:
      - excluded/allowed portal values
      validity: requires current experimental curves
      notes: The paper overlays PandaX-4T, XENON1T, and LZ limits.
