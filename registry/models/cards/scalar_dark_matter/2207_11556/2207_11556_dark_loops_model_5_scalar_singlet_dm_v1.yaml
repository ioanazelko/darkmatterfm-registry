theory_to_observable_routing:
  routes:
  - id: route_model5_dark_loops
    description: Route Model 5 from scalar-singlet dark loops to flavor observables, relic abundance,
      and direct detection.
    source_model_features:
    - Z2-odd scalar SU(2)L singlets
    - vectorlike fermion SU(2)L doublet
    - Yukawa couplings to quarks and leptons
    - free Higgs portal coupling
    input_parameters:
    - m_S
    - fermion doublet mass
    - colored scalar mass
    - lambda_hS
    - y_Q_i
    - y_L_i
    derived_quantities:
    - Wilson coefficients for b -> s l+l-
    - Delta a_mu
    - thermal relic density
    - spin-independent cross section
    forward_model_chain:
    - step_id: flavor_loops
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - new particle masses
      - Yukawa couplings
      outputs:
      - B-anomaly Wilson coefficients
      - Delta a_mu
      validity: one-loop perturbative regime
      notes: Same dark-loop logic as Model 3 with different electroweak representations.
    - step_id: thermal_relic
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      inputs:
      - scalar-singlet spectrum
      - portal and Yukawa couplings
      outputs:
      - Omega h^2
      - annihilation/coannihilation contributions
      validity: standard freeze-out
      notes: Scalar singlet lacks the gauge-boson couplings present in Model 3 scalar doublets.
    - step_id: direct_detection
      step_type: recasting
      tool_or_code: PandaX/XENON/LZ comparisons
      inputs:
      - sigma_SI
      - m_S
      - fermion Z coupling
      outputs:
      - scalar allowed region
      - fermion-DM exclusion
      validity: requires current experimental curves
      notes: Primary paper compares direct-detection consequences for the two representations.
    observable_ids:
    - model5_loop_flavor_precision
    - model5_scalar_thermal_relic
    - model5_direct_detection
    constraint_ids:
    - model5_allowed_scalar_mass
    - model5_fermion_dm_z_exclusion
    likelihoods:
    - Flavor-anomaly fit likelihood external
    - direct-detection curves external
    required_code_resources:
    - FeynRules/model file plus micrOMEGAs would be needed for reproduction
    validation_tests:
    - Recover the 30-350 GeV Model 5 mass range.
    - Verify fermion-DM Z-mediated exclusion under Model 5 charges.
    route_status: planned
    agent_notes: The paper is explicit about the Model 5 vs Model 3 contrast; reproduction requires model
      files.
    caveats:
    - Updated flavor-anomaly averages after 2022 may change the motivation.
