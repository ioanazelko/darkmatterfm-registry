parameters:
  core:
  - name: gravitino mass
    symbol: M_3/2
    description: Mass of the stable gravitino dark matter candidate.
    range: 10 MeV to 1 GeV for the warm-dark-matter window highlighted by the paper; around 0.1 GeV in
      the moduli example.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0604132
  - name: heavy scalar mass
    symbol: M_X
    description: Mass of the coherent scalar field X that decays into gravitinos.
    range: Model-dependent; examples include M_X = 1e5-1e9 GeV for a 0.1 GeV gravitino moduli solution
      and O(1e9)-O(1e11) GeV for suppressed-branching warm dark matter.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0604132
  - name: gravitino branching ratio of X decay
    symbol: B_3/2
    description: Branching ratio for X decay into a gravitino pair.
    range: B_3/2 <= 3e-4 for dominant X-decay gravitino warm dark matter in the paper estimate; about
      1e-4 requires d_3/2 roughly one order below d_tot.
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0604132
  - name: reheating temperature after X decay
    symbol: T_R
    description: Temperature after the heavy scalar X decays.
    range: About 1e5 GeV in the modular-inflaton warm-DM example; bounded by abundance and BBN requirements.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0604132
  - name: effective gravitino decay coupling
    symbol: d_3/2
    description: Parameter controlling the X to gravitino-pair decay amplitude through the F component
      of X.
    range: Order unity for naive moduli; viable warm-DM window can require suppression by about one order
      relative to d_tot.
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0604132
  derived:
  - name: present gravitino velocity
    symbol: v_0
    description: Present velocity of gravitinos produced by X decay.
    value: approximately 1.2e-4 B_3/2 when Omega_3/2^X h^2 = 0.105
    role: derived
    status: approximate
    source_reference_ids:
    - hep-ph0604132
  - name: X-decay gravitino relic density
    symbol: Omega_3/2^X h^2
    description: Relic density from gravitinos produced directly by X decay.
    value: can equal 0.105 in the viable dark-matter branch
    role: derived
    status: approximate
    source_reference_ids:
    - hep-ph0604132
