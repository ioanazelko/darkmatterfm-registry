identity:
  name: Heavy-scalar decay gravitino warm dark matter
  family: gravitino_warm_dark_matter
  aliases:
  - Gravitino warm dark matter from X decay
  - Moduli-decay gravitino warm dark matter
  short_description: A stable gravitino LSP dark-matter scenario in which a coherently oscillating heavy
    scalar field X, such as a moduli or inflaton-like field, decays after dominating the early universe
    and nonthermally produces gravitinos.
  historical_origin_or_motivation: The paper identifies a new viable window for light stable gravitinos
    produced by heavy scalar or moduli decay, motivated by the gravitino/moduli problems in supersymmetric
    cosmology.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - low-energy supersymmetry
  - supergravity
  - moduli or inflaton heavy-scalar cosmology
  lagrangian_available: partial
  renormalizable: 'no'
  eft_cutoff:
    name: reduced Planck scale
    symbol: M_P
    description: Scale suppressing the supergravity decay of X to gravitinos.
    value: 2.4e18
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - hep-ph0604132
  embedded_in_larger_framework: 'yes'
  notes: The paper treats a generic SM-singlet heavy scalar X in N=1 supergravity and parameterizes its
    decay width into a gravitino pair by d_3/2 and M_X.
