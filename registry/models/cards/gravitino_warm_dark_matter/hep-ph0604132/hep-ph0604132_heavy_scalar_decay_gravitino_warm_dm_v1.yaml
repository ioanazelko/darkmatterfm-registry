  unstable_parent_particles:
  - heavy scalar field X
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The accepted branch is the stable-gravitino case, where the gravitino is the
    LSP and exact R-parity conservation is assumed.
  symmetries:
  - name: R-parity
    type: discrete
    exact_or_approximate: exact
