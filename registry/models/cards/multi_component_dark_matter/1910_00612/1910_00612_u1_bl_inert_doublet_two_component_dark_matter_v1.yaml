  hierarchy_questions:
  - question: Which inert state is stable?
    answer: The paper assumes the CP-even inert scalar H is lighter than A and H+ and is one DM component.
    status: assumed
  - question: Is N1 heavier than H in the conversion region?
    answer: The efficient conversion region studied often has M1 > M_H so N1 N1 to inert-scalar pairs
      can deplete N1.
    status: approximate
