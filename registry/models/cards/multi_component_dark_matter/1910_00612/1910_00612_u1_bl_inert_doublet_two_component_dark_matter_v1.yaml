  - name: right-handed neutrino dark-matter mass
    symbol: M1
    description: Mass of stable N1 component scanned in the two-component relic analysis.
    range: 200 GeV to 1 TeV in the conversion-region scans; intermediate W to 500 GeV focus also discussed
    unit: GeV
    role: core
    status: approximate
  - name: CP-even inert scalar mass
    symbol: M_H
    description: Mass of stable inert-doublet scalar component H.
    range: between M_W and 500 GeV emphasized; related to M1 by benchmark splittings
    unit: GeV
    role: core
    status: approximate
  - name: B-L breaking vacuum expectation value
    symbol: v_BL
    description: Sets B-L scalar, Z_BL, and right-handed-neutrino masses.
    range: O(10) TeV; 50 TeV benchmark in scans
    unit: GeV
    role: core
    status: approximate
  - name: B-L gauge coupling
    symbol: g_BL
    description: Gauge coupling controlling N1 interactions with Z_BL.
    range: 0.05 to 0.3 variation for thermal benchmarks; about 1e-10 for the freeze-in N1 option
    role: core
    status: approximate
  - name: inert-S quartic coupling
    symbol: lambda7
    description: Coupling that triggers N1-to-inert-doublet conversion and affects perturbativity.
    range: roughly 1 or larger for efficient conversion; scan range 0 to 4
    role: core
    status: approximate
  - name: Higgs-inert portal coupling
    symbol: lambda_L
    description: Coupling controlling H-H-h in the inert scalar sector.
    value: 1e-4 in the combined scan
    role: core
    status: assumed
  - name: scalar mixing angle
    symbol: sin alpha
    description: Mixing between the SM-like Higgs and the B-L scalar.
    value: 0.005 in the combined scan
    role: core
    status: assumed
  - name: inert-scalar splittings
    symbol: M_A - M_H and M_H+ - M_A
    description: Splittings used to aid coannihilation and shape quartic couplings.
    range: 10 GeV or 20 GeV in scans
    unit: GeV
    role: core
    status: assumed
  nuisance: []
  derived:
  - name: total relic abundance
    symbol: Omega_T h^2
    description: Sum of the N1 and H relic abundances.
    range: Planck-compatible band 0.1166 to 0.1206 used as target
    role: derived
    status: established
  - name: maximum perturbative extrapolation scale
    symbol: Lambda
    description: Highest scale to which the conversion region remains perturbative.
    range: up to about 1e9 GeV for thermal conversion; up to Planck scale for frozen-in N1
    unit: GeV
    role: derived
    status: approximate
