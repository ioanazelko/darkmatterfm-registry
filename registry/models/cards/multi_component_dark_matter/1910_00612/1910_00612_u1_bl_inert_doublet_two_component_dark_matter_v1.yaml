identity:
  name: U(1) B-L inert-doublet two-component dark matter
  family: multi_component_dark_matter
  aliases:
  - multipartite U(1) B-L dark matter
  - hybrid U(1) B-L plus inert-doublet dark matter
  short_description: A hybrid U(1)_{B-L} extension plus inert scalar doublet in which the lightest right-handed
    neutrino N1 and the CP-even inert scalar H are stable dark-matter components, with Higgs-mediated
    DM-DM conversion controlling the relic density.
  historical_origin_or_motivation: Motivated by combining minimal U(1)_{B-L} right-handed-neutrino dark
    matter with inert-doublet dark matter to obtain viable relic density, radiative neutrino mass, direct-search
    compatibility, and improved high-scale behavior.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - minimal U(1)_{B-L} extension
  - inert doublet model
  - scotogenic radiative neutrino mass
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes kinetic, Yukawa, and scalar-potential terms for the U(1)_{B-L} model with an
    inert doublet and two discrete symmetries; it studies the pure U(1)_{B-L} limit with no tree-level
    Z-Z_BL mixing.
