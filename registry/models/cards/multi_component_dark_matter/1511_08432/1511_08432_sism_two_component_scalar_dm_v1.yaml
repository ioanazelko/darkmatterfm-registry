    symbol: lambda_1
    description: Coupling controlling phi_1 mass/interactions.
    range: lambda_1 > -1.65/lambda_H
    role: core
    status: inferred
  - name: second dark scalar quartic
    symbol: lambda_2
    description: Coupling controlling phi_2 mass/interactions.
    range: lambda_2 > -1.65/lambda_H
    role: core
    status: inferred
  - name: dark-component interaction
    symbol: lambda_int
    description: Optional phi_1^2 phi_2^2 quartic.
    range: -3 < lambda_int < 3 in the paper's scan
    role: core
    status: inferred
  - name: component masses
    symbol: m_phi_i
    description: Masses of each scalar dark matter component.
    range: viable component masses lowered to roughly m_DM > 300 GeV in the two-component scan
