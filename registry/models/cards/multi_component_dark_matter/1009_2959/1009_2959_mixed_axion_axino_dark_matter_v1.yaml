    an axino LSP supply the dark matter while a neutralino NLSP and heavy gravitino permit high reheating
    temperatures for thermal leptogenesis.
  historical_origin_or_motivation: The paper uses the supersymmetric PQ solution to the strong CP problem
    to reconcile thermal leptogenesis with the gravitino and neutralino overproduction problems.
