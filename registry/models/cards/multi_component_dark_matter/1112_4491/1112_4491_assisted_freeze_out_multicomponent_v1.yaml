  short_description: A two-component dark matter model in which only the lighter Dirac fermion couples
    to the Standard Model, while the heavier stable fermion freezes out through annihilation into the
    lighter dark matter state.
  historical_origin_or_motivation: Introduced to realize a new freeze-out mechanism in multi-component
    dark matter and to reduce direct-detection rates when the visible-coupled component is subdominant.
