  assumptions: []
  benchmark_implications:
  - Triplet-like solutions require TeV-scale masses unless relaxed by splittings.
  caveats: []
  constrained_parameters:
  - Omega_dm h^2
  - m_1
  - theta
  - delta
  - lambda_11
  - lambda_22
  constraint_type: cosmological
  data_release: WMAP and Planck combined value quoted in primary paper
  excluded_regions:
  - Regions with too efficient coannihilation or gauge annihilation underproduce dark matter.
  id: con_st_wmap_planck
  likelihood_available: approximate
  likelihood_reference: null
  name: WMAP/Planck abundance target
  notes: Used as a target band in the paper, not as a full likelihood table.
  observable_channel: thermal relic density
  recasting_needed: partial
  robustness: high
  source_reference_ids:
  - arxiv:1311.1077
- allowed_regions:
  - Relaxed singlet regions with coannihilation can allow m1 above about 35 GeV; relaxed triplet regions
    confine m1 roughly to 51-75 GeV in the paper.
  applies: parameter_dependent
  assumptions: []
  benchmark_implications:
  - Small lambda_11 regions become viable when coannihilation supplies the relic depletion.
  caveats:
  - Limits are from the 2013-era LUX result in the primary paper.
  constrained_parameters:
  - sigma_SI
  - lambda_11
  - m_1
  - theta
  - delta
  constraint_type: direct_detection
  data_release: LUX limits as used in primary paper
  excluded_regions:
  - The LUX exclusion removes regions where the relic-density-required Higgs coupling gives too large
    sigma_SI.
  id: con_st_lux
  likelihood_available: unknown
  likelihood_reference: null
  name: LUX spin-independent direct-detection limit
  notes: Direct-detection strength is linked to relic-density tuning.
  observable_channel: nuclear recoil
  recasting_needed: 'yes'
  robustness: high
  source_reference_ids:
  - arxiv:1311.1077
- allowed_regions:
  - m_c > m_Z/2 and |lambda_12|, |lambda_mix| <= 1 in the paper convention.
  applies: 'yes'
  assumptions: []
  benchmark_implications:
  - These bounds shape the maximum allowed mass splittings and scenario ranges.
  caveats: []
  constrained_parameters:
  - m_c
  - lambda_12
  - lambda_mix
  - theta
  - delta
  constraint_type: laboratory
  data_release: LEP-I Z-width non-SM partial-width limit quoted in primary paper
  excluded_regions:
  - Charged scalar masses below m_Z/2 are excluded by the Z-width bound.
  - Parameter choices with absolute scalar couplings above one violate the paper perturbativity criterion.
  id: con_st_perturbativity_lep
  likelihood_available: 'no'
  likelihood_reference: null
  name: Perturbativity and LEP-I Z-width bounds
  notes: A hard model-building/laboratory preselection before relic and direct-detection recasts.
  observable_channel: Z width and scalar coupling perturbativity
  recasting_needed: not_applicable
  robustness: high
  source_reference_ids:
  - arxiv:1311.1077
- allowed_regions:
  - Constraint weakens or changes with halo-profile assumptions.
  applies: recast_required
  assumptions: []
  benchmark_implications:
  - Triplet-like annihilation to electroweak final states is the relevant target.
  caveats:
  - The primary paper stresses strong halo-profile dependence.
  constrained_parameters:
  - m_1
  - theta
  - halo profile
  constraint_type: astrophysical
  data_release: HESS result as quoted in primary paper
  excluded_regions:
  - For an NFW halo profile the primary paper states HESS can exclude the triplet scenario around 2-3
    TeV.
  id: con_st_hess_gamma
  likelihood_available: unknown
  likelihood_reference: null
  name: HESS gamma-ray constraint on triplet-like masses
  notes: Included as a profile-dependent indirect-detection recast target.
  observable_channel: gamma rays
  recasting_needed: 'yes'
  robustness: low
  source_reference_ids:
  - arxiv:1311.1077
theory_to_observable_routing:
  routes:
  - agent_notes: The primary paper identifies the numerical tool and target constraints.
    caveats:
    - Requires implementing the full scalar potential conventions.
    constraint_ids:
    - con_st_wmap_planck
    - con_st_perturbativity_lep
    derived_quantities:
    - Omega_dm h^2
    - dominant annihilation channel
    - scenario label
    description: Reproduce the micrOMEGAs relic-density scan over singlet/triplet mixing and splittings.
    forward_model_chain:
    - inputs:
      - model spectrum
      - couplings
      notes: Replicate the primary paper abundance scan.
      outputs:
      - thermal relic density
      step_id: st-relic-1
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      validity: Standard WIMP freeze-out with coannihilations included by Boltzmann factors.
    - inputs:
      - Omega_dm h^2
      notes: Flags underabundant and overabundant regions.
      outputs:
      - inside WMAP/Planck band
      step_id: st-relic-2
      step_type: validation
      tool_or_code: null
      validity: Use the abundance target quoted in the paper.
    id: route_st_relic
    input_parameters:
    - m_1
    - theta
    - delta
    - lambda_11
    - lambda_22
    likelihoods:
    - WMAP/Planck abundance band
    observable_ids:
    - obs_st_relic_coannihilation
    required_code_resources:
    - SARAH/FeynRules model plus micrOMEGAs or equivalent
    route_status: planned
    source_model_features:
    - real singlet plus real SU(2)L triplet
    - Z2 stability
    - Higgs and gauge annihilation
    - coannihilation
    validation_tests:
    - Recover pure-singlet and pure-triplet limiting cases.
  - agent_notes: Direct-detection recast is straightforward once model normalization is fixed.
    caveats:
    - Original limits are historical, not latest.
    constraint_ids:
    - con_st_lux
    derived_quantities:
    - sigma_SI
    - LUX exclusion flag
    description: Map the Higgs coupling selected by relic density to LUX-style nuclear recoil.
    forward_model_chain:
    - inputs:
      - lambda_11
      - m_1
      notes: Compute nucleon scattering.
      outputs:
      - sigma_SI
      step_id: st-dd-1
      step_type: analytic_formula
      tool_or_code: null
      validity: Scalar Higgs-exchange recoil approximation.
    - inputs:
      - sigma_SI
      - m_1
      notes: Compare to LUX limit as in the paper.
      outputs:
      - excluded/allowed
      step_id: st-dd-2
      step_type: recasting
      tool_or_code: null
      validity: Use detector-era limit curve.
    id: route_st_direct
    input_parameters:
    - lambda_11
    - m_1
    - theta
    likelihoods:
    - LUX upper-limit curve
    observable_ids:
    - obs_st_direct_detection
    required_code_resources:
    - direct-detection limit reader
    route_status: planned
    source_model_features:
    - Higgs-mediated scalar scattering
    - singlet-triplet mixing
    validation_tests:
    - Check coannihilation-relaxed low-coupling regime.
  - agent_notes: The paper motivates signatures but leaves detailed LHC studies open.
    caveats:
    - No event-level simulation in primary paper.
    constraint_ids:
    - con_st_perturbativity_lep
    derived_quantities:
    - open W-mediated decays
    - visible energy scale
    description: Translate scalar mass splittings into electroweak cascade signatures.
    forward_model_chain:
    - inputs:
      - spectrum
      notes: Classify whether W-mediated decays are open.
      outputs:
      - open two-body/three-body decays
      step_id: st-col-1
      step_type: analytic_formula
      tool_or_code: null
      validity: Tree-level kinematic thresholds.
    - inputs:
      - decay modes
      - production cross sections
      notes: Target relaxed scenarios with larger splittings.
      outputs:
      - collider sensitivity estimate
      step_id: st-col-2
      step_type: recasting
      tool_or_code: null
      validity: Requires a collider analysis not present in the paper.
    id: route_st_collider
    input_parameters:
    - m_1
    - Delta_21
    - Delta_c1
    - theta
    likelihoods: []
    observable_ids:
    - obs_st_collider_splittings
    required_code_resources:
    - spectrum calculator
    - LHC recast framework
    route_status: planned
    source_model_features:
    - charged scalar state
    - heavier neutral scalar
    - mass splittings
    validation_tests:
    - Verify m_c > m_Z/2 before collider scan.
