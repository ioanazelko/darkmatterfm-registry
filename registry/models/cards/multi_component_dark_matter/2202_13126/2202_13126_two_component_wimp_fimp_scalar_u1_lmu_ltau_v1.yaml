theory_to_observable_routing:
  routes:
  - id: coupled_boltzmann_route
    description: Evolve the coupled WIMP/FIMP abundances and map surviving points to direct, indirect,
      and muon g-2 observables.
    source_model_features:
    - two scalar DM components
    - U(1) L_mu-L_tau gauge boson
    - right-handed neutrinos
    input_parameters:
    - M_1
    - M_2
    - portal couplings
    - g_{mu tau}
    - M_Zprime
    derived_quantities:
    - Omega_1 h^2
    - Omega_2 h^2
    - sigma_SI
    - <sigma v>
    - Delta a_mu
    forward_model_chain:
    - step_id: wimp_freezeout
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - WIMP interactions
      - thermal bath
      outputs:
      - WIMP relic abundance
      validity: Thermal freeze-out regime.
      notes: null
    - step_id: fimp_freezein
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - feeble FIMP couplings
      - decay/annihilation/semi-production channels
      outputs:
      - FIMP relic abundance
      validity: FIMP remains out of equilibrium.
      notes: null
    - step_id: detection_observables
      step_type: recasting
      tool_or_code: null
      inputs:
      - surviving benchmark
      - DM fractions
      outputs:
      - direct and indirect rates
      validity: Requires fractional-density rescaling.
      notes: null
    - step_id: precision_check
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - g_{mu tau}
      - M_Zprime
      outputs:
      - muon g-2 contribution
      validity: Paper-level phenomenology; not a global fit here.
      notes: null
    observable_ids:
    - two_component_relic_density
    - wimp_direct_indirect_detection
    - lmu_ltau_muon_gminus2
    constraint_ids:
    - planck_relic_density_band
    - xenon1t_ams_exclusions
    likelihoods:
    - Planck relic-density target
    - XENON-1T/AMS-02 contours as used in paper
    required_code_resources:
    - Boltzmann solver implementation from paper required for reproduction
    validation_tests:
    - Reproduce relic-density regimes and benchmark detection plots.
    route_status: planned
    agent_notes: The route is explicit in the paper but no reusable code was included in the assignment.
    caveats:
    - FIMP direct detection remains negligible by construction.
  - id: phase_transition_gw_route
    description: Compute finite-temperature vacuum evolution and stochastic gravitational-wave spectra
      for surviving scalar benchmarks.
    source_model_features:
    - extra scalar fields
    - first-order phase transition
    input_parameters:
    - scalar potential parameters
    - thermal masses
    - nucleation action
    derived_quantities:
    - T_n
    - alpha
    - beta/H
    - GW peak amplitude
    - GW peak frequency
    forward_model_chain:
    - step_id: thermal_potential_scan
      step_type: semi_analytic_model
      tool_or_code: null
      inputs:
      - zero-temperature scalar potential
      - thermal corrections
      outputs:
      - phase-transition order
      validity: Perturbative finite-temperature potential.
      notes: null
    - step_id: gw_spectrum
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - alpha
      - beta/H
      - T_n
      outputs:
      - stochastic GW spectrum
      validity: Uses standard phase-transition GW formulae.
      notes: null
    - step_id: detector_overlay
      step_type: validation
      tool_or_code: null
      inputs:
      - GW spectrum
      - sensitivity curves
      outputs:
      - detectability flag
      validity: Projected detectors only.
      notes: null
    observable_ids:
    - first_order_phase_transition_gw
    constraint_ids:
    - gw_future_sensitivity
    likelihoods:
    - future LISA/DECIGO/BBO sensitivity curves
    required_code_resources:
    - finite-temperature potential scanner
    - GW spectrum calculator
    validation_tests:
    - Check benchmark spectra against published sensitivity curves.
    route_status: planned
    agent_notes: null
    caveats:
    - Bubble-wall and plasma uncertainties are not resolved in this enrichment.
