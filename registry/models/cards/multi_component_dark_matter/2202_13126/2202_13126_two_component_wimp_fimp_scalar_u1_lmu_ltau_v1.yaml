- id: xenon1t_ams_exclusions
  name: XENON-1T and AMS-02 exclusions on the WIMP component
  constraint_type: direct_detection
  observable_channel: spin-independent scattering and annihilation to visible products
  applies: parameter_dependent
  constrained_parameters:
  - M_1
  - sigma_SI
  - <sigma v>
  - WIMP relic fraction
  excluded_regions:
  - Part of the WIMP mass region around and above several hundred GeV is excluded by direct detection
    in the paper scan; indirect AMS-02 bounds remove part of the annihilation region.
  allowed_regions:
  - Remaining regions are testable by future experiments such as DARWIN and PandaX according to the primary
    paper.
  benchmark_implications:
  - The FIMP component can hide from these searches, but the WIMP component cannot be ignored.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: XENON-1T and AMS-02 bounds as used in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: fractional_wimp_rescaling
    description: Direct and indirect rates are interpreted for the WIMP fraction of the total two-component
      density.
    scope: multi-component detection recast
    status: assumed
    impact_if_violated: Using the full local density for the WIMP would overstate bounds if the FIMP fraction
      is large.
