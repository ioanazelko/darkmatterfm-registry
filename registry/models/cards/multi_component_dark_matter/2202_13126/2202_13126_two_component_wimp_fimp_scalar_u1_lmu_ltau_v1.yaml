  short_description: An extension of the Standard Model with two SM-singlet scalar dark matter fields,
    phi_1 and phi_2, three right-handed neutrinos, and an extra U(1) L_mu-L_tau gauge boson; phi_1 can
    behave as WIMP-like dark matter while phi_2 is FIMP-like, with their combined relic abundance matching
    dark matter.
