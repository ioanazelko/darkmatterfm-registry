  parent_frameworks:
  - gauged U(1)_B-L extension
  - Zee-Babu two-loop neutrino mass model
  - self-interacting dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the model Lagrangian including Zee-Babu scalars, right-handed neutrinos, Dirac
    dark fermions, the U(1)_B-L gauge sector, scalar potential terms, and a two-loop effective transition
    magnetic dipole operator.
particle_content:
  dark_matter_candidate:
    name: SM-singlet Dirac dark fermion mass eigenstates psi'_i
    spin: 1/2
    statistics: fermion
