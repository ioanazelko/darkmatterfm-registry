  unstable_parent_particles:
  - psi'_2 decays to psi'_1 plus photon through a transition magnetic dipole operator
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: After U(1)_B-L breaking a residual local discrete symmetry, described in the
    text as local Z6, guarantees absolute stability of the lightest psi_i mass eigenstate; small mass
    splittings are technically natural because setting them to zero enhances flavor symmetry.
  symmetries:
  - name: U(1)_B-L
    type: gauge
    exact_or_approximate: broken
    breaking: Broken by a complex scalar field with B-L = 2 acquiring a vacuum expectation value v_phi.
    breaking_scale:
      name: B-L breaking scale
      symbol: v_phi
      description: Vacuum expectation value setting the heavy Zprime mass scale.
      value: O(10 TeV) for g_Zprime of order one
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - paper:1410.1992
      notes: null
  - name: residual local Z6
    type: discrete
    exact_or_approximate: exact
    breaking: Unbroken residual local symmetry after U(1)_B-L breaking.
    breaking_scale: null
  - name: global Z2 for right-handed neutrinos
    type: discrete
    exact_or_approximate: exact
    breaking: Introduced to forbid the ordinary seesaw Yukawa interaction so neutrino masses arise through
      the Zee-Babu mechanism.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
