identity:
  name: Gauged U(1)_B-L Zee-Babu Dirac dark matter for the 3.5 keV line
  family: multi_component_dark_matter
  aliases:
  - B-L Zee-Babu Dirac dark matter
  - Dirac dark fermion X-ray line model
  short_description: A gauged U(1)_B-L extension of the Zee-Babu radiative neutrino-mass model with three
    SM-singlet Dirac dark fermions; a residual local discrete symmetry stabilizes the lightest mass eigenstate,
    while a nearly degenerate heavier state can decay radiatively through a two-loop transition magnetic
    dipole operator.
  historical_origin_or_motivation: The paper gauges a global U(1)_B-L version of an earlier scalar dark
    matter Zee-Babu scenario to connect neutrino mass, dark matter, and a possible 3.5 keV X-ray line.
  status: speculative
  model_kind: complete_theory
theory:
