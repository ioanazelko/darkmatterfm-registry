  source_reference_ids:
  - '1008.5243'
theory_to_observable_routing:
  routes:
  - agent_notes: The analytic scattering route is straightforward.
    caveats:
    - Modern low-threshold limits should replace historical ones.
    constraint_ids:
    - xenon_cogent_dama_light_dm_window
    derived_quantities:
    - sigma_p
    description: Map kinetic mixing and sub-GeV mediator parameters to a low-mass direct-detection cross
      section.
    forward_model_chain:
    - inputs:
      - m_L
      - m_X
      - epsilon
      - g_X
      notes: Compute proton/nucleon cross section.
      outputs:
      - sigma_p
      step_id: vector_scattering
      step_type: analytic_formula
      tool_or_code: null
      validity: Tree-level kinetically mixed vector exchange.
    - inputs:
      - sigma_p
      - m_L
      notes: Compare to DAMA/CoGeNT/CDMS/XENON regions.
      outputs:
      - allowed_or_excluded
      step_id: direct_detection_compare
      step_type: likelihood
      tool_or_code: null
      validity: Requires historical or updated low-mass limit curves.
    id: route_light_dm_scattering
    input_parameters:
    - m_L
    - m_X
    - epsilon
    - g_X
    likelihoods:
    - DAMA/CoGeNT/CDMS/XENON low-mass regions
    observable_ids:
    - light_dm_direct_detection_signal
    required_code_resources:
    - direct-detection recast for sub-GeV mediator
    route_status: planned
    source_model_features:
    - light Dirac dark fermion
    - sub-GeV U(1)_X vector
    - kinetic mixing
    validation_tests:
    - Recover sigma_p order 1e-40 cm^2 for the benchmark.
  - agent_notes: This is less mature than the LDM direct-detection route.
    caveats:
    - Astrophysical backgrounds and historical anomaly status are major caveats.
    constraint_ids:
    - gamma_ray_sommerfeld_constraint
    derived_quantities:
    - cosmic-ray source spectrum
    - gamma-ray constraint status
    description: Estimate heavy-sector annihilation/decay signals and gamma-ray constraints.
    forward_model_chain:
    - inputs:
      - m_HDM
      - couplings
      - lifetime or annihilation cross section
      notes: Choose annihilation or decay branch.
      outputs:
      - charged cosmic-ray source rate
      step_id: source_rate
      step_type: analytic_formula
      tool_or_code: null
      validity: Model-dependent annihilation/decay setup.
    - inputs:
      - source rate
      - branching fractions
      notes: Primary paper only flags the issue.
      outputs:
      - allowed_or_excluded
      step_id: gamma_constraint
      step_type: likelihood
      tool_or_code: null
      validity: Requires external gamma-ray constraints.
    id: route_heavy_dm_indirect
    input_parameters:
    - m_HDM
    - m_X
    - Q_Hh g_X
    - annihilation or decay lifetime
    likelihoods:
    - Fermi/PAMELA cosmic-ray data
    - gamma-ray upper limits
    observable_ids:
    - heavy_dm_cosmic_ray_excess
    required_code_resources:
    - cosmic-ray propagation and gamma-ray recast
    route_status: planned
    source_model_features:
    - TeV-scale heavy dark sector
    - light dark gauge boson
    - Sommerfeld enhancement
    validation_tests:
    - Check that chosen Q_Hh g_X avoids excessive enhancement.
  - agent_notes: Late decay makes the abundance route explicitly nonstandard.
    caveats:
    - ONLSP identity and branching fractions are model-specific.
    constraint_ids:
    - bbn_late_decay_bound
    derived_quantities:
    - Omega_LDM h^2
    - BBN safety flag
    description: Compute LDM abundance from freeze-out plus late ONLSP decay before BBN.
    forward_model_chain:
    - inputs:
      - LDM annihilation channels
      notes: Calculate baseline underproduction.
      outputs:
      - initial Omega_LDM
      step_id: thermal_ldm_freezeout
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Primary paper states ordinary freeze-out gives too small abundance.
    - inputs:
      - Omega_ONLSP
      - branching fraction
      - tau_ONLSP
      notes: Transfer ONLSP number density to LDM.
      outputs:
      - final Omega_LDM
      step_id: late_decay_transfer
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Decay after LDM decoupling.
    - inputs:
      - tau_ONLSP
      - visible energy injection
      notes: Require safe decay before or around BBN as in worked example.
      outputs:
      - BBN pass/fail
      step_id: bbn_check
      step_type: validation
      tool_or_code: null
      validity: Approximate timing/energy check.
    id: route_late_decay_abundance
    input_parameters:
    - Omega_ONLSP
    - tau_ONLSP
    - branching to light dark states
    - LDM annihilation rate
    likelihoods:
    - BBN light-element constraints
    observable_ids:
    - late_onlsp_decay_relic_density
    required_code_resources:
    - Boltzmann solver plus BBN energy-injection recast
    route_status: planned
    source_model_features:
    - underproduced light thermal relic
    - ordinary NLSP late decay
    validation_tests:
    - Reproduce final Omega_LDM h^2 about 0.1 for the worked option.
