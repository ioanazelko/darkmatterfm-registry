  short_description: A thermal two-component dark matter extension of the Standard Model with a singlet
    Dirac fermion and a pNGB from a complex singlet scalar, plus mixed Higgs states; in the pNGB-heavier
    regime the pNGB yield can grow before freeze-out.
  historical_origin_or_motivation: The paper studies how a thermal multicomponent dark matter model can
    realize a temporary exponential, or bouncing, growth of one component before freeze-out and alter
    present-day annihilation rates.
