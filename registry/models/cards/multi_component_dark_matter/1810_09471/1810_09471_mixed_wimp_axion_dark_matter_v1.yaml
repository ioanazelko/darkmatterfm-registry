  short_description: A two-component dark matter model in which the QCD axion and a stable scalar chi_1
    from a PQ-charged complex scalar both contribute to the relic abundance.
  historical_origin_or_motivation: The paper combines the strong-CP-motivated KSVZ axion with a residual-Z2-stabilized
    scalar WIMP so axion and scalar components can share the observed dark matter density.
  status: speculative
  model_kind: complete_theory
