symmetries:
  stabilizing_mechanism: The global U(1)_PQ symmetry is spontaneously broken and leaves a residual Z2
    symmetry that stabilizes chi_1; the axion is long-lived because its couplings are suppressed by F_a.
  symmetries:
  - name: U(1)_PQ
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by the PQ scalar at F_a and explicitly affected by QCD dynamics
    breaking_scale:
      name: PQ breaking scale
      symbol: F_a
      range:
        min: 1e10
        max: 1e12
        unit: GeV
        notes: Range used in the paper to avoid supernova cooling and axion overproduction.
      unit: GeV
      role: core
      status: inferred
  - name: residual Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken residual symmetry after PQ breaking
    breaking_scale: null
  - name: axion shift symmetry
    type: shift
    exact_or_approximate: broken
    breaking: QCD nonperturbative effects generate the axion potential
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
