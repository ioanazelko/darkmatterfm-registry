  - axion plus scalar S1 two-component dark matter
  short_description: A complex-scalar extension of the KSVZ axion framework in which the QCD axion is
    underabundant and the lighter scalar component S1 supplies the rest of dark matter through WIMP-like
    annihilation mediated by a vector-like quark and the Higgs portal.
  historical_origin_or_motivation: The paper adds a complex singlet scalar to KSVZ to avoid fine-tuning
    the axion decay scale for the full relic density and studies the viable up-type VLQ coupling pattern.
  status: speculative
  model_kind: complete_theory
