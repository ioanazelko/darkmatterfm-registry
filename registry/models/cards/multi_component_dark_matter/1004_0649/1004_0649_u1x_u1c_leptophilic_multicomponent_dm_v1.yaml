  short_description: A supersymmetric hidden-sector model with U(1)_X hidden matter plus a gauged leptophilic
    U(1)_C, yielding Majorana neutralino and hidden Dirac fermion dark-matter components whose Dirac annihilation
    proceeds mainly to leptons.
