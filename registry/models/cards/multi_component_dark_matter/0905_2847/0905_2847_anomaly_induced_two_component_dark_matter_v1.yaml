    type: discrete
    exact_or_approximate: broken
    breaking: broken by anomaly-induced terms so the heavier component can decay
  - name: anomalous Z4
    type: discrete
    exact_or_approximate: broken
    breaking: spontaneously broken to Z2 and anomalous at high energy
  topological_defects_possible: unknown
