  notes: The paper gives a low-energy superpotential, soft terms, an anomalous discrete-symmetry suppression
    mechanism, and decay-width formulae; the high-energy anomalous embedding is sketched rather than fully
    specified.
particle_content:
  dark_matter_candidate:
    name: heavier right-handed sneutrino-like N component plus stable lightest neutralino
