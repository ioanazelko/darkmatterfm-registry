  short_description: A supersymmetric radiative-seesaw model with a heavier right-handed sneutrino-like
    component that decays anomalously to a stable neutralino component plus leptons.
  historical_origin_or_motivation: Built to explain PAMELA and ATIC positron/electron data without a large
    annihilation boost factor by using exponentially suppressed anomaly-induced decay.
  status: speculative
  model_kind: complete_theory
