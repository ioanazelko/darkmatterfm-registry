identity:
  name: Two-component baryon-scattering dark matter for cool-core cluster heating
  family: multi_component_dark_matter
  aliases:
  - subcomponent baryon-DM scattering model
  - cool-core cluster DM heating model
  short_description: A phenomenological two-component dark matter scenario in which a small, strongly
    baryon-scattering subcomponent transfers heat from a dominant cold dark matter reservoir to intracluster
    baryons.
  historical_origin_or_motivation: The paper revisits baryon-DM heating of cool-core clusters and develops
    a subcomponent, two-component version to evade CMB and matter-power constraints that rule out strongly
    interacting single-species dark matter.
  status: speculative
  model_kind: phenomenological_parameterization
