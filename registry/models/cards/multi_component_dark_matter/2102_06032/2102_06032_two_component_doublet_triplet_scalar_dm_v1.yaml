  short_description: A two-component scalar dark matter model combining an inert scalar doublet and a
    hyperchargeless scalar triplet, stabilized by Z_2 x Z_2_prime symmetry with DM-DM conversion.
  historical_origin_or_motivation: The model is proposed to revive under-abundant mass regions of standalone
    inert doublet and Y=0 inert triplet scalar dark matter while helping stabilize the electroweak vacuum.
  status: speculative
  model_kind: complete_theory
theory:
