  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Unbroken Z_2 x Z_2_prime discrete symmetry keeps the inert doublet and triplet
    sectors stable, making H_0 and T_0 dark matter candidates when lightest in their sectors.
  symmetries:
  - name: Z_2 x Z_2_prime
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken
  - name: SU(2)_L x U(1)_Y
    type: gauge
    exact_or_approximate: broken
    breaking: electroweak symmetry breaking
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - Higgs boson
  - electroweak gauge bosons
  - nucleons through Higgs exchange
  dark_sector_couplings:
  - lambda_L H_0-H_0-h portal
  - lambda_HT T_0-T_0-h portal
  - lambda_T doublet-triplet conversion coupling
  mediator_types:
  - Higgs boson
  - W and Z bosons
  interaction_operators:
  - renormalizable scalar potential terms involving H, Phi, and T
  - quartic T_0 T_0 H_0 H_0 conversion interaction
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: mild
    spin_dependence: spin_independent
  annihilation_channels:
  - annihilation and coannihilation to Standard Model particles
  - H_0 H_0 to T_0 T_0 or T_0 T_0 to H_0 H_0 conversion depending on hierarchy
  decay_channels:
  - A_0 decays to H_0 and Standard Model fermions through off-shell Z when heavier
  self_scattering_channels:
  - scalar quartic self-interactions in the inert sectors
parameters:
