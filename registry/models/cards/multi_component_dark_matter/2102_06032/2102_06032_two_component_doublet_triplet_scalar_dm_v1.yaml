  eft_cutoff: null
  embedded_in_larger_framework: 'no'
  notes: The paper writes the full renormalizable scalar potential for H, an inert doublet Phi, and a
    Y=0 inert triplet T under SU(2)_L x U(1)_Y x Z_2 x Z_2_prime.
particle_content:
  dark_matter_candidate:
    name: H_0 and T_0 neutral scalars
    spin: '0'
    statistics: scalar
