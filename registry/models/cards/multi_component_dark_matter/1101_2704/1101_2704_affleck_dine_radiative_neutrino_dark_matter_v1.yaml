identity:
  name: Affleck-Dine radiative neutrino mass model with two dark matter components
  family: multi_component_dark_matter
  aliases:
  - Affleck-Dine leptogenesis in the radiative neutrino mass model
  short_description: 'A supersymmetric radiative neutrino mass model extending the MSSM with singlet N_i
    fields, extra doublets eta_u and eta_d, and an additional singlet chi, with R parity and Z_2 leaving
    two dark matter components: the lightest ordinary neutralino and the lightest Z_2-odd neutral field.'
  historical_origin_or_motivation: Proposed to connect radiative neutrino masses and dark matter abundance
    while using Affleck-Dine leptogenesis along the LH_u flat direction to avoid the high reheating temperature
    needed for thermal right-handed-neutrino leptogenesis.
  status: speculative
  model_kind: complete_theory
