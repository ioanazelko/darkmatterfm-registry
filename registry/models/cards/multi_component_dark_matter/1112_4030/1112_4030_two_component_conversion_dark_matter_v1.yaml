identity:
  name: Interacting two-component dark matter conversion model
  family: multi_component_dark_matter
  aliases:
  - late-time dark matter conversion boost-factor model
  - two-component leptophilic conversion dark matter
  short_description: A two-component gauge-singlet fermion dark-matter model in which a heavier nearly
    degenerate component converts into the lighter component after thermal decoupling, enhancing the lightest
    component relic density and present annihilation rate.
  historical_origin_or_motivation: The paper proposes late dark-matter conversion as an alternative boost-factor
    source for cosmic-ray positron and electron excesses without relying on velocity-dependent annihilation
    or decays of unstable particles.
  status: speculative
  model_kind: simplified_model
