identity:
  name: Complex singlet scalar model with singlet fermion dark matter
  family: multi_component_dark_matter
  aliases:
  - CxSM plus singlet fermion DM
  - degenerate-scalar CxSM fermion dark matter
  short_description: A complex singlet scalar extension of the Standard Model supplemented by a singlet
    vector-like fermion so the fermion supplies most of the relic density while the CP-odd scalar remains
    a tiny pNGB-like component.
  historical_origin_or_motivation: Introduced to reconcile the degenerate-scalar CxSM, strong first-order
    electroweak phase transition, and the observed dark-matter relic density.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - complex singlet scalar extension of the Standard Model
  - pseudo-Nambu-Goldstone dark matter
  - singlet vector-like fermion dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives a renormalizable CxSM scalar potential with soft global-U(1) breaking and a singlet-fermion
    Yukawa interaction.
particle_content:
  dark_matter_candidate:
    name: singlet vector-like fermion f with a tiny CP-odd singlet-scalar component
    spin: 1/2 for f; 0 for the scalar component
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - complex SU(2) singlet scalar S
  - CP-odd scalar singlet dark matter component
  - CP-even scalar h_2
  mediators:
  - CP-even scalars h_1 and h_2
  dark_radiation_species: []
  excited_or_degenerate_states:
  - nearly degenerate CP-even scalars h_1 and h_2
  long_lived_particles:
  - singlet vector-like fermion f
  - CP-odd scalar singlet
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The CP-odd scalar is stabilized by CP symmetry of the scalar potential; the singlet
    vector-like fermion is treated as a stable DM candidate but its exact stabilizing symmetry is not
    fully specified in the assigned text.
  symmetries:
  - name: CP symmetry of the scalar potential
    type: discrete
    exact_or_approximate: exact
    breaking: not specified for the DM-stabilizing CP symmetry
    breaking_scale: null
  - name: global U(1) of the complex singlet scalar
    type: global
    exact_or_approximate: broken
    breaking: soft breaking by a_1 and b_1 terms in the scalar potential
    breaking_scale: null
  topological_defects_possible: 'yes'
interactions:
  portals:
  - higgs
  standard_model_targets:
  - quarks
  - nucleons through Higgs mixing
  - Standard Model Higgs sector
  dark_sector_couplings:
  - lambda_f f f S Yukawa interaction
  - Higgs-portal coupling between H and S
  - CP-even scalar mixing angle theta
  mediator_types:
  - mixed CP-even scalar mediators h_1 and h_2
  interaction_operators:
  - lambda_f f f S + h.c.
  - Higgs-portal quartic H^dagger H |S|^2
  - soft U(1)-breaking singlet terms a_1 S and b_1 S^2 + h.c.
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: mild
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - fermion DM pair annihilation through h_1 and h_2
  - scalar DM annihilation resonantly through h_1 and h_2
  decay_channels:
  - h_1 or h_2 to f f when kinematically open
  self_scattering_channels: []
  cp_structure: CP symmetry stabilizes the scalar component
  flavor_structure: quark couplings follow Higgs mixing in the text
  tree_or_loop_level: tree
parameters:
  core:
  - name: fermion dark matter mass
    symbol: m_f
    description: Mass of the singlet vector-like fermion.
    range: studied from below 130 GeV up to 1000 GeV in the relic-density discussion
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2312_05776'
  - name: fermion Yukawa coupling
    symbol: lambda_f
    description: Yukawa coupling between f and the complex singlet S.
    range: O(1)-O(10) for lighter m_f; about 0.5 for 130 GeV < m_f < 1000 GeV in the summary
    role: core
    status: inferred
    source_reference_ids:
    - '2312_05776'
  - name: CP-odd scalar DM mass
    symbol: m_chi
    description: Mass of the scalar singlet DM component in the degenerate-scalar benchmark.
    value: '62.5'
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2312_05776'
  - name: CP-even scalar masses
    symbol: m_h1, m_h2
    description: Masses of the scalar mediators; h_1 is the 125 GeV Higgs and h_2 is taken nearly degenerate.
    value: m_h1 = 125 GeV and m_h2 nearly degenerate
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2312_05776'
  - name: singlet vacuum expectation value
    symbol: v_S
    description: VEV of the complex singlet scalar in the benchmark discussion.
    value: 0.6 in the numerical study for strong first-order EWPT
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2312_05776'
  nuisance: []
  derived:
  - name: total relic density
    symbol: Omega_total h^2
    description: Sum of scalar and fermion DM relic densities.
    value: Omega_chi h^2 + Omega_f h^2 matched to 0.1200 +/- 0.0012 at 2 sigma
    role: derived
    status: inferred
    source_reference_ids:
    - '2312_05776'
