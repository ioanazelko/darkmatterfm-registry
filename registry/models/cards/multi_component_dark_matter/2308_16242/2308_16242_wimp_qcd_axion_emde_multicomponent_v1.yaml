  assumptions:
  - can_be_relaxed: 'no'
    description: A modulus dominates the energy density before BBN and decays into radiation and possibly
      WIMPs.
    id: pre_bbn_modulus_emde
    impact_if_violated: Relic densities, perturbation growth, and minicluster conditions change qualitatively.
    notes: null
    scope: cosmological_history
    source_reference_ids:
    - primary
    status: assumed
  - can_be_relaxed: partial
    description: PQ symmetry breaks before inflation, so a single initial misalignment angle applies in
      our Hubble volume.
    id: pq_breaking_before_inflation
    impact_if_violated: Post-inflationary strings/domain walls and different minicluster seeds would need
      to be included.
    notes: null
    scope: initial_conditions
    source_reference_ids:
    - primary
    status: assumed
  benchmark_implications:
  - Do not use standard-radiation isocurvature formulae without the EMDE correction when T_D is low.
  caveats:
  - The paper quotes analytic relations and points to prior work for other regimes.
