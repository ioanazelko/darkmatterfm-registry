  - H_I
  - theta_i
  - f_a
  - Omega_a/Omega_CDM
  - T_D
  constraint_type: cosmological
  data_release: CMB/BBN isocurvature relations quoted by primary paper
  excluded_regions:
  - Inflationary Hubble scales above the history-dependent isocurvature relation are excluded for the
    pre-inflationary PQ scenario.
