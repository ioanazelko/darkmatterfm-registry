      step_id: step_secondary_infall
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Optimistic isolated-PBH growth assumptions.
    - inputs:
      - Galactocentric radius
      - disk crossings
      - tidal field
      notes: null
      outputs:
      - surviving minihalo mass
      step_id: step_disruption
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Circular-orbit and analytic disk-shocking approximations.
    - inputs:
      - dressed-PBH number density
      - neutron-star distribution
      - cross section
      notes: null
      outputs:
      - encounter rate
      step_id: step_encounter_rate
      step_type: analytic_formula
      tool_or_code: null
      validity: Population-level estimate.
