    - radio survey sensitivity curves
    route_status: planned
    source_model_features:
    - Dominant QCD axion dark matter.
    - Subdominant PBHs carry axion minihalos.
    - Neutron-star magnetospheres enable resonant axion-photon conversion.
    validation_tests:
    - Recover no signal as g_a_gamma -> 0.
    - Check line frequency tracks m_a.
  - agent_notes: This route captures the primary paper's approximate population model.
    caveats:
