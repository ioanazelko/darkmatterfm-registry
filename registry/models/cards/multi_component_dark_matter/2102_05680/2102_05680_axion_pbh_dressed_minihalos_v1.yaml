      tool_or_code: null
      validity: Primary analytic minihalo profile and disruption-adjusted mass distribution.
    - inputs:
      - m_a
      - g_a_gamma
      - magnetosphere plasma model
      notes: null
      outputs:
      - conversion probability
      - radiated power
      step_id: step_resonant_conversion
      step_type: analytic_formula
      tool_or_code: null
      validity: Primary formulae plus related plasma caveats.
    - inputs:
      - radiated power
      - distance
      - bandwidth
      - viewing angle
      notes: null
      outputs:
      - S_nu
      - duration
      - survey detectability
      step_id: step_observing_model
      step_type: data_transform
      tool_or_code: null
