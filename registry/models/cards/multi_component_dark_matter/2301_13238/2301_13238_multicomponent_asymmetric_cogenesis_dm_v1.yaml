identity:
  name: Multi-component asymmetric cogenesis dark-sector model
  family: multi_component_dark_matter
  aliases:
  - asymmetric freeze-in/freeze-out cogenesis model
  short_description: An extended gauged dark sector in which right-handed-neutrino cogenesis links neutrino
    masses, baryon asymmetry, and one- or two-component dark matter made from a stable fermion and/or
    scalar.
  historical_origin_or_motivation: The paper generalizes cogenesis asymmetric dark matter by adding an
    extended dark sector that can realize freeze-out, freeze-in, late-decay, single-component, and multi-component
    regimes.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - gauged B-L
  - dark U(1)_D x U(1)_X sector
  - type-I seesaw thermal leptogenesis
  - asymmetric dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the new Lagrangian with right-handed neutrinos, two Dirac dark fermions, scalars,
    and three new U(1) factors; it also sketches a low-scale inverse-seesaw variant.
particle_content:
  dark_matter_candidate:
    name: stable dark fermion chi and/or scalar S
    spin: fermion plus scalar
    statistics: unknown
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - parent dark fermion psi
  - right-handed neutrinos N_R
  - scalars phi and varphi
  mediators:
  - Z_B-L gauge boson
  - Z_D dark gauge boson
  - scalar phi
  - right-handed neutrinos
  dark_radiation_species:
  - massless dark gauge boson A_prime is present but decoupled in the chosen regime
  unstable_parent_particles:
  - parent dark fermion psi
  - right-handed neutrino N_1
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An unbroken U(1)_{X+D} charge stabilizes the dark fermion and scalar components
    without imposing an extra discrete symmetry.
  symmetries:
  - name: U(1)_{B-L}
    type: gauge
    exact_or_approximate: broken
    breaking: large scalar vev v_B-L generates Majorana masses and thermal leptogenesis
  - name: U(1)_D x U(1)_X -> U(1)_{X+D}
    type: gauge
    exact_or_approximate: exact
    breaking: one scalar vev leaves a residual unbroken dark gauge charge
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  - neutrino
  standard_model_targets:
  - SM leptons
  - Higgs doublet
  - B-L current
  dark_sector_couplings:
  - dark gauge coupling g_D
  - feeble freeze-in Yukawa y_chi
  - Yukawa y_S linking S to right-handed neutrinos
  mediator_types:
  - heavy right-handed neutrino
  - dark gauge boson
  - B-L gauge boson
  - scalar mediator
  annihilation_channels:
  - symmetric dark components annihilate into dark-sector states such as Z_D Z_D or S S where kinematically
    allowed
  decay_channels:
  - right-handed-neutrino decays seed visible and dark asymmetries; late parent decays can populate chi
    or S
  tree_or_loop_level: both
