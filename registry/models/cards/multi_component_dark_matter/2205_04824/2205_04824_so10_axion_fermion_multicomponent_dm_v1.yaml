parameters:
  core:
  - name: axion decay constant
    symbol: f_a
    description: PQ breaking scale controlling axion abundance.
    value: 8e10 GeV saturates the observed dark matter abundance for the axion-only limit; smaller values
      require a fermion component
    unit: GeV
    role: core
    status: inferred
  - name: intermediate-mass fermion dark matter mass
    symbol: m_DM
    description: Common assumed mass scale for fermions from the 10-plets.
    range: 10^9-10^10 GeV examples
    unit: GeV
    role: core
    status: inferred
  - name: scalar triplet mass
    symbol: m_T
    description: Mass of the light SU(2)_L scalar triplet used in unification and W-mass discussion.
    range: 1-50 TeV
    unit: TeV
    role: core
    status: inferred
  - name: second intermediate symmetry-breaking scale
    symbol: M_II
    description: Scale associated with the Z2 strings and unification examples.
    range: 10^9.5-10^12.3 GeV in gravitational-wave examples
    unit: GeV
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: axion relic abundance
    symbol: Omega_a h^2
    description: Sum of misalignment and string-decay contributions in the paper.
    value: approximately 2.41 (f_a/10^12 GeV)^(7/6)
    role: derived
    status: inferred
  - name: total dark matter relic abundance
    symbol: Omega_Total h^2
    description: Total abundance written as axion plus fermion components.
    value: Omega_a h^2 + Omega_10 h^2
    role: derived
    status: inferred
  - name: fermion asymptotic yield
    symbol: Y_DM
    description: Yield required for the fermion component when the axion is subdominant.
    value: 4.36e-10 (Omega_Total h^2 - Omega_a h^2) GeV / m_DM
    role: derived
    status: inferred
