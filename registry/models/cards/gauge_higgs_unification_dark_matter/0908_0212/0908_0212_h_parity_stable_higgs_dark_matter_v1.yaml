symmetries:
  stabilizing_mechanism: Enhanced large-gauge invariance and mirror reflection at theta_H = pi/2 generate
    an exact H parity under which only H is odd, forbidding all odd-Higgs couplings and making H stable.
  symmetries:
  - name: H parity
    type: discrete
    exact_or_approximate: exact
    breaking: not broken in the tensorial-representation SO(5) x U(1) setup
  - name: SO(5) x U(1) gauge symmetry
    type: gauge
    exact_or_approximate: broken
    breaking: orbifold boundary conditions break SO(5) to SO(4), with electroweak symmetry controlled
      by the Wilson-line phase
  - name: mirror reflection in the extra dimension
    type: discrete
    exact_or_approximate: exact
    breaking: preserved by the orbifold boundary conditions
