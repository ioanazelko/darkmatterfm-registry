    by strings decay into axions that add a cold dark-matter component with relatively large primordial
    velocity dispersion.
  historical_origin_or_motivation: The paper develops the cosmological contribution of axion walls bounded
    by strings, especially the wall-decay axion population and its consequences for miniclusters and direct
    searches.
