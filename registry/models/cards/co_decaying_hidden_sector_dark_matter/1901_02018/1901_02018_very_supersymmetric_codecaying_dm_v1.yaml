    degenerate bosons and fermions; R parity makes the hidden fermion long-lived dark matter while the
    scalar decays to the Standard Model, producing co-decaying dark matter over much of parameter space.
  historical_origin_or_motivation: Motivated by the possibility that supersymmetry is badly broken in
    the visible sector but remains a good approximate symmetry in a hidden dark sector.
  status: speculative
  model_kind: complete_theory
