  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The explicit benchmark couples the MSSM to one chiral superfield Phi through W = W_MSSM + 1/2
    m Phi^2 + 1/3 kappa Phi^3 + epsilon Phi H_u H_d.
