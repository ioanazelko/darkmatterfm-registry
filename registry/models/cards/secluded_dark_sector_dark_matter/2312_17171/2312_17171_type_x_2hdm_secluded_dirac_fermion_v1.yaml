  short_description: A Type-X two-Higgs-doublet model is augmented by a singlet scalar and two dark Dirac
    fermions, with one fermion as dark matter and the other as a mediator in a secluded dark sector.
  historical_origin_or_motivation: The paper studies how a non-minimal secluded dark sector can be populated
    through feeble lepton-specific portal operators and produce the observed relic abundance through freeze-out
    or freeze-in.
  status: speculative
  model_kind: effective_field_theory
theory:
