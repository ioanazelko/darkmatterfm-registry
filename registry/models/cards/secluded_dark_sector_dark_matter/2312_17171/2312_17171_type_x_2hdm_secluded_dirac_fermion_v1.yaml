    range: heavy compared with the dark-sector scales
    unit: GeV
    role: core
    status: assumed
    source_reference_ids: []
  embedded_in_larger_framework: 'yes'
  notes: The paper derives dimension-6 four-Fermi operators from a UV-complete Type-X 2HDM extension,
    then works in the EFT limit.
