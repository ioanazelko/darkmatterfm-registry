    description: The related limit is for thermal axion hot dark matter and is not automatically the same
      as the primary cold PQ axion component.
    id: thermal-axion-mapping
    impact_if_violated: A cold misalignment axion has a different cosmological signature.
    scope: axion subcomponent recast
    source_reference_ids:
    - arxiv:0803.1585
    status: assumed
  benchmark_implications:
  - Any sizable thermal axion component must be checked separately from the axino CDM abundance.
  caveats:
  - Recorded as a cautionary related constraint, not a direct exclusion of the axino model.
  constrained_parameters:
  - m_a
  - f_a
  - thermal axion abundance
  - sum m_nu
  constraint_type: cosmological
  data_release: WMAP-5 plus related cosmological data in local hot-axion paper
  excluded_regions:
  - Thermal axion masses above about 1.02 eV are excluded at 95% confidence in the related WMAP-5 hot-DM
    analysis after marginalizing over neutrino masses.
  id: con_axion_hot_dm_limit
  likelihood_available: partial
  likelihood_reference: null
  name: Thermal hot-axion cosmology limit
  notes: null
  observable_channel: hot_dark_matter
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:1004.2326
  - arxiv:0803.1585
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - The result is highly thermal-history dependent and should not be separated from the flaton/PQ sector.
    constraint_ids:
    - con_axino_cdm_abundance
    - con_thermal_inflation_reheat_bbn_baryogenesis
    - con_axion_hot_dm_limit
    derived_quantities:
    - Omega_axino
    - entropy dilution
    - baryon asymmetry
    - thermal axion hot-DM fraction
    description: Map the PQ-extended MSSM thermal-inflation model to axino abundance, moduli/BBN consistency,
      baryogenesis, and axion-subcomponent checks.
    forward_model_chain:
    - inputs:
      - flaton potential
      - f_a
      - T_d
      notes: null
      outputs:
      - thermal-inflation dilution
      - flaton decay rate
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Use the source flaton/PQ thermal-history setup.
    - inputs:
      - T_d
      - f_a
      - m_axino
      - branching fractions
      notes: null
      outputs:
      - Omega_axino
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Recover the primary m_axino about 0.9 GeV abundance target.
    - inputs:
      - NLSP abundance
      - decay rates
      notes: null
      outputs:
      - secondary axino yield
      step_id: s3
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Needed for precise NLSP contribution.
    - inputs:
      - axion thermal/cold abundance
      notes: null
      outputs:
      - hot/cold axion constraint
      step_id: s4
      step_type: recasting
      tool_or_code: null
      validity: Thermal hot-axion limits require a separate mapping.
    id: route_pq_mssm_thermal_inflation_axino_abundance
    input_parameters:
    - m_axino
    - f_a
    - T_d
    - flaton mass/couplings
    - NLSP mass
    - axion misalignment
    likelihoods:
    - relic-density target
    - BBN/moduli consistency
    - baryogenesis target
    - hot axion cosmology
    observable_ids:
    - obs_axino_flation_decay_abundance
    - obs_thermal_inflation_moduli_baryogenesis
    - obs_axion_hot_component
    required_code_resources:
    - decay-network solver
    - thermal-history integrator
    - cosmological hot-DM likelihood
    route_status: planned
    source_model_features:
    - PQ/flaton field
    - thermal inflation
