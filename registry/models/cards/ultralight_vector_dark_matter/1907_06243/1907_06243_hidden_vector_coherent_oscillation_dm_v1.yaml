theory_to_observable_routing:
  routes:
  - id: route_vector_isocurvature_to_cmb
    description: Map the inflationary vector condensate fluctuations to an anisotropic DM-isocurvature
      CMB observable.
    source_model_features:
    - scalar-dependent gauge kinetic function f(phi)^2 F^2
    - homogeneous hidden vector condensate
    - coherent oscillation after H about m
    input_parameters:
    - m
    - A_in
    - H_inf
    - alpha
    - epsilon
    - reheating equation of state
    derived_quantities:
    - P_T(k)
    - P_L(k)
    - S_DM(k)
    - g_S(k)
    - CMB isocurvature likelihood statistic
    forward_model_chain:
    - step_id: solve_vector_modes
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - alpha
      - H_inf
      - m
      outputs:
      - transverse and longitudinal vector spectra
      validity: Valid for the kinetic-function scalings and inflationary approximations in the paper.
      notes: Compute mode functions for the hidden vector perturbations.
    - step_id: build_isocurvature_template
      step_type: data_transform
      tool_or_code: null
      inputs:
      - vector spectra
      - background condensate direction
      outputs:
      - anisotropic isocurvature power spectrum
      validity: Requires tracking the preferred direction.
      notes: Construct S_DM and the angular dependence encoded by g_S.
    - step_id: compare_to_cmb
      step_type: likelihood
      tool_or_code: Boltzmann solver plus anisotropic-isocurvature likelihood
      inputs:
      - anisotropic S_DM template
      outputs:
      - constraint on H_inf, A_in, alpha
      validity: A standard isotropic Planck likelihood is only an approximation.
      notes: A bespoke anisotropic isocurvature likelihood is needed for precision.
    observable_ids:
    - obs_anisotropic_dm_isocurvature
    constraint_ids:
    - con_cmb_isocurvature_amplitude
    - con_inflationary_backreaction_bmode
    likelihoods:
    - Planck isocurvature likelihood after anisotropic-template recast
    required_code_resources:
    - linear perturbation solver
    - CMB Boltzmann solver
    - anisotropic covariance likelihood
    validation_tests:
    - Recover the paper order-of-magnitude S_DM bound in the isotropic limit.
    - Check longitudinal-mode suppression for alpha = -4.
    route_status: planned
    agent_notes: Primary paper provides analytic ingredients, but not a reusable numerical likelihood.
    caveats:
    - Backreaction and reheating assumptions must be propagated.
  - id: route_vector_mass_to_bh_spins
    description: Compare the vector mass to black-hole superradiance spin-exclusion windows.
    source_model_features:
    - ultralight hidden vector mass
    - extremely weak Standard Model coupling
    input_parameters:
