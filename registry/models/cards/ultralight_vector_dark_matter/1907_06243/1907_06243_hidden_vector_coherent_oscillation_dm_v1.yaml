constraints:
- id: con_cmb_isocurvature_amplitude
  name: CMB bound on dark-matter isocurvature amplitude
  constraint_type: cosmological
  observable_channel: cmb:isocurvature
  applies: parameter_dependent
  constrained_parameters:
  - H_inf
  - A_in
  - alpha
  - epsilon
  excluded_regions:
  - Parameter choices that give an uncorrelated DM isocurvature amplitude above the order quoted in the
    paper, S_DM about 9e-6, are disfavored.
  allowed_regions:
  - Small enough H_inf/A_in, or dilution/suppression histories that keep S_DM below the CMB isocurvature
    limit.
  benchmark_implications:
  - For alpha = -4 the paper notes that the isocurvature constraint gives an upper bound comparable to
    the backreaction/B-mode estimate.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: Planck-era CMB isocurvature limits as quoted in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: assume_uncorrelated_isocurvature_mapping
    description: The paper maps the model to an uncorrelated DM isocurvature amplitude before emphasizing
      statistical anisotropy.
    scope: CMB likelihood comparison
    status: assumed
    impact_if_violated: A fully anisotropic likelihood could weaken or strengthen the numerical bound.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1907_06243_primary
    notes: null
  caveats:
  - The isotropic Planck template is not the same as the anisotropic signal predicted here.
  source_reference_ids:
  - src_1907_06243_primary
  notes: null
