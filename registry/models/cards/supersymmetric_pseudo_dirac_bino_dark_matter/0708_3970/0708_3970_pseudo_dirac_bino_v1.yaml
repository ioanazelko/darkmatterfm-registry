  short_description: A phenomenological supersymmetric dark-matter model in which a Dirac bino from D-type
    SUSY breaking is split by electroweak effects into two nearly degenerate Majorana states, with the
    lighter state as dark matter and co-annihilation reducing the relic abundance.
  historical_origin_or_motivation: Motivated by the p-wave suppressed relic abundance of an MSSM Majorana
    bino and the need to avoid large vector direct-detection rates for an unsplit Dirac electroweak state.
