  observable_channel: galactic_center_gamma_rays
  recasting_needed: 'yes'
  robustness: low
  source_reference_ids:
  - '1408_4929'
  - '1411_4647'
theory_to_observable_routing:
  routes:
  - agent_notes: The primary paper identifies a concrete CalcHEP/micrOMEGAs workflow, but the batch did
      not locate reusable model files.
    caveats:
    - Galactic Center interpretation has large astrophysical systematic uncertainty.
    constraint_ids:
    - planck_wmap_relic_density_target
    - lux_xenon100_direct_detection_evasion
    - invisible_higgs_width_constraint
    - fermi_gc_excess_fit
    derived_quantities:
    - Omega_DM h^2
    - annihilation branching fractions
    - Gamma_h_inv
    - sigma_SI
    - gamma-ray spectrum
    description: Compute thermal relic density, direct-detection suppression, invisible Higgs width, and
      Galactic Center gamma-ray spectra for the pseudoscalar Yukawa fermion model.
    forward_model_chain:
    - inputs:
      - Lagrangian parameters
      notes: Use the same CP/mixing conventions.
      outputs:
      - annihilation matrix elements
      step_id: model_implementation
      step_type: other
      tool_or_code: LanHEP/CalcHEP
      validity: Primary paper cross-checks analytic cross sections with CalcHEP.
    - inputs:
      - annihilation cross sections
      notes: Primary paper solves the Boltzmann equation numerically.
      outputs:
      - Omega_DM h^2
      step_id: relic_density
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      validity: Thermal freeze-out for the scanned mass range.
    - inputs:
      - annihilation spectrum
      - Gamma_h_inv
      - velocity-suppressed scattering
      notes: Treat direct detection as suppressed only under the primary pseudoscalar coupling assumptions.
      outputs:
      - GC gamma fit
      - Higgs-width viability
      - direct-detection status
      step_id: signals_and_constraints
      step_type: recasting
      tool_or_code: null
      validity: Requires astrophysical background model for the GC signal.
    id: pseudoscalar_portal_relic_indirect_route
    input_parameters:
    - m_DM
    - m_phi
    - g
    - theta
    - v_phi
    - quartic couplings
    likelihoods:
    - Planck/WMAP relic density
    - LUX/XENON100 spin-independent limits
    - invisible Higgs width
    - Fermi-LAT Galactic Center spectrum
    observable_ids:
    - fermi_gc_gamma_ray_excess_bbar
    - velocity_suppressed_direct_detection
    - thermal_relic_density_and_invisible_higgs
    required_code_resources:
    - LanHEP model implementation
    - CalcHEP
    - micrOMEGAs
    - gamma-ray spectrum/recasting code
    route_status: partially_implemented
    source_model_features:
    - Dirac singlet fermion
    - real pseudoscalar singlet with vev
    - Higgs-pseudoscalar mixing
    - pseudoscalar Yukawa coupling
    validation_tests:
    - Reproduce primary-paper relic-density curves for g = 0.02, 0.08, 0.48 benchmark choices.
    - Verify WIMP-nucleus matrix element velocity suppression in the nonrelativistic limit.
    - Reproduce the 38 GeV b-quark Galactic Center benchmark spectrum.
