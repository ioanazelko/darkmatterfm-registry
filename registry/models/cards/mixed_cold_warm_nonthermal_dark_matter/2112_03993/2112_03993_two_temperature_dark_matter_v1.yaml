- id: con_2tdm_neff_bound
  name: BBN/CMB N_eff bound on hot 2TDM component
  constraint_type: cosmological
  observable_channel: BBN and CMB radiation density
  applies: 'yes'
  constrained_parameters:
  - Delta N_eff
  - A_2
  - m_DM
  - g_*
  excluded_regions:
  - Large hot-component fractions at low m_DM can exceed BBN or CMB Delta N_eff limits.
  allowed_regions:
  - Allowed regions require the hot component to become sufficiently nonrelativistic or remain small enough.
  benchmark_implications:
  - N_eff removes parts of parameter space even when small-scale structure is acceptable.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: BBN and CMB N_eff bounds as implemented in the primary paper
  recasting_needed: partial
  robustness: medium
  assumptions:
  - id: standard-radiation-history
    description: The primary N_eff expression assumes the stated entropy-degree history and standard BBN/CMB
      interpretation.
    scope: radiation density
    status: assumed
    impact_if_violated: Nonstandard entropy injection changes the N_eff mapping.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2112_03993'
    notes: null
  caveats:
  - No BBN or Planck likelihood was rerun.
  source_reference_ids:
  - '2112_03993'
  notes: null
theory_to_observable_routing:
  routes:
  - id: route_2tdm_structure_neff
    description: Construct the two-temperature momentum distribution, compute the transfer function, and
      compare with Ly-alpha, satellites, and N_eff bounds.
    source_model_features:
    - one DM species produced in two decay channels
    - two effective temperatures
    - nonthermal mixed cold/warm distribution
    input_parameters:
    - A_1
    - A_2
    - eta
    - m_DM
    - parent decay histories
    derived_quantities:
    - f(p)
    - T(k)
    - N_sat
    - Delta N_eff
    forward_model_chain:
    - step_id: distribution_builder
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - A_1
      - A_2
      - eta
      outputs:
      - two-component f(p)
      validity: valid for the source 2TDM parameterization
      notes: null
    - step_id: linear_power
      step_type: boltzmann_solver
      tool_or_code: CLASS or equivalent
      inputs:
      - f(p)
      - m_DM
      - cosmology
      outputs:
      - matter power spectrum
      - transfer function
      validity: must support arbitrary nonthermal distribution
      notes: null
    - step_id: constraints
      step_type: likelihood
      tool_or_code: null
      inputs:
      - T(k)
      - N_sat
      - Delta N_eff
      outputs:
      - Ly-alpha/satellite/N_eff exclusions
      validity: likelihoods not run here
      notes: null
    observable_ids:
    - obs_2tdm_matter_power_suppression
    - obs_2tdm_mw_dwarfs
    - obs_2tdm_delta_neff
    constraint_ids:
    - con_2tdm_lya_bound
    - con_2tdm_satellite_bound
    - con_2tdm_neff_bound
    likelihoods: []
    required_code_resources:
    - Boltzmann solver for arbitrary f(p)
    - Ly-alpha likelihood
    - satellite-completeness likelihood
    validation_tests:
    - recover primary A_ref thresholds
    - recover N_eff curves
    route_status: partially_implemented
    agent_notes: null
    caveats:
    - Thermal-WDM equivalence is approximate for two-temperature spectra.
