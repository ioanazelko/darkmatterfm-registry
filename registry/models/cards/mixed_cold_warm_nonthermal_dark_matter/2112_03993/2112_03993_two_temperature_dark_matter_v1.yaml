    through two decay channels at different times, leaving two momentum-temperature subsets that together
    make the observed dark matter abundance.
  historical_origin_or_motivation: Designed to map non-thermal multi-channel dark matter production onto
    structure-formation observables without committing to a specific dark-sector microphysics model.
  status: speculative
  model_kind: phenomenological_parameterization
