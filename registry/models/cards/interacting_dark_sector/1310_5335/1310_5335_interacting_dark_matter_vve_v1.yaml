parameters:
  core:
  - name: Hubble constant
    symbol: H_0
    description: Present-day Hubble parameter fitted in the model.
    value: 70.30-70.79
    unit: km s^-1 Mpc^-1
    role: cosmological
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: The paper quotes best-fit values spanning this range across parameter fits.
  - name: present baryon density fraction
    symbol: Omega_b0
    description: Present baryonic density parameter in the flatness condition.
    value: 0.059^{+0.113}_{-0.107}
    unit: null
    role: cosmological
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: Reported from the Hubble-data fit with priors on the remaining parameters.
  - name: present variable vacuum energy density fraction
    symbol: Omega_x0
    description: Present density fraction of the variable vacuum energy component.
    value: 0.74 +/- 0.07; also 0.77^{+0.07}_{-0.06} in another fit
    unit: null
    role: cosmological
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: The paper reports multiple two-parameter fits involving Omega_x0.
  - name: present dark matter density fraction
    symbol: Omega_m0
    description: Present density fraction of the interacting dark matter component.
    value: 0.202^{+0.015}_{-0.016}
    unit: null
    role: cosmological
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: Best fit reported with H_0 in the Hubble-data analysis.
  - name: dark-sector coupling constant
    symbol: alpha
    description: Coupling controlling the nonlinear interaction source Q between dark matter and variable
      vacuum energy.
    value: 10^-7 used as a fit prior in one example
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '1310_5335'
    notes: The text identifies a coupling constant in Q and later lists a prior value in the statistical
      analysis.
  - name: dark matter barotropic index
    symbol: gamma_m
    description: Barotropic index of the dark matter fluid, p_m=(gamma_m-1) rho_m.
    value: 1.047^{+0.192}_{-0.452}
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: The paper emphasizes that gamma_m above unity makes the dark matter not exactly pressureless.
  derived:
  - name: early variable-vacuum-energy fraction at recombination
    symbol: Omega_x(z~1100)
    description: Predicted variable-vacuum-energy fraction around recombination.
    value: 10^-6 to 10^-5
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: Used by the paper as an internal consistency check of the cosmological history.
  - name: variable-vacuum-energy fraction at BBN
    symbol: Omega_x(z~10^10)
    description: Predicted variable-vacuum-energy fraction around big-bang nucleosynthesis.
    value: 10^-34 to 10^-33
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - '1310_5335'
    notes: The paper states this leaves standard BBN processes undisturbed.
