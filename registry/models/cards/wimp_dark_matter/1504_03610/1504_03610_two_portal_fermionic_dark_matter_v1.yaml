    the Standard Model through both a Higgs-mixed scalar and a leptophobic U(1) prime vector boson.
  historical_origin_or_motivation: Introduced to combine Higgs and vector portals, evade direct-detection
    limits through loop-suppressed nucleon scattering, and allow relic-density and Galactic-center gamma-ray
    explanations.
  status: speculative
  model_kind: complete_theory
