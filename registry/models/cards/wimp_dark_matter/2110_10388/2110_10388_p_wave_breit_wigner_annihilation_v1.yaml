  observable_channel: cosmic_ray_positrons
  applies: 'yes'
  constrained_parameters:
  - m_chi
  - <sigma v>_halo
  - annihilation_channel
  excluded_regions: []
  allowed_regions:
  - 'Muon channel: m_chi about 1-1.4 TeV with <sigma v> about 3.2-5.2e-24 cm^3/s; tau channel: m_chi about
    1.4-2.2 TeV with <sigma v> about 1.1-2.1e-23 cm^3/s.'
  benchmark_implications:
  - Tau channel gives broader positron spectra and is the focus of the primary paper.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: AMS-02 positron flux fit as implemented in primary paper
  recasting_needed: 'no'
  robustness: medium
  assumptions: []
  caveats:
  - AMS-02 fit is model- and propagation-dependent.
  source_reference_ids:
  - src_2110_10388
  notes: null
- id: fermi_dsph_gamma_bound
  name: Fermi-LAT dwarf-spheroidal gamma-ray bound
  constraint_type: indirect_detection
  observable_channel: dwarf_spheroidal_gamma_rays
  applies: parameter_dependent
  constrained_parameters:
  - <sigma v>_dSph
  - delta
  - gamma
  - J_p
  excluded_regions:
  - The paper finds dSph data exclude AMS-favored cross sections mainly for |delta| and gamma near 1e-7
    in the shown parameter slices.
  allowed_regions:
  - For larger |delta|/gamma benchmarks, p-wave Breit-Wigner bounds are weaker than constant-cross-section
    limits and can be compatible with AMS-02.
  benchmark_implications:
  - Velocity-suppressed dSph annihilation is the key reason the p-wave model survives where s-wave models
    struggle.
  likelihood_available: partial
  likelihood_reference: Fermi-LAT PASS8 dSph likelihoods used in primary-paper recast
  data_release: Fermi-LAT six-year PASS8 dSph data
  recasting_needed: 'yes'
  robustness: medium
  assumptions: []
  caveats:
  - Requires recalculating velocity-dependent J factors for the target dSph sample.
  source_reference_ids:
  - src_2110_10388
  notes: null
- id: cmb_recombination_annihilation_bound
  name: Planck CMB annihilation bound at recombination
  constraint_type: cosmological
  observable_channel: cmb
  applies: parameter_dependent
  constrained_parameters:
  - <sigma v>_recombination
  - delta
  - gamma
  excluded_regions:
  - Constant or s-wave Breit-Wigner cross sections large enough for AMS-02 are excluded by CMB energy-injection
    bounds.
  allowed_regions:
  - The p-wave Breit-Wigner benchmark has a very small recombination-velocity cross section and evades
    the CMB bound in the primary paper.
  benchmark_implications:
  - The viable route requires the annihilation rate to fall at extremely low velocity.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: Planck CMB comparison quoted/recast in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions: []
  caveats:
  - Energy-deposition efficiencies are not tabulated in this enrichment row.
  source_reference_ids:
  - src_2110_10388
  - src_1310_3815
  notes: null
theory_to_observable_routing:
  routes:
  - id: route_bw_indirect_detection
    description: Fit positron data, impose relic density, and recast dSph/CMB constraints for p-wave Breit-Wigner
      annihilation.
    source_model_features:
    - fermionic TeV DM
    - narrow scalar resonance
    - p-wave annihilation to charged leptons
    input_parameters:
    - m_chi
    - delta
    - gamma
    - kinetic decoupling temperature
    - annihilation channel
    derived_quantities:
    - velocity-dependent <sigma v>
    - thermal relic abundance
    - AMS-02 positron spectrum
    - dSph gamma flux
    - CMB energy injection
    forward_model_chain:
    - step_id: positron_fit
      step_type: simulation
      tool_or_code: GALPROP v54 + PYTHIA 8.2 + MultiNest in primary paper
      inputs:
      - m_chi
      - <sigma v>
      - channel
      - background normalization
      outputs:
      - AMS-02 posterior region
      validity: Uses the propagation/background setup adopted by the primary paper.
      notes: null
    - step_id: relic_density
      step_type: boltzmann_solver
      tool_or_code: Boltzmann equation with kinetic decoupling
      inputs:
      - delta
      - gamma
      - x_kd
      outputs:
      - b normalization
      - Omega h^2
      validity: Kinetic decoupling can change relic density under Breit-Wigner enhancement.
      notes: null
    - step_id: gamma_cmb_recast
      step_type: recasting
      tool_or_code: Fermi-LAT dSph and Planck comparisons
      inputs:
      - velocity-dependent J factors
      - <sigma v>(v)
      outputs:
      - dSph upper limits
      - CMB viability
      validity: Requires velocity-dependent J-factor treatment.
      notes: null
    observable_ids:
    - ams02_positron_excess_fit
    - velocity_peaked_annihilation
    constraint_ids:
    - ams02_target_region
    - fermi_dsph_gamma_bound
    - cmb_recombination_annihilation_bound
    likelihoods:
    - Fermi-LAT dSph likelihoods in primary-paper recast; no reusable likelihood file found.
    required_code_resources:
    - GALPROP
    - PYTHIA
    - MultiNest
    - velocity-dependent dSph J-factor code
    validation_tests:
    - Reproduce the benchmark curve peaking at 220 km/s and the 15-dSph combined limits.
    route_status: partially_implemented
    agent_notes: The route is described with named tools in the paper, but no associated code release
      was identified in the assignment row.
    caveats:
    - H.E.S.S. Galactic Center and isotropic gamma-ray background constraints are explicitly not included
      by the primary paper because of additional uncertainties.
