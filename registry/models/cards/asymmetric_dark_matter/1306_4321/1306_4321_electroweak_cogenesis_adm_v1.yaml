symmetries:
  stabilizing_mechanism: An exact U(1)_DM symmetry is restored at low temperature; S_1 is the lightest
    field carrying this charge and is stable, while S_2 decays to S_1.
  symmetries:
  - name: U(1)_DM
    type: global
    exact_or_approximate: exact
    breaking: Spontaneously broken in the early universe by a U(1)_DM-charged singlet VEV and restored
      during the electroweak phase transition.
    breaking_scale: null
  - name: U(1)_B
    type: global
    exact_or_approximate: broken
    breaking: Violated by electroweak sphalerons before baryon number is restored during the electroweak
      phase transition.
    breaking_scale: null
  - name: softly broken Type-II 2HDM parity
    type: discrete
    exact_or_approximate: broken
    breaking: Soft breaking is assumed to evade flavor-changing neutral-current constraints.
    breaking_scale: null
  topological_defects_possible: unknown
