identity:
  name: Electroweak cogenesis asymmetric scalar dark matter
  family: asymmetric_dark_matter
  aliases:
  - electroweak cogenesis
  - 2HDM plus two complex singlet ADM
  short_description: A renormalizable asymmetric dark matter model in which a Type-II two-Higgs-doublet
    sector plus two U(1)_DM-charged complex singlets generate baryon and dark matter asymmetries during
    the electroweak phase transition.
  historical_origin_or_motivation: Proposed to tie the dark matter mass to the weak scale while generating
    baryon and dark matter asymmetries together, avoiding light dark mediators by using Higgs portal annihilation.
  status: speculative
  model_kind: complete_theory
