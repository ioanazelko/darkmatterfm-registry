    range: perturbative scan suggests m_2 roughly below 300 GeV for lambda_2 < 4
    unit: GeV
    role: core
    status: approximate
  - name: H_2-S_2 portal coupling
    symbol: lambda_2
    description: Portal coupling important for the first-order phase-transition barrier.
    range: perturbative values up to about 4 in the paper scan
    role: core
    status: assumed
  - name: small asymmetry-transfer coupling
    symbol: eta_1
    description: Small coupling controlling S_1-S_2 asymmetry transfer in the bubble wall.
    value: order 2e-3 times mass/phase factors in the paper estimate
    role: core
    status: approximate
  - name: critical temperature
    symbol: T_c
    description: Critical temperature of the electroweak phase transition.
    unit: GeV
    role: cosmological
    status: inferred
  - name: critical Higgs VEV
    symbol: v_c
    description: Higgs-direction critical VEV; strong first-order transition requires v_c/T_c > 0.9.
    role: cosmological
    status: inferred
  - name: critical singlet VEV
    symbol: w_c
    description: S_2-direction critical VEV before the transition.
    role: cosmological
    status: inferred
  - name: bubble wall passage time
    symbol: t_wall
    description: Wall width divided by velocity in the thick-wall approximation.
    role: cosmological
    status: assumed
  nuisance: []
  derived:
  - name: dark-to-baryon asymmetry ratio
    symbol: n_DM/n_B
    description: Controlled by model parameters and matched to the observed abundance ratio.
    value: 5.4 GeV / m_1 in the paper notation
    role: derived
    status: inferred
  - name: symmetric annihilation threshold
    symbol: <sigma v>
    description: Higgs-portal annihilation should be stronger than a thermal WIMP value to deplete the
      symmetric component.
    range: greater than about 3e-26 cm^3/s
    unit: cm^3/s
    role: derived
    status: assumed
