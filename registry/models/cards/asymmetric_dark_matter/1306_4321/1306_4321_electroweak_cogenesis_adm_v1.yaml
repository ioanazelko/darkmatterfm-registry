parameters:
  core:
  - name: dark matter mass
    symbol: m_1
    description: Physical mass of the stable lighter singlet S_1.
    role: core
    status: assumed
  - name: heavier singlet mass
    symbol: m_2
    description: Physical mass of S_2, with m_1 < m_2 and phase-transition requirements correlating larger
