  embedded_in_larger_framework: 'yes'
  notes: The paper gives the renormalizable scalar potential for H_1, H_2, S_1, and S_2 and develops the
    electroweak phase-transition and asymmetry-generation mechanism.
particle_content:
  dark_matter_candidate:
    name: lighter complex singlet scalar S_1
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
