  - mirror-like dark sector
  - WIMP baryogenesis
  - extra-dimensional UV realization
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper writes a working potential for visible and dark WIMP-baryogenesis sectors plus a singlet
    reheaton, and gives a higher-dimensional symmetry-breaking realization while not committing to a specific
    hierarchy-problem solution.
