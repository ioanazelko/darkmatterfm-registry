identity:
  name: Mirror-sector dark neutron WIMP-baryogenesis model
  family: asymmetric_dark_matter
  aliases:
  - dark neutron dark matter
  - related dark sector with parallel dark baryogenesis
  short_description: A related visible/dark-sector construction in which stable dark neutrons make the
    dark matter and comparable baryon and dark matter abundances arise from parallel WIMP baryogenesis
    plus asymmetric reheating.
  historical_origin_or_motivation: Motivated by the observed baryon/dark matter abundance coincidence
    and by an approximate exchange symmetry between a Standard Model-like visible sector and a dark counterpart.
  status: speculative
  model_kind: complete_theory
theory:
