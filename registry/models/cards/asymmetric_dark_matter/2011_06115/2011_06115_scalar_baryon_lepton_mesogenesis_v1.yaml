    name: Z2-odd scalar dark lepton and scalar dark baryon states
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - dark Dirac fermion mediator
  - dark-sector Dirac baryon with B=-1
  - light dark lepton produced in pion decays
  mediators:
  - dark Dirac fermion mediator
  - colored scalar mediator coupling dark baryons to SM quarks
