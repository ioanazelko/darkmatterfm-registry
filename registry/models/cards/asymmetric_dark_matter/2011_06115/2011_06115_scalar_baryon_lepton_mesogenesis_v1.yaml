  - other
  standard_model_targets:
  - charged pions
  - charged leptons
  - SM baryons
  - SM quarks
  dark_sector_couplings:
  - Yukawa coupling y_b to the dark baryon
  - Yukawa coupling y_l to the dark lepton
  - baryon-number-conserving dark scattering
  mediator_types:
  - dark Dirac fermion
  - colored scalar
  - possible dark photon for symmetric-component depletion
  interaction_operators:
  - effective pion decay operator to a charged lepton plus dark lepton
  - effective SM-quark to dark-baryon operator
  annihilation_channels:
  - symmetric dark-sector components must annihilate through additional dark-sector interactions
  self_scattering_channels:
  - dark lepton plus scalar state to scalar dark baryon plus dark baryon intermediate
  tree_or_loop_level: tree
parameters:
