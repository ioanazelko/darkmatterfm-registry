  - asymmetric dark matter
  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: unknown
  notes: The paper gives toy-model Yukawa interactions and uses an effective dark-baryon coupling to SM
    quarks from a colored scalar mediator.
particle_content:
