    symbol: T_R
    description: Temperature of the late decay producing D mesons.
    range:
      min: 3.5
      max: 20
      unit: MeV
      notes: Range quoted to keep D meson decays out of equilibrium and before neutrino decoupling.
    unit: MeV
    role: cosmological
    status: inferred
  - name: baryon-transfer cross section
    symbol: <sigma v>
    description: Thermally averaged cross section required for efficient transfer of the dark lepton asymmetry.
    range: greater than about 1e-16 GeV^-2 in the model-independent estimate; Model 1 gives about 1e-15
      GeV^-2 for a benchmark
    unit: GeV^-2
    role: core
    status: inferred
  - name: dark baryon mass lower bound
    symbol: m_dark_baryon
    description: Mass of a dark-sector state carrying baryon number.
    range: greater than 1.2 GeV
    unit: GeV
    role: core
    status: inferred
  - name: Model 1 proof-of-principle masses
    symbol: m_i
    description: Illustrative mass choices for the scalar states and mediator.
    range: paper quotes example scales including 10 MeV, 10 GeV, and 20 GeV entries with m_dark_baryon
      about 5 GeV
    unit: mixed
    role: core
    status: inferred
  - name: Yukawa product
    symbol: y_l y_b
    description: Product of the Model 1 dark-sector Yukawa couplings.
    range: appears in the proof-of-principle cross section estimate
    role: core
    status: inferred
