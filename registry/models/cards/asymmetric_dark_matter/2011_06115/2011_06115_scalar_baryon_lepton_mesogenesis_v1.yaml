identity:
  name: Scalar baryon and lepton mesogenesis dark matter
  family: asymmetric_dark_matter
  aliases:
  - Model 1 scalar baryon/lepton 20 MeV mesogenesis
  short_description: A Z2-stabilized asymmetric dark matter toy model in which scalar dark lepton and
    scalar dark baryon components are produced through low-temperature mesogenesis.
  historical_origin_or_motivation: Motivated by tying the baryon asymmetry and asymmetric dark matter
    to CP-violating charged D meson decays near 20 MeV.
  status: speculative
  model_kind: simplified_model
theory:
