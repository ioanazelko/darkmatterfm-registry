  - fermionic leptobaryon dark sector
  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: unknown
  notes: The model is presented as a toy dark sector with Yukawa interactions and an effective coupling
    of a dark baryon to SM quarks.
particle_content:
