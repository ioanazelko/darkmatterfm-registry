identity:
  name: Fermionic leptobaryon mesogenesis dark matter
  family: asymmetric_dark_matter
  aliases:
  - Model 2 fermionic leptobaryon 20 MeV mesogenesis
  short_description: A Z2-stabilized asymmetric dark matter toy model where fermionic leptobaryon dark-sector
    states participate in low-scale mesogenesis and partly comprise the relic dark matter.
  historical_origin_or_motivation: Motivated by using charged D meson CP violation at tens of MeV to generate
    both the baryon asymmetry and asymmetric dark matter.
  status: speculative
  model_kind: simplified_model
theory:
