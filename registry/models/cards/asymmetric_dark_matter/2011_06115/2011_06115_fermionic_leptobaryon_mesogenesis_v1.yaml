    name: Z2-odd fermionic leptobaryon state and possibly a neutral fermion state
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - scalar lepton mediator with L=1
  - dark-sector Dirac baryon with B=-1
  - light dark lepton from pion decay
  mediators:
  - dark scalar lepton mediator
  - colored scalar mediator coupling dark baryons to SM quarks
  - unspecified mediator for pion decay operator
  long_lived_particles:
  - Z2-odd fermionic leptobaryon
  - possibly the lighter neutral fermion
  unstable_parent_particles:
  - late-decaying inflaton-like scalar
  - charged D mesons
  - charged pions
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A discrete Z2 symmetry stabilizes the fermionic dark-sector states carrying the
    asymmetric relic.
