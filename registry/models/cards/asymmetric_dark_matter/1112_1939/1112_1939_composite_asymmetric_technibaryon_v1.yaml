      outputs:
      - allowed m_S/asymmetry suppression
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Assumes neutral stable S.
    - inputs:
      - m_S
      - M
      - operator dimension
      notes: Estimate lifetime for technibaryon-number violation.
      outputs:
      - tau_TB
      step_id: s3
      step_type: analytic_formula
      tool_or_code: null
      validity: Dimension-six operator assumption.
    - inputs:
      - technicolor spectrum
      - neutrino nature
      notes: Compare to LHC/LEP and neutrinoless-double-beta constraints.
      outputs:
      - collider and neutrino constraints
      step_id: s4
      step_type: recasting
      tool_or_code: null
      validity: Implementation dependent.
