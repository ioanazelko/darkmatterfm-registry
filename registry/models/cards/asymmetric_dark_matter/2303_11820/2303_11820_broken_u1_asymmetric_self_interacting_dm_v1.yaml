identity:
  name: Spontaneously broken U(1)' asymmetric self-interacting dark matter
  family: asymmetric_dark_matter
  aliases:
  - broken U(1)' asymmetric self-interacting DM
  short_description: A nearly decoupled dark U(1)' model with a Dirac fermion dark matter particle, a
    massive dark gauge boson mediator, two dark Higgs fields, and a heavy-fermion decay source of the
    DM asymmetry.
  historical_origin_or_motivation: The model combines asymmetric dark matter with a light mediator to
    address small-scale-structure self-interactions while suppressing late annihilation.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - dark U(1)' gauge theory
  - asymmetric dark matter
  - self-interacting dark matter
  - Abelian Higgs dark phase transition
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper writes L_SM + L_Dark + L_Portal and then analyzes a simplified nearly independent dark-sector
    scenario with tiny portals to the SM.
particle_content:
  dark_matter_candidate:
    name: Dirac fermion chi charged under U(1) prime
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - dark Higgs S_1
  - dark Higgs S_2
  - heavy Majorana fermions N_1 and N_2
  mediators:
  - massive U(1)' gauge boson A_prime
  - dark Higgs scalar s_2
  dark_radiation_species:
  - nearly massless S_1
  unstable_parent_particles:
  - N_1
  - N_2
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark matter carries U(1)' charge and the paper introduces S_2, rather than
    giving S_1 a vev, to avoid an induced Majorana mass and late chi-anti-chi oscillations.
  symmetries:
  - name: U(1)'
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneous breaking by S_2 vev gives mass to A_prime
  - name: dark matter asymmetry
    type: global
    exact_or_approximate: approximate
    breaking: residual anti-DM abundance is depleted by annihilation
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  - neutrino
  standard_model_targets:
  - SM Higgs doublet
  - hypercharge/photon through kinetic mixing
  - SM lepton doublets in the general RHN portal
  dark_sector_couplings:
  - U(1)' gauge coupling g_prime
  - dark fine-structure coupling alpha_prime
  - Yukawa couplings y_prime_i for N_i S_1 chi
  mediator_types:
  - light vector mediator
  - dark Higgs
  - heavy neutral fermion
  annihilation_channels:
  - chi anti-chi annihilation to light dark mediators in the secluded channel
  self_scattering_channels:
  - chi-chi elastic scattering through the massive dark gauge boson
  tree_or_loop_level: tree
