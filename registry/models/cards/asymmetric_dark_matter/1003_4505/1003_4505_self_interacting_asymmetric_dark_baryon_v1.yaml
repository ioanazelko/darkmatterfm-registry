identity:
  name: Self-interacting asymmetric dark baryon
  family: asymmetric_dark_matter
  aliases:
  - self-interacting ADM
  - 5 GeV dark baryon
  - asymmetric dark matter with self-capture
  short_description: A phenomenological asymmetric dark-matter model in which a roughly 5 GeV dark baryon
    has a baryon-like relic asymmetry, significant self-interactions, and no post-capture annihilation
    in the Sun.
  historical_origin_or_motivation: The model is motivated by the similarity of baryon and dark-matter
    abundances, possible strongly coupled dark baryons or technibaryons, small-scale structure motivations
    for self-interactions, and the solar composition problem.
  status: speculative
  model_kind: phenomenological_parameterization
