  embedded_in_larger_framework: 'yes'
  notes: The paper gives an SU(3)_C x SU(2)_L x SU(2)_D x U(1)_Y x Z_3 invariant Lagrangian with two singlet
    right-handed neutrinos, dark fermion doublets, and dark scalar doublets.
particle_content:
  dark_matter_candidate:
    name: psi_1, the lightest component of the first dark SU(2)_D fermion doublet
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
