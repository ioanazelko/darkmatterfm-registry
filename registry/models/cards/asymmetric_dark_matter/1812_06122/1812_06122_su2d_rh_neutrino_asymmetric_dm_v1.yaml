  short_description: A hidden SU(2)_D sector with a stable fermion psi_1 whose asymmetric abundance is
    produced by right-handed-neutrino decays that also generate lepton asymmetry and neutrino masses.
  historical_origin_or_motivation: The paper builds a common-origin explanation of neutrino mass, baryon
    asymmetry, and dark matter using two right-handed neutrinos as connectors to a dark SU(2)_D sector.
  status: speculative
  model_kind: complete_theory
