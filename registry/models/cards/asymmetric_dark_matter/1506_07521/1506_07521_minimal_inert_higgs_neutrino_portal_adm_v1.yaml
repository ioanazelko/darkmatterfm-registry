  family: asymmetric_dark_matter
  aliases:
  - minimal inert two-Higgs-doublet neutrino portal ADM
  short_description: A UV-complete asymmetric dark matter construction using the neutrino portal L H,
    a dark scalar dark matter candidate, heavy exotic fermions, and one inert Higgs-doublet mediator;
    the paper finds this minimal version cannot generate the observed asymmetry.
  historical_origin_or_motivation: Motivated by linking the baryon and dark matter abundances through
    CP-violating scatterings during freeze-out while stabilizing dark matter by a parity symmetry.
  status: excluded
  model_kind: complete_theory
