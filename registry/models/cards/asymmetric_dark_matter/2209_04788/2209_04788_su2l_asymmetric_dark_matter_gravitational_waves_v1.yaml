    forward_model_chain:
    - inputs:
      - scalar potential parameters
      - temperature
      notes: null
      outputs:
      - finite-temperature effective potential
      step_id: effective_potential
      step_type: analytic_formula
      tool_or_code: null
      validity: uses high-temperature effective potential as in primary paper
    - inputs:
      - effective potential
      notes: null
      outputs:
      - Euclidean action
      - T_star
      step_id: bounce
      step_type: simulation
      tool_or_code: null
      validity: requires numerical bounce solver
    - inputs:
      - T_star
      - alpha_PT
      - beta_over_H
      - wall velocity
      notes: null
      outputs:
      - sound-wave, collision, turbulence spectra
      step_id: gw_spectrum
      step_type: analytic_formula
      tool_or_code: null
      validity: standard phase-transition GW formulae
    - inputs:
      - Omega_GW(f)
      - sensitivity curves
      notes: null
      outputs:
      - detectability flags
      step_id: detector_compare
      step_type: data_transform
      tool_or_code: null
      validity: benchmark comparison, not likelihood
    id: route_su2ell_gw
    input_parameters:
    - v_ell
    - g_ell
    - lambda_i
    - m12_squared
    - Yukawa couplings
    - wall velocity
    likelihoods:
    - GW detector sensitivity curves
    - LEP-II bound
    - CDMSlite loop-level recast
    observable_ids:
    - obs_first_order_phase_transition_gw
    - obs_suppressed_direct_detection
    - obs_vacuum_domain_wall_caveat
    required_code_resources:
    - finite-temperature effective-potential/bounce solver
    - GW spectrum calculator
    - detector sensitivity curves
    route_status: planned
    source_model_features:
    - SU(2)_ell leptonic gauge symmetry
    - asymmetric dark matter
    - first-order phase transition
    - multi-vacuum scalar potential
    validation_tests:
    - Reproduce the three benchmark spectra qualitatively
    - Verify v_ell benchmarks exceed 1.7 TeV
    - Check CDMSlite weaker-than-LEP statement for benchmark m_chi
