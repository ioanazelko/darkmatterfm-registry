  - cold-dark-matter cosmology on large scales
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper postulates an improved Lagrangian with fields phi_plus and phi_minus, a function f(K_plus
    + K_minus - m^2), a baryon-density coupling to phi_plus, and a quartic superfluid sector for phi_minus.
