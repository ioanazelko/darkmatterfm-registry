identity:
  name: Two-field superfluid dark matter
  family: superfluid_dark_matter
  aliases:
  - two-field SFDM
  - improved superfluid dark matter
  short_description: An effective two-field superfluid dark matter model that separates the MOND-like
    phonon force from the superfluid energy density, using one field for the baryon-coupled force and
    another shift-symmetric field for the condensate density.
  historical_origin_or_motivation: The model is proposed to resolve tensions in standard superfluid dark
    matter, where one phonon field must both mediate a MOND-like force and carry the superfluid energy
    density.
  status: speculative
  model_kind: effective_field_theory
