    ratio, with a minimum acceleration below which the equilibrium may fail.
  status: established
  extrapolation_risk: medium
  caveats:
  - The exact condition varies with galaxy and radius through the chemical-potential/gravitational-potential
    ratio.
  source_reference_ids:
