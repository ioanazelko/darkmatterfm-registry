  short_description: A Standard Model extension by a complex scalar singlet S in which the imaginary component
    of S is dark matter, CP symmetry stabilizes it, and a small linear S term biases otherwise stable
    Z2 domain walls.
  historical_origin_or_motivation: The paper studies the minimal CP-conserving cxSM setup with U(1)-breaking
    S and S^2 terms to connect unstable domain walls, gravitational waves, and the dark matter relic density.
  status: speculative
  model_kind: complete_theory
