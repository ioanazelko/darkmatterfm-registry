  - Higgs portal
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The scalar potential V0(H,S) contains H^dagger H, |S|^2, H^dagger H|S|^2, |S|^4, a1 S, and b1
    S^2 plus Hermitian conjugate terms, with real a1 and b1 in the CP-conserving analysis.
