identity:
  name: Kreuzer-Skarke type IIB axiverse dark matter ensemble
  family: axion_like_dark_matter
  aliases:
  - Kreuzer-Skarke axiverse
  - type IIB string axiverse
  - many-axion dark matter ensemble
  short_description: A low-energy ensemble of many closed-string axions from type IIB Calabi-Yau compactifications,
    with dark matter produced mainly by vacuum realignment and, depending on reheating, by Primakoff freeze-in
    or freeze-out.
  historical_origin_or_motivation: The paper studies how ultraviolet geometry suppresses axion-photon
    couplings and how the resulting axion ensemble contributes to dark matter and dark radiation.
  status: emerging
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - type IIB string compactifications on Calabi-Yau hypersurface orientifolds
  - Kreuzer-Skarke database compactification ensemble
  lagrangian_available: 'yes'
  renormalizable: not_applicable
  embedded_in_larger_framework: 'yes'
  notes: The paper writes an N-axion EFT with kinetic matrix, instanton-generated potential, and electromagnetic
    charge vector, then computes mass eigenstates and photon couplings from compactification data.
