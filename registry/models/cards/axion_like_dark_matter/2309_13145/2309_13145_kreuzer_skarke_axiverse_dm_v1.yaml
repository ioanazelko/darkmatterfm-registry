  - many C_4 axions from four-cycles
  mediators: []
  dark_radiation_species:
  - relativistic axions from Primakoff production or axion decays
  excited_or_degenerate_states:
  - neighboring axion mass eigenstates in hierarchical spectra
  long_lived_particles:
  - light or weakly photon-coupled axions
  unstable_parent_particles:
  - heavier axions that can decay to photons or lighter axions
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Axion shift symmetries protect the light fields, while Euclidean D3-brane instantons
    generate small masses and allow decays for some heavier states.
  symmetries:
  - name: axion discrete shift symmetries
    type: shift
    exact_or_approximate: broken
    breaking: instanton-generated potential terms with integer charge matrix
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - axion
  standard_model_targets:
  - photons/electromagnetism
  - gluons for the QCD axion
  dark_sector_couplings:
  - axion-photon coupling g_a
  - instanton-induced axion self-interactions
  - axion-axion flavor-changing couplings
  mediator_types: []
  interaction_operators:
  - g_a a F Ftilde
  - instanton cosine potentials
  - quartic axion self-interactions
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: not_applicable
