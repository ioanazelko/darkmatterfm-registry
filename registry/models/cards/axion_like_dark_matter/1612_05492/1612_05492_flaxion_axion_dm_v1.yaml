identity:
  name: Flaxion axion dark matter
  family: axion_like_dark_matter
  aliases:
  - flavor axion
  - flavon QCD axion
  - flaxion coherent-oscillation dark matter
  short_description: A minimal Standard Model extension with one complex flavon whose CP-odd angular mode
    is a QCD axion, solving strong CP and providing dark matter through coherent flaxion oscillations.
  historical_origin_or_motivation: The model unifies a Froggatt-Nielsen flavor U(1) with a Peccei-Quinn
    symmetry to address flavor hierarchies, strong CP, neutrino masses, dark matter, baryogenesis, and
    inflation.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - Froggatt-Nielsen flavor symmetry
  - Peccei-Quinn mechanism
  - QCD axion
  - flavon inflation
  lagrangian_available: 'yes'
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes Yukawa operators with powers of the flavon over a cutoff scale and gives anomaly-induced
    axion-gluon and axion-photon interactions.
particle_content:
  dark_matter_candidate:
    name: flaxion a, the CP-odd component of the flavon
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
