  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The angular flavon mode is protected by a global U(1)_F/PQ shift symmetry up
    to the QCD anomaly and is cosmologically long-lived like an invisible QCD axion.
  symmetries:
  - name: U(1)_F / Peccei-Quinn symmetry
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by the flavon vacuum expectation value and explicitly anomalous under
      QCD
    breaking_scale:
      name: flavon vev
      symbol: v_phi
      range: O(1e13-1e16)
      unit: GeV
      role: core
      status: inferred
  - name: axion shift symmetry
    type: shift
    exact_or_approximate: approximate
    breaking: QCD instanton effects generate the flaxion potential
    breaking_scale: null
  topological_defects_possible: 'yes'
interactions:
  portals:
  - axion
  - other
  standard_model_targets:
  - gluons
  - photons
  - quarks
  - charged leptons
  - Higgs bosons
  - right-handed neutrinos
  dark_sector_couplings:
  - flavon Yukawa operators generate SM flavor hierarchies and right-handed neutrino masses
  - flaxion couples through QCD and electromagnetic anomalies and flavor-changing fermion couplings
  mediator_types:
  - pseudoscalar axion
  - scalar flavon
  interaction_operators:
  - (g_s^2/32 pi^2) (a/f_a) G Gtilde
  - (e^2/32 pi^2) g_a (a/f_a) F Ftilde
  - flavon-suppressed Yukawa operators (phi/M)^n
  scattering:
