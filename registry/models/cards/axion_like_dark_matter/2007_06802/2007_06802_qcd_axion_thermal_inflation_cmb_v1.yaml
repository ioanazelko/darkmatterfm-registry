identity:
  name: QCD-like axion CMB-anisotropy scenario with thermal-inflation dilution
  family: axion_like_dark_matter
  aliases:
  - QCD axion with post-QCD thermal inflation
  - axion-isocurvature CMB scenario
  short_description: A QCD-like axion scenario where primordial axion fluctuations generate the CMB anisotropy,
    while low-scale thermal inflation after the QCD transition dilutes the axion to a small present-day
    CDM fraction.
  historical_origin_or_motivation: The paper asks whether QCD-axion-like fluctuations, rather than inflaton
    perturbations, can dominate CMB anisotropy without violating isocurvature and non-Gaussianity requirements.
  status: speculative
  model_kind: phenomenological_parameterization
theory:
  theory_level: phenomenological_parameterization
  parent_frameworks:
  - QCD axion
  - curvaton/isocurvature-to-adiabatic fluctuation scenario
  - low-scale thermal inflation
  - classically conformal B-L model realization
  lagrangian_available: partial
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies the QCD axion potential and thermal-inflation cosmological evolution; the
    classically conformal B-L realization is discussed as a candidate requiring modifications.
particle_content:
  dark_matter_candidate:
    name: QCD-like axion A
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: subcomponent
  additional_dark_sector_particles:
