symmetries:
  stabilizing_mechanism: PQ/shift symmetry keeps the axion light before QCD effects generate the potential;
    the late axion abundance is diluted to a small CDM fraction.
  symmetries:
  - name: Peccei-Quinn/axion shift symmetry
    type: global
    exact_or_approximate: broken
    breaking: PQ symmetry is assumed broken before primordial inflation; QCD effects generate the axion
      potential at T_A near T_QCD.
    breaking_scale:
      name: axion decay constant
      symbol: f_A
      description: Axion decay constant
      range: examples use 10^12 GeV scaling
      unit: GeV
      role: core
      status: inferred
  - name: B-L
    type: gauge
    exact_or_approximate: broken
    breaking: In the explicit classically conformal model, B-L breaking and electroweak supercooling source
      thermal inflation.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
