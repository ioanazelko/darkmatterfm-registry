    symbol: f_A
    description: Axion decay constant used in m_A0 and fluctuation amplitude
    range: examples scale around 10^12
    unit: GeV
    role: core
    status: inferred
  - name: primordial axion fluctuation amplitude
    symbol: H_exit/(f_A theta_ini)
    description: Controls scalar amplitude in the scenario
    role: core
    status: inferred
  - name: axion-to-radiation ratio at potential generation
    symbol: R
    description: R=rho_A/rho_r when the axion potential is generated
    range:
      min: '0.01'
      max: '1'
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Required range quoted for CMB consistency
    role: core
    status: inferred
  - name: present axion CDM fraction
    symbol: r_A
    description: r_A=Omega_A/Omega_CDM today; must be small to satisfy isocurvature requirements
    range: small, tunable value
    role: core
    status: inferred
  - name: thermal-inflation temperature
    symbol: T_TI
    description: Temperature/Hubble scale specifying the thermal inflation model
    role: core
    status: inferred
  - name: post-QCD thermal-inflation e-folding
    symbol: Delta_end
    description: Number of e-folds from T_QCD to the end of thermal inflation
    value: examples Delta_end=3 and 10
    role: core
    status: inferred
  - name: QCD transition temperature
    symbol: T_QCD
    description: Temperature where the QCD axion potential turns on
    value: '150'
    unit: MeV
    role: core
    status: inferred
  - name: axion angle at QCD
    symbol: theta_QCD
    description: Angle near pi/2 needed to evade f_NL non-Gaussianity bound
    range: near pi/2
    role: core
    status: inferred
