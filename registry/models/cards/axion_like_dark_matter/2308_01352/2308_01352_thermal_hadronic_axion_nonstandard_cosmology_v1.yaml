    - step_id: s1
      step_type: boltzmann_solver
      tool_or_code: axion interaction-rate integration from primary paper
      inputs:
      - m_a
      - f_a
      - T_end
      - w
      outputs:
      - thermalization condition
      - axion phase-space temperature
      validity: valid for smooth gluon/photon rates used in the paper
      notes: Solve production through the nonstandard era.
    - step_id: s2
      step_type: data_transform
      tool_or_code: null
      inputs:
      - axion temperature
      - yield
      outputs:
      - Delta N_eff
      - Omega_a^thermal
      validity: relativistic decoupling approximation where applicable
      notes: Project to CMB/BBN variables.
    - step_id: s3
      step_type: transfer_function
      tool_or_code: Boltzmann/LSS recast required
      inputs:
      - thermal axion mass
      - temperature
      outputs:
      - matter-power suppression
      validity: requires external LSS likelihood
      notes: Compute free-streaming suppression.
