constraints:
- id: cons_neff_planck_cmbs4
  name: Planck and CMB-S4 N_eff limits on thermal axions
  constraint_type: cosmological
  observable_channel: CMB N_eff
  applies: parameter_dependent
  constrained_parameters:
  - m_a
  - T_d
  - T_end
  excluded_regions:
  - Thermal axion histories yielding excessive Delta N_eff are excluded by Planck/BBN constraints.
  allowed_regions:
  - Planck 2018 gives N_eff = 2.99 +/- 0.17; CMB-S4 projected sensitivity to Delta N_eff about 0.06 at
    95% CL.
  benchmark_implications:
  - Thermalization delayed by LTR or kination can evade or weaken the standard thermal axion bound.
  likelihood_available: approximate
  likelihood_reference: null
  data_release: Planck 2018; projected CMB-S4 sensitivity quoted in primary paper
  recasting_needed: partial
  robustness: high
  assumptions:
  - id: assume_thermal_equilibrium_when_reached
    description: The N_eff bound is applied only in histories where a thermal axion population is actually
      established.
    scope: thermal axion cosmology
    status: assumed
    impact_if_violated: If axions never equilibrate, the bound changes to a freeze-in abundance calculation.
    can_be_relaxed: partial
    source_reference_ids:
    - '2308_01352'
  caveats:
  - Photon coupling alone is not enough to place the CMB-decoupling constraint in the primary analysis.
  source_reference_ids:
  - '2308_01352'
  - '0711_1352'
  - '2104_03982'
  notes: No numerical contour digitization included.
