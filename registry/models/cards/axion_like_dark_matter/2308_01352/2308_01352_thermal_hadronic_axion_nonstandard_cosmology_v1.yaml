  routes:
  - id: route_thermal_axion_history
    description: Compute thermal axion production in a nonstandard pre-BBN history and project to N_eff
      and LSS observables.
    source_model_features:
    - hadronic axion gluon/photon couplings
    - LTR/EMD/kination-like expansion
    input_parameters:
