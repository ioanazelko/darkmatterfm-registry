    the minihalo radius and the gravitational condensation time to satisfy the paper conditions.
  valid_range: paper uses thresholds such as m_a v_a R_halo around 50-100 and m_a v_a^2 tau_gr around
    1e5-1e6 for plotted regions
  status: approximate
  extrapolation_risk: high
