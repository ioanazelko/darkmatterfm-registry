  - Z_N axion-ALP mixing dark matter
  short_description: A light Z_N QCD axion dark matter model in which mass mixing with an axionlike particle
    can produce one or two cosmological level crossings, altering the nonthermal axion relic density.
  historical_origin_or_motivation: The model extends reduced-mass Z_N QCD axion dark matter by coupling
    it to an ALP so that double level crossings can occur around the QCD era.
  status: speculative
  model_kind: effective_field_theory
