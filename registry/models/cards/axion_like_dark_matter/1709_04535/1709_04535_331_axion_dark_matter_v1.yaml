    exact_or_approximate: broken
    breaking: spontaneously broken by the scalar singlet vev, with QCD and Planck-suppressed explicit
      breaking
    breaking_scale:
      name: Peccei-Quinn scale
      symbol: f_a
      description: Axion decay constant set by the singlet vev.
      range: post-inflationary viable regions near 3.4e9-1.2e10 GeV, depending on production regime and
        |g|
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '1709_04535'
      notes: The paper quotes f_a intervals for domain-wall- and string-dominated total-DM regions.
  - name: Z_10 discrete gauge symmetry
    type: discrete
    exact_or_approximate: exact
    breaking: used as a gravity-stabilizing remnant symmetry for the PQ mechanism
    breaking_scale: null
  topological_defects_possible: 'yes'
