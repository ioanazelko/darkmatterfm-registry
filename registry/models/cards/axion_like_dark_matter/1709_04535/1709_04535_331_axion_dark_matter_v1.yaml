symmetries:
  stabilizing_mechanism: Cosmological stability follows from the axion being a pseudo-Nambu-Goldstone
    boson of U(1)_PQ; the PQ solution is protected against gravitational breaking by a discrete Z_N gauge
    symmetry, with the viable analysis focusing on Z_10.
