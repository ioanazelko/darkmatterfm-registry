parameters:
  core:
  - name: axion decay constant
    symbol: f_a
    description: PQ-breaking scale controlling the axion mass and couplings.
    range: for |g|=1, roughly 3.6e9 GeV < f_a < 1.7e10 GeV before the final total-abundance bands; viable
      bands near 3.4e9-3.6e9 GeV and 1.1e10-1.2e10 GeV are quoted for different scaling regimes
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1709_04535'
    notes: Z_10 case; Z_11 is reported overabundant for considered f_a values.
  - name: axion mass
    symbol: m_a
    description: Mass induced mainly by nonperturbative QCD effects with a gravity contribution constrained
      to remain subdominant.
    range: meV-scale; examples include about (0.4-1.8)e-3 eV depending on |g| and production branch
    unit: eV
    role: core
    status: inferred
    source_reference_ids:
    - '1709_04535'
    notes: The abstract states m_a of order meV and the results quote m_a bands in the 10^-3 eV range.
  - name: Planck-suppressed operator coupling
    symbol: g
    description: Magnitude of the gravity-induced PQ-breaking operator coefficient.
    range: paper scans |g| up to order 4 and highlights |g|=0.1 and |g|=1 examples
    role: core
    status: inferred
    source_reference_ids:
    - '1709_04535'
    notes: Controls domain-wall decay and PQ-quality effects.
  - name: gravity phase
    symbol: delta_D
    description: Phase entering the gravity-induced term in the axion effective potential.
    range: special values around (0.4-4.1)e-5 are quoted for minimal compatible intersections at |g|=4
    role: core
    status: inferred
    source_reference_ids:
    - '1709_04535'
    notes: Small values reduce conflict with the neutron-electric-dipole-moment condition.
  - name: domain wall number
    symbol: N_DW
    description: Domain wall number fixed by the PQ symmetry and matter content.
    value: 3
    role: core
    status: inferred
    source_reference_ids:
    - '1709_04535'
    notes: Used in the axion abundance formulae.
