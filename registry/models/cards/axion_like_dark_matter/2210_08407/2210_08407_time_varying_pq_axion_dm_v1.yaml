theory_to_observable_routing:
  routes:
  - id: route_axion_resonance_abundance
    description: Evolve the temperature-dependent PQ scale, simulate/approximate parametric resonance,
      and propagate the axion spectrum to relic abundance and coldness tests.
    source_model_features:
    - thermal portal to PQ field
    - time-varying f_PQ
    - parametric resonance
    input_parameters:
    - f_PQ^0
    - g
    - lambda_S
    - initial displacement
    - thermal history
    derived_quantities:
    - axion number density
    - radial fluctuation density
    - axion momentum spectrum
    - Omega_a h^2
    forward_model_chain:
    - step_id: evolve_pq_scale
      step_type: analytic_formula
      tool_or_code: finite-temperature PQ effective potential
      inputs:
      - temperature
      - portal coupling g
      - thermal scalar degrees of freedom
      outputs:
      - f_PQ(t)
      validity: Radiation-dominated thermal history with the portal scalar in equilibrium.
      notes: Primary text gives f_PQ proportional to temperature at early times.
    - step_id: resonance_decay
      step_type: simulation
      tool_or_code: lattice or mode-function resonance calculation
      inputs:
      - PQ-field oscillation amplitude
      - potential parameters
      outputs:
      - axion/radial number densities
      - momentum spectrum
      validity: Needed where nonlinear resonance effects set the spectrum.
      notes: Primary paper says radial fluctuations are generically excited alongside axions.
    - step_id: relic_and_coldness
      step_type: data_transform
      tool_or_code: redshifted phase-space and abundance calculation
      inputs:
      - number densities
      - momentum spectrum
      - m_a
      outputs:
      - Omega_a h^2
      - coldness check
      validity: Must include the QCD axion mass turn-on.
      notes: Primary paper defines the cold-DM region in terms of nonrelativistic transition and relic
        abundance.
    observable_ids:
    - axion_parametric_resonance_abundance
    - axion_defect_absence_condition
    constraint_ids:
    - axion_relic_coldness_requirement
    likelihoods: []
    required_code_resources:
    - finite-temperature PQ potential solver
    - resonance/lattice calculation
    - relic abundance calculator
    validation_tests:
    - Recover the primary claim that abundance can be generated independently of axion mass within the
      model assumptions.
    route_status: planned
    agent_notes: This is the core computational route for the model.
    caveats:
    - Topological defects are absent only under the primary paper minimal-coupling assumptions.
  - id: route_axion_constraints
    description: Map the predicted f_PQ/f_a and radial-population regime to CAST, stellar-cooling, supernova,
      and cosmological limits.
    source_model_features:
    - low-f_PQ QCD axion
    - radial fluctuations after resonance
    input_parameters:
    - f_PQ^0
    - f_a
    - m_a
    - n_r/n_a
    - thermalization rate
    derived_quantities:
    - axion couplings
    - stellar-cooling relevance
    - CAST exclusion/sensitivity
    - allowed PQ window
    forward_model_chain:
    - step_id: map_couplings
      step_type: analytic_formula
      tool_or_code: QCD axion coupling relations
      inputs:
      - f_a
      - model class
      outputs:
      - axion-photon and stellar couplings
      validity: Assumes the KSVZ-like f_a=f_PQ benchmark unless stated otherwise.
      notes: Primary paper notes DFSZ anomaly factors can change the mapping.
    - step_id: apply_search_bounds
      step_type: recasting
      tool_or_code: CAST and stellar/cosmological constraints
      inputs:
      - axion couplings
      - radial population
      - thermalization
      outputs:
      - allowed f_PQ interval
      validity: Requires matching model-dependent couplings and radial-sector cosmology.
      notes: Primary paper states the combined bounds can confine f_PQ near 10^8 GeV for n_r/n_a > 0.01.
    observable_ids:
    - axion_low_fa_search_window
    constraint_ids:
    - axion_cast_astrophysical_pq_window
    likelihoods: []
    required_code_resources:
    - CAST axion-photon limit
    - stellar-cooling/supernova axion bounds
    validation_tests:
    - Check the f_PQ window against the primary paper figure/parameter-space result when available.
    route_status: planned
    agent_notes: Constraint route is qualitative until exact contours are digitized.
    caveats:
    - Axion model class and anomaly factors are a leading systematic.
