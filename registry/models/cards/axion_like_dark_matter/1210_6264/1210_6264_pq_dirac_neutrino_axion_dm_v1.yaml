  - two-Higgs-doublet extension
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives Yukawa interactions and a scalar potential for two Higgs doublets, two charged
    singlet scalars, right-handed neutrinos, and the PQ-breaking axion field; it also discusses an optional
    Froggatt-Nielsen-like effective operator for small couplings.
