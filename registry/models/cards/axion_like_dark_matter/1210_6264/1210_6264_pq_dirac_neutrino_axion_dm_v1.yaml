symmetries:
  stabilizing_mechanism: The invisible axion is the Nambu-Goldstone boson of spontaneously broken U(1)_PQ;
    its interactions are inverse in f_a, making it very weakly interacting and long-lived in the paper's
    discussion.
  symmetries:
  - name: U(1)_PQ
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken Peccei-Quinn symmetry producing the axion; anomalous QCD effects give
      the axion a small mass
    breaking_scale:
      name: PQ breaking scale
      symbol: f_a
      description: Scale controlling invisible axion mass and interactions
      range: 10^9 to 3 x 10^11 GeV allowed region quoted in the paper
      unit: GeV
      role: core
      status: established
      source_reference_ids:
      - '1210_6264'
      notes: Paper quotes this as the laboratory and outer-space allowed region.
  - name: U(1)_L
    type: global
    exact_or_approximate: exact
    breaking: lepton number is conserved for the Dirac-neutrino setup
    breaking_scale: null
  - name: axion shift symmetry
    type: shift
    exact_or_approximate: broken
    breaking: QCD chiral anomaly breaks the shift symmetry and generates a small axion mass
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - axion
  - higgs
  standard_model_targets:
  - QCD gluons through the PQ anomaly
  - charged leptons
  - Higgs sector
  dark_sector_couplings:
  - Yukawa interactions f L_L^c i tau_2 L_L s_1^+ and h l_R^dagger nu_R s_2^+ generate one-loop Dirac
    neutrino masses after PQ breaking
  - Scalar potential contains PQ-field couplings to H_1, H_2, s_1, and s_2
  mediator_types:
  - axion
  - charged scalar
  - Higgs doublet
  interaction_operators:
  - h_5 (H_2^dagger H_1) a^2
  - mu s_1^- s_2^+ a
  - PQ-anomaly-induced axion coupling to QCD
  annihilation_channels: []
  decay_channels: []
  self_scattering_channels: []
