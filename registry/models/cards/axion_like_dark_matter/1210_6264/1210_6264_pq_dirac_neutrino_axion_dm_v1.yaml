identity:
  name: Peccei-Quinn Dirac-neutrino axion dark matter model
  family: axion_like_dark_matter
  aliases:
  - PQ Dirac-neutrino axion model
  - invisible axion byproduct of PQ Dirac neutrino masses
  short_description: A model in which Peccei-Quinn symmetry breaking generates Dirac neutrino masses at
    one loop and leaves an invisible axion that the paper treats as a cold dark matter candidate.
  historical_origin_or_motivation: Connects the strong-CP Peccei-Quinn mechanism, Dirac neutrino mass
    generation, and axion dark matter in one scalar/lepton extension.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
