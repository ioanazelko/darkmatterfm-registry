identity:
  name: Complex axion field dark-sector model
  family: axion_like_dark_matter
  aliases:
  - self-interacting complex axion field model
  short_description: A self-interacting complex axion field whose angular pseudo-scalar component oscillates
    around a generated effective-potential minimum and is interpreted as dark matter, while the radial
    component acts as dynamical dark energy.
  historical_origin_or_motivation: The paper motivates the model as a common origin for dark matter, dark
    energy, and baryogenesis, partly in response to difficulties for WIMP dark matter and a pure cosmological
    constant.
  status: speculative
  model_kind: effective_field_theory
