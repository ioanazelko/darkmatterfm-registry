  short_description: A unified scalar-sector model in which the Higgs and axion arise as pseudo-Nambu-Goldstone
    bosons of an enlarged symmetry, combining Froggatt-Nielsen flavour physics, strong-CP solution, electroweak
    symmetry breaking, and an axion dark matter candidate.
  historical_origin_or_motivation: The paper unifies the axiflavon with an elementary Goldstone-Higgs
    sector, using a single scalar multiplet to address flavour hierarchies, strong CP, dark matter, and
    the origin of the Higgs potential.
  status: speculative
  model_kind: complete_theory
