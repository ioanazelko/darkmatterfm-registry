theory_to_observable_routing:
  routes:
  - id: route_alp_fragmentation_to_halo_observables
    description: Propagate a non-periodic ALP potential through fragmentation, density-power amplification,
      minihalo formation, and gravitational observables.
    source_model_features:
    - non-periodic ALP potential
    - parametric resonance
    - fragmentation
    - dense minihalos
    input_parameters:
    - m_a
    - f_a
    - p
    - initial misalignment
    - ALP fraction
    derived_quantities:
    - density power spectrum
    - halo mass function
    - halo density profile
    - lensing and encounter rates
    forward_model_chain:
    - step_id: s1
      step_type: simulation
      tool_or_code: lattice field evolution
      inputs:
      - ALP potential
      - initial field value
      outputs:
      - fragmented field spectrum
      validity: Primary paper uses linear and nonlinear lattice evolution; reproduction requires matching
        numerical setup.
      notes: Compute growth and fragmentation.
    - step_id: s2
      step_type: semi_analytic_model
      tool_or_code: Press-Schechter collapse model
      inputs:
      - density power spectrum
      outputs:
      - halo mass function
      - collapse redshift
      validity: Modified Press-Schechter assumptions dominate small-scale uncertainties.
      notes: Convert amplified perturbations into halo populations.
    - step_id: s3
      step_type: recasting
      tool_or_code: lensing, stellar-stream, and PTA sensitivity models
      inputs:
      - halo mass function
      - halo profiles
      outputs:
      - observable regions
      - constraints
      validity: Experiment-specific finite-source and encounter modeling required.
      notes: Map halos onto gravitational signatures.
    observable_ids:
    - obs_dense_alp_minihalos
    - obs_alp_halo_lensing
    - obs_stellar_stream_pta_perturbations
    constraint_ids:
    - con_halo_lensing_recasts
    - con_coupling_constraints_ksvz
    - con_gd1_density_overlap
    likelihoods:
    - extended-halo lensing recast
    - stellar-stream encounter likelihood
    - PTA timing-residual search
    required_code_resources: []
    validation_tests:
    - Recover primary dense-halo region in (m_a, f_a).
    - Check halo survival and finite-source limits before applying point-object constraints.
    route_status: partially_implemented
    agent_notes: The primary contains simulations and semi-analytic machinery, but no reusable local code
      was identified.
    caveats:
    - ALP coupling constraints depend on UV assumptions; gravitational observables depend on extended-halo
      profiles.
