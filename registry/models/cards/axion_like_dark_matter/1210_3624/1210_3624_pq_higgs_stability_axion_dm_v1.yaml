      name: Peccei-Quinn scale
      symbol: F_PQ
      description: PQ breaking scale statistically argued to lie near the Standard Model Higgs instability
        scale.
      range: of order E_star, the Higgs instability scale
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '1210_3624'
      notes: The paper argues F_PQ should be as small as needed to remove the instability but not significantly
