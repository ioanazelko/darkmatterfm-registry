    range: F_PQ approximately E_star
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1210_3624'
    notes: The paper allows F_PQ to scan and argues the observed universe should place it near the instability
      scale.
  - name: Higgs instability scale
    symbol: E_star
    description: Scale where Standard Model RG running would produce a large-field instability for the
      measured Higgs mass.
    range: determined by two-loop running and the measured Higgs and top masses
    unit: GeV
    role: derived
    status: inferred
    source_reference_ids:
    - '1210_3624'
    notes: The central correlation is F_PQ approximately E_star.
  - name: axion mass
    symbol: m_a
    description: QCD axion mass set by the PQ scale.
    value: Lambda_QCD^2 / F_PQ
    unit: eV
    role: derived
    status: inferred
    source_reference_ids:
    - '1210_3624'
    notes: The text writes m_a = Lambda^2 / F_PQ schematically.
  - name: initial misalignment angle
    symbol: theta_i
    description: Initial axion angle used in the abundance estimate.
    value: spatial average theta_i^2 = pi^2 / 3
    unit: null
    role: cosmological
    status: assumed
    source_reference_ids:
    - '1210_3624'
    notes: The paper also notes a homogeneous small-angle alternative if inflation occurs after PQ breaking,
      but does not focus on it.
  - name: QCD abundance uncertainty factor
    symbol: xi
    description: Order-one uncertainty factor in the axion abundance estimate.
    value: 0.5
    unit: null
    role: nuisance
    status: assumed
    source_reference_ids:
    - '1210_3624'
    notes: The text uses 0.5 as representative and notes possible smaller or larger values.
