theory_to_observable_routing:
  routes:
  - id: route_string_network_to_omega_axion
    description: Infer the post-inflationary QCD axion abundance from field-theory string simulations
      and compare it to CDM.
    source_model_features:
    - PQ symmetry restored after inflation
    - global axionic string network
    - N_DW = 1 wall-string collapse
    input_parameters:
    - f_a
    - xi
    - radiated axion spectrum
    - g_*w
    - QCD axion mass temperature dependence
    - Delta
    derived_quantities:
    - n_axion(t0)
    - Omega_axion h^2
    - f_a upper bound
    forward_model_chain:
    - step_id: simulate_string_network
      step_type: simulation
      tool_or_code: field-theory lattice simulation
      inputs:
      - PQ scalar potential
      - grid size
      - initial conditions
      outputs:
      - scaling parameter xi
      - radiated spectrum
      validity: Finite simulation dynamic range; primary used 512^3 grids.
      notes: Identify strings and estimate the radiated axion spectrum.
    - step_id: convert_spectrum_to_number_density
      step_type: semi_analytic_model
      tool_or_code: null
      inputs:
      - xi
      - spectrum mean momentum
      - wall formation time
      outputs:
