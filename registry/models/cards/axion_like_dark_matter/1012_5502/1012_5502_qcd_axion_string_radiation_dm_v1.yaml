constraints:
- id: con_axion_decay_constant_overclosure
  name: Upper bound on f_a from string-radiated axion abundance
  constraint_type: cosmological
  observable_channel: relic_density:axion_cdm
  applies: 'yes'
  constrained_parameters:
  - f_a
  - xi
  - epsilon
  - Delta
  - g_*w
  excluded_regions:
  - For no entropy dilution, f_a above roughly 3e11 GeV overproduces CDM in the primary estimate of axions
    radiated by strings.
  allowed_regions:
  - f_a below the conservative bound, or scenarios with additional entropy dilution.
  benchmark_implications:
  - The primary result gives Omega_axion h^2 proportional to (f_a/1e12 GeV)^1.19 and translates this to
    f_a about <= 3e11 GeV.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: CDM abundance from CMB and cosmological observations as used in the paper
  recasting_needed: 'no'
  robustness: medium
  assumptions:
  - id: assume_no_entropy_dilution
    description: The quoted conservative f_a bound assumes no post-production entropy dilution.
    scope: relic-density comparison
    status: assumed
    impact_if_violated: Late entropy dilution would relax the upper bound on f_a.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1012_5502_primary
    notes: null
  - id: assume_field_theory_string_scaling
    description: The abundance uses the simulated scaling parameter and spectrum from a finite lattice.
    scope: string-network modeling
    status: assumed
    impact_if_violated: Different large-log extrapolations can shift the abundance.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1012_5502_primary
    notes: null
  caveats:
  - The primary paper predates later large-log simulations; use as a paper-specific constraint, not a
