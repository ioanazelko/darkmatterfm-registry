validity_domain:
- id: fimp_condition
  applies_to: production
  condition: N_3 couplings must remain feeble enough that the dark matter never reaches thermal equilibrium.
  status: assumed
  extrapolation_risk: high
- id: eft_validity
  applies_to: EFT
  condition: The dimension-five EFT treatment is valid below the cutoff scale Lambda used in the parameter
    scans.
  status: assumed
  extrapolation_risk: high
- id: z2_stability
  applies_to: model
  condition: The N_3-odd Z_2 symmetry must forbid mixing with light neutrinos to keep N_3 stable.
  status: assumed
  extrapolation_risk: high
- id: no_bare_mass_correlation
  applies_to: parameter
  condition: Because no bare mass is present, the DM mass remains correlated with the singlet vev and
    scalar freeze-in couplings.
  status: inferred
  extrapolation_risk: medium
assumptions:
  global:
  - id: diagonal_yukawa_basis
    description: The paper takes the Yukawa coupling matrices and bare mass matrix to be diagonal for
      simplicity.
    scope: theory
    status: assumed
    impact_if_violated: Flavor structure and neutrino fits would change for general matrices.
    can_be_relaxed: 'yes'
  - id: n3_stable_z2
    description: An additional Z_2 symmetry is imposed so N_3 is completely stable.
    scope: theory
    status: assumed
    impact_if_violated: N_3 would decay or mix with light neutrinos without this symmetry.
    can_be_relaxed: 'no'
  - id: n3_lighter_than_higgses
    description: The freeze-in discussion assumes N_3 is lighter than H_1 and H_2 so scalar decays to
      N_3 N_3 are open.
    scope: production
    status: assumed
    impact_if_violated: Decay-dominated production would close if this kinematic condition fails.
    can_be_relaxed: 'yes'
  - id: scenario_i_subset
    description: Scenario I is treated by the paper as a special case of Scenario II with the additional
      operator neglected.
    scope: theory
    status: inferred
    impact_if_violated: Operator choices alter the scalar decay couplings and relic-density correlation.
    can_be_relaxed: 'yes'
