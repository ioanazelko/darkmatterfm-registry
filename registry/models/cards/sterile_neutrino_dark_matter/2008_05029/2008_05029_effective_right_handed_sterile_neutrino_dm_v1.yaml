    W and Z bosons through suppressed right-handed currents, producing keV warm dark matter that can inelastically
    scatter on electrons.
  historical_origin_or_motivation: The paper presents the model to explain the XENON1T low-energy electron
    recoil excess while keeping sterile-neutrino lifetimes cosmologically long.
