theory_to_observable_routing:
  routes:
  - agent_notes: The primary proceedings text makes the observable strategy clear, but a complete numerical
      implementation needs the longer companion calculation.
    caveats:
    - Thermal corrections can move the relic target appreciably.
    constraint_ids:
    - con_iss_relic_freezein_rate
    - con_iss_xray_mixing
    derived_quantities:
    - thermal production rate
    - freeze-in yield
    - Omega_DM h^2
    - radiative decay width
    - X-ray line flux
    description: Compute the thermal freeze-in abundance of a keV inverse-seesaw sterile neutrino and
      confront the resulting mixing with X-ray line limits.
    forward_model_chain:
    - inputs:
      - m_DM
      - m_N
      - Gamma(N -> DM + X)
      notes: null
      outputs:
      - zero-temperature relic-density estimate
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Primary paper provides the scaling estimate.
    - inputs:
      - thermal self-energies
      - finite-temperature masses
      - decay widths
      notes: null
      outputs:
      - temperature-dependent production rate
      - freeze-in abundance
      step_id: s2
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Needed because production occurs near the electroweak scale.
    - inputs:
      - mixing matrix
      - m_DM
      notes: null
      outputs:
      - radiative line energy
      - decay width
      step_id: s3
      step_type: data_transform
      tool_or_code: null
      validity: Map inverse-seesaw mixing to X-ray convention.
    - inputs:
      - line flux
      - X-ray exposure/profile assumptions
      notes: null
      outputs:
      - mixing upper limit
      step_id: s4
      step_type: likelihood
      tool_or_code: null
      validity: NuSTAR/XMM likelihoods not rerun here.
    id: route_iss_thermal_freezein_xray
    input_parameters:
    - m_DM
    - m_N
    - Yukawa/mixing matrix
    - thermal self-energies
    - decay widths
    - cosmological g_*
    likelihoods:
    - Planck relic-density target only
    - NuSTAR/XMM line likelihoods not rerun
    observable_ids:
    - obs_iss_freezein_relic
    - obs_iss_xray_line
    required_code_resources:
    - finite-temperature freeze-in Boltzmann solver
    - sterile-neutrino radiative decay calculator
    - X-ray line likelihood/recast tools
    route_status: planned
    source_model_features:
    - low-scale (2,3) inverse seesaw
    - keV sterile-neutrino dark matter
    - heavy-neutrino two-body decays
    - finite-temperature neutrino self-energies
    validation_tests:
    - Recover Gamma ~1e-16 GeV for m_N=150 GeV and m_DM=10 keV in the no-thermal-effects estimate
    - Check m_DM=10 keV benchmark against NuSTAR/XMM mass windows
