    before relativistic freeze-out.
  historical_origin_or_motivation: The paper motivates the model as a sterile-neutrino dark matter scenario
    that links keV-scale dark matter to neutrino-mass extensions while avoiding active-neutrino oscillation
    production through tiny or vanishing active-sterile mixing.
