- id: con_bl_bbn_sn
  name: BBN, supernova, and laboratory bounds on the B-L boson
  constraint_type: cosmological
  observable_channel: BBN, supernova cooling, and visible searches
  applies: parameter_dependent
  constrained_parameters:
  - m_V
  - g_{B-L}
  - tau_V
