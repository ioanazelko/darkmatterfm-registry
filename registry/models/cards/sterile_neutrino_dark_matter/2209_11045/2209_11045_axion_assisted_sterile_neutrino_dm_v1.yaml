    - sin^2(2 theta)
    - g_a
    - m_a
    - <phi>(T)
    derived_quantities:
    - effective potential
    - conversion probability
    - sterile-neutrino relic density
    forward_model_chain:
    - step_id: potential
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - g_a
      - m_a
      - <phi>(T)
      - T
      outputs:
      - V_eff(T)
      validity: Requires the paper effective operator and thermal singlet history.
      notes: Compute the new matter potential and its cancellation with the SM contribution.
    - step_id: production
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - V_eff(T)
      - m_s
      - sin^2(2 theta)
      outputs:
      - f_s(p,T)
      - Omega_s h^2
      validity: Needs a momentum-dependent sterile-neutrino production solver for precision.
      notes: Primary paper gives the route and benchmark curves.
    - step_id: constraint_overlay
      step_type: likelihood
      tool_or_code: null
      inputs:
      - m_s
      - sin^2(2 theta)
      outputs:
