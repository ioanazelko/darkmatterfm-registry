- id: oscillation_coupling_bound
  name: Neutrino-oscillation bound on the axion-assisted effective coupling
  constraint_type: laboratory
  observable_channel: neutrino oscillation constraints
  applies: parameter_dependent
  constrained_parameters:
  - g_a
  - singlet vev temperature dependence
  excluded_regions:
  - A constant coupling large enough to drive the required resonance would conflict with oscillation limits;
    the paper quotes IceCube-scale bounds of about 8e-9 to 5e-6 GeV^-1 for broad axion masses.
  allowed_regions:
  - The introduced singlet vev vanishes at low temperature in the benchmark, removing present-day oscillation
    effects.
  benchmark_implications:
  - The temperature-dependent singlet is essential for avoiding laboratory neutrino constraints.
