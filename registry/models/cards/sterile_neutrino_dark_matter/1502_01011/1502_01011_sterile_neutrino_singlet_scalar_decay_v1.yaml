    through a Yukawa term decays into sterile neutrinos in the early Universe, with FIMP, WIMP in-equilibrium,
    out-of-equilibrium, and intermediate production regimes treated through Boltzmann equations.
  historical_origin_or_motivation: The paper presents a comprehensive treatment of sterile-neutrino dark
    matter production by singlet-scalar decays, motivated as an alternative to Dodelson-Widrow production
    and by the need for momentum-distribution-level predictions.
