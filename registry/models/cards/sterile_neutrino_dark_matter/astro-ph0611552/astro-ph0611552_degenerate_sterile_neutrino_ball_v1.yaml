  lagrangian_available: 'no'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper cites a renormalizable minimal Standard Model extension with three right-handed sterile
    neutrinos, but the extraction target is the sterile-neutrino-ball dark matter scenario rather than
    a full Lagrangian presentation.
