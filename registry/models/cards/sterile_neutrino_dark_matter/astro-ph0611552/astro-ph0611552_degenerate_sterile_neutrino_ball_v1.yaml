  short_description: A sterile-neutrino dark matter scenario in which a quasi-stable keV sterile neutrino
    is produced out of equilibrium, forms cool and warm components, and can gravitationally cool into
    degenerate neutrino balls that seed rapid supermassive black-hole growth.
  historical_origin_or_motivation: Introduced here as an alternative to baryonic accretion and black-hole
    merger explanations for early supermassive black holes.
  status: speculative
  model_kind: phenomenological_parameterization
theory:
