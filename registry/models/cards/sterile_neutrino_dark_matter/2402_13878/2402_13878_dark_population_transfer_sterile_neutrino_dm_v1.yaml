  short_description: A two-step sterile-neutrino dark matter mechanism in which active-neutrino scattering-induced
    decoherence first populates a heavier sterile state N1, and sterile-sector self-interactions transfer
    that population to a lighter sterile state N2 that survives as dark matter or a dark-matter component.
  historical_origin_or_motivation: Motivated by evading X-ray and structure-formation bounds on minimal
    Dodelson-Widrow sterile-neutrino dark matter by decoupling the light sterile-neutrino relic abundance
    from its active-sterile mixing angle.
  status: speculative
  model_kind: simplified_model
