constraints:
- id: xray_line_mixing_bounds
  name: X-ray bounds on sterile-neutrino radiative decay
  constraint_type: astrophysical
  observable_channel: X-ray decay line flux
  applies: parameter_dependent
  constrained_parameters:
  - m_s
  - theta
  - sterile-neutrino abundance fraction
  excluded_regions:
  - For mixed sterile neutrino dark matter, nonobservation of a line constrains mass-mixing combinations.
  allowed_regions:
  - Final states that are far more weakly mixed or unmixed can evade current electromagnetic bounds in
    the population-transfer mechanism.
  benchmark_implications:
  - The mechanism decouples the abundance from the final sterile-neutrino active mixing, reducing pressure
    from X-ray line searches.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: X-ray constraints discussed in primary and related Chandra/Suzaku papers
  recasting_needed: 'yes'
  robustness: high
  assumptions:
  - id: radiative_decay_requires_mixing
    description: The X-ray constraint requires a radiative decay channel induced by active-sterile mixing.
    scope: indirect detection
    status: established
    impact_if_violated: If the final dark state is unmixed, the line constraint does not apply.
    can_be_relaxed: partial
    source_reference_ids:
    - 2402_13878_primary
  caveats:
  - A quantitative flux likelihood is not included in this batch.
  source_reference_ids:
  - 2402_13878_primary
  - 2402_13878_rel_1111_4217
  - 2402_13878_rel_0812_2710
  notes: Primary and related local texts support the line-energy and nonobservation constraint logic.
- id: free_streaming_lower_mass_bound
  name: Free-streaming lower-mass and momentum bound
  constraint_type: cosmological
  observable_channel: small-scale structure
  applies: parameter_dependent
  constrained_parameters:
  - m_N2
  - T_DS/T_SM
  - <p>/T
  excluded_regions:
  - Sterile neutrinos that are too light or too hot would wash out small-scale structure.
  allowed_regions:
  - Because T_DS < T_SM after internal thermalization, the average energy can be lower than in simple
    decoherence production, weakening the lower-mass bound.
  benchmark_implications:
  - The viable region upper boundary in the primary figure is set by free-streaming considerations.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: Structure/free-streaming bound as discussed in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: internal_dark_thermalization
    description: The dark sector rapidly reaches internal thermal equilibrium through self-interactions.
    scope: dark-sector evolution
    status: assumed
    impact_if_violated: Without internal thermalization the momentum distribution and free-streaming bound
      change.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - 2402_13878_primary
  caveats:
  - No transfer-function table is provided.
  source_reference_ids:
  - 2402_13878_primary
  notes: Free-streaming is a central observable consequence in the primary paper.
- id: heavy_to_light_decay_kinematics
  name: Heavy-sterile decay kinematic condition
  constraint_type: theoretical
  observable_channel: dark-sector decay N1 -> 3 N2
  applies: 'yes'
  constrained_parameters:
  - m_N1
  - m_N2
  excluded_regions:
  - The primary restricts to the regime m_N1 > 3 m_N2 for the three-body transfer decay.
  allowed_regions:
  - Parameter points satisfying m_N1 > 3 m_N2 are kinematically open for N1 -> 3 N2.
  benchmark_implications:
  - This condition sets the lower boundary of the colored parameter region in the primary figure.
  likelihood_available: 'yes'
  likelihood_reference: analytic kinematic threshold
  data_release: Primary model setup
  recasting_needed: not_applicable
  robustness: high
  assumptions:
  - id: three_body_transfer_channel
    description: The demonstrator model uses a three-body decay of N1 into N2 states.
    scope: model definition
    status: established
    impact_if_violated: Different transfer channels would change the threshold.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - 2402_13878_primary
  caveats:
  - This is a model-setup constraint, not an observational exclusion.
  source_reference_ids:
  - 2402_13878_primary
  notes: Primary text explicitly states m_N1 > 3 m_N2.
theory_to_observable_routing:
  routes:
  - id: dark_population_transfer_route
    description: Evolve active-to-sterile production, dark-sector thermalization, population transfer,
      and observational bounds.
    source_model_features:
    - two sterile neutrinos N1 and N2
    - scalar-mediated sterile self-interactions
    - active-neutrino scattering-induced decoherence
    - dark-sector thermalization
    input_parameters:
    - m_N1
    - m_N2
    - active-sterile mixing
    - sterile self-couplings
    - mediator mass
    derived_quantities:
    - energy injection rate
    - T_DS
    - N2 relic density
    - average momentum
    - X-ray decay rate
    - free-streaming scale
    forward_model_chain:
    - step_id: decoherence_source
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - active-neutrino scattering rate
      - mixing angle
      - SM temperature
      outputs:
      - energy injection into N1
      validity: Medium-suppressed high-temperature regime followed by lower-temperature production.
      notes: Primary text formulates scattering-induced decoherence as the first step.
    - step_id: dark_thermalization
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - self-interaction rates
      - dark-sector energy density
      outputs:
      - T_DS
      - dark pressure and density
      validity: Fast internal thermalization approximation.
      notes: Primary text reduces coupled Boltzmann equations to T_DS evolution in this regime.
    - step_id: population_transfer
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - m_N1
      - m_N2
      - self-mediated scattering/decay rates
      outputs:
      - N2 abundance
      - momentum distribution proxy
      validity: Requires m_N1 > 3 m_N2 for the displayed three-body decay regime.
      notes: Population transfer is the defining mechanism.
    - step_id: observable_projection
      step_type: data_transform
      tool_or_code: null
      inputs:
      - N2 abundance
      - mixing
      - T_DS/T_SM
      outputs:
      - X-ray line expectation
      - free-streaming bound
      validity: Qualitative without a public transfer-function likelihood.
      notes: Maps relic density to electromagnetic and structure observables.
    observable_ids:
    - sterile_population_transfer_relic
    - radiative_xray_line
    - free_streaming_structure_cutoff
    constraint_ids:
    - xray_line_mixing_bounds
    - free_streaming_lower_mass_bound
    - heavy_to_light_decay_kinematics
    likelihoods:
    - none packaged; X-ray and structure recasts required
    required_code_resources:
    - custom coupled Boltzmann/density evolution
    - X-ray decay-line recast
    - structure-formation transfer-function calculation
    validation_tests:
    - Check energy conservation through dark thermalization and reproduce the primary parameter-region
      boundaries.
    route_status: planned
    agent_notes: The mechanism is explicit, but quantitative observational likelihoods require new recasts.
    caveats:
    - Final-state mixing and dark-sector thermalization assumptions control the observational reach.
