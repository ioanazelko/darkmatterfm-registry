  - minimal gauged B-L sterile neutrino freeze-in model
  short_description: A sterile-neutrino dark matter scenario in a feebly coupled gauged U(1)_B-L extension,
    where N is produced out of equilibrium mainly through the B-L breaking scalar and Z-prime-mediated
    processes.
  historical_origin_or_motivation: Uses a minimal gauged B-L extension with right-handed neutrinos to
    provide an alternative freeze-in production path for sterile neutrino dark matter beyond active-sterile
    mixing.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - minimal gauged U(1)_B-L model
  - type-I seesaw sterile-neutrino framework
  - freeze-in dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the B-L gauge, scalar, and right-handed-neutrino Lagrangian and introduces three
    RH neutrinos for anomaly cancellation.
particle_content:
  dark_matter_candidate:
    name: sterile neutrino N
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - two additional right-handed neutrinos for neutrino masses and anomaly cancellation
  - U(1)_B-L breaking scalar phi
  - B-L gauge boson Z'
  mediators:
  - Z' gauge boson
  - B-L breaking scalar phi
  - Higgs-portal scalar mixing when alpha is nonzero
  dark_radiation_species: []
