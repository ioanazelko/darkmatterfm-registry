      description: Vacuum expectation value of the scalar breaking U(1)_B-L.
      range: v_B-L >> electroweak vev assumed
      unit: GeV
      role: core
      status: assumed
      source_reference_ids:
      - '2404_00654'
  topological_defects_possible: unknown
interactions:
