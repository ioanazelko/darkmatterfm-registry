  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark matter sterile neutrino is sequestered from SM particles by tiny mixing/Yukawa
    couplings and feeble B-L interactions; no exact stabilizing symmetry is specified in the assigned
    text.
  symmetries:
  - name: U(1)_B-L
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by a complex scalar phi
    breaking_scale:
      name: B-L breaking vev
