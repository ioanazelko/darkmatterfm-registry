  short_description: A Standard Model extension with a Z2-odd electroweak-singlet scalar S as dark matter,
    plus an electroweak isospin-3/2 scalar and vector-like triplet leptons that generate neutrino masses
    and open additional dark matter annihilation channels.
  historical_origin_or_motivation: Proposed to keep scalar singlet Higgs-portal dark matter viable while
    connecting the added annihilation channel to neutrino mass generation.
  status: speculative
  model_kind: complete_theory
