validity_domain:
- id: unbroken_z2
  applies_to: model
  condition: S must have zero VEV and the Z_2 symmetry must remain unbroken for S to be stable dark matter.
  status: established
  valid_range: <S> = 0
  extrapolation_risk: high
  caveats:
  - If Z_2 is broken, S is not stable.
  source_reference_ids:
  - paper:2008_08700
- id: heavy_dm_region
  applies_to: parameter
  condition: The light Higgs-resonance region does not work in this model; viable full-DM points require
    multi-TeV m_S and are compatible with XENON1T and relic abundance.
  status: established
  valid_range: m_S above roughly 1.6-1.7 TeV, with typical viable points around 2 TeV
  extrapolation_risk: medium
  caveats:
  - Exact viable regions differ by critical point and perturbativity criterion.
  source_reference_ids:
  - paper:2008_08700
- id: perturbativity
  applies_to: model
  condition: The paper requires absence of a Landau pole up to about 10^17 GeV and also discusses stronger
    perturbativity up to 10^18 GeV.
  status: established
  valid_range: dimensionless couplings below the selected perturbativity bound up to 10^17-10^18 GeV
  extrapolation_risk: medium
  caveats:
  - The exact Z_2 prime critical point can be excluded under stronger perturbativity assumptions.
  source_reference_ids:
  - paper:2008_08700
