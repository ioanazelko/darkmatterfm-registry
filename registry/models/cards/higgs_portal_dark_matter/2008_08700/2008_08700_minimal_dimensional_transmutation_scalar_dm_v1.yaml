identity:
  name: Minimal dimensional transmutation Higgs-portal scalar dark matter
  family: higgs_portal_dark_matter
  aliases:
  - two-real-scalar MPP dark matter
  - singlet S dark matter in minimal dimensional transmutation
  short_description: A two-real-scalar extension of the Standard Model where an unbroken Z_2 makes the
    singlet S stable dark matter, while the second scalar generates the electroweak scale through dimensional
    transmutation and supplies an additional Higgs mediator for thermal annihilation.
  historical_origin_or_motivation: The paper connects classical scale invariance and multicritical-point
    principle ideas to a minimal two-scalar Coleman-Weinberg-like setup, using one scalar as Higgs-portal
    dark matter.
  status: speculative
  model_kind: complete_theory
