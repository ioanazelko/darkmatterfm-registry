  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: partial
    description: The colored mediators decay through the source baryon-number-carrying couplings.
    id: x_decay_topology
    impact_if_violated: Different lifetimes or final states change the collider limits.
    notes: null
    scope: collider recast
    source_reference_ids:
    - arxiv:1305.0287
    status: assumed
  benchmark_implications:
  - A positive collider signal would test the same mediator sector responsible for baryogenesis and scattering.
  caveats:
  - No LHC search recast was performed.
  constrained_parameters:
  - M_X
  - lambda_i
  - lambda_prime_ij
  constraint_type: collider
  data_release: LHC colored-particle search program, not recast in source
  excluded_regions:
  - Source-era and modern colored-particle searches can exclude light X-sector states depending on decay
    topology.
  id: con_colored_mediator_lhc
  likelihood_available: 'no'
  likelihood_reference: null
  name: TeV colored mediator accessibility
  notes: null
  observable_channel: colored_particle_searches
  recasting_needed: 'yes'
  robustness: low
  source_reference_ids:
  - arxiv:1305.0287
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - Modern direct-detection and LHC constraints are not applied.
    constraint_ids:
    - con_cdms_xenon_light_dm_region
    - con_nonthermal_moduli_reheating
    - con_colored_mediator_lhc
    derived_quantities:
    - sigma_SI
    - Omega_N1 h^2
    - baryon asymmetry
    - colored mediator rates
    description: Route the supersymmetric N1 cogenesis model through light-DM recoil data, nonthermal
      moduli cosmology, baryogenesis, and colored mediator searches.
    forward_model_chain:
    - inputs:
      - m_N1
      - M_X
      - lambda_i
      - lambda_prime_ij
      notes: Match the CDMS-Si cross-section target.
      outputs:
      - sigma_SI
      - annihilation rate
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Valid for the source effective mediator setup.
    - inputs:
      - moduli abundance
      - T_R
      - branching fractions
      notes: Standard freeze-out is intentionally bypassed.
      outputs:
      - nonthermal N1 yield
      step_id: s2
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Requires low-temperature reheating.
    - inputs:
      - X decays
      - CP/baryon-number couplings
      notes: Cogenesis occurs at similar low temperatures.
      outputs:
      - baryon asymmetry
      step_id: s3
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Depends on mediator decay history.
    - inputs:
      - M_X
      - decay topology
      notes: Only source-level accessibility is captured.
      outputs:
      - LHC constraints
      step_id: s4
      step_type: recasting
      tool_or_code: null
      validity: Needs collider search recast.
    id: route_susy_n1_cogenesis_direct_lhc
    input_parameters:
    - m_N1
    - M_X
    - lambda_i
    - lambda_prime_ij
    - T_R
    - moduli branching fractions
    likelihoods:
    - CDMS/CoGeNT/XENON light-DM comparisons
    - nonthermal relic abundance target
    - collider colored-particle searches
    observable_ids:
    - obs_n1_light_dm_recoil
    - obs_n1_baryon_dm_cogenesis
    - obs_colored_x_mediator_lhc
    required_code_resources:
    - direct-detection recast
    - nonthermal Boltzmann/reheating solver
    - baryogenesis yield calculation
    - LHC mediator recast
    route_status: planned
    source_model_features:
    - real scalar N1 dark matter
    - TeV colored X superfields
    - low-temperature moduli decay
    - baryon-number carrying couplings
    validation_tests:
    - recover m_N1=8-10 GeV
    - recover sigma_SI about 1e-41 cm^2
    - show thermal freeze-out overabundance and nonthermal dilution
