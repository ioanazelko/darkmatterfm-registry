    scope: cosmological_history
    status: assumed
    impact_if_violated: The common-mother link between baryons and dark matter fails.
    can_be_relaxed: unknown
    source_reference_ids:
    - '2402_10561'
    notes: null
  - id: s_vev_spontaneous_cp
    description: The singlet scalar gets a complex VEV S = u exp(i theta_0)/sqrt(2), generating spontaneous
