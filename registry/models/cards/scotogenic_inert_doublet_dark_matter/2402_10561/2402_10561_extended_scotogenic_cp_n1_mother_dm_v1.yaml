_source:
  shard: arXiv_src_2402_079_wds.tar
  paper_id: '2402_10561'
  source_member: 2402_10561.json
schema_version: model_only_v0
model_id: 2402_10561_extended_scotogenic_cp_n1_mother_dm_v1
identity:
  name: Extended scotogenic CP model with N1-sourced inert-doublet dark matter
  family: scotogenic_inert_doublet_dark_matter
  aliases:
  - singlet-scalar and vectorlike-fermion extension of common-mother scotogenic dark matter
  short_description: An extended scotogenic model adding a singlet scalar S and vectorlike fermions so
    that scatterings through S thermalize N_1; subsequent N_1 decay generates lepton asymmetry and a substantial
    eta_R^0 dark matter abundance.
  historical_origin_or_motivation: The extension is used as a realistic realization of the common-mother
    scenario and is motivated by spontaneous CP violation and Nelson-Barr strong-CP structure.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - extended scotogenic model
  - Nelson-Barr mechanism
  - spontaneous CP violation
  - radiative neutrino mass
  - low-scale leptogenesis
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives additional singlet-scalar and vectorlike-fermion Yukawa couplings that generate
    N_k masses, CP phases, and N_1 thermalization processes.
particle_content:
  dark_matter_candidate:
    name: eta_R^0, the real neutral component of the inert scalar doublet
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert scalar doublet eta
  - right-handed neutrinos N_j
  - singlet scalar S
  - vectorlike down-type quarks D_L,R
  - vectorlike charged leptons E_L,R
  mediators:
  - singlet scalar S
  - Higgs boson
  - right-handed neutrinos N_j
  dark_radiation_species: []
  excited_or_degenerate_states:
  - eta_I^0 and charged inert-doublet components nearly degenerate for small lambda_5
  long_lived_particles:
  - eta_R^0
  unstable_parent_particles:
  - lightest right-handed neutrino N_1
  - heavier right-handed neutrinos N_2 and N_3
  - vectorlike fermions if kinematically allowed
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An imposed exact Z_2 symmetry remains unbroken because the inert doublet has
    no VEV, stabilizing the lightest neutral Z_2-odd state.
  symmetries:
  - name: Z_2
    type: discrete
    exact_or_approximate: exact
    breaking: Unbroken in the vacuum; all SM fields are even while N_j and eta are odd.
  - name: CP
    type: global
    exact_or_approximate: broken
    breaking: Spontaneously broken when singlet scalar S takes a complex VEV.
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - other
  standard_model_targets:
  - SM lepton doublets
  - SM right-handed down quarks
  - SM right-handed charged leptons
  - Higgs doublet
  dark_sector_couplings:
  - scotogenic h_ij L_i eta N_j
  - S couplings to D_L d_R, E_L e_R, E_L E_R, and N_k N_k
  - scalar potential couplings lambda_3, lambda_4, lambda_5
  mediator_types:
  - singlet scalar S
  - right-handed neutrino
  - Higgs boson
  - inert scalar doublet
  interaction_operators:
  - (y_Nk S + y_Nk prime S*) N_k N_k
  - (y_dk S + y_dk prime S*) D_L d_Rk
  - (y_ek S + y_ek prime S*) E_L e_Rk
  annihilation_channels:
  - eta_R^0 annihilation and inert-doublet coannihilation
  decay_channels:
  - N_1 -> lepton plus inert scalar components, ending in eta_R^0
  self_scattering_channels:
  - S-mediated production scatterings for N_1
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_eta_R0
    description: Mass of the real neutral inert-doublet scalar dark matter.
    range: Examples use m_eta_R0 = 2 TeV; coincidence discussion notes m_eta_R0 less than about 3 TeV
      for T_D < 100 GeV < T_L.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: lightest right-handed neutrino mass
    symbol: M_N1
    description: Mass of the N_1 mother particle whose decay sources lepton asymmetry and eta_R^0 abundance.
    range: Same order as m_eta_R0 in the coincidence scenario; heavier than eta_R^0.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: small N1 Yukawa coupling
    symbol: h_1
    description: Yukawa coupling controlling delayed N_1 decay and low-scale leptogenesis.
    range: O(10^-8) for TeV-scale successful leptogenesis in the paper.
    role: core
    status: inferred
    source_reference_ids: []
  - name: lambda_5
    symbol: lambda_5
    description: Small scalar coupling setting neutrino mass and neutral inert scalar splitting.
    value: -10^-5 in example parameter sets
    role: core
    status: established
    source_reference_ids: []
  - name: lambda plus
    symbol: lambda_+
    description: Combination lambda_3 + lambda_4 + lambda_5 relevant for the scalar potential and eta_R0
      abundance.
    range: Examples include lambda_+ = 0.66.
    role: core
    status: inferred
    source_reference_ids: []
  - name: singlet scalar VEV
    symbol: u
    description: VEV of S used in the concrete extension.
    value: 10^6
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
  - name: spontaneous CP phase
    symbol: theta_0
    description: Phase of the singlet scalar VEV.
    value: pi/4
    role: core
    status: established
    source_reference_ids: []
  - name: vectorlike charged lepton mass
    symbol: M_E
    description: Mass eigenvalue quoted for the fourth charged lepton in the example.
    value: '3165'
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
  - name: lambda_3 extension example
    symbol: lambda_3
    description: Scalar coupling used in the extended-model abundance example.
    value: '2.6'
    role: core
    status: established
    source_reference_ids: []
production:
  mechanisms:
  - S-mediated scatterings populate N_1 in thermal equilibrium
  - thermal freeze-out of eta_R^0
  - late N_1 decay supplies eta_R^0 and lepton asymmetry
  thermal_equilibrium_with_standard_model: partial
  thermal_equilibrium_with_hidden_sector: partial
  abundance_set_by:
  - S-mediated N_1 production scatterings
  - N_1 decay width
  - eta_R^0 annihilation cross section
  - lambda_+ and lambda_3
  - u and theta_0 through N_k masses and CP phases
  depends_on_reheating_temperature: parameter_dependent
  can_produce_all_dark_matter: 'yes'
  nonthermal_momentum_distribution: unknown
  notes: In the concrete extension, N_1 reaches equilibrium and its decay supplies about 70 percent of
    the required eta_R^0 abundance in the example.
relic_density:
  full_or_subcomponent: full_dark_matter
  target_fraction:
    name: Omega_eta_R0 h^2
    symbol: Omega_eta_R0 h^2
    value: 0.12
    description: Target relic abundance used in the numerical examples.
    status: established
  calculation_type: mixed
  key_dependencies:
  - S-mediated N_1 thermalization
  - N_1 decay abundance
  - eta_R^0 thermal component
  - lambda_+ = 0.66 and lambda_3 = 2.6 example
  - u = 10^6 GeV and theta_0 = pi/4 example
  requires_entropy_dilution: unknown
  overclosure_risk: parameter_dependent
  underproduction_risk: parameter_dependent
  tuning_assessment: unknown
cosmological_history:
  standard_history_assumed: true
  nonstandard_features:
  - TeV-scale leptogenesis before sphaleron freezeout
  - delayed N_1 decay contributing to dark matter abundance
  dark_sector_temperature: null
  delta_neff: null
  kinetic_decoupling: null
  chemical_decoupling:
    name: eta_R0 freeze-out parameter
    symbol: x_D
    value: about 25-26 in examples
    description: Freeze-out point for inert scalar annihilation.
    status: inferred
  phase_transitions:
  - electroweak sphaleron epoch
  topological_defects: []
  isocurvature_perturbations: unknown
  bbn_relevance: unknown
  cmb_relevance: unknown
phase_space:
  distribution_type: thermal
  distribution_function_available: unknown
  f_of_p_or_q: unknown
  average_momentum_relative_to_thermal: null
  free_streaming_length: null
  velocity_dispersion_today: null
  phase_space_bounds: []
  notes: The scalar dark matter is TeV-scale cold dark matter; the final abundance has both thermal and
    decay-produced pieces.
structure_formation:
