identity:
  name: Hybrid scotogenic type I/III inert-doublet dark matter
  family: scotogenic_inert_doublet_dark_matter
  aliases:
  - low-scale leptogenesis in a hybrid scotogenic type I and III seesaw
  - Z2-odd inert-doublet scalar dark matter with singlet-fermion-assisted leptogenesis
  short_description: A scotogenic type III seesaw dark-matter setup extended by a Z2-odd singlet fermion
    N and a real scalar S so that an inert-doublet neutral scalar remains the dark matter candidate while
    N can generate low-scale leptogenesis.
  historical_origin_or_motivation: The paper extends the scotogenic type III seesaw because SU(2) triplet
    fermions remain in thermal equilibrium too long to drive low-scale leptogenesis, while preserving
    the inert-doublet dark matter candidate.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - scotogenic type III seesaw
  - scotogenic type I seesaw
  - inert doublet dark matter
  - radiative neutrino mass model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The text gives the triplet-fermion Yukawa sector, inert-doublet scalar potential, and additional
    singlet-fermion and real-scalar terms; it also mentions a nonminimal S^2 R coupling for reheating.
particle_content:
  dark_matter_candidate:
    name: lightest neutral component of the inert scalar doublet eta
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - Z2-odd SU(2) triplet fermions Sigma_1 and Sigma_2
  - Z2-odd singlet fermion N
  - Z2-even real scalar S
  - charged and neutral inert-doublet partners
  mediators:
  - inert scalar doublet components
  - SU(2) triplet fermions
  - real scalar S
  dark_radiation_species: []
  excited_or_degenerate_states:
  - charged inert scalar components
  - neutral inert scalar partner
  - triplet fermion components
  long_lived_particles: []
  unstable_parent_particles:
  - singlet fermion N
  - SU(2) triplet fermions Sigma_1 and Sigma_2
  - real scalar S
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 symmetry assigns odd parity to the inert doublet, triplet fermions,
    and singlet fermion N, while SM fields and S are even; the unbroken Z2 stabilizes the lightest odd
    neutral scalar.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the dark matter phase
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - other
  standard_model_targets:
  - lepton doublets
  - Higgs doublet
  - electroweak gauge bosons
  dark_sector_couplings:
  - neutrino Yukawa couplings L eta Sigma
  - small singlet-fermion Yukawa couplings L eta N
  - S N N coupling
  - S Sigma Sigma coupling
  - inert-doublet scalar quartics lambda_3, lambda_4, lambda_5
  mediator_types:
  - inert scalar doublet
  - SU(2) triplet fermion
  - real scalar singlet
  interaction_operators:
  - L eta Sigma Yukawa interaction
  - L eta N Yukawa interaction
  - S N N and S Sigma Sigma interactions
  - inert-doublet scalar potential terms
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - coannihilation among inert-doublet components through electroweak and scalar interactions
  decay_channels:
  - N decays out of equilibrium to lepton plus inert scalar for leptogenesis
  self_scattering_channels: []
  cp_structure: CP asymmetry in N decay is generated by interference with one-loop diagrams containing
    triplet fermions.
  flavor_structure: The paper chooses flavor structures for h_i and h_i^N to fit neutrino data and generate
    lepton asymmetry; detailed matrices are benchmark-dependent.
  tree_or_loop_level: both
parameters:
  core:
  - name: inert-doublet dark matter mass
    symbol: M_eta
    description: Mass scale of the inert doublet whose lightest neutral component is the dark matter candidate
    range: O(1) TeV assumed to guarantee the dark matter abundance
    unit: GeV
    role: core
    status: inferred
  - name: triplet fermion masses
    symbol: M_Sigma1, M_Sigma2
    description: Masses of the Z2-odd SU(2) triplet fermions
    range: benchmark values include 10^7 GeV and 10^8 GeV; generally much below 10^9 GeV is targeted for
      low-scale leptogenesis
    unit: GeV
    role: core
    status: inferred
  - name: singlet fermion mass
    symbol: M_N
    description: Mass of the added Z2-odd singlet fermion that acts as the mother particle for leptogenesis
    range: benchmark value 10^6 GeV; paper notes the required mass can be lowered toward 10^4 GeV
    unit: GeV
    role: core
    status: inferred
  - name: real scalar mass
    symbol: m_S
    description: Mass of the Z2-even real scalar S mediating production of N from triplet fermions
    range: benchmark value 10^10 GeV with m_S > M_Sigma > M_N
    unit: GeV
    role: core
    status: inferred
  - name: singlet and triplet scalar couplings
    symbol: y_N, y_Sigma
    description: Couplings of S to N N and Sigma Sigma used for reheating and thermal production of N
    range: benchmark y_Sigma = 10^-1.5 and y_N = 10^-2
    role: core
    status: inferred
  - name: small singlet-fermion Yukawa coupling
    symbol: h_i^N
    description: Yukawa coupling controlling N decay to lepton plus inert scalar
    range: benchmark h_i^N = 10^-6
    role: core
    status: inferred
  - name: inert-doublet quartic couplings
    symbol: lambda_3, lambda_4, lambda_5
    description: Quartics affecting inert-doublet masses, coannihilation, and loop neutrino masses
    range: suitable lambda_3 and lambda_4 can yield Omega h^2 = 0.12 without serious fine tuning; |lambda_5|
      << 1 is noted for smaller seesaw masses
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: thermal relic abundance target
    symbol: Omega h^2
    description: The inert-doublet candidate can reproduce the observed dark matter abundance through
      coannihilation
    value: '0.12'
    role: derived
    status: inferred
