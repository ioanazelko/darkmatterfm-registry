model_id: 1709_02886_pq_scotogenic_inert_doublet_dm_v1
identity:
  name: Peccei-Quinn scotogenic inert-doublet dark matter
  family: scotogenic_inert_doublet_dark_matter
  aliases:
  - KSVZ-PQ scotogenic dark matter
  - PQ-remnant Z2 inert doublet dark matter
  - eta_R thermal relic
  short_description: An extension of the KSVZ invisible axion model with an inert scalar doublet and right-handed
    neutrinos, where a remnant Z2 from Peccei-Quinn breaking stabilizes the lightest neutral inert-doublet
    component.
  historical_origin_or_motivation: The model relates strong CP, radiative neutrino mass generation, leptogenesis
    and dark-matter stability through Peccei-Quinn symmetry.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - KSVZ invisible axion model
  - scotogenic neutrino mass model
  - inert doublet model
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff:
    name: cutoff scale
    symbol: M_*
    description: Cutoff suppressing the nonrenormalizable scalar interaction that induces the inert-doublet
      mass splitting.
    range: example around 1.54e13 GeV
    unit: GeV
    role: core
    status: inferred
  embedded_in_larger_framework: 'yes'
  notes: The paper writes Yukawa terms and a scalar potential up to dimension five; the low-energy theory
    reduces to a scotogenic model after PQ breaking.
particle_content:
  dark_matter_candidate:
    name: neutral inert-doublet scalar eta_R
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert doublet scalar components eta_I and eta^+-
  - three right-handed neutrinos N_i
  - KSVZ singlet scalar S
  - vector-like colored fermions D_L and D_R
  - axion
  mediators:
  - Higgs doublet
  - electroweak gauge bosons
  - right-handed neutrinos
  - PQ scalar sector
  dark_radiation_species:
  - axion may be present but is subdominant for the PQ scale emphasized
  excited_or_degenerate_states:
  - eta_I and charged eta components are nearly degenerate with eta_R in the coannihilation regime
  long_lived_particles: []
  unstable_parent_particles:
  - right-handed neutrinos
  - vector-like colored fermions D when Yukawa decays are allowed
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A remnant effective Z2 symmetry after U(1)_PQ breaking makes the lightest Z2-odd
    inert-doublet component stable.
  symmetries:
  - name: U(1)_PQ
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by the singlet S vacuum expectation value and violated by the QCD anomaly
    breaking_scale:
      name: PQ breaking scale
      symbol: <S>
      description: Singlet scalar vacuum expectation value setting the axion scale.
      range: 10^9 to 10^12 GeV; examples use 10^10 GeV
      unit: GeV
      role: core
      status: inferred
  - name: remnant Z2
    type: discrete
    exact_or_approximate: approximate
    breaking: violated by the QCD anomaly but acts as the scotogenic Z2 in the leptonic sector
    breaking_scale: null
  topological_defects_possible: 'yes'
interactions:
  portals:
  - higgs
  - neutrino
  - axion
  standard_model_targets:
  - Higgs doublet
  - lepton doublets
  - electroweak gauge bosons
  - quarks through vector-like D decays
  dark_sector_couplings:
  - inert-doublet quartics lambda_3 and lambda_4
  - dimension-five lambda_5 S(eta^dagger phi)^2/M_*
  - Yukawa h_i eta N_i
  - PQ Yukawa y_i S N_i^c N_i
  mediator_types:
  - Higgs scalar
  - electroweak gauge bosons
  - right-handed neutrinos
  - PQ scalar and axion sector
  interaction_operators:
  - S(eta^dagger phi)^2/M_*
  - eta N_i lepton Yukawa coupling
  - S N_i^c N_i
  - Higgs-inert-doublet quartic operators
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - eta_R coannihilation with eta_I and charged eta states into Standard Model final states
  decay_channels: []
  self_scattering_channels:
  - inert scalar quartic interactions
  cp_structure: eta_R and eta_I are split by the PQ-induced dimension-five interaction
  flavor_structure: neutrino Yukawa couplings are chosen to approximate tri-bimaximal mixing in the analysis
  tree_or_loop_level: both
parameters:
  core:
  - name: PQ breaking scale
    symbol: <S>
    description: Vacuum expectation value of the KSVZ singlet scalar.
    range: 10^9 to 10^12 GeV; benchmark 10^10 GeV
    unit: GeV
    role: core
    status: inferred
  - name: inert-doublet mass scale
    symbol: m_eta
    description: Common mass scale of inert doublet components before electroweak splitting.
    range: order 1 TeV in the scenario studied
    unit: GeV
    role: core
    status: inferred
  - name: eta_R mass
    symbol: M_etaR
    description: Mass of the neutral scalar dark matter state.
    range: near 1 TeV in the benchmark coannihilation study
    unit: GeV
    role: core
    status: inferred
  - name: PQ-induced coupling
    symbol: lambda_5
    description: Effective coupling from the dimension-five operator after PQ breaking; controls eta_R-eta_I
      splitting and neutrino mass.
    value: 0.0025
    range: example 2.5e-3
    role: core
    status: inferred
  - name: inert-doublet quartics
    symbol: lambda_3, lambda_4
    description: Quartics adjusted to realize the observed eta_R relic abundance while satisfying vacuum
      stability.
    range: example points include lambda_3 about 0.79 and lambda_4 about -0.806
    role: core
    status: inferred
  - name: right-handed neutrino masses
    symbol: M_i
    description: Masses induced by y_i <S>.
    range: large masses induced after PQ breaking
    unit: GeV
    role: core
    status: inferred
  - name: cutoff scale
    symbol: M_*
    description: Cutoff scale associated with the dimension-five scalar operator.
    range: example about 1.54e13 GeV
    unit: GeV
    role: core
    status: inferred
