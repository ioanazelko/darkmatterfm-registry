identity:
  name: Scotogenic inert scalar dark matter with Z2-odd vector-like quarks
  family: scotogenic_inert_doublet_dark_matter
  aliases:
  - Z2-odd inert Higgs doublet dark matter
  - lightest neutral inert scalar H_I dark matter
  short_description: The paper extends the Standard Model with a Z2-odd inert Higgs doublet, three singlet
    Majorana fermions, and vector-like colored fermions; the lightest neutral inert-doublet component
    is taken as the dark matter candidate while the new fields generate loop-level top flavor-changing
    neutral-current decays.
  historical_origin_or_motivation: The construction is motivated by the Ma scotogenic neutrino-mass mechanism
    and by using Z2-odd loop particles to enhance top-quark flavor-changing neutral-current decays.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - scotogenic neutrino-mass model
  - inert Higgs doublet model
  - Standard Model gauge theory with an imposed Z2 parity
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The assigned text gives the new Yukawa interactions, inert-doublet scalar potential, vector-like-quark
    mass mixing, and gauge couplings needed for the top-FCNC analysis; the Standard Model terms are not
    rewritten as a single full Lagrangian.
