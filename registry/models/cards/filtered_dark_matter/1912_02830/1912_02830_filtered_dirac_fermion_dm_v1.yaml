identity:
  name: Filtered Dirac fermion dark matter at a first-order phase transition
  family: filtered_dark_matter
  aliases:
  - filtered dark matter
  - FOPT-filtered dark matter
  short_description: A singlet Dirac fermion dark-matter toy model in which a first-order phase transition
    gives the fermion a large mass, bubble walls filter out low-momentum particles, and the survivors
    set the relic abundance.
  historical_origin_or_motivation: Introduced to generate superheavy thermal-origin dark matter beyond
    the Griest-Kamionkowski mass bound by changing freeze-out into bubble-wall filtration.
  status: speculative
  model_kind: simplified_model
