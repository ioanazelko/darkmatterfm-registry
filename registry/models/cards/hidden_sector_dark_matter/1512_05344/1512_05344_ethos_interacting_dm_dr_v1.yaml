  embedded_in_larger_framework: 'yes'
  notes: The paper states ETHOS is not an EFT in the particle-physics sense, but a mapping from UV-complete
    or low-energy DM theories to effective structure-formation parameters; it illustrates mappings for
    representative particle models.
