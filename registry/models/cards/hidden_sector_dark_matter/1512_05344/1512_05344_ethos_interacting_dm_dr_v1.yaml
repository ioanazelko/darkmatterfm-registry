identity:
  name: ETHOS interacting dark matter-dark radiation framework
  family: hidden_sector_dark_matter
  aliases:
  - Effective Theory of Structure Formation
  - ETHOS
  short_description: A phenomenological framework mapping non-gravitational dark matter microphysics,
    especially dark matter-dark radiation scattering and self-interactions, into effective structure-formation
    parameters.
  historical_origin_or_motivation: Introduced to classify dark matter theories by their effects on the
    linear matter power spectrum and self-interaction transfer cross section rather than by intrinsic
    particle labels.
  status: emerging
  model_kind: phenomenological_parameterization
