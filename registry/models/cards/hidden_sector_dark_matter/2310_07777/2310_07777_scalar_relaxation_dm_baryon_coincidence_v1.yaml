parameters:
  core:
  - name: scalar decay constant over baryon coupling
    symbol: f/c_B
    description: Scale controlling the scalar coupling to the baryonic confinement sector.
    value: 10^12
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: Benchmark inferred from requiring relaxation to begin when m_phi equals H.
  - name: dark-to-baryon scalar coupling ratio
    symbol: c_D/c_B
    description: Ratio setting the relaxed dark matter to baryon energy-density ratio.
    value: O(0.2-1)
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: At the minimum rho_DM/rho_B=c_B/c_D up to order-one factors; the benchmark text discusses rho_D
      about 5 rho_B.
  - name: bare potential scale
    symbol: Lambda_0
    description: Amplitude scale of the bare periodic potential that stops further scalar relaxation.
    value: '100'
    unit: MeV
    role: core
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: Benchmark value used to keep dense environments from moving the scalar too far.
  - name: periodicity scale
    symbol: F
    description: Field-space scale in the small bare potential for phi.
    value: 10^7
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: Chosen small enough to scan the QCD scale and satisfy fifth-force considerations.
  - name: reheating temperature after entropy dump
    symbol: T_RH
    description: Temperature after the heavy E population decays into the Standard Model.
    value: '10'
    unit: MeV
    role: cosmological
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: Used in the Standard Model cosmological history.
  nuisance: []
  derived:
  - name: relaxed energy-density ratio
    symbol: rho_DM/rho_B
    description: Ratio fixed by the scalar finite-density minimum.
    value: c_B/c_D, order unity
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - '2310_07777'
    notes: The mechanism is designed to land near the observed dark matter-baryon coincidence.
