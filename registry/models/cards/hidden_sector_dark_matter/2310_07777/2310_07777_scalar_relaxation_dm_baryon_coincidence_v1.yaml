identity:
  name: Scalar relaxation model for the dark matter-baryon coincidence
  family: hidden_sector_dark_matter
  aliases:
  - Dynamical equilibration of dark matter and baryon energy densities
  short_description: A light scalar controls baryon and dark matter masses through confinement-scale dependence
    so that the finite-density potential relaxes their energy densities to comparable values after both
    species are present.
  historical_origin_or_motivation: Introduced to explain why the dark matter and baryon energy densities
    are within a factor of a few despite unrelated microscopic production histories.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - scalar-dependent dimensional transmutation
  - hidden confining dark sector
  lagrangian_available: partial
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes effective scalar couplings to QCD and a dark confining sector and sketches a
    vector-like-fermion UV completion for the exponential confinement-scale dependence.
particle_content:
  dark_matter_candidate:
    name: D, an arbitrary nonrelativistic dark matter state with scalar-dependent mass
    spin: unknown
    statistics: unknown
    elementary_or_composite: unknown
    number_of_components: single_component
  additional_dark_sector_particles:
  - confining dark sector with field strength G_D
  mediators:
