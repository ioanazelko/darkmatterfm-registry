      symbol: F
      value: 10^7
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '2310_07777'
      notes: Benchmark value used in the Standard Model implementation.
  topological_defects_possible: unknown
interactions:
  portals:
