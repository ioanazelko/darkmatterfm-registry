validity_domain:
- id: finite_density_dominated_relaxation
  applies_to: model
  condition: Scalar evolution must be dominated by baryon and dark matter rest-mass density during the
    relaxation epoch.
  status: assumed
  extrapolation_risk: high
  caveats:
  - Standard Model thermal free energy can dominate without an entropy dump.
  source_reference_ids:
  - '2310_07777'
  notes: The paper adds an entropy dump because loop-induced Standard Model thermal effects otherwise
    prevent relaxation.
- id: late_environment_control
  applies_to: model
  condition: The bare potential must be strong enough that neutron-star and laboratory densities do not
    move phi enough to unacceptably change proton masses.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Simplest implementation is excluded by density-dependent proton masses.
  source_reference_ids:
  - '2310_07777'
  notes: The Standard Model implementation adds a bare potential to fix the late-time scalar value.
