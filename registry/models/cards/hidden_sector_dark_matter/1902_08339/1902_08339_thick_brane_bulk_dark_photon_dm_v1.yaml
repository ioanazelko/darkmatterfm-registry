    on the dark brane; the paper does not spell out an additional decay-forbidding symmetry beyond the
    dark charge assignment.
  symmetries:
  - name: U(1)_D coupled to B-L plus Q_D
    type: gauge
    exact_or_approximate: broken
    breaking: Broken by boundary conditions, giving massive 4D dark-photon KK states without a dark Higgs
      field.
    breaking_scale: null
  - name: brane-localized kinetic terms
    type: unknown
    exact_or_approximate: unknown
    breaking: Used to create different wave functions in the thick-brane and bulk regions.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
