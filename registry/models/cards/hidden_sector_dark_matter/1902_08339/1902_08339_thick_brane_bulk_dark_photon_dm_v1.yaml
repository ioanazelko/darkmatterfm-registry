      KK mode.
    range: 0.1-1 GeV in benchmark models
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: inverse Standard Model brane thickness
    symbol: L^-1
    description: Controls the thick-brane suppression of the dark coupling to Standard Model zero modes.
    range: 2-10 TeV in benchmark models
    unit: TeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: dark matter mass
    symbol: m_DM
    description: Chosen below the lightest dark-photon KK state; examples lie in the MeV range.
    range: about 20-400 MeV
    unit: MeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: dark gauge coupling
    symbol: g_D
    description: 4D coupling of the lowest dark-photon KK state to the brane-localized DM, fixed in benchmarks
      by the observed relic density.
    range: benchmark-dependent; alpha_D values remain below 0.4
    role: core
    status: inferred
    source_reference_ids: []
  - name: brane-localized kinetic coefficients
    symbol: alpha_A, alpha_B
    description: Coefficients for brane-localized kinetic terms at the dark brane and inside the thick
      SM brane.
    range: benchmark and scan values
    role: core
    status: assumed
    source_reference_ids: []
