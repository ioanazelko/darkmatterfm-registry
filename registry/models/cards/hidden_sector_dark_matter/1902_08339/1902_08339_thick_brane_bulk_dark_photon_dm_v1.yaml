identity:
  name: Thick-brane bulk-dark-photon dark matter
  family: hidden_sector_dark_matter
  aliases:
  - brane-localized dark matter with bulk dark photon
  - flat extra-dimensional dark photon DM
  - thick-brane suppressed dark coupling model
  short_description: A flat extra-dimensional dark-sector model in which complex scalar dark matter is
    localized on a thin brane, the Standard Model occupies a separated thick brane, and a bulk dark-photon
    KK tower mediates suppressed interactions while setting the thermal relic abundance.
  historical_origin_or_motivation: Built to obtain naturally small dark-photon and Higgs-portal couplings
    from extra-dimensional wave-function overlap rather than tiny kinetic mixing or Higgs-portal parameters.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - dark photon model
  - single flat extra dimension
  - UED-like thick Standard Model brane
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes a 5D action with brane-localized kinetic terms and derives the KK wave functions,
    masses, and effective 4D couplings. The 5D setup should be treated as an effective extra-dimensional
    construction.
