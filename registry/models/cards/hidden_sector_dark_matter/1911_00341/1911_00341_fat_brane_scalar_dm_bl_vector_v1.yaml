  applies_to: model
  condition: SM fields live in a fat brane of width L near the opposite corner of the chiral square, with
    L much smaller than R; dark matter is localized at (0,0).
  valid_range: L << R in the paper setup
  status: assumed
  extrapolation_risk: high
  caveats:
