identity:
  name: Six-dimensional fat-brane scalar dark matter with B-L vector mediator
  family: hidden_sector_dark_matter
  aliases:
  - fat-brane scalar DM
  - six-dimensional B-L vector mediator dark matter
  short_description: A two-extra-dimensional chiral-square model with complex scalar dark matter on a
    thin brane, Standard Model fields in a fat brane, and a bulk abelian KK vector mediator coupled through
    B-L and dark charge rather than kinetic mixing.
  historical_origin_or_motivation: Uses brane localization and brane-localized kinetic terms to mediate
    dark matter interactions with the visible sector without a dark-photon kinetic-mixing term.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
