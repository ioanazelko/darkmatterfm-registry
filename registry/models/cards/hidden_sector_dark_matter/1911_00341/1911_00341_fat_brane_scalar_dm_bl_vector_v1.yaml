  - two universal extra dimensions
  - chiral square compactification
  - brane-localized kinetic term vector mediator
  lagrangian_available: partial
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper specifies a 6D abelian gauge-field action with brane-localized kinetic terms and derives
    KK masses/couplings; it treats the construction phenomenologically.
particle_content:
  dark_matter_candidate:
    name: complex scalar field confined on the thin brane
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
