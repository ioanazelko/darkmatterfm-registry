    symbol: x_f
    description: Ratio m_DM/T_f used in the relic-density estimate.
    value: 20
    role: cosmological
    status: assumed
  - name: effective relativistic degrees of freedom
    symbol: g_*
    description: Value used for freeze-out temperatures of 2-40 MeV.
    value: 10.75
    role: cosmological
    status: assumed
