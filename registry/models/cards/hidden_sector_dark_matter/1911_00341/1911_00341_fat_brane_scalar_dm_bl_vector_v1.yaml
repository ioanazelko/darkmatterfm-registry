symmetries:
  stabilizing_mechanism: The complex scalar dark matter is stated to be naturally stable via a Z2 symmetry;
    KK parity is not needed because the dark matter is confined on the thin brane.
  symmetries:
  - name: Z2 dark matter parity
    type: discrete
    exact_or_approximate: exact
  - name: abelian B-L/dark-charge gauge symmetry
    type: gauge
    exact_or_approximate: broken
    breaking: Boundary conditions on the chiral square break the U(1) without a bulk Higgs mechanism.
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - B-L charged Standard Model fermions
  - electrons
  - muons when kinematically accessible
  - neutrinos
  dark_sector_couplings:
  - dark charge Q_D of the scalar dark matter to the bulk vector mediator
  mediator_types:
  - massive KK abelian vector bosons
  interaction_operators:
  - 6D covariant derivative coupling proportional to g_6D(B-L+Q_D)
  - brane-localized kinetic term for the vector field at the dark-matter brane
  scattering:
