identity:
  name: BDW gauge-kinetic-mixing scalar dark matter
  family: hidden_sector_dark_matter
  aliases:
  - BDW model with gauge kinetic mixing
  - U(1)_X BDW scalar dark matter
  short_description: A kinetic-mixing variant of the BDW U(1)_X dark-sector model with vectorlike lepton
    and quark doublets, two complex scalar singlets, a massive Z' boson, and a stable real scalar _r as
    a dark matter candidate; in the studied parameter sets _r is underabundant and needs an additional
    dark matter component.
  historical_origin_or_motivation: The paper generalizes the Belanger-Delaunay-Westhoff model by introducing
    U(1)_Y-U(1)_X gauge kinetic mixing to address muon g-2 and semileptonic B-decay anomalies while retaining
    a stable scalar dark matter candidate.
  status: speculative
  model_kind: complete_theory
