  - metastable dark matter state decaying to a neutrino or sneutrino plus dark gauge bosons or gauginos
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark matter is metastable because lower-dimensional decay operators and tree-level
    Yukawa couplings to Standard Model matter are forbidden; a GUT-suppressed dimension-six operator gives
    the long lifetime.
  symmetries:
  - name: U(1)_d
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken at the GeV scale by the dark sector
  - name: GUT-scale protective symmetries
    type: unknown
    exact_or_approximate: unknown
    breaking: forbid prompt dimension-five decays and unwanted tree-level Yukawa couplings
  - name: Standard Model gauge symmetry with hypercharge kinetic mixing
    type: gauge
    exact_or_approximate: exact
    breaking: electroweak symmetry breaking occurs as in the visible sector
  topological_defects_possible: unknown
