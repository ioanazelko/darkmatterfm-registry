  - neutrinos
  - hypercharge sector
  - Higgs doublet
  dark_sector_couplings:
  - U(1)_d gauge coupling
  - gauge kinetic mixing of U(1)_d with hypercharge
  - dimension-six GUT-suppressed dark matter decay operator
  - Higgs-coupling operator that generates inelastic splitting
  mediator_types:
  - dark vector boson
  - dark gaugino
  - heavy GUT-scale fields
  - singlet scalar superfield
  interaction_operators:
  - dimension-six operator inducing dark matter decay into the dark sector
  - kinetic mixing term between dark and hypercharge field strengths
  - W_split = m_N N^2 + m_DM Phi_2 Phi_2 + Phi_2 H_d N
  scattering:
    elastic: 'no'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - annihilation to Standard Model gauge bosons in one regime
