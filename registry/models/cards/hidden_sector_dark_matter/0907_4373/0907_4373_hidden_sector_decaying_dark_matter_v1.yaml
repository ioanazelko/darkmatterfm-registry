  notes: The paper gives a representative supersymmetric GUT-motivated construction with kinetic mixing,
    a dimension-six decay operator, and a Higgs-coupling splitting operator; the UV completion is sketched
    through heavy GUT-scale fields.
particle_content:
  dark_matter_candidate:
    name: fermionic component of vector-like chiral superfields charged under U(1)_d
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - dark U(1)_d gauge boson
