  decay_channels:
  - dark matter decay to a neutrino or sneutrino plus two dark gauge bosons or gauginos
  - dark gauge boson decay to light Standard Model leptons through kinetic mixing
  - dark gaugino decay to a dark gauge boson or to a photon plus gravitino depending on the dark spectrum
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: leptonic final states favored by kinematics of the light dark sector
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
