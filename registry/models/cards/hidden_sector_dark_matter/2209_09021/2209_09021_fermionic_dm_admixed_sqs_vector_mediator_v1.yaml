    notes: The paper states y_phi is determined by the thermal relic abundance.
  - name: quark-dark-mediator coupling
    symbol: g_chi
    description: Feeble coupling between quark fields and vector dark mediator.
    value: about 1e-4
    role: core
    status: inferred
    notes: The paper states changes below 1e-4 do not significantly affect the EoS.
