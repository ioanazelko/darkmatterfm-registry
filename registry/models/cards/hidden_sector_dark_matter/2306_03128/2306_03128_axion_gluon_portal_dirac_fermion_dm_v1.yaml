interactions:
  portals:
  - axion
  standard_model_targets:
  - QCD gluons
  - hadrons near and below the QCD transition
  - photons through loop-induced low-energy axion coupling
  dark_sector_couplings:
  - pseudoscalar axion coupling to Dirac fermion dark matter proportional to c_chi m_chi/f_a
  mediator_types:
  - pseudoscalar axion-like particle
  interaction_operators:
  - -i c_chi m_chi a/f_a chi_bar gamma5 chi
