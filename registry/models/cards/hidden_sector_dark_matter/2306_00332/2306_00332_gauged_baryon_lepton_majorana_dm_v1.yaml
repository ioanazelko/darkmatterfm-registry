    breaking can stabilize a Majorana fermion chi_L as particle dark matter.
  historical_origin_or_motivation: The paper uses high-scale gauged baryon and lepton number with enlarged
    scalar breaking sectors to connect dark matter, seesaw neutrino masses, leptogenesis, and gravitational-wave
    signatures.
  status: speculative
  model_kind: complete_theory
