identity:
  name: Millicharged atomic dark matter with elastic nuclear scattering
  family: hidden_sector_dark_matter
  aliases:
  - millicharged atomic dark matter
  - atomic dark matter with massless dark photon
  short_description: A simplified atomic dark matter model in which dark proton and dark electron constituents
    bind into neutral dark atoms through an unbroken massless U(1)_d interaction, while kinetic mixing
    gives the constituents small ordinary electric charges and enables mostly elastic direct interactions
    in the hierarchical-mass regime.
  historical_origin_or_motivation: The paper presents an economical atomic dark matter scenario using
    only the massless dark photon already required for binding, instead of adding a second massive mediator.
  status: speculative
  model_kind: simplified_model
