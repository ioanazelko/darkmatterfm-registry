  - Abelian Higgs mechanism
  - Higgs portal
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes a renormalizable gauge-invariant Lagrangian with a complex scalar X, dark Higgs
    field, and dark gauge boson Zprime; symbols are partially stripped in the extracted text.
particle_content:
  dark_matter_candidate:
    name: complex singlet scalar X
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - dark Higgs H_1
  - dark photon Zprime
  mediators:
  - dark Higgs H_1
  - dark photon Zprime
  dark_radiation_species:
  - light dark photon contribution to Delta N_eff in the benchmark regime
  excited_or_degenerate_states: []
  long_lived_particles:
