  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark gauge charge assignment is chosen so no gauge-invariant operators up
    to dimension five make X decay to Standard Model particles, making X stable or very long-lived.
  symmetries:
  - name: spontaneously broken dark gauged U(1) symmetry
    type: gauge
    exact_or_approximate: broken
    breaking: broken by the dark Higgs vacuum expectation value
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - muons
  - taus
  - neutrinos
  - Standard Model Higgs sector
  dark_sector_couplings:
  - dark gauge coupling g_X
  - lambda_X |X|^2 |phi|^2
  - lambda_HX |X|^2 |H|^2 set to zero for simplicity
  - dark-Higgs/SM-Higgs mixing
  mediator_types:
  - dark photon Zprime
  - dark Higgs H_1
  interaction_operators:
  - renormalizable gauge kinetic and scalar potential terms for X, the dark Higgs, and the SM Higgs
  annihilation_channels:
  - X Xbar -> Zprime Zprime
  - X Xbar -> H_1 Zprime
  - X Xbar -> H_1 H_1
  - suppressed X Xbar -> charged leptons or neutrinos
  decay_channels:
  - Zprime decays eventually to neutrinos when lighter than the muon
  self_scattering_channels: []
  tree_or_loop_level: both
