identity:
  name: Gauged charged complex scalar dark matter with dark Higgs and dark photon
  family: hidden_sector_dark_matter
  aliases:
  - charged complex scalar DM
  - light dark sector with Higgs portal
  - dark Higgs and dark photon scalar DM
  short_description: A UV-complete gauged light-dark-sector model in which a complex scalar X is the dark
    matter candidate and freezes out through dark Higgs and dark photon channels.
  historical_origin_or_motivation: Built to address the observed dark matter relic density together with
    the Belle II missing-energy excess, the muon g-2 discrepancy, and a light-dark-photon contribution
    to Delta N_eff.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
