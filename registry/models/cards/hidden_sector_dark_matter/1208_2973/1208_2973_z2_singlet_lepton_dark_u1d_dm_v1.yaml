    a gauge-singlet vector-like lepton is odd under a Z2 parity, stable, weak-scale, and thermally depleted
    through dark-scalar final states.
  historical_origin_or_motivation: Added to avoid the nonviable stable charged or dark-charged neutral
    leptons in the Higgs diphoton and muon g-2 framework while retaining a dark-sector connection.
  status: speculative
  model_kind: simplified_model
