  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The main paper gives the vector-like lepton and kinetic-mixing framework; the dark matter extension
    is described compactly in the appendix with a U(1)d-breaking scalar, a gauge-singlet vector-like lepton,
    and a Z2 parity.
