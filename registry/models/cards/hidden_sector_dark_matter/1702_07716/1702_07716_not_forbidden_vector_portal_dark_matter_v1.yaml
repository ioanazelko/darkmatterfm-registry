validity_domain:
- id: nfdm_mass_hierarchy
  applies_to: model
  condition: Main NFDM regime has m_chi < m_Aprime < 2 m_chi so two-body annihilation is kinematically
    forbidden while 3-to-2 processes remain active.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Outside this hierarchy the model reduces toward forbidden, secluded, or conventional vector-portal
    regimes.
  source_reference_ids:
  - '1702_07716'
- id: weakly_coupled_perturbative_region
  applies_to: parameter
  condition: The paper uses alpha_prime values up to about 4 as a perturbativity guide.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Near this upper range perturbativity is only a rough criterion.
  source_reference_ids:
  - '1702_07716'
- id: kinetic_or_secluded_temperature
  applies_to: cosmological_history
  condition: Either kinetic equilibrium with the SM is maintained by sufficient epsilon or a secluded
    dark sector temperature must be specified.
  status: assumed
  extrapolation_risk: high
  caveats:
  - Relic abundance contours depend on this cosmological branch.
  source_reference_ids:
  - '1702_07716'
