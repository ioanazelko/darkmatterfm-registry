identity:
  name: Not-Forbidden vector-portal dark matter
  family: hidden_sector_dark_matter
  aliases:
  - NFDM
  - Not-Forbidden Dark Matter
  - vector-portal NFDM
  short_description: A hidden U(1) model in which Dirac fermion dark matter has a slightly heavier dark
    photon mediator, making conventional two-body annihilation kinematically forbidden while 3-to-2 reactions
    and mediator decays determine the relic abundance.
  historical_origin_or_motivation: The paper proposes NFDM as a weakly coupled alternative to ordinary
    freeze-out and SIMP-like mechanisms when 2-to-2 annihilation is suppressed but 3-to-2 processes remain
    allowed.
  status: speculative
  model_kind: simplified_model
theory:
