identity:
  name: Hidden hot dark matter
  family: hidden_sector_dark_matter
  aliases:
  - HHDM
  - hidden-sector relativistic thermal relic
  short_description: A hidden-sector dark matter species that thermalizes within a colder hidden sector,
    decouples while relativistic, never equilibrates with Standard Model particles, and can nevertheless
    account for all dark matter because its temperature and number density are lower than the visible
    sector.
  historical_origin_or_motivation: The paper points out that hot relics fail as dark matter only if they
    shared the Standard Model temperature; a colder hidden sector can make a relativistically decoupled
    thermal relic behave as viable cold or warm dark matter.
  status: speculative
  model_kind: phenomenological_parameterization
theory:
  theory_level: phenomenological_parameterization
  parent_frameworks:
  - hidden-sector dark matter
  - relativistically decoupled thermal relic
  - minimal broken hidden U(1) example
  lagrangian_available: 'no'
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper intentionally treats a broad class rather than one full theory, with a minimal example
    using a hidden particle, a lighter hidden particle, and a massive vector mediator from a broken U(1).
particle_content:
  dark_matter_candidate:
    name: hidden-sector thermalized species chi
    spin: unknown
    statistics: unknown
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - lighter hidden particle psi in the minimal example
  - massive hidden vector boson U
  - hidden Higgs sector associated with the broken U(1)
  mediators:
  - heavy hidden-sector mediator
  - massive hidden vector boson U
  dark_radiation_species: []
