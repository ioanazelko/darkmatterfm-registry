  tree_or_loop_level: unknown
parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Allowed HHDM mass range quoted for the class of models.
    value: null
    range:
      min: '3'
      max: 1e7
      inclusive_min: true
      inclusive_max: true
      unit: keV
      notes: Equivalent to 3 keV to 10 TeV from the paper's opening summary.
    unit: keV
    role: core
    status: approximate
    source_reference_ids:
    - 0912_2346
    notes: The summary later describes the lower end as a few keV and the upper end as a few to ten TeV
      depending on assumptions.
  - name: dark-to-Standard-Model temperature ratio at hidden decoupling
    symbol: xi_f
    description: Ratio T_chi/T of the hidden sector to Standard Model temperatures at freeze-out, which
      fixes the mass-relic-density relation.
    value: null
    unit: null
    role: core
    status: speculative
    source_reference_ids:
    - 0912_2346
    notes: The relic abundance depends on xi_f because the hidden sector is colder than the visible sector.
  - name: internal degrees of freedom
    symbol: d_chi
    description: Internal degrees of freedom for the hidden thermal relic.
    value: 4 for a Dirac fermion or 2 for a Majorana fermion in the worked fermion example
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - 0912_2346
    notes: The paper states that the analysis is for a fermion but can be adapted to bosons.
  - name: hidden four-fermion coupling
    symbol: G_D
    description: Effective hidden-sector four-fermion coupling controlling relativistic decoupling in
      the benchmark treatment.
    value: null
    unit: GeV^-2
    role: core
    status: speculative
    source_reference_ids:
    - 0912_2346
    notes: In the minimal U(1) example, G_D is approximately g_U^2/m_U^2.
  - name: target relic density
    symbol: Omega_d h^2
    description: Dark matter density used in the relic abundance discussion.
    value: '0.11'
    unit: null
    role: cosmological
    status: established
    source_reference_ids:
