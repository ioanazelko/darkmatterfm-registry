  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark matter is assumed stable or sufficiently long-lived, and it never thermalizes
    with Standard Model particles; in the minimal model the hidden interaction is a spontaneously broken
    U(1) gauge symmetry.
  symmetries:
  - name: hidden-sector U(1)
    type: gauge
    exact_or_approximate: broken
    breaking: Spontaneously broken, giving a massive vector boson U in the minimal example.
    breaking_scale:
      name: hidden vector mass
      symbol: m_U
      description: Mass of the hidden vector mediator in the minimal broken U(1) example.
      value: null
      unit: null
      role: core
      status: speculative
      source_reference_ids:
      - 0912_2346
      notes: The paper assumes m_chi is less than m_U and T_f is less than m_U in the four-fermion limit.
  topological_defects_possible: unknown
