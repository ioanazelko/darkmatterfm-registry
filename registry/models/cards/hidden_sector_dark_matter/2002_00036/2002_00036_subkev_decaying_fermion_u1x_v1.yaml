identity:
  name: Sub-keV decaying fermion dark matter in anomaly-free hidden U(1)_X
  family: hidden_sector_dark_matter
  aliases:
  - degenerate sub-keV fermion dark matter
  - hidden U(1)_X decaying dark matter
  - anomaly-free chiral fermion dark sector
  short_description: A hidden U(1)_X dark sector with five chiral Weyl fermions and two dark scalars;
    a sub-keV Dirac fermion is produced nonthermally by scalar decay and later decays to a massive dark
    photon plus a massless Weyl fermion.
  historical_origin_or_motivation: Introduced to connect a decaying-dark-matter explanation of the Hubble
    tension with a degenerate fermion solution to the core-cusp problem.
  status: speculative
  model_kind: complete_theory
theory:
