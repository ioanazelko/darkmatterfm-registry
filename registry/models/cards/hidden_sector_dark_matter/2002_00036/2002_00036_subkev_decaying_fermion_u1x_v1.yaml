  applies_to: model
  condition: The viable examples use lambda_FS between about 0.3 and 0.5 Mpc and favor m_DM around 300-1000
    eV.
  status: inferred
  extrapolation_risk: high
  caveats:
  - The paper notes tension with some degenerate-fermion core-cusp mass preferences.
  source_reference_ids: []
- id: late_decay_lifetime
  applies_to: model
  condition: The parent fermion must decay after recombination with an effective lifetime around 35 Gyr
