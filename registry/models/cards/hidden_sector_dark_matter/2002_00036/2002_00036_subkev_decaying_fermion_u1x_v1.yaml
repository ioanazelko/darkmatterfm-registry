  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The text specifies a hidden U(1)_X, anomaly-canceling chiral fermions, two complex scalars, dark
    Yukawa terms, and inflaton couplings; it does not give a complete scalar potential or full UV embedding
    beyond the dark sector assumptions.
particle_content:
