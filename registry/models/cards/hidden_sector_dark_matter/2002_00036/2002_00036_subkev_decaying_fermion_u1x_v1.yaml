  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: 'The model uses long-lived rather than absolutely stable dark matter: tiny hidden
    U(1)_X gauge coupling gives psi_DM a lifetime longer than the age of the Universe, with decay after
    recombination into A_prime plus a massless Weyl fermion.'
