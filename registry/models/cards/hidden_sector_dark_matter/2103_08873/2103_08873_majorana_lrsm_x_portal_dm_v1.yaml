  short_description: A left-right symmetric model extended by U(1)_X, a scalar Phi_X, and a vector-like
    fermion pair whose light Majorana eigenstate is stable and communicates with Standard Model fermions
    through a new neutral gauge boson X.
  historical_origin_or_motivation: The paper motivates the construction by noting that the minimal left-right
    symmetric model has no dark-matter candidate and by modifying an earlier U(1)_X Dirac-fermion setup
    to give Majorana masses.
  status: speculative
  model_kind: complete_theory
