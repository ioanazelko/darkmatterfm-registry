    to neutrinos, and has a small e+e- branch that can source the Galactic 511-keV line.
  historical_origin_or_motivation: Developed as a new parameter region of the feeton dark matter model
    motivated by the Galactic 511-keV gamma-ray excess and low-energy neutrino flux predictions.
