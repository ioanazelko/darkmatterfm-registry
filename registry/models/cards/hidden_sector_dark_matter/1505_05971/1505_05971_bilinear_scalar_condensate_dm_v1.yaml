  short_description: A classically scale-invariant strongly interacting hidden SU(N_c) sector whose scalar
    bilinear condensate generates the electroweak scale through the Higgs portal, with condensate excitations
    as scalar-antiscalar bound-state dark matter.
  historical_origin_or_motivation: The paper introduces multiple hidden scalar flavors so that excitations
    of a scalar bilinear condensate can be realistic dark matter while dynamically generating the Higgs
    mass scale.
  status: speculative
  model_kind: complete_theory
