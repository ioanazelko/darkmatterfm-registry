  short_description: A simplified hidden-sector model with a 750 GeV CP-even singlet scalar mediator,
    a vector-like quark generating gluon/photon couplings, and a neutral Z2-stable vector-like fermion
    whose thermal annihilation sets the relic density.
  historical_origin_or_motivation: Built to connect the 750 GeV diphoton-resonance interpretation with
    a neutral hidden-sector fermion dark matter candidate.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - 750 GeV singlet scalar resonance model
  - Higgs portal
  - vector-like fermion hidden sector
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes an effective renormalizable singlet-scalar/vector-like-fermion Lagrangian without
    committing to a UV completion.
particle_content:
  dark_matter_candidate:
    name: neutral SU(2)-singlet vector-like fermion psi
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - CP-even SU(2)-singlet scalar mediator phi
  - SU(2)-singlet color-triplet vector-like quark U
  mediators:
  - 750 GeV singlet scalar phi
  - SM Higgs h through singlet-Higgs mixing
  - vector-like quark loops
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles:
  - neutral vector-like fermion psi when the Z2-breaking mixing y_mix is zero
  unstable_parent_particles:
  - singlet scalar phi can decay to psi pairs if M_psi < M_phi/2
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 symmetry with the vector-like fermion odd stabilizes the neutral
    fermion when the Z2-breaking mixing term is set to zero.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: The paper notes that the Z2 is broken only by a mixing term y_mix; the dark matter case
      sets y_mix=0.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - gluons
  - photons
  - Higgs bosons
  - top quarks
  - bottom quarks
  - W bosons
  - Z bosons
  dark_sector_couplings:
  - Yukawa coupling y_psi between phi and the neutral vector-like fermion
  - Yukawa coupling y_U between phi and the vector-like quark U
  - singlet-Higgs mixing angle s_h
  mediator_types:
  - CP-even scalar
  - SM Higgs
  - vector-like quark loop
  interaction_operators:
  - phi psi psi
  - phi U U
  - Higgs-singlet mixing terms
