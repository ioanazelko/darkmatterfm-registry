parameters:
  core:
  - name: dark fermion mass
    symbol: m_D
    description: Common mass scale for the nearly degenerate dark fermions.
    range: roughly 0.3 GeV to 10 GeV examples; benchmark m2 = 0.3 GeV
    unit: GeV
    role: core
    status: inferred
    notes: The paper discusses 0.3-1.0 GeV examples and a 10 GeV illustration, with a 0.3 GeV XENON1T-fit
      benchmark.
  - name: mass splitting
    symbol: Delta m
    description: m2 - m1 controlling the exothermic recoil energy.
    value: '2.23'
    unit: keV
    role: core
    status: inferred
    notes: Benchmark used to illustrate a XENON1T-like excess; text also discusses m around 3 keV.
  - name: dark gauge coupling
    symbol: g_X
    description: Hidden-sector U(1)_X gauge coupling.
    value: '0.01'
    role: core
    status: inferred
    notes: Used as a fixed example in relic-density and dark-photon-constraint discussion.
  - name: kinetic mixing
    symbol: epsilon
    description: Kinetic mixing between U(1)_X and hypercharge.
    range: about 1e-7 for freeze-in; about 1e-4 for freeze-out; examples up to 1e-5 in lifetime discussion
    role: core
    status: inferred
  - name: dark photon mass
    symbol: m_A'
    description: Mass of the hidden gauge boson mediating scattering and annihilation.
    range: model dependent; scans include resonance near m_A prime = 2 m_D
    unit: GeV
    role: core
    status: inferred
  - name: DM-electron scattering cross section
    symbol: sigma_e
    description: Inelastic dark-matter electron scattering cross section used in XENON fits.
    value: '3.36e-44'
    unit: cm^2
    role: core
    status: inferred
    notes: Benchmark with m2 = 0.3 GeV and Delta m = 2.23 keV.
