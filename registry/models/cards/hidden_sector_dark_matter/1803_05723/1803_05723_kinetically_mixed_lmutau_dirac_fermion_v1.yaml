  - arxiv:1803.05723
  - arxiv:2209.03397
theory_to_observable_routing:
  routes:
  - agent_notes: Primary gives ingredients and package names but not a complete reproducible repository.
    caveats:
    - Do not use ADS metadata alone for numerical exclusions.
    constraint_ids:
    - con_lmutau_planck_relic
    - con_lmutau_xenon_si
    - con_lmutau_trident_b_lhc
    derived_quantities:
    - Omega_DM h^2
    - sigma_SI
    - m_Zprime/g_l
    - dilepton branching fractions
    description: Map L_mu-L_tau parameters through relic-density, direct-detection, and flavor/collider
      constraints.
    forward_model_chain:
    - inputs:
      - m_chi
      - m_Zprime
      - g_l
      - g_chi
      - epsilon
      notes: Reproduce the primary relic-density contours.
      outputs:
      - Omega_DM h^2
      step_id: relic
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs implementation named in primary
      validity: standard thermal history; resonance regions require numerical treatment
    - inputs:
      - mixed Z/Zprime couplings
      - nuclear matrix inputs
      notes: Compare to xenon limits with appropriate coupling normalization.
      outputs:
      - sigma_SI
      step_id: direct_detection
      step_type: analytic_formula
      tool_or_code: null
      validity: elastic spin-independent scattering only
    - inputs:
      - m_Zprime
      - g_l
      - epsilon
      - branching fractions
      notes: Overlay with relic and direct-detection regions.
      outputs:
      - trident bound
      - B-anomaly band
      - dilepton exclusions
      step_id: flavor_collider
      step_type: recasting
      tool_or_code: null
      validity: phenomenological recast from primary
    id: route_lmutau_scan_to_constraints
    input_parameters:
    - m_chi
    - m_Zprime
    - g_l
    - g_chi
    - epsilon
    likelihoods:
    - Planck relic-density target
    - XENON1T/XENONnT/DARWIN exclusion curves
    - neutrino-trident and B_s-mixing summaries
    observable_ids:
    - obs_lmutau_thermal_relic_density
    - obs_lmutau_nuclear_recoil
    - obs_lmutau_flavor_trident_window
    required_code_resources:
    - micrOMEGAs
    - collider/flavor recast code not released in primary
    route_status: planned
    source_model_features:
    - Dirac fermion charged under U(1)_{L_mu-L_tau}
    - kinetic mixing induces quark/electron couplings
    - massive Zprime mediator
    validation_tests:
    - Recover Omega_DM h^2 = 0.12 curves
    - recover m_Zprime/g_l band 540 GeV to 4.9 TeV
    - check XENON1T overlay for benchmark figures
