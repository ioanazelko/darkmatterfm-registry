identity:
  name: SU(2)_Z fermion WIMP cold dark matter
  family: hidden_sector_dark_matter
  aliases:
  - SU(2)_Z WIMP
  - psi_Z cold dark matter
  short_description: A hidden unbroken SU(2)_Z gauge sector whose fermions psi_Z1 and psi_Z2 can freeze
    out with weak-scale annihilation cross sections and whose preferred present WIMP candidate is a chargeless
    spin-zero SU(2)_Z bound state built from psi_Z fermions.
  historical_origin_or_motivation: The paper builds a linked dark-energy and dark-matter scenario where
    the SU(2)_Z scale drives an axion false vacuum and the SU(2)_Z fermion spectrum supplies WIMP cold
    dark matter.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - G_SM x SU(2)_Z hidden gauge sector
  - possible E6 unification
  - Peccei-Quinn-like U(1)_A^(Z) symmetry
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies SU(2)_Z charge assignments, messenger scalar choices, a singlet scalar that
    gives psi_Z masses, and a possible E6-origin story.
particle_content:
  dark_matter_candidate:
    name: chargeless spin-zero SU(2)_Z hadron made from psi_Z fermions
    spin: '0'
    statistics: boson
    elementary_or_composite: composite
    number_of_components: multi_component
  additional_dark_sector_particles:
  - psi_Z1
  - psi_Z2
  - SU(2)_Z gauge bosons
  - a_Z axion
  - sigma_Z scalar
  mediators:
  - SU(2)_Z gauge bosons
  - messenger scalar phi_Z
  - a_Z axion
  dark_radiation_species:
  - SU(2)_Z plasma before confinement
  excited_or_degenerate_states:
  - psi_Z2 may decay to psi_Z1 plus a_Z or be long-lived for small Yukawa couplings
  long_lived_particles:
  - psi_Z1
  - possibly psi_Z2
  unstable_parent_particles:
  - messenger scalar phi_1^Z
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The lightest SU(2)_Z fermion psi_Z1 is stable by the assumed mass ordering and
    hidden-sector quantum numbers; after SU(2)_Z confinement the present state is a neutral bound state.
  symmetries:
  - name: SU(2)_Z
    type: gauge
    exact_or_approximate: exact
    breaking: unbroken
    breaking_scale: null
  - name: U(1)_A^(Z)
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by sigma_Z and explicitly broken by SU(2)_Z instantons
    breaking_scale:
      name: v_Z
      symbol: v_Z
      value: about 300 GeV in examples
      unit: GeV
      status: assumed
      source_reference_ids: []
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  - vector
  standard_model_targets:
  - SM leptons through messenger scalar
  - electroweak gauge bosons through messenger production
  dark_sector_couplings:
  - SU(2)_Z gauge coupling
  - Yukawa couplings between phi_Z, psi_Z, and SM leptons
  - a_Z coupling to psi_Z
  mediator_types:
  - hidden SU(2)_Z gauge bosons
  - messenger scalar doublet/triplet
  - axion-like field a_Z
  interaction_operators:
  - phi_Z psi_Z l_SM Yukawa interactions
  - a_Z psi_Z gamma5 psi_Z coupling
  - SU(2)_Z gauge annihilation of psi_Z
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - psi_Z psi_Z annihilation through SU(2)_Z interactions
  decay_channels:
  - psi_Z2 -> psi_Z1 + a_Z
  - phi_1^Z -> psi_Z + SM lepton
  self_scattering_channels:
  - long-range a_Z-mediated psi_Z interactions are mentioned as under investigation
  cp_structure: complex Yukawa phases are used in the leptogenesis part of the same model
  flavor_structure: messenger scalar couples psi_Z1,2 to SM lepton flavors
  tree_or_loop_level: both
parameters:
  core:
  - name: SU(2)_Z confinement scale
    symbol: Lambda_Z
    description: Scale where SU(2)_Z becomes strong
    value: about 3e-3 eV
    unit: eV
    role: core
    status: inferred
    source_reference_ids: []
    notes: Also sets the dark-energy false-vacuum scale in the paper.
  - name: psi_Z1 mass
    symbol: m_psiZ1
    description: Mass of the lighter SU(2)_Z fermion
    range: preferred WIMP case O(100 GeV); too light below about 10 GeV disfavored heuristically
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
    notes: The paper gives an example m_psiZ1 = 100 GeV.
  - name: psi_Z2 mass
    symbol: m_psiZ2
    description: Mass of the heavier SU(2)_Z fermion
    range: O(100-1000 GeV); example 200 GeV
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
    notes: psi_Z2 can contribute if long-lived or through decay products.
  - name: SU(2)_Z high-scale coupling
    symbol: alpha_Z(M)
    description: Initial hidden gauge coupling at high scale
    value: about 1/42 for O(100 GeV) psi_Z masses
    role: core
    status: inferred
    source_reference_ids: []
  - name: messenger scalar mass
    symbol: m_phi1Z
    description: Mass of the lighter messenger scalar
    range: roughly 300 GeV to 1 TeV in examples and leptogenesis argument
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
    notes: This scalar links the hidden sector to SM leptons.
  nuisance: []
  derived:
  - name: annihilation cross section
    symbol: sigma_A v
    description: Cross section needed for order-one cold dark matter abundance
    value: about 3e-27 cm^3 s^-1
    unit: cm^3 s^-1
    role: derived
    status: inferred
    source_reference_ids: []
    notes: The paper uses a heuristic freeze-out estimate.
production:
  mechanisms:
