  applies_to: cosmological_history
  condition: Loops above the mass threshold form PBHs; lower-mass late loops leave relics.
  valid_range: M_T(t_i) greater or less than M_*
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The relic abundance and PBH abundance depend sensitively on winding definitions and string parameters.
  source_reference_ids:
  - 0906_3695
