  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper reviews the NLHT coset, gauge sector, scalar sector, fermion embeddings, and Yukawa
    structure; the low-energy description is a nonlinear sigma model with cutoff-scale limitations.
