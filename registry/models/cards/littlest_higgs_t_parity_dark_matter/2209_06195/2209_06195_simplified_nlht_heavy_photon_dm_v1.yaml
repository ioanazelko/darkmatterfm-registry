  short_description: A simplified new Littlest Higgs model with exact T-parity in which the stable lightest
    T-odd particle is the electrically neutral heavy photon A_H; T-odd heavy leptons act as co-annihilators
    to reproduce the relic density while vector-like quarks remain heavy.
  historical_origin_or_motivation: The paper studies the gauge-invariant new Littlest Higgs with T-parity
    and selects the heavy photon as a viable dark matter candidate for comparison with earlier LHT work.
  status: speculative
  model_kind: complete_theory
