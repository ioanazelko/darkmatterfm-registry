  - src_2105_13932
  notes: null
- id: bbn_helium3_constraint
  name: Order-of-magnitude BBN helium-3 overproduction constraint
  constraint_type: cosmological
  observable_channel: bbn
  applies: parameter_dependent
  constrained_parameters:
  - sigma_X/M_X
  - 3He/H
  excluded_regions:
  - Anti-macro annihilation on helium-4 that overproduces helium-3 relative to primordial abundance is
    disfavored.
  allowed_regions:
  - The paper finds BBN and CMB constraints are similar in order of magnitude, but treats CMB as more
    trustworthy.
  benchmark_implications:
  - A detailed BBN network calculation could tighten or loosen this estimate.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: low
  assumptions: []
  caveats:
  - Photofission tails and lithium production are deferred by the primary paper.
  source_reference_ids:
  - src_2006_01200
  notes: null
- id: human_null_event_bound
  name: Null observation of catastrophic human transits
  constraint_type: direct_detection
  observable_channel: terrestrial_transit
  applies: parameter_dependent
  constrained_parameters:
  - sigma_X
  - M_X
  - f_X
  excluded_regions:
  - Cross sections and abundances that would produce multiple obvious fatal events in monitored populations
    over the exposure period are disfavored.
  allowed_regions:
  - Primary estimate uses a 100 J injury threshold, a human cross-sectional area, 10 yr exposure, and
    a 95% Poisson null-event criterion.
  benchmark_implications:
  - Anti-macros can be easier to see than ordinary macros because annihilation deposits rest energy rather
    than only elastic kinetic energy.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: low
  assumptions: []
  caveats:
  - Sociological/reporting completeness and biological energy-deposition assumptions dominate the uncertainty.
  source_reference_ids:
  - src_2006_01200
  notes: null
