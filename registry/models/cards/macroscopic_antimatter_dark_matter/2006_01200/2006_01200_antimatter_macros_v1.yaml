  constraint_type: cosmological
  observable_channel: cmb
  applies: 'yes'
  constrained_parameters:
  - sigma_X/M_X
  excluded_regions:
  - Large reduced cross section above the paper-level CMB energy-injection bound is ruled out if anti-macros
    make all DM.
