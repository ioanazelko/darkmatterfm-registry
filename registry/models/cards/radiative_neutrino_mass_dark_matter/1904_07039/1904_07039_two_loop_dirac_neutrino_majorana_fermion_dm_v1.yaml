identity:
  name: Two-loop Dirac-neutrino Majorana-fermion dark matter model
  family: radiative_neutrino_mass_dark_matter
  aliases:
  - radiative Dirac neutrino mass model with Majorana fermion dark matter
  - Z2-odd singlet-fermion dark matter in a two-loop Dirac neutrino mass model
  short_description: A lepton-number-conserving extension of the Standard Model in which Dirac neutrino
    masses are generated at two loops and the lightest Z2-odd gauge-singlet Majorana fermion is a thermal
    dark matter candidate.
  historical_origin_or_motivation: Built to explain tiny Dirac neutrino masses radiatively while retaining
    a stable dark matter candidate and allowing enhanced lepton-flavor-violating Higgs decays.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - radiative Dirac neutrino mass
  - two-loop neutrino mass generation
  - lepton-number-conserving Standard Model extension
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'no'
  notes: The paper defines new fermions, scalar multiplets, Yukawa interactions, scalar potential terms,
    and discrete symmetries; the construction is a renormalizable field-theory extension of the Standard
    Model.
particle_content:
  dark_matter_candidate:
    name: lightest gauge-singlet Majorana fermion psi_1
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - three gauge-singlet Majorana fermions psi_aR with lepton number zero
  - right-handed fermions nu_iR composing Dirac neutrinos
  - Z2-odd scalar doublet with a neutral component eta0
  - charged singlet scalar s2+
  - charged singlet scalar s1+
  - charged scalar doublet with doubly and singly charged components
  mediators:
  - Z2-odd charged scalar mass eigenstates containing s2+
  - Z2-odd scalar doublet components
  - charged scalar states entering the two-loop neutrino-mass diagram
  dark_radiation_species: []
  excited_or_degenerate_states:
  - heavier singlet Majorana fermions psi_2 and psi_3
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An accidental unbroken Z2 symmetry makes the lightest Z2-odd particle stable;
    the authors choose the lightest gauge-singlet Majorana fermion as the dark matter candidate.
  symmetries:
  - name: lepton number L
    type: global
    exact_or_approximate: exact
    breaking: not broken in the model as constructed
    breaking_scale: null
  - name: Z2 prime
    type: discrete
    exact_or_approximate: broken
    breaking: softly broken in the scalar sector to allow loop-level Dirac neutrino masses while forbidding
      tree-level neutrino Yukawa interactions
    breaking_scale: null
  - name: accidental Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken; parity is described as (-1)^(L+2J)
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
