  - right-handed Dirac-neutrino partners
  - Standard Model Higgs doublet
  dark_sector_couplings:
  - Y1 coupling between charged leptons, right-handed Dirac-neutrino partners, and s1+
  - Y2 coupling between charged leptons, singlet Majorana fermions, and s2+
  - Y coupling between Standard Model lepton doublets, singlet Majorana fermions, and the new scalar doublet
  - scalar-potential couplings and soft Z2-prime breaking parameters
  mediator_types:
  - charged scalar
  - inert scalar doublet component
  interaction_operators:
  - Yukawa interactions Y1, Y2, and Y specified in the paper
