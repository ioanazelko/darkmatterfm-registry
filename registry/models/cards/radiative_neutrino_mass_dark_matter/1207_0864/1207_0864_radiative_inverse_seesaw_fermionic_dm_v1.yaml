identity:
  name: Radiative inverse seesaw fermionic Higgs-portal dark matter
  family: radiative_neutrino_mass_dark_matter
  aliases:
  - local B-L radiative inverse seesaw dark matter
  - fermionic dark matter in radiative inverse seesaw
  short_description: A local U(1)_B-L radiative inverse seesaw model in which the lightest nearly degenerate
    singlet fermions are stabilized by a Z2 symmetry and obtain the observed relic density mainly through
    Higgs-mediated annihilation.
  historical_origin_or_motivation: The paper connects Ma-type radiative neutrino mass, inverse seesaw
    structure, and a fermionic dark matter candidate whose relic abundance can evade lepton-flavor-violation
    limits through additional Higgs interactions.
  status: speculative
  model_kind: complete_theory
theory:
