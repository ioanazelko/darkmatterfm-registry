  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A Z2 symmetry forbids the unwanted Dirac mass term and stabilizes the lightest
    odd singlet fermion states; local U(1)_B-L is spontaneously broken by the scalar phi.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not broken in the dark matter discussion
    breaking_scale: null
  - name: U(1)_B-L
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the phi vacuum expectation value
    breaking_scale:
      name: B-L breaking vacuum expectation value
      symbol: v prime
      description: VEV of the scalar that breaks local U(1)_B-L.
      range: greater than 12
      unit: TeV
      role: core
      status: inferred
      source_reference_ids:
      - '1207_0864'
      notes: The text derives this from the LEP m_Zprime/gprime bound for the chosen charge.
  - name: lepton number
    type: global
    exact_or_approximate: broken
    breaking: weakly violated by small Majorana mass terms mu_i
    breaking_scale: null
  topological_defects_possible: unknown
