    symbol: Lambda
    description: Cutoff suppressing the small Majorana mass operators for S and S prime.
    range: about 10^14 for the illustrative keV-scale mu term
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1207_0864'
    notes: The text states that mu around 1 keV corresponds to Lambda around 10^14 GeV.
  embedded_in_larger_framework: unknown
  notes: The lepton-sector Lagrangian and Higgs potential are given, but the small lepton-number-violating
    Majorana terms arise from higher-dimensional operators.
