identity:
  name: Dirac dark matter in a radiative neutrino model
  family: radiative_neutrino_mass_dark_matter
  aliases:
  - Z3 radiative Dirac dark matter
  - Dirac N1 dark matter
  short_description: A Z3-symmetric one-loop radiative neutrino-mass model in which the lighter neutral
    Dirac fermion N1 is the dark matter candidate and obtains its relic abundance through thermal freeze-out.
  historical_origin_or_motivation: The paper links a Dirac dark matter candidate to one-loop radiative
    neutrino mass generation and emphasizes that Dirac annihilation to leptons is not velocity suppressed
    like a Majorana candidate.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - radiative seesaw
  - one-loop Dirac neutrino mass model
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the lepton-sector Lagrangian and relevant Higgs-potential term for a renormalizable
    SM extension with two neutral Dirac fermions and two inert doublets. Full SM kinetic/gauge terms are
    implicit rather than rewritten.
particle_content:
  dark_matter_candidate:
    name: lighter neutral Dirac fermion N1
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - heavier neutral Dirac fermion N2
  - inert doublet H1 with charged and neutral components
  - inert doublet H2 with charged and neutral components
  mediators:
  - inert scalar doublets H1 and H2
  - loop-induced Higgs coupling
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact discrete Z3 symmetry is imposed so that the lightest Z3-charged particle
    is stable; the paper assumes this particle is N1.
  symmetries:
  - name: Z3
    type: discrete
    exact_or_approximate: exact
    breaking: not specified; used to keep the new fermions Dirac and the doublets inert
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - neutrino
  - higgs
  - other
  standard_model_targets:
  - lepton doublets
  - charged leptons
  - SM Higgs
  dark_sector_couplings:
  - Yukawa couplings y_N_R and y_N_L between lepton doublets, inert doublets, and neutral Dirac fermions
  - scalar coupling lambda_0 connecting H1 and H2 through the SM Higgs
  - Dirac mass terms M_a for N_a
  mediator_types:
  - inert scalar doublets
  - Higgs boson through loop-induced effective coupling
  interaction_operators:
  - L_L H1 N_R
  - N_L H2 L_L^C
  - M_a N_L N_R
  - lambda_0 (H^dagger H1)(H^dagger H2)
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - N1 anti-N1 to charged leptons
  - N1 anti-N1 to neutrino/lepton final states through inert-doublet exchange
  decay_channels: []
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: Yukawa matrices are parameterized to reproduce the active neutrino mass matrix; one
    charged-lepton annihilation channel may dominate in the numerical analysis.
  tree_or_loop_level: both
parameters:
  core:
  - name: Dirac dark matter mass
    symbol: M_1
    description: Mass of the lighter neutral Dirac fermion N1, identified as the dark matter particle.
    range: M_1 < M_2 < 10 TeV and M_1 below the inert-doublet masses in the numerical scan
    unit: TeV
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: The paper denotes the DM mass as m_chi = M_1.
  - name: heavier neutral Dirac fermion mass
    symbol: M_2
    description: Mass of the second neutral Dirac fermion.
    range: M_1 < M_2 < 10 TeV
    unit: TeV
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: null
  - name: inert doublet masses
    symbol: m_eta1, m_eta2
    description: Masses of the charged and neutral components of the two inert doublets, taken nearly
      degenerate within each doublet.
    range: 1 TeV < m_eta1,2 < 10 TeV with M_1 < m_eta1,2
    unit: TeV
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: The paper assumes neutral and charged components of each inert doublet are almost degenerate.
  - name: H1-H2 scalar connector coupling
    symbol: lambda_0
    description: Coupling in the relevant Higgs-potential term connecting H1 and H2 and enabling one-loop
      active neutrino masses.
    range: '|lambda_0| < 4'
    unit: null
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: null
  - name: neutrino-sector Yukawa couplings
    symbol: y_N_R, y_N_L
    description: Yukawa matrices coupling SM leptons, inert doublets, and the neutral Dirac fermions;
      parameterized to reproduce the active neutrino mass matrix.
    range: perturbative values; numerical scan uses |Y_ab| < 4
    unit: null
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: The scan uses an auxiliary parameterization in terms of Y, A_13, and orthonormal vectors.
  - name: antisymmetric neutrino-mass parameter
    symbol: A_13
    description: Free antisymmetric-matrix parameter in the Yukawa parameterization.
    range: '|A_13| < 10 eV'
    unit: eV
    role: core
    status: established
    source_reference_ids:
    - okada_shoji_2020
    notes: null
