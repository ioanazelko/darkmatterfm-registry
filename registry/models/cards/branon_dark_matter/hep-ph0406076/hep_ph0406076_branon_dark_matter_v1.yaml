theory_to_observable_routing:
  routes:
  - id: route_branon_collider_recast
    description: Map the branon EFT parameters to missing-energy collider rates and compare with mono-photon
      or monojet limits.
    source_model_features:
    - pairwise stress-tensor coupling
    - brane tension scale f
    - branon mass M
    input_parameters:
    - M
    - f
    - number of branon species N
    - collider energy
    - analysis cuts
    derived_quantities:
    - branon pair-production cross section
    - mono-X acceptance
    - excluded f-M region
    forward_model_chain:
    - step_id: derive_cross_sections
      step_type: analytic_formula
      tool_or_code: branon EFT matrix elements
      inputs:
      - M
      - f
      - N
      - SM stress-tensor coupling
      outputs:
      - partonic pair-production rates
      validity: Below the EFT cutoff implied by the brane tension scale.
      notes: Use real-emission and virtual-effect formulae from branon phenomenology papers.
    - step_id: apply_collider_limits
      step_type: recasting
      tool_or_code: mono-photon/monojet analysis
      inputs:
      - cross sections
      - luminosity
      - acceptance
      outputs:
      - f-M exclusion contour
      validity: Valid only for comparable cuts and center-of-mass energies.
      notes: Primary paper only gives qualitative/figure-level exclusions.
    observable_ids:
    - branon_collider_missing_energy
    constraint_ids:
    - branon_lep_tevatron_missing_energy
    likelihoods: []
    required_code_resources:
    - branon EFT implementation
    - collider mono-X efficiencies
    validation_tests:
    - Recover the primary-paper LEP-II/Tevatron-I lower-region exclusion qualitatively.
    route_status: planned
    agent_notes: No machine-readable likelihood was found in the primary text.
    caveats:
    - Do not extrapolate above the EFT validity scale.
  - id: route_branon_noncollider_searches
    description: Convert halo or captured-branon annihilation and nuclear recoil rates into direct and
      indirect search observables.
    source_model_features:
    - stable branon halo population
    - annihilation into SM products
    - elastic branon-nucleus scattering
    input_parameters:
    - M
    - f
    - local halo density
    - velocity distribution
    - capture rate
    derived_quantities:
    - nuclear recoil rate
    - gamma/positron flux
    - high-energy neutrino flux
    forward_model_chain:
    - step_id: compute_recoil_and_fluxes
      step_type: semi_analytic_model
      tool_or_code: direct/indirect detection rate model
      inputs:
      - M
      - f
      - halo model
      outputs:
      - detector recoil rates
      - annihilation-product fluxes
      validity: Assumes branons make a substantial halo component.
      notes: Primary paper identifies channels but not a reusable likelihood.
    - step_id: compare_searches
      step_type: recasting
      tool_or_code: experiment-specific response models
      inputs:
      - rates
      - detector thresholds
      - exposures
      outputs:
      - search sensitivity or exclusion
      validity: Historical detector names in the primary text should be updated for modern recasts.
      notes: Future sensitivities in the primary paper are qualitative.
    observable_ids:
    - branon_direct_nuclear_recoil
    - branon_indirect_annihilation_products
    constraint_ids:
    - branon_early_direct_detection_nulls
    - branon_supernova_cooling
    likelihoods: []
    required_code_resources:
    - halo model
    - detector response
    - gamma-ray/antimatter/neutrino search response
    validation_tests:
    - Check that predicted direct-search rates remain below historical DAMA/ZEPLIN/EDELWEISS sensitivity
      in the primary allowed region.
    route_status: planned
    agent_notes: Useful as a routing map; not an implemented likelihood.
    caveats:
    - Indirect fluxes depend strongly on halo and capture assumptions.
