  - name: dark matter mass
    symbol: M
    description: Mass of the hidden-SU(2) multiplet dark matter.
    range: hundreds of GeV to TeV; marginal best-fit examples near 800
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
  - name: dark gauge coupling
    symbol: alpha_g
    description: alpha_g = 0.031 * (M/1 TeV) * f for the triplet thermal baseline
    range: alpha_g = 0.031 * (M/1 TeV) * f for the triplet thermal baseline
    unit: dimensionless
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
  - name: density suppression factor
    symbol: f
    description: Gauge coupling scaling factor; annihilating density fraction is 1/f.
    range: f >= 1; viable lepton-excess fits require 1/f < 0.4, often 0.14-0.2 for MeV splittings
    unit: dimensionless
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
  - name: dark gauge boson mass
    symbol: mu_2
    description: Mass of B2, the dark gauge boson mixed with hypercharge.
    range: below 1 GeV; below 2 mp avoids antiprotons; below 2 m_mu gives a 4e channel; examples near
      200
    unit: MeV
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
  - name: largest dark matter mass splitting
    symbol: Delta_M
    description: Splitting between dark multiplet states generated by loop effects and dark gauge-boson
      mass splittings.
    range: about 100 keV to a few MeV
    unit: MeV
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
  - name: kinetic mixing strength
    symbol: epsilon
    description: Mixing of a dark gauge boson with Standard Model hypercharge.
    range: approximately 1e-2 to 1e-9, with a small E137-excluded region for light gauge bosons
    unit: dimensionless
    role: core
    status: inferred
    source_reference_ids:
    - '1005_1779'
