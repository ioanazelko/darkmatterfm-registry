  - dark SU(2) triplet DM
  short_description: A multistate dark matter model in which a fermionic hidden-SU(2) triplet annihilates
    to light dark gauge bosons that kinetically mix with hypercharge and decay mainly to light leptons.
  historical_origin_or_motivation: Developed as a concrete nonabelian hidden-sector realization for testing
    whether PAMELA/Fermi/H.E.S.S. lepton excesses can be explained by annihilating multistate dark matter.
  status: speculative
  model_kind: complete_theory
theory:
