    role: core
    status: assumed
    source_reference_ids:
    - '1902_07726'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the Higgs-sector potential, gauge structure SU(3) x SU(2) x U(1) x SU(2)' x
    U(1)', dimension-five neutrino masses, and a dimension-six Higgs-gluon operator, so the low-energy
    construction is not purely renormalizable.
