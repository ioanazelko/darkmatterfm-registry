identity:
  name: Bubbletron-produced heavy fermion dark matter
  family: nonthermal_dark_matter
  aliases:
  - bubbletron heavy dark matter
  - shell-collision heavy DM
  short_description: A nonthermal heavy dark matter scenario in which ultrarelativistic first-order phase-transition
    bubble walls create high-energy shells whose collisions produce a stable heavy fermion Y through U(1)
    gauge interactions.
  historical_origin_or_motivation: The paper introduces bubbletrons as early-universe particle accelerators
    and applies them to producing dark matter much heavier than the phase-transition scale.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - spontaneously broken U(1) gauge theory with a first-order phase transition
  - early-universe bubbletron shell collisions
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: For concreteness the paper uses a gauged U(1) with coupling g broken by a charge-one scalar,
    gauge bosons V, and a heavier fermion Y with U(1) charge q_Y.
