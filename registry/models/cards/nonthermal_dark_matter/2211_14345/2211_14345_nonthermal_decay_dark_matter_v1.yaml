identity:
  name: Nonthermal decay-produced dark matter for the Hubble tension
  family: nonthermal_dark_matter
  aliases:
  - decay-produced cold dark matter with transient hot component
  short_description: A model-independent dark matter production framework in which a long-lived parent
    particle decays into a stable dark matter particle plus a relativistic species, so a small nonthermal
    dark matter fraction behaves as extra radiation before cooling to cold dark matter.
  historical_origin_or_motivation: Introduced to raise the CMB-inferred Hubble constant by linking extra
    radiation to the production mechanism of dark matter particles, especially in phantom-like cosmologies.
  status: speculative
  model_kind: phenomenological_parameterization
