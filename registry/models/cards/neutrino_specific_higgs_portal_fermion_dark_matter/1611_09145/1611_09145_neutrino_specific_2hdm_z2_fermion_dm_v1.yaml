  aliases:
  - neutrino-specific THDM dark matter
  - U(1)_X remnant Z2 fermion dark matter
  short_description: A neutrino-specific two-Higgs-doublet extension with a singlet scalar S that breaks
    global U(1)_X to a remnant Z2, stabilizing the lighter Majorana fermion psi_minus as dark matter.
  historical_origin_or_motivation: Extends a Dirac-neutrino-specific two-Higgs-doublet model so the same
    U(1)_X symmetry that forbids Majorana masses also leaves a dark-matter-stabilizing Z2 remnant.
  status: speculative
  model_kind: complete_theory
