    relax into stable vorton rings; the paper develops formation criteria and abundance estimates for
    low and intermediate string-forming scales.
  historical_origin_or_motivation: The paper motivates low-mass vortons as nonrelativistic dark matter
    candidates and develops the first analytic model for vorton formation from superconducting-string
    networks.
  status: speculative
  model_kind: phenomenological_parameterization
