  short_description: A Peccei-Quinn-symmetric two-Higgs-doublet model augmented by a singlet fermion S
    and heavy vector-like SU(2)_L isodoublets, where S obtains a naturally small radiative mass and is
    produced by freeze-in.
  historical_origin_or_motivation: Introduced to explain the small mass of keV-to-GeV fermionic singlet
    dark matter through a radiative mechanism tied to PQ symmetry breaking.
  status: speculative
  model_kind: complete_theory
