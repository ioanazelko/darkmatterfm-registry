validity_domain:
- id: boltzmann_suppressed_regime
  applies_to: production
  condition: The Standard Model bath temperature never exceeds the scalar dark matter mass, T_max < m_s,
    so production is Boltzmann suppressed.
  status: assumed
  extrapolation_risk: high
  caveats:
  - The stronger-coupling freeze-in relation changes if the SM bath becomes hotter than the dark matter
    mass.
  source_reference_ids:
  - paper_2402_04743
  notes: null
- id: suppressed_direct_parent_decays
  applies_to: production
  condition: Direct inflaton or right-handed-neutrino decays into dark matter are highly suppressed or
    kinematically forbidden.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - The paper notes N_R -> DM plus lepton is forbidden if M_N < 2 m_DM in the example.
  source_reference_ids:
  - paper_2402_04743
  notes: null
- id: right_handed_neutrino_reheating
  applies_to: cosmological_history
  condition: Inflaton decay into feebly interacting right-handed neutrinos dominates over direct decay
    into SM states, and N_R later produces the SM bath.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - The scenario relies on very small reheating-sector couplings and an approximate symmetry suppressing
    direct SM production.
  source_reference_ids:
  - paper_2402_04743
  notes: null
- id: pure_freeze_in_limit
  applies_to: relic_density
  condition: The s s -> h_i h_i annihilation term can be neglected until the coupling is large enough
    for thermalization.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - At larger lambda_hs, the text says the system thermalizes and the abundance is instead set by freeze-out.
  source_reference_ids:
  - paper_2402_04743
  notes: null
