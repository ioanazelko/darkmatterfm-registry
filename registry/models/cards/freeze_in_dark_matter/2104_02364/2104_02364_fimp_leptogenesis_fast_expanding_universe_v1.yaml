    symbol: n
    description: Exponent in the extra component redshifting as a^-(4+n).
    range: n > 0; benchmarks include n=2 and n=4
    role: core
    status: established
  - name: transition ratio
    symbol: z_r
    description: Defined as M_1/T_r for the temperature where the extra component and radiation are equal.
    range: z_r > 1 for large FEU effects; benchmarks include 10, 100, and 1000
    role: core
    status: established
