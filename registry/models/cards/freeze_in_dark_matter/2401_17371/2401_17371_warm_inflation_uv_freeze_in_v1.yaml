    status: assumed
    source_reference_ids:
    - '2401_17371'
    notes: The text states the EFT remains applicable for T < Lambda.
  embedded_in_larger_framework: 'yes'
  notes: The interaction is parameterized as an operator O_{n+4}/Lambda^n with n >= 1; the warm-inflation
    background supplies T(N_e) and H(N_e).
