parameters:
  core:
  - name: Dark matter mass
    symbol: m_chi
    description: Mass of the produced dark matter particle.
    range: Viable values are correlated with Lambda and n; examples in the paper scan broad mass ranges.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2401_17371'
    notes: The paper discusses the allowed DM mass range after imposing cold, non-equilibrium freeze-in
      and relic-abundance requirements.
  - name: Operator exponent
    symbol: n
    description: Exponent defining the mass dimension n+4 of the non-renormalizable operator.
    range: n >= 1; examples include n = 1, 2, 3, 5, 7, 9.
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '2401_17371'
    notes: Higher n gives a stronger enhancement of WIFI relative to radiation-dominated UV freeze-in
      in the examples.
  - name: EFT cutoff
    symbol: Lambda
    description: Suppression scale for the non-renormalizable interaction between dark matter and the
      radiation bath.
    range: Parameter-dependent; must exceed the relevant bath temperature for EFT validity.
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '2401_17371'
    notes: The relic abundance is degenerate in Lambda, n, and m_chi.
  - name: Initial dissipation strength
    symbol: Q_0
    description: Representative warm-inflation dissipation strength used in the paper's examples.
    value:
    - 10^-2
    - '1'
    unit: null
    role: cosmological
    status: assumed
    source_reference_ids:
    - '2401_17371'
    notes: The examples use Q_0 = 10^-2 and Q_0 = 1 with 60 e-folds of inflation.
  nuisance: []
