identity:
  name: Warm-inflation ultraviolet freeze-in dark matter
  family: freeze_in_dark_matter
  aliases:
  - WIFI
  - Warm Inflation via ultraviolet Freeze-In
  short_description: Dark matter is produced during warm inflation by ultraviolet freeze-in from a persistent
    thermal bath through non-renormalizable interactions with the bath.
  historical_origin_or_motivation: The paper introduces WIFI as a production setting where the warm-inflation
    radiation bath enhances UV freeze-in relative to radiation-dominated production at the same reheat
    temperature.
  status: speculative
  model_kind: effective_field_theory
