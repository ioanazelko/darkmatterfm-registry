validity_domain:
- id: eft_temperature_cutoff
  applies_to: EFT
  condition: Use the non-renormalizable operator description only when the bath temperature is below Lambda.
  valid_range: T < Lambda
  status: assumed
  extrapolation_risk: high
  caveats:
  - The heavy mediator is not specified as a UV-complete particle model.
  source_reference_ids:
  - '2401_17371'
  notes: The text explicitly states the EFT remains applicable as long as T < Lambda.
- id: freeze_in_non_equilibrium
  applies_to: production
  condition: Dark matter must never reach thermal equilibrium with the bath, so backreaction on radiation
    is negligible.
  valid_range: null
  status: assumed
  extrapolation_risk: medium
  caveats:
  - If the coupling is large enough to thermalize chi, the freeze-in yield formula no longer applies.
  source_reference_ids:
  - '2401_17371'
  notes: The Boltzmann equation neglects annihilation backreaction in the freeze-in regime.
- id: warm_inflation_background_dependence
  applies_to: model
  condition: The yield estimate depends on the warm-inflation potential, dissipation rate, and resulting
    T(N_e), H(N_e) history.
  valid_range: null
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The representative examples use a monomial potential and dissipation rate linear in temperature; the
    paper warns the trend with Q need not be universal.
  source_reference_ids:
  - '2401_17371'
  notes: null
