identity:
  name: Z3 scalar dark matter with semi-production freeze-in
  family: freeze_in_dark_matter
  aliases:
  - semi-production dark matter
  - inverse semi-annihilation freeze-in scalar DM
  short_description: A Higgs-portal scalar-mediator model in which a Z3-charged complex scalar dark matter
    particle is produced out of equilibrium by inverse semi-annihilation, requiring an initial dilute
    DM population and coupled Boltzmann evolution of number density and temperature.
  historical_origin_or_motivation: The paper introduces semi-production as a freeze-in analogue of semi-annihilation,
    motivated by the possibility of stronger present-day annihilation signals than ordinary freeze-in.
  status: speculative
  model_kind: simplified_model
