identity:
  name: Freeze-twin electron and positron dark matter
  family: freeze_in_dark_matter
  aliases:
  - Freeze-Twin Dark Matter
  - twin electron freeze-in dark matter
  short_description: A mirror twin Higgs freeze-in model where asymmetric reheating empties the twin sector
    and tiny kinetic mixing freezes in twin electron and positron dark matter through a massive twin photon.
  historical_origin_or_motivation: Links dark matter production to the asymmetric reheating already invoked
    to make mirror twin Higgs cosmology compatible with light-degree-of-freedom bounds.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - mirror twin Higgs
  - neutral naturalness
  - freeze-in dark matter
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the mirror twin Higgs scalar potential and adds low-energy photon kinetic mixing
    plus a Stueckelberg mass for the twin photon; it remains agnostic about some UV details of the Stueckelberg
    construction.
particle_content:
  dark_matter_candidate:
    name: twin electron and twin positron
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
