    photon mass is chosen above the twin-electron threshold so frozen-in pairs do not annihilate away.
  symmetries:
  - name: mirror twin Z2
    type: discrete
    exact_or_approximate: broken
    breaking: soft/relevant breaking through Stueckelberg twin hypercharge mass
  - name: twin electromagnetic gauge symmetry
    type: gauge
    exact_or_approximate: broken
    breaking: Stueckelberg mass for twin photon
  topological_defects_possible: unknown
