identity:
  name: Freeze-in gauge mediation FIMP hidden-sector dark matter
  family: freeze_in_dark_matter
  aliases:
  - FIGM
  - FIMP dark matter freeze-in gauge mediation
  short_description: A gauge-mediated supersymmetry scenario where a hidden pseudo-moduli fermion FIMP
    feebly couples to messenger fields, freezes in from the thermal bath, and can dominate a two-component
    hidden dark sector with a gravitino subcomponent.
  historical_origin_or_motivation: The paper links metastable SUSY breaking, gauge-mediation messengers,
    and non-WIMP hidden-sector dark matter while making the neutralino and gravitino subleading in parts
    of parameter space.
  status: speculative
  model_kind: simplified_model
