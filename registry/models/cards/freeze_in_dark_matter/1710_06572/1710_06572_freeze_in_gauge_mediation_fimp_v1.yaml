  - metastable SUSY breaking
  - O'Raifeartaigh-type hidden sector
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies a generic metastable SUSY-breaking superpotential and messenger interactions
    for the FIMP, but leaves the hidden-sector completion generic.
