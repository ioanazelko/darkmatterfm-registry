- id: con_cmb_neff_dark_scalar_lifetime
  name: CMB/Delta Neff constraint on delayed dark-scalar decay
  constraint_type: cosmological
  observable_channel: cmb
  applies: parameter_dependent
  constrained_parameters:
  - tau_phi
  - f_phi
  - lambda_ds
  - theta
  - m_phi
  excluded_regions:
  - For f_phi = 1, tau_phi = 1e10 s is excluded by Planck in the primary discussion; large f_phi at tau_phi
    = 1e9 s overproduces Delta N_eff.
  allowed_regions:
  - The source states tau_phi = 1e9 s with f_phi = 1 gives Delta N_eff = 0.12, in reach of future CMB-S4,
    and smaller effective f_phi relaxes the bound.
  benchmark_implications:
  - Cosmology strongly shapes the FIMP portal parameter space once the relic-density-determined lambda_ds
    is fixed.
