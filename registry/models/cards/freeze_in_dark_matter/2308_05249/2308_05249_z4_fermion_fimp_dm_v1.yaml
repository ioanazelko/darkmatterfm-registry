identity:
  name: Z4 fermion FIMP dark matter with singlet scalar mediator
  family: freeze_in_dark_matter
  aliases:
  - minimal model of fermion FIMP dark matter
  - Z4 freeze-in fermion dark matter
  short_description: A minimal Standard Model extension with a Dirac fermion FIMP and a real singlet scalar,
    both charged under an unbroken Z4 symmetry; the fermion is stable and is produced by freeze-in through
    scalar decays, scalar pair production followed by decay, or FIMP-from-WIMP conversion regimes.
  historical_origin_or_motivation: Introduced as a simpler renormalizable realization of freeze-in for
    fermion dark matter than Z2 singlet-fermion constructions.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Z4 singlet extension of the Standard Model
  - fermion FIMP freeze-in
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes the most general renormalizable SU(3)xSU(2)xU(1)xZ4 Lagrangian for a Dirac fermion
    and real scalar singlet.
particle_content:
  dark_matter_candidate:
    name: Dirac fermion FIMP
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - real scalar singlet S, unstable or a second dark matter component depending on M_S relative to 2 M_chi
  mediators:
  - real scalar singlet S
  - SM Higgs boson through the Higgs portal
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles:
  - Dirac fermion FIMP
  - scalar S when M_S < 2 M_chi
  unstable_parent_particles:
  - scalar S when M_S > 2 M_chi
  standard_model_extension: minimal
symmetries:
  stabilizing_mechanism: Unbroken Z4 symmetry makes the fermion automatically stable; the scalar is stable
    when its decay to two fermions is kinematically forbidden.
  symmetries:
  - name: Z4
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the model as described
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - SM Higgs boson
  - SM thermal plasma
  dark_sector_couplings:
  - Higgs portal lambda_SH |H|^2 S^2
  - scalar Yukawa y_s between the fermion and S
  - pseudoscalar Yukawa y_p between the fermion and S
  mediator_types:
  - real singlet scalar S
  - SM Higgs boson
  interaction_operators:
  - lambda_SH |H|^2 S^2
  - Dirac fermion mass term
  - Majorana-like Z4-allowed y_s and y_p Yukawa terms with S
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - SM particles produce S pairs through the Higgs portal
  - S S converts to fermion FIMP pairs in the FIMP-from-WIMP regime
  decay_channels:
  - S decays to a pair of fermion FIMPs when M_S > 2 M_chi
  self_scattering_channels:
  - S quartic self-interaction is present but not central to the freeze-in relic calculation
  cp_structure: Both scalar y_s and pseudoscalar y_p Yukawa couplings are included and studied separately
    in some scans.
  flavor_structure: The dark fermion and scalar are SM singlets; no SM flavor structure is introduced.
  tree_or_loop_level: tree
