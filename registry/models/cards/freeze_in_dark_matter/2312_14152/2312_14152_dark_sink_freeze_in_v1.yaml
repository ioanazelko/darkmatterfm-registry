  predicted_effect: For sufficiently interacting light DM, DM-SM interactions can cool baryons, exert
    pressure on DM, alter recombination, and suppress structure formation.
  effect_direction: suppression
  key_quantities:
  - name: DM-SM interaction strength
    symbol: sigma_e or equivalent
    role: core
    status: inferred
    source_reference_ids:
    - '2312_14152'
  - name: DM mass
    symbol: m_DM
    role: core
    status: inferred
    source_reference_ids:
    - '2312_14152'
  redshift_range: recombination to late-time structure
  scale_range: CMB spectra and matter power spectrum
  environments:
  - pre-recombination plasma
  - large-scale structure
  observability: medium
  relevance: medium
  linked_constraints:
  - cons_cmb_bao_interactions
  linked_routes:
  - route_dark_radiation
  caveats:
  - Constraint becomes competitive with direct-detection bounds mainly in the light-mass region highlighted
    by the paper.
  source_reference_ids:
  - '2312_14152'
  notes: Recorded because it limits the same large-cross-section region enabled by the Dark Sink.
constraints:
- id: cons_dark_radiation_neff
  name: Planck and CMB-S4 T_prime/T bounds on Dark Sink radiation
  constraint_type: cosmological
  observable_channel: N_eff / dark-sector temperature
  applies: 'yes'
  constrained_parameters:
  - T'/T
  - sigma_e
  - sink coupling
  excluded_regions:
  - T_prime/T > 0.437 is excluded at 95% CL by Planck CMB+BAO as quoted in the paper.
  - Projected CMB-S4 sensitivity would exclude T_prime/T > 0.292 at 95% CL.
  allowed_regions:
  - Viable benchmarks keep the sink contribution to dark radiation below these bounds.
  benchmark_implications:
  - Caps the maximum direct-detection cross section obtainable from the Dark Sink.
  likelihood_available: approximate
  likelihood_reference: null
  data_release: Planck CMB+BAO and projected CMB-S4 bounds quoted in primary paper
  recasting_needed: partial
  robustness: high
  assumptions:
  - id: assume_light_sink_radiation
    description: The sink fermion is light enough to contribute as dark radiation rather than matter.
    scope: CMB constraint
    status: assumed
    impact_if_violated: If the sink state becomes nonrelativistic or decays, the N_eff mapping changes.
    can_be_relaxed: partial
    source_reference_ids:
    - '2312_14152'
  caveats:
  - Implemented here as quoted temperature-ratio bounds, not a full CMB likelihood.
  source_reference_ids:
  - '2312_14152'
  notes: The primary paper uses these bounds to set red curves in the direct-detection plot.
- id: cons_current_direct_detection
  name: Current low-threshold direct-detection limits
  constraint_type: direct_detection
  observable_channel: electron recoil searches
  applies: parameter_dependent
  constrained_parameters:
  - sigma_e
  - m_DM
  - epsilon
  - m_A_prime
  excluded_regions:
  - Regions above current PandaX, DAMIC-M, SENSEI, DarkSide, and XENON1T electron-recoil limits are excluded.
  allowed_regions:
  - Dark Sink benchmarks can occupy regions up to the current limits while maintaining the relic abundance.
  benchmark_implications:
  - Makes existing and near-future electron-recoil experiments critical probes of the model.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: PandaX, DAMIC-M, SENSEI, DarkSide, XENON1T limits as shown in primary paper
  recasting_needed: 'yes'
  robustness: high
  assumptions:
  - id: assume_standard_electron_scattering_recast
    description: Direct-detection limits are interpreted using the standard light-DM electron-scattering
      cross-section convention.
    scope: direct-detection recast
    status: assumed
    impact_if_violated: Different mediator form factors or detector response would require a dedicated
      recast.
    can_be_relaxed: partial
    source_reference_ids:
    - '2312_14152'
  caveats:
  - No detector likelihood files were read.
  source_reference_ids:
  - '2312_14152'
  - '1807_05022'
  - '2405_06226'
  notes: Primary paper overlays current direct-detection limits rather than providing data tables.
- id: cons_bbn_light_dm
  name: BBN obstacle for very light fermionic DM with large direct-detection cross sections
  constraint_type: cosmological
  observable_channel: BBN light-species constraint
  applies: parameter_dependent
  constrained_parameters:
  - m_DM
  - dark-sector couplings
  excluded_regions:
  - Fermionic DM lighter than O(5 MeV) with large direct-detection cross sections is difficult to reconcile
    with successful BBN in the simple benchmark.
  allowed_regions:
  - Dark Sink and related low-reheating/HYPER-style constructions are motivated as ways to evade these
    bounds.
  benchmark_implications:
  - Marks the sub-5 MeV region as requiring additional cosmological model-building.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: BBN discussion in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: assume_standard_bbn
    description: The BBN obstacle is quoted under standard BBN assumptions.
    scope: early-universe cosmology
    status: assumed
    impact_if_violated: Low reheating or altered thermal histories can change the conclusion.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2312_14152'
  caveats:
  - This is a model-building caveat, not a numeric exclusion in the output.
  source_reference_ids:
  - '2312_14152'
  - '2405_06226'
  notes: Primary paper cites low-reheating and HYPER models as examples of evasion.
- id: cons_cmb_bao_interactions
  name: CMB+BAO constraints on light DM-SM interactions
  constraint_type: cosmological
  observable_channel: CMB spectra and matter power
  applies: parameter_dependent
  constrained_parameters:
  - m_DM
  - sigma_e
  excluded_regions:
  - Interactions strong enough to overcool baryons or suppress structure are excluded by CMB+BAO, becoming
    competitive for MeV-scale DM.
  allowed_regions:
  - The Dark Sink can still allow cross sections in currently probed direct-detection regions.
  benchmark_implications:
  - Provides a cosmological upper envelope complementary to laboratory searches.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: CMB+BAO interaction constraints described in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: assume_interaction_mapping
    description: Electron-scattering model parameters can be mapped onto the cosmological DM-SM interaction
      bounds used in the paper.
    scope: cosmological recast
    status: assumed
    impact_if_violated: A different velocity or mediator dependence would alter the bound.
    can_be_relaxed: partial
    source_reference_ids:
    - '2312_14152'
  caveats:
  - No CMB likelihood was run.
  source_reference_ids:
  - '2312_14152'
  notes: Primary paper describes the physical CMB/BAO effect qualitatively and overlays constraints.
theory_to_observable_routing:
  routes:
  - id: route_dark_sink_boltzmann
    description: Solve coupled freeze-in plus Dark Sink Boltzmann equations and compare to electron-recoil
      direct-detection limits.
    source_model_features:
    - light dark photon freeze-in
    - dark sink fermion
    - heavy scalar-mediated sink interaction
    input_parameters:
    - m_DM
    - m_A_prime
    - epsilon
    - alpha_prime
    - y_DM
    - y_sink
    - T'/T
    derived_quantities:
    - DM yield
    - quasi-static equilibrium yield
    - sigma_e
    - dark radiation temperature
    forward_model_chain:
    - step_id: s1
      step_type: boltzmann_solver
      tool_or_code: coupled Boltzmann equations in primary paper
      inputs:
      - dark-sector energy density
      - DM yield
      - sink coupling
      outputs:
      - Y
      - Y_QSE
      - T'/T
      validity: valid for the paper benchmark assumptions
      notes: Integrate yield and dark-sector temperature.
    - step_id: s2
      step_type: analytic_formula
      tool_or_code: DM-electron scattering cross-section mapping
      inputs:
      - epsilon
      - alpha_prime
      - m_A_prime
      - m_DM
      outputs:
      - sigma_e
      validity: dark photon mediator convention
      notes: Map model parameters to electron scattering.
    - step_id: s3
      step_type: recasting
      tool_or_code: direct-detection limit comparison
      inputs:
      - sigma_e
      - m_DM
      outputs:
      - allowed/excluded direct-detection region
      validity: detector curves external
      notes: Compare with PandaX, DAMIC-M, SENSEI, DarkSide, XENON1T.
    observable_ids:
    - obs_electron_recoil_direct_detection
    constraint_ids:
    - cons_current_direct_detection
    - cons_dark_radiation_neff
    - cons_bbn_light_dm
    likelihoods: []
    required_code_resources:
    - github.com/prudhvibhattiprolu/FreezeIn mentioned in primary text
    validation_tests:
    - Recover ordinary freeze-in when sink coupling is set to zero.
    route_status: partially_implemented
    agent_notes: Primary text points to public FreezeIn code; this batch did not run it.
    caveats:
    - Detector and CMB curves still require external data.
  - id: route_dark_radiation
    description: Project the sink-sector temperature and interaction strength onto N_eff and CMB+BAO constraints.
    source_model_features:
    - light sink radiation
    - DM-SM interactions
    - dark-sector temperature evolution
    input_parameters:
    - T'/T
    - sigma_e
    - m_DM
    derived_quantities:
    - Delta N_eff proxy
    - CMB+BAO upper envelope
    forward_model_chain:
    - step_id: s1
      step_type: data_transform
      tool_or_code: null
      inputs:
      - T'/T
      outputs:
      - dark-radiation contribution
      validity: light sink state assumption
      notes: Convert temperature ratio to radiation constraint.
    - step_id: s2
      step_type: recasting
      tool_or_code: Planck/CMB-S4 quoted bounds
      inputs:
      - T'/T
      outputs:
      - allowed temperature range
      validity: uses quoted 95% CL limits
      notes: Apply current and projected bounds.
    - step_id: s3
      step_type: recasting
      tool_or_code: CMB+BAO interaction bounds
      inputs:
      - sigma_e
      - m_DM
      outputs:
      - cosmological interaction limit
      validity: requires external bound curves
      notes: Overlay interaction cooling/pressure constraints.
    observable_ids:
    - obs_dark_radiation_neff
    - obs_cmb_bao_structure_pressure
    constraint_ids:
    - cons_dark_radiation_neff
    - cons_cmb_bao_interactions
    likelihoods: []
    required_code_resources: []
    validation_tests:
    - Check Planck 0.437 and CMB-S4 0.292 temperature-ratio thresholds.
    route_status: planned
    agent_notes: Implemented here as a route specification rather than a numerical likelihood.
    caveats:
    - Assumes the paper benchmark relation between dark radiation and cross-section ceiling.
