identity:
  name: Dark Sink freeze-in dark matter
  family: freeze_in_dark_matter
  aliases:
  - Dark Sink
  - Dark Sink model
  short_description: A freeze-in dark matter model extended by light dark-sector states that drain energy
    density from the dark matter while a kinetically mixed light dark photon produces dark matter from
    the Standard Model bath.
  historical_origin_or_motivation: Introduced to modify the usual light-dark-photon freeze-in benchmark
    by adding dark-sector degrees of freedom that deplete the dark matter abundance.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - dark photon freeze-in benchmark
  - dark-sector extension of the Standard Model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff:
    name: heavy scalar mediator scale
    symbol: m_phi
    description: Mass scale of the heavy scalar mediator integrated out to describe the interaction between
      dark matter and the light neutral dark fermion.
    range: model-dependent; examples require the mediator heavy enough to be produced negligibly
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '2312_14152'
    notes: The paper states that the effective operator is sufficient when the scalar is sufficiently
      heavy, with sub-GeV examples allowing m_phi around 50 m_DM.
  embedded_in_larger_framework: unknown
  notes: The paper specifies a gauged U(1) prime with kinetic mixing, Dirac fermionic dark matter, a light
    neutral dark fermion, and a heavy scalar mediator.
