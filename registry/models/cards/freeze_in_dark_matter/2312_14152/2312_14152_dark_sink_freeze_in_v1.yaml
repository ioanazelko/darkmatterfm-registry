    is assumed in the simplified setup.
  symmetries:
  - name: gauged U(1) prime
    type: gauge
    exact_or_approximate: exact
    breaking: The dark photon is assumed to have negligible mass; symmetry breaking details are not specified.
    breaking_scale: null
  topological_defects_possible: unknown
