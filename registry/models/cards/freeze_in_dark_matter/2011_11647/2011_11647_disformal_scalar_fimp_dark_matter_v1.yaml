validity_domain:
- id: vd_metric_expansion
  applies_to: EFT
  condition: Processes occur at energies well below the BSM scale so that the physical metric can be expanded
    around the gravitational metric.
  valid_range: E << Lambda
  status: assumed
  extrapolation_risk: high
  caveats:
  - The text states the dynamical metric description breaks down above the BSM scale.
  source_reference_ids:
  - '2011_11647'
  notes: null
- id: vd_freeze_in
  applies_to: production
  condition: The scalar never reaches thermal equilibrium with the Standard Model bath.
  valid_range: couplings feeble enough for FIMP production
  status: assumed
  extrapolation_risk: medium
  caveats:
  - A larger coupling would require a different thermal history.
  source_reference_ids:
  - '2011_11647'
  notes: null
- id: vd_kinematic_production
  applies_to: parameter
  condition: Thermal scattering production requires the dark matter mass to be kinematically accessible
    during reheating.
  valid_range: m_phi below the relevant reheating-era energy scale
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The paper discusses upper-bound logic from m_phi < T_RH for scattering production.
  source_reference_ids:
  - '2011_11647'
  notes: null
