    role: core
    status: established
    source_reference_ids:
    - '2011_11647'
  embedded_in_larger_framework: 'yes'
  notes: The assigned text writes an action with gravitational and physical metrics, expands the physical
    metric in conformal and disformal functions C and D, and derives induced interactions with the SM
    energy-momentum tensor.
