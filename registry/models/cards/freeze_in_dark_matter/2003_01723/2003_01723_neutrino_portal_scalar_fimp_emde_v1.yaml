validity_domain:
- id: v_scalar_is_lightest_dark_particle
  applies_to: model
  condition: The complex scalar S is lighter than the hidden fermion and is therefore the stable Z2-odd
    dark matter candidate.
  valid_range: m_S < m_chi for this variant
  status: assumed
  extrapolation_risk: high
  caveats:
  - If the hidden fermion is lighter, the fermion-FIMP variant applies instead.
  source_reference_ids:
  - arxiv:2003.01723
  notes: null
- id: v_freeze_in_out_of_equilibrium
  applies_to: production
  condition: FIMP production rates from thermal-bath fields remain slower than the Hubble rate.
  valid_range: Checked through ratios of reaction rates to H(T) for the relevant cosmic era.
  status: established
  extrapolation_risk: high
  caveats:
  - If rates exceed H(T), the candidate can thermalize and the freeze-in result is invalid.
  source_reference_ids:
  - arxiv:2003.01723
  notes: null
- id: v_reheat_before_bbn
  applies_to: cosmological_history
  condition: The early matter-dominated era ends with reheating before BBN.
  valid_range: The text states T_r should be greater than about 4 MeV.
  status: assumed
  extrapolation_risk: high
  caveats:
  - Lower reheating temperatures would conflict with the assumed BBN-safe history.
  source_reference_ids:
  - arxiv:2003.01723
  notes: null
- id: v_thermalized_heavy_neutrino_approximation
  applies_to: production
  condition: Decay and t-channel contributions are included when heavy neutrinos thermalize before freeze-in;
    otherwise mainly s-channel production is used.
  valid_range: null
  status: approximate
  extrapolation_risk: medium
  caveats:
  - A fully coupled evolution of the dark matter candidate and heavy neutrinos is beyond the paper scope.
  source_reference_ids:
  - arxiv:2003.01723
  notes: null
