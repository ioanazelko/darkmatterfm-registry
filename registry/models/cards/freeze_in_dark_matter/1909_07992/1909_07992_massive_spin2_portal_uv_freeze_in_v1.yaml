parameters:
  core:
  - name: dark matter mass
    symbol: m
    description: Mass of the freeze-in dark matter candidate.
    range: model dependent; examples use m = 100 GeV in generic plots
    unit: GeV
    role: core
    status: inferred
  - name: reheating temperature
    symbol: T_RH
    description: Temperature of the thermal bath after the final reheating event prior to standard cosmology.
    range: above about 10 MeV; examples include 10^6 GeV
    unit: GeV
    role: cosmological
    status: assumed
  - name: maximum bath temperature
    symbol: T_max
    description: Maximum temperature reached during non-instantaneous reheating.
    range: can exceed T_RH; example ratio T_max/T_RH = 100 or 10^2-10^6 depending on plot
    unit: GeV
    role: cosmological
    status: assumed
  - name: equation-of-state parameter before reheating
    symbol: w
    description: Parameter controlling the redshift of the dominant pre-radiation component.
    range: model dependent; kination uses w = 1
    role: cosmological
    status: assumed
  - name: operator temperature power
    symbol: n
    description: Thermally averaged production cross section scales as T^n / Lambda^(n+2).
    range: nonnegative even values in the paper convention
    role: core
    status: inferred
  - name: critical power for boost
    symbol: n_c
    description: Threshold n_c = 2(3-w)/(1+w) above which UV freeze-in is parametrically boosted.
    value: 2(3-w)/(1+w)
    role: derived
    status: inferred
  - name: boost factor
    symbol: B
    description: Enhancement of the UV freeze-in abundance relative to instantaneous reheating.
    range: approximately (T_max/T_RH)^(n-n_c) for n > n_c, with logarithmic special cases
    role: derived
    status: approximate
  - name: spin-2 mediator mass
    symbol: m_2
    description: Mass of the massive spin-2 state.
    range: either below or above T_max in the two regimes studied
    role: core
    status: assumed
  - name: spin-2 coupling scale
    symbol: Lambda
    description: Scale suppressing h_mu_nu T^mu_nu interactions.
    range: M_Pl for a graviton; can vary for a massive spin-2 mediator
    role: core
    status: assumed
  - name: spin-dependent cross-section prefactor
    symbol: alpha
    description: Numerical prefactor depending on DM spin.
    range: 'light mediator examples: 0.19 for spin 0, 2.04 for spin 1/2, 2.49 for spin 1'
