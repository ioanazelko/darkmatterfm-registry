  short_description: A gravitino LSP dark matter scenario in which pair production from the thermal bath
    via nonrenormalizable SUSY-breaking interactions is UV-freeze-in enhanced during non-instantaneous
    reheating with a general pre-BBN equation of state.
  historical_origin_or_motivation: Motivated by high-scale supersymmetry with the gravitino as the only
    superpartner below the reheating scale, where ordinary instantaneous-reheating estimates can underproduce
    gravitino dark matter.
  status: speculative
  model_kind: effective_field_theory
