  - chemical-equilibrium freeze-out in the dark sector
  depends_on_reheating_temperature: 'yes'
  can_produce_all_dark_matter: 'yes'
  nonthermal_momentum_distribution: parameter_dependent
  notes: Gravity is the only portal to the visible sector, but self-interactions can bring the dark sector
    into kinetic and chemical equilibrium and broaden the viable relic-density parameter space.
