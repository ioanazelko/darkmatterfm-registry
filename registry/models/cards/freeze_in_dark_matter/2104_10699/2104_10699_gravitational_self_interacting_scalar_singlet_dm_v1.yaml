identity:
  name: Gravitationally produced self-interacting scalar singlet dark matter
  family: freeze_in_dark_matter
  aliases:
  - gravitational scalar singlet dark matter with self-thermalization
  - SSDM gravitational production
  short_description: A Z2-symmetric real scalar singlet dark matter model where the visible and dark sectors
    communicate only through gravity, while dark-sector quartic self-interactions can thermalize the gravitationally
    produced dark matter and change the final relic abundance.
  historical_origin_or_motivation: Motivated by unavoidable graviton-mediated dark matter production during
    reheating and by the impact of SIMP-like number-changing self-interactions on the relic abundance.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - scalar singlet dark matter
  - gravitational production
  - freeze-in dark matter
  - self-interacting massive particle
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper first treats spin-0, spin-1/2, and spin-1 DM model-independently, then develops the
    Z2 scalar singlet example with a renormalizable potential and gravitational production.
particle_content:
  dark_matter_candidate:
    name: real scalar singlet s
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles: []
  mediators:
  - massless graviton
  - Higgs portal coupling taken suppressed in the worked limit
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles:
  - Z2-odd scalar singlet s
  unstable_parent_particles:
  - inflaton for gravitational scattering source
  standard_model_extension: minimal
symmetries:
  stabilizing_mechanism: A Z2 symmetry makes the real scalar singlet odd and guarantees stability.
  symmetries:
  - name: Z2 scalar parity
    type: discrete
    exact_or_approximate: exact
  topological_defects_possible: unknown
interactions:
  portals:
  - gravitational
  - higgs
  standard_model_targets:
  - inflaton background
  - Standard Model thermal bath through graviton exchange
  - Higgs doublet through a suppressed portal
  dark_sector_couplings:
  - quartic scalar self-coupling lambda_s
  - 4-to-2 and 2-to-4 number-changing processes
  - 2-to-2 scalar elastic scattering
  mediator_types:
  - graviton
  - inflaton annihilation source
  - suppressed Higgs portal
  interaction_operators:
  - minimal gravitational coupling through the energy-momentum tensor
  - lambda_s s^4 self-interaction
  - lambda_Hs |H|^2 s^2 Higgs portal term
  scattering:
    elastic: 'yes'
    inelastic: not_applicable
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: not_applicable
  annihilation_channels:
  - inflaton inflaton -> s s through graviton exchange
  - SM SM -> s s through graviton exchange
  - s s s s -> s s cannibalizing number-changing reactions
  decay_channels: []
  self_scattering_channels:
  - s s -> s s
  - 4s -> 2s and inverse 2s -> 4s
  tree_or_loop_level: tree
parameters:
  core:
  - name: scalar singlet mass
    symbol: m_s
    description: Dark matter mass in the scalar singlet worked example.
    range: example uses about 8e4 GeV; broader viable regions span TeV to PeV-like masses depending on
      reheating parameters
    unit: GeV
    role: core
    status: inferred
  - name: quartic self-coupling
    symbol: lambda_s
    description: Controls elastic and number-changing dark-sector self-interactions.
    range: large enough for chemical equilibrium but below perturbative unitarity, lambda_s < 4 pi
    role: core
    status: inferred
  - name: Higgs portal coupling
    symbol: lambda_Hs
    description: Portal to the SM Higgs, taken negligible in the gravitational-production/self-interaction
      limit.
    value: approximately 0 in the worked limit
    role: core
    status: inferred
  - name: reheating temperature
    symbol: T_rh
    description: Temperature at the onset of radiation domination.
    range: benchmark examples around 10^9 GeV
    unit: GeV
    role: core
    status: inferred
  - name: maximum temperature during reheating
    symbol: T_max
    description: Maximum SM bath temperature reached before reheating completes.
    range: benchmark examples around 10^12 GeV
    unit: GeV
    role: core
    status: inferred
  - name: inflaton mass
    symbol: m_phi
    description: Mass of inflaton particles that annihilate gravitationally to DM in the reheating epoch.
    value: 3e13
    unit: GeV
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: dark-sector temperature
    symbol: T_prime
    description: Temperature of the self-thermalized dark sector, generally different from the SM temperature.
    role: derived
    status: inferred
  - name: dark matter yield
    symbol: Y
    description: Comoving yield obtained from Boltzmann equations with gravitational production and number-changing
      self-interactions.
    value: matched to observed abundance in viable regions
    role: derived
    status: inferred
production:
  mechanisms:
  - gravitational production from inflaton annihilation during reheating
  - UV freeze-in from Standard Model particle annihilation through s-channel graviton exchange
  - dark-sector thermalization and number-changing self-interactions after production
  thermal_equilibrium_with_standard_model: 'no'
