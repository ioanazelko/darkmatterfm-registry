  - mass-gain FIMP dark matter
  short_description: A classically conformal type-I-seesaw/scotogenic setup in which a high-scale singlet-scalar
    first-order phase transition gives masses to right-handed neutrinos, stabilizes a light Z_2-odd RHN
    dark-matter candidate, and produces its nonthermal abundance through mass-gain/FIMP dynamics.
  historical_origin_or_motivation: The paper studies cogenesis of baryon asymmetry and dark matter from
    a high-scale first-order phase transition whose gravitational-wave signal can be tested by LVK-like
    experiments.
  status: speculative
  model_kind: complete_theory
