  - first-order phase transition mass-gain mechanism
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The assigned text gives the relevant Yukawa Lagrangian and scalar potential for a singlet scalar
    S, an additional scalar doublet, and three right-handed neutrinos; the analysis uses one-loop Coleman-Weinberg
    and finite-temperature potentials for the FOPT.
