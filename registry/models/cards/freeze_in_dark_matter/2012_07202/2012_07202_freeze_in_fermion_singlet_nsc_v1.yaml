parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Mass of the Majorana singlet dark matter particle.
    range: light and heavy regimes studied; light-DM examples around the keV scale and heavy regimes around
      or above the scalar threshold
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2012_07202'
  - name: thermal scalar vacuum mass
    symbol: m_S
    description: Vacuum mass of the real scalar S that remains in equilibrium with the plasma.
    range: m_S greater than about 50 GeV in the consistency discussion
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2012_07202'
  - name: chi-chi-S coupling
    symbol: y
    description: Feeble coupling controlling S decays and pair annihilations into dark matter.
    range: larger values allowed after entropy dilution than in standard freeze-in; still bounded by non-thermalization
    role: core
    status: established
    source_reference_ids:
    - '2012_07202'
  - name: scalar thermal-mass coefficient
    symbol: alpha
    description: Coefficient entering the assumed thermal mass of S.
    range: small constant in the paper
    role: core
    status: assumed
    source_reference_ids:
    - '2012_07202'
  - name: fluid equation-of-state parameter
    symbol: n
    description: Parameter n = 3(1+w) controlling how the decaying fluid redshifts.
    range: 0 < n < 4 in the studied non-standard cosmology
    role: cosmological
    status: established
    source_reference_ids:
    - '2012_07202'
  - name: fluid decay scale temperature
    symbol: T_end
    description: Temperature proxy setting the energy-transfer rate from the fluid to radiation.
    range: must be high enough that the fluid decays before nucleosynthesis, around O(10 MeV) or above
    unit: GeV
    role: cosmological
    status: established
    source_reference_ids:
    - '2012_07202'
