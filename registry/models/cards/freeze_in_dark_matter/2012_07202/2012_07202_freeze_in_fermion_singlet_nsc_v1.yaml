validity_domain:
- id: vd_freeze_in_out_of_equilibrium
  applies_to: production
  condition: The dark matter population remains far from equilibrium so back reactions and energy transfer
    from S to dark matter are negligible.
  valid_range: feeble chi-chi-S coupling below thermalization threshold
  status: assumed
  extrapolation_risk: high
  caveats:
  - Thermalization would invalidate the freeze-in treatment.
  source_reference_ids:
  - '2012_07202'
  notes: null
- id: vd_scalar_equilibrium
  applies_to: model
  condition: The scalar S remains in equilibrium with the plasma while freeze-in occurs.
  valid_range: paper restricts to rather heavy S, approximately m_S > 50 GeV
  status: assumed
  extrapolation_risk: medium
  caveats:
  - The S-Higgs interactions are not specified explicitly.
  source_reference_ids:
  - '2012_07202'
  notes: null
- id: vd_fluid_decay_before_bbn
  applies_to: cosmological_history
  condition: The decaying fluid must disappear before nucleosynthesis is significantly altered.
  valid_range: decay completed before plasma temperature reaches O(10 MeV)
  status: assumed
  extrapolation_risk: high
  caveats:
  - Later decay would conflict with the cosmological setup used in the paper.
  source_reference_ids:
  - '2012_07202'
  notes: null
