  global:
  - id: assump_scalar_thermalized
    description: The real scalar S stays in thermal equilibrium with the plasma through unspecified Higgs
      interactions.
    scope: production
    status: assumed
    impact_if_violated: The source term for freeze-in from S decays and annihilations would change.
    can_be_relaxed: unknown
    source_reference_ids:
    - '2012_07202'
    notes: null
  - id: assump_decaying_fluid
    description: A fluid with constant equation-of-state parameter temporarily dominates the early Universe
      and then decays to radiation.
    scope: cosmological_history
    status: assumed
    impact_if_violated: The entropy-dilution and momentum-redshift effects would not match the paper's
      calculations.
    can_be_relaxed: unknown
    source_reference_ids:
    - '2012_07202'
    notes: null
  - id: assump_instant_thermalization
    description: Decay products of the fluid are assumed to thermalize instantly in the plasma.
    scope: cosmological_history
    status: assumed
    impact_if_violated: The entropy and temperature evolution equations would require modification.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2012_07202'
    notes: The paper notes that detailed thermalization is beyond its scope.
