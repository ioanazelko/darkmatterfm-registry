  short_description: A Majorana fermion singlet dark matter particle is produced by freeze-in from a thermal
    real scalar S while a slowly decaying fluid temporarily dominates the early Universe and injects entropy.
  historical_origin_or_motivation: The paper studies how a decaying-fluid non-standard cosmological history
    changes freeze-in relic abundance, allowed couplings, and dark matter mean momentum.
