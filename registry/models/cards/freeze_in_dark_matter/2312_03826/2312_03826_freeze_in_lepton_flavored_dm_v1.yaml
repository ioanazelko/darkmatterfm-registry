  short_description: A simplified lepton-flavored dark matter model in which a neutral fermion DM candidate
    couples feebly to right-handed charged leptons through an electroweakly charged scalar mediator; the
    DM abundance is set by freeze-in plus mediator freeze-out and decay.
  historical_origin_or_motivation: The paper studies a less-explored feeble-coupling regime of flavored
    DM to suppress lepton-flavor violation while producing freeze-in DM and long-lived mediator signatures.
  status: speculative
  model_kind: simplified_model
