symmetries:
  stabilizing_mechanism: A remnant Z2 symmetry after U(1)_{B-L} breaking makes phi_DM odd and stable as
    long as it has no VEV.
  symmetries:
  - name: local U(1)_{B-L}
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the VEV of phi_H
    breaking_scale: null
  - name: remnant Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken when phi_DM has zero VEV
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - SM Higgs sector
  - B-L charged SM fermions
  - right-handed neutrinos
  - W and Z bosons after EWSB
  dark_sector_couplings:
  - lambda_Dh scalar portal to SM Higgs
  - lambda_DH scalar portal to B-L scalar
  - B-L gauge coupling g_BL times phi_DM charge n_BL
  mediator_types:
  - CP-even scalar mediators h_1 and h_2
  - massive B-L vector boson Z_BL
  interaction_operators:
  - (phi_DM^dagger phi_DM)(phi_h^dagger phi_h)
  - (phi_DM^dagger phi_DM)(phi_H^dagger phi_H)
  - B-L covariant derivative coupling to Z_BL
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: none
    velocity_dependence: mild
    spin_dependence: spin_independent
  annihilation_channels:
  - SM and BSM particle annihilations to phi_DM phi_DM^dagger
  - right-handed neutrino annihilation to phi_DM phi_DM^dagger in high-mass regimes
  - Z_BL Z_BL and h_2 h_2 annihilation in BSM-dominated regions
  decay_channels:
  - h_1 to phi_DM phi_DM^dagger when open
  - h_2 to phi_DM phi_DM^dagger when open
  - Z_BL to phi_DM phi_DM^dagger when open
  self_scattering_channels: []
  cp_structure: CP violation is used in the RH-neutrino sector for leptogenesis; the DM scalar production
    couplings are feeble.
  flavor_structure: B-L charges and RH-neutrino Yukawa matrices also control neutrino masses and leptogenesis.
  tree_or_loop_level: tree
parameters:
  core:
  - name: FIMP scalar mass
    symbol: M_DM
    description: Mass of the complex scalar dark matter candidate.
    range: studied across regimes from below m_h1/2 to 1500-3000 GeV high-mass examples
    unit: GeV
    role: core
    status: established
  - name: B-L gauge boson mass
    symbol: M_Z_BL
    description: Mass of the extra neutral gauge boson.
    range: examples include TeV-scale values; varied up to several TeV in relic scans
    unit: GeV
    role: core
    status: established
  - name: B-L gauge coupling
    symbol: g_BL
    description: Gauge coupling of U(1)_{B-L}.
    value: 0.07 in several benchmarks
    role: core
    status: assumed
  - name: dark scalar B-L charge
    symbol: n_BL
    description: B-L charge of phi_DM controlling Z_BL-mediated freeze-in.
    range: feeble values up to about 10^-8; examples include 1.33 x 10^-10
    role: core
    status: inferred
  - name: SM-Higgs portal coupling
    symbol: lambda_Dh
    description: Portal coupling between phi_DM and the SM Higgs doublet.
    range: typically <= 10^-11 for freeze-in relic density; benchmark values around 10^-13 to 10^-11
    role: core
    status: inferred
  - name: B-L-scalar portal coupling
    symbol: lambda_DH
    description: Portal coupling between phi_DM and phi_H.
    range: typically <= 10^-10 for freeze-in relic density; benchmark values around 10^-14 to 10^-10
    role: core
    status: inferred
  - name: right-handed neutrino masses
    symbol: M_N_i
    description: TeV-scale RH-neutrino masses relevant for seesaw, leptogenesis, and high-mass DM production.
    range: examples use 1500-10000 GeV with nearly degenerate lightest two for resonant leptogenesis
    unit: GeV
    role: core
    status: established
  nuisance: []
  derived:
  - name: observed relic density band
    symbol: Omega h^2
    description: Freeze-in target relic-density interval used by the paper.
    range: 0.1172 to 0.1226
    role: derived
    status: assumed
