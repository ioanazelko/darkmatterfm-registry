particle_content:
  dark_matter_candidate:
    name: complex scalar phi_DM
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - B-L breaking scalar phi_H
  - three right-handed neutrinos N_i
  - extra neutral gauge boson Z_BL
  - physical scalar h_2
  mediators:
  - SM-like Higgs h_1
  - BSM scalar h_2
  - B-L gauge boson Z_BL
  - right-handed neutrinos in annihilation channels
  dark_radiation_species: []
