    and produced by freeze-in from Higgs, B-L gauge boson, and BSM-particle processes.
  historical_origin_or_motivation: Motivated by simultaneously explaining neutrino masses, baryon asymmetry,
    and dark matter in a local B-L gauge extension with freeze-in production.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - local U(1)_{B-L} extension
  - Type-I seesaw
  - resonant leptogenesis
  - freeze-in dark matter
  lagrangian_available: 'yes'
