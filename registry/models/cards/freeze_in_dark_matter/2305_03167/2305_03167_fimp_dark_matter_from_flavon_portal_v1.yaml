model_id: 2305_03167_fimp_dark_matter_from_flavon_portal_v1
identity:
  name: FIMP dark matter from flavon portals
  family: freeze_in_dark_matter
  aliases:
  - flavon portal FIMP dark matter
  - Froggatt-Nielsen FIMP dark matter
  short_description: A Froggatt-Nielsen U(1)_FN extension in which a SM-singlet Majorana fermion dark
    matter candidate has feeble flavon-mediated interactions and is produced non-thermally by freeze-in
    from thermal flavon decays.
  historical_origin_or_motivation: The model links the fermion mass hierarchy puzzle to a feebly interacting
    massive particle dark matter candidate through the same Froggatt-Nielsen flavor symmetry.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - Froggatt-Nielsen U(1)_FN flavor symmetry
  - FIMP dark matter
  - flavon portal
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes an effective Lagrangian with flavon-Higgs, dark matter, SM kinetic, and Froggatt-Nielsen
    Yukawa terms; the dark matter mass and interactions arise from higher-dimensional flavon operators.
particle_content:
  dark_matter_candidate:
    name: SM-singlet Majorana fermion with U(1)_FN charge n
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - complex scalar flavon S
  - CP-even flavon h_S
  - CP-odd flavon A_S
  mediators:
  - flavon S
  - CP-even flavon h_S
  - CP-odd flavon A_S
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
  unstable_parent_particles:
  - thermal flavon S or its scalar/pseudoscalar components
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark matter fermion is assigned a half-integer U(1)_FN charge while SM fermions
    and the flavon have integer charges, preventing mixing with neutral SM-sector fermions and making
    the dark matter stable.
  symmetries:
  - name: U(1)_FN flavor symmetry
    type: unknown
    exact_or_approximate: broken
    breaking: Spontaneously broken by the flavon VEV; the global version is softly broken in the scalar
      potential.
    breaking_scale:
      name: flavon VEV
      symbol: v_S
      description: U(1)_FN breaking scale controlling SM flavor suppressions and dark matter mass.
      range: about 2e4 GeV or larger for n=7.5, about 5e5 GeV or larger for n=8.5 in the paper's relic-density
        examples
      unit: GeV
      role: core
      status: established
      source_reference_ids:
      - '2305_03167'
      notes: The paper uses v_S around 1e6 GeV for n around 8.5 in examples.
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - SM fermions through Froggatt-Nielsen Yukawa operators
  - Higgs doublet through the Higgs portal
  dark_sector_couplings:
  - flavon-dark-matter Yukawa coupling suppressed by epsilon^(2n-1)
  - decays of h_S or A_S to dark matter pairs
  - subdominant flavon scattering channels
  mediator_types:
  - scalar flavon
  - pseudoscalar flavon
  interaction_operators:
  - L_DM includes a Majorana dark matter bilinear coupled to powers of the flavon field S
  - Higgs portal term |S|^2 |H|^2
  - dimension-six Froggatt-Nielsen Yukawa interactions keep the flavon in the thermal bath
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels: []
  decay_channels:
  - S -> dark matter dark matter
  - h_S -> dark matter dark matter
  - A_S -> dark matter dark matter
  self_scattering_channels:
  - S S -> dark matter dark matter
  cp_structure: Both scalar and pseudoscalar flavon portal cases are considered; a pseudoscalar-only portal
    variant is also analyzed.
  flavor_structure: Flavor-dependent U(1)_FN charges generate SM fermion mass hierarchies and suppress
    dark matter couplings.
  tree_or_loop_level: tree
parameters:
  core:
  - name: U(1)_FN charge of the dark matter fermion
    symbol: n
    description: Flavor charge controlling the dark matter mass and flavon coupling suppression.
    range: FIMP focus n about 6.5-8.5; benchmark relic calculations use n=7.5 and n=8.5
    unit: null
    role: core
    status: established
    source_reference_ids:
    - '2305_03167'
    notes: Half-integer choices stabilize the dark matter when SM and flavon charges are integer.
  - name: Froggatt-Nielsen expansion parameter
    symbol: epsilon
    description: Small parameter suppressing effective Froggatt-Nielsen operators.
    value: '0.225'
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '2305_03167'
    notes: The paper uses epsilon approximately equal to the Cabibbo angle.
  - name: dark matter mass
    symbol: m_chi
    description: Mass of the SM-singlet Majorana fermion induced by the flavon VEV and U(1)_FN charge.
    range: 100-300 keV for n=7.5 and 3-10 MeV for n=8.5 in relic-density matching regions
    unit: keV to MeV
    role: core
    status: established
    source_reference_ids:
    - '2305_03167'
    notes: The text also discusses broader sub-MeV to sub-GeV possibilities depending on parameters.
  - name: flavon mass
    symbol: M_S
    description: Mass scale of the thermal parent flavon that decays into dark matter.
    range: TeV-scale examples, including 1 TeV and 5 TeV cases
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2305_03167'
    notes: The relic abundance scales with M_S and the suppressed Yukawa coupling.
  - name: flavon vacuum expectation value
    symbol: v_S
    description: U(1)_FN breaking VEV entering the dark matter mass and thermalization rates.
    range: above about 2e4 GeV for n=7.5 and above about 5e5 GeV for n=8.5 in the paper's examples
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2305_03167'
    notes: The analysis uses values near 1e6 GeV for larger n to avoid too-light dark matter.
  - name: dark matter flavon Yukawa coefficient
    symbol: y_chi
    description: Order-one coefficient multiplying the Froggatt-Nielsen-suppressed dark matter operator.
    value: order one; y_chi = 1 in numerical examples
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '2305_03167'
    notes: The effective coupling is suppressed by powers of epsilon set by n.
  nuisance: []
  derived:
  - name: effective flavon-DM coupling
    symbol: epsilon^(2n-1)
    description: Suppressed coupling that controls freeze-in production from flavon decay.
    range: model-dependent through n
    unit: null
    role: derived
    status: established
    source_reference_ids:
    - '2305_03167'
    notes: The paper states that increasing n suppresses the Yukawa coupling and changes the relic-density
      relation.
