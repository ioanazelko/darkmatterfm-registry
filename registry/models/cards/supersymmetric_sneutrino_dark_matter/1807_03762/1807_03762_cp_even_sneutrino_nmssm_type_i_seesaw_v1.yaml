    derived_quantities:
    - sneutrino spectrum
    - Omega h2
    - sigma_SI_p
    - Fermi dwarf likelihood
    - Bayesian evidence/posterior
    - 2l+MET viability
    description: Map Type-I seesaw NMSSM parameters to CP-even sneutrino relic density, direct/indirect
      detection, Higgs/B constraints, and LHC electroweakino signatures.
    forward_model_chain:
    - inputs:
      - NMSSM Type-I seesaw Lagrangian
