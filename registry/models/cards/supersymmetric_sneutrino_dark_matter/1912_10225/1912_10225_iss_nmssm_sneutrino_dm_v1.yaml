  applies: 'yes'
  assumptions:
  - can_be_relaxed: 'yes'
    description: The paper-level comparison uses standard direct-detection halo and nucleon inputs inherited
      through micrOMEGAs/XENON1T limits.
    id: asm_local_halo_standard
    impact_if_violated: Changing halo or nucleon matrix elements shifts sigma_SI constraints.
    notes: null
    scope: direct detection
    source_reference_ids:
    - src_1912_10225_primary
    - src_1912_10225_1903_01124
    status: assumed
  benchmark_implications:
  - Direct-detection viability is one of the model advantages emphasized by the authors.
  caveats:
  - Detector-level likelihood is not reconstructed.
  constrained_parameters:
  - sigma_SI
  - m_snu1
  - Higgs mixing
  constraint_type: direct_detection
  data_release: XENON1T one-ton-year 2018 limit as used in the scan.
  excluded_regions:
  - Scan points above the XENON1T 2018 90% upper limit receive a large penalty.
  id: con_xenon1t_2018_si
  likelihood_available: 'no'
  likelihood_reference: null
  name: XENON1T 2018 spin-independent upper limit
  notes: null
  observable_channel: direct_detection/nuclear recoil
  recasting_needed: partial
  robustness: high
  source_reference_ids:
  - src_1912_10225_primary
  - src_1912_10225_1903_01124
  - src_1912_10225_1810_09143
- allowed_regions:
  - Accepted points keep the SM-like Higgs near 125.18 GeV, satisfy B constraints, and avoid sneutrino
    VEVs.
  applies: 'yes'
  assumptions:
  - can_be_relaxed: 'no'
    description: Sneutrino fields are required not to acquire nonzero VEVs.
    id: asm_no_sneutrino_vev
    impact_if_violated: A sneutrino VEV would destabilize the intended R-parity/LSP interpretation.
    notes: null
    scope: vacuum structure
    source_reference_ids:
    - src_1912_10225_primary
    status: assumed
  benchmark_implications:
  - The viable g-2 region is narrowed by these non-DM constraints.
  caveats:
  - Some constraints are implemented as scan penalties, not reusable likelihood tables.
  constrained_parameters:
  - m_h
  - BR_Bs_mumu
  - BR_B_to_Xs_gamma
  - Y_nu/lambda_N ratio
  - sneutrino vev
  constraint_type: theoretical
  data_release: HiggsBounds/HiggsSignals, B-physics observables, unitarity bounds, Vevacious/CosmoTransitions
    stability checks.
  excluded_regions:
  - Points failing HiggsBounds/HiggsSignals, B-observable Gaussians, neutrino unitarity, or sneutrino-VEV
    stability are vetoed or penalized.
  id: con_higgs_bphysics_vacuum
  likelihood_available: approximate
  likelihood_reference: null
  name: Higgs, B-physics, neutrino-unitarity, and vacuum-stability filters
  notes: null
  observable_channel: Higgs/B physics/neutrino sector
  recasting_needed: partial
  robustness: medium
  source_reference_ids:
  - src_1912_10225_primary
- allowed_regions:
  - The primary paper argues the ISS-NMSSM decay pattern can evade stronger standard-NMSSM 3l+MET expectations.
  applies: recast_required
  assumptions: []
  benchmark_implications:
  - A dedicated recast is needed before turning this into an exclusion contour.
  caveats:
  - No Monte Carlo recast is provided in the primary paper.
  constrained_parameters:
  - m_chargino
  - m_neutralino
  - m_snu1
  constraint_type: collider
  data_release: ATLAS/CMS electroweakino searches discussed qualitatively in the primary paper.
  excluded_regions:
  - Compressed or light electroweakino spectra can be constrained by ATLAS/CMS dilepton+MET searches.
  id: con_lhc_2l_met
  likelihood_available: 'no'
  likelihood_reference: null
  name: LHC two-lepton plus missing-energy electroweakino search relevance
  notes: null
  observable_channel: collider/2l+MET
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - src_1912_10225_primary
  - src_1912_10225_1810_09143
theory_to_observable_routing:
  routes:
  - agent_notes: Primary source describes the scan machinery, but reusable likelihood data and LHC recast
      code are not included.
    caveats:
    - Post-2020 g-2 and direct-detection updates require re-evaluation.
    constraint_ids:
    - con_muon_g_minus_2_target
    - con_planck_relic_density
    - con_xenon1t_2018_si
    - con_higgs_bphysics_vacuum
    - con_lhc_2l_met
    derived_quantities:
    - a_mu^SUSY
    - Omega h^2
    - sigma_SI
    - 2l+MET branching pattern
    - vacuum-stability flag
    description: Map ISS-NMSSM input parameters to g-2, relic density, direct detection, and LHC/Higgs/B/vacuum
      filters.
    forward_model_chain:
    - inputs:
      - ISS-NMSSM Lagrangian
      - soft parameters
      notes: null
      outputs:
      - spectrum
      - mixing matrices
      - a_mu^SUSY
      step_id: step_spectrum
      step_type: simulation
      tool_or_code: SARAH/SPheno
      validity: Valid over the scanned perturbative parameter range.
    - inputs:
      - spectrum
      - couplings
      notes: null
      outputs:
      - Omega h^2
      - sigma_SI
      step_id: step_dm
      step_type: simulation
      tool_or_code: micrOMEGAs
      validity: Uses standard thermal relic and direct-detection assumptions.
    - inputs:
      - spectrum
      - observables
      notes: null
      outputs:
      - accepted/rejected scan points
      step_id: step_constraints
      step_type: likelihood
      tool_or_code: HiggsBounds/HiggsSignals/Vevacious/CosmoTransitions and scan chi2
      validity: Paper-level penalties rather than a public likelihood.
    id: route_iss_nmssm_scan
    input_parameters:
    - Y_nu
    - lambda_N
    - mu_X
    - mu
    - m_snu1
    - Higgs-sector parameters
    - electroweakino masses
    likelihoods:
    - paper chi2 scan terms for Higgs, B physics, DM, unitarity, g-2, vacuum, and LSP veto
    observable_ids:
    - obs_muon_g_minus_2
    - obs_sneutrino_relic_density
    - obs_suppressed_si_scattering
    - obs_lhc_dilepton_met
    required_code_resources:
    - SARAH
    - SPheno
    - micrOMEGAs
    - HiggsBounds
    - HiggsSignals
    - Vevacious
    - CosmoTransitions
    route_status: partially_implemented
    source_model_features:
    - R-parity-stable mostly right-handed sneutrino LSP
    - inverse-seesaw Yukawa and singlet couplings
    - chargino-sneutrino loop contribution to a_mu
    validation_tests:
    - recover h^2_obs=0.120 target
    - check sigma_SI below XENON1T 2018
    - recover qualitative 2l+MET decay pattern
