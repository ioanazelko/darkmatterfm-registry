    role: core
    status: established
    source_reference_ids:
    - '1711_00038'
  - name: singlet-doublet coupling
    symbol: lambda
    description: Superpotential coupling S H_u H_d that generates the effective mu term.
    range: varied in the scan; examples include values around 0.32 to 0.46 in one model discussion
