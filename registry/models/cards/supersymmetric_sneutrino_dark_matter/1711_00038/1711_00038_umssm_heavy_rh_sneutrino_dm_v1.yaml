    unit: null
    role: core
    status: established
    source_reference_ids:
    - '1711_00038'
  - name: E6 mixing angle
    symbol: theta_E6
    description: Defines the surviving U(1) prime as a linear combination of U(1)_chi and U(1)_psi.
