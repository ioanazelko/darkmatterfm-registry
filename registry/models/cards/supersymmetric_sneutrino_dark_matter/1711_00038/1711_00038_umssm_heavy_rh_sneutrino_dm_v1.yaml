    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the singlet scalar vacuum expectation value
    breaking_scale:
      name: U(1)' breaking scale
      symbol: v_s
      description: Singlet VEV that sets the Z prime mass scale.
      range: tens of TeV in maximal-mass examples
      unit: TeV
      role: core
      status: inferred
      source_reference_ids:
      - '1711_00038'
  - name: E6 charge mixing
    type: gauge
    exact_or_approximate: broken
    breaking: only one linear combination of U(1)_chi and U(1)_psi remains at the relevant scale
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
