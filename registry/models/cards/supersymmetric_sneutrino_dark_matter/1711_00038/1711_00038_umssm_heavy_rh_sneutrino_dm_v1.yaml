identity:
  name: Very heavy right-handed sneutrino thermal dark matter in U(1)' MSSM extensions
  family: supersymmetric_sneutrino_dark_matter
  aliases:
  - UMSSM right-handed sneutrino dark matter
  - very heavy sneutrino WIMP
  - E6 U(1) prime sneutrino dark matter
  short_description: A U(1)' extension of the MSSM, motivated by E6 breaking, where the lightest right-handed
    sneutrino is a thermal WIMP whose relic density is reduced by resonant Z' and singlet-Higgs exchange.
  historical_origin_or_motivation: The paper asks how heavy an explicit thermal WIMP can be and finds
    viable right-handed sneutrino dark matter up to about 43 TeV in U(1)' MSSM extensions.
  status: speculative
  model_kind: complete_theory
theory:
