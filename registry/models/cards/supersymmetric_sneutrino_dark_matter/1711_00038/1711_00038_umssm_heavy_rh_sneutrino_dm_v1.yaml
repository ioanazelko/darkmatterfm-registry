  annihilation_channels:
  - resonant annihilation through h_3 near M_sneutrino about M_h3/2
  - resonant annihilation through Z' near M_sneutrino about M_Zprime/2
  - annihilation to heavy Higgs doublet states when allowed
  - annihilation to longitudinal electroweak gauge bosons/light Higgs-sector states
  decay_channels: []
  self_scattering_channels: []
  cp_structure: CP-even singlet Higgs h_3 gives the dominant S-wave scalar resonance; Z prime exchange
    is P-wave for the complex scalar initial state.
  flavor_structure: Three right-handed sneutrino generations are present; the maximal-mass analysis avoids
    coannihilation by separating the lightest state from other superpartners.
  tree_or_loop_level: both
