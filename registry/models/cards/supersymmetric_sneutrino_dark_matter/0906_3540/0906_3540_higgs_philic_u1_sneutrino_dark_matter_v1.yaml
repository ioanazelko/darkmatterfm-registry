  - lightest neutralino NNLSP
  - heavier MSSM superpartners and exotics
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: R parity stabilizes the lightest supersymmetric particle; gauge-singlet right-handed
    neutrino superfields and tiny effective Dirac neutrino Yukawa couplings make the NLSP lifetime longer
    than the age of the universe.
