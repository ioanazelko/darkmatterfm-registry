    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - 0906_3540
    notes: Used in the numerical benchmark.
  embedded_in_larger_framework: 'yes'
  notes: The superpotential includes h_lambda S H_u H_d plus a dimension-five S L H_u Y_N N / M_R term;
    anomaly cancellation requires family-dependent charges or extra vector-like matter and singlets.
