identity:
  name: Higgs-philic U(1)' right-handed sneutrino dark matter
  family: supersymmetric_sneutrino_dark_matter
  aliases:
  - R-parity conserving sneutrino dark matter in a Higgs-philic U(1)' MSSM extension
  short_description: 'An R-parity conserving Higgs-philic U(1)'' extension of the MSSM in which right-handed
    sneutrinos are the dark matter: the lightest right-handed sneutrino is the LSP and a second right-handed
    sneutrino is a long-lived NLSP, with relic abundance produced nonthermally from decays of heavier
    superpartners.'
  historical_origin_or_motivation: The model is built to generate the mu parameter and small Dirac neutrino
    masses through U(1)' breaking while also explaining cosmic-ray electron/positron anomalies with sneutrino
    dark matter decays.
  status: speculative
  model_kind: complete_theory
