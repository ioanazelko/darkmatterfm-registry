parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Mass of the Majorana fermion singlet.
    range: analysis takes m_chi >= 50 GeV; WIMP discussion spans roughly 10 GeV to 10 TeV
    unit: GeV
    role: core
    status: established
  - name: heavy Dirac neutrino mass
    symbol: m_N
    description: Mass of the added heavy Dirac neutrino.
    range: analysis takes m_N >= 100 GeV; benchmark ratios include m_N = 0.7 m_chi and m_N = 1.4 m_chi
    unit: GeV
    role: core
    status: established
  - name: scalar Higgs-portal coefficient
    symbol: c_s/Lambda
    description: Coefficient controlling the unsuppressed spin-independent Higgs-mediated elastic cross
      section.
    range: bounded by XENON1T fit in the paper; also kept below perturbative EFT-size estimates
    role: core
    status: established
  - name: pseudoscalar Higgs-portal coefficient
    symbol: c_a/Lambda
    description: Coefficient contributing to annihilation while direct detection is velocity suppressed.
    range: chosen as a function of m_chi to reproduce Omega_c h^2 about 0.12 in one limiting case
    role: core
    status: established
  - name: heavy-light neutrino Yukawa or mixing
    symbol: y_N, s_theta
    description: Yukawa coupling and active-heavy neutrino mixing, assumed mostly along tau flavor.
    value: benchmark s_theta = 0.1
    range: LEP avoidance motivates m_N above M_Z
    role: core
    status: established
  - name: heavy-neutrino four-fermion coefficient
    symbol: c_N/Lambda^2
    description: Coefficient controlling annihilation channels involving heavy neutrinos.
    range: chosen as a function of m_chi to reproduce Omega_c h^2 about 0.12 in one limiting case
    role: core
    status: established
