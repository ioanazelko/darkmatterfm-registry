theory_to_observable_routing:
  routes:
  - id: route_sphaleron_asymmetry_to_direct_search
    description: Connect electroweak sphaleron balance to fourth-generation anti-U abundance, dark-atom
      formation with helium, collider limits, and nuclear direct-detection tests.
    source_model_features:
    - stable fourth-generation U antiquarks
    - electroweak sphaleron asymmetry transfer
    - helium-bound dark atoms
    input_parameters:
    - m_U
    - baryon asymmetry
    - lepton asymmetry
    - EWPT order
    - helium abundance
    derived_quantities:
    - anti-U excess
    - dark atom abundance
    - residual charged relic abundance
    - nuclear binding rates
    forward_model_chain:
    - step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - chemical potentials
      - EWPT assumptions
      outputs:
      - anti-U-to-baryon asymmetry relation
      validity: Sensitive to electroweak phase transition order and conserved charges.
      notes: Reproduce the primary sphaleron-balance relation.
    - step_id: s2
      step_type: semi_analytic_model
      tool_or_code: null
      inputs:
      - anti-U abundance
      - BBN helium abundance
      outputs:
      - (UUU)-helium dark atom abundance
      validity: Requires bound-state formation assumptions.
      notes: Compute helium screening and residual charged relics.
    - step_id: s3
      step_type: recasting
      tool_or_code: collider and nuclear-search recasts
      inputs:
      - m_U
      - dark atom abundance
      - nuclear binding model
      outputs:
      - R-hadron limits
      - DAMA/null-search compatibility
      - anomalous isotope limits
      validity: Nuclear interaction model is unresolved.
      notes: Apply collider and terrestrial constraints.
    observable_ids:
    - obs_dama_sodium_binding_modulation
    - obs_stable_rhadron_collider_signature
    - obs_anomalous_isotope_and_ohelium_signatures
    constraint_ids:
    - con_lhc_rhadron_mass_floor
    - con_dark_atom_nuclear_physics
    - con_anomalous_isotope_avoidance
    likelihoods:
    - LHC heavy stable charged particle/R-hadron searches
    - DAMA/LIBRA modulation comparison
    - anomalous isotope limits
    required_code_resources: []
    validation_tests:
    - Recover the primary m_U about 3.5 TeV abundance benchmark.
    - Check residual positive/neutral U-hadron abundances against anomalous isotope searches.
    route_status: planned
    agent_notes: The limiting step is the dark-atom nuclear interaction model, not the bookkeeping of
      the asymmetry relation.
    caveats:
    - Direct-detection claims are speculative until the nuclear binding problem is solved.
