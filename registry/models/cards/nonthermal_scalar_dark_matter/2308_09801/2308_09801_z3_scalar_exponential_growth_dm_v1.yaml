identity:
  name: Z3 scalar dark matter with exponential-growth production
  family: nonthermal_scalar_dark_matter
  aliases:
  - semi-production scalar dark matter
  - exponential-growth dark matter toy model
  short_description: A Z3-charged scalar dark matter toy model in which a thermally coupled singlet scalar
    bath particle initiates nonthermal exponential-growth production after a small seed abundance is generated.
  historical_origin_or_motivation: The paper studies exponential-growth dark matter beyond the equilibrium-distribution
    approximation by solving the Boltzmann equation at operator level and applying it to a Z3 scalar toy
    model.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Z3 scalar dark matter
  - nonthermal exponential-growth production
  - Boltzmann phase-space evolution
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The interaction Lagrangian contains a cubic scalar term, Higgs interactions for the bath scalar,
    and a freeze-in interaction used to seed the initial abundance.
particle_content:
  dark_matter_candidate:
    name: Z3-charged scalar dark matter
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - singlet scalar bath particle
  - anti-particle dark matter component with identical distribution in the no-asymmetry case
  mediators:
  - singlet scalar bath particle coupled to the Standard Model through the Higgs
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
  unstable_parent_particles:
  - heavy non-relativistic particle in the out-of-equilibrium seed-production example
  standard_model_extension: minimal
symmetries:
  stabilizing_mechanism: The dark matter scalar is charged under a Z3 symmetry, which controls semi-production
    scatterings and stabilizes the candidate in the toy model.
  symmetries:
  - name: Z3
    type: discrete
    exact_or_approximate: exact
    breaking: not discussed
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - Higgs doublet
  - thermal Standard Model plasma
  dark_sector_couplings:
  - lambda_tr cubic scalar coupling driving semi-production
  - lambda_S Higgs mixing for the bath scalar
  - lambda_Sphi Higgs decay/scattering coupling to bath scalars
  - lambda_fi freeze-in seed coupling
  mediator_types:
  - singlet scalar bath particle
  interaction_operators:
  - lambda_tr phi chi^3 + h.c.
  - lambda_S phi^2 H^dagger H
  - lambda_Sphi phi^2 H^dagger H chi^2-like bath production term as described in text
  - lambda_fi phi^2 chi* chi seed-production interaction
  scattering:
    elastic: unknown
    inelastic: 'yes'
    momentum_dependence: strong
    velocity_dependence: unknown
    spin_dependence: not_applicable
  annihilation_channels: []
  decay_channels:
  - out-of-equilibrium heavy-parent decay to initial dark matter in one seed example
  self_scattering_channels:
  - chi plus bath scalar to two anti-chi particles
  - anti-chi plus bath scalar to two chi particles
  cp_structure: not discussed
  flavor_structure: not_applicable
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Mass of the Z3-charged scalar dark matter particle.
    value: 1 GeV benchmark in freeze-in example; must be above MeV scale in the illustrated mass hierarchy
    unit: GeV
    role: core
    status: inferred
  - name: bath scalar mass
    symbol: m_phi
    description: Mass of the singlet scalar bath particle that scatters with dark matter.
    value: 2 GeV benchmark in freeze-in example; m_phi = 2 m_chi used in toy-model calculations
    unit: GeV
    role: core
    status: inferred
  - name: semi-production coupling
    symbol: lambda_tr
    description: Coupling controlling chi plus bath-scalar scatterings that drive exponential growth.
    range: chosen below the regime where backward scatterings/equilibrium densities invalidate the approximation
    role: core
    status: inferred
  - name: Higgs mixing coupling
    symbol: lambda_S
    description: Scalar coupling governing mixing of the bath scalar with the Standard Model Higgs doublet.
    range: approximately <= O(0.01) for electroweak-scale masses in the paper discussion
    role: core
    status: inferred
  - name: Higgs bath-production coupling
    symbol: lambda_Sphi
    description: Coupling governing Higgs decays and scatterings to bath scalars.
    range: approximately <= O(0.01) for electroweak-scale masses in the paper discussion
    role: core
    status: inferred
  - name: freeze-in seed coupling
    symbol: lambda_fi
    description: Small coupling that can generate the initial dark matter abundance before exponential
      growth.
    range: nonzero but much smaller than the coupling that would produce the full abundance by freeze-in
      alone
    role: core
    status: inferred
  - name: production start epoch
    symbol: x_init
    description: Temperature variable epoch when exponential-growth production begins.
    range: model dependent
    role: cosmological
    status: inferred
  - name: production end epoch
    symbol: x_end
    description: Epoch when scattering becomes Boltzmann suppressed and the comoving abundance freezes.
    range: near x ~ 1 for m_phi > m_chi; near x ~ m_chi/m_phi for the opposite hierarchy
    role: cosmological
    status: inferred
  derived:
  - name: growth function
    symbol: P(q,x)
    description: Momentum- and epoch-dependent growth function obtained by solving the Boltzmann equation
      at operator level.
    range: model dependent
    role: derived
    status: inferred
  - name: growth factor
    symbol: A(x)
    description: Generic exponential factor describing dark matter growth; not necessarily a simple exponential
      in x.
    range: model dependent
    role: derived
    status: inferred
production:
  mechanisms:
  - nonthermal exponential-growth scattering
  - semi-production
  - freeze-in seed abundance
  - out-of-equilibrium heavy-particle decay seed abundance
  thermal_equilibrium_with_standard_model: partial
