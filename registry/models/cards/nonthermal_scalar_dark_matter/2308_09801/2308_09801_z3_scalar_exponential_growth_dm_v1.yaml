  - m_chi
  - m_phi
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: 'yes'
  notes: The exponential-growth process cannot by itself create the abundance from zero; a seed from freeze-in
    or heavy-particle decay is required, after which the scattering can dominate production.
