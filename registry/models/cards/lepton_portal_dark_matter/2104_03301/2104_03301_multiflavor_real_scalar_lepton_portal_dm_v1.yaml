identity:
  name: Multi-degree real scalar lepton-portal dark matter for muon g-2
  family: lepton_portal_dark_matter
  aliases:
  - LPDM real scalar X with S_nf symmetry
  - multi-flavor scalar lepton portal dark matter
  short_description: A lepton-portal model where real charge-neutral scalar dark matter X has n_f internal
    degrees of freedom under an S_nf symmetry and couples through vector-like charged fermion mediators
    to charged leptons.
  historical_origin_or_motivation: Motivated by explaining the positive muon anomalous magnetic moment
    excess while relaxing indirect-search pressure on minimal lepton-portal dark matter.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Lepton Portal Dark Matter
  - simplified WIMP dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper presents renormalizable interactions between real scalar dark matter fields X^a, vector-like
    charged fermions, and right-handed charged leptons; it also includes right-handed neutrinos for light
    neutrino masses.
particle_content:
  dark_matter_candidate:
    name: real scalar X^a
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - n_f degenerate real scalar species X^a
  - vector-like charged fermions psi_e, psi_mu, psi_tau
  mediators:
  - charged vector-like fermion mediator psi
  dark_radiation_species: []
  excited_or_degenerate_states:
  - approximately degenerate charged fermion partners
  - degenerate X^a species
  long_lived_particles:
  - Z2-odd scalar dark matter states
  unstable_parent_particles:
  - charged fermion mediators
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Both X and the vector-like charged mediator are odd under a dark Z2 parity, while
    an S_nf symmetry organizes the n_f real scalar species and keeps their masses/couplings degenerate
    in the simplified setup.
  symmetries:
  - name: dark Z2 parity
    type: discrete
    exact_or_approximate: exact
  - name: S_nf dark flavor symmetry
    type: discrete
    exact_or_approximate: exact
  - name: charged-lepton flavor symmetry used in setup
    type: global
    exact_or_approximate: approximate
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  standard_model_targets:
  - right-handed charged leptons
  - muons
  - photons through loops
  - electroweak gauge bosons in coannihilation
  dark_sector_couplings:
  - lambda X^a psi_L^i e_R^i
  - charged fermion mediator mass term
  - optional Higgs portal coupling mentioned as a possible addition
  mediator_types:
  - vector-like charged fermions
  interaction_operators:
  - renormalizable lepton-portal Yukawa interaction
  - loop-induced two-photon coupling for direct detection
  annihilation_channels:
  - X X to charged leptons
  - X psi coannihilation channels
  - psi+ psi- annihilation to leptons, quarks, gauge bosons, and Zh in the degenerate regime
  decay_channels:
  - charged mediator decays to X plus charged lepton
  self_scattering_channels: []
  tree_or_loop_level: both
parameters:
  core:
  - name: lepton-portal coupling
    symbol: lambda
    description: Common coupling Y_X^a = lambda for all dark scalar species under S_nf.
    range: fixed by muon g-2 and perturbativity considerations
    role: core
    status: inferred
  - name: dark matter mass
    symbol: M_X
    description: Mass of the real scalar dark matter species.
    range: favored below around 200 GeV in the paper summary
    unit: GeV
    role: core
    status: inferred
  - name: charged mediator mass
    symbol: m_psi
    description: Mass of the vector-like charged fermion mediator, taken approximately degenerate with
      M_X in the viable thermal coannihilation region.
    range: favored below around 200 GeV; nearly degenerate with M_X
    unit: GeV
    role: core
    status: inferred
  - name: number of dark scalar degrees of freedom
    symbol: n_f
    description: Number of real scalar dark matter species transforming under S_nf.
    range: integer, large n_f relaxes indirect limits
    role: core
    status: inferred
  - name: mediator-DM mass splitting
    symbol: Delta m
    description: Mass splitting m_psi - M_X controlling compressed spectra and coannihilation.
    range: approximately degenerate; m_psi/M_X - 1 about 1/25 in coannihilation discussion
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: muon g-2 contribution
    symbol: Delta a_mu
    description: One-loop contribution from X and psi scales as n_f lambda^2.
    value: target central excess 251(59)e-11
    role: derived
    status: inferred
  - name: thermal relic abundance
    symbol: Omega_X h^2
    description: Thermal abundance from d-wave annihilation alone is insufficient in the viable region,
      while coannihilation can produce an interesting thermal parameter space.
    range: model-parameter dependent
    role: derived
    status: inferred
production:
  mechanisms:
  - thermal freeze-out
  - coannihilation with nearly degenerate charged fermion mediators
