    description: Map CP-violating 3HDM benchmark parameters to relic density, suppressed detection rates,
      and collider cascades.
    source_model_features:
    - Z-portal dark CP violation
    - inert scalar S1 dark matter
    - zero Higgs portal couplings in benchmarks
    input_parameters:
    - m_S1
    - theta_CPV
    - neutral and charged inert scalar masses
    - Z S_i S_j couplings
    derived_quantities:
    - effective coannihilation cross section
    - Omega_S1 h^2
    - sigma_DM-N
    - <sigma v>
    - cascade branching fractions
    forward_model_chain:
    - step_id: spectrum_couplings
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - 3HDM scalar potential
      - theta_CPV
      - mass splittings
      outputs:
      - Z S_i S_j couplings
      - scalar masses
      validity: Benchmark scalar potentials in the primary paper.
      notes: The CP-violating angle controls the relevant Z couplings.
    - step_id: freezeout
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - effective coannihilation channels
      outputs:
      - Omega_S1 h^2
      validity: Thermal freeze-out with coannihilation.
      notes: Primary paper writes the Boltzmann equation for S1.
    - step_id: detection_rates
      step_type: data_transform
      tool_or_code: null
      inputs:
      - Higgs portal couplings
      - annihilation channels
      outputs:
      - sigma_DM-N
      - <sigma v>
      validity: Zero-portal benchmark rates.
      notes: Used to compare with XENON1T and Fermi-LAT.
    - step_id: collider_projection
      step_type: recasting
      tool_or_code: null
      inputs:
      - inert scalar masses
      - cascade topologies
      outputs:
      - LHC benchmark sensitivity
      validity: Requires detector-level analysis.
      notes: Related 3HDM collider papers provide route context.
    observable_ids:
    - z_portal_coannihilation_relic
    - direct_indirect_suppressed_rates
    - inert_scalar_collider_cascades
    constraint_ids:
    - planck_overabundance_exclusion
    - xenon1t_fermilat_nonlimiting
    - lhc_inert_scalar_search_consistency
    likelihoods:
    - Planck band only; direct/indirect/collider likelihoods not packaged
    required_code_resources:
    - custom 3HDM spectrum implementation
    - Boltzmann solver with coannihilations
    - collider recast tools
    validation_tests:
    - Reproduce benchmark relic-density plots versus theta_CPV and m_S1.
    route_status: planned
    agent_notes: The route is scientifically explicit but not packaged as reusable code in the local text.
    caveats:
    - Collider and underabundance interpretations are benchmark-dependent.
