validity_domain:
- id: left_handed_majorana_case
  applies_to: model
  condition: The paper's viable full-density result applies to the case with a Majorana mass for the left-handed
    technigluon-dressed D state plus a Dirac mass for both chiralities.
  valid_range: m_N2 above about 23 GeV in the left-handed Majorana scenario, subject to the paper's assumptions.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The right-handed Majorana-mass variant is described as unable to account for the whole dark matter
    density in viable parameter space.
  source_reference_ids:
  - hep-ph0703266
  notes: null
- id: spectrum_and_stability_assumption
  applies_to: model
  condition: N_2 must be the lightest technibaryon and the ETC sector must preserve the stabilizing Z_2
    symmetry.
  valid_range: null
  status: assumed
  extrapolation_risk: high
  caveats:
  - The paper states that the technicolor spectrum and exact ETC model are not known a priori.
  source_reference_ids:
  - hep-ph0703266
  notes: null
- id: annihilation_approximation
  applies_to: parameter
  condition: The analytic annihilation treatment is accurate away from the W+ W- threshold peak and includes
    approximate corrections near that region.
  valid_range: Best away from the peak around m_N2 about 122 GeV; paper estimates at most about 10 percent
    error at the peak.
  status: approximate
  extrapolation_risk: medium
  caveats:
  - Terms of order M_W^2/m_N2^2 are dropped in the high-mass W+ W- channel.
  source_reference_ids:
  - hep-ph0703266
  notes: null
