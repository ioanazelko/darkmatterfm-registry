  short_description: A composite Majorana WIMP formed from a neutral D techniquark bound to a technigluon
    in minimal walking SU(2) technicolor; a seesaw-like mass matrix leaves a stable lighter Majorana state
    N_2 that can make the full dark matter abundance in viable parameter ranges.
  historical_origin_or_motivation: The paper presents this as an alternative to neutral Goldstone technibaryon
    and fourth-neutrino dark matter in minimal walking technicolor, motivated by suppressing coherent
    nuclear scattering through a Majorana candidate.
  status: speculative
  model_kind: simplified_model
