identity:
  name: Adjoint-messenger gauge mediation with gravitino LSP dark matter
  family: supersymmetric_gravitino_dark_matter
  aliases:
  - GMSB with adjoint messengers and a U(1)_{B-L} D-term
  - adjoint-messenger gauge mediation
  short_description: A gauge-mediated supersymmetry-breaking model with adjoint messenger fields and a
    nonzero U(1)_{B-L} D-term, in which the gravitino is usually the LSP and can be a hot, subcomponent,
    or keV-scale dark-matter candidate depending on the cosmological history.
  historical_origin_or_motivation: The paper introduces the B-L D-term to cure too-light right-handed
    sleptons in adjoint-messenger GMSB while keeping a viable Higgs mass, light sleptons, and possible
    relic dark matter.
  status: speculative
  model_kind: complete_theory
