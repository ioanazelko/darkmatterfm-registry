model_id: 2206_06768_leptoquark_portal_triplet_vectorlike_dm_v1
identity:
  name: Leptoquark-portal SU(2)L-triplet vector-like fermion dark matter
  family: leptoquark_portal_dark_matter
  aliases: []
  short_description: A scalar S3 leptoquark portal connects the Standard Model to Z2-odd vector-like fermions,
    with a neutral component of an SU(2)L-triplet Psi_L multiplet as dark matter.
  historical_origin_or_motivation: unknown
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - scalar_leptoquark_S3_extension
  - electroweak_multiplet_dark_matter
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The triplet variant uses the same S3 portal structure but electroweak gauge interactions of Psi_L
    are fixed by the SU(2)L triplet representation.
particle_content:
  dark_matter_candidate:
    name: neutral component of SU(2)L-triplet Psi_L vector-like fermion
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - charged components of Psi_L triplet
  - colored vector-like fermion multiplet Psi_Q
  mediators:
  - scalar leptoquark S3
  - electroweak gauge bosons
  excited_or_degenerate_states:
  - charged Psi_L components with electroweak mass splitting
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A Z2-type parity makes Psi_L and Psi_Q odd while other particles are even; the
    neutral triplet component is the dark matter candidate.
  symmetries:
  - name: Z2 dark parity
    type: discrete
    exact_or_approximate: exact
interactions:
  portals:
  - other
  standard_model_targets:
  - quark doublets
  - lepton doublets
  - W bosons
  - scalar leptoquark final states
  dark_sector_couplings:
  - lambda coupling between Psi_Q, S3 and Psi_L
  - electroweak gauge interactions of the Psi_L triplet
  mediator_types:
  - scalar leptoquark S3
  - W boson
  - electroweak gauge bosons
  annihilation_channels:
  - Psi_L triplet annihilation to W+ W-
  - annihilation to S3 S3 when kinematically open
  - coannihilation involving Psi_Q and Psi_L
  tree_or_loop_level: both
parameters:
  core:
  - name: triplet dark matter mass
    symbol: M_Psi_L
    description: Mass of the SU(2)L triplet vector-like fermion dark matter multiplet.
    role: core
    status: inferred
  - name: colored partner mass
    symbol: M_Psi_Q
    description: Mass of the colored vector-like fermion partner.
    role: core
    status: inferred
  - name: mass splitting
    symbol: Delta
    description: Mass splitting between Psi_Q and Psi_L.
    value: M_Psi_L - M_Psi_Q
    role: core
    status: inferred
  - name: leptoquark mass
    symbol: M_S3
    description: Mass of the scalar leptoquark mediator.
    role: core
    status: inferred
  - name: dark-sector portal coupling
    symbol: lambda
    description: Coupling joining Psi_Q, S3 and Psi_L.
    role: core
    status: inferred
  - name: triplet thermal lower mass
    symbol: M_Psi_L_min
    description: The paper quotes M_Psi_L about 1750 GeV for lambda=0 and about 1600 GeV for a decoupled
      color singlet when requiring the correct relic density.
    range: about 1600-1750
    unit: GeV
    role: derived
    status: inferred
production:
  mechanisms:
  - thermal freeze-out
  - electroweak annihilation
  - coannihilation with colored vector-like partner
  thermal_equilibrium_with_standard_model: 'yes'
  abundance_set_by:
  - weak processes within the Psi_L triplet
  - portal coupling lambda
  - M_S3
  - Delta
  can_produce_all_dark_matter: parameter_dependent
  notes: For lambda=0, the relic density is mostly set by weak processes within the triplet; nonzero lambda
    adds leptoquark-mediated coannihilation effects.
relic_density:
  full_or_subcomponent: either
  calculation_type: thermal
  key_dependencies:
  - M_Psi_L
  - M_Psi_Q
  - M_S3
  - lambda
  - Delta
  - electroweak triplet gauge interactions
  requires_entropy_dilution: unknown
  overclosure_risk: parameter_dependent
  underproduction_risk: parameter_dependent
  tuning_assessment: unknown
cosmological_history:
  standard_history_assumed: true
  nonstandard_features: []
  bbn_relevance: unknown
  cmb_relevance: unknown
phase_space:
  distribution_type: thermal
  distribution_function_available: 'no'
structure_formation:
  linear:
    behaves_like_cdm: 'yes'
    transfer_function_shape: cdm_like
    small_scale_power_effect: none
  nonlinear:
    halo_mass_function_effect: not discussed
    subhalo_mass_function_effect: not discussed
    simulation_calibrated: 'no'
validity_domain:
- id: triplet_lowest_representation
  applies_to: model
  condition: Psi_L is taken as an SU(2)L triplet with zero hypercharge and a neutral component; higher
    representations are not extracted.
  status: inferred
  caveats:
  - The paper notes higher-dimensional representations are possible.
assumptions:
  global:
  - id: z2_parity
    description: All Standard Model fields and S3 are Z2 even, while Psi_L and Psi_Q are Z2 odd, stabilizing
      the neutral triplet component.
    scope: global
    status: assumed
  - id: neutral_zero_hypercharge
    description: The dark matter multiplet has zero hypercharge and a neutral component to avoid large
      Z-mediated direct detection.
    scope: global
    status: assumed
