constraints:
- id: q4_wmap_relic_density
  name: WMAP relic-density interval used to set lambda_5
  constraint_type: cosmological
  observable_channel: cosmology
  applies: 'yes'
  constrained_parameters:
  - m_X
  - lambda_5
  - hidden scalar masses
  excluded_regions:
  - Points below or above the lambda_5 band underproduce or overproduce the WMAP relic abundance in the
    one-component setup.
  allowed_regions:
  - A band in the m_X-lambda_5 plane satisfies 0.09 < Omega h^2 < 0.13.
  benchmark_implications:
  - The relic calculation defines the viable thermal strip for the assigned model.
  likelihood_available: partial
  likelihood_reference: micrOMEGAs calculation described but no model files supplied
  data_release: WMAP-era relic-density interval in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: q4_one_component_after_decays
    description: Heavier hidden scalars decay early enough to leave the lightest scalar as the relevant
      relic.
    scope: production
    status: assumed
    impact_if_violated: If false, coupled multi-component Boltzmann equations are required.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1212_1145
  caveats:
  - The primary text states that other reactions are needed outside the band.
  source_reference_ids:
  - src_1212_1145
  notes: This is the central numerical constraint in the primary paper.
- id: q4_xenon100_si_limit
  name: XENON100-era spin-independent direct-detection limit
  constraint_type: direct_detection
  observable_channel: direct_detection
  applies: parameter_dependent
  constrained_parameters:
  - sigma_SI
  - m_X
  - lambda_5
  excluded_regions:
  - The primary text quotes XENON100 as most stringent for m_X > 8 GeV, with a minimum limit around 2.0e-45
    cm^2 at m_X = 55 GeV.
  allowed_regions:
  - The primary text identifies heavy masses above about 165 GeV, very light masses, and a narrow Higgs-resonance
    region near m_h/2 as allowed in its scan.
  benchmark_implications:
  - Modern direct-detection data would be expected to supersede this bound.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: XENON100-era comparison in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: q4_higgs_portal_dominance
    description: Nuclear recoil rates are dominated by Higgs-portal scalar exchange in the implementation
      considered.
    scope: direct_detection
    status: assumed
    impact_if_violated: Additional mediators would change sigma_SI and recast requirements.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1212_1145
  caveats:
  - DAMA, CDMS, EDELWEISS, CoGeNT, CMS and EDELWEISS comparisons are mentioned but not encoded as separate
    likelihoods.
  source_reference_ids:
  - src_1212_1145
  notes: Recorded as historical/source-backed constraint, not as a current exclusion.
- id: q4_vacuum_stability
  name: Bounded-potential and electroweak-vacuum consistency
  constraint_type: theoretical
  observable_channel: scalar potential
  applies: 'yes'
  constrained_parameters:
  - Q4 quartic couplings
  - scalar mass parameters
  excluded_regions:
  - Couplings that make the scalar potential unbounded below or destabilize the electroweak vacuum are
    excluded.
  allowed_regions:
  - Quartic terms must satisfy positivity/minimum conditions summarized in the primary text.
  benchmark_implications:
  - The hidden-sector scalar spectrum is only meaningful in the Q4-preserving vacuum.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: Analytic conditions in the primary paper
  recasting_needed: 'no'
  robustness: medium
  assumptions:
  - id: q4_cp_conservation
    description: The primary phenomenology assumes real scalar-potential couplings.
    scope: theory
    status: assumed
    impact_if_violated: CP phases could change the spectrum and reaction network.
    can_be_relaxed: unknown
    source_reference_ids:
    - src_1212_1145
  caveats:
  - The OCR degrades several scalar field symbols, so exact inequalities require PDF review.
  source_reference_ids:
  - src_1212_1145
  notes: The first-pass model card already flagged symbol degradation; the enrichment keeps this theoretical
    constraint qualitative.
theory_to_observable_routing:
  routes:
  - id: q4_micromegas_relic_and_detection
    description: Implement the Q4 scalar potential in micrOMEGAs/CalcHEP, solve the freeze-out equations,
      and compute direct-detection rates.
    source_model_features:
    - Q4-stabilized scalar sector
    - Higgs-portal annihilation
    - one-component relic limit
    input_parameters:
    - m_X
    - lambda_5
    - hidden scalar masses
    - Q4 quartic couplings
    derived_quantities:
    - Omega h^2
    - annihilation and coannihilation cross sections
    - sigma_SI
    forward_model_chain:
    - step_id: implement_model
      step_type: other
      tool_or_code: CalcHEP/micrOMEGAs model files
      inputs:
      - Q4 scalar potential parameters
      outputs:
      - matrix elements
      validity: Requires exact field definitions from the typeset paper.
      notes: No model-specific files were found in the assigned text.
    - step_id: solve_relic_density
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      inputs:
      - matrix elements
      - masses
      - couplings
      outputs:
      - Omega h^2
      validity: Applies to the one-component thermal history assumed in the primary paper.
      notes: micrOMEGAs2.0 abstract supports generic relic-density and coannihilation calculations.
    - step_id: compute_direct_detection
      step_type: recasting
      tool_or_code: micrOMEGAs direct-detection module
      inputs:
      - lambda_5
      - m_X
      - nucleon matrix elements
      outputs:
      - sigma_SI
      - event-rate inputs
      validity: Requires modern detector response for updated limits.
      notes: micrOMEGAs2.2 abstract supports WIMP-nucleus elastic scattering rate calculation.
    observable_ids:
    - q4_relic_density_band
    - q4_higgs_portal_direct_detection
    constraint_ids:
    - q4_wmap_relic_density
    - q4_xenon100_si_limit
    likelihoods:
    - WMAP relic-density interval
    - XENON100-era exclusion curve
    required_code_resources:
    - micrOMEGAs
    - CalcHEP
    validation_tests:
    - Reproduce the primary m_X-lambda_5 relic-density band.
    route_status: planned
    agent_notes: The route is straightforward in principle but blocked by missing model implementation
      files and OCR-degraded notation.
    caveats:
    - Modern data recast requires updating WMAP/XENON100 inputs.
  - id: q4_discrete_scalar_reaction_network
    description: Track Q4 annihilation, semi-annihilation, dark conversion, and decay channels when hidden
      scalars are near-degenerate.
    source_model_features:
    - non-Abelian discrete scalar stabilization
    - multiple hidden scalar states
    input_parameters:
    - hidden scalar masses
    - Q4 quartic couplings
    - decay-channel availability
    derived_quantities:
    - coupled number densities
    - effective annihilation rate
    forward_model_chain:
    - step_id: enumerate_reactions
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - Q4 charges
      - scalar potential
      outputs:
      - allowed 2-to-2 and semi-annihilation channels
      validity: Requires exact representation assignments.
      notes: Primary paper lists Q4-specific reactions but OCR symbols are degraded.
    - step_id: solve_coupled_boltzmann
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs or custom coupled solver
      inputs:
      - reaction list
      - masses
      - couplings
      outputs:
      - component relic densities
      validity: Needed outside the one-component decay-open limit.
      notes: Related semi-annihilation paper shows such channels can substantially alter relic abundance.
    observable_ids:
    - q4_semiannihilation_and_dark_conversion
    constraint_ids:
    - q4_wmap_relic_density
    likelihoods:
    - relic-density likelihood for multi-component scalar DM
    required_code_resources:
    - micrOMEGAs or custom Boltzmann solver
    validation_tests:
    - Recover the one-component limit when heavier states decay.
    route_status: planned
    agent_notes: Use only after human notation cleanup.
    caveats:
    - The current assigned row should not be silently promoted to a multi-component model.
