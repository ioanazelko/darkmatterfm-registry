  - assumption that S_b is sufficiently heavier so coannihilation is neglected
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: 'no'
  notes: The paper uses an approximate analytic freeze-out solution and identifies a mass window where
    the lightest singlet can match the observed cold dark matter abundance.
