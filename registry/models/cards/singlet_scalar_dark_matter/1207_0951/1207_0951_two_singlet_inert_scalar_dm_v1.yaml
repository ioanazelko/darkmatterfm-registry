validity_domain:
- id: inert_z2_vacuum
  applies_to: model
  condition: S_a and S_b must have vanishing vacuum expectation values so the Z2 parity remains unbroken.
  valid_range: null
  status: assumed
  extrapolation_risk: high
  caveats:
  - If Z2 is broken, the lightest singlet is not stable dark matter.
  source_reference_ids:
  - '1207_0951'
  notes: null
- id: heavy_singlet_freezeout_window
  applies_to: relic density
  condition: Analytic relic estimate and mass window assume S_a is the lightest singlet and S_b is sufficiently
    heavier that coannihilation can be neglected.
  valid_range: m_Sa about 0.7-0.9 TeV and m_Sb about 0.8-1.1 TeV
  status: established
  extrapolation_risk: medium
  caveats:
  - Coannihilation could alter the relic calculation outside this hierarchy.
  source_reference_ids:
  - '1207_0951'
  notes: null
- id: veltman_condition_empirical
  applies_to: theory
  condition: The little-hierarchy solution requires cancellation of the one-loop quadratic divergence
    in the Higgs mass by the new scalar sector.
  valid_range: null
  status: assumed
  extrapolation_risk: medium
  caveats:
  - The paper treats this as an empirical condition from unknown high-scale dynamics.
  source_reference_ids:
  - '1207_0951'
  notes: null
