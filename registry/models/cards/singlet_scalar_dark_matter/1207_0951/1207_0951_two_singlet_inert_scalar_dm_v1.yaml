model_id: 1207_0951_two_singlet_inert_scalar_dm_v1
identity:
  name: Two-singlet inert scalar dark matter model
  family: singlet_scalar_dark_matter
  aliases:
  - simple inert model
  - two real singlet scalar Higgs-portal model
  short_description: A minimal Higgs-portal extension with two Z2-odd real singlet scalars; the lighter
    inert scalar is a cold dark matter candidate and the two-scalar setup is chosen to satisfy both the
    Higgs Veltman condition and the relic-density requirement.
  historical_origin_or_motivation: Motivated by the little hierarchy problem after a roughly 125 GeV Higgs
    signal and by the need for a viable inert-scalar cold dark matter candidate.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Standard Model plus inert scalar singlets
  - Higgs-portal dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff:
    name: new-physics cutoff
    symbol: Lambda
    description: Effective cutoff scale used in the little-hierarchy discussion.
    range: about 5-10
    unit: TeV
    role: core
    status: assumed
    source_reference_ids:
    - '1207_0951'
    notes: The paper discusses LEP/LHC-motivated cutoff scales and illustrates m ~ Lambda/(4 pi).
  embedded_in_larger_framework: unknown
  notes: The paper gives the SM kinetic/Yukawa terms plus a scalar potential for H, S_a, and S_b, and
    treats the Veltman condition as an empirical constraint from unknown dynamics above the cutoff.
particle_content:
  dark_matter_candidate:
    name: lightest inert singlet scalar S_a
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - heavier inert singlet scalar S_b
  mediators:
  - Standard Model Higgs boson h
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles:
  - lightest Z2-odd singlet scalar S_a
  unstable_parent_particles:
  - heavier singlet scalar S_b
  standard_model_extension: minimal
symmetries:
  stabilizing_mechanism: An exact unbroken Z2 symmetry makes S_a and S_b odd while all Standard Model
    fields are even; with vanishing singlet vevs, the lightest singlet is stable.
  symmetries:
  - name: Z2 inert parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the inert vacuum
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - Higgs doublet
  - Standard Model fermions through Higgs exchange
  - W and Z bosons through Higgs exchange
  dark_sector_couplings:
  - quartic scalar couplings among S_a and S_b
  - Higgs-portal quartics (H^dagger H) S_a^2, (H^dagger H) S_b^2, and (H^dagger H) S_a S_b
  mediator_types:
  - Higgs boson
  interaction_operators:
  - (H^dagger H) S_a^2
  - (H^dagger H) S_b^2
  - (H^dagger H) S_a S_b
  - S_a^4, S_b^4, S_a^3 S_b, S_b^3 S_a, S_a^2 S_b^2
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: none
    spin_dependence: spin_independent
  annihilation_channels:
  - S_a S_a to h h through the pointlike portal vertex
  - S_a S_a to Standard Model fermions, W+ W-, and Z Z through Higgs mediation
  decay_channels:
  - S_b to S_a h h is assumed to dominate in the relic-density estimate
  self_scattering_channels:
  - S_i S_j scalar scattering through quartic terms
  cp_structure: unknown
  flavor_structure: flavor universal through Higgs portal in the paper treatment
  tree_or_loop_level: tree
parameters:
  core:
  - name: lightest singlet scalar mass
    symbol: m_Sa
    description: Mass of the stable inert scalar dark matter candidate.
    range: 0.7 to 0.9
    unit: TeV
    role: core
    status: established
    source_reference_ids:
    - '1207_0951'
    notes: Approximate allowed region quoted after imposing relic density and Higgs-mass naturalness requirements.
  - name: heavier singlet scalar mass
    symbol: m_Sb
    description: Mass of the second inert scalar needed for the viable two-singlet solution.
    range: 0.8 to 1.1
    unit: TeV
    role: core
    status: established
    source_reference_ids:
    - '1207_0951'
    notes: Approximate allowed region with S_b heavier than S_a and coannihilation neglected.
  - name: Higgs-portal coupling sum
    symbol: lambda_3a + lambda_3b
    description: Sum of portal quartics fixed by the Veltman-condition relation in the paper.
    value: about 4.1
    role: core
    status: established
    source_reference_ids:
    - '1207_0951'
    notes: The text states the sum is large but within the perturbative regime.
  - name: freeze-out ratio
    symbol: m_Sa/T_f
    description: Ratio used in the analytic thermal relic estimate.
    value: about 26
    role: derived
    status: assumed
    source_reference_ids:
    - '1207_0951'
  - name: observed dark matter abundance target
    symbol: Omega_DM h^2
    description: Relic abundance target used to select the allowed mass region.
    value: 0.112 +/- 0.006
    role: cosmological
    status: established
    source_reference_ids:
    - '1207_0951'
production:
  mechanisms:
  - thermal freeze-out of S_a through Higgs-portal annihilation
  thermal_equilibrium_with_standard_model: 'yes'
  thermal_equilibrium_with_hidden_sector: not_applicable
  abundance_set_by:
  - S_a S_a annihilation cross section dominated by the S_a S_a h h vertex in the heavy-S_a regime
