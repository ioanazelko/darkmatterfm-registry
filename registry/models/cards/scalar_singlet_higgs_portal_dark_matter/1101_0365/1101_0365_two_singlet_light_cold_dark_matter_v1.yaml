identity:
  name: Two-singlet light cold dark matter model
  family: scalar_singlet_higgs_portal_dark_matter
  aliases:
  - Two-Singlet Model for Light Cold Dark Matter
  short_description: A Standard Model extension with two real gauge-singlet scalar fields, where stable
    S_0 is the light cold dark matter WIMP and a second singlet S_1 mixes with the Higgs after spontaneous
    Z_2 breaking to open additional annihilation channels.
  historical_origin_or_motivation: Designed to allow lighter scalar WIMP dark matter than the minimal
    one-real-singlet Higgs-portal model by adding an auxiliary broken-Z_2 singlet that increases annihilation.
  status: speculative
  model_kind: complete_theory
theory:
