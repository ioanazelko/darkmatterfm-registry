  parent_frameworks:
  - Standard Model scalar singlet extension
  - Higgs portal
  lagrangian_available: true
  renormalizable: true
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives a renormalizable scalar potential for S_0, the Higgs field, and the auxiliary
    singlet chi_1, then rotates h and S_1 to physical mass eigenstates.
