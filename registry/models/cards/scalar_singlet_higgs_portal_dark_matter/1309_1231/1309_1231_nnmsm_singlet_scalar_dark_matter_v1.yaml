  aliases:
  - NNMSM scalar singlet dark matter
  - S singlet dark matter in the NNMSM
  short_description: A renormalizable extension of the new minimal Standard Model in which a Z2-odd real
    gauge-singlet scalar S is the dark matter candidate, embedded with right-handed neutrinos, an inflaton,
    a small cosmological constant, adjoint fermions, and vector-like lepton doublets to support gauge
    coupling unification.
  historical_origin_or_motivation: Motivated by explaining dark matter, neutrino masses, baryon asymmetry,
    inflation, dark energy, and gauge coupling unification without low-energy supersymmetry.
  status: speculative
  model_kind: complete_theory
