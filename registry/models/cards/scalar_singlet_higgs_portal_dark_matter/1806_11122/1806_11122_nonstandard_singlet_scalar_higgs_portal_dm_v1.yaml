    - sigma_SI_eff
    - BR(h->SS)
    description: Map scalar-singlet Higgs-portal parameters through a pre-BBN expansion history to relic
      density, direct detection, and invisible-Higgs observables.
    forward_model_chain:
    - inputs:
      - w
      - F
      - T_end
      notes: Solve coupled rho_phi/rho_R equations.
      outputs:
