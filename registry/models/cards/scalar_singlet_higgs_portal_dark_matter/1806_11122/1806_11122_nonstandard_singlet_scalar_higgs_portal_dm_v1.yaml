      tool_or_code: null
      validity: Valid for the phenomenological non-standard histories defined in the primary paper.
    - inputs:
      - M_S
      - lambda_HS
      - H(T)
      notes: Primary paper numerically solves the scalar number-density equation.
      outputs:
      - Omega_S h^2
      step_id: solve_scalar_abundance
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Separate freeze-out and freeze-in regimes require checking thermalization threshold.
    - inputs:
      - lambda_HS
      - M_S
      - Omega_S/Omega_DM
      notes: Compare to direct-detection and invisible-Higgs limits.
      outputs:
      - sigma_SI_eff
      - BR_inv
      step_id: project_searches
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses tree-level Higgs exchange and h -> SS width.
