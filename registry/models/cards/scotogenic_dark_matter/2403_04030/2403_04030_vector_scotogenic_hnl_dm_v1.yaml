identity:
  name: Vector Scotogenic HNL dark matter
  family: scotogenic_dark_matter
  aliases:
  - Vector Scotogenic Model fermion dark matter
  - left-handed HNL dark matter
  short_description: A dark-matter phenomenology study of the Vector Scotogenic Model in the simplified
    scenario where a left-handed Heavy Neutral Lepton is the stable dark matter candidate and a massive
    electroweak vector doublet mediates annihilation and coannihilation.
  historical_origin_or_motivation: Connects dark matter phenomenology with the scotogenic idea of radiative
    neutrino-mass generation, using a spin-1 electroweak doublet variant.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Vector Scotogenic Model
  - scotogenic paradigm
  - Vector Doublet Dark Matter Model extension
  lagrangian_available: 'yes'
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes vector-doublet and HNL Lagrangian terms, but treats a simplified degenerate-vector
    spectrum and notes perturbative unitarity considerations for the vector sector.
particle_content:
  dark_matter_candidate:
    name: left-handed Heavy Neutral Lepton N_L
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - massive SU(2)_L vector doublet V_mu with charged and neutral components
  mediators:
  - charged and neutral components of the massive vector doublet
  dark_radiation_species: []
  excited_or_degenerate_states:
  - degenerate vector states V^+, V^1, V^2 in the simplified setup
  long_lived_particles: []
  unstable_parent_particles:
  - heavier vector-doublet components can decay to the HNL and SM leptons
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A Z2 parity makes the new particles odd and all SM particles even, stabilizing
    the dark sector; in the simplified scenario N_L is the lightest odd state.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not discussed
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - neutrino
  - vector
  standard_model_targets:
  - SM lepton doublets
  - charged leptons
  - electroweak gauge fields through the vector doublet
  dark_sector_couplings:
  - lambda_k L_k tilde V_mu N_L Yukawa-like interaction
  - electroweak interactions of the vector doublet
  - Higgs-vector quartic combination lambda_L
  mediator_types:
  - massive electroweak vector doublet
  interaction_operators:
  - lambda_k L_k tilde V_mu N_L + h.c.
  - nonminimal vector-gauge interactions parameterized by lambda_1 and kappa
  annihilation_channels:
  - N_L N_L to charged leptons
  - N_L V to SM states
  - V V to SM states
  decay_channels:
  - vector-doublet states to N_L plus SM leptons when kinematically allowed
  self_scattering_channels: []
  tree_or_loop_level: tree
parameters:
  core:
  - name: HNL mass
    symbol: M_N
    description: Mass of the left-handed Heavy Neutral Lepton dark matter candidate.
    range: M_N < M_V in the simplified HNL dark matter scenario
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: Paper assumes N_L is lighter than the vector states.
  - name: degenerate vector-doublet mass
    symbol: M_V
    description: Common mass for V^+, V^1, and V^2 in the simplified scan.
    value: 200 GeV and 800 GeV benchmark regimes
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: Paper labels these as low-mass and high-mass regimes.
  - name: lepton-flavor couplings
    symbol: lambda_e, lambda_mu, lambda_tau
    description: Couplings of the HNL and vector doublet to SM lepton doublets.
    range: scanned; relic abundance falls with the squared sum of couplings
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: The paper also studies one-family dominated coupling patterns.
  - name: vector-Higgs quartic combination
    symbol: lambda_L
    description: Combination lambda_2 + lambda_3 + lambda_4 used for vector-doublet interactions.
    value: 5
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: Control value used in the scan.
  - name: nonminimal gauge parameter
    symbol: lambda_1
    description: Nonminimal vector-gauge interaction parameter.
    value: 0
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: Control value used in the scan.
  - name: nonminimal magnetic-moment parameter
    symbol: kappa
    description: Vector-doublet nonminimal gauge interaction parameter.
    value: -1
    role: core
    status: inferred
    source_reference_ids:
    - '2403_04030'
    notes: Control value used in the scan.
production:
  mechanisms:
  - thermal freeze-out of HNL pairs
  - coannihilation involving one HNL and one vector state
  - annihilation of vector-doublet states
  - freeze-in from vector decay in a separated-mass regime discussed by the paper
  thermal_equilibrium_with_standard_model: partial
  thermal_equilibrium_with_hidden_sector: partial
  abundance_set_by:
  - relative mass splitting between N_L and vector states
  - lepton-flavor couplings lambda_k
  - vector annihilation and coannihilation rates
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: unknown
  notes: The paper emphasizes that coannihilations are essential and separate the parameter space into
    regimes with different phenomenology.
