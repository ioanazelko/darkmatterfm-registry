validity_domain:
- id: residual_u_parity
  applies_to: model
  condition: The S vacuum expectation value must leave a residual Z2 U parity with X odd and Standard
    Model fields even.
  valid_range: null
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Different charge assignments or vevs can change the residual symmetry.
  source_reference_ids:
  - primary
  notes: null
- id: simplified_zero_higgs_charge_limit
  applies_to: model
  condition: The numerical relic-density and direct-detection examples take z[H1]=z[H2]=0, decoupling
    the singlet and Z'ino/singlino sectors from MSSM neutralinos.
  valid_range: z[H1]=z[H2]=0 in the worked examples
  status: assumed
  extrapolation_risk: high
  caveats:
  - The paper says the more general setup with nonzero Higgs charges is deferred to later work.
  source_reference_ids:
  - primary
  notes: null
- id: triangle_stability
  applies_to: model
  condition: Three stable massive particles occur only when the lightest states of the three odd parity
    classes satisfy the triangle mass inequalities.
  valid_range: M_B0 < M_C0 + M_D0 and cyclic permutations
  status: inferred
  extrapolation_risk: medium
  caveats:
  - If the inequalities fail, fewer than three stable components remain.
  source_reference_ids:
  - primary
  notes: null
