identity:
  name: U(1)' U-parity multiple dark matter
  family: supersymmetric_multi_component_dark_matter
  aliases:
  - UMSSM U parity dark matter
  - LSP plus LUP dark matter
  - multiple dark matters in U(1)' extended MSSM
  short_description: A U(1)' extended MSSM scenario in which residual U parity from broken U(1)' stabilizes
    a Standard-Model-singlet exotic LUP, while R parity stabilizes the usual LSP, allowing two or kinematically
    up to three stable massive dark-matter components.
  historical_origin_or_motivation: Motivated by solving MSSM mu/proton-decay issues with a U(1)' extension
    while enlarging supersymmetric dark matter beyond a single neutralino LSP.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - U(1)' extended MSSM
  - R-parity conserving supersymmetry
  - residual discrete gauge symmetry
  lagrangian_available: partial
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives a superpotential, charge assignments, and relevant Lagrangian terms for a simplified
    UMSSM limit, while leaving the full anomaly-cancelling exotic spectrum open.
particle_content:
  dark_matter_candidate:
    name: R-parity LSP plus U-parity LUP stable particles
    spin: 1/2 for the neutralino LSP; 0 or 1/2 for the LUP component depending on the X superfield spectrum
    statistics: unknown
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - SM-singlet exotic superfield X
  - Higgs singlet S
  - Z' gauge boson
  - Z'ino and singlino neutralino states
  - right-handed Dirac neutrinos
  mediators:
  - Z' gauge boson
  - Higgs singlet S
  - MSSM Higgs bosons for neutralino scattering
  dark_radiation_species: []
  excited_or_degenerate_states:
  - scalar and fermion components of the X superfield
  - possible third stable parity class when the triangle mass relation holds
  long_lived_particles:
  - lightest supersymmetric particle
  - lightest U parity particle
  - kinematically stable third component if present
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: R parity stabilizes the LSP and residual U parity stabilizes the lightest U-parity-odd
    particle; with both parities, a third parity class can be stable when its two-body decay is kinematically
    closed.
  symmetries:
  - name: R parity
    type: discrete
    exact_or_approximate: unknown
    breaking: not specified
    breaking_scale: null
  - name: U parity
    type: discrete
    exact_or_approximate: exact
    breaking: residual Z2 preserved after U(1)' breaking by the S vev
    breaking_scale: null
  - name: U(1)'
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the Higgs singlet S
    breaking_scale: null
  topological_defects_possible: unknown
