parameters:
  core:
  - description: Mass scale for freeze-out and baryogenesis; the paper quotes a unitarity upper limit
      for WIMP baryogenesis and uses TeV-scale benchmarks.
    name: WIMP mass
    range: above the electroweak sphaleron scale and below about 340 TeV; kinematically 2 m_chi > m_Psi
    role: core
    status: inferred
    symbol: m_chi
    unit: GeV
  - description: Mass of the exotic annihilation product; must allow Boltzmann-suppressed washout and
      satisfy LHC lower bounds.
    name: heavy vector-like quark mass
    range: m_Psi > m_psi2 > 0.8 TeV and m_Psi < 2 m_chi
    role: core
    status: inferred
    symbol: m_Psi
    unit: GeV
  - description: Intermediate heavy quark receiving the stored asymmetry and decaying after sphaleron
      freeze-out.
    name: second vector-like quark mass
    range: above about 0.8 TeV and below m_Psi
    role: core
    status: inferred
    symbol: m_psi2
    unit: GeV
  - description: Singlet mediator masses for CP-violating WIMP annihilation.
    name: pseudoscalar mediator masses
    range: one benchmark uses 20 and 22 TeV; another uses lower masses with broad-resonance care
    role: core
    status: inferred
    symbol: m_S1,m_S2
    unit: GeV
  - description: Small coupling controlling psi2 decay to Higgs and quark after sphaleron freeze-out.
    name: late decay Yukawa coupling
    range: of order 1e-7 or smaller for delayed decay
    role: core
    status: inferred
    symbol: lambda_psi2
  - description: Temperature used to freeze the lepton asymmetry before heavy-field decays complete.
    name: sphaleron freeze-out temperature
    role: cosmological
    status: inferred
    symbol: T_sfo
    unit: GeV
    value: T_c/1.7 with T_c about 140 GeV
