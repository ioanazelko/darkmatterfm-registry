  long_lived_particles: []
  unstable_parent_particles:
  - H decays through H -> H_prime eta
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: X is stabilized by a Z2 symmetry; a Z4 variant is mentioned when operator charge
    assignments require H to be protected from Standard Model decays.
  symmetries:
  - name: Z2 dark matter parity
    type: discrete
    exact_or_approximate: exact
    breaking: not specified
    breaking_scale: null
  - name: possible Z4 stabilizing symmetry
    type: discrete
    exact_or_approximate: unknown
    breaking: needed only for some SU(2)_L-respecting operator assignments
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  standard_model_targets:
  - Standard Model lepton L
  - electroweak sphalerons transfer the lepton asymmetry to baryon number
  dark_sector_couplings:
  - dimension-six XXHL operators with CP-even and CP-odd terms
  - CP-invariant decay operator for H -> H_prime eta
  mediator_types:
  - effective contact operator
  - unstable exotic fermion final state
  interaction_operators:
  - four-point operators formed from a dark matter bilinear and an H-L final-state bilinear
  - O_H = g eta^* H_prime P_L H + h.c.
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - X X -> H L and CP conjugate final states
  - X X -> H_prime eta L through an on-shell H contribution
  decay_channels:
  - H -> H_prime eta
  self_scattering_channels: []
  cp_structure: CP violation from interference of tree-level effective operators; absorptive H-width terms
    supply the needed relative phase.
  flavor_structure: single Standard Model lepton generation assumed with equal asymmetry across generations
  tree_or_loop_level: both
