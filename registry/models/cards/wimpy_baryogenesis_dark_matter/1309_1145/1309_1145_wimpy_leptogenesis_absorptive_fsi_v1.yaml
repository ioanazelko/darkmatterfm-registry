identity:
  name: WIMPy leptogenesis with absorptive final-state interactions
  family: wimpy_baryogenesis_dark_matter
  aliases:
  - absorptive WIMPy leptogenesis
  - EFT WIMPy leptogenesis
  short_description: An effective dark matter model in which a Z2-stabilized WIMP X annihilates through
    dimension-six operators to a lepton and exotic fermion, generating a lepton asymmetry through absorptive
    final-state interactions while retaining WIMP freeze-out logic.
  historical_origin_or_motivation: Motivated by linking the dark matter relic abundance and the baryon
    asymmetry through dark matter annihilation, while avoiding dangerous tree-level washout operators
    found in earlier WIMPy baryogenesis models.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - WIMPy baryogenesis
