    symbol: M_*
    description: Scale suppressing the four-point annihilation operators.
    value: 10 TeV benchmark
    unit: TeV
    role: core
    status: assumed
    source_reference_ids:
    - '1309_1145'
  embedded_in_larger_framework: unknown
  notes: The paper deliberately does not specify the high-energy Lagrangian and treats the annihilation
    vertices as effective operators.
particle_content:
  dark_matter_candidate:
    name: X
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - exotic fermion H
  - fermion H_prime
  - light scalar eta in H decay
  mediators:
  - effective heavy mediator integrated out of dimension-six operators
  - unstable exotic fermion H in final-state propagator
  dark_radiation_species: []
