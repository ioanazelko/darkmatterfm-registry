    wave-like or condensate dark matter fluid generate Mpc-scale spin of cosmic filaments.
  historical_origin_or_motivation: Motivated by observed cosmic filament spin and by the possibility that
    ultra-light dark matter, fuzzy dark matter, and condensate models support localized vortices even
    when the large-scale fluid is otherwise irrotational.
