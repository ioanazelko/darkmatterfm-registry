validity_domain:
- id: vortices_in_filaments
  applies_to: model
  condition: Requires ultra-light or condensate dark matter to support vortices aligned with or distributed
    along cosmic filaments.
  valid_range: null
  status: assumed
  extrapolation_risk: medium
  caveats:
  - The paper is agnostic about the microscopic formation mechanism and calls for simulations.
  source_reference_ids:
  - '2111_03061'
  notes: The model is meant as an observable-signature parameterization of vortices.
- id: dilute_vortex_gas
  applies_to: model
  condition: The vortex area N_V r_V^2 should be much smaller than the filament-core area R^2 so vortex-vortex
    interactions can be neglected.
  valid_range: For m = 10^-22 eV and R of order Mpc, the paper estimates the required N_V about 3000 is
    below the dilute upper scale.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - Vortex-vortex collisions, reconnections, and interactions are neglected.
  source_reference_ids:
  - '2111_03061'
  notes: The appendix derives a related bound involving self-interaction coupling and N_V.
- id: gaussian_average_velocity
  applies_to: phenomenological_parameterization
  condition: The collection of vortices is approximated by an averaged tangential velocity field for a
    Gaussian distribution around the filament axis.
  valid_range: R approximately 0.51 Mpc and N_V/m approximately 2.9e25 eV^-1 in the reported fit.
  status: approximate
  extrapolation_risk: medium
  caveats:
  - A bimodal distribution is introduced to capture asymmetry in the data.
  source_reference_ids:
  - '2111_03061'
  notes: This is a fitting ansatz rather than a first-principles prediction.
