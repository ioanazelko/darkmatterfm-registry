  - mass splitting and small dark matter coupling
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: 'yes'
  nonthermal_momentum_distribution: 'no'
  notes: The dark-matter benchmarks choose mass splitting and lifetime so that the observed relic abundance
    is obtained within LHC-reachable lifetimes.
