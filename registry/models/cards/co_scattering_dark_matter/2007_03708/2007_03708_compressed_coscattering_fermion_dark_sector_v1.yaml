identity:
  name: Compressed co-scattering fermion dark sector benchmark
  family: co_scattering_dark_matter
  aliases:
  - compressed hidden-sector co-scattering dark matter
  - singlet-triplet compressed dark sector
  - soft displaced lepton dark matter benchmark
  short_description: A weak-scale compressed dark sector with a stable neutral fermion dark matter state
    and charged dark partners whose soft displaced decays are tied to co-scattering or co-annihilation
    freeze-out.
  historical_origin_or_motivation: Motivated by feebly interacting dark matter scenarios where the observed
    relic abundance is set by co-annihilation or co-scattering with a nearly degenerate charged partner,
    producing soft displaced leptons at the LHC.
  status: benchmark
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - compressed hidden sector
  - co-scattering dark matter
  - co-annihilating dark matter
  - bino-wino-like scenario with decoupled higgsinos
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper describes a singlet plus vector-like electroweak triplet fermion dark sector and uses
    it to define soft-displaced-lepton benchmarks; details of the underlying model are referred to an
    earlier work.
particle_content:
  dark_matter_candidate:
    name: chi0, the lightest neutral mass eigenstate
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - charged dark partners chi+ and chi-
  - heavier neutral state chi_h0
  mediators:
  - off-shell W boson in charged-partner decays
  - electroweak gauge bosons in production
  - Higgs field inducing neutral mixing
  dark_radiation_species: []
  excited_or_degenerate_states:
  - nearly degenerate charged partner with mass m_c
  - heavier neutral state chi_h0
  long_lived_particles:
  - charged dark partner chi+/-
  unstable_parent_particles:
  - charged dark partner chi+/-
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The lightest neutral mass eigenstate chi0 is taken to be stable; the paper does
    not name the stabilizing symmetry.
  symmetries: []
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - electroweak gauge bosons
  - Higgs field
  - charged leptons
  - hadrons
  dark_sector_couplings:
  - singlet-triplet neutral mixing through an effective scalar interaction with the Higgs field
  - small dark matter coupling to the charged partner controlling co-scattering and partner lifetime
  mediator_types:
  - charged dark partner
  - off-shell W boson
  - Z/gamma electroweak production channel
  interaction_operators: []
  scattering:
    elastic: unknown
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - charged partner annihilation after co-scattering
  - co-annihilation of chi0 with chi+/-
  decay_channels:
  - chi+ -> chi0 W* -> chi0 lepton neutrino
  - chi+ -> chi0 hadrons through weak interactions
  - possible chi+ -> chi_h0 pi+ for small mixing
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: weak decays with leptonic and hadronic branching ratios; later signal benchmarks can
    assume electron and muon modes
  tree_or_loop_level: tree
parameters:
  core:
  - name: charged dark partner mass
    symbol: m_c
    description: Mass of the electroweakly charged partner that controls the LHC production rate.
    range: 100-500 GeV explored, with 220 GeV and 324 GeV benchmarks mentioned
    unit: GeV
    scale: linear
    role: core
    status: established
  - name: dark matter mass
    symbol: m_0
    description: Mass of the stable neutral state chi0.
    range: model-dependent; compressed with m_c
    unit: GeV
    scale: linear
    role: core
    status: inferred
  - name: mass splitting
    symbol: Delta m = m_c - m_0
    description: Compressed splitting between charged partner and neutral dark matter.
    fiducial_value: 20 GeV in key soft-lepton benchmarks
    range: typically about 10-40 GeV for weak-scale co-annihilation or co-scattering in the paper discussion
    unit: GeV
    scale: linear
    role: core
    status: established
  - name: dark matter coupling to bath/partner
    symbol: g_chi
    description: Small coupling controlling pair annihilation, co-annihilation, co-scattering, and the
      charged-partner lifetime.
    range: 10^-3 > g_chi > 10^-8 for weak-scale co-annihilation or co-scattering freeze-out
    scale: log
    role: core
    status: established
  - name: nominal charged-partner decay length
    symbol: c tau
    description: Proper decay length of the charged dark partner.
    fiducial_value: 1 cm for a reference weak-scale co-scattering point
    range: about 1 mm to a few meters in scenarios discussed for LHC reach
    unit: length
    scale: log
    role: derived
    status: established
  nuisance: []
  derived:
  - name: charged-partner pair-production cross section
    symbol: sigma(pp -> chi+ chi-)
    description: Electroweak production rate; paper rescales simulations to NLO+NLL wino-like chargino
      cross sections.
    range: 903 fb at m_c = 220 GeV and 127.7 fb at m_c = 324 GeV quoted for 13 TeV
    unit: fb
    scale: log
    role: derived
    status: established
production:
