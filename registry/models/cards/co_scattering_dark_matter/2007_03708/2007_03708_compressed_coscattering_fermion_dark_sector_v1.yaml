validity_domain:
- id: compressed_spectrum
  applies_to: model
  condition: Requires a small mass splitting so the charged partner remains abundant around freeze-out
    and decays to soft visible particles.
  status: established
  valid_range: Delta m about 10-40 GeV in the weak-scale discussion; examples use 20 GeV and 40 GeV
  extrapolation_risk: medium
  caveats:
  - Larger splittings give harder leptons and move away from the soft-displaced-lepton target.
  source_reference_ids:
  - paper
- id: small_dark_matter_coupling
  applies_to: model
  condition: Co-scattering and long charged-partner lifetimes require small dark matter coupling to the
    partner and bath.
  status: established
  valid_range: 10^-3 > g_chi > 10^-8 quoted for weak-scale co-annihilation/co-scattering
  extrapolation_risk: medium
  caveats:
  - At even smaller couplings a different production mechanism is needed.
  source_reference_ids:
  - paper
