identity:
  name: Flavoured Majorana dark matter in Dark Minimal Flavour Violation
  family: flavoured_dark_matter
  aliases:
  - Majorana DMFV model
  - flavoured Majorana dark matter with scalar mediator
  short_description: A simplified DMFV model with a Majorana dark-matter flavour triplet, a colored scalar
    mediator, and a complex coupling matrix to right-handed up-type quarks as the only new source of flavour
    and CP violation.
  historical_origin_or_motivation: The paper extends prior Dirac DMFV simplified models by realizing the
    dark flavour triplet as Majorana fermions transforming under O(3), changing relic, flavour, collider,
    and direct-detection phenomenology.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Dark Minimal Flavour Violation
  - flavoured dark matter
  - WIMP dark matter
  - Majorana fermion dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper presents the simplified Lagrangian, DMFV flavour structure, mass splitting, relic-density
    formulae, and collider/flavour/direct-detection phenomenology for the Majorana case.
particle_content:
  dark_matter_candidate:
    name: lightest Majorana dark flavour state chi_3
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - heavier Majorana dark flavour states chi_1 and chi_2
  mediators:
  - colored scalar mediator phi coupling chi_j to right-handed up-type quarks
  dark_radiation_species: []
  excited_or_degenerate_states:
  - dark flavour triplet components with DMFV-induced mass splittings
  long_lived_particles: []
  unstable_parent_particles:
  - colored scalar mediator phi
  - heavier dark flavours that decay to the lightest state
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A Z_2 symmetry charges only the new particles chi and phi, forbidding decay to
    only SM particles; the lightest dark flavour is stable when m_chi < m_phi.
  symmetries:
  - name: Z_2
    type: discrete
    exact_or_approximate: exact
    breaking: Unbroken in the simplified model.
    breaking_scale: null
  - name: O(3)_chi dark flavour symmetry
    type: global
    exact_or_approximate: broken
    breaking: Broken only by the DM-quark coupling matrix under the DMFV ansatz.
    breaking_scale: null
  - name: SM quark flavour symmetry extended by DMFV
    type: global
    exact_or_approximate: broken
    breaking: Broken by SM Yukawa couplings and the new lambda coupling matrix.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  - higgs
  standard_model_targets:
  - right-handed up quark
  - right-handed charm quark
  - right-handed top quark
  - SM Higgs doublet
  dark_sector_couplings:
  - complex 3x3 coupling matrix lambda between chi_j, u_Ri, and phi
  - Higgs-portal quartic lambda_H phi^dagger phi H^dagger H, neglected in most of the analysis
  - scalar self-coupling lambda_phi
  mediator_types:
  - colored scalar boson phi
  interaction_operators:
  - lambda_ij u_Ri chi_j phi + h.c.
  - lambda_H phi^dagger phi H^dagger H
  - lambda_phi (phi^dagger phi)^2
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: both
  annihilation_channels:
  - chi_i chi_j annihilation to up-type quark pairs through t- and u-channel phi exchange
  - top final states when kinematically allowed
  decay_channels: []
  self_scattering_channels: []
  cp_structure: The complex lambda matrix supplies a new CP-violating source in the DMFV framework.
  flavor_structure: The lambda matrix is the only new source of flavour and CP violation beyond SM Yukawa
    couplings; it is parametrized by mixing angles, phases, and positive diagonal D_i entries.
  tree_or_loop_level: both
parameters:
  core:
  - name: lightest dark fermion mass
    symbol: m_chi3
    description: Mass of the third and lightest dark generation arranged after diagonalizing the Majorana
      mass matrix.
    range: m_chi3 < m_phi; numerical scans consider weak-scale to TeV-scale masses
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2109_10357'
  - name: colored scalar mediator mass
    symbol: m_phi
    description: Mass of the scalar mediator carrying color and hypercharge.
    range: weak-scale to TeV-scale scan parameter; must exceed m_chi for stable chi dark matter
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2109_10357'
  - name: DM-quark coupling matrix
    symbol: lambda
    description: General complex 3x3 coupling between the dark flavour triplet, right-handed up-type quarks,
      and phi; sole new source of flavour and CP violation in DMFV.
    range: '15 physical parameters after flavour rotations: theta_ij, phi_ij, delta_ij, phases phi_i,
      and positive D_i'
    role: core
    status: inferred
    source_reference_ids:
    - '2109_10357'
  - name: positive diagonal lambda parameters
    symbol: D_i
    description: Positive diagonal entries in the coupling parametrization; the numerical analysis restricts
      D_i values and often uses an upper value around 2.
    range: D_i > 0; analysis examples use D_i up to 2
    role: core
    status: assumed
    source_reference_ids:
    - '2109_10357'
  - name: DMFV mass-correction coefficient
    symbol: eta
    description: Expansion parameter controlling lambda-induced Majorana dark-flavour mass splittings;
      chosen negative so corrections reduce the mass relative to m_chi.
    range: eta < 0
    role: core
    status: assumed
    source_reference_ids:
    - '2109_10357'
  - name: thermal relic annihilation target
    symbol: <sigma v>
    description: Effective annihilation cross section used in the relic-abundance analysis for single-particle
      freeze-out.
    value: '2.2e-26'
    unit: cm^3/s
    role: derived
    status: assumed
    source_reference_ids:
    - '2109_10357'
  nuisance:
  - name: top quark mass
    symbol: m_t
    description: Top mass used in the relic abundance calculation.
    value: 173.5
    unit: GeV
    role: nuisance
    status: assumed
    source_reference_ids:
    - '2109_10357'
  - name: Higgs portal coupling to phi
    symbol: lambda_H
    description: Quartic coupling of phi to the SM Higgs; noted as loop-relevant but neglected in the
      main analysis.
    range: neglected in the paper analysis
    role: nuisance
    status: assumed
    source_reference_ids:
    - '2109_10357'
