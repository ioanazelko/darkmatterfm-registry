symmetries:
  stabilizing_mechanism: A residual Z3 symmetry associated with the DMFV flavour structure prevents decays
    of the lightest new state to pure SM final states.
  symmetries:
  - name: U(3)_chi dark flavour symmetry
    type: global
    exact_or_approximate: broken
    breaking: Broken only by the quark-DM coupling matrix in the DMFV ansatz.
