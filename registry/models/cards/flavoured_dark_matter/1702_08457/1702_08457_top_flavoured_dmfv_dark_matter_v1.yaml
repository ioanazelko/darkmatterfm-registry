    source in DMFV.
  flavor_structure: Couplings to right-handed up-type quarks with top-flavoured DM phenomenologically
    preferred.
  tree_or_loop_level: both
parameters:
  core:
  - name: dark flavour mass parameter
    symbol: m_chi
    description: Tree-level mass common to the dark flavour triplet before DMFV mass corrections.
    range: O(100 GeV) WIMP masses are emphasized; scans include masses below and above the top threshold.
    unit: GeV
    role: core
    status: inferred
  - name: scalar mediator mass
    symbol: m_phi
    description: Mass of the coloured scalar mediator.
    range: Collider-motivated examples use several hundred GeV to TeV mediator masses; 850 GeV appears
      in relic/direct-detection examples.
    unit: GeV
    role: core
    status: inferred
  - name: quark-DM coupling eigenvalues
    symbol: D_lambda,ii
    description: Positive diagonal entries of the DMFV coupling matrix.
    range: 0 to 4 in scans, with collider benchmarks imposing smaller values such as below about 2.
    role: core
    status: established
  - name: DMFV flavour mixing angles
    symbol: theta_ij
    description: Angles in the unitary matrix multiplying D_lambda.
    range: 0 to pi/2 in scans.
    role: core
    status: established
  - name: dark-sector mass-splitting coefficient
    symbol: eta
    description: Free parameter controlling radiative/UV mass splitting among dark flavours.
    range: chosen negative in the top-flavoured analysis; SFF examples use eta about -0.075.
    role: core
    status: assumed
  nuisance: []
  derived:
  - name: thermal effective annihilation cross section
    symbol: <sigma v>_eff
    description: Effective cross section required for the relic abundance in the freeze-out calculation.
    value: 2.2 x 10^-26
    unit: cm^3/s
    role: derived
    status: assumed
