validity_domain:
- id: top_flavoured_regime
  applies_to: model
  condition: The lightest dark flavour is the one coupled primarily to the top quark.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Other flavour assignments are not the focus of the paper.
- id: thermal_freezeout_target
  applies_to: model
  condition: The relic abundance calculation assumes a thermal WIMP freeze-out history and that this species
    accounts for the observed DM abundance.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Additional stable dark flavours would relax the target cross section.
- id: direct_detection_cancellation
  applies_to: parameter
  condition: Viable direct detection regions require destructive interference among tree, box, photon-penguin,
    and Z-penguin contributions.
  status: inferred
  extrapolation_risk: high
  caveats:
  - This is a tuned region and depends on xenon isotope composition.
assumptions:
  global:
  - id: dmfv_only_new_flavour_source
    description: The quark-DM coupling matrix is assumed to be the only new source of flavour and CP violation
      beyond the SM.
    scope: theory
    status: assumed
    can_be_relaxed: unknown
  - id: lightest_flavour_is_dm
    description: The lightest member of the dark-flavour triplet is stable and constitutes the observed
      dark matter.
    scope: global
    status: assumed
    can_be_relaxed: unknown
  - id: mediator_heavier_than_dm
    description: The coloured scalar mediator is taken heavier than the fermionic dark matter to avoid
      stable coloured particles.
    scope: theory
    status: assumed
    can_be_relaxed: unknown
