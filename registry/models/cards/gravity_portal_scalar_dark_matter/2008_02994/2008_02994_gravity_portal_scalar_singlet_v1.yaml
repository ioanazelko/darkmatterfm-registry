    through gravity-portal interactions.
  historical_origin_or_motivation: Motivated by gravitational evidence for dark matter and by lepton excesses
    in cosmic-ray data; the model assumes dark matter couples to visible fields only through nonminimal
    gravitational operators plus a leptophilic scalar mediator.
