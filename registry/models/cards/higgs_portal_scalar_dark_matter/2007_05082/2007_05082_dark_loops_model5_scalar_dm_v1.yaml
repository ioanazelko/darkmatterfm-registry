identity:
  name: Dark-loops model-5 scalar dark matter
  family: higgs_portal_scalar_dark_matter
  aliases:
  - Z2-odd singlet-scalar S model
  - dark loops scalar S dark matter
  short_description: A Z2-odd extension with an SU(2)L doublet vector-like fermion and two scalar singlets,
    where the CP-even scalar S is the dark matter candidate and freeze-out proceeds through Higgs mediation,
    leptonic annihilation, and possible coannihilation.
  historical_origin_or_motivation: Built to connect B-decay anomalies, the muon g-2 anomaly, and a viable
    dark matter candidate.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
