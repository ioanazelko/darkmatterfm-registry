  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the Yukawa terms and scalar potential for the selected model 5.
particle_content:
  dark_matter_candidate:
    name: CP-even singlet scalar S
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - CP-odd scalar A
  - SU(2)L vector-like fermion doublet chi=(chi0, chi-)
  - colored scalar phi_q
  - neutral scalar phi_l before decomposition
  mediators:
  - SM Higgs h
  - charged and neutral vector-like fermions
  - colored scalar phi_q
  dark_radiation_species: []
  excited_or_degenerate_states:
  - CP-odd scalar A can coannihilate with S when the mass splitting is small
  long_lived_particles: []
  unstable_parent_particles:
  - phi_q
  - vector-like fermion doublet components
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: All new fields are odd under a new Z2 while Standard Model fields are even; the
    lightest neutral Z2-odd state is stable.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not specified
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - left-handed quark doublets
  - left-handed lepton doublets
  - muons
  - neutrinos
  - Higgs boson
  dark_sector_couplings:
  - Yukawa couplings y_Qi and y_Li
  - Higgs portal coupling lambda_H_phi_l plus lambda'_H_phi_l
  - scalar-potential couplings among H, phi_l, and phi_q
  mediator_types:
  - SM Higgs
  - vector-like fermion doublet
  - colored scalar
  interaction_operators:
  - y_Qi Q_Li phi_q chi_R
  - y_Li L_Li phi_l chi_R
  - Higgs-portal scalar-potential terms
  annihilation_channels:
  - S S -> mu+ mu- via charged vector-like fermion exchange
  - S S -> neutrino neutrino via neutral vector-like fermion exchange
  - S S -> Standard Model final states through Higgs mediation
  - S A coannihilation channels when A is thermally populated
  decay_channels: []
  self_scattering_channels: []
  cp_structure: S and A are real and imaginary components of the neutral complex scalar phi_l.
  flavor_structure: Yukawa choices are scanned to address b -> s transitions and muon g-2.
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_S
    description: Mass of CP-even scalar S.
    range:
      min: 30
      max: 350
      unit: GeV
      notes: Allowed scan region quoted after flavor, g-2, relic-density, and direct-detection requirements.
    unit: GeV
    role: core
    status: inferred
  - name: CP-odd scalar mass
    symbol: m_A
    description: Mass of A, relevant for coannihilation with S.
    range: m_A heavier than S; pseudoscalar mass constrained in scans
    unit: GeV
    role: core
    status: inferred
  - name: vector-like fermion mass
    symbol: m_chi
    description: Common tree-level mass of the neutral and charged vector-like fermions.
    range: 101.2 GeV lower LEP limit to about 600 GeV in the combined favored region
    unit: GeV
    role: core
    status: inferred
  - name: colored scalar mass
    symbol: m_phi_q
    description: Mass of the colored scalar fixed in the main scan.
    value: 1.5
    unit: TeV
    role: core
    status: inferred
  - name: leptonic Yukawa coupling
    symbol: y_mu
    description: Yukawa coupling controlling S annihilation to muons and muon g-2 loops.
    range: about 1.4 to 4 in the favored region
    role: core
    status: inferred
  - name: Higgs portal combination
    symbol: lambda_H_phi_l + lambda_prime_H_phi_l
    description: Controls Higgs-mediated annihilation, direct detection, and Higgs invisible decay.
    range: less than or of order 1 in scans
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: S-A mass splitting
    symbol: m_A - m_S
    description: Controls whether A remains abundant at freeze-out for coannihilation.
    range: benchmark splittings include 60 GeV and 250 GeV
    unit: GeV
    role: derived
    status: inferred
