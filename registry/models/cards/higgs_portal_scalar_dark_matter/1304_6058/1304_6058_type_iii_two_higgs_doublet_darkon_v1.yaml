    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1304.6058'
  - name: heavy CP-even Higgs mass
    symbol: m_H
    description: Mass of the heavier CP-even Higgs mediator used for darkon annihilation.
    range: illustrative values used in relic-density and scattering plots
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1304.6058'
  - name: darkon-heavy-Higgs coupling
    symbol: lambda_H
    description: Effective DDH coupling fixed by requiring the observed relic density for chosen m_D,
      m_H, and Yukawa couplings.
    range: derived from Planck relic-density band
    role: core
    status: derived
    source_reference_ids:
    - '1304.6058'
  - name: darkon-light-Higgs coupling
    symbol: lambda_h
    description: Effective DDh coupling; set to zero in the paper benchmark so h remains SM-like and lacks
      invisible darkon decay.
    value: 0 in the definite benchmark choice
    role: core
    status: assumed
    source_reference_ids:
    - '1304.6058'
  - name: heavy-Higgs fermion couplings
    symbol: k_f^H
    description: Free type-III THDM Yukawa modifiers controlling annihilation and isospin violation.
    range: k_f^H=1 for isospin-conserving examples; k_u^H and k_d^H adjusted for f_n/f_p about -0.7 in
      isospin-violating examples
    role: core
    status: assumed
    source_reference_ids:
    - '1304.6058'
  - name: Planck relic density target
    symbol: Omega_D h^2
    description: Relic-density interval imposed in the numerical extraction of lambda_H.
    range:
      min: '0.1159'
      max: '0.1215'
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: 90 percent CL range quoted from Planck in the paper.
    role: core
    status: established
    source_reference_ids:
    - '1304.6058'
