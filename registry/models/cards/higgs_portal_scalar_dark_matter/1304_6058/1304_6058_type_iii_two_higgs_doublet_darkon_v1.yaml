  hierarchy_questions:
  - question: Why is the SM-like Higgs not invisible?
    answer: The paper sets lambda_h=0 so the lighter Higgs h has SM-like tree-level couplings and no appreciable
      h -> D D decay.
    status: assumed
  - question: Which Higgs controls the relic density?
    answer: For m_D < m_h/2 and lambda_h=0, darkon annihilation mainly proceeds through the heavier CP-even
      Higgs H.
    status: established
