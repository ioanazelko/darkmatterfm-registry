  - lambda_1 D^2 H1^dagger H1
  - lambda_2 D^2 H2^dagger H2
  - lambda_3 D^2 (H1^dagger H2 + H2^dagger H1)
  - effective lambda_H v D^2 H coupling
  mediator_types:
  - CP-even scalar Higgs mediator
  interaction_operators:
