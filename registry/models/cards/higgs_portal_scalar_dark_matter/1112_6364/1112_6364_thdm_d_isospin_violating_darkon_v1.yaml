    role: core
    status: established
    source_reference_ids: []
  - name: darkon-h coupling
    symbol: lambda_h
    description: Set to zero in the SM-like h scenario to suppress invisible h -> DD.
    value: 0
    role: core
    status: assumed
    source_reference_ids: []
  - name: isospin-violation ratio
    symbol: f_n/f_p
    description: Chosen near -0.7 in the isospin-violating scenario.
    value: '-0.7'
    role: phenomenological
    status: assumed
    source_reference_ids: []
  - name: H Yukawa modifiers
    symbol: k_f^H
    description: Free THDM Yukawa factors; large k_u^H and k_d^H are needed for sizable isospin violation.
    role: core
    status: established
    source_reference_ids: []
