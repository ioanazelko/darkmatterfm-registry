  - two-Higgs-doublet plus darkon
  - isospin-violating darkon model
  short_description: A two-Higgs-doublet extension plus a real singlet scalar darkon D, arranged so h
    is SM-like while another CP-even Higgs H mediates the light-WIMP relic density and potentially isospin-violating
    nucleon couplings.
  historical_origin_or_motivation: Motivated by possible 125 GeV SM-like Higgs hints and the difficulty
    of keeping a light Higgs-portal scalar dark matter candidate viable in the one-Higgs-doublet SM+D
    model.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - two-Higgs-doublet model
  - real singlet scalar Higgs-portal dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper writes the THDM Yukawa sector and a renormalizable darkon Lagrangian with couplings
    to H1 and H2.
particle_content:
  dark_matter_candidate:
    name: darkon D
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles: []
