  source_reference_ids: []
assumptions:
  global:
  - id: h_sm_like
    description: The 125 GeV scalar h is taken to have SM-like couplings while the darkon couples mainly
      through H.
    scope: theory
    status: assumed
    impact_if_violated: If h has a substantial invisible width, lambda_h need not be zero and the benchmark
      changes.
    can_be_relaxed: unknown
    source_reference_ids: []
  - id: isospin_ratio
    description: The isospin-violating scenario fixes f_n approximately -0.7 f_p.
    scope: theory
    status: assumed
    impact_if_violated: Different ratios change the required k_f^H pattern and scattering interpretation.
    can_be_relaxed: unknown
    source_reference_ids: []
  - id: cheng_sher_fcnc
    description: Tree-level flavor-changing neutral-current elements are assumed naturally small following
      the Cheng-Sher ansatz.
    scope: theory
    status: assumed
    impact_if_violated: Larger FCNC couplings would face additional flavor limits and alter the viable
      parameter space.
    can_be_relaxed: unknown
    source_reference_ids: []
