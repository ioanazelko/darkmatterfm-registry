    description: SM-like Higgs mass motivating the setup.
    value: about 125
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
  - name: darkon-H coupling
    symbol: lambda_H
    description: Controls H-mediated annihilation and nucleon scattering; extracted from relic-density
