  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A discrete Z2 symmetry under which D changes sign leaves all other fields unchanged
    and keeps D stable if unbroken.
  symmetries:
  - name: darkon Z2
    type: discrete
    exact_or_approximate: exact
    breaking: model parameters chosen so D has no vev and Z2 remains unbroken
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - quarks
  - charged leptons
  - W and Z bosons through the SM-like h
  - nucleons through H-mediated scalar couplings
  dark_sector_couplings:
  - lambda_1 D^2 H1^dagger H1
  - lambda_2 D^2 H2^dagger H2
  - lambda_3 D^2(H1^dagger H2 + H2^dagger H1)
  - lambda_h v D^2 h
  - lambda_H v D^2 H
  mediator_types:
  - CP-even Higgs h
  - CP-even Higgs H
  interaction_operators:
  - D^2 H_i^dagger H_j Higgs-portal operators
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: none
    velocity_dependence: mild
    spin_dependence: spin_independent
  annihilation_channels:
  - H-mediated annihilation into kinematically allowed Standard Model final states
  - for heavier D, possible annihilation into Higgs pairs
  decay_channels: []
  self_scattering_channels:
  - lambda_D D^4 self-coupling
  cp_structure: CP-even scalar mediation is central; a CP-odd Higgs A is present in the THDM spectrum
    but no DDA coupling appears in the stated darkon Lagrangian.
  flavor_structure: Type-III THDM Yukawa freedom with Cheng-Sher-suppressed tree-level flavor-changing
    elements; large light-quark H couplings are used for isospin violation.
  tree_or_loop_level: tree
parameters:
  core:
  - name: darkon mass
    symbol: m_D
    description: Real scalar dark-matter mass; the paper focuses on light-WIMP regimes, especially 5-20
      GeV for isospin violation and below about 150 GeV in THDM+D examples.
    range: 5-20 GeV for the isospin-violating scan; m_D below about 150 GeV in the light-darkon study
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
