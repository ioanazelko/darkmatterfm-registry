    value: 1 TeV in numerical illustrations
    range: null
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - 0901_1450
    notes: The paper says the boost-factor results are insensitive to m after normalization.
  - name: resonance offset
    symbol: delta
    description: Small parameter defining the resonance mass through M^2 = 4 m^2 (1 - delta).
    value: null
    range: positive resonance offset; M^2 = 4 m^2 (1 - delta) gives M < 2m
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - 0901_1450
    notes: The sign separates the physical-pole and unphysical-pole variants.
  - name: resonance width ratio
    symbol: gamma
    description: Width-to-mass ratio of the narrow resonance.
    value: null
    range: small; large boost factors require gamma and |delta| below about 10^-3 to 10^-4 depending on
      the variant
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - 0901_1450
    notes: The paper scans the resonance parameter space in delta and gamma.
  - name: trilinear dark-matter-resonance coupling
    symbol: alpha
    description: Dimensionful vertex coupling among two dark matter particles and the exchanged resonance
      in the positive-offset case.
    value: null
    range: about 15 GeV to 4.9 TeV in the m = 1 TeV numerical illustration
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - 0901_1450
    notes: The exact symbol is stripped in the text extraction; the paper solves this coupling from the
      relic abundance.
  - name: boost factor
    symbol: BF
    description: Late-time annihilation enhancement normalized to a usual nonresonant annihilation cross
      section.
    value: BF around 100 can be obtained
    range: null
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - 0901_1450
    notes: Used to assess whether the PAMELA, ATIC, and PPB-BETS anomalies can be matched.
