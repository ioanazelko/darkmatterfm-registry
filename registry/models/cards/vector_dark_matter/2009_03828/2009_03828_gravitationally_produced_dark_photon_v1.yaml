- id: matter_dominated_reheating
  applies_to: cosmological_history
  condition: Analytic calculations restrict reheating to a matter-dominated phase with equation of state
    w = 0.
  valid_range: finite duration of reheating after inflation; instant reheating recovered as a limit
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Other reheating equations of state are not the main analytic case in this paper.
  source_reference_ids:
  - '2009.03828'
  notes: The paper motivates w = 0 by quadratic inflaton potentials near the minimum.
- id: stable_vector_relic
  applies_to: model
  condition: The relic abundance calculation assumes the produced spin-1 particles are stable and comoving
    number density is conserved until today.
  valid_range: null
  status: assumed
  extrapolation_risk: high
  caveats:
  - If the dark photon decays or thermalizes through extra interactions, the relic abundance changes.
  source_reference_ids:
  - '2009.03828'
  notes: This assumption is stated in the conclusion around the relic-abundance calculation.
