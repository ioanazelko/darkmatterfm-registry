    during inflation and finite-duration reheating gravitationally produces the relic abundance without
    any required coupling to Standard Model particles.
  historical_origin_or_motivation: The paper extends earlier gravitational dark-photon production work
    by including a finite matter-dominated reheating era and solving the massive-vector mode evolution.
  status: speculative
  model_kind: effective_field_theory
