  - agent_notes: Primary paper provides equations and benchmark contours but no reusable code artifact
      in the assignment text.
    caveats:
    - Kinetic-equilibrium assumption must be checked before accepting base-model relic contours.
    constraint_ids:
    - planck_relic_density_target
    - fermi_lat_dwarf_gamma_constraint
    - base_kinetic_equilibrium_caveat
    - base_direct_detection_suppression
    derived_quantities:
    - Omega_X h^2
    - catalyst abundance
    - freeze-out temperature
    - gamma-ray flux
    description: Solve the coupled X/catalyst Boltzmann equations and recast indirect gamma-ray constraints
      for the base SU(2)_D vector model.
    forward_model_chain:
    - inputs:
      - XX -> Zprime Zprime
      - 3Zprime -> XX
      - catalyst decay
      notes: Primary paper compares analytic and numerical solutions.
      outputs:
      - Y_X(x)
      - Y_C(x)
      - Omega_X h^2
      step_id: coupled_boltzmann
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Assumes kinetic equilibrium.
    - inputs:
      - late-time annihilation rate
      - catalyst decay spectra
      notes: Use related Fermi-LAT dwarf paper for data context.
      outputs:
      - Fermi-LAT excluded regions
      - CTA sensitivity estimate
      step_id: gamma_recast
      step_type: recasting
      tool_or_code: null
      validity: Requires final-state spectra and dwarf J-factors.
    id: base_catalyzed_freezeout_route
    input_parameters:
    - m_X
    - m_Zprime
    - g_D
    - t_epsilon
    - tau_C
    - r_XZprime
    likelihoods:
    - Planck relic-density target
    - Fermi-LAT dwarf gamma-ray limits
    - CTA projected sensitivity
    observable_ids:
    - catalyzed_freezeout_relic_abundance
    - dwarf_gamma_continuum_from_catalyst_decay
    - suppressed_direct_detection_recoils
    required_code_resources:
    - custom coupled-Boltzmann solver
    - indirect-detection recasting code
    route_status: planned
    source_model_features:
    - broken SU(2)_D vector dark matter
    - lighter catalyst vector
    - dimension-five catalyst-decay operator
    validation_tests:
    - Recover primary analytic/numerical Boltzmann agreement.
    - Reproduce Fig. indirect-detection excluded regions qualitatively.
