  short_description: A neutralino LSP dark matter scenario in which long-lived particles such as gravitinos,
    Polonyi/moduli fields, or Q-balls decay after ordinary freeze-out and non-thermally repopulate neutralinos
    whose residual annihilation sets the final abundance.
  historical_origin_or_motivation: Developed to study how anomaly-mediated or mirage-mediated neutralino
    spectra with large annihilation cross sections behave when the LSP abundance is supplied by late-decaying
    matter.
  status: speculative
  model_kind: phenomenological_parameterization
