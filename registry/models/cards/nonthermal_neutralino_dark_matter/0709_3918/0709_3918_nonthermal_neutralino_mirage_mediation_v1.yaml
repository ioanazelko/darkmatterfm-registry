      to nonthermal neutralino abundance.
    source_model_features:
    - heavy Planck-suppressed modulus
    - late entropy release
    - neutralino LSP
    - Higgs-resonance annihilation
    input_parameters:
    - m_T
    - T_T
    - B_chi
    - <sigma v>
    - m_chi
    - M_0
    - alpha
    - tan_beta
    derived_quantities:
    - neutralino yield
    - Omega_chi h^2
    - BBN-safe reheating condition
    forward_model_chain:
    - step_id: modulus_decay
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - m_T
      - B_chi
      - Gamma_T
      outputs:
      - T_T
      - neutralino injection
      validity: Valid for a modulus-dominated era ending before BBN.
      notes: null
    - step_id: post_decay_annihilation
      step_type: boltzmann_solver
      tool_or_code: modified DarkSUSY in primary paper
      inputs:
      - T_T
      - <sigma v>
      - m_chi
      outputs:
      - Omega_chi h^2
      validity: Coannihilations neglected in the primary nonthermal calculation.
      notes: Primary keeps S-wave annihilation for late, slow neutralinos.
