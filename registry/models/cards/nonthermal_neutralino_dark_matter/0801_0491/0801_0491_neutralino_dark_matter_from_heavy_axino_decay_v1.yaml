identity:
  name: Neutralino dark matter from heavy axino decay
  family: nonthermal_neutralino_dark_matter
  aliases:
  - heavy-axino-decay neutralino dark matter
  short_description: R-parity-conserving supersymmetric/Peccei-Quinn scenario in which a TeV-scale heavy
    axino decays to the LSP neutralino after freeze-out, with the relic abundance controlled by axino
    decay, entropy production, and possible neutralino re-annihilation.
  historical_origin_or_motivation: Motivated by combining neutralino LSP dark matter with the Peccei-Quinn
    solution of the strong CP problem and by studying cosmological effects of a heavy axino in the axion
    supermultiplet.
  status: speculative
  model_kind: simplified_model
