validity_domain:
- id: heavy_axino_after_freezeout
  applies_to: model
  condition: The heavy axino must be heavier than the LSP neutralino, and its decay affects the neutralino
    abundance only when the post-decay temperature is below the neutralino freeze-out temperature.
  valid_range: T_D < T_fr for the nonthermal-abundance regime emphasized in the paper.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - If T_D > T_fr, axino-produced neutralinos thermalize and the late-decay effect is lost.
  source_reference_ids:
  - 0801_0491
  notes: null
- id: bbn_lifetime
  applies_to: model
  condition: Axino decays with lifetime shorter than about 0.1 s do not harm standard BBN; longer lifetimes
    require case-by-case cosmological treatment.
  valid_range: tau_axino less than about 0.1 s for automatically BBN-safe decays.
  status: inferred
  extrapolation_risk: high
  caveats:
