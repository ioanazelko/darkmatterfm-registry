  source_reference_ids:
  - 0801_0491
  notes: null
- id: simplified_pq_couplings
  applies_to: parameter
  condition: The numerical examples use simplified axino-neutralino-gauge coupling choices.
  valid_range: C_aYY=1 and bino fraction factor set to 1 in the paper's simplified estimates.
  status: assumed
  extrapolation_risk: medium
  caveats:
