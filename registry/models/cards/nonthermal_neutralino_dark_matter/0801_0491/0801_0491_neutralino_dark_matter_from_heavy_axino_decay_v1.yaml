  - Peccei-Quinn axion supermultiplet
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper uses the low-energy axion/PQ effective interaction and axino decay widths, with simplified
    choices such as C_aYY=Z_iB=1.
