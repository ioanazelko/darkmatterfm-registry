parameters:
  core:
  - name: Q-ball decay temperature
    symbol: T_d
    description: Decay temperature below the LSP freeze-out temperature; typical Affleck-Dine models have
      T_d of order 1 GeV.
    value: O(1)
    unit: GeV
    role: core
    status: approximate
  - name: neutralino annihilation cross section
    symbol: <sigma v>
    description: Large Higgsino/Wino annihilation cross section required so Q-ball decays do not overproduce
      LSPs.
    value: 10^(-8)-10^(-7) GeV^-2
    role: core
    status: approximate
  - name: observed dark matter density used
    symbol: Omega_DM h^2
    description: WMAP abundance used to constrain the scenario.
    value: 0.1126 +0.0161 -0.0181
    role: core
    status: established
  - name: thermal neutralino relic density in preferred nonthermal region
    symbol: Omega_chi^th h^2
    description: Preferred mSUGRA nonthermal points have small thermal relic density before Q-ball injection.
    value: <0.03
    role: core
    status: approximate
  - name: preferred neutralino mass
    symbol: m_chi
    description: Anticipated Q-ball decay temperature prefers a relatively light neutralino in the mSUGRA
      focus-point scenario.
    value: <~300
    unit: GeV
    role: core
    status: approximate
  - name: mSUGRA inputs
    symbol: m0,M1/2,A0,tan_beta,sgn(mu)
    description: Universal scalar mass, gaugino mass, trilinear coupling, tan beta, and sign of mu specify
      the mSUGRA scan.
    value: m0, M1/2, A0=0, tan beta = 10 or 45, positive mu
    role: core
    status: assumed
  nuisance: []
  derived:
  - name: Higgsino fraction
    symbol: Z_H
    description: Higgsino fraction of the lightest neutralino, defined from neutralino mixing coefficients.
    role: core
    status: inferred
