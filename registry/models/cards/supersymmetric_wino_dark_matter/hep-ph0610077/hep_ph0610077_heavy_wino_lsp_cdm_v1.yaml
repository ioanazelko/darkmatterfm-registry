parameters:
  core:
  - name: wino mass
    symbol: M_2
    description: Mass of the mostly-wino LSP
    range: 1.9-2.3 TeV for WMAP band in standard cosmology; upper edge can move to about 2.37 TeV for
      100 TeV sfermions
    unit: TeV
    role: core
    status: inferred
    source_reference_ids: []
    notes: The abstract rounds this to 2.0-2.3 TeV.
