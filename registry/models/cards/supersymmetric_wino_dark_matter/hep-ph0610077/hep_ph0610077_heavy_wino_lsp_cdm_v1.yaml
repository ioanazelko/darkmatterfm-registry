  short_description: A heavy mostly-wino neutralino LSP benchmark in AMSB-like and some string-motivated
    SUSY spectra, with a standard-thermal WMAP-compatible mass near 1.9-2.3 TeV and a nearly degenerate
    charged wino state.
  historical_origin_or_motivation: The paper develops the heavy wino LSP regime motivated by heavy scalar
    masses, AMSB-like gaugino hierarchies, and the WMAP relic-density band.
  status: benchmark
  model_kind: benchmark_mapping
