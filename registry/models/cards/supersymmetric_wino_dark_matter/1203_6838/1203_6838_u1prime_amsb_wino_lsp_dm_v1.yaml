identity:
  name: Minimal U(1)' strictly anomaly-mediated wino LSP dark matter
  family: supersymmetric_wino_dark_matter
  aliases:
  - U(1)' sAMSB wino dark matter
  - gravitino-decay wino LSP dark matter
  short_description: A minimal no-Fayet-Iliopoulos U(1)' extension of a strictly anomaly-mediated supersymmetry-breaking
    model in which the low-energy spectrum is MSSM-like, the LSP is mostly wino, thermal freeze-out underproduces
    it, and the observed dark matter density can be regenerated by gravitino decays after thermal inflation.
  historical_origin_or_motivation: Introduced as a minimal formulation of an earlier U(1)' anomaly-mediated
    model, motivated by a 125 GeV Higgs, the tachyonic-slepton problem, inflation, cosmic strings, and
    nonthermal dark matter production.
  status: speculative
  model_kind: complete_theory
