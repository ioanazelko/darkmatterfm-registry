  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives a complete superpotential for the U(1)' model and emphasizes that the low-energy
    spectrum is precisely MSSM-like, though it also states the construction is not quite a complete anomaly-mediated
    implementation because the Higgs soft parameter needs an extension.
