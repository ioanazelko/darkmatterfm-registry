constraints:
- id: wmap_act_spt_alpha_bound
  name: WMAP7 plus ACT/SPT upper bound on decaying-DM fraction
  constraint_type: cosmological
  observable_channel: CMB temperature anisotropies
  applies: 'yes'
  constrained_parameters:
  - alpha
  - rho_dark/rho_DM
  - Delta N_eff
  excluded_regions:
  - alpha >= 0.027 for WMAP+ACT and alpha >= 0.028 for WMAP+SPT at the quoted 2-sigma upper limits.
  allowed_regions:
  - alpha < 0.027 from WMAP+ACT; alpha < 0.028 from WMAP+SPT.
  benchmark_implications:
  - Only a few-percent conversion fraction is allowed by the CMB datasets analyzed.
  likelihood_available: partial
  likelihood_reference: CosmoMC likelihoods for WMAP7, ACT 2008, and SPT 2008/2009 are used in the paper
    but not bundled here.
  data_release: WMAP7 + ACT 148 GHz 2008; WMAP7 + SPT 150 GHz 2008/2009
  recasting_needed: 'no'
  robustness: high
  assumptions:
  - id: flat_lcdm_extension
    description: The fit assumes spatial flatness and varies seven cosmological parameters plus alpha
      and foregrounds.
    scope: CosmoMC parameter estimation
    status: assumed
    impact_if_violated: Relaxing cosmological assumptions could broaden or shift the alpha constraint.
    can_be_relaxed: partial
    source_reference_ids:
    - src_primary
    notes: null
  caveats:
  - The paper does not combine ACT and SPT because their observed fields slightly overlap.
  source_reference_ids:
  - src_primary
  notes: Primary text gives 2-sigma upper limits of alpha < 0.027 and alpha < 0.028.
- id: matter_power_oscillation_condition
  name: Scalar-CDM oscillation before matter-radiation equality
  constraint_type: cosmological
  observable_channel: linear matter power and coherent scalar behavior
  applies: parameter_dependent
  constrained_parameters:
  - m_phi
  - T_osc
  - Yukawa coupling
  - resonance parameter q
  excluded_regions:
  - Scalar dark matter beginning coherent oscillations too late would suppress small-scale linear matter
    power.
  allowed_regions:
  - Example estimate uses T_osc around 100 eV so oscillations begin before matter-radiation equality;
    m_phi must exceed H(T_osc).
  benchmark_implications:
  - Phenomenological scalar examples must satisfy both the CMB alpha bound and this matter-power timing
    condition.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: Lyman-alpha and SDSS matter-power constraints cited in primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: quadratic_scalar_potential
    description: The scalar is approximated near the minimum by V = 1/2 m_phi^2 phi^2.
    scope: specific particle model
    status: assumed
    impact_if_violated: A different potential changes the mapping between alpha and particle parameters.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_primary
    notes: null
  caveats:
  - The paper provides an illustrative scalar model; the main CMB bound is model-independent within the
    alpha-H coupling form.
  source_reference_ids:
  - src_primary
  notes: Primary text states oscillation near T_osc ~100 eV keeps the model away from Lyman-alpha/SDSS
    matter-power conflict.
theory_to_observable_routing:
  routes:
  - id: route_ddm_to_cmb
    description: Route decaying scalar CDM to CMB constraints by solving coupled background and perturbation
      equations and fitting with CosmoMC.
    source_model_features:
    - CDM energy transfer Q to dark radiation
    - Gamma = alpha H phenomenology
    - dark radiation treated as massless daughter species
    input_parameters:
    - alpha
    - omega_b h^2
    - omega_dm h^2
    - H0
    - tau
    - A_s
    - n_s
    - foreground nuisance parameters
    derived_quantities:
    - Delta N_eff(a)
    - CMB TT spectrum
    - alpha posterior
    forward_model_chain:
    - step_id: background
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - Gamma = alpha H
      - rho_DM
      - rho_dark
      outputs:
      - rho_DM(a)
      - rho_dark(a)
      - Delta N_eff(a)
      validity: valid for the phenomenological energy-transfer law
      notes: For small alpha, rho_dark/rho_DM is approximately alpha.
    - step_id: perturbations
      step_type: boltzmann_solver
      tool_or_code: modified CAMB/CosmoMC as described in paper
      inputs:
      - background evolution
      - Boltzmann hierarchy for decay products
      outputs:
      - CMB spectra
      - parameter posterior
      validity: valid for the paper assumptions
      notes: The paper derives perturbation equations for massive parent and massless decay products.
    - step_id: likelihood
      step_type: likelihood
      tool_or_code: WMAP7/ACT/SPT likelihood packages
      inputs:
      - CMB spectra
      - foreground templates
      outputs:
      - alpha upper limit
      validity: dataset-specific
      notes: ACT and SPT are analyzed separately.
    observable_ids:
    - late_delta_neff_growth
    - cmb_temperature_shape
    constraint_ids:
    - wmap_act_spt_alpha_bound
    - matter_power_oscillation_condition
    likelihoods:
    - WMAP7 likelihood
    - ACT/SPT high-ell likelihoods
    required_code_resources:
    - CAMB/CosmoMC implementation of interacting dark matter and dark radiation
    validation_tests:
    - Reproduce alpha < 0.027 and alpha < 0.028 upper limits.
    - Check Delta N_eff(a) is near zero at BBN and order unity near decoupling for sample alpha.
    route_status: planned
    agent_notes: The route is explicit in the paper but code was not recovered in this batch.
    caveats:
    - Planck-era datasets supersede WMAP7/ACT/SPT and would need a fresh analysis.
