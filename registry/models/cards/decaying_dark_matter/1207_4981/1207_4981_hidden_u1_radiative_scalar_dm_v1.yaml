validity_domain:
- id: long_lifetime_condition
  applies_to: decaying dark matter lifetime
  condition: The scalar must be longer-lived than the age of the Universe and have an effective photon-producing
    lifetime near 10^28-10^29 s.
  valid_range: tau_phi > 4.34 x 10^17 s; tau_gamma about 10^28-10^29 s
  status: established
  extrapolation_risk: high
  caveats:
  - Changing the coupling combination, epsilon, or m_psi can make the scalar decay too quickly or too
    slowly for the paper motivation.
  source_reference_ids:
  - '1207_4981'
  notes: null
- id: suppressed_higgs_portal
  applies_to: theory
  condition: Renormalizable Higgs-portal operators must be negligible or geometrically suppressed.
  valid_range: null
  status: assumed
  extrapolation_risk: high
  caveats:
  - If phi^2 |H|^2 or phi |H|^2 is sizable, the paper states fast decays to Higgs bosons can dominate.
  source_reference_ids:
  - '1207_4981'
  notes: null
- id: nonthermal_reheating_window
  applies_to: production
  condition: The first production scenario assumes m_psi > T_R > m_phi so phi can be produced but the
    GUT-scale fermion is not abundant.
  valid_range: m_psi > T_R > m_phi
  status: assumed
  extrapolation_risk: medium
  caveats:
