identity:
  name: Hidden-U(1) radiatively decaying scalar dark matter
  family: decaying_dark_matter
  aliases:
  - hidden-sector scalar dark matter for the Fermi 130 GeV line
  - U(1)_H scalar decaying dark matter
  short_description: A hidden-sector singlet scalar dark matter model in which a heavy U(1)_H-charged
    fermion radiatively induces decays to hidden photons and, through small kinetic mixing, to gamma-ray
    final states.
  historical_origin_or_motivation: Motivated by the Fermi-LAT 130 GeV gamma-ray line and by the need to
    suppress scalar dark matter decay to Standard Model particles while retaining a small photon signal.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - hidden-sector U(1) gauge extension
  - decaying dark matter
  - kinetic mixing portal
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes a low-energy U(1)_EM x U(1)_H kinetic-mixing Lagrangian with renormalizable
    hidden-sector interactions; the photon decay operators are loop-induced effective dimension-five terms
    from a heavy vector-like fermion.
particle_content:
  dark_matter_candidate:
    name: hidden-sector scalar phi
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - massless hidden photon A_H
  - GUT-scale vector-like hidden fermion psi
  - optional light hidden fermion psi' in the second production scenario
  mediators:
  - hidden photon A_H
  - heavy vector-like hidden fermion psi
  - kinetic mixing between U(1)_EM and U(1)_H
  dark_radiation_species:
  - massless hidden photon A_H
  excited_or_degenerate_states: []
  long_lived_particles:
  - hidden-sector scalar phi
  unstable_parent_particles:
  - inflaton or unspecified heavy particle in the production scenarios
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The scalar is not absolutely stable; its cosmological lifetime is obtained from
    loop suppression, a GUT-scale hidden fermion, small kinetic mixing, and suppressed Higgs-portal operators.
  symmetries:
  - name: U(1)_H
    type: gauge
    exact_or_approximate: exact
    breaking: unbroken in the hidden-photon setup used for the model
    breaking_scale: null
  - name: U(1)_EM x U(1)_H kinetic mixing
    type: gauge
    exact_or_approximate: exact
    breaking: no symmetry breaking is required for the massless hidden photon; mixing is diagonalized
      into photon and hidden photon bases
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - photon
  - suppressed Higgs portal assumed negligible
  dark_sector_couplings:
  - U(1)_H gauge coupling of the hidden fermion
  - Yukawa interaction between scalar phi and heavy hidden fermions
  - kinetic mixing epsilon F_EM F_H
  mediator_types:
  - hidden photon
  - heavy vector-like fermion
  interaction_operators:
  - loop-induced phi F_H F_H
  - kinetic-mixing-suppressed phi F_EM F_H
  - epsilon-squared-suppressed phi F_EM F_EM
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: not_applicable
  annihilation_channels: []
  decay_channels:
  - phi -> A_H A_H
  - phi -> gamma A_H
  - phi -> gamma gamma
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: minimal hidden-sector fermion content in the benchmark discussion; no Standard Model
    flavor structure is developed.
  tree_or_loop_level: loop
parameters:
  core:
  - name: scalar dark matter mass
    symbol: m_phi
    description: Mass chosen so that decay photons can match the 130 GeV line in the decaying-DM interpretation.
    range: about 260
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1207_4981'
    notes: The paper repeatedly evaluates formulas for m_phi = 260 GeV.
  - name: heavy hidden fermion mass
    symbol: m_psi
    description: Mass of the vector-like fermion in the loop inducing scalar decay to hidden photons.
    range: around 10^16
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1207_4981'
    notes: A GUT-scale mass is used to obtain the required lifetime for representative couplings.
  - name: hidden gauge coupling combination
    symbol: alpha_H or lambda_H combination
    description: Hidden-sector coupling combination controlling the phi -> A_H A_H loop width.
    range: bounded by lifetime; paper quotes a scale of order 10^-7 times m_psi/10^16 GeV for m_phi =
      260 GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1207_4981'
    notes: Notation is partially lost in the extracted text; record as the paper-supported coupling combination
      rather than a single canonical symbol.
  - name: kinetic mixing parameter
    symbol: epsilon
    description: Mixing between U(1)_EM and U(1)_H that converts hidden photons into photon final states.
    range: 10^-4 to 10^-2 benchmark bands
    role: core
    status: established
    source_reference_ids:
    - '1207_4981'
    notes: The paper plots benchmark bands for epsilon = 10^-4, 10^-3, and 10^-2.
  - name: target gamma-line lifetime
    symbol: tau_gamma
    description: Effective lifetime for the photon-producing decay channel used to fit the line.
    range: 10^28 to 10^29
    unit: s
    role: core
    status: established
    source_reference_ids:
    - '1207_4981'
    notes: The dominant hidden-photon decay is faster than the photon-producing channel by powers of epsilon.
  - name: reheating temperature condition
    symbol: T_R
    description: Nonthermal production condition in the first production scenario.
    range: m_psi > T_R > m_phi
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1207_4981'
    notes: The paper assumes reheating below the GUT-scale fermion mass so phi can be produced while psi
      is not abundant.
