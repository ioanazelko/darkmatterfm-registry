  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: unknown
    description: The gravitino abundance is dominated by the thermal production formula used in the primary
      paper.
    id: thermal_gravitino_production
    impact_if_violated: Nonthermal production or dilution would alter T_R constraints.
    notes: null
    scope: production
    source_reference_ids:
    - primary_1910_00459
    status: assumed
  benchmark_implications:
  - Couples inflation/reheating assumptions to the late-decay solution.
  caveats:
  - Supersymmetric spectrum dependence is compressed into benchmark parameters.
  constrained_parameters:
  - T_R
  - m_3/2
  - M_3
  constraint_type: cosmological
  data_release: null
  excluded_regions:
  - Reheating temperatures that overproduce or underproduce the gravitino abundance are incompatible with
    the single-component DDM setup.
  id: thermal_gravitino_reheating_band
  likelihood_available: 'no'
  likelihood_reference: null
  name: Thermal gravitino production reheating band
  notes: Keep T_R explicit in downstream scans.
  observable_channel: relic_density
  recasting_needed: 'no'
  robustness: medium
  source_reference_ids:
  - primary_1910_00459
theory_to_observable_routing:
  routes:
  - agent_notes: This route is the main observational test of the model.
    caveats:
    - Current cosmological data may reduce the original H0-motivated parameter space.
    constraint_ids:
    - ddm_hubble_tension_parameter_region
    - late_universe_ddm_cosmology_bounds
    derived_quantities:
    - daughter velocity
    - decayed fraction
    - H(z)
    - matter power spectrum
    description: Map gravitino-to-axino-plus-axion decay parameters into late-Universe DDM observables
      and cosmological likelihoods.
    forward_model_chain:
    - inputs:
      - m_3/2
      - m_axino
      - M_P
      notes: null
      outputs:
      - Gamma_3/2
      - tau_3/2
      step_id: decay_width
      step_type: analytic_formula
      tool_or_code: null
      validity: Primary-paper two-body decay formula.
    - inputs:
      - tau_3/2
      - r_m
      notes: null
      outputs:
      - DDM lifetime and daughter-energy parameters
      step_id: ddm_mapping
      step_type: data_transform
      tool_or_code: null
      validity: Valid for invisible two-body decay.
    - inputs:
      - DDM parameters
      notes: null
      outputs:
      - CMB spectra
      - matter power
      - distances
      step_id: boltzmann_evolution
      step_type: boltzmann_solver
      tool_or_code: CLASS/CAMB with decaying dark matter extension
      validity: Requires massive daughter implementation.
    - inputs:
      - CMB
      - BAO
      - SN
      - time-delay/lensing data
      notes: null
      outputs:
      - posterior on DDM parameters
      step_id: cosmology_likelihood
      step_type: likelihood
      tool_or_code: null
      validity: Use current data before claiming H0 relief.
    id: route_gravitino_decay_cosmology
    input_parameters:
    - m_3/2
    - m_axino
    - tau_3/2
    - initial gravitino abundance
    likelihoods:
    - CMB/BAO/SN/time-delay DDM likelihoods
    observable_ids:
    - gravitino_decay_hubble_tension_signal
    - decay_daughter_structure_suppression
    required_code_resources:
    - CLASS or CAMB DDM branch
    - cosmological likelihood stack
    route_status: planned
    source_model_features:
    - gravitino DDM
    - massive axino daughter
    - massless electroweak axion daughter
    validation_tests:
    - Recover the DDM parameter mapping quoted by the primary paper.
  - agent_notes: Needed to connect the H0 route to a consistent relic abundance.
    caveats:
    - Sensitive to the assumed gluino mass and high-scale supersymmetric spectrum.
    constraint_ids:
    - thermal_gravitino_reheating_band
    derived_quantities:
    - Omega_3/2 h^2
    description: Compute thermally produced gravitino abundance and compare with the DDM abundance target.
    forward_model_chain:
    - inputs:
      - T_R
      - m_3/2
      - M_3
      notes: null
      outputs:
      - Omega_3/2 h^2
      step_id: production_rate
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses primary-paper thermal production approximation.
    - inputs:
      - Omega_3/2 h^2
      - DDM required abundance
      notes: null
      outputs:
      - allowed T_R band
      step_id: abundance_match
      step_type: validation
      tool_or_code: null
      validity: Assumes no entropy dilution or nonthermal source.
    - inputs:
      - allowed T_R band
      - DDM mass/lifetime region
      notes: null
      outputs:
      - joint viable parameter region
      step_id: joint_filter
      step_type: data_transform
      tool_or_code: null
      validity: Combines early and late cosmology constraints.
    id: route_gravitino_thermal_abundance
    input_parameters:
    - T_R
    - m_3/2
    - M_3
    - gauge couplings
    likelihoods: []
    observable_ids:
    - thermal_gravitino_abundance_reheating
    required_code_resources:
    - thermal gravitino abundance calculator
    route_status: planned
    source_model_features:
    - thermal gravitino production
    - MSSM spectrum dependence
    validation_tests:
    - Reproduce the primary-paper T_R versus m_3/2 figure qualitatively.
