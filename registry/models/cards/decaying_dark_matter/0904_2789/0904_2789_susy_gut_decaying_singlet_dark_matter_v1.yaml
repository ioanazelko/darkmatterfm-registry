    16_m multiplet constitute long-lived dark matter and decay through GUT-suppressed dimension-6 interactions.
  historical_origin_or_motivation: Motivated by the analogy between proton decay and dark matter decay
    in grand unified theories, with lifetimes near current cosmic-ray sensitivity.
