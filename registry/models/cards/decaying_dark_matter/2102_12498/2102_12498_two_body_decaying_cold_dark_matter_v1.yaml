    - linear P(k)
    - CMB TT/TE/EE/lensing spectra
    - S8
    description: Use a modified Boltzmann solver and MCMC likelihoods to map two-body DDM parameters to
      CMB, matter power, and S8 constraints.
    forward_model_chain:
    - inputs:
      - Gamma^-1
      - epsilon
      - initial parent density
      notes: Track both warm massive and massless daughters.
      outputs:
      - rho_parent
      - rho_wdm
      - rho_dr
      step_id: background_decay_evolution
      step_type: boltzmann_solver
      tool_or_code: modified CLASS
      validity: Valid for the two-body decay model described in the paper.
    - inputs:
      - warm-daughter equation of state
      - sound speed
      - viscosity
      notes: The paper notes scale-dependent sound speed matters for P(k).
      outputs:
      - linear perturbations
      - free-streaming scale
      step_id: warm_daughter_fluid_approximation
      step_type: boltzmann_solver
      tool_or_code: modified CLASS
      validity: Approximation is designed to reproduce the Boltzmann hierarchy efficiently.
    - inputs:
      - CMB spectra
      - BAO/SNIa/growth data
      - weak-lensing S8 priors
      notes: Use nonlinear simulations/EFT before full weak-lensing likelihoods.
      outputs:
      - posterior constraints
      - best-fit shifts in S8
      step_id: mcmc_likelihood_comparison
      step_type: likelihood
      tool_or_code: MontePython
      validity: Restricted to linear/compressed likelihoods used by the paper.
    id: decay_boltzmann_to_linear_likelihood_route
    input_parameters:
    - Gamma^-1
    - epsilon
    - parent abundance
    - standard cosmological parameters
    likelihoods:
    - Planck 2018
    - BAO/SNIa
    - BOSS/eBOSS growth/BAO
    - compressed weak-lensing S8 priors
    - future CMB-S4 forecasts
    observable_ids:
