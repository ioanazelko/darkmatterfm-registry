    role: core
    status: inferred
    source_reference_ids: []
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies an effective C to C_prime e^- e^+ interaction and embeds it using a new scalar
    doublet, approximate global U_D(1), approximate Z_2, and a kinetically mixed U(1) gauge boson; the
    origin of X decay is phenomenological.
