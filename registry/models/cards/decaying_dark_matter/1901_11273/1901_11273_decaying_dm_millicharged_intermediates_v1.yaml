identity:
  name: Decaying scalar dark matter with millicharged intermediates
  family: decaying_dark_matter
  aliases:
  - AMS-02 millicharged-intermediate decaying dark matter
  short_description: A metastable neutral scalar dark matter particle X decays to millicharged particles
    C that are trapped by galactic magnetic fields and later decay to C_prime plus e^- e^+, softening
    halo gamma-ray emission.
  historical_origin_or_motivation: The model is proposed as a dark matter explanation of the AMS-02 positron
    excess while relaxing isotropic gamma-ray bounds on prompt decays.
  status: speculative
  model_kind: simplified_model
