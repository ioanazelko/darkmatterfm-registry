    symbol: m_N0
    description: Mass of the added Z2-even Majorana singlet that softly breaks U(1)_ell.
    value: example m_N0 = 100 GeV in a lambda5 illustration
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - ref_2001_07515
