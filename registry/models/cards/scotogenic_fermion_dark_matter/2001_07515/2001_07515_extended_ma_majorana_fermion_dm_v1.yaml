identity:
  name: Loop-induced lambda5 extended Ma-model with Majorana fermion dark matter
  family: scotogenic_fermion_dark_matter
  aliases:
  - minimal extension of the Ma-model with vector-like lepton doublet X
  - modified Ma-model with Z2-even Majorana singlet N0
  short_description: A scotogenic Ma-model extension in which a Z2-odd vector-like lepton doublet X and
    a Z2-even Majorana singlet N0 dynamically generate the small lambda5 term while the lightest Z2-odd
    Majorana fermion chi5/lightest Nk is the dark matter candidate.
  historical_origin_or_motivation: The paper extends the Ma radiative seesaw model to obtain loop-induced
    lambda5, retain a dark matter candidate, and address muon g-2 and lepton-flavor violation.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Ma radiative seesaw model
  - scotogenic neutrino-mass model
  - inert Higgs doublet model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives gauge-invariant Yukawa terms, scalar potential terms, Majorana masses, one-loop
    lambda5 generation, and mass mixing for X0 and Nk.
particle_content:
  dark_matter_candidate:
    name: chi5, the lightest Z2-odd Majorana fermion dominated by Nk
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert Higgs doublet H_I with S_I, A_I, and H_I^+
  - three Z2-odd singlet Majorana fermions N_1, N_2, N_3
  - Z2-odd vector-like lepton doublet X = (X0, X-)
  - Z2-even Majorana singlet N0
  mediators:
  - SM Higgs h
  - Z boson
  - W boson
  - charged inert Higgs H_I^+
  dark_radiation_species: []
  excited_or_degenerate_states:
  - near-degenerate inert neutral scalars S_I and A_I when lambda5 is small
  - heavier Z2-odd neutral fermions chi_i
  long_lived_particles: []
  unstable_parent_particles:
  - vector-like charged lepton X^+/-
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A global U(1)_ell symmetry is softly broken by dimension-3 Majorana mass terms,
    leaving a residual exact Z2 under which H_I, N_k, and X are odd; the lightest Z2-odd fermion is stable.
  symmetries:
  - name: U(1)_ell
    type: global
    exact_or_approximate: broken
    breaking: Softly broken by Majorana mass terms for N_k and N0, suppressing the tree-level lambda5
      term.
    breaking_scale: null
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: Residual symmetry after soft U(1)_ell breaking; not broken in the model discussion.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - SM Higgs doublet H
  - charged leptons
  - SM quarks/nucleons through h and Z exchange
  - electroweak gauge bosons
  dark_sector_couplings:
  - L H_I N_k Yukawa coupling y_L^k
  - X_L H_I ell_R Yukawa coupling y_R
  - X_L H N_k Yukawa coupling h_L^k
  - X_L H_I N0 Yukawa coupling y_L^0
  - Majorana masses for N_k and N0
  - loop-induced lambda5 (H^dagger H_I)^2 term
  mediator_types:
  - SM Higgs scalar
  - Z boson
  - W boson
  - charged inert Higgs
  interaction_operators:
  - Yukawa sector connecting L, H_I, N_k, X, H, and N0
  - one-loop generated lambda5 (H^dagger H_I)^2 scalar operator
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: both
  annihilation_channels:
  - chi5 chi5 -> Z h
  - coannihilation channels involving X and heavier chi_i
  decay_channels: []
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: Yukawa flavor mixings are central to neutrino masses, LFV, and muon g-2; electron-related
    parameters are suppressed in the numerical analysis.
  tree_or_loop_level: both
