  short_description: A weak-scale secluded-sector WIMP setup in which stable scalar or fermion dark matter
    annihilates within a spontaneously broken U(1)' sector to lighter secluded bosons or neutralinos,
    with visible decays controlled by supersymmetric kinetic, Higgs, vector, and gaugino portals; R-parity
    violation can modify cascade decays.
