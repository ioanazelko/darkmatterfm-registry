  short_description: A residual-Z2-stabilized Majorana fermion chi_1, mostly from S_1R and S_2R, in an
    anomaly-cancelled extra U(1)_X gauge model. Its thermal relic abundance is controlled by X-mediated
    annihilation and chi_2 co-annihilation linked to active-sterile neutrino mixing.
  historical_origin_or_motivation: Motivated by combining a viable dark matter candidate with active-sterile
    neutrino masses and mixing in a minimal extra-U(1) gauge extension.
