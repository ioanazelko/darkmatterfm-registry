  - The same mass/coupling choices set direct and indirect detection prospects.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: null
  recasting_needed: 'no'
  robustness: medium
  assumptions:
  - id: benchmark_splitting
    description: The benchmark analysis fixes m_P - m_S = 0.01 m_S to maintain efficient coannihilation.
    scope: relic density
    status: assumed
    impact_if_violated: A different splitting changes the coannihilation rate and viable curves.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1908_09277_primary
    notes: null
  caveats:
  - Figure curves were not digitized.
  source_reference_ids:
  - src_1908_09277_primary
  notes: Primary paper states the relic target and Boltzmann coannihilation setup.
- id: con_direct_detection_inelastic
  name: LUX/PandaX/XENON1T direct-detection upper-bound context
  constraint_type: direct_detection
  observable_channel: direct_detection
  applies: parameter_dependent
  constrained_parameters:
  - sigma_SI
  - m_S
  - theta
  - m_P - m_S
  excluded_regions:
  - Elastic WIMP-like scattering at too-large sigma_SI is excluded by LUX, PandaX-II, and XENON1T context;
    the model suppresses Z-prime scattering by inelasticity.
  allowed_regions:
  - Benchmarks with Higgs-dominated scattering can fall below XENON1T and even below the neutrino-background
    level in parts of the B-L analysis.
  benchmark_implications:
  - Direct-detection null results motivate the inelastic construction.
  likelihood_available: partial
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: high
  assumptions:
  - id: splitting_above_recoil
    description: The S-P splitting exceeds the typical direct-detection recoil energy for Z-prime-mediated
      up-scattering.
    scope: direct detection
    status: assumed
    impact_if_violated: If the splitting is too small, Z-prime-mediated scattering would reappear.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1908_09277_primary
    notes: null
  caveats:
  - Direct-detection experiment papers were not all separately read; the primary paper supplies the experiment
    comparison.
  source_reference_ids:
  - src_1908_09277_primary
  - src_xenon_inelastic_2006_11938
  notes: Primary paper discusses LUX, PandaX-II, and XENON1T null results and model suppression.
- id: con_fermi_annihilation
  name: Fermi-LAT gamma-ray constraint on present annihilation
  constraint_type: indirect_detection
  observable_channel: indirect_detection
  applies: parameter_dependent
  constrained_parameters:
  - <sigma v>_0
  - m_S
  - m_Z_prime
  - Z-prime branching fractions
  excluded_regions:
  - For m_Z_prime < m_S and sufficiently visible Z-prime decays, Fermi-LAT limits constrain present S
    S to Z-prime Z-prime annihilation.
  allowed_regions:
  - Regions with suppressed present annihilation or invisible/light-neutrino Z-prime decays can evade
    gamma-ray bounds.
  benchmark_implications:
  - Indirect detection is variant- and hierarchy-dependent rather than a universal exclusion.
  likelihood_available: partial
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: visible_final_states
    description: Gamma-ray limits assume Z-prime decays produce visible final states relevant to the Fermi-LAT
      channels.
    scope: indirect detection
    status: assumed
    impact_if_violated: Invisible or neutrino-dominated decays weaken gamma-ray constraints.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1908_09277_primary
    notes: null
  caveats:
  - No Fermi-LAT likelihood was read separately in this batch.
  source_reference_ids:
  - src_1908_09277_primary
  notes: Primary paper states the Fermi-LAT constraint and model-dependent exceptions.
- id: con_lmutau_babar_trident_bbn
  name: BABAR, neutrino-trident, LHC, and BBN constraints on L_mu-L_tau mediator
  constraint_type: laboratory
  observable_channel: precision_laboratory
  applies: parameter_dependent
  constrained_parameters:
  - g_mu_tau
  - m_Z_prime
  - Delta N_eff
  excluded_regions:
  - BABAR, neutrino-trident nonobservation, LHC bounds, and BBN/Delta N_eff limits remove parts of the
    light-mediator plane.
  allowed_regions:
  - The primary paper identifies remaining regions overlapping muon g-2 and Hubble-tension motivation.
  benchmark_implications:
  - The L_mu-L_tau scalar dark matter interpretation is viable only in the surviving mediator plane.
  likelihood_available: partial
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: minimal_lmutau_decay_pattern
    description: The mediator branching fractions follow the minimal L_mu-L_tau charge assignment used
      in the primary paper.
    scope: mediator constraints
    status: assumed
    impact_if_violated: Additional invisible states would change BABAR/trident/BBN interpretations.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1908_09277_primary
    notes: null
  caveats:
  - Only the primary paper was used for these laboratory/cosmology mediator bounds.
  source_reference_ids:
  - src_1908_09277_primary
  notes: Primary paper explicitly lists BABAR, trident, LHC, and BBN regions.
theory_to_observable_routing:
  routes:
  - id: route_inelastic_coannihilation
    description: Solve the coupled S/P freeze-out abundance with effective coannihilation cross sections.
    source_model_features:
    - complex scalar split into S and P
    - off-diagonal Z-prime interaction
    input_parameters:
    - m_S
    - m_P
    - m_Z_prime
    - g_mu_tau
    - m_H
    - theta
    derived_quantities:
    - Omega_S h^2
    - effective annihilation cross section
    forward_model_chain:
    - step_id: effective_cross_section
      step_type: analytic_formula
      tool_or_code: coannihilation formulae in primary paper
      inputs:
      - S/P spectrum
      - Z-prime couplings
      outputs:
      - sigma_eff v
      validity: Small S-P splitting regime.
      notes: Includes S P to fermion pairs and S S to Z-prime Z-prime where open.
    - step_id: boltzmann_solution
      step_type: boltzmann_solver
      tool_or_code: single equation for n=n_S+n_P
      inputs:
      - sigma_eff v
      - mass splitting
      outputs:
      - Omega_S h^2
      validity: Standard thermal freeze-out.
      notes: Primary paper writes the Boltzmann equation explicitly.
    observable_ids:
    - obs_inelastic_coannihilation_relic
    constraint_ids:
    - con_relic_coannihilation_target
    likelihoods:
    - Planck relic target
    required_code_resources:
    - coannihilation solver
    validation_tests:
    - Recover the primary m_S-m_Z_prime relic curves.
    route_status: planned
    agent_notes: No numeric curve digitization was performed.
    caveats:
    - Relic curves depend strongly on fixed benchmark splitting.
  - id: route_inelastic_direct_detection
    description: Compute Higgs-mediated spin-independent scattering after inelastic Z-prime scattering
      is kinematically suppressed.
    source_model_features:
    - S/P mass splitting
    - Higgs portal
    - extra scalar mixing
    input_parameters:
    - m_S
    - theta
    - lambda_4
    - lambda_5
    - m_H
    derived_quantities:
    - sigma_SI
    forward_model_chain:
    - step_id: inelastic_check
      step_type: validation
      tool_or_code: mass-splitting recoil check
      inputs:
      - m_P - m_S
      - halo velocity
      outputs:
      - Z-prime scattering active flag
      validity: Nonrelativistic direct detection.
      notes: Primary paper notes Z-prime scattering is ineffective for sufficient splitting.
    - step_id: higgs_exchange_sigma
      step_type: analytic_formula
      tool_or_code: scalar-nucleon SI formula
      inputs:
      - scalar couplings
      - nucleon matrix elements
      outputs:
      - sigma_SI
      validity: Higgs-mediated nonrelativistic scattering.
      notes: Compare to LUX/PandaX/XENON1T and neutrino background curves.
    observable_ids:
    - obs_inelastic_direct_detection_suppression
    constraint_ids:
    - con_direct_detection_inelastic
    likelihoods:
    - direct-detection upper limits
    required_code_resources:
    - direct-detection recast
    validation_tests:
    - Check predicted sigma_SI against primary detection plots.
    route_status: planned
    agent_notes: Requires figure digitization or full model implementation for numbers.
    caveats:
    - Portal-coupling dependence.
  - id: route_indirect_annihilation
    description: Evaluate present-day S S annihilation to Z-prime pairs or Higgs-mediated final states
      and compare to gamma-ray bounds.
    source_model_features:
    - present-day suppressed annihilation
    - Z-prime hierarchy
    input_parameters:
    - m_S
    - m_Z_prime
    - g_mu_tau
    - branching fractions
    derived_quantities:
    - <sigma v>_0
    - gamma-ray final states
    forward_model_chain:
    - step_id: present_cross_section
      step_type: analytic_formula
      tool_or_code: zero-velocity annihilation cross sections
      inputs:
      - m_S
      - m_Z_prime
      - couplings
      outputs:
      - <sigma v>_0
      validity: v -> 0 limit.
      notes: Primary paper contrasts freeze-out coannihilation with present annihilation.
    - step_id: fermi_compare
      step_type: recasting
      tool_or_code: Fermi-LAT annihilation limits
      inputs:
      - <sigma v>_0
      - final states
      outputs:
      - allowed_or_excluded
      validity: Final-state dependent.
      notes: No external likelihood read in this batch.
    observable_ids:
    - obs_indirect_annihilation_signal
    constraint_ids:
    - con_fermi_annihilation
    likelihoods:
    - Fermi-LAT gamma-ray limits
    required_code_resources:
    - annihilation and gamma-ray recast
    validation_tests:
    - Check m_Z_prime < m_S regions against Fermi-LAT curves.
    route_status: planned
    agent_notes: Structured qualitatively from primary paper.
    caveats:
    - Visible branching fractions are model dependent.
  - id: route_lmutau_light_mediator
    description: Overlay relic-density contours with L_mu-L_tau mediator constraints and muon-g-2/Hubble-motivated
      regions.
    source_model_features:
    - L_mu-L_tau charge assignment
    - light Z-prime
    input_parameters:
    - m_S
    - m_Z_prime
    - g_mu_tau
    derived_quantities:
    - relic contour
    - g-2 preferred region
    - BBN/trident/BABAR exclusions
    forward_model_chain:
    - step_id: mediator_plane
      step_type: data_transform
      tool_or_code: primary-paper mediator-plane scan
      inputs:
      - m_Z_prime
      - g_mu_tau
      outputs:
      - constraint overlays
      validity: Minimal L_mu-L_tau mediator.
      notes: Primary paper shows experimental constraints and motivated regions.
    - step_id: relic_overlay
      step_type: recasting
      tool_or_code: coannihilation relic contours
      inputs:
      - m_S
      - m_Z_prime
      - g_mu_tau
      outputs:
      - viable overlap
      validity: Benchmark splitting fixed.
      notes: Overlay with muon g-2/Hubble region.
    observable_ids:
    - obs_lmutau_g2_hubble_region
    constraint_ids:
    - con_lmutau_babar_trident_bbn
    likelihoods:
    - BABAR/trident/BBN/LHC constraints
    - muon g-2 target
    required_code_resources:
    - mediator-constraint recast
    validation_tests:
    - Check surviving region against primary Fig. mt_thermal.
    route_status: planned
    agent_notes: Needs figure digitization for exact boundaries.
    caveats:
    - Mediator bounds are model dependent.
