    status: inferred
  - name: quartic potential scale/coupling
    symbol: lambda
    description: Coefficient controlling the leading phi^k part of the potential.
    range: appears in reheating and relic-density limits; benchmark normalized to 1e-10 GeV in text
    role: core
    status: inferred
  - name: effective scalar-scattering coupling
    symbol: sigma_eff_or_mu_eff
    description: Effective coupling controlling reheating through inflaton scattering to scalars.
    range: must be large enough for reheating but no inflaton decay term is present
    role: core
    status: inferred
  - name: reheating temperature
    symbol: T_RH
    description: Temperature reached after energy transfer to radiation.
    range: must exceed the BBN-scale lower bound; model-dependent formulae given for decay/scattering
