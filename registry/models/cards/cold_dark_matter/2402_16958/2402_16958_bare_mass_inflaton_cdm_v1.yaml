  - name: inflaton bare mass
    symbol: m_phi
    description: Bare quadratic mass that eventually dominates the inflaton energy density.
    range: m_phi < 350 MeV * (lambda / 1e-10 GeV)^3/5 in the scalar-scattering no-decay case quoted in
