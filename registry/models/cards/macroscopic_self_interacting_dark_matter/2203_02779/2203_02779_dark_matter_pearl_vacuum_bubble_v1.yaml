theory_to_observable_routing:
  routes:
  - id: route_pearl_detector_signal
    description: Model pearl slowing, excitation, and de-excitation to predict underground electron-recoil
      spectra and annual modulation.
    source_model_features:
    - macroscopic pearl with electron cloud
    - shielding-induced slowing
    - keV excitation/de-excitation
    input_parameters:
    - pearl radius
    - pearl mass
    - incident velocity
    - shielding column density
    - E_release
    derived_quantities:
    - terminal velocity
    - excitation probability
    - electron-recoil spectrum
    - annual modulation phase/amplitude
    forward_model_chain:
    - step_id: propagate_through_shielding
      step_type: simulation
      tool_or_code: macro-particle stopping model
      inputs:
      - pearl mass
      - radius
      - electron cloud
      - shielding geometry
      outputs:
      - terminal velocity
      - stopping depth
      validity: Requires material-specific stopping not provided as a reusable code.
      notes: Primary paper uses shielding to suppress ordinary nuclear recoils.
    - step_id: compute_detector_events
      step_type: semi_analytic_model
      tool_or_code: excitation/de-excitation rate model
      inputs:
      - stopped-pearl rate
      - E_release
      - detector response
      outputs:
      - electron event rate
      - keV spectrum
      validity: Speculative microphysics of pearl excitation.
      notes: Primary paper states the rate ratio still requires development.
    observable_ids:
    - pearl_direct_electron_recoil_35kev
    constraint_ids:
    - pearl_dama_xenon1t_rate_match
    likelihoods: []
    required_code_resources:
    - macro stopping simulation
    - DAMA/Xenon1T detector response
    validation_tests:
    - Check whether annual modulation survives pearl stopping times shorter than about a year as discussed
      by the primary paper.
    route_status: planned
    agent_notes: Route is mostly phenomenological and low robustness.
    caveats:
    - Detector signal relies on speculative de-excitation physics.
  - id: route_pearl_xray_line
    description: Predict 3.5 keV X-ray line flux from pearl collisions and cosmic-ray excitation in astrophysical
      environments.
    source_model_features:
    - pearl skin energy release
    - pearl-pearl collisions
    - cosmic-ray excitation
    input_parameters:
    - pearl abundance
    - halo density profile
    - collision cross section
    - cosmic-ray flux
    - E_skin
    derived_quantities:
    - line emissivity
    - X-ray flux
    - morphology
    forward_model_chain:
    - step_id: estimate_emissivity
      step_type: semi_analytic_model
      tool_or_code: macro collision/cosmic-ray excitation model
      inputs:
      - pearl density
      - cross section
      - relative velocity
      - cosmic-ray flux
      outputs:
      - 3.5 keV emissivity
      validity: Environment dependent and not calibrated here.
      notes: Primary paper mentions both pearl collisions and Tycho cosmic rays.
    - step_id: compare_xray_data
      step_type: recasting
      tool_or_code: X-ray line flux/morphology comparison
      inputs:
      - emissivity
      - instrument response
      outputs:
      - allowed rate region
      validity: Needs consistent treatment of contested 3.5 keV datasets.
      notes: No reusable likelihood extracted.
    observable_ids:
    - pearl_xray_35kev_line
    constraint_ids:
    - pearl_35kev_line_interpretation
    likelihoods: []
    required_code_resources:
    - X-ray line datasets
    - halo model
    - cosmic-ray model
    validation_tests:
    - Recover the model target of about 3.5 keV emission before comparing fluxes.
    route_status: planned
    agent_notes: Speculative explanatory route for line claims.
    caveats:
    - Line detections and backgrounds are disputed.
  - id: route_pearl_self_interaction_fit
    description: Fit pearl size and mass from macroscopic self-interaction cross section per mass across
      halo velocity scales.
    source_model_features:
    - macro pearl radius/mass
    - velocity-dependent collisions
    input_parameters:
    - R
    - M_pearl
    - relative velocity
    derived_quantities:
    - sigma/M
    - halo core response
    forward_model_chain:
    - step_id: compute_macro_sigma_over_mass
      step_type: analytic_formula
      tool_or_code: geometric/effective pearl collision cross section
      inputs:
      - R
      - M_pearl
      - velocity
      outputs:
      - sigma/M
      validity: Low-velocity limit emphasized in the primary paper.
      notes: Velocity dependence matters for reconciling dwarf and detector requirements.
    - step_id: compare_halo_inference
      step_type: recasting
      tool_or_code: SIDM target cross-section bands
      inputs:
      - sigma/M
      outputs:
      - preferred pearl size/mass
      validity: No model-specific halo simulations were extracted.
      notes: Primary paper uses dwarf-galaxy/cluster-motivated self-interaction values.
    observable_ids:
    - pearl_self_interaction_core_effects
    constraint_ids:
    - pearl_self_interaction_sigma_over_m
    likelihoods: []
    required_code_resources:
    - halo self-interaction target compilation
    validation_tests:
    - Check consistency between the self-interaction fit and DAMA penetration-time requirement.
    route_status: planned
    agent_notes: Useful diagnostic route but not a validated likelihood.
    caveats:
    - Astrophysical target bands are imported phenomenologically.
