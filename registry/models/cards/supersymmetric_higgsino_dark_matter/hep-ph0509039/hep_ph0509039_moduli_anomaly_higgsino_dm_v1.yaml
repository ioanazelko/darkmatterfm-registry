    100 MeV and can yield Omega_h^0 about 0.2 through the gravitino-to-Higgsino chain.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: partial
    description: Only a small fraction of modulus decays produce gravitinos, while direct Higgsino production
      is negligible.
    id: small-modulus-to-gravitino-branching
    impact_if_violated: A different branching fraction changes the relic density.
    notes: null
    scope: nonthermal abundance
    source_reference_ids:
    - arxiv:hep-ph/0509039
    status: assumed
  benchmark_implications:
  - The scenario is presented as avoiding the cosmological moduli and gravitino problems in the considered
    mass range.
  caveats:
  - No BBN or direct-detection likelihood was rerun.
  constrained_parameters:
  - m_T
  - m_3/2
  - T_R
  - Omega_h^0
  constraint_type: cosmological
  data_release: Primary paper cosmology estimate
  excluded_regions: []
  id: con_moduli_higgsino_cosmology
  likelihood_available: 'no'
  likelihood_reference: null
  name: Modulus/gravitino cosmology for nonthermal Higgsino dark matter
  notes: null
  observable_channel: cosmology
  recasting_needed: partial
  robustness: medium
  source_reference_ids:
  - arxiv:hep-ph/0509039
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - The model predates current Higgs-mass and LHC constraints.
    constraint_ids:
    - con_natural_mssm_spectrum
    - con_moduli_higgsino_cosmology
    derived_quantities:
    - weak-scale spectrum
    - Omega_higgsino
    - direct-detection cross section
    - stop/Higgsino collider targets
    description: Map mixed moduli-anomaly soft terms to nonthermal Higgsino relic, direct detection, and
      collider targets.
    forward_model_chain:
    - inputs:
      - moduli and anomaly mediated soft terms
      notes: null
      outputs:
      - weak-scale gaugino, scalar, A-term spectrum
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses the primary paper mixed mediation setup.
    - inputs:
      - m_T
      - m_3/2
      - branching to gravitinos
      notes: null
      outputs:
      - nonthermal Higgsino abundance
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Valid for the quoted late-modulus decay chain.
    - inputs:
      - Higgsino mass and mixing
      notes: null
      outputs:
      - CDMS-like direct-detection reach
      step_id: s3
      step_type: recasting
      tool_or_code: null
      validity: Qualitative in the primary paper; no likelihood implemented.
    - inputs:
      - stop and Higgsino spectrum
      notes: null
      outputs:
      - collider event targets
      step_id: s4
      step_type: simulation
      tool_or_code: null
      validity: Would require modern collider simulation for current status.
    id: route_moduli_anomaly_higgsino
    input_parameters:
    - M0
    - m_3/2
    - m_T
    - T_R
    - tan_beta
    - mu
    likelihoods:
    - No direct-detection or collider likelihood supplied.
    observable_ids:
    - obs_moduli_higgsino_nonthermal_relic
    - obs_light_higgsino_cdms_reach
    - obs_light_stop_tevatron
    required_code_resources:
    - MSSM spectrum/RGE calculator
    - neutralino direct-detection calculator
    - collider recast tools
    route_status: planned
    source_model_features:
    - mixed moduli/anomaly mediation
    - neutral Higgsino LSP
    - late modulus decay to gravitinos
    validation_tests:
    - recover neutral Higgsino mass bound below 190 GeV
    - recover Omega_h^0 about 0.2 estimate
    - check T_R about 100 MeV
