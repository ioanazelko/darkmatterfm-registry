    range: electroweak scale up to about 1 TeV for the thermal no-dilution case
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1703_10379'
    notes: The paper states that a thermally produced higgsino-like LSP heavier than about 1 TeV overcloses
      the universe without dilution.
  - name: GUT-scale gaugino masses
    symbol: M_1, M_2, M_3
    description: Non-universal bino, wino, and gluino soft masses at the gauge-coupling unification scale.
    range: null
