    role: core
    status: assumed
    source_reference_ids:
    - '1703_10379'
    notes: null
  - name: universal scalar mass and A-term
    symbol: m_0, A_0
    description: Soft scalar mass and trilinear term assumed universal while gaugino masses are non-universal.
    range: null
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1703_10379'
    notes: null
  nuisance: []
  derived:
