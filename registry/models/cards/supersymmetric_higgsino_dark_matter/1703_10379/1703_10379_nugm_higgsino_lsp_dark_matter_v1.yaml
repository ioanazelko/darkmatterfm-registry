  - non-universal gaugino mass higgsino LSP
  short_description: An MSSM scenario with non-universal GUT-scale gaugino masses in which a relatively
    light higgsino-like lightest neutralino is stabilized by R-parity and can provide all or part of the
    dark matter depending on thermal or non-thermal abundance assumptions.
  historical_origin_or_motivation: The paper motivates the scenario as a way to keep the higgsino mass
    near the electroweak scale while obtaining a 125 GeV Higgs boson and viable dark-matter phenomenology.
  status: speculative
  model_kind: complete_theory
