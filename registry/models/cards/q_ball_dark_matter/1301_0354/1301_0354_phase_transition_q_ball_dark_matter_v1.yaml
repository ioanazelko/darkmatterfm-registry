  notes: The paper quotes Q around 1e19-1e22 in viable regions.
- id: x_particles_trapped
  applies_to: dark-sector transport
  condition: X-particle mass in the new phase is sufficiently larger than the temperature that residual
    free X density is negligible.
  status: assumed
  extrapolation_risk: high
  caveats:
