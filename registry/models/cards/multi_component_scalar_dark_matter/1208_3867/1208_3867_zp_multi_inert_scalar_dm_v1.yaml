    symbol: q
    description: Additive modulo-p charge of inert scalar dark matter candidates.
    range: nonzero and coprime with p when forbidding decays and lower multiparticle annihilations to
      SM fields
    role: core
    status: established
    source_reference_ids:
    - '1208_3867'
  - name: inert scalar masses
    symbol: m_d, m_D, m_z_i
