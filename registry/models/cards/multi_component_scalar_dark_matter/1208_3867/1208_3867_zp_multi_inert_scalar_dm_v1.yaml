    symbol: lambda_i
    description: Quartic and interaction coefficients in the multi-Higgs potential.
    range: free renormalizable couplings; no serious fine-tuning imposed beyond symmetry-invariant terms
    role: core
    status: assumed
    source_reference_ids:
    - '1208_3867'
