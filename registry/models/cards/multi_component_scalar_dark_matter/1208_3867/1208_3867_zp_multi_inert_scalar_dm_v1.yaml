identity:
  name: Zp-protected multi-inert Higgs-doublet scalar dark matter
  family: multi_component_scalar_dark_matter
  aliases:
  - Z_p-stabilized scalar dark matter in NHDM
  - multi-inert doublet scalar dark matter
  short_description: A class of multi-Higgs-doublet dark sectors in which neutral scalars from inert doublets
    carry nonzero cyclic Zp charge, remain stable after electroweak symmetry breaking, and can deplete
    through direct annihilation, semi-annihilation, or multiparticle semi-annihilation.
  historical_origin_or_motivation: Uses realizable finite Abelian symmetries of multi-Higgs-doublet potentials
    to stabilize scalar dark matter without imposing an ad hoc Z2 only.
  status: speculative
  model_kind: phenomenological_parameterization
theory:
  theory_level: phenomenological_parameterization
  parent_frameworks:
  - multi-Higgs-doublet models
  - inert doublet dark matter
  - finite Abelian scalar-sector symmetries
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The thesis gives renormalizable scalar potentials for Z3 3HDM and Z7 4HDM examples, with only
    the SM-like doublet acquiring a vev and coupling to fermions.
particle_content:
  dark_matter_candidate:
    name: lightest nonzero-Zp inert neutral scalar d
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: unknown
  additional_dark_sector_particles:
  - heavier inert neutral scalars such as D, z_2, z_3, z_4
  - charged inert scalars w_i^+
  mediators:
  - SM-like Higgs boson h
  - electroweak gauge bosons
  - heavier inert scalars
  dark_radiation_species: []
  excited_or_degenerate_states:
  - multiple inert scalar states with different Zp charges
  long_lived_particles:
  - lightest nonzero-Zp charged neutral scalar
  unstable_parent_particles:
  - heavier inert scalars that cascade to the lightest dark scalar plus SM particles
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact unbroken cyclic Zp symmetry remains after electroweak symmetry breaking;
    SM fields have q=0 and dark scalars have nonzero, often coprime, Zp charge.
  symmetries:
  - name: Z_p
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken after electroweak symmetry breaking when only the SM-like Higgs doublet has a vev
    breaking_scale: null
  - name: electroweak SU(2)L x U(1)Y
    type: gauge
    exact_or_approximate: broken
    breaking: broken by the SM-like Higgs doublet vev
    breaking_scale:
      name: electroweak vev
      symbol: v
      value: '246'
      unit: GeV
      role: core
      status: established
      source_reference_ids:
      - '1208_3867'
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - SM-like Higgs boson
  - electroweak gauge bosons
  - Standard Model fermions through the SM-like doublet
  dark_sector_couplings:
  - Zp-invariant quartic terms among inert and SM-like doublets
  - Higgs-portal couplings h d d* and higher dark-scalar interactions
  mediator_types:
  - scalar Higgs
  - electroweak gauge boson
  - inert scalar
  interaction_operators:
  - dd* X_SM direct annihilation
  - dd -> d* X_SM semi-annihilation in Z3 examples
  - multiparticle semi-annihilation chains in larger Zp examples
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - d d* to Standard Model states
  - semi-annihilation d d to d* plus Standard Model states
  - multiparticle semi-annihilation in asymmetric scenarios
  decay_channels: []
  self_scattering_channels:
  - dark scalar elastic scattering among Zp-charged states
  cp_structure: The thesis also classifies generalized CP symmetries, but the dark matter construction
    mainly uses unitary Zp charge assignments.
  flavor_structure: Only the SM-like Higgs doublet is required to couple to fermions; inert doublets are
    protected by Zp charges.
  tree_or_loop_level: tree
parameters:
  core:
  - name: cyclic symmetry order
    symbol: p
    description: Order of the stabilizing Zp group.
    range: examples include p=3 in 3HDM and p=7 in 4HDM; thesis discusses realizable Zp groups in NHDM
    role: core
    status: established
    source_reference_ids:
    - '1208_3867'
