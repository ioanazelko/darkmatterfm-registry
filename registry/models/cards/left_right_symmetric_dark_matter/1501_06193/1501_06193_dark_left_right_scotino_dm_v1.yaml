identity:
  name: Dark left-right scotino dark matter
  family: left_right_symmetric_dark_matter
  aliases:
  - DLRM fermionic dark matter
  - scotino dark matter
  short_description: A dark left-right gauge-model dark matter scenario in which the neutral component
    of a right-handed lepton doublet is a Majorana fermion stabilized by generalized R-parity and coupled
    mainly to leptons through a charged triplet Higgs.
  historical_origin_or_motivation: The paper uses the DLRM setup to address the AMS-02 positron excess
    and the muon anomalous magnetic moment while maintaining the observed dark matter relic abundance.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - dark left-right gauge model
  - alternative left-right model
  - SU(3)_C x SU(2)_R x SU(2)_L x U(1)_S
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The text gives the gauge group, scalar content, scalar potential terms, symmetry assignments,
    and the key Yukawa interactions; it adopts the DLRM rather than presenting every full Lagrangian term.
particle_content:
  dark_matter_candidate:
    name: n_R scotino, the neutral component of the right-handed lepton doublet
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - right-handed lepton doublet
  - right-handed quark doublet
  - quark singlet x_L
  - scalar bi-doublet
  - left and right scalar doublets
  - left and right hypercharge +1 triplet Higgs fields
  mediators:
  - charged right-handed triplet Higgs Delta_R+
  - doubly charged triplet Higgs Delta_R++
  - heavy W_R and Z' gauge bosons
  dark_radiation_species: []
  excited_or_degenerate_states:
  - charged triplet Higgs nearly degenerate with the dark matter in co-annihilation benchmarks
  long_lived_particles:
  - lightest R-parity-odd n_R state
  unstable_parent_particles:
  - heavier R-parity-odd states
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The lightest generalized-R-parity-odd particle is stable; the paper chooses n_R
    as that dark matter state.
  symmetries:
  - name: U(1)_S
    type: global
    exact_or_approximate: broken
    breaking: SU(2)_R x U(1)_S breaking leaves generalized lepton number L = S - T_3R.
    breaking_scale: null
  - name: generalized R-parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken for the lightest odd state in the dark matter setup
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  standard_model_targets:
  - muons
  - charged leptons
  - neutrinos
  dark_sector_couplings:
  - Yukawa coupling c_d between n_R, muon, and Delta_R+
  - term Delta_R n_R n_R generating the dark matter mass
  - annihilation to muonic final states through t-channel charged triplet Higgs exchange
  mediator_types:
  - charged scalar
  - doubly charged scalar
  - heavy gauge boson
  interaction_operators:
  - n_R n_R Delta_R mass/Yukawa term
  - leptophilic t-channel charged-triplet interaction
  - internal bremsstrahlung contribution to late-time annihilation
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: strong
    spin_dependence: unknown
  annihilation_channels:
  - n_R n_R to mu+ mu- through Delta_R+ exchange
  - n_R n_R to mu+ mu- gamma through internal bremsstrahlung
  decay_channels: []
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: The benchmark is leptophilic and mainly muonic because the charged triplet Higgs does
    not couple to quarks and the AMS-02 fit uses muon final states.
  tree_or_loop_level: both
