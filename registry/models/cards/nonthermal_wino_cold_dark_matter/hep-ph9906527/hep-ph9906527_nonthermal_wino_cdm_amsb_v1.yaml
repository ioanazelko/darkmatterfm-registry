parameters:
  core:
  - name: Wino-like LSP mass
    symbol: m_chi
    description: Mass of the neutral Wino-like LSP.
    range: benchmarks 100-300; Omega h^2 can be O(1) below about 200 for N_LSP near 1
    unit: GeV
    role: core
    status: inferred
  - name: modulus mass
    symbol: m_phi
    description: Mass of the cosmological modulus field, identified with the 10-100 TeV gravitino/moduli
      scale in the scenario.
    range: 100-300 in figures; natural scale 10-100
    unit: TeV
    role: core
    status: inferred
  - name: reheating temperature after modulus decay
    symbol: T_R
    description: Reheating temperature from modulus decay.
    range: 1-10
    unit: MeV
    role: core
    status: inferred
  - name: LSP multiplicity per modulus decay
    symbol: N_LSP
    description: Average number of LSPs produced in one modulus decay.
    range: 1e-4 to 1, with 1e-3 to 1e-4 favorable over broad Wino masses
    role: core
    status: inferred
  - name: modulus effective suppression scale
    symbol: Lambda_eff
    description: Effective scale suppressing modulus interactions.
    value: of order reduced Planck scale for unsuppressed two-body decays
    unit: GeV
    role: core
    status: assumed
  nuisance:
  - name: Higgsino mass parameter
    symbol: mu
    description: Controls Wino-Higgsino mixing and direct-detection couplings.
    unit: GeV
    role: nuisance
    status: assumed
  - name: tan beta
    symbol: tan_beta
    description: Ratio of Higgs vacuum expectation values entering direct-detection couplings.
    role: nuisance
    status: assumed
  derived:
  - name: thermal Wino abundance
    symbol: Omega_chi_thermal h^2
    description: Thermal relic density estimate for a Wino-like LSP.
    value: 5e-4*(m_chi/100 GeV)^2
    role: derived
    status: approximate
  - name: annihilation cross section to W pairs
    symbol: <sigma v>_WW
    description: The nonrelativistic Wino annihilation cross section is given analytically and numerically
      for 100-300 GeV masses.
    value: 3.8e-24 cm^3/s at 100 GeV; 0.9e-24 cm^3/s at 300 GeV
    unit: cm^3/s
    role: derived
    status: approximate
