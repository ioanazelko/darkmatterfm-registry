  applies: parameter_dependent
  assumptions: []
  benchmark_implications:
  - A light mediator is required and the allowed band is velocity dependent.
  caveats:
  - Cluster and dwarf constraints are not a single-velocity bound.
  constrained_parameters:
  - sigma_T/m_X
  - m_X
  - m_h2
  - alpha_X
  constraint_type: astrophysical
  data_release: null
  excluded_regions:
  - Cluster-scale self-scattering around or above 1 cm^2/g is disfavored in the primary discussion.
  id: con_1710_self_interaction_window
  likelihood_available: 'no'
  likelihood_reference: null
  name: Dwarf-scale self-interaction target with cluster upper bound
  notes: Small-scale motivation and target window are supported by primary and related local texts.
  observable_channel: halo structure
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - p_1710_00320
  - rel_1103_0007_tbtf
- allowed_regions:
  - Simultaneously viable region requires m_h2 at most O(keV) according to the primary paper.
  applies: 'yes'
  assumptions:
  - can_be_relaxed: partial
    description: The dark Higgs abundance and lifetime are computed with the freeze-in initial condition
      and no hidden-sector thermalization with the SM.
    id: assume_1710_mediator_decay
    impact_if_violated: Changing the production history would alter BBN/CMB/AMS exclusions.
    notes: null
    scope: indirect constraints
    source_reference_ids:
    - p_1710_00320
    status: assumed
  benchmark_implications:
  - Indirect probes dominate over direct detection in the viable freeze-in scenario.
  caveats:
  - This enrichment did not reconstruct the AMS-02 or diffuse X-ray likelihoods.
  constrained_parameters:
  - m_h2
  - tau_h2
  - Omega_h2
  - m_X
  - alpha_X
  constraint_type: cosmological
  data_release: Planck CMB, AMS-02, diffuse gamma/X-ray bounds as recast by the primary paper
  excluded_regions:
  - Most freeze-in self-interaction regions with heavier/longer-lived mediators are excluded by combined
    indirect constraints.
  id: con_1710_indirect_bounds
  likelihood_available: approximate
  likelihood_reference: null
  name: BBN/CMB/AMS-02/diffuse-radiation mediator constraints
  notes: Fermi dwarfs are logged as related context; primary text supplies the combined viability result.
  observable_channel: late decays and energy injection
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - p_1710_00320
  - rel_1503_02641_fermi_dwarfs
- allowed_regions:
  - The primary paper states LUX bounds are easily satisfied because freeze-in makes the Higgs portal
    extremely small.
  applies: 'yes'
  assumptions: []
  benchmark_implications:
  - Direct detection is weak in the preferred freeze-in region.
  caveats:
  - A quantitative cross-section curve was not extracted.
  constrained_parameters:
  - lambda_portal
  - m_X
  - m_h2
  constraint_type: direct_detection
  data_release: LUX complete-exposure result as cited by the primary paper
  excluded_regions: []
  id: con_1710_lux_direct
  likelihood_available: 'no'
  likelihood_reference: null
  name: LUX direct-detection bound in the freeze-in limit
  notes: Higgs-portal review source supports the broader portal context.
  observable_channel: nuclear recoils
  recasting_needed: partial
  robustness: medium
  source_reference_ids:
  - p_1710_00320
  - rel_2104_03342_higgs_portal_review
theory_to_observable_routing:
  routes:
  - agent_notes: The route is defined from the primary paper but not numerically rerun here.
    caveats:
    - No public likelihood bundle was resolved.
    constraint_ids:
    - con_1710_self_interaction_window
    - con_1710_indirect_bounds
    - con_1710_lux_direct
    derived_quantities:
    - Omega_X h^2
    - sigma_T/m_X(v)
    - tau_h2
    - indirect-exclusion regions
    description: Solve freeze-in production through the Higgs portal, include electroweak-phase-transition
      effects, then overlay self-scattering and mediator-decay constraints.
    forward_model_chain:
    - inputs:
      - initial negligible dark-sector abundance
      - Higgs-portal production channels
      notes: null
      outputs:
      - freeze-in yields for X and h2
      step_id: r1710_s1
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Primary equations include electroweak broken and symmetric phases.
    - inputs:
      - m_X
      - m_h2
      - alpha_X
      notes: null
      outputs:
      - velocity-dependent sigma_T/m_X
      step_id: r1710_s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Born/classical/resonant regimes must be selected consistently.
    - inputs:
      - h2 abundance and lifetime
      notes: null
      outputs:
      - BBN/CMB/AMS/diffuse-radiation exclusions
      step_id: r1710_s3
      step_type: recasting
      tool_or_code: null
      validity: Requires recasting external indirect bounds.
    id: route_1710_freezein_selfinteraction
    input_parameters:
    - m_X
    - m_h2
    - alpha_X
    - portal mixing/coupling
    likelihoods:
    - BBN decay constraints
    - Planck CMB energy-injection constraints
    - AMS-02/diffuse radiation bounds
    - LUX direct-detection bound
    observable_ids:
    - obs_1710_self_interaction
    - obs_1710_indirect_decays
    - obs_1710_direct_detection_null
    required_code_resources:
    - Boltzmann-equation integrator
    - self-scattering transfer-cross-section module
    route_status: planned
    source_model_features:
    - feeble Higgs portal
    - light dark Higgs mediator
    - abelian vector dark matter
    validation_tests:
    - Recover observed relic abundance near Omega_X h^2 = 0.12.
    - Check dwarf-scale and cluster-scale cross-section limits at their characteristic velocities.
