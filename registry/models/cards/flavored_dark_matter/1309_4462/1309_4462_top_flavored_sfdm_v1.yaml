identity:
  name: Top-flavored supersymmetric flavored dark matter
  family: flavored_dark_matter
  aliases:
  - top flavored dark matter
  - SFDM top-flavor fermion dark matter
  short_description: A minimal-flavor-violation supersymmetric flavored dark matter model in which the
    stable dark matter is a top-flavored vector-like fermion chi_t from a gauge-singlet SU(3)_u flavor
    triplet, interacting with right-handed top quarks through a colored mediator.
  historical_origin_or_motivation: Motivated by replacing R-parity as the dark matter stabilizer with
    flavor triality in MFV supersymmetry while retaining weak-scale thermal relic dark matter.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - minimal flavor violation
  - supersymmetric flavored dark matter
  - R-parity-violating supersymmetry
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the SFDM superpotential W = M_X X_i X^i + M_Y Y Ybar + lambda X_i Y u^i and specializes
    to fermionic top-flavored dark matter.
particle_content:
  dark_matter_candidate:
    name: top-flavored fermion chi_t
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - flavor partners chi_u and chi_c
  - scalar components of X_i
  - vector-like mediator multiplet Y and conjugate Ybar
  mediators:
  - colored scalar mediator with right-handed-top quantum numbers
  - loop-induced Z boson coupling
  dark_radiation_species: []
  excited_or_degenerate_states:
  - up- and charm-flavored partners can be heavier or nearly degenerate depending on flavor splittings
  long_lived_particles: []
  unstable_parent_particles:
  - colored mediator decays to top quark plus dark matter
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Minimal Flavor Violation implies a residual Z3 flavor triality under which Standard
    Model fields are neutral and the flavored dark matter multiplet is charged; chi_t is stable when it
    is the lightest new-sector state.
  symmetries:
  - name: flavor triality Z3
    type: discrete
    exact_or_approximate: exact
    breaking: would be spoiled by flavor-triality-charged Majorana mass spurions or non-MFV terms
    breaking_scale: null
  - name: quark flavor group SU(3)_Q x SU(3)_u x SU(3)_d
    type: global
    exact_or_approximate: approximate
    breaking: broken only by Yukawa spurions in the MFV hypothesis
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  - vector
  standard_model_targets:
  - right-handed top quark
  - top-antitop final states
  - Z boson through a one-loop effective coupling
  dark_sector_couplings:
  - lambda_t chi_t t_R mediator coupling
  - flavor-splitting terms from non-holomorphic Kahler potential contributions
  mediator_types:
  - colored scalar mediator
  - Z boson at one loop
  interaction_operators:
  - X_i Y u^i superpotential coupling
  - lambda_t chi_t t_R mediator component interaction
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - chi_t anti-chi_t -> t anti-t through t-channel scalar mediator
  decay_channels: []
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: top-flavored SU(3)_u triplet with MFV Yukawa spurion splittings
  tree_or_loop_level: both
parameters:
