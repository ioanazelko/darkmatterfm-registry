schema_version: model_only_v0
model_id: 1303_0332_top_flavored_dark_matter_v1
identity:
  name: Top-flavored dark matter
  family: flavored_dark_matter
  aliases:
  - TFDM
  short_description: A simplified model in which the dark matter state is the top-flavored component of
    a Dirac fermion flavor multiplet and couples to right-handed up-type quarks through a color-triplet
    scalar mediator.
  historical_origin_or_motivation: Proposed in the paper to connect the Tevatron top forward-backward
    asymmetry with dark matter while preserving minimal flavor violation.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - minimal flavor violation
  - flavored dark matter
  - top-sector simplified model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes mass and interaction terms for a Dirac flavor multiplet chi and a color-triplet
    scalar mediator phi; an optional small Majorana splitting is treated as a flavor-breaking deformation.
particle_content:
  dark_matter_candidate:
    name: top-flavored Dirac fermion chi_t
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - flavor partners chi_u and chi_c
  mediators:
  - color-triplet scalar phi with electric charge +2/3
  - loop-induced Z boson coupling
  dark_radiation_species: []
  excited_or_degenerate_states:
  - optional Majorana-split states chi_1 and chi_2
  long_lived_particles: []
  unstable_parent_particles:
  - scalar mediator phi decaying to top quark plus chi_t
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Minimal flavor violation makes the flavored dark matter multiplet stable without
    adding a separate dark parity in the core model.
  symmetries:
  - name: quark flavor symmetry G_q
    type: global
    exact_or_approximate: broken
    breaking: broken only by Yukawa spurions in the MFV construction; an optional Majorana mass is outside
      MFV
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - other
  standard_model_targets:
  - right-handed up-type quarks
  - top quark
  - Z boson
  - SM fermions lighter than the top
  dark_sector_couplings:
  - g_u coupling of chi_u to u_R through phi
  - g_c coupling of chi_c to c_R through phi
  - g_t coupling of chi_t to t_R through phi
  mediator_types:
  - color-triplet scalar mediator
  - loop-induced electroweak vector mediator
  interaction_operators:
  - q_R (g0 + g1 Yu^dagger Yu + ...) phi chi + h.c.
  - loop-induced chi_t gamma^mu P_L chi_t Z_mu
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: mild
    velocity_dependence: none
    spin_dependence: both
  annihilation_channels:
  - chi_t anti-chi_t -> f anti-f through loop-induced Z exchange
  - chi_1 chi_2 coannihilation through Z exchange when a Majorana splitting is present
  decay_channels:
  - phi -> t chi_t when kinematically open
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: The chi multiplet transforms nontrivially under the quark flavor symmetry; top Yukawa
    insertions split chi_t from chi_u and chi_c and allow g_t to differ from g_u and g_c.
  tree_or_loop_level: both
operators:
  renormalizable_terms:
  - Dirac mass terms for chi_u, chi_c, and chi_t
  - renormalizable scalar-mediated couplings to right-handed up-type quarks
  eft_operators:
  - dimension-six Higgs-current operator inducing the Z coupling after electroweak symmetry breaking
  contact_or_light_mediator: light_mediator
  coupling_types:
  - flavor-dependent scalar coupling
  - loop-induced vector and axial-vector Z coupling
parameters:
  core:
  - name: top-flavored dark matter mass
    symbol: m_chi_t
    description: Mass of the lightest top-flavored component of the chi multiplet.
    range: 20 GeV to 90 GeV favored by the collider and relic-density discussion
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1303.0332'
  - name: up-flavored partner mass
    symbol: m_chi_u
    description: Mass of the heavier chi_u and approximately chi_c flavor partners.
    range: larger than m_phi so that phi -> u chi_u and phi -> c chi_c are kinematically blocked in the
      discussed region
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1303.0332'
  - name: scalar mediator mass
    symbol: m_phi
    description: Mass of the color-triplet scalar mediator.
    range: near the top threshold in the top-asymmetry region; examples fix m_phi - m_chi_t around m_t
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1303.0332'
  - name: top-flavor coupling
    symbol: g_t
    description: Coupling of chi_t and the scalar mediator to the right-handed top quark.
    range: perturbative range, with order-one values used for the asymmetry and relic-density discussion
    role: core
    status: assumed
    source_reference_ids:
    - '1303.0332'
  - name: up-flavor coupling
    symbol: g_u
    description: Coupling of chi_u and the scalar mediator to the right-handed up quark.
    value: g_u approximately g_c from the leading MFV term
    role: core
    status: assumed
    source_reference_ids:
    - '1303.0332'
  - name: optional Majorana splitting
    symbol: delta_m
    description: Flavor-breaking splitting of the Dirac chi_t into two Majorana states.
    range: about 100 keV to GeV in the direct-detection and coannihilation discussion
    unit: GeV
    role: core
    status: speculative
    source_reference_ids:
    - '1303.0332'
mass_scales_and_hierarchies:
  scales:
  - name: Z resonance region
    symbol: m_Z/2
    description: Resonant annihilation through the Z is emphasized near half the Z mass.
    value: near 45 GeV
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1303.0332'
  hierarchy_questions:
  - question: Which flavored state is the dark matter?
    answer: Yukawa-induced mass corrections are assumed large and negative so that chi_t is lighter than
      chi_u and chi_c.
    status: assumed
  - question: Can direct detection be weakened without losing the relic density?
    answer: A small Majorana splitting makes the vector Z interaction inelastic while coannihilation can
      preserve the freeze-out abundance if the splitting is not too large.
    status: speculative
production:
  mechanisms:
  - thermal freeze-out through loop-induced Z-mediated annihilation to SM fermions
  - optional Majorana-state coannihilation through the Z
  - possible asymmetric-dark-matter low-mass variant
  thermal_equilibrium_with_standard_model: 'yes'
  thermal_equilibrium_with_hidden_sector: unknown
  abundance_set_by:
  - loop coefficient a_Z enhanced by the top mass
  - m_chi_t relative to the Z pole
  - coupling g_t
  - possible Majorana splitting delta_m
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: 'no'
  notes: The paper computes the thermal annihilation integral numerically, especially near the Z pole,
    and states that the correct relic density can be achieved in the mass range preferred by collider
    considerations.
