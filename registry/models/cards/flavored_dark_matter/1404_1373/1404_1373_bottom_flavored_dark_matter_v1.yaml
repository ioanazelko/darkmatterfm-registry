  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_chi_b
    description: Mass range used for the gamma-ray-excess thermal relic interpretation.
    range: 31-40
    unit: GeV
    role: core
    status: inferred
  - name: colored scalar mediator mass
    symbol: m_phi
    description: Mediator constrained by sbottom-like LHC searches.
    range: greater than about 725 for 30-40 GeV dark matter in the paper discussion
    unit: GeV
    role: core
    status: inferred
  - name: bottom coupling
    symbol: lambda_b
    description: Effective coupling lambda_0 y_b controlling annihilation to bottom quarks.
    range: about 2.16 for m_chi=40 GeV and m_phi=725 GeV benchmark
    role: core
    status: inferred
  - name: annihilation cross section
    symbol: sigma_v
    description: Thermal averaged annihilation cross section to b anti-b.
    range: 4.4e-26 cm^3/s benchmark for Dirac thermal relic; gamma-ray fit cited as 1.7-2.3e-26
    unit: cm^3/s
    role: core
    status: inferred
  - name: MFV mass splitting parameters
    symbol: m_0, m_u, m_d
    description: Flavor-spurion mass parameters that split chi_b from other flavor states.
    range: chosen so chi_b is lightest
    role: core
    status: inferred
