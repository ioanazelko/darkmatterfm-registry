identity:
  name: Bottom flavored dark matter
  family: flavored_dark_matter
  aliases:
  - b FDM
  - bottom-coupled flavored dark matter
  short_description: A Dirac fermion flavor-triplet dark matter model whose lightest b-flavored component
    annihilates to bottom quarks through a colored scalar mediator.
  historical_origin_or_motivation: Constructed to explain a Galactic Center gamma-ray excess with a 31-40
    GeV thermal relic annihilating dominantly to bottom quarks while respecting flavor safety.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - flavored dark matter
  - minimal flavor violation
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives renormalizable mass and Yukawa-like couplings for a Dirac fermion flavor triplet
    and a colored scalar mediator, with possible SUSY UV completion discussed.
