  long_lived_particles:
  - chi_b dark matter
  unstable_parent_particles:
  - heavier flavor partners decay to chi_b
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Flavor triality, a remnant Z3 of color and quark flavor symmetries under the
    MFV setup, stabilizes the dark matter candidate.
  symmetries:
  - name: Flavor Triality
    type: discrete
    exact_or_approximate: exact
    breaking: not_applicable
    breaking_scale: null
  - name: U(3)_Q flavor symmetry assignment
    type: global
    exact_or_approximate: approximate
    breaking: Broken by Standard Model Yukawa spurions in MFV.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  standard_model_targets:
  - right-handed down-type quarks
  - bottom quarks
  dark_sector_couplings:
  - lambda_b chi_b b phi coupling
  - flavor diagonal chi_i d_j coupling matrix
  mediator_types:
  - colored scalar with right-handed sbottom-like gauge quantum numbers
  interaction_operators:
  - lambda_ij chi_i d_j^c phi interaction
  annihilation_channels:
  - chi_b anti-chi_b to b anti-b through t-channel phi
  decay_channels:
