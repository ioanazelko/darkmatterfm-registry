  - name: X particle mass
    symbol: M_X
    description: Mass of the stable dark-matter species produced during reheating.
    range: can be much larger than T_RH; interesting abundance is shown up to about 2000 T_RH, with a
      numerical example M_X = 1.15e12 GeV
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph9809453
  - name: reheat temperature
    symbol: T_RH
    description: Temperature below which the universe behaves as radiation dominated; not the maximum
      temperature during reheating.
    range: examples discuss T_RH = 1e9 GeV and gravitino-motivated upper bounds around 1e9-1e10 GeV
    unit: GeV
    role: cosmological
    status: inferred
    source_reference_ids:
    - hep-ph9809453
  - name: effective relativistic degrees of freedom
    symbol: g_*
    description: Number of relativistic degrees of freedom in the radiation density entering T_RH and
      the X abundance estimate.
    value: 200 used as the normalization in the analytic abundance formula
    unit: null
    role: cosmological
    status: assumed
    source_reference_ids:
    - hep-ph9809453
  - name: thermally averaged production cross section times Moller flux factor
    symbol: '|v|'
    description: Effective X pair production/annihilation factor in the Boltzmann equations and relic-density
      formula.
    range: model dependent; the text notes dimensionless alpha_X may be order unity or small
    unit: GeV^-2
    role: core
    status: assumed
    source_reference_ids:
    - hep-ph9809453
  nuisance: []
  derived:
  - name: present X density contribution
    symbol: Omega_X h^2
    description: Analytic estimate for the stable X relic density after reheating.
    value: approximately M_X^2 |v| (g_*/200)^(3/2) (2000 T_RH/M_X)^7
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
