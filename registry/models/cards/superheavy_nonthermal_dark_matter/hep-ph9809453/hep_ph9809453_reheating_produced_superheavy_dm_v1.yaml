  - name: maximum reheating temperature ratio
    symbol: T_MAX/T_RH
    description: The paper emphasizes that the maximum temperature can greatly exceed T_RH during reheating.
    value: about 1e3 for a chaotic-inflation illustration with T_RH = 1e9 GeV
