theory_to_observable_routing:
  routes:
  - id: route_freezeout_to_21cm
    description: Map resonant p-wave freeze-out onto a small millicharged abundance and then onto cosmic-dawn
      baryon cooling.
    source_model_features:
    - millicharged subcomponent
    - near-resonant invisible A-prime
    - velocity-dependent electromagnetic scattering
    input_parameters:
    - m_phi
    - f_DM
    - epsilon
    - m_Aprime
    - e_D
    derived_quantities:
    - thermal relic fraction
    - baryon cooling rate
    - global 21-cm brightness temperature
    forward_model_chain:
    - step_id: s1
      step_type: analytic_formula
      tool_or_code: A-prime mediated annihilation formulae in primary paper
      inputs:
      - m_phi
      - m_Aprime
      - e_D
      - epsilon
      outputs:
      - freeze-out annihilation cross section
      validity: near resonance xi > 1
      notes: Primary paper uses p-wave annihilation close to resonance.
    - step_id: s2
      step_type: boltzmann_solver
      tool_or_code: null
      inputs:
      - annihilation cross section
      - thermal history
      outputs:
      - f_DM
      validity: standard freeze-out assumptions
      notes: Compute small relic fraction.
    - step_id: s3
      step_type: semi_analytic_model
      tool_or_code: 21-cm baryon cooling model
      inputs:
      - f_DM
      - epsilon
      - m_phi
      outputs:
      - T21 absorption amplitude
      validity: EDGES interpretation only
      notes: Requires astrophysical assumptions for the cosmic-dawn signal.
    observable_ids:
    - obs_cosmic_dawn_21cm_absorption
    constraint_ids:
    - cons_edges_fraction_window
    - cons_neff_lower_mass
    likelihoods: []
    required_code_resources: []
    validation_tests:
    - Reproduce quoted mass/fraction windows before scanning xi and e_D.
    route_status: planned
    agent_notes: No code artifact was identified in the paper text; route is a reconstruction plan.
    caveats:
    - EDGES signal systematics and astrophysics remain external.
  - id: route_dark_photon_collider
    description: Recast invisible dark-photon searches into the EDGES-motivated near-resonant parameter
      space.
    source_model_features:
    - A-prime invisibly decays to DM pairs
    - kinetic mixing with electromagnetic current
    input_parameters:
    - epsilon
    - m_Aprime
    - e_D
    - m_phi
    derived_quantities:
    - invisible A-prime production rate
    - missing-energy exclusion
    forward_model_chain:
    - step_id: s1
      step_type: analytic_formula
      tool_or_code: dark photon production cross sections
      inputs:
      - epsilon
      - m_Aprime
      outputs:
      - A-prime event rate
      validity: valid for lepton fixed-target/collider setup
      notes: Select the appropriate BaBar, NA64, Belle II, or LDMX production mode.
    - step_id: s2
      step_type: recasting
      tool_or_code: null
      inputs:
      - A-prime event rate
      - invisible branching fraction
      outputs:
      - excluded parameter region
      validity: experiment-specific acceptances needed
      notes: No likelihood is supplied by the primary paper.
    observable_ids:
    - obs_invisible_dark_photon_search
    constraint_ids:
    - cons_invisible_aprime_bounds
    likelihoods: []
    required_code_resources: []
    validation_tests:
    - Check invisible branching ratio is near unity.
    route_status: planned
    agent_notes: Collider route needs external experimental efficiencies.
