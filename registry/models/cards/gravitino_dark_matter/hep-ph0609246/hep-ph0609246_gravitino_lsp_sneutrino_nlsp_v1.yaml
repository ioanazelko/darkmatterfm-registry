    with thermal and nonthermal histories controlling the abundance.
  historical_origin_or_motivation: Motivated by gravitino dark matter in local supersymmetry and by the
    possibility that a sneutrino is the lightest MSSM-sector superparticle, relaxing late-decay cosmology
    relative to other NLSP choices.
