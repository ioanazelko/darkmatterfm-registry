identity:
  name: Gravitino dark matter from gravitational gauge mediation
  family: gravitino_dark_matter
  aliases:
  - gauge mediation in supergravity gravitino dark matter
  short_description: A gauge-mediated supersymmetry-breaking model in supergravity where coherent oscillations
    and late decays of a singlet field S nonthermally produce gravitino dark matter.
  historical_origin_or_motivation: The paper seeks a cosmologically viable gauge-mediation model that
    avoids singlet-field and gravitino overproduction problems while explaining the dark-matter abundance.
  status: speculative
  model_kind: complete_theory
