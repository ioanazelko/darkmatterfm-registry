identity:
  name: Dynamical matter-parity breaking gravitino dark matter
  family: gravitino_dark_matter
  aliases:
  - hidden-sector matter-parity breaking gravitino LSP
  - B-L embedded matter-parity violating gravitino dark matter
  short_description: A supersymmetric gravitino dark matter model where matter parity descends from gauged
    U(1)_{B-L} and is broken dynamically at low scale by a hidden SU(2) sector, inducing small bilinear
    matter-parity violation.
  historical_origin_or_motivation: Designed to reconcile gravitino dark matter and thermal leptogenesis
    with early NLSP decays before BBN.
  status: speculative
