  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The gravitino is not absolutely stable; it is cosmologically long-lived because
    decay is suppressed by both the inverse Planck mass and tiny R-parity-violating couplings.
  symmetries:
  - name: R-parity
    type: discrete
    exact_or_approximate: broken
    breaking: slight explicit/effective violation with couplings in the approximate range 1e-14 to 1e-7
    breaking_scale: null
  - name: B-L
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by 16 and 16bar fields at v_B-L
    breaking_scale:
      name: B-L breaking scale
      symbol: v_B-L
      description: Scale whose powers suppress effective RPV couplings.
      value: v_B-L
      role: core
      status: assumed
      source_reference_ids:
      - 0710_2287
  - name: U(1)_R
    type: global
    exact_or_approximate: broken
    breaking: introduced to suppress dangerous RPV terms while allowing small effective violation
    breaking_scale: null
  topological_defects_possible: unknown
