    symbol: Omega_3/2 h^2
    description: Thermal gravitino abundance scaling with T_R, m_3/2 and m_g.
    value: 0.27 * (T_R/1e10 GeV) * (100 GeV/m_3/2) * (m_g/1 TeV)^2
    role: derived
