identity:
  name: Broken-R-parity gravitino dark matter
  family: gravitino_dark_matter
  aliases:
  - gravitino dark matter with broken R-parity
  - slightly R-parity-violating gravitino dark matter
  short_description: A gravitino-LSP dark-matter scenario in which tiny R-parity violation lets the NLSP
    decay before BBN while the gravitino remains cosmologically long-lived through Planck- and RPV-suppressed
    decays.
  historical_origin_or_motivation: The paper motivates slight R-parity violation as a way to keep thermal
    gravitino dark matter compatible with BBN and thermal leptogenesis, then constructs a B-L breaking
    model that yields the needed RPV range.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - MSSM
  - supergravity
  - gravitino LSP dark matter
  - B-L breaking model in SO(10) notation
  - thermal leptogenesis
  lagrangian_available: partial
  renormalizable: 'no'
  eft_cutoff:
    name: Planck scale
    symbol: M_P
    description: Planck-suppressed operators control gravitino and RPV effects.
    value: M_P
    role: core
    status: assumed
    source_reference_ids:
    - 0710_2287
  embedded_in_larger_framework: 'yes'
  notes: The construction uses SO(10) notation for convenience, B-L breaking by 16 and 16bar fields, an
    imposed U(1)_R symmetry, and RPV terms arising effectively from the Kähler/superpotential structure.
