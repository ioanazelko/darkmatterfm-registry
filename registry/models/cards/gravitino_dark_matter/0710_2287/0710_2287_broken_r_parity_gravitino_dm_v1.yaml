  flavor_structure: RPV couplings may be flavor structured; the paper notes baryogenesis bounds can depend
    on flavor structure.
  tree_or_loop_level: unknown
parameters:
  core:
  - name: gravitino mass
    symbol: m_3/2
    description: Mass of the gravitino dark-matter particle.
    value: typical example 100 GeV; thermal-leptogenesis consistency can imply values above several GeV
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
