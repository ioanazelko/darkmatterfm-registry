    symbol: lambda, lambda_prime
    description: Tiny RPV couplings large enough for NLSP decay before BBN but small enough for baryogenesis
      and gravitino longevity.
    range:
      min: 1e-14
      max: 1e-7
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Approximate favored range quoted in the text.
    role: core
    status: inferred
    source_reference_ids:
    - 0710_2287
  - name: baryon-number-violating coupling
    symbol: lambda_double_prime
    description: Tiny baryon-number RPV coupling in the effective model.
    value: suppressed relative to lepton-number RPV terms
    role: core
    status: inferred
    source_reference_ids:
    - 0710_2287
  - name: B-L breaking scale
    symbol: v_B-L
    description: Scale appearing in the effective suppression of RPV couplings and right-handed-neutrino
      masses.
    value: v_B-L
    role: core
    status: assumed
    source_reference_ids:
    - 0710_2287
  - name: NLSP lifetime
    symbol: tau_NLSP
    description: Lifetime of the next-to-lightest superparticle; RPV should make it decay before BBN.
    value: about 1e3 s for lambda_323 = 1e-14 and m_stau = 100 GeV in the quoted stau example
    unit: s
    role: derived
    status: inferred
    source_reference_ids:
    - 0710_2287
  - name: gravitino lifetime
    symbol: tau_3/2
    description: Lifetime after RPV decay suppression.
    value: about 1e26 s times coupling and mass scalings in the quoted estimate
    unit: s
    role: derived
    status: inferred
    source_reference_ids:
    - 0710_2287
  derived:
