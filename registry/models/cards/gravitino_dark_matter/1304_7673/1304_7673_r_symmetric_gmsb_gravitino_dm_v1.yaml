identity:
  name: R-symmetric gauge-mediated gravitino dark matter
  family: gravitino_dark_matter
  aliases:
  - R-symmetry-restored GMSB gravitino dark matter
  - GMSB goldstino/gravitino dark matter
  short_description: A gauge-mediated supersymmetry-breaking gravitino dark matter scenario where finite-temperature
    U(1)_R restoration suppresses MSSM goldstino production, messenger scatterings and decays contribute,
    and GMSB spurion decay may dilute or nonthermally produce gravitinos.
  historical_origin_or_motivation: Developed to reconcile gravitino dark matter in GMSB with high reheating
    temperatures, thermal leptogenesis, and thermal selection of the supersymmetry-breaking vacuum.
  status: speculative
  model_kind: simplified_model
