  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The basic paradigm uses W = F X + lambda X Phi Phi_bar, with X the GMSB spurion and Phi, Phi_bar
    messenger fields; the paper also sketches variants with X-independent messenger masses.
