  embedded_in_larger_framework: 'yes'
  notes: The paper writes the matter and B-L superpotentials and uses Boltzmann equations for S bosons,
    N1 neutrinos, radiation, B-L asymmetry, and gravitinos; flavor Yukawas arise from effective nonrenormalizable
    interactions.
