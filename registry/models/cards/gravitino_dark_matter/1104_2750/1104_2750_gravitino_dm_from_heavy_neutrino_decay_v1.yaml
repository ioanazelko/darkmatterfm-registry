    set the temperature and thermal gravitino production accounts for dark matter.
  historical_origin_or_motivation: The paper links the origin of entropy, leptogenesis, and gravitino
    dark matter by replacing conventional reheating with heavy-neutrino decay after B-L breaking.
  status: speculative
  model_kind: complete_theory
theory:
