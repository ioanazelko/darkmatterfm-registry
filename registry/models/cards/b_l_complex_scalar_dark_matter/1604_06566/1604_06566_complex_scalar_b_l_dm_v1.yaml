    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by phi_H vacuum expectation value v_BL
    breaking_scale:
      name: B-L breaking VEV
      symbol: v_BL
      description: Vacuum expectation value of phi_H.
      range: set by M_ZBL/(2 g_BL)
      role: core
      status: inferred
      source_reference_ids:
      - paper
  - name: accidental stability from B-L charge assignment
    type: accidental
    exact_or_approximate: exact
    breaking: renormalizable decay operators are forbidden for n_BL not equal to 2 q with q=0,1,2,3
    breaking_scale: null
  topological_defects_possible: unknown
