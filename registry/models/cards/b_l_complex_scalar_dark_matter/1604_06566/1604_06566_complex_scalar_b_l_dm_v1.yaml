identity:
  name: Complex scalar dark matter in a gauged U(1)_{B-L} model
  family: b_l_complex_scalar_dark_matter
  aliases:
  - phi_DM B-L scalar dark matter
  - U(1)_{B-L} complex scalar WIMP
  short_description: An anomaly-free gauged U(1)_{B-L} Standard Model extension with three right-handed
    neutrinos, a B-L-breaking scalar phi_H, and a stable complex scalar phi_DM whose thermal relic abundance
    is set by annihilation through h_1, h_2, and Z_BL.
  historical_origin_or_motivation: Constructed to connect neutrino masses from type-I seesaw with low-mass
    scalar dark matter that can account for the relic density and the Galactic-centre gamma-ray excess
    in the paper.
  status: speculative
  model_kind: complete_theory
