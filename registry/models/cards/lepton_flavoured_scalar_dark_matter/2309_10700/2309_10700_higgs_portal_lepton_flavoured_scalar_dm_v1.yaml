identity:
  name: Higgs-portal lepton-flavoured complex scalar dark matter
  family: lepton_flavoured_scalar_dark_matter
  aliases:
  - DMFV complex scalar lepton-flavoured dark matter with Higgs portal
  short_description: A simplified Dark Minimal Flavour Violation model in which a complex scalar flavour
    triplet contains the dark matter state and couples to right-handed leptons through a charged Dirac
    mediator and to the Higgs through a quartic portal.
  historical_origin_or_motivation: The paper revisits an earlier complex scalar lepton-flavoured DMFV
    model, opens the Higgs portal, and allows generic dark-flavour mass and coupling hierarchies to recover
    electroweak-scale parameter space.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Dark Minimal Flavour Violation
  - Higgs portal
  - lepton-flavoured dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives a renormalizable simplified Lagrangian with scalar triplet, charged vector-like
    mediator, lepton portal matrix, Higgs portal matrix, and dark quartic terms.
particle_content:
  dark_matter_candidate:
    name: lightest complex scalar flavour state phi_3
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - heavier complex scalar flavour states phi_1 and phi_2
  mediators:
  - electrically charged vector-like Dirac fermion mediator with right-handed lepton quantum numbers
  dark_radiation_species: []
  excited_or_degenerate_states:
  - near-degenerate scalar flavour states and mediator can participate in coannihilation regimes
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A discrete Z2 under which only the new scalar flavours and the mediator are charged
    makes the lightest new state stable.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not specified
    breaking_scale: null
  - name: U(3)_phi
    type: global
    exact_or_approximate: approximate
    breaking: broken by DMFV spurions in the lepton and Higgs portal coupling matrices
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - right-handed charged leptons
  - Higgs doublet
  - electroweak gauge and top final states through Higgs-portal annihilation
  dark_sector_couplings:
  - lepton portal matrix lambda = U D
  - Higgs portal matrix lambda_H = lambda_H identity + delta_lambda_H D^2
  - dark scalar quartic coupling
  mediator_types:
  - charged vector-like Dirac fermion
  - Higgs boson
  interaction_operators:
  - lambda_ij psi_bar l_Ri phi_j
  - lambda_H,ij phi_i^dagger phi_j H^dagger H
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - phi_i dagger phi_j to charged lepton pairs through mediator exchange
  - Higgs-portal annihilation to Higgs, W, Z, and top final states when kinematically open
  - coannihilation with near-degenerate mediator or heavier scalar flavours
  decay_channels: []
  self_scattering_channels:
  - dark scalar quartic self-interactions, not central in the analysis
  cp_structure: DMFV coupling matrix includes phases but the numerical extraction focuses on flavour-conserving
    cases in parts of the analysis.
  flavor_structure: Single new DMFV source of flavour and CP violation beyond SM Yukawas, parameterized
    by lambda = U D.
  tree_or_loop_level: both
parameters:
  core:
  - name: lightest scalar DM mass
    symbol: m_phi3
    description: Mass of the lightest scalar flavour state that accounts for the observed DM abundance.
    range: electroweak scale to multi-TeV ranges studied; best-fit examples near 100 GeV
    unit: GeV
    role: core
    status: inferred
  - name: mediator mass
    symbol: m_psi
    description: Mass of the charged vector-like Dirac mediator.
    range: electroweak scale to multi-TeV ranges studied
    unit: GeV
    role: core
    status: inferred
  - name: lepton portal diagonal couplings
    symbol: D_i
    description: Positive real entries in the diagonal matrix D of lambda = U D.
    range:
      min: 0
      max: 3
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range adopted to maintain perturbativity in the paper.
    role: core
    status: inferred
  - name: lepton portal mixing angles
    symbol: theta_ij
    description: Angles in the unitary matrix U parameterizing lambda.
    range:
      min: 0
      max: pi/4
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range as stated in the paper.
    role: core
    status: inferred
  - name: lepton portal phases
    symbol: delta_ij
    description: CP phases in the unitary matrix U.
    range:
      min: 0
      max: 2*pi
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range as stated in the paper.
    role: core
    status: inferred
  - name: universal Higgs portal coupling
    symbol: lambda_H
    description: Flavour-universal term in the Higgs portal coupling matrix.
    range:
      min: -3
      max: 3
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range adopted in the scan.
    role: core
    status: inferred
  - name: DMFV Higgs portal correction
    symbol: delta_lambda_H
    description: Coefficient of the D^2 correction to the Higgs portal matrix.
    range:
      min: -0.1
      max: 0.1
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range adopted in the scan.
    role: core
    status: inferred
  - name: mass hierarchy spurion coefficient
    symbol: eta
    description: Controls flavour non-universal corrections to the scalar DM mass matrix.
    range: generic sign and magnitude considered; sign controls ordinary or reversed hierarchy
    role: core
    status: inferred
