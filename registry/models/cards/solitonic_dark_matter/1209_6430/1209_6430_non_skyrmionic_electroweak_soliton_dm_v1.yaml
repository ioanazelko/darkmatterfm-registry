  - generalized Skyrme model
  - chiral effective Lagrangian
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The model is framed as a low-energy SU(2) x SU(2) / SU(2) chiral Lagrangian with two independent
    fourth-order derivative coefficients s and t; the underlying strong electroweak theory is left unspecified.
