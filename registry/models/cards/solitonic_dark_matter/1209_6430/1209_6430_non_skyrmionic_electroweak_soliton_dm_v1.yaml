parameters:
  core:
  - name: electroweak symmetry-breaking scale
    symbol: v
    description: Scale used in the electroweak chiral Lagrangian.
    value: 246
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '1209_6430'
  - name: Skyrme coefficient
    symbol: s
    description: Coefficient of one fourth-order derivative invariant in the chiral Lagrangian.
    range: phenomenology-dependent; benchmark electroweak points include 6.0 x 10^-3 and 6.75 x 10^-3
      under prospective LHC ranges
    role: core
    status: established
    source_reference_ids:
    - '1209_6430'
    notes: The paper scans the (s,t) plane and relates it to alpha_4 and alpha_5.
  - name: non-Skyrme coefficient
    symbol: t
    description: Coefficient of the second independent fourth-order derivative invariant.
    range: phenomenology-dependent; benchmark values include 0, 0.75 x 10^-3, and -3.85 x 10^-3 under
      prospective LHC ranges
    role: core
    status: established
    source_reference_ids:
    - '1209_6430'
    notes: The non-Skyrme term changes existence, stability, and mass estimates.
  - name: soliton mass
    symbol: M_sol
    description: Classical mass of the electroweak solitonic baryon.
    range: up to about 60 TeV with then-current allowed electroweak parameters; about 8 TeV upper limit
      under the prospective LHC null ranges discussed
    unit: TeV
    role: core
    status: inferred
    source_reference_ids:
    - '1209_6430'
    notes: The paper gives illustrative benchmark masses 59, 18, and 31 TeV for current ranges and 8.1,
      7.9, and 4.6 TeV for prospective LHC ranges.
  - name: stability ratio
    symbol: t/s
    description: Ratio controlling whether classical soliton solutions exist and are stable in the generalized
      fourth-order Lagrangian.
    range: stable regions depend on quadrant; first-quadrant stable branch below about t/s = 0.29 is highlighted
    role: core
    status: established
    source_reference_ids:
    - '1209_6430'
    notes: The text also describes stable regions in the fourth quadrant and no-solution/unstable regions
      elsewhere.
  - name: primordial electroweak baryon asymmetry
    symbol: eta_EW_baryon
    description: Asymmetry controlling whether electroweak baryons can supply the cold dark matter abundance.
    range: not quantified
    role: core
    status: unknown
    source_reference_ids:
    - '1209_6430'
    notes: The paper says the relic density depends on the presence and magnitude of a primordial electroweak
      baryon asymmetry.
