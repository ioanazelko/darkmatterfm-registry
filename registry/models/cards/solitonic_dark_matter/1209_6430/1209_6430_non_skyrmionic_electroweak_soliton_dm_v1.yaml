identity:
  name: Non-Skyrmionic electroweak soliton dark matter
  family: solitonic_dark_matter
  aliases:
  - electroweak baryon dark matter
  - strongly interacting electroweak soliton dark matter
  - generalized Skyrmion electroweak baryon
  short_description: A cold dark matter candidate consisting of stable neutral bosonic solitons, or electroweak
    baryons, in a strongly interacting electroweak sector described by an SU(2) chiral effective Lagrangian
    with Skyrme and non-Skyrme fourth-order terms.
  historical_origin_or_motivation: Extends Skyrmion-style soliton methods from QCD to strongly interacting
    electroweak symmetry breaking and studies whether the resulting electroweak baryons can survive as
    cold dark matter relics.
  status: speculative
  model_kind: effective_field_theory
theory:
