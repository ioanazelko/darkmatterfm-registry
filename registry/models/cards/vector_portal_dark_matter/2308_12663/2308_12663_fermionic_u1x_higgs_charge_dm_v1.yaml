  short_description: A Dirac fermion carrying U(1)_X charge interacts with Standard Model fields through
    Z and Z' exchange induced by U(1)_X-U(1)_Y kinetic mixing and a small U(1)_X charge for the Standard
    Model Higgs doublet.
  historical_origin_or_motivation: The paper introduces the Higgs U(1)_X charge as an additional parameter
    to relieve tension between thermal relic abundance and direct-detection scattering in kinetic-mixing
    U(1)_X dark matter.
  status: speculative
  model_kind: simplified_model
