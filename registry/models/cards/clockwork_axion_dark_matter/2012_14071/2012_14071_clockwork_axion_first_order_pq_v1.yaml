    impact_if_violated: The effective first-order transition construction would need a different UV origin.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2012_14071'
    notes: null
  - id: assump_clockwork_enhancement
    description: The clockwork mechanism exponentially enhances f_a relative to f, allowing f below 10^9
      GeV while keeping f_a in the cosmologically allowed axion range.
    scope: theory
    status: established
    impact_if_violated: The low-scale PQ phase-transition signals would not coexist with an invisible
      QCD axion candidate.
    can_be_relaxed: 'no'
    source_reference_ids:
    - '2012_14071'
    notes: null
  - id: assump_percolation_near_nucleation
    description: The paper assumes percolation occurs soon after true-vacuum bubble nucleation, so the
      gravitational-wave generation temperature is approximately the nucleation temperature.
    scope: cosmological_history
    status: assumed
    impact_if_violated: The gravitational-wave parameters alpha and beta/H_n would need recalculation.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2012_14071'
    notes: null
