validity_domain:
- id: low_mass_thermal_window
  applies_to: model
  condition: Relic-density discussion emphasizes m_phi0 below the W threshold with mass splittings large
    enough to suppress co-annihilation.
  valid_range: m_phi0 < m_W with modest quartics giving order-10-GeV splittings
  status: established
  extrapolation_risk: medium
  caveats:
  - For m_phi0 above the W threshold, efficient W-pair annihilation pushes the viable mass to the multi-TeV
    regime and partner particles become less accessible.
  source_reference_ids:
  - hep-ph0703056
  notes: The paper therefore concentrates on the lower-mass phenomenological region.
- id: exchange_symmetry_completion
  applies_to: model
  condition: The dark matter-Higgs mass relation relies on a softly broken exchange symmetry and vector-like
    partner masses.
  valid_range: null
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The underlying dynamics that generates the partner masses and breaks the exchange symmetry is not
    specified in detail.
  source_reference_ids:
  - hep-ph0703056
  notes: The authors give technicolor-like dynamics only as an illustrative possibility.
assumptions:
  global:
  - id: exact_z2_stability
    description: The Z2 symmetry remains exact so that the lightest neutral scalar in the dark doublet
      is stable.
    scope: theory
    status: assumed
    impact_if_violated: The dark matter candidate could decay and the model would no longer provide stable
      dark matter.
    can_be_relaxed: 'no'
    source_reference_ids:
    - hep-ph0703056
    notes: null
  - id: standard_thermal_freezeout
    description: The relic abundance is computed using standard thermal freeze-out with the dark doublet
      in equilibrium with Standard Model particles.
    scope: production
    status: assumed
    impact_if_violated: The relic-density target and viable mass-coupling regions would change.
    can_be_relaxed: unknown
    source_reference_ids:
    - hep-ph0703056
    notes: null
  - id: coannihilation_suppressed
    description: Quartic couplings generate enough splitting among phi0, A0, and charged partners to make
      co-annihilation negligible in the focused low-mass region.
    scope: production
    status: assumed
    impact_if_violated: Co-annihilation through electroweak gauge interactions can deplete the relic abundance
      too efficiently.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - hep-ph0703056
    notes: The paper states that tens-of-GeV splittings are easy to obtain for modest quartic couplings.
  - id: flavor_alignment
    description: Soft exchange-symmetry-breaking partner masses are approximately diagonal in flavor space
      so loop-induced flavor changing effects remain small.
    scope: theory
    status: assumed
    impact_if_violated: The vector-like partner sector could generate large flavor-changing neutral currents.
    can_be_relaxed: unknown
    source_reference_ids:
    - hep-ph0703056
    notes: null
  computation_specific: []
