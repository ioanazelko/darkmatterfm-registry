model_id: hep-ph0703056_scalar_electroweak_doublet_dark_matter_v1
identity:
  name: Technically natural scalar electroweak doublet dark matter
  family: scalar_electroweak_doublet_dark_matter
  aliases:
  - Higgs-related inert doublet dark matter
  - natural dark matter from an unnatural Higgs
  short_description: A weak-scale scalar electroweak doublet dark matter model in which an exact Z2 stabilizes
    the lightest neutral scalar and a softly broken exchange symmetry relates the dark matter doublet
    to the Higgs, implying TeV-scale vector-like colored partners.
  historical_origin_or_motivation: The paper motivates the model by asking whether scalar dark matter
    can remain light without an additional quadratic fine-tuning even when the Higgs mass is fine-tuned,
    and whether this can require colored TeV-scale states.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - inert_doublet_model
  - discrete_higgs_dark_matter_exchange_symmetry
  - weak_scale_thermal_relic_dark_matter
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives the scalar potential, exchange symmetries, Yukawa structure for vector-like partners,
    and soft partner masses; the dynamics generating the exchange-symmetry breaking masses is left model-dependent.
particle_content:
  dark_matter_candidate:
    name: real neutral scalar component phi0 of an electroweak doublet
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - pseudoscalar neutral partner A0
  - charged scalar doublet partners phi+ and phi-
  mediators:
  - Higgs boson h0
  - electroweak gauge bosons
  - vector-like fermion partners in Yukawa completion
  dark_radiation_species: []
  excited_or_degenerate_states:
  - A0 and charged scalar states split from phi0 after electroweak symmetry breaking
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 symmetry makes the dark matter doublet and partner fermions odd,
    stabilizing the lightest neutral scalar component.
  symmetries:
  - name: Z2 dark parity
    type: discrete
    exact_or_approximate: exact
    breaking: not broken for the dark matter candidate
    breaking_scale: null
  - name: S2 Higgs-dark-matter exchange
    type: discrete
    exact_or_approximate: broken
    breaking: softly broken by vector-like partner masses and by the Higgs/dark-matter mass splitting
    breaking_scale: null
  - name: D4 Higgs/dark-matter sector symmetry
    type: discrete
    exact_or_approximate: broken
    breaking: arises from noncommuting S2 and Z2 actions and is softly broken in the fermion sector
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - Higgs boson
  - electroweak gauge bosons
  - Standard Model fermions through exchange-symmetric Yukawa structures
  dark_sector_couplings:
  - scalar quartics lambda3, lambda4, lambda5
  - Higgs-dark-matter coupling lambda_DM = lambda3 + lambda4 + lambda5
  mediator_types:
  - scalar Higgs mediator
  - electroweak vector bosons
  - vector-like fermion partners
  interaction_operators:
  - V(h, phi) with |h|^2|phi|^2, |h dagger phi|^2, and Re(h dagger phi)^2 terms
  - Yukawa terms mapping Standard Model fermions to partner fermions under S2A and S2B
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - s-channel Higgs annihilation to Standard Model final states
  - annihilation to W boson pairs for dark matter masses above the W mass
  - co-annihilation with A0 or charged partners if mass splittings are small
  decay_channels: []
  self_scattering_channels: []
  cp_structure: real scalar phi0 is taken as the lightest component; A0 is the pseudoscalar partner
  flavor_structure: Exchange-symmetric Yukawa couplings are arranged to be minimally flavor violating;
    soft partner masses should be approximately flavor diagonal.
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter scalar mass
    symbol: m_phi0
    description: Mass of the real neutral scalar dark matter component.
    range: Primary phenomenological region emphasized has m_phi0 < m_W; for m_phi0 > m_W the correct relic
      density pushes the mass to the multi-TeV regime.
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - hep-ph0703056
    notes: The paper focuses on the low-mass window because heavier doublet dark matter would imply colored
      partners too heavy for near-term observation.
  - name: Higgs-dark-matter coupling
    symbol: lambda_DM
    description: Coupling of two phi0 fields to the physical Higgs, lambda_DM = lambda3 + lambda4 + lambda5.
    range: about 0.1 for a 120 GeV Higgs in the low-mass thermal region; larger values can work for a
      heavier Higgs.
    unit: null
    role: core
    status: established
    source_reference_ids:
    - hep-ph0703056
    notes: Controls the dominant Higgs-mediated annihilation channel in the low-mass region.
  - name: scalar-doublet mass splittings
    symbol: Delta m
    description: Mass splitting between phi0, A0, and charged scalar partners generated by lambda4 and
      lambda5 after electroweak symmetry breaking.
    range: tens of GeV are described as easy to obtain with modest quartics and sufficient to suppress
      co-annihilation.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph0703056
    notes: A nonzero phi0-A0 splitting also shuts off the Z-mediated inelastic channel in direct searches.
  - name: vector-like partner masses
    symbol: m_Q, m_U
    description: Soft masses of the vector-like fermion partners that break the exchange symmetry and
      induce the Higgs/dark-matter mass splitting.
    range: TeV scale in the phenomenologically interesting examples.
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - hep-ph0703056
    notes: The one-loop splitting is dominated by the top Yukawa coupling and depends on m_Q and m_U.
  nuisance: []
  derived:
  - name: thermal relic abundance
    symbol: Omega_DM h^2
    description: Relic abundance computed in the paper with micrOMEGAs for the scalar doublet model.
    value: target range 0.099 < Omega_DM h^2 < 0.113 used in the relic-density plots
    unit: null
    role: derived
    status: established
    source_reference_ids:
    - hep-ph0703056
    notes: The abundance depends mainly on m_phi0, lambda_DM, Higgs mass, and whether co-annihilations
      are suppressed.
