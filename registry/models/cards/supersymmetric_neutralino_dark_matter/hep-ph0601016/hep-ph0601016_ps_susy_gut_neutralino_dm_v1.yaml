  - shifted hybrid inflation
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The model is based on G_PS = SU(4)_c x SU(2)_L x SU(2)_R with added Higgs superfields that generate
    Yukawa quasi-unification and a CMSSM spectrum below the GUT scale.
