identity:
  name: Pati-Salam SUSY GUT neutralino dark matter with Yukawa quasi-unification
  family: supersymmetric_neutralino_dark_matter
  aliases:
  - YQUC CMSSM neutralino dark matter
  - PS SUSY GUT neutralino CDM
  short_description: A Pati-Salam supersymmetric GUT yielding a CMSSM-like low-energy spectrum with Yukawa
    quasi-unification, matter parity, and an almost pure bino neutralino LSP whose relic abundance is
    reduced by A-pole annihilation or neutralino-stau coannihilation.
  historical_origin_or_motivation: The paper reviews particle dark matter candidates but then presents
    a specific SUSY GUT that fixes the bottom-quark mass problem while retaining neutralino cold dark
    matter consistent with WMAP-era abundance bounds.
  status: speculative
  model_kind: complete_theory
theory:
