  family: supersymmetric_neutralino_dark_matter
  aliases:
  - family-dependent U(1)_prime SUSY singlino/higgsino LSP
  short_description: A supersymmetric U(1)_prime extension with family-dependent anomaly-free charges
    in which the R-parity conserving LSP neutralino can be singlino dominated, higgsino dominated, or
    mixed dark matter.
  historical_origin_or_motivation: The paper chooses family-dependent U(1)_prime charges to relax Z-prime
    dilepton bounds and naturally lower the singlino mass.
  status: speculative
  model_kind: complete_theory
