theory_to_observable_routing:
  routes:
  - id: sarah_spheno_micromegas_route
    description: Map U(1)-prime SUSY scan points to relic density, direct detection, and collider exclusions.
    source_model_features:
    - family-dependent U(1)-prime charges
    - singlino/higgsino neutralino LSP
    - R-parity conservation
    input_parameters:
    - g_prime Q_E3
    - tan beta
    - v_S
    - A_lambda
    - lambda
    - M1
    - M2
    - M4
    - sfermion masses
    derived_quantities:
    - neutralino spectrum
    - singlino fraction
    - Omega_chi h^2
    - sigma_SI
    - Z-prime branching ratios
    forward_model_chain:
    - step_id: model_files
      step_type: other
      tool_or_code: SARAH-4.14.0
      inputs:
      - U(1)-prime superpotential and soft terms
      outputs:
      - SPheno and MicrOMEGAs model files
      validity: Valid for the benchmark charge assignment.
      notes: Primary paper states SARAH generated numerical package files.
    - step_id: spectrum
      step_type: other
      tool_or_code: SPheno-4.0.2
      inputs:
      - scan parameters
      outputs:
      - masses
      - mixing matrices
      - decay branching ratios
      validity: Perturbative benchmark regions in the scan.
      notes: Used in the primary workflow.
    - step_id: dark_matter
      step_type: boltzmann_solver
      tool_or_code: MicrOMEGAs-4.3.5
      inputs:
      - spectrum
      - couplings
      outputs:
      - Omega_chi h^2
      - sigma_SI
      validity: Thermal neutralino calculation.
      notes: Used for dark-matter computations in the primary paper.
    - step_id: collider_recast
      step_type: recasting
      tool_or_code: null
      inputs:
      - Z-prime and electroweakino branching ratios
      outputs:
      - excluded/visible benchmark regions
      validity: Requires LHC analysis assumptions.
      notes: Primary paper provides benchmark cuts rather than a reusable likelihood.
    observable_ids:
    - si_direct_detection_rate
    - zprime_electroweakino_leptons
    - neutralino_relic_density_band
    constraint_ids:
    - planck_relic_density_band
    - xenon_si_limit
    - lhc_zprime_electroweakino_limits
    likelihoods:
    - relic-density band only; direct-detection and LHC curves are not public likelihoods
    required_code_resources:
    - SARAH
    - SPheno
    - MicrOMEGAs
    - LHC recast code would be needed for precision
    validation_tests:
    - Reproduce primary benchmark masses and relic-density plots before recasting new points.
    route_status: partially_implemented
    agent_notes: Primary-paper workflow is explicit, but detector-level likelihoods are unavailable.
    caveats:
    - Graphical exclusions must be digitized for quantitative reuse.
