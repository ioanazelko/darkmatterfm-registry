    impact_if_violated: Changing halo or hadronic inputs shifts the cross-section comparison.
    can_be_relaxed: partial
    source_reference_ids:
    - 1909_07176_primary
  caveats:
  - The exact XENON dataset version is not made machine-readable in the model-card text.
  source_reference_ids:
  - 1909_07176_primary
  notes: Primary text explicitly compares sigma_SI with a XENON limit curve.
- id: lhc_zprime_electroweakino_limits
  name: Collider limits on Z-prime and electroweakinos
  constraint_type: collider
  observable_channel: ditau, multilepton, and electroweakino searches
  applies: parameter_dependent
  constrained_parameters:
  - M_Zprime
  - g_prime Q_E3
  - BR(Zprime -> chi chi)
  - chargino mass
  excluded_regions:
  - The primary notes that a 2 TeV LHC limit removes a significant part of one dark-matter-allowed region.
  allowed_regions:
  - Small enough g_prime Q_E3 can keep sub-TeV Z-prime regions viable in the non-universal charge setup,
