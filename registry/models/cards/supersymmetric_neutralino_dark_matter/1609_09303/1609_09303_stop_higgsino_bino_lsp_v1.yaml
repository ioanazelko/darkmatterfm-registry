  short_description: A simplified MSSM/natural-SUSY scenario proposed to interpret an ATLAS stop-search
    excess, with a light mostly right-handed stop, Higgsino NLSP states, and a bino-like neutralino LSP
    whose relic abundance can be reduced by slepton coannihilation.
  historical_origin_or_motivation: The paper seeks a stop-decay pattern that survives LHC searches while
    retaining a neutralino dark matter candidate in a natural SUSY-inspired spectrum.
  status: speculative
  model_kind: simplified_model
