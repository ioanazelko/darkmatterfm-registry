theory_to_observable_routing:
  routes:
  - agent_notes: Primary paper names the computational tools, but reproducing the scan requires the scan
      card and random/scan settings.
    caveats:
    - Fine details of LHC electroweakino constraints are spectrum dependent.
    constraint_ids:
    - con_relic_density_planck
    - con_lz_direct_detection
    - con_higgs_and_sparticle_constraints
    derived_quantities:
    - Omega_DM h^2
    - sigma_p^SI
    - sigma_n^SD
    - H95 signal strengths
    - sparticle exclusions
    description: Scan NMSSM parameters, compute relic density and direct-detection rates, and apply Higgs/sparticle
      constraints to identify viable 95 GeV Higgs plus neutralino-DM benchmarks.
    forward_model_chain:
    - inputs:
      - NMSSM parameters
      - soft terms
      notes: Apply BSM Higgs, b-physics, and perturbativity filters.
      outputs:
      - Higgs and sparticle spectrum
      - Higgs constraints
      step_id: spectrum_scan
      step_type: other
      tool_or_code: NMSSMTools-6.0.2
      validity: As used in the primary scan.
    - inputs:
      - spectrum
      - annihilation/co-annihilation channels
      notes: Compare with WMAP/Planck and LZ.
      outputs:
      - Omega_DM h^2
      - direct-detection cross sections
      step_id: relic_and_detection
      step_type: boltzmann_solver
      tool_or_code: micrOMEGAs
      validity: Thermal-relic treatment for accepted channels.
    - inputs:
      - sparticle spectrum
      - branching ratios
      notes: Primary paper uses SModelS to filter scan points.
      outputs:
      - LHC sparticle constraint status
      step_id: sparticle_recast
      step_type: recasting
      tool_or_code: SModelS-2.2.0
      validity: Simplified-model coverage can be weak for unconventional NMSSM cascades.
    id: route_nmssm_scan_to_observables
    input_parameters:
    - NMSSM Higgs parameters
    - gaugino/sfermion soft masses
    - mu_eff
    - LSP composition
    likelihoods:
    - Implemented constraints inside NMSSMTools/micrOMEGAs/SModelS; no standalone combined likelihood
      exported.
    observable_ids:
    - obs_lz_direct_detection_rates
    - obs_95gev_higgs_signals
    - obs_coannihilation_electroweakino_spectrum
    required_code_resources:
    - NMSSMTools-6.0.2
    - micrOMEGAs
    - SModelS-2.2.0
    route_status: partially_implemented
    source_model_features:
    - R-parity-stable neutralino LSP
    - singlet-like 95 GeV Higgs
    - A1/H95/HSM funnel and co-annihilation mechanisms
    validation_tests:
    - Reproduce Figs. 1-5 and benchmark tables.
    - Check each benchmark against Omega_DM h^2 and LZ bounds.
