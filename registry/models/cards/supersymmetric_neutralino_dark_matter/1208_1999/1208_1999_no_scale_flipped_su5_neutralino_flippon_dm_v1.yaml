  applies: parameter_dependent
  constrained_parameters:
  - m_h
  - M_1/2
  - M_V
  - alpha_s
  - sparticle masses
  excluded_regions:
  - Regions that miss m_h = 125.5 +/- 0.5 GeV or conflict with the stated LHC/LEP spectrum constraints
    are disfavored.
  allowed_regions:
  - The primary paper identifies alpha_s = 0.1145 and M_32 around 7e15 GeV as preferred for m_h about
    125.5 GeV.
  benchmark_implications:
  - Collider signatures are tied to the same narrow strip used for neutralino dark matter.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: ATLAS/CMS Higgs and SUSY search context in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: fsu5_flippon_higgs_shift
    description: Flippon loop corrections are treated with the approximation described in the primary
      text.
    scope: collider
    status: assumed
    impact_if_violated: A different Higgs calculation shifts the allowed strip.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1208_1999
  caveats:
  - Low-statistics excess language should be treated historically.
  source_reference_ids:
  - src_1208_1999
  notes: The constraint is source-backed but not current-LHC recast quality.
- id: fsu5_lhc_xenon_planck_projection
  name: Later LHC/Planck/XENON overlap for No-Scale F-SU(5)
  constraint_type: direct_detection
  observable_channel: direct_detection/cosmology/collider
  applies: parameter_dependent
  constrained_parameters:
  - neutralino-proton scattering
  - M_1/2
  - stau-neutralino degeneracy
  excluded_regions:
  - Related 2013 work focuses on the high-mass cutoff where stau-neutralino degeneracy prevents satisfying
    cold-dark-matter observations.
  allowed_regions:
  - Future 14 TeV LHC and XENON 1-Ton sensitivities were described as overlapping the model boundaries.
  benchmark_implications:
  - Useful as a follow-up recast target rather than a constraint already implemented in this output.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: Related local text 1305.1846
  recasting_needed: 'yes'
  robustness: low
  assumptions:
  - id: fsu5_projection_not_likelihood
    description: The related paper describes expected sensitivities rather than providing a reusable likelihood.
    scope: recasting
    status: assumed
    impact_if_violated: Treating it as a likelihood would overstate the evidence.
    can_be_relaxed: 'no'
    source_reference_ids:
    - rel_1208_1305_1846
  caveats:
  - Historical projection; modern XENON/LHC constraints need a new analysis.
  source_reference_ids:
  - rel_1208_1305_1846
  notes: Included to route direct-detection/collider follow-up without inventing current exclusions.
theory_to_observable_routing:
  routes:
  - id: fsu5_spectrum_relic_collider_route
    description: Generate the No-Scale F-SU(5) spectrum, compute neutralino relic density, and test the
      Higgs/LHC/proton-decay correlated strip.
    source_model_features:
    - No-Scale boundary conditions
    - Flipped SU(5)
    - TeV flippons
    - bino-like neutralino LSP
    input_parameters:
    - M_1/2
    - M_V
    - tan_beta
    - alpha_s
    - m_t
    derived_quantities:
    - sparticle spectrum
    - m_h
    - Omega_CDM h^2
    - proton lifetime
    - collider signal regions
    forward_model_chain:
    - step_id: run_rges
      step_type: other
      tool_or_code: proprietary modified SuSpect 2.34
      inputs:
      - F-SU(5) high-scale inputs
      - flippon-enhanced RGEs
      outputs:
      - weak-scale spectrum
      validity: Requires unavailable proprietary modifications.
      notes: This is the main reproducibility bottleneck.
    - step_id: compute_relic
      step_type: boltzmann_solver
      tool_or_code: MicrOMEGAs 2.4
      inputs:
      - weak-scale spectrum
      outputs:
      - Omega_CDM h^2
      - coannihilation rates
      validity: Applies to the neutralino/stau coannihilation strip.
      notes: Primary paper states MicrOMEGAs 2.4 was used.
    - step_id: compare_colliders
      step_type: recasting
      tool_or_code: ATLAS/CMS analysis recast
      inputs:
      - spectrum
      - production cross sections
      outputs:
      - multijet/light-stop acceptance
      validity: Modern analysis requires current detector simulations.
      notes: Primary and related texts discuss LHC7/8/14 prospects.
    - step_id: estimate_proton_decay
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - M_32
      - GUT spectrum
      outputs:
      - tau_p
      validity: Model-specific GUT threshold assumptions enter.
      notes: Correlated observable, not a DM-only constraint.
    observable_ids:
    - fsu5_relic_coannihilation
    - fsu5_lhc_multijet_light_stop
    - fsu5_proton_decay
    constraint_ids:
    - fsu5_bare_minimal_constraints
    - fsu5_higgs_lhc_spectrum
    - fsu5_lhc_xenon_planck_projection
    likelihoods:
    - WMAP7 relic-density interval
    - ATLAS/CMS signal regions
    - proton-decay exposure likelihoods
    required_code_resources:
    - MicrOMEGAs 2.4
    - modified SuSpect 2.34
    - collider recast tools
    validation_tests:
    - Reproduce the benchmark m_chi10 = 145 GeV and WMAP7 strip.
    route_status: partially_implemented
    agent_notes: Conceptual toolchain is clear, but the SuSpect modification is not public in the assigned
      source.
    caveats:
    - 2012-era experimental inputs need modernization.
  - id: fsu5_gamma_line_route
    description: Translate the neutralino/stau-compressed spectrum into gamma-line and internal-bremsstrahlung
      predictions for Fermi-LAT-like data.
    source_model_features:
    - bino-like neutralino
    - compressed stau-neutralino spectrum
    input_parameters:
    - m_chi10
    - Delta m_stau_chi
    - annihilation cross sections
    - halo profile
    derived_quantities:
    - gamma/Z line energies
    - IB photon spectrum
    - expected counts
    forward_model_chain:
    - step_id: compute_annihilation_spectrum
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - neutralino mass
      - slepton mass splitting
      outputs:
      - line energies
      - IB spectrum
      validity: Relies on SUSY spectrum and annihilation matrix elements.
      notes: Related local text highlights enhanced photon yield from compressed stau-LSP mass splitting.
    - step_id: compare_fermi_lat
      step_type: likelihood
      tool_or_code: null
      inputs:
      - photon spectrum
      - Galactic-center ROI
      outputs:
      - line likelihood
      validity: Requires Fermi-LAT data and backgrounds.
      notes: The primary line claim is historical/tentative.
    observable_ids:
    - fsu5_gamma_line
    constraint_ids: []
    likelihoods:
    - Fermi-LAT line-search likelihood
    required_code_resources:
    - SUSY annihilation spectrum code
    - Fermi-LAT analysis tools
    validation_tests:
    - Check whether predicted line energies match 130-145 GeV targets.
    route_status: planned
    agent_notes: No current Fermi-LAT likelihood was built in this pass.
    caveats:
    - Do not encode the old 130 GeV feature as confirmed.
