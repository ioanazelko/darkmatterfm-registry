    value: negative for viable b-YU regions
    role: core
    status: inferred
  - name: bottom-tau Yukawa unification
    symbol: h_b(M_GUT)=h_tau(M_GUT)
    description: Imposed top-down at the GUT scale.
    role: core
    status: assumed
