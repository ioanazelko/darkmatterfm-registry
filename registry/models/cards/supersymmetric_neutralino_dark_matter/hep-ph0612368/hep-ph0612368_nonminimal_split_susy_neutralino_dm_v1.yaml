identity:
  name: Non-minimal split-supersymmetry neutralino dark matter
  family: supersymmetric_neutralino_dark_matter
  aliases:
  - split NMSSM neutralino dark matter
  - singlino-neutralino dark matter
  - non-minimal split SUSY dark matter
  short_description: A split-NMSSM extension of minimal split supersymmetry with light singlet scalar
    and singlino states, where a generalized R-parity stabilizes the lightest neutralino, which can be
    bino-, higgsino-, or singlino-rich thermal dark matter.
  historical_origin_or_motivation: Motivated by retaining split-supersymmetry dark matter and gauge unification
    while adding singlet states that strengthen the electroweak phase transition and support baryogenesis.
  status: speculative
  model_kind: simplified_model
