  parent_frameworks:
  - MSSM
  - secluded-sector U(1)' supersymmetry
  - Dirac-neutrino higher-dimensional operator models
  lagrangian_available: 'yes'
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives a superpotential and complete Lagrangian pieces, but Dirac neutrino masses arise
    through higher-dimensional U(1)'-allowed terms.
