identity:
  name: Secluded U(1)' neutralino dark matter benchmarks
  family: supersymmetric_neutralino_dark_matter
  aliases:
  - secluded-sector U(1)' neutralino LSP model
  - U(1)' extended MSSM neutralino dark matter
  short_description: A secluded-sector U(1)' extension of the MSSM with singlet fields, anomaly-canceling
    exotics, Dirac neutrino masses, and a lightest neutralino LSP whose thermal relic density is matched
    in benchmark scenarios.
  historical_origin_or_motivation: Developed to solve the MSSM mu problem, generate Dirac neutrino masses,
    and compare sneutrino LHC signals while retaining a viable neutralino dark-matter relic.
  status: speculative
  model_kind: complete_theory
theory:
