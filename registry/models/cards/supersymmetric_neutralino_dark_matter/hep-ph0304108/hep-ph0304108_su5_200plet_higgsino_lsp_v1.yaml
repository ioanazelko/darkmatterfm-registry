parameters:
  core:
  - name: SU(5) gaugino-mass representation
    symbol: n
    description: Nonsinglet chiral superfield representation entering the gauge kinetic function; the
      detailed dark-matter study concentrates on n=200.
    value: '200'
    range: 1, 24, 75 and 200 are discussed; n=200 is used for the main parameter-space plots
    unit: null
    role: core
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: The n=200 case gives the hierarchy |mu| < |M2| < |M1| and a wide EWSB-allowed region.
  - name: GUT-scale gaugino mass coefficients for the 200-plet
    symbol: C^200_{1,2,3}
    description: Coefficients relating M1, M2 and M3 at the GUT scale to one SUSY-breaking mass parameter.
    value: (10, 2, 1)
    range: null
    unit: null
    role: core
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: The paper writes M^G,n_{1,2,3}=C^n_{1,2,3} M_{1/2}.
  - name: universal gaugino mass parameter
    symbol: M_{1/2}
    description: Single SUSY-breaking mass parameter that fixes the GUT-scale gaugino masses in a given
      representation; for n=200, M3^G=M_{1/2}.
    value: null
    range: scanned in the allowed m0-M_{1/2} plane
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: null
  - name: universal scalar mass
    symbol: m0
    description: Universal SUSY-breaking scalar mass assumed at the GUT scale.
    value: null
    range: scanned in the allowed m0-M_{1/2} plane
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - hep-ph0304108
    notes: The paper assumes universal scalar masses for simplicity.
  - name: ratio of Higgs vacuum expectation values
    symbol: tan beta
    description: Values used in the n=200 allowed-region plots.
    value: 5, 10, 30, 50
    range: 5 to 50 in displayed examples
    unit: null
    role: benchmark
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: null
  - name: supersymmetric Higgsino mass parameter
    symbol: mu
    description: Controls the Higgsino-like light chargino and neutralino masses; the paper chooses positive
      mu.
    value: positive branch; generally below about 500 GeV in the shown model space
    range: null
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: The negative branch is said to be strongly disfavoured by b to s gamma and muon anomalous-moment
      constraints.
  - name: gaugino fraction of the LSP
    symbol: Z_g
    description: Z_g=N11^2+N12^2; small values imply a Higgsino-dominated LSP.
    value: below 10 percent over the bulk of the allowed parameter space
    range: Z_g < 10 percent in the bulk region
    unit: null
    role: derived
    status: established
    source_reference_ids:
    - hep-ph0304108
    notes: The paper states that this corresponds to more than 90 percent Higgsino component.
