  short_description: A R-parity-conserving SUGRA dark-matter model in which an SU(5) 200-plet gauge kinetic
    function fixes nonuniversal GUT-scale gaugino masses and yields a dominantly Higgsino lightest neutralino.
  historical_origin_or_motivation: The paper studies this nonuniversal-gaugino SUGRA case as an alternative
    to minimal SUGRA, whose bino-like LSP often overproduces dark matter.
  status: speculative
  model_kind: phenomenological_parameterization
