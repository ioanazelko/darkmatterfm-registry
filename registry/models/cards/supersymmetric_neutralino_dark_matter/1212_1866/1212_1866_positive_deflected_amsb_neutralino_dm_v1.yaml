    range: scanned in the paper figures
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1212_1866'
  - name: compensator F term
    symbol: F_phi
    description: Primary anomaly-mediated SUSY-breaking scale controlling soft masses.
