identity:
  name: Positively deflected AMSB neutralino dark matter
  family: supersymmetric_neutralino_dark_matter
  aliases:
  - positively deflected anomaly-mediated neutralino DM
  - deflected AMSB Higgsino-like neutralino dark matter
  short_description: A positively deflected anomaly-mediated supersymmetry-breaking scenario in which
    the lightest neutralino is the dark matter candidate and viable regions satisfy relic-density and
    Higgs-mass constraints.
  historical_origin_or_motivation: Studied to solve the tachyonic slepton problem of pure AMSB while preserving
    a neutralino LSP and incorporating the 125-126 GeV Higgs discovery.
  status: speculative
  model_kind: complete_theory
