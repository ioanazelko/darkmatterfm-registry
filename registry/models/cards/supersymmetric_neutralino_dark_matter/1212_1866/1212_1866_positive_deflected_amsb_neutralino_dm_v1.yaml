    symbol: tan beta
    description: MSSM tan beta used in scans.
    range: examples 10, 20, 30
    role: core
    status: inferred
    source_reference_ids:
    - '1212_1866'
  - name: sign of mu
    symbol: sign(mu)
    description: Only positive sign is considered.
    value: +
    role: core
    status: inferred
    source_reference_ids:
    - '1212_1866'
  nuisance: []
  derived:
  - name: neutralino relic density
    symbol: Omega_CDM h^2
    description: Observed CDM relic density target used by the scan.
    value: 0.1120 +/- 0.0056
    role: derived
    status: inferred
    source_reference_ids:
