    symbol: N
    description: Number of vectorlike messenger pairs.
    range: fixed examples N=1 and N=2
    role: core
    status: inferred
    source_reference_ids:
    - '1212_1866'
  - name: deflection parameter
    symbol: d
    description: Controls how much the RG trajectory is deflected from pure AMSB.
    range: natural O(1); examples d=1.5 and d=2
    role: core
    status: inferred
    source_reference_ids:
    - '1212_1866'
