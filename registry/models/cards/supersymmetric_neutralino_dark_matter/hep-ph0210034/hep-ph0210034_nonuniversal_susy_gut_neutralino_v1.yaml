  short_description: A GUT-inspired MSSM neutralino dark matter variant in which departures from universal
    soft masses, especially a lowered high-scale M3 gaugino mass, produce a neutralino with a non-negligible
    higgsino fraction and viable relic abundance.
  historical_origin_or_motivation: The paper seeks neutralino models more favorable for direct and solar-neutrino
    indirect detection than the CMSSM focus-point region while retaining GUT-scale RGE structure.
