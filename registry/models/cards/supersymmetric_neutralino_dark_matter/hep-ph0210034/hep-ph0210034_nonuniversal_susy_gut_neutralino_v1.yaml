    symbol: f_H
    description: Higgsino fraction of the lightest neutralino in favorable models.
    range: 0.1 to 0.4
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - hep-ph/0210034
    notes: The paper states all favorable models have 0.1 < f_H < 0.4.
