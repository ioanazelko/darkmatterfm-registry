    notes: Low-energy relation M2 about 2 M1 is retained in the generic favorable parameterization.
  - name: M2
    symbol: M_2
    description: SU(2) gaugino soft mass; lowering M2 increases the wino fraction but can drive relic
      density too low.
    range: varied away from universal high-scale value
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph/0210034
    notes: The paper treats M2 lowering as less useful than M3 lowering for viable detection-friendly
      models.
  - name: M3 at GUT scale
    symbol: M_3|_GUT
    description: SU(3) gaugino soft mass whose reduction changes RGE evolution, lowers mu, and enhances
      the higgsino fraction.
    range: lower than the universal CMSSM value in favored variants
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph/0210034
    notes: Identified as the most relevant degree of freedom for improved relic abundance and detection
      rates.
  - name: mu parameter
    symbol: mu
    description: Higgsino mass parameter controlling neutralino higgsino admixture.
    range: fit to obtain a non-negligible higgsino fraction
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - hep-ph/0210034
    notes: The paper gives a low-energy relation between mu and M1 for the favored higgsino-fraction interval.
