  tree_or_loop_level: both
parameters:
  core:
  - name: Bino mass parameter
    symbol: M_1
    description: Sets the mass of the mostly Bino lightest neutralino in the light-WIMP regime.
    range: small compared with M_2 and mu; m_chi1^0 can be about 8 GeV in the large tan beta strip and
      above about 16 GeV in the low tan beta region
    unit: GeV
    role: core
    status: inferred
  - name: Wino mass parameter
    symbol: M_2
    description: Must be heavy enough with mu to satisfy the chargino mass bound.
    range: greater than about 100 GeV
    unit: GeV
    role: core
    status: inferred
  - name: higgsino mass parameter
    symbol: mu
    description: Controls the higgsino component needed for the neutralino coupling to A while also entering
      the chargino mass.
    range: of order 100 GeV or larger in the viable light-neutralino region
    unit: GeV
    role: core
    status: inferred
  - name: CP-odd Higgs mass
    symbol: m_A
    description: A light A enhances neutralino annihilation through the Higgs sector.
    range: around 100 GeV in the light-neutralino regime discussed
    unit: GeV
    role: core
    status: inferred
  - name: ratio of Higgs vacuum expectation values
    symbol: tan beta
    description: Controls the down-type Higgs coupling and separates the large tan beta strip from the
      low tan beta region.
    range: large fine-tuned strip or lower tan beta region
    unit: null
    role: core
    status: inferred
  - name: lightest neutralino mass
    symbol: m_chi1^0
    description: Mass of the dark matter candidate in the viable parameter regions found by the paper.
    range: as light as about 8 GeV in the large tan beta strip; above about 16 GeV in the low tan beta
      region
    unit: GeV
    role: core
    status: inferred
