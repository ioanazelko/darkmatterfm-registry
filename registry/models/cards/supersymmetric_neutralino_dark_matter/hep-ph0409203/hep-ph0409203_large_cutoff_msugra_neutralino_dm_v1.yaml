  notes: This assumption is central to the proposed mSUGRA realization.
- id: hierarchical_spectrum
  applies_to: parameter
  condition: The phenomenology emphasized by the authors has m_0 much larger than gaugino masses and mu,
    with heavy sfermions at a few TeV.
  valid_range: m_0 = O(1-10) TeV and m_0 >> |M_i|, |mu|
  status: approximate
  extrapolation_risk: medium
  caveats:
  - Neutralino relic abundance is only stated qualitatively for small-mu regions.
  source_reference_ids:
  - hep-ph0409203
  notes: Outside this focus-point-like region the dark-matter conclusion may not hold.
