identity:
  name: Large-cutoff mSUGRA neutralino dark matter
  family: supersymmetric_neutralino_dark_matter
  aliases:
  - large-cutoff mSUGRA
  - inflation-selected mSUGRA
  short_description: A minimal-supergravity realization selected by a large cutoff and inflationary background
    in which the lightest neutralino, especially a bino-Higgsino mixture in small-mu regions, is a dark-matter
    candidate with cosmologically interesting relic abundance.
  historical_origin_or_motivation: The paper asks how approximate minimal supergravity might be selected
    in nature and argues that inflationary selection can prefer a supergravity effective theory with a
    cutoff above the reduced Planck scale, yielding a focus-point-like spectrum and a neutralino dark-matter
    candidate.
  status: speculative
  model_kind: simplified_model
