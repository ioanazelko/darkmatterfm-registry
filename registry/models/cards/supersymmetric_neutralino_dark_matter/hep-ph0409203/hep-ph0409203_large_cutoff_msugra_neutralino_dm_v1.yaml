- id: large_cutoff_assumption
  applies_to: model
  condition: The supergravity effective theory has a cutoff M_* larger than the reduced Planck scale so
    that higher-dimensional Kahler operators are suppressed.
  valid_range: M_* > M_G, with the paper motivating M_* around 4 M_G
  status: assumed
  extrapolation_risk: high
  caveats:
