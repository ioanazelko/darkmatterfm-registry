  - agent_notes: null
    caveats: []
    constraint_ids:
    - con_wmap_relic_golden_point
    - con_direct_indirect_golden_point
    - con_collider_proton_golden_point
    derived_quantities:
    - SUSY spectrum
    - Omega h^2
    - sigma_SI
    - gamma-gamma rate
    - proton lifetime
    description: Compute the no-scale F-SU(5) Golden Point spectrum and propagate it to relic, direct/indirect,
      LHC, and proton-decay observables.
    forward_model_chain:
    - inputs:
      - M_1/2
      - tan_beta
      - M_V
      - top mass
      notes: null
      outputs:
      - sparticle masses
      - neutralino composition
      step_id: s1
      step_type: simulation
      tool_or_code: SuSpect-style RGE spectrum calculation
      validity: Matches the primary paper only with its modified F-SU(5) RGEs.
    - inputs:
      - SUSY spectrum
      notes: null
      outputs:
      - Omega h^2
      - sigma_SI
      - annihilation rates
      step_id: s2
      step_type: simulation
      tool_or_code: MicrOMEGAs 2.1
      validity: Version and model-file dependent.
    - inputs:
      - spectrum
      - rates
      - tau_p
      notes: null
      outputs:
      - direct/indirect/collider/proton constraints
      step_id: s3
      step_type: recasting
      tool_or_code: null
      validity: Modern likelihoods were not run in this batch.
    id: route_fsu5_spectrum_observables
    input_parameters:
    - M_1/2
    - tan_beta
    - M_V
    - top mass
    - B_mu(M_F)
    likelihoods:
    - WMAP7 top-hat only
    - No current XENON/LZ/LHC likelihood
    observable_ids:
    - obs_golden_point_direct_indirect
    - obs_golden_point_lhc_spectrum
    - obs_golden_point_proton_decay
    required_code_resources:
    - F-SU(5) spectrum generator
    - MicrOMEGAs model files
    - collider/proton-decay recast
    route_status: planned
    source_model_features:
    - no-scale boundary conditions
    - flipped SU(5) vector-like multiplets
    - bino-like neutralino LSP
    - stau-neutralino coannihilation
    validation_tests:
    - recover Omega h^2=0.1123
    - recover sigma_SI=1.9e-10 pb
    - recover bino fraction near 99.8%
