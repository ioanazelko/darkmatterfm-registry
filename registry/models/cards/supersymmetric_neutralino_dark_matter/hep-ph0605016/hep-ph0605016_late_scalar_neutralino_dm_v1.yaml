  short_description: A phenomenological MSSM neutralino dark matter scenario in which a pre-BBN scalar
    field dominates the energy density, reheats the plasma below the usual neutralino freeze-out temperature,
    dilutes thermal neutralinos, and can nonthermally produce neutralinos through its decay products.
  historical_origin_or_motivation: Motivated by neutralino relic-density tensions in standard cosmology
    and by low-reheating scenarios such as moduli decay, Q-ball decay, and thermal inflation.
  status: speculative
  model_kind: phenomenological_parameterization
