parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Lightest neutralino mass in the light-neutralino NMSSM scan.
    range: 100 MeV to 100 GeV emphasized; earlier viable examples in the text include few-GeV to sub-100-GeV
      neutralinos.
    unit: GeV
    role: core
    status: established
  - name: singlet-Higgs superpotential coupling
    description: Dimensionless coupling multiplying S H_u H_d in the NMSSM superpotential.
    range: 0 to 0.75 in the random scan
    role: core
    status: established
  - name: singlet cubic superpotential coupling
    description: Dimensionless coupling multiplying S^3 in the NMSSM superpotential.
    range: absolute value up to about 0.65 in the random scan
    role: core
    status: established
  - name: tan beta
    symbol: tan_beta
    description: Ratio of the two Higgs vacuum expectation values.
    range: 1.7 to 54 in the random scan
    role: core
    status: established
  - name: effective higgsino mass parameter
    symbol: mu_eff
    description: Effective mu term generated by the singlet vacuum expectation value.
    range: 80 to 500 in the random scan
    unit: GeV
    role: core
    status: established
  - name: singlet-sector trilinear soft terms
    symbol: A_lambda, A_kappa
    description: Trilinear soft-breaking terms associated with the singlet-Higgs and singlet cubic couplings.
    range: -500 to 500 in the random scan
    unit: GeV
    role: core
    status: established
  - name: gaugino soft masses
    symbol: M1, M2, M3
    description: Randomly scanned gaugino masses used to generate the neutralino sector.
    range: M1 from 0 to 100 GeV, M2 from M1 to 500 GeV, M3 from 300 to 1000 GeV
    unit: GeV
    role: core
    status: established
  nuisance: []
  derived:
  - name: lightest neutralino composition
    symbol: N_1i
    description: Bino-like, singlino-like, or mixed classification used in the scan.
    range: bino-like if N11^2 > 0.9; singlino-like if N15^2 > 0.9; otherwise mixed
    role: derived
    status: established
