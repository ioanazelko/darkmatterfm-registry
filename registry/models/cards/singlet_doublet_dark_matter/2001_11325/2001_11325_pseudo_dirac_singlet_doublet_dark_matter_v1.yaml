    range: ordinary singlet-doublet direct-search limits prefer theta below about 0.06 before the pseudo-Dirac
      splitting is included
    role: core
    status: inferred
    source_reference_ids: []
  - name: Higgs Yukawa mixing coupling
    symbol: Y
    description: Coupling that mixes the singlet and doublet fermions after electroweak symmetry breaking.
    role: core
    status: unknown
    source_reference_ids: []
