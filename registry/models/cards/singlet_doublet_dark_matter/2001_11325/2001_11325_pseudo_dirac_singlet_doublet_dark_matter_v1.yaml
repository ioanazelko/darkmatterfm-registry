    symbol: m_L, m_R
    description: Left and right Majorana mass components that split the neutral Dirac fermions into pseudo-Dirac
      Majorana pairs and enter one-loop neutrino mass generation.
    range: the paper reports (m_L + m_R) of order 1 GeV and (m_L - m_R) of order 1 MeV for neutrino-mass
      consistency; it also discusses m of order 1 GeV to suppress problematic Z-mediated coannihilation
    role: core
    status: inferred
    source_reference_ids: []
