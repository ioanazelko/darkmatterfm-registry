  short_description: A Standard Model extension with a vectorlike singlet-doublet fermion sector, a small
    singlet Majorana mass, and real scalar singlets; the lightest neutral pseudo-Dirac fermion is stabilized
    by an unbroken Z_2 and obtains a thermal relic abundance through annihilation and coannihilation.
  historical_origin_or_motivation: Introduced to link pseudo-Dirac fermion dark matter with one-loop Majorana
    neutrino mass generation using the same small Majorana mass term.
  status: speculative
  model_kind: simplified_model
