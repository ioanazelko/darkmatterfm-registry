      - Hubble rate
      notes: Compute freeze-out abundance.
      outputs:
      - thermal freeze-out abundance
      step_id: bl-rel-1
      step_type: boltzmann_solver
      tool_or_code: primary-paper Boltzmann equation
      validity: Applies when chi or Z_BL thermalizes.
    - inputs:
