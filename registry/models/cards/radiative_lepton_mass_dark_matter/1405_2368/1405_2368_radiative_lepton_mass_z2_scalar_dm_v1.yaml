  mediator_types:
  - neutral scalars
  - charged scalars
  - vector-like charged leptons
  - Z' gauge boson
  interaction_operators:
  - one-loop charged-lepton mass operator L_L e_R Phi
  - one-loop neutrino mass operator L_L L_L Delta_0 Delta_1
  annihilation_channels:
  - Higgs-resonant annihilation when m_DM is near m_h/2
  decay_channels:
  - E can decay to a muon plus neutral Z2-odd scalar states that cascade to Z plus A_2
  self_scattering_channels: []
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_A2
    description: Set near half the SM-like Higgs mass in the paper's dark-matter benchmark.
    value: m_h/2
    role: core
    status: assumed
  - name: singlet scalar vacuum expectation value
    symbol: v_phi
    description: Taken as 3 TeV in the numerical analysis after LEP-II Z' considerations.
    value: 3
    unit: TeV
    role: core
    status: assumed
  - name: triplet scalar vacuum expectation values
    symbol: v_Delta0, v_Delta1
    description: Required to be small by the electroweak rho parameter and used to suppress neutrino masses.
    range:
      min: 0
      max: 1
      inclusive_min: true
      inclusive_max: false
      unit: GeV
      notes: Paper states triplet VEVs must be smaller than about 1 GeV.
    role: core
    status: inferred
  - name: vector-like charged lepton mass
    symbol: M_E
    description: Favored around the TeV scale in the paper's combined lepton and DM benchmark discussion.
    value: around 1
    unit: TeV
    role: core
    status: inferred
  - name: U(1)' charges
    symbol: x, y, z
    description: Charge parameters for L_L, e_R, and Delta_0; conditions z != 0 and x-y != 0 forbid tree-level
      masses.
    role: core
    status: assumed
  - name: scalar coupling selecting A_2
    symbol: lambda_e1
    description: A_2 is the dark-matter candidate when this coupling is positive.
    role: core
    status: assumed
  nuisance: []
  derived:
  - name: Z' mass
    symbol: m_Zprime
    description: Given by g_Zprime |x-y| v_phi up to neglected triplet-VEV contributions.
    value: g_Zprime |x-y| v_phi
    role: derived
    status: established
