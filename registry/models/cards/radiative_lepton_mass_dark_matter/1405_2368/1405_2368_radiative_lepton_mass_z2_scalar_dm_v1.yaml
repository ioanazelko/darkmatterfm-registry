    neutral scalar, identified as A_2 for positive lambda_e1, is the dark-matter candidate.
  historical_origin_or_motivation: Motivated by radiative lepton masses, muon g-2, neutrino masses, and
    a naturally stable dark-matter candidate from the unbroken Z2 parity.
