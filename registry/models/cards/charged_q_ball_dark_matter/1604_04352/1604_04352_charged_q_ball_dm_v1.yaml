  dark_matter_candidate:
    name: charged Q-ball and anti-Q-ball ion-like relics
    spin: unknown
    statistics: macroscopic_object
    elementary_or_composite: macroscopic
    number_of_components: multi_component
  additional_dark_sector_particles:
  - Affleck-Dine scalar condensate
  - positively charged Q-balls
  - negatively charged anti-Q-balls
  - captured electrons or nuclei in late-time bound states
  mediators:
  - electromagnetic Coulomb field
  - gaugino/higgsino exchange inside Q-balls
  dark_radiation_species: []
