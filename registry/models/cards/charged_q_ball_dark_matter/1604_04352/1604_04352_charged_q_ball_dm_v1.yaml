  - atom-like and ion-like Q-ball bound states
  long_lived_particles:
  - charged Q-balls
  - charged anti-Q-balls
  unstable_parent_particles:
  - Affleck-Dine condensate
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Large baryonic Q-ball charge makes decay into nuclei energetically forbidden,
    while Schwinger pair production limits further electric charge growth.
  symmetries:
  - name: global U(1) Q-ball charge
    type: global
    exact_or_approximate: approximate
    breaking: surface decay and A-term effects are discussed
    breaking_scale: null
  - name: baryon and lepton charge along the Affleck-Dine flat direction
    type: global
    exact_or_approximate: broken
    breaking: A-term induces Affleck-Dine rotation
    breaking_scale: null
  topological_defects_possible: 'no'
interactions:
  portals:
  - other
  - vector
  standard_model_targets:
  - electrons
  - helium nuclei
  - quarks
  - leptons
  dark_sector_couplings:
  - Affleck-Dine field potential in gauge mediation
  - electromagnetic capture of charged particles by Q-balls
  mediator_types:
  - Coulomb potential
  - surface interactions of Q-balls
  interaction_operators:
  - gaugino/higgsino exchange allows charged-lepton annihilation inside the Q-ball for the u^c u^c d^c
    e^c direction
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: not_applicable
  annihilation_channels:
  - charged particle recombination/capture changes the relic charge state
  - Q-ball plus anti-Q-ball reactions are neglected because number densities are extremely small
  decay_channels:
  - surface decay into quarks or leptons can occur when energetically allowed
  self_scattering_channels: []
  cp_structure: A-term violates CP and baryon number to induce Affleck-Dine rotation.
  flavor_structure: Example flat direction u^c u^c d^c e^c carries both baryon and lepton charges.
  tree_or_loop_level: unknown
parameters:
  core:
  - name: Q-ball global charge
    symbol: Q
    description: Baryon/lepton charge of a gauge-mediation type Q-ball.
    range: typical value around 1e30 in the paper example; Q = beta (phi_osc/M_F)^4
    role: core
    status: inferred
    source_reference_ids:
    - paper
