  - Affleck-Dine baryogenesis
  - non-topological soliton dark matter
  lagrangian_available: partial
  renormalizable: unknown
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies the gauge-mediation superpotential and Affleck-Dine scalar potential used
    to form gauge-mediation type Q-balls.
