  short_description: A gauge-mediated supersymmetry scenario in which Affleck-Dine condensate fragmentation
    forms nearly equal numbers of charged Q-balls and anti-Q-balls carrying baryon and lepton charge;
    charged atom-like or ion-like relics are expected to make the dark matter.
  historical_origin_or_motivation: Developed from Affleck-Dine baryogenesis and gauge-mediation Q-ball
    dark matter, adding charged Q-ball and anti-Q-ball relic evolution.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
