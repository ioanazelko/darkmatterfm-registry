  short_description: A weak-scale supersymmetric setup in which holomorphy-induced U(1)_x operator hierarchies
    generate a small mu term and a late thermal-inflation epoch; decay of the post-inflation field can
    nonthermally create dark-matter LSPs while entropy release dilutes unwanted relics.
  historical_origin_or_motivation: The paper constructs the scenario to connect a supersymmetric mu-term
    solution with late thermal inflation that can dilute gravitinos and moduli while still allowing a
    cold dark matter candidate.
  status: speculative
  model_kind: phenomenological_parameterization
