    symbol: y
    description: Coupling controlling chi decay to S particles.
    range: Lower bound from requiring S to become non-relativistic before the Universe cools to about
      1 keV; paper quotes y^2 greater than about 8e-18 times parameter factors
    role: core
    status: inferred
  - name: decay temperature condition
    symbol: T_dec
    description: Temperature by which the chi parent should decay so S is cold enough for structure formation.
    range: Must occur before the temperature drops below the paper-defined T_dec tied to m_chi/(2 m_S)
      keV
    unit: keV
    role: core
    status: inferred
