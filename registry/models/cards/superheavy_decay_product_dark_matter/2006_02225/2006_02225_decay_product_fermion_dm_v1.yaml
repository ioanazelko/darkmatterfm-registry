    description: Mass of the stable fermion dark matter particle.
    range: about 1 GeV to 1 TeV for m_chi in the 1e13-1e16 GeV range and xi between 1 and 100
    unit: GeV
    role: core
    status: inferred
    notes: The paper gives m_S about 6 GeV times 1e15 GeV/m_chi and summarizes the range as 1 GeV to 1
      TeV.
  - name: chi parent mass
    symbol: m_chi
    description: Mass of the gravitationally produced unstable parent.
    range: about 1e13 to 1e16 GeV for production without exponential suppression in the decay-product
