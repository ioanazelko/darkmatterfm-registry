validity_domain:
- id: nonrelativistic_two_state_limit
  applies_to: model
  condition: Absorption and re-emission occur at the same observed energy only when the two dark states
    are heavy and nonrelativistic.
  valid_range: m_1 > 1 MeV and splitting near 3.54 keV
  status: inferred
  extrapolation_risk: medium
  caveats:
  - Relativistic dark states would Doppler shift emission relative to absorption.
  source_reference_ids:
  - '1608_01684'
  notes: null
- id: fluorescent_photon_conservation
  applies_to: production
  condition: In the simplest fluorescent case, absorbed real 3.5 keV photons are re-emitted, so total
    3.5 keV photon number is conserved.
  valid_range: real-photon absorption followed by chi_2 to chi_1 photon decay
  status: assumed
  extrapolation_risk: medium
  caveats:
  - More general virtual-photon or scattering variants are only mentioned and not developed in the assigned
    text.
  source_reference_ids:
  - '1608_01684'
  notes: null
- id: nfw_cluster_profile_input
  applies_to: model
  condition: Rate estimates use a Perseus-like dark matter column density with an NFW profile and uncertain
    central behavior.
  valid_range: Perseus cluster line of sight to NGC1275
  status: assumed
  extrapolation_risk: high
  caveats:
  - A cored profile or different central column density changes inferred widths.
  source_reference_ids:
  - '1608_01684'
  notes: null
