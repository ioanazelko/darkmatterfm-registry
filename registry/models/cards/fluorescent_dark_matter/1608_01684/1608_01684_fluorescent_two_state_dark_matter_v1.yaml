  short_description: A two-state dark matter scenario in which a lower dark state absorbs a 3.54 keV photon
    into an excited state, which then re-emits the photon and can turn AGN absorption into diffuse cluster
    emission.
  historical_origin_or_motivation: Introduced in the paper to reconcile Hitomi, XMM-Newton, and Chandra
    3.5 keV data from Perseus through absorption and fluorescent re-emission by dark matter.
  status: speculative
  model_kind: effective_field_theory
