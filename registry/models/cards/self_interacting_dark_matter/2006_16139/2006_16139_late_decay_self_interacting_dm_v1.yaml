identity:
  name: Self-interacting dark matter from late pseudo-WIMP decays
  family: self_interacting_dark_matter
  aliases:
  - late-decay SIDM
  - Higgs-portal messenger decay SIDM
  - ultrastrong self-interacting dark matter regime
  short_description: A thermally produced WIMP-like scalar messenger S freezes out and later decays into
    dark matter fermions that self-interact through a light massive vector mediator; delayed decays can
    also produce a subdominant dark-radiation component.
  historical_origin_or_motivation: The mechanism is proposed to build velocity-dependent self-interacting
    dark matter while evading stable-mediator overclosure and CMB/indirect-detection limits, with possible
    relevance to the H_0 tension and small-scale structure.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Higgs portal dark matter
  - superWIMP-like late decays
  - gauged U(1)_X dark sector
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives a concrete dark-sector Lagrangian after U(1)_X breaking and a Higgs-portal scalar
    connection to the visible sector.
