  dark_matter_candidate:
    name: dark-sector Dirac fermion
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - singlet scalar messenger S
  mediators:
  - massive vector A from broken U(1)_X
  - Higgs-mixed scalar S
  dark_radiation_species:
  - relativistic A mediator quanta in late three-body or loop decays when kinematically relativistic
  long_lived_particles:
  - pseudo-WIMP scalar S
  unstable_parent_particles:
  - S messenger
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Dark matter stability is tied to the dark U(1)_X structure, while an approximate
    or broken Z2 controls the pseudo-WIMP S lifetime.
  symmetries:
  - name: U(1)_X
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken at a higher scale to give A a mass
  - name: S -> -S parity
    type: discrete
    exact_or_approximate: broken
    breaking: small explicit or spontaneous breaking controls S decays
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - SM Higgs doublet through S Hdagger H and S^2 Hdagger H portal terms
  dark_sector_couplings:
  - g A_mu dark-fermion vector coupling
  - S decay to a pair of dark matter fermions
  - subdominant S decays to states containing A
  mediator_types:
  - light massive vector A
  - Higgs-portal scalar S
  interaction_operators:
  - dark fermion kinetic and mass terms
  - massive-vector coupling ig A_mu psi gamma^mu psi
  - Higgs portal terms lambda_HS S Hdagger H and lambda_HS S^2 Hdagger H
  scattering:
