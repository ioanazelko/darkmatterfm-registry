  - paper
theory_to_observable_routing:
  routes:
  - agent_notes: Analytic route is available; numerical halo likelihood remains external.
    caveats:
    - Assumes asymmetric population removes antiparticles today.
    constraint_ids:
    - sidm_dwarf_cluster_band
    derived_quantities:
    - monopole-dipole potential
    - sigma_T/m
    - sigma_V/m
    description: Compute the single-neutrino-exchange potential and self-interaction cross sections for
      degenerate scalar/fermion dark matter.
    forward_model_chain:
    - inputs:
      - tree-level neutrino exchange
      - nonrelativistic limit
      notes: Use the primary derivation.
      outputs:
      - off-diagonal monopole-dipole potential
      step_id: potential
      step_type: analytic_formula
      tool_or_code: null
      validity: Valid for degenerate states and low momentum transfer.
    - inputs:
      - potential
      - relative velocity
      notes: Primary paper finds 1/v^2 scaling.
      outputs:
      - sigma_T
      - sigma_V
      step_id: cross_section
      step_type: analytic_formula
      tool_or_code: null
      validity: Born approximation remains valid for perturbative y in the paper.
    id: neutrino_exchange_sidm_route
    input_parameters:
    - m
    - y
    - m_nu
    - v
    likelihoods: []
    observable_ids:
    - velocity_dependent_sidm
    required_code_resources: []
    route_status: planned
    source_model_features:
    - mass-degenerate scalar and fermion DM
    - active-neutrino mediator
    - asymmetric relics
    validation_tests: []
  - agent_notes: Primary paper has formulae but not packaged recast code.
    caveats:
    - Cutoff dependence should be tracked in EFT recasts.
    constraint_ids:
    - xenonnt_darkside_bound
    - invisible_decay_bounds
    derived_quantities:
    - sigma_n
    - Z invisible width
    - meson invisible branching fractions
    description: Map neutrino-portal coupling to direct-detection and invisible-decay constraints.
    forward_model_chain:
    - inputs:
      - m
      - y
      - cutoff
      notes: Compare with low-mass direct-detection bounds.
      outputs:
      - sigma_n
      step_id: direct_detection
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses paper regularization prescription.
    - inputs:
      - m
      - y
      - neutrino flavor
      notes: Use Z width and K-decay limits.
      outputs:
      - partial widths
      step_id: decays
      step_type: analytic_formula
      tool_or_code: null
      validity: Flavor-dependent charged-meson channels.
    id: portal_lab_constraints_route
    input_parameters:
    - m
    - y
    - neutrino flavor
    - EFT cutoff
    likelihoods: []
    observable_ids:
    - loop_direct_detection
    - invisible_decays
    required_code_resources: []
    route_status: planned
    source_model_features:
    - neutrino portal
    - loop-induced Z exchange
    - dark-sector invisible decays
    validation_tests: []
