  name: Composite SIMP dark pions with dark-photon semi-annihilation
  family: self_interacting_dark_matter
  aliases:
  - U(1)_d monopole-condensation SIMP
  - dark-pion SIMP with kinetic mixing
  short_description: A sub-GeV composite SIMP model in a dark U(1)_d sector where monopole condensation
    confines dark electrons into stable dark pions, and the relic abundance is set by 2-to-2 semi-annihilation
    through kinetic mixing with a dark photon.
  historical_origin_or_motivation: The paper revisits an earlier monopole-condensation SIMP model and
    proposes a semi-annihilation relic-density mechanism tied to dark-photon kinetic mixing and intensity-frontier
    searches.
  status: speculative
  model_kind: simplified_model
