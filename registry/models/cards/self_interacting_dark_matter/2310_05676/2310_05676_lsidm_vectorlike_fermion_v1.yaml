    extra dark Abelian gauge symmetry, annihilating through dark gauge interactions into a light Z' mediator
    and singlet scalar while Z' can decay mainly to active neutrinos.
  historical_origin_or_motivation: Built to obtain a common parameter region for thermal relic abundance
    and self-interaction strength for light SIDM, using fast non-standard expansion to compensate underabundance.
