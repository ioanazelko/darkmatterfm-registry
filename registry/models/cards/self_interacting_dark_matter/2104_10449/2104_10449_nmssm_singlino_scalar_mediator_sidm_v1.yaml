identity:
  name: General NMSSM singlino self-interacting dark matter with a scalar mediator
  family: self_interacting_dark_matter
  aliases:
  - NMSSM singlino SIDM
  - Majorana fermion SIDM with scalar mediator
  short_description: A general NMSSM self-interacting dark matter scenario in which a singlino-like Majorana
    fermion is the dark matter candidate and a light singlet-like CP-even scalar mediates velocity-dependent
    self-scattering while thermal annihilation into mediators can set the relic density.
  historical_origin_or_motivation: Motivated by small-scale-structure tensions of collisionless cold dark
    matter and by the singlet sector of the general NMSSM.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - general NMSSM
  - supersymmetry
  - self-interacting dark matter
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the general NMSSM superpotential/soft terms relevant to the singlet sector,
    neutralino masses, scalar masses, and singlino-scalar couplings.
particle_content:
  dark_matter_candidate:
    name: singlino-like lightest neutralino chi_1
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
