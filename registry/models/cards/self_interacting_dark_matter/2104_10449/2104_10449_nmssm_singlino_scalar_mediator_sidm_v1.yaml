  long_lived_particles:
  - singlino-like dark matter
  unstable_parent_particles:
  - Higgsino-like electroweakinos
  - singlet-like scalar mediator
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: R-parity conservation is assumed for Higgsino production/decay and makes the
    lightest neutralino dark matter stable.
  symmetries:
  - name: R parity
    type: discrete
    exact_or_approximate: exact
  - name: supersymmetry
    type: unknown
    exact_or_approximate: broken
    breaking: Soft SUSY-breaking terms are included.
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - Higgs sector
  - electroweak gauge bosons through Higgsinos
  - leptons from mediator decays in extended scenarios
  dark_sector_couplings:
  - singlino-singlino-scalar Yukawa coupling
  - triple singlet-scalar coupling
  - Higgsino-singlino-scalar coupling controlled by lambda
  mediator_types:
  - light CP-even scalar
  - Higgsino electroweakinos
  - Higgs portal mixing
  interaction_operators:
  - singlino pair coupling to singlet scalar
  - Yukawa potential for nonrelativistic self-scattering
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: strong
    velocity_dependence: strong
    spin_dependence: unknown
  annihilation_channels:
  - singlino dark matter annihilation into scalar mediators through s-, t-, and u-channel processes
  decay_channels:
  - Higgsino decays to singlino plus scalar mediator
  - scalar mediator decays to leptons in possible extensions
  self_scattering_channels:
  - chi_1 chi_1 -> chi_1 chi_1 through light scalar exchange
  tree_or_loop_level: tree
parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Singlino-like Majorana fermion mass; the scan focuses on light DM to satisfy direct detection
      limits.
    range: less than about 20 GeV in the NMSSM scan emphasized by the paper
    unit: GeV
    role: core
    status: inferred
  - name: scalar mediator mass
    symbol: m_phi
    description: Light singlet-like CP-even scalar mediator mass.
    range: examples include 0.01, 0.1, and 1 GeV; viable benchmark mediator masses are light
    unit: GeV
    role: core
    status: inferred
  - name: singlino-scalar coupling
    symbol: lambda
    description: Coupling controlling DM self-interaction and some branchings.
    range: below about 0.2 in NMSSM points with correct thermal relic density; larger values explored
      only beyond NMSSM
    role: core
    status: inferred
  - name: triple scalar coupling
    symbol: V_phi_phi_phi
    description: Coupling controlling scalar mediator splitting and shower multiplicity.
    range: benchmark dependent; large enough to produce multi-scalar showers
    role: core
    status: inferred
  - name: Higgsino mass parameter
    symbol: mu_eff
    description: Effective Higgsino mass in the NMSSM scan.
    range: about 300-2000 in the scan, with allowed Higgsino masses around 400-1000
    unit: GeV
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: viscosity self-scattering cross section per mass
    symbol: sigma_V/m_chi
    description: Velocity-dependent self-interaction used to address small-scale structure.
    range: about 1-10 cm^2/g at dwarf velocities and below about 0.1-1 cm^2/g at cluster velocities
    unit: cm^2/g
    role: derived
    status: inferred
  - name: thermal relic abundance
    symbol: Omega_chi h^2
    description: Computed/estimated for singlino annihilation into scalar mediators.
    value: target around 0.12 in benchmark points
    role: derived
    status: inferred
