theory_to_observable_routing:
  routes:
  - agent_notes: The route is well specified phenomenologically, but no code asset was located in the
      local text.
    caveats:
    - Direct-detection constraints disappear if no mediator-SM portal exists.
    constraint_ids:
    - con_symmetric_sidm_cluster_bullet_halo_shape
    - con_symmetric_sidm_direct_detection_light_mediator
    - con_symmetric_cmb_annihilation
    derived_quantities:
    - sigma_T/m_chi(v)
    - halo core response
    - sigma_n^SI(q)
    - CMB annihilation applicability
    description: Map light-mediator SIDM particle parameters to dwarf/cluster transfer cross sections,
      direct-detection recoils, and relic/CMB consistency checks.
    forward_model_chain:
    - inputs:
      - m_chi
      - m_phi
      - alpha_chi
      - relative velocity
      notes: Primary benchmark plots parameter space in m_chi and m_phi.
      outputs:
      - sigma_T/m_chi(v)
      step_id: transfer_cross_section
      step_type: analytic_formula
      tool_or_code: null
      validity: Use the Yukawa-potential scattering regimes appropriate to symmetric/asymmetric channels.
    - inputs:
      - sigma_T/m_chi(v)
      - halo velocity scale
      notes: Related simulations provide dwarf/subhalo and halo-shape context.
      outputs:
      - core size
      - halo shape
      - subhalo circular velocities
      step_id: halo_recast
      step_type: simulation
      tool_or_code: N-body or calibrated SIDM halo model
      validity: Baryonic effects and scatter require care.
    - inputs:
      - epsilon_eff
      - m_phi
      - m_chi
      - velocity distribution
      notes: Primary text gives the approximate SI cross section and projected experiments.
      outputs:
      - nuclear recoil spectrum
      step_id: recoil_recast
      step_type: recasting
      tool_or_code: light-mediator direct-detection likelihood
      validity: Requires finite-momentum-transfer mediator form factor.
    - inputs:
      - annihilation rate
      - branching ratio
      - residual anti-DM fraction
      notes: Primary text states the symmetric e+e- benchmark exclusion below about 30 GeV.
      outputs:
      - CMB energy-injection applicability
      step_id: cmb_check
      step_type: recasting
      tool_or_code: null
      validity: Only active for symmetric or residual-symmetric populations.
    id: route_symmetric_sidm_sidm_velocity_recast
    input_parameters:
    - m_chi
    - m_phi
    - alpha_chi
    - epsilon_eff
    - annihilation channel
    likelihoods: []
    observable_ids:
    - obs_symmetric_sidm_dwarf_core_profiles
    - obs_symmetric_sidm_light_mediator_direct_recoils
    required_code_resources:
    - SIDM scattering calculator
    - halo simulation/emulator
    - light-mediator direct-detection recast
    route_status: planned
    source_model_features:
    - Yukawa potential from a light mediator
    - velocity-dependent transfer cross section
    - symmetric particle-antiparticle population with attractive and repulsive channels
    validation_tests:
    - Reproduce the primary parameter-space contours and direct-detection figure before adding modern
      data.
