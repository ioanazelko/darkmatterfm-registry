    and halo-shape velocities around 300 km/s, while allowing larger dwarf-scale scattering.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'no'
    description: The light mediator gives non-power-law velocity dependence rather than a constant elastic
      cross section.
    id: velocity_dependent_yukawa_scattering
    impact_if_violated: A constant large cross section is much more strongly limited by clusters and dwarf-spheroidal
      consistency.
    notes: null
    scope: astrophysical recast
    source_reference_ids:
    - arxiv:1308.0618
    - arxiv:1208.3026
    status: established
  benchmark_implications:
  - Viable points must be velocity dependent enough to affect dwarfs without overspherical clusters.
  caveats:
  - Cluster limits depend on merger dynamics and halo-shape modeling.
