symmetries:
  stabilizing_mechanism: An unbroken Z3 symmetry stabilizes the complex scalar singlet dark matter.
  symmetries:
  - name: Z3
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken for the dark matter field; the real scalar mediator is even and can acquire a vev
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - Standard Model Higgs doublet
  - Standard Model fermions through scalar mixing
  dark_sector_couplings:
  - chi self-interactions including |chi|^4 and cubic Z3 terms
  - chi-phi couplings |chi|^2 phi and |chi|^2 phi^2
  - phi-Higgs portal mixing
  mediator_types:
  - scalar singlet mediator
  - mixed scalars h1 and h2
  interaction_operators:
  - '|chi|^4'
  - chi^3 + chi*^3
  - '|chi|^2 H^dagger H'
  - '|chi|^2 phi'
  - '|chi|^2 phi^2'
  - phi^2 H^dagger H
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: mild
    velocity_dependence: mild
    spin_dependence: spin_independent
  annihilation_channels:
  - 3_DM -> 2_DM number-changing self-annihilation
  - 2_DM -> 2_SM annihilation in the WIMP-like large-portal regime
  decay_channels: []
  self_scattering_channels:
  - chi chi -> chi chi
  - chi chi* -> chi chi* and conjugate processes
  cp_structure: not discussed
  flavor_structure: SM-fermion couplings inherited through scalar-Higgs mixing
  tree_or_loop_level: tree
parameters:
  core:
  - name: complex scalar dark matter mass
    symbol: m_chi
    description: Mass of the Z3-charged complex scalar singlet dark matter.
    range: Relic-density scans cover sub-GeV to GeV-scale masses; SIMP-favored regions are sub-GeV in
      the paper discussion.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1904_07562'
  - name: Z3 cubic dark-sector coupling
    symbol: Y_phi
    description: Cubic coupling contributing to the 3_DM -> 2_DM annihilation rate.
    range: scanned from 0.001 to 1 in relic-density examples
    role: core
    status: inferred
    source_reference_ids:
    - '1904_07562'
  - name: real scalar singlet vacuum expectation value
    symbol: v_phi
    description: VEV of the real scalar singlet that mixes with the SM Higgs and mediates additional dark-sector
      channels.
    range: examples vary v_phi from 30 m_chi to 120 m_chi
    role: core
    status: inferred
    source_reference_ids:
    - '1904_07562'
  - name: light scalar mediator mass
    symbol: m_h1
    description: Mass of the mostly-singlet scalar h1 after mixing with the SM Higgs.
    range: paper emphasizes light/sub-GeV h1 for the SIMP realization and also scans heavier WIMP comparison
      cases
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1904_07562'
  - name: SM-like Higgs mass
    symbol: m_h2
    description: Mass of the SM-like scalar h2 in the mixed scalar sector.
    value: '125'
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1904_07562'
  - name: Higgs vacuum expectation value
    symbol: v_h
    description: Standard Model Higgs vev used in the scalar mixing relations.
    value: '246'
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1904_07562'
  - name: Higgs portal couplings
    symbol: lambda_h, lambda_phih
    description: Portal couplings connecting the dark scalars to the SM Higgs; kept very small in the
      SIMP limit.
    value: about 0.001 in SIMP examples
    role: core
    status: assumed
    source_reference_ids:
    - '1904_07562'
  - name: scalar mixing angle
    symbol: theta
    description: Mixing angle between the real singlet scalar and the SM Higgs field.
    value: chosen close to the mostly-singlet/SM-like limit in SIMP examples
    role: core
    status: assumed
    source_reference_ids:
    - '1904_07562'
  nuisance: []
  derived: []
production:
  mechanisms:
  - thermal SIMP freeze-out through 3_DM -> 2_DM number-changing processes in the dark sector
  - WIMP-like 2_DM -> 2_SM freeze-out is possible in the same Lagrangian when portal couplings are larger
  thermal_equilibrium_with_standard_model: partial
  thermal_equilibrium_with_hidden_sector: 'yes'
  abundance_set_by:
  - 3-to-2 annihilation cross section
  - Y_phi
  - v_phi
  - m_chi
  - m_h1
  - dark scalar self-couplings
  - Higgs portal couplings in the WIMP limit
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: 'no'
  notes: The SIMP limit assumes very small Higgs portal couplings so that 2_DM -> 2_SM annihilation is
    subdominant while scattering with the SM can maintain kinetic equilibrium.
