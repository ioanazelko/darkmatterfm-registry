identity:
  name: Z3-stabilized scalar SIMP dark matter with a real scalar mediator
  family: self_interacting_dark_matter
  aliases:
  - SIMPler scalar dark matter
  - Z3 scalar SIMP
  - complex scalar singlet SIMP
  short_description: A scalar dark-sector model in which a complex scalar singlet is stabilized by an
    unbroken Z3 symmetry, while a real scalar singlet gets a vev, mixes with the Higgs, and mediates 3-to-2
    SIMP freeze-out.
  historical_origin_or_motivation: Designed as a simpler scalar realization of SIMP dark matter that avoids
    relying on an extra U(1) vector mediator and keeps dark-sector couplings in a perturbative range.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - SIMP dark matter
  - Z3 scalar dark matter
  - Higgs portal scalar dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes a renormalizable scalar potential for the SM Higgs, a complex scalar singlet
    dark matter field, and a real scalar singlet mediator.
particle_content:
  dark_matter_candidate:
    name: complex scalar singlet chi
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - real scalar singlet phi
  mediators:
  - mostly-singlet scalar h1
  - SM-like scalar h2 through mixing
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
