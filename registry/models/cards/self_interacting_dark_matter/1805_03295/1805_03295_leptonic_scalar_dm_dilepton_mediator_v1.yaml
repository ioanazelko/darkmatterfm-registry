  source_reference_ids:
  - src_1805_03295_primary
  notes: null
- id: con_scalar_direct_detection_higgs_portal
  name: Underground direct-search bound on scalar Higgs exchange
  constraint_type: direct_detection
  observable_channel: direct_detection:nuclear_recoils
  applies: parameter_dependent
  constrained_parameters:
  - lambda_01
  - m_chi
  excluded_regions:
  - Large lambda_01 values that give excessive Higgs-mediated nuclear recoils are disfavored.
  allowed_regions:
