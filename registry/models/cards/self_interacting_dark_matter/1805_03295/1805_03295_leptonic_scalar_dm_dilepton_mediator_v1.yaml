constraints:
- id: con_cmb_neutrino_mediator_escape
  name: CMB energy-injection problem avoided by neutrino-only mediator decay
  constraint_type: cosmological
  observable_channel: cmb:late_energy_injection
  applies: 'yes'
  constrained_parameters:
  - mediator decay branching fractions
  - Dirac neutrino assumption
  excluded_regions:
  - Light mediators that decay to electrons or photons after Sommerfeld-enhanced production are ruled
    out by CMB disruption in the motivation of the paper.
  allowed_regions:
  - A scalar dilepton mediator that decays only to neutrinos through conserved lepton number avoids the
    electromagnetic CMB bound.
  benchmark_implications:
  - This is the central motivation for coupling the self-interacting mediator to Dirac neutrinos.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: Planck-era CMB bounds cited in primary paper
  recasting_needed: partial
  robustness: medium
  assumptions:
  - id: assume_dirac_neutrinos
    description: Neutrinos are Dirac fermions and lepton number is conserved or broken to a suitable Z_N.
    scope: mediator decay and CMB safety
    status: assumed
    impact_if_violated: Majorana neutrino masses or charged electromagnetic mediator decays would invalidate
      the CMB-escape mechanism.
    can_be_relaxed: 'no'
    source_reference_ids:
    - src_1805_03295_primary
    notes: null
  caveats:
  - The primary paper relies on existing CMB energy-injection constraints rather than providing a likelihood.
  source_reference_ids:
  - src_1805_03295_primary
  notes: null
- id: con_self_interaction_benchmark
  name: Benchmark self-interaction strength for halo cores
  constraint_type: astrophysical
  observable_channel: small_scale_structure:self_interactions
  applies: parameter_dependent
  constrained_parameters:
  - sigma_el/m_DM
  - m_DM
  - m_zeta
  - couplings
  excluded_regions:
  - Parameter points with too small sigma_el/m_DM do not address cores; too large a value can conflict
    with halo-shape or cluster constraints not recast in the primary paper.
  allowed_regions:
  - The primary examples target sigma_el/m_DM = 1 cm^2/g with weak-scale DM and a MeV-scale dilepton mediator.
  benchmark_implications:
  - Connects the particle model to dwarf-galaxy core phenomenology.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: assume_sidm_benchmark
    description: The 1 cm^2/g value is used as a representative SIDM benchmark.
    scope: halo phenomenology
    status: assumed
    impact_if_violated: The preferred value varies by halo mass and dataset.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - src_1805_03295_primary
    notes: null
  caveats:
