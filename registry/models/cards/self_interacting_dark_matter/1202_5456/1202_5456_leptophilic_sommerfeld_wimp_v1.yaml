theory_to_observable_routing:
  routes:
  - agent_notes: The forward model is more important than isolated parameter cuts for this paper.
    caveats:
    - Leptophilic toy model constraints do not automatically cover all mediator embeddings.
    constraint_ids:
    - con-relic-density-reannihilation
    - con-light-mediator-self-interaction
    derived_quantities:
    - Sommerfeld enhancement
    - chemical and kinetic decoupling temperatures
    - post-decoupling yield
    - velocity dispersion
    - M_cut
    description: Integrate the coupled number-density and temperature evolution with Sommerfeld-enhanced
      annihilation, then map the asymptotic velocity dispersion to a matter-power cutoff.
    forward_model_chain:
    - inputs:
      - mediator masses
      - couplings
      - relative velocity
      notes: Primary paper includes the Sommerfeld-enhanced setup.
      outputs:
      - S(v)
      - enhanced annihilation rate
      step_id: step-sommerfeld
      step_type: analytic_formula
      tool_or_code: null
      validity: valid in the nonrelativistic light-mediator regime
    - inputs:
      - S(v)
      - scattering rates
      - thermal history
      notes: This is the main computational route.
      outputs:
      - Y(x)
      - y(x)
      - relic abundance
      step_id: step-coupled-y-y
      step_type: boltzmann_solver
      tool_or_code: custom coupled Boltzmann integrator
      validity: requires numerical integration through kinetic decoupling
    - inputs:
      - asymptotic velocity dispersion
      - interaction rates
      notes: Related ETHOS source gives a reusable mapping direction.
      outputs:
      - M_cut
      - linear power cutoff
      step_id: step-cutoff
      step_type: transfer_function
      tool_or_code: ETHOS or equivalent transfer mapping
      validity: approximate without full Boltzmann hierarchy
    id: route-coupled-boltzmann-cutoff
    input_parameters:
    - m_chi
    - m_s
    - m_p
    - g_chi^s
    - g_chi^p
    - g_l
    - kinetic-scattering rates
    likelihoods:
    - dark-matter abundance likelihood
    - small-scale cutoff/subhalo likelihoods
    - SIDM transfer-cross-section recasts
    observable_ids:
    - obs-sommerfeld-smallest-protohalos
    - obs-post-kd-reannihilation
    required_code_resources:
    - coupled Boltzmann solver
    - Sommerfeld factor calculator
    - matter-transfer/cutoff mapper
    route_status: planned
    source_model_features:
    - fermionic WIMP
    - light scalar/pseudoscalar mediator
    - leptophilic couplings
    - velocity-dependent annihilation and self-scattering
    validation_tests:
    - Recover standard freeze-out when Sommerfeld enhancement is disabled.
    - Reproduce the primary-paper cutoff-mass examples.
