  - N1 N1 -> Zprime Zprime
  - N2 N2 -> Zprime Zprime
  - N1 N2 -> Zprime eta
  - subdominant N1 N1 -> Zprime Zprime s-wave
  decay_channels:
  - Zprime predominantly to neutrinos
  - loop-suppressed Zprime to e+ e-
  self_scattering_channels:
  - N1 N1 elastic scattering through light eta exchange near the s-wave quantum resonance
  cp_structure: CP symmetry is assumed in the L_mu-L_tau sector to restrict the Yukawa coupling.
  flavor_structure: The gauge force couples to muon and tau lepton number; the model also discusses neutrino
    non-standard interactions.
  tree_or_loop_level: tree
parameters:
  core:
  - name: dark matter mass
    symbol: m_N1
    description: Mass scale where the unitarity-saturating self-scattering can match dwarf and cluster
      halo scales.
    value: around 10-20
    unit: GeV
    scale: linear
    role: core
    status: established
    source_reference_ids:
    - paper:2007_15522
    notes: The effective-range discussion uses m = 20 GeV and the conclusion states m around 10 GeV as
      the maximally self-interacting scale.
  - name: L_mu-L_tau gauge coupling
    symbol: gprime
    description: Gauge coupling region that ameliorates the muon g-2 discrepancy.
    range:
      min: 4e-4
      max: 1e-3
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range quoted with m_Zprime = 8-200 MeV.
