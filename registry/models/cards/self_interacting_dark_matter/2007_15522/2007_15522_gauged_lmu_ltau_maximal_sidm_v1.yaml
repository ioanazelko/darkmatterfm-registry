validity_domain:
- id: quantum_resonance
  applies_to: model
  condition: The large velocity dependence requires the s-wave self-scattering to lie very close to a
    zero-energy quantum resonance and nearly saturate the unitarity bound.
  status: established
  valid_range: low velocities from roughly 20 to 200 km/s in the displayed benchmark discussion
  extrapolation_risk: high
  caveats:
  - The resonance condition is fine-tuned and sensitive to mediator parameters.
  source_reference_ids:
  - paper:2007_15522
- id: hulthen_potential
  applies_to: calculation
  condition: The Yukawa potential from eta exchange is approximated by a Hulthen potential for analytic
    resonant-scattering and Sommerfeld estimates.
  status: approximate
  valid_range: resonant regime with m_N1/m_eta and m_N1 v_rel/m_eta conditions as described in the paper
  extrapolation_risk: medium
  caveats:
  - Classical and Born regimes require different approximations.
  source_reference_ids:
  - paper:2007_15522
- id: light_zprime_cosmology
  applies_to: parameter
  condition: The paper assumes m_eta > m_Zprime to avoid eta lifetimes exceeding about 1 s, and highlights
    m_Zprime around 10-20 MeV for the Delta N_eff discussion.
  status: established
  valid_range: m_Zprime about 10-20 MeV for the highlighted cosmological overlap
  extrapolation_risk: medium
  caveats:
  - Heavier Zprime can prevent reaching the largest dwarf-scale self-scattering target.
  source_reference_ids:
  - paper:2007_15522
