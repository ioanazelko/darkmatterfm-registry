  short_description: A gauged L_mu-L_tau self-interacting dark matter variant in which a vector-like fermion
    pair yields a stable pseudo-Dirac Majorana state N1, with light scalar exchange tuned near a zero-energy
    resonance to nearly saturate the s-wave unitarity bound.
  historical_origin_or_motivation: The paper develops maximally self-interacting dark matter as a benchmark
    for small-scale halo structure and embeds the quantum-resonant self-scattering condition in a gauged
    L_mu-L_tau model.
  status: speculative
  model_kind: complete_theory
