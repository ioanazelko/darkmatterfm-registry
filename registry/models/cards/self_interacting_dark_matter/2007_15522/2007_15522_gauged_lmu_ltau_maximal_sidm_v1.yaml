symmetries:
  stabilizing_mechanism: An unbroken residual Z_2 symmetry from the L_mu-L_tau Higgs vacuum expectation
    value stabilizes the lightest mass eigenstate N1.
  symmetries:
  - name: U(1)_{L_mu-L_tau}
    type: gauge
    exact_or_approximate: broken
    breaking: broken by a Higgs field carrying unit L_mu-L_tau charge
    breaking_scale:
      name: L_mu-L_tau breaking scale
      symbol: v_phi
      description: Related to m_Zprime/gprime in the model discussion.
      value: m_Zprime/gprime
      role: core
      status: inferred
      source_reference_ids:
      - paper:2007_15522
      notes: The text gives m_Zprime and gprime ranges rather than a direct VEV number.
  - name: residual Z_2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken by the Higgs VEV
    breaking_scale: null
  - name: CP symmetry
    type: discrete
    exact_or_approximate: exact
    breaking: assumed to restrict the Yukawa coupling
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
