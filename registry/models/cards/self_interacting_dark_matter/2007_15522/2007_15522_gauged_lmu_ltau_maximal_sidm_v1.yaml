        prediction.
    unit: MeV
    scale: linear
    role: core
    status: established
    source_reference_ids:
    - paper:2007_15522
  - name: light scalar mediator mass
    symbol: m_eta
    description: Mass of the scalar mode mediating the long-range N1 self-interaction.
    value: O(10)
    unit: MeV
    scale: linear
    role: core
    status: established
    source_reference_ids:
    - paper:2007_15522
    notes: The text says the model considers an O(10) MeV scalar and assumes m_eta > m_Zprime for cosmology.
  - name: self-interaction cross section per mass
    symbol: sigma/m
    description: Velocity-dependent self-scattering target from dwarfs to clusters.
    range:
      min: 0.1
      max: 100
      inclusive_min: true
      inclusive_max: true
      unit: cm^2/g
      notes: Paper discusses 0.1 cm^2/g at clusters up to 100 cm^2/g at Milky-Way dwarf satellites.
    unit: cm^2/g
    scale: log
    role: derived
    status: established
    source_reference_ids:
    - paper:2007_15522
  - name: canonical thermal annihilation cross section
    symbol: sigma_v_can
    description: Value used to fix the Yukawa coupling at x = 20.
    value: 3e-26
    unit: cm^3/s
    scale: log
    role: cosmological
    status: assumed
    source_reference_ids:
    - paper:2007_15522
