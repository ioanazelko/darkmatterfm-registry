mass_scales_and_hierarchies:
  scales:
  - name: potential energy scale
    symbol: alpha_D^2 m_D
    description: Controls whether the potential well can compensate the pseudo-Dirac splitting during
      low-velocity self-scattering.
    unit: mass
    role: derived
    status: inferred
    source_reference_ids: []
  - name: direct-detection kinetic scale
    description: Typical incoming kinetic energy in dark matter-nucleus scattering near Earth.
    value: at most a few hundred keV
    unit: keV
    role: derived
    status: inferred
    source_reference_ids: []
  hierarchy_questions:
  - question: Is Delta m larger than direct-detection kinetic energy?
    answer: Yes for Delta m greater than about 1 MeV, making chi_1 p -> chi_2 p kinematically forbidden.
    status: inferred
  - question: Is Delta m below alpha_D^2 m_D in the SIDM regime?
    answer: When yes, self-scattering remains comparable to pure Dirac SIDM; when no, it is loop-suppressed.
    status: inferred
