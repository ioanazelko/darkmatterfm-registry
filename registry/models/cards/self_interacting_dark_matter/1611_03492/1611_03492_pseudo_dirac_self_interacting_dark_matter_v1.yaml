      up-scattering.
    unit: MeV
    role: core
    status: established
    source_reference_ids: []
  - name: dark fine-structure constant
    symbol: alpha_D
    description: alpha_D = g_D^2/(4 pi).
    value: 10^-2 benchmark; alpha_D = 0.1 also discussed
    role: core
    status: assumed
    source_reference_ids: []
  - name: kinetic mixing
    symbol: epsilon
    description: Photon-dark-photon kinetic mixing coupling the dark photon to the electromagnetic current.
    range: model dependent; allowed to be sizable once inelastic direct detection is kinematically suppressed
    role: core
    status: inferred
    source_reference_ids: []
