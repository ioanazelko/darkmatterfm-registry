theory_to_observable_routing:
  routes:
  - id: sidm_mass_mediator_to_constraints
    description: For each dark-matter and mediator mass pair, solve for minimal alpha_D, then propagate
      epsilon to direct-detection and astrophysical limits.
    source_model_features:
    - fermionic SIDM
    - kinetically mixed dark photon
    - agnostic relic genesis
    input_parameters:
    - m_chi
    - m_V
    - sigma_T/m_chi target
    - epsilon
    derived_quantities:
    - alpha_D
    - sigma_p
    - sigma_e
    - cluster-scale sigma_T/m_chi
    - tau_V
    forward_model_chain:
    - step_id: solve_self_scattering
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - m_chi
      - m_V
      - sigma_T/m_chi at 10 km/s
      outputs:
      - minimal alpha_D
      validity: Uses the resonant light-mediator transfer cross-section formula in the primary paper.
      notes: Multiple alpha_D solutions can exist; the paper uses the smallest one.
    - step_id: apply_cluster_and_screens
      step_type: validation
      tool_or_code: null
      inputs:
      - alpha_D
      - sigma_ann v
      - cluster velocity
      outputs:
      - screened mass-mediator plane
      validity: Uses benchmark astrophysical and perturbativity screens.
      notes: Cluster bound applied at face value.
    - step_id: compute_recoil_limits
      step_type: recasting
      tool_or_code: DDCalc plus electron-recoil recasts
      inputs:
      - epsilon
      - m_chi
      - m_V
      - alpha_D
      outputs:
      - epsilon upper limits
      validity: Detector thresholds and light-mediator form factors must be modeled.
      notes: Primary paper combines nuclear and electron recoil experiments.
    observable_ids:
    - sidm_dwarf_core_self_scattering
    - sidm_direct_recoil_signals
    constraint_ids:
    - sidm_cluster_cross_section
    - sidm_direct_detection_limits
    - sidm_annihilation_density_perturbativity
    likelihoods:
    - direct-detection likelihoods or limit curves
    required_code_resources:
    - DDCalc
    - published electron-recoil limit curves
    validation_tests:
    - Reproduce the primary epsilon limit panels.
    route_status: planned
    agent_notes: A full recast needs the primary paper's numerical grids or code, which are not in the
      assigned text.
    caveats:
    - Relic production remains unspecified by design.
  - id: sidm_lifetime_energy_injection_route
    description: Convert epsilon into mediator lifetime and rescale CMB/gamma-ray energy-injection limits
      for boosted delayed decays.
    source_model_features:
    - long-lived vector mediator
    - residual symmetric-DM annihilation
    input_parameters:
    - epsilon
    - m_V
    - m_chi
    - sigma_ann v
    - Br_EM
    derived_quantities:
    - tau_V
    - boosted decay time
    - deposited electromagnetic energy
    forward_model_chain:
    - step_id: compute_lifetime
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - epsilon
      - m_V
      outputs:
      - tau_V
      validity: Decay modes change below the electron threshold.
      notes: Primary paper marks BBN, CMB, and universe-age lifetime contours.
    - step_id: integrate_energy_injection
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - sigma_ann v
      - tau_V
      - Br_EM
      - redshift
      outputs:
      - deposited EM energy
      validity: Approximate rescaling of existing annihilation limits.
      notes: The paper uses Planck, Fermi-LAT, and H.E.S.S. limits.
    - step_id: derive_epsilon_bounds
      step_type: likelihood
      tool_or_code: null
      inputs:
      - deposited EM energy
      outputs:
      - epsilon upper limit
      validity: Requires selected external limit curve.
      notes: Implemented qualitatively here only.
    observable_ids:
    - sidm_cmb_gamma_energy_injection
    - sidm_lifetime_frontier
    constraint_ids:
    - sidm_cmb_gamma_lifetime_limits
    likelihoods:
    - Planck annihilation limit
    - Fermi-LAT diffuse gamma-ray limit
    - H.E.S.S. Galactic-center limit
    required_code_resources: []
    validation_tests:
    - Check lifetime contours against the primary paper figures.
    route_status: planned
    agent_notes: The route is source-backed but not numerically implemented in this batch.
    caveats:
    - Asymmetric DM or altered post-1-eV history changes the bound.
