  benchmark_implications:
  - The same constraint motivates lifetime-frontier search strategies.
  likelihood_available: approximate
  likelihood_reference: Rescaled existing CMB/gamma annihilation limits in the primary paper
  data_release: Planck, Fermi-LAT diffuse gamma-ray, and H.E.S.S. inputs discussed in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: sidm_late_abundance_fixed
    description: The DM abundance is assumed to match the CMB-observed value by photon temperature around
      1 eV.
    scope: cosmology
    status: assumed
    impact_if_violated: A specified earlier production history can add constraints outside this agnostic
      setup.
    can_be_relaxed: partial
    source_reference_ids:
    - src_1912_06681
  caveats:
  - The paper does not apply freeze-in bounds from T > 1 under its agnostic assumptions.
  source_reference_ids:
  - src_1912_06681
  notes: BBN energy-injection effects are discussed but not retained as final leading bounds.
- id: sidm_annihilation_density_perturbativity
  name: Dwarf-density depletion and perturbativity screens
  constraint_type: theoretical
  observable_channel: small_scale_structure
  applies: 'yes'
  constrained_parameters:
  - alpha_D
  - sigma_ann v
  - m_chi
  - m_V
  excluded_regions:
  - Points with alpha_D > 10 or with annihilation large enough to deplete dwarf central densities over
    1e10 yr are removed.
  allowed_regions:
  - Accepted points keep annihilation decoupled by T around 1 eV and preserve dwarf halo densities.
  benchmark_implications:
  - These screens define the physically allowed self-scattering target region before visible-sector constraints.
  likelihood_available: 'no'
