  - agent_notes: The primary text names CLASSICS and CosmoTransitions as public tools but does not provide
      a dedicated repository.
    caveats:
    - MeV-era cosmology and dark-visible thermal contact assumptions require separate validation.
    constraint_ids:
    - con_pta_mev_phase_transition
    - con_sidm_cross_section_targets
    - con_cmb_annihilation_asymmetry
    derived_quantities:
    - sigma/m_DM(v)
    - T_*
    - alpha
    - beta/H_*
    - Omega_GW(f)
    - CMB annihilation flag
    description: Jointly compute the dark U(1) finite-temperature phase transition, nHz gravitational-wave
      spectrum, dark-photon-mediated SIDM cross sections, and CMB-annihilation consistency.
    forward_model_chain:
    - inputs:
      - finite-temperature dark-Higgs potential
      notes: Find strong MeV-scale FOPT benchmarks.
      outputs:
      - nucleation temperature
      - phase-transition strength
      - beta/H_*
      step_id: s1
      step_type: other
      tool_or_code: CosmoTransitions or equivalent
      validity: Finite-temperature perturbative potential used in the paper.
    - inputs:
      - T_*
      - alpha
      - beta/H_*
      - v_w
      notes: Compute nHz stochastic spectrum for PTA comparison.
      outputs:
      - PTA-band GW spectrum
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Standard FOPT gravitational-wave approximations.
    - inputs:
      - m_DM
      - m_Aprime
      - g_prime
      - velocity
      notes: Match dwarf/galaxy and cluster targets.
      outputs:
      - viscosity/self-scattering cross section
      step_id: s3
      step_type: other
      tool_or_code: CLASSICS or equivalent
      validity: Velocity-dependent light-mediator SIDM scattering.
    - inputs:
      - annihilation cross section
      - Y_chi
      notes: Verify asymmetry suppresses late annihilation.
      outputs:
      - CMB annihilation consistency flag
      step_id: s4
      step_type: recasting
      tool_or_code: null
      validity: Needs recombination energy-injection likelihood for symmetric variants.
    id: route_dark_fopt_sidm_pta
    input_parameters:
    - m_DM
    - m_Aprime
    - g_prime
    - v_s
    - scalar potential parameters
    - v_w
    - Y_chi
    likelihoods:
    - PTA stochastic-background likelihood needed for precision recast
    observable_ids:
    - obs_pta_stochastic_gw
    - obs_velocity_dependent_self_scattering
    - obs_cmb_annihilation_risk
    required_code_resources:
    - CosmoTransitions
    - CLASSICS
    route_status: partially_implemented
    source_model_features:
    - Dirac dark matter
    - dark Higgs breaking U(1)'
    - MeV dark photon mediator
    - first-order dark phase transition
    - asymmetric dark matter
    validation_tests:
    - Recover dwarf/cluster target cross sections quoted in the primary text.
    - Check GW peak falls in the nHz PTA band for MeV transition benchmarks.
