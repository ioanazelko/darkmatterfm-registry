  - Regions with 0.1-10 cm^2/g at dwarf velocities v about 30 km/s and below the cluster bound are the
    target SIDM window.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: partial
    description: The heavy psi component dominates the astrophysical behavior where self-interactions
      are interesting.
    id: dominant_self_interacting_component
    impact_if_violated: If Z_D or non-interacting components are dynamically important, the effective
      halo response changes.
    notes: null
    scope: halo self-scattering recast
    source_reference_ids:
    - src_1804_10385_primary
    status: assumed
  benchmark_implications:
  - The stable-vector model can address small-scale structure only in parameter regions satisfying both
    dwarf-scale enhancement and cluster-scale suppression.
  caveats:
  - Preferred cross-section ranges are phenomenological and not a complete halo likelihood.
  constrained_parameters:
  - m_psi
  - m_Z_D
  - g_psi
  - sigma_T/m_psi
  constraint_type: astrophysical
  data_release: null
  excluded_regions:
  - Parameter points with sigma_T/m_psi above about 1 cm^2/g at cluster velocities v about 1000 km/s are
    treated as excluded by the primary paper.
  id: sidm_velocity_constraints
  likelihood_available: approximate
  likelihood_reference: null
  name: Dwarf-to-cluster self-interaction window
  notes: null
  observable_channel: self-interacting halo structure
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - src_1804_10385_primary
  - src_1508_03339
  - src_1211_6426
- allowed_regions:
  - Viable regions require depleted Z_D abundance, suitable m_h_D < m_Z_D, and suppressed visible-sector
    couplings consistent with stability and decay requirements.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'yes'
    description: Dark Higgs decays transfer energy to SM states and must not spoil BBN or CMB observables.
    id: dark_higgs_decay_history
    impact_if_violated: Different hidden decay modes or lifetimes would change the CMB and BBN constraints.
    notes: null
    scope: thermal history and CMB recast
    source_reference_ids:
    - src_1804_10385_primary
    status: assumed
  benchmark_implications:
  - CMB constraints carve out the mass-coupling plane even when the vector mediator is stable.
  caveats:
  - A full recast needs the recombination-era velocity, Sommerfeld factors, and species abundances.
  constrained_parameters:
  - m_psi
  - m_Z_D
  - m_h_D
  - g_psi
  - g_D
  - Omega_Z_D h^2
  - theta
  constraint_type: cosmological
  data_release: null
  excluded_regions:
  - Regions where psi or Z_D annihilation followed by dark-Higgs decay injects too much visible energy
    during recombination.
  id: cmb_energy_injection_constraint
  likelihood_available: approximate
  likelihood_reference: null
  name: CMB limits on late annihilation in the stable-vector mediator model
  notes: null
  observable_channel: CMB energy injection
  recasting_needed: 'yes'
  robustness: high
  source_reference_ids:
  - src_1804_10385_primary
theory_to_observable_routing:
  routes:
  - agent_notes: The model is highly constrained by the simultaneous relic, CMB, and self-scattering requirements.
    caveats:
    - Direct detection and BBN constraints depend on the portal implementation.
    constraint_ids:
    - sidm_velocity_constraints
    - cmb_energy_injection_constraint
    derived_quantities:
    - Omega_psi h^2
    - Omega_Z_D h^2
    - sigma_T/m_psi(v)
    - annihilation energy-injection rate
    description: Solve the two-component dark-sector thermal history, compute self-scattering through
      the stable vector mediator, and apply CMB plus halo-structure constraints.
    forward_model_chain:
    - inputs:
      - masses
      - dark couplings
      - Higgs mixing
      notes: Primary paper emphasizes conversion and late Z_D annihilation.
      outputs:
      - psi and Z_D relic abundances
      step_id: freezeout_conversion
      step_type: boltzmann_solver
      tool_or_code: null
      validity: requires coupled Boltzmann equations and conversion processes
    - inputs:
      - m_psi
      - m_Z_D
      - g_psi
      - velocity
      notes: Compare dwarf and cluster velocities.
      outputs:
      - sigma_T/m_psi as a function of velocity
      step_id: self_scattering
      step_type: analytic_formula
      tool_or_code: null
      validity: Born/classical/resonant regimes require different approximations
    - inputs:
      - annihilation rates
      - species fractions
      - dark-Higgs visible branching
      notes: Use Planck-like energy injection bounds.
      outputs:
      - CMB-excluded regions
      step_id: cmb_recast
      step_type: likelihood
      tool_or_code: null
      validity: planned; approximate in this enrichment row
    id: route_stable_vector_sidm
    input_parameters:
    - m_psi
    - m_Z_D
    - m_h_D
    - g_psi
    - g_D
    - theta
    - epsilon
    likelihoods:
    - CMB energy-injection likelihood
    - phenomenological SIDM halo target ranges
    observable_ids:
    - stable_vector_sidm_scattering
    - stable_vector_cmb_energy_injection
    required_code_resources:
    - coupled Boltzmann solver
    - self-scattering module with Sommerfeld/resonance treatment
    - CMB energy-injection recast
    route_status: planned
    source_model_features:
    - heavy weak-scale psi dark matter
    - stable MeV-scale vector mediator Z_D as subdominant DM
    - dark Higgs h_D enabling Z_D depletion
    validation_tests:
    - Reproduce primary paper benchmark relic-density contours.
    - Check sigma_T/m at v=30 km/s and v=1000 km/s for benchmark points.
