validity_domain:
- id: pico_charge_trapping
  applies_to: model
  condition: C particles remain in the Galactic disk only when their Larmor radius is below the disk thickness,
    requiring q_C of order 1e-11 for the benchmark masses.
  status: inferred
  extrapolation_risk: medium
  caveats: []
  source_reference_ids: []
- id: light_C_for_detector_recoil
  applies_to: parameter
  condition: m_C around 1-5 MeV gives keV electron recoils; m_C below about 12 MeV avoids high-energy
    positron bounds discussed by the paper.
  status: inferred
  extrapolation_risk: medium
  caveats: []
  source_reference_ids: []
- id: small_decay_fraction
  applies_to: parameter
  condition: The accepted XENON1T fit and bounds require f around few 1e-7 to 1e-6, implying tau_X greater
    than about 1e6 times the age of the Universe.
  status: inferred
  extrapolation_risk: medium
  caveats: []
  source_reference_ids: []
- id: dark_photon_bounds
  applies_to: model
  condition: Dark photon couplings and mass must avoid stellar cooling, supernova cooling, and N_eff limits;
    the paper discusses neutrino decay channels to relax some bounds.
  status: speculative
  extrapolation_risk: high
  caveats: []
  source_reference_ids: []
assumptions:
  global:
  - id: local_C_density_tracks_DM
    description: The local C and anti-C density is estimated as f times the local dark matter density
      divided by m_X.
    scope: production
    status: assumed
    impact_if_violated: Detector-rate predictions change directly if the Galactic C density differs.
    can_be_relaxed: 'yes'
    source_reference_ids: []
  - id: single_C_velocity
    description: The C velocity distribution is approximated by a delta function at v_f=0.08.
    scope: production
    status: approximate
    impact_if_violated: The electron recoil spectrum and endpoint would broaden for a full velocity distribution.
    can_be_relaxed: 'yes'
    source_reference_ids: []
  - id: galactic_magnetic_confinement
    description: The Galactic magnetic field traps the pico-charged C particles while dwarf-galaxy fields
      do not.
    scope: global
    status: assumed
    impact_if_violated: The 511 keV-line explanation relies on this environmental difference.
    can_be_relaxed: unknown
    source_reference_ids: []
  - id: production_agnostic
    description: The present paper does not commit to a unique early-Universe production mechanism for
      X, although it reviews the SLIM freeze-out embedding.
    scope: production
    status: unknown
    impact_if_violated: Relic-density conclusions are model dependent.
    can_be_relaxed: 'yes'
    source_reference_ids: []
