identity:
  name: Pico-charged particles from dark matter decay
  family: decaying_pico_charged_dark_matter
  aliases:
  - pico-charged C-particle decay dark matter
  - SLIM-like decaying X model
  short_description: A light scalar dark matter particle X decays very slowly into relativistic pico-charged
    C and anti-C particles; the C population is trapped by Galactic magnetic fields and can annihilate
    to positrons while also scattering from detector electrons.
  historical_origin_or_motivation: Developed to explain the Galactic 511 keV line while avoiding recombination
    and dwarf-galaxy bounds, and extended here to the XENON1T electron recoil excess.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - U_X(1) extension of the Standard Model
  - SLIM scenario for MeV scalar dark matter
  lagrangian_available: partial
  renormalizable: unknown
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the kinetic and Stueckelberg mass mixing for a dark photon A prime and gives
    the relevant C-particle gauge couplings; it stays agnostic about the detailed X production mechanism
    in this work.
particle_content:
  dark_matter_candidate:
    name: X scalar dark matter
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - pico-charged C and anti-C particles
  - dark photon A prime
  - possible coolant Y
  - right-handed Majorana fermion N in the SLIM embedding
  mediators:
  - SM photon
  - dark photon A prime
  dark_radiation_species:
  - A prime can contribute to N_eff in parts of parameter space
  unstable_parent_particles:
  - metastable X
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: X is metastable with a lifetime far longer than the age of the Universe; C particles
    are not the main relic but are retained in galaxies by magnetic fields because of their pico electric
    charge.
  symmetries:
  - name: U_X(1)
    type: gauge
    exact_or_approximate: broken
    breaking: Stueckelberg mass and mixing with hypercharge/photon
  - name: L_mu - L_tau option for A prime neutrino coupling
    type: gauge
    exact_or_approximate: unknown
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - other
  standard_model_targets:
  - electrons
  - protons
  - neutrinos
  - charged Standard Model fermions
  dark_sector_couplings:
  - g_X J_C A_prime coupling
  - X decays to C anti-C
  - possible A prime coupling to neutrinos
  mediator_types:
  - SM photon
  - dark photon A prime
  interaction_operators:
  - kinetic mixing between A and hypercharge B
  - Stueckelberg mass mixing
  - t-channel photon and dark-photon exchange in C-electron scattering
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: strong
    velocity_dependence: mild
    spin_dependence: unknown
  annihilation_channels:
  - C anti-C eventually annihilate to e- e+ pairs
  decay_channels:
  - X -> C anti-C
  - A prime -> neutrino pairs in some parameter ranges
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_X
    description: Mass of the metastable scalar X; the paper fixes a benchmark.
    value: '10'
    unit: MeV
    role: core
    status: inferred
    notes: The paper discusses few-MeV X and fixes m_X=10 MeV for the XENON1T analysis.
  - name: C-particle mass
    symbol: m_C
    description: Mass of the pico-charged intermediate particle.
    range: about 1-5 MeV, with m_C < 12 MeV used to satisfy high-energy positron bounds
    unit: MeV
    role: core
    status: inferred
  - name: C-particle electric charge
    symbol: q_C
    description: Tiny electric charge induced by mass mixing.
    value: order 1e-11 e
    unit: electric charge
    role: core
    status: inferred
  - name: decayed fraction of X
    symbol: f
    description: Fraction of dark matter particles that have decayed into C anti-C by today.
    range: few 1e-7 to 1e-6; XENON1T gives an upper bound around 1e-6
    role: core
    status: inferred
  - name: C-particle velocity after cooling
    symbol: v_f
    description: Collective velocity used for Galactic C particles after cooling on Y.
    value: 0.08 c
    role: core
    status: inferred
  - name: dark photon mass
    symbol: m_A_prime
    description: Mass ranges considered for dark photon exchange and cooling bounds.
    range: keV to few MeV depending on scenario
    role: core
    status: inferred
  - name: dark photon coupling to SM fermions
    symbol: q_prime
    description: Coupling generated by kinetic and mass mixing.
    range: model dependent; examples include 1e-9 to 1e-10 or about 3e-8 with neutrino decay modes
    role: core
    status: inferred
  derived:
  - name: dark matter lifetime lower bound
    symbol: tau_X
    description: Lifetime inferred from XENON1T electron recoil data.
    value: larger than 1e6 times the age of the Universe
    role: derived
    status: inferred
  - name: local dark matter density used
    symbol: rho_DM_local
    description: Local density used to estimate the C density near Earth.
    value: '0.4'
    unit: GeV/cm^3
    role: astrophysical
    status: inferred
production:
  mechanisms:
  - SLIM-like thermal freeze-out of X through annihilation to neutrinos and a right-handed Majorana fermion
  - alternative freeze-in or other nonthermal X production left open
