  - very small late-time decay fraction f
  depends_on_reheating_temperature: unknown
  can_produce_all_dark_matter: parameter_dependent
  nonthermal_momentum_distribution: parameter_dependent
  notes: The paper states that the original SLIM embedding gives a freeze-out abundance but that the present
    analysis remains agnostic about X production and fixes m_X=10 MeV.
