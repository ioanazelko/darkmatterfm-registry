identity:
  name: Bino-like neutralino dark matter with intergenerational slepton coannihilation
  family: neutralino_dark_matter
  aliases:
  - mass-degenerate stau-neutralino coannihilation scenario with slepton mixing
  short_description: A mass-degenerate MSSM scenario in which a Bino-like neutralino LSP is the thermal
    relic dark matter candidate and a long-lived slepton NLSP with small intergenerational selectron or
    smuon admixtures controls BBN-era bound-state reactions.
  historical_origin_or_motivation: The paper develops the slepton-neutralino coannihilation scenario as
    a way to realize the neutralino dark matter abundance while addressing lithium abundances through
    long-lived charged-slepton bound states.
  status: speculative
  model_kind: complete_theory
