parameters:
  core:
  - name: neutralino LSP mass
    symbol: m_chi0_1
    description: Mass of the Bino-like neutralino LSP; close degeneracy with the slepton NLSP is required.
    range: model-dependent; examples use weak-scale slepton masses around 300-350 GeV with small mass
      splitting
    unit: GeV
    role: core
    status: assumed
  - name: slepton NLSP mass
    symbol: m_slepton
    description: Mass of the long-lived charged slepton NLSP.
    range: reference values around 300-350 GeV are used in the paper's lifetime and BBN examples
    unit: GeV
    role: core
    status: assumed
  - name: slepton-neutralino mass difference
    symbol: Delta m
    description: Mass difference between the charged slepton NLSP and the neutralino LSP.
    range: less than about one percent degeneracy; special cases below the muon threshold and between
      the muon mass and 125 MeV are discussed
    unit: GeV
    role: core
    status: inferred
  - name: selectron admixture
    symbol: c_e
    description: Ratio of selectron component to stau component in the lightest slepton.
    range:
      min: 2e-11
      max: 2e-9
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Allowed interval quoted for simultaneously addressing 7Li and 6Li in the abstract.
    role: core
    status: inferred
  - name: smuon admixture
    symbol: c_mu
    description: Ratio of smuon component to stau component in the lightest slepton.
    range: c_mu <= 5e-5 for mass difference below the muon mass; c_mu <= 2e-10 for mass difference between
      the muon mass and 125 MeV
    unit: null
    role: core
    status: inferred
  - name: baryon-to-photon ratio
    symbol: eta
    description: Cosmological baryon-to-photon ratio adopted for the BBN calculation.
    value: (6.225 +/- 0.170)e-10
    unit: null
    role: cosmological
    status: assumed
