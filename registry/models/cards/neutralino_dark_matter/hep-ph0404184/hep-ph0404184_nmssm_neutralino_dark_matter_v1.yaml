  aliases:
  - nearly Minimal Supersymmetric Standard Model dark matter
  - singlino-like nMSSM neutralino LSP
  short_description: A nearly minimal supersymmetric model with a singlet superfield in which a mostly
    singlino lightest neutralino can thermally produce an acceptable dark matter density in the same parameter
    region as a strong first-order electroweak phase transition.
  historical_origin_or_motivation: Designed to solve the mu problem and avoid the NMSSM domain wall problem
    while connecting dark matter with electroweak baryogenesis.
  status: speculative
  model_kind: complete_theory
