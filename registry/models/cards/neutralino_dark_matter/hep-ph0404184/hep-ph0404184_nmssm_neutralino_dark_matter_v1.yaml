    range:
      min: 3e14
      max: null
      inclusive_min: true
      inclusive_max: true
      unit: GeV
      notes: Lower value quoted for cosmological neutralino lifetime in the Z_5^R case.
    unit: GeV
    role: core
    status: inferred
  embedded_in_larger_framework: 'yes'
  notes: The model is the nMSSM with a singlet superfield, a singlet tadpole, and discrete R symmetries
    that avoid axions and domain walls.
