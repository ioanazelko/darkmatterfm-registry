validity_domain:
- id: unbroken_u1d_vacuum
  applies_to: model
  condition: The dark U(1)_D must remain unbroken, with the vacuum at chi = 0 and h = v.
  status: assumed
  extrapolation_risk: high
  caveats:
  - If U(1)_D is broken, the complex scalar is not stabilized as dark matter.
  source_reference_ids:
  - '2003_08947'
  notes: The paper explicitly restricts to vacua preserving U(1)_D.
- id: pNGB_effective_description
  applies_to: model
  condition: The nonlinear pNGB description is used below the symmetry-breaking scale/cutoff and for f
    larger than the electroweak scale.
  status: assumed
  extrapolation_risk: medium
  caveats:
  - A complete UV completion is not specified in the extracted text.
  source_reference_ids:
  - '2003_08947'
  notes: Higgs coupling constraints motivate f several times larger than v.
- id: thermal_relic_region
  applies_to: parameter
  condition: The correct relic abundance is obtained only in parameter-dependent regions of m_chi, f/v,
    lambda_h, and quirk masses.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The paper's relic plots use representative benchmarks rather than an exhaustive global scan.
  source_reference_ids:
  - '2003_08947'
  notes: The paper notes overproduction below about 50 GeV and an upper mass near 1 TeV for f/v <= 10.
