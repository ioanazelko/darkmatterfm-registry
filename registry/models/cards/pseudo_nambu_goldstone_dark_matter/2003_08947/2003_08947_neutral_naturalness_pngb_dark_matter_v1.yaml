model_id: 2003_08947_neutral_naturalness_pngb_dark_matter_v1
identity:
  name: Neutral-naturalness pseudo-Nambu-Goldstone dark matter
  family: pseudo_nambu_goldstone_dark_matter
  aliases:
  - SO(7)/SO(6) complex scalar pNGB dark matter
  - neutral-naturalness pNGB WIMP
  short_description: A neutral-naturalness model in which the Higgs doublet and a complex scalar dark
    matter candidate are pseudo-Nambu-Goldstone bosons of SO(7) breaking to SO(6); the dark matter is
    stabilized by an unbroken global U(1)_D and can be a thermal WIMP.
  historical_origin_or_motivation: The construction is motivated by linking WIMP dark matter to neutral
    naturalness while avoiding colored top partners and reducing the induced Higgs-dark-matter coupling.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - neutral naturalness
  - pseudo-Nambu-Goldstone Higgs
  - SO(7)/SO(6) coset
  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the nonlinear NGB Lagrangian, quark-sector interactions, vector-like mass terms,
    and a Coleman-Weinberg scalar potential, but treats the construction as a low-energy neutral-naturalness
    model rather than a complete UV theory.
particle_content:
  dark_matter_candidate:
    name: complex scalar chi
    spin: '0'
    statistics: scalar
    elementary_or_composite: composite
    number_of_components: single_component
  additional_dark_sector_particles:
  - hidden-color top partners
  - U(1)_D-charged vector-like fermions X and Y
  - quirk states V and T
  mediators:
  - Standard Model Higgs boson
  - hidden-color vector-like quirk states
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The global U(1)_D subgroup remains unbroken, stabilizing the complex scalar dark
    matter candidate.
  symmetries:
  - name: SO(7) -> SO(6)
    type: global
    exact_or_approximate: broken
    breaking: Spontaneous breaking at scale f produces six pNGBs identified with the Higgs doublet and
      complex scalar dark matter.
    breaking_scale:
      name: SO(7) breaking scale
      symbol: f
      description: pNGB decay constant/symmetry-breaking scale
      range: Benchmarks use f/v = 4, 6, 8, 10; Higgs coupling constraints imply f is a few times v.
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '2003_08947'
      notes: The electroweak value v is about 246 GeV in the paper.
  - name: U(1)_D
    type: global
    exact_or_approximate: exact
    breaking: Unbroken in the vacuum considered by the paper; this stabilizes chi.
    breaking_scale: null
  - name: hidden color SU(3)
    type: gauge
    exact_or_approximate: exact
    breaking: A hidden color group charges the top partners instead of ordinary SU(3)_c color.
    breaking_scale: null
  - name: UV color-exchange Z2
    type: discrete
    exact_or_approximate: broken
    breaking: The hidden color symmetry is assumed related to SM color by a discrete Z2 in the UV, broken
      at lower energies.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - Higgs boson
  - W bosons
  - Z bosons
  - top quarks
  - bottom quarks
  dark_sector_couplings:
  - derivative pNGB coupling between chi and the Higgs field
  - loop-induced non-derivative Higgs portal coupling lambda_h
  - couplings to hidden-color top partners and U(1)_D-charged vector-like fermions
  mediator_types:
  - Standard Model Higgs boson
  - hidden-color vector-like fermions
  interaction_operators:
  - derivative Higgs-chi interaction from the NGB Lagrangian
  - lambda_h h^2 |chi|^2 term in the Coleman-Weinberg scalar potential
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: mild
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - chi chi -> W+ W-
  - chi chi -> h h
  - chi chi -> Z Z
  - chi chi -> t tbar
  - chi chi -> b bbar
  decay_channels: []
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: top-sector motivated
  tree_or_loop_level: both
parameters:
  core:
  - name: dark matter mass
    symbol: m_chi
    description: Mass of the complex scalar pNGB dark matter candidate.
    range: Correct thermal relic examples begin near the Higgs-resonance region above about 50 GeV and
      extend up to about 1 TeV for f/v <= 10 in the paper's scan.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2003_08947'
    notes: The exact allowed range is parameter dependent.
  - name: SO(7) breaking scale
    symbol: f
    description: Scale for SO(7) -> SO(6) symmetry breaking and pNGB interactions.
    range: Benchmark ratios f/v = 4, 6, 8, 10; Higgs coupling constraints imply f is at least a few times
      v.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2003_08947'
    notes: The paper uses v about 246 GeV.
  - name: Higgs portal coupling
    symbol: lambda_h
    description: Loop-induced non-derivative coupling between the Higgs and chi in the scalar potential.
    range: Relic-density plots use benchmark values 0.005 and 0.025.
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '2003_08947'
    notes: Direct detection is controlled primarily by this coupling in the paper.
  - name: vector-like quirk mass
    symbol: m_V
    description: Common vector-like mass used for the U(1)_D-charged dark fermions after setting m_X =
      m_Y = m_V.
    range: The paper discusses collider lower bounds around 550 GeV and future reach up to multi-TeV masses.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2003_08947'
    notes: For simplicity the paper takes m_X = m_Y = m_V in the potential analysis.
  - name: neutral top partner mass scale
    symbol: m_Q
    description: Mass scale for color-neutral top-partner/vector-like quark states entering the Coleman-Weinberg
      potential.
    range: parameter dependent
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2003_08947'
    notes: The paper defines r_Q = m_V^2 / m_Q^2 and relates top-partner masses to tuning.
production:
  mechanisms:
  - thermal freeze-out
  - annihilation to Standard Model final states through Higgs exchange
  - semi-annihilation/conversion involving quirk states when masses are near-degenerate
  thermal_equilibrium_with_standard_model: 'yes'
  thermal_equilibrium_with_hidden_sector: partial
