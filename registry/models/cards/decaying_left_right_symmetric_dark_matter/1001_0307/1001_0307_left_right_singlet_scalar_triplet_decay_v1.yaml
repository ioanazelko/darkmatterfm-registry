    exact_or_approximate: broken
    breaking: spontaneous breaking to the Standard Model electroweak group and then U(1)_em
    breaking_scale: null
  - name: parity P
    type: discrete
    exact_or_approximate: broken
    breaking: spontaneous breaking in the left-right model
    breaking_scale: null
  - name: residual Z2 on S_D
    type: discrete
    exact_or_approximate: approximate
    breaking: tiny soft charge-conjugation violating terms V1
    breaking_scale:
      name: soft C-violating scale
      symbol: lambda
      description: Tiny coefficient needed for cosmological S_D lifetime.
      value: about 1e-23
      unit: GeV
      role: core
      status: inferred
