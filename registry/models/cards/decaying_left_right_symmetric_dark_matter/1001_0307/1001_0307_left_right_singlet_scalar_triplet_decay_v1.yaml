  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The text gives the scalar content, kinetic terms, dominant P- and CP-invariant scalar potential,
    and soft C-violating scalar potential terms of dimension less than four.
particle_content:
  dark_matter_candidate:
    name: S_D, the CP-odd component of a gauge-singlet scalar S
