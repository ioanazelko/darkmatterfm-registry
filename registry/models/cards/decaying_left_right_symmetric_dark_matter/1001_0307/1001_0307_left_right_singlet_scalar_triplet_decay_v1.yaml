  short_description: An extended left-right symmetric model in which a CP-odd gauge-singlet scalar S_D
    is long-lived dark matter and decays through SU(2)_L triplet scalars due to tiny soft C-violating
    interactions.
  historical_origin_or_motivation: The paper extends an earlier stable left-right singlet-scalar dark
    matter setup by adding soft C-violating terms to explain high-energy lepton excesses with triplet-mediated
    decays.
  status: speculative
  model_kind: complete_theory
theory:
