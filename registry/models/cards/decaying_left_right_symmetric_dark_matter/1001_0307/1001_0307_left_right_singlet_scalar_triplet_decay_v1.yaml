symmetries:
  stabilizing_mechanism: A residual Z2-type symmetry from CP stabilizes S_D in the dominant potential;
    tiny soft C violation breaks it enough to make S_D cosmologically long-lived.
  symmetries:
  - name: SU(2)_L x SU(2)_R x U(1)_{B-L}
