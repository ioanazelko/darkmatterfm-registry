  stabilizing_mechanism: An exact discrete Z2 symmetry assigns H1 -> H1 and H2 -> -H2, keeps the inert
    doublet from acquiring a vev, and stabilizes the lightest Z2-odd scalar; this paper takes S to be
    lighter than A and H+- and therefore the dark matter particle.
