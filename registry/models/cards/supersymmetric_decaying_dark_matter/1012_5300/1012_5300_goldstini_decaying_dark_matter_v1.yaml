  short_description: A supersymmetric decaying dark matter scenario where an uneaten goldstino from multiple
    sequestered SUSY-breaking sectors is long-lived and decays to a gravitino plus two visible particles.
  historical_origin_or_motivation: The paper proposes goldstini as a way to obtain very long-lived decaying
    dark matter without R-parity violation and with leptophilic three-body decays.
  status: speculative
  model_kind: effective_field_theory
