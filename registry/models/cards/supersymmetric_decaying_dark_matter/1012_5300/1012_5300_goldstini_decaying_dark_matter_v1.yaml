  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper derives low-energy goldstini interactions after integrating out scalar components;
    the decay proceeds through higher-dimensional, dimension-8 effective interactions.
