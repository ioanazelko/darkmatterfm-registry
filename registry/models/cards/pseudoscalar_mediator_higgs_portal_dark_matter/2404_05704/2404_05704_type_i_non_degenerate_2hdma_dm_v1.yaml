identity:
  name: Type-I non-degenerate 2HDM+a dark matter benchmark model
  family: pseudoscalar_mediator_higgs_portal_dark_matter
  aliases:
  - type-I 2HDM+a
  - moderately fermiophobic 2HDM+a
  - non-degenerate 2HDM plus pseudoscalar mediator
  short_description: A gauge-invariant renormalizable 2HDM+a dark matter setup with a Dirac fermion coupled
    to a pseudoscalar mediator, a type-I Yukawa sector, and non-degenerate BSM Higgs masses used to define
    new LHC dark-matter benchmarks.
  historical_origin_or_motivation: The model is motivated as a gauge-invariant extension of simplified
    pseudoscalar dark matter models and as an expansion of LHC 2HDM+a benchmarks beyond type-II, mass-degenerate
    spectra.
  status: benchmark
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - two-Higgs-doublet model
  - pseudoscalar-mediated dark matter
  - LHC Dark Matter Working Group 2HDM+a benchmarks
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives the 2HDM scalar potential, the extra pseudoscalar potential and mixing terms,
    and the renormalizable pseudoscalar coupling of a Dirac DM field.
particle_content:
  dark_matter_candidate:
    name: Dirac fermion chi
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - pseudoscalar mediator P/a
  mediators:
  - pseudoscalar a
  - CP-odd scalar A
  - CP-even scalar H
  - charged Higgs H^+-
  - 125 GeV Higgs h through mixing/loops
  dark_radiation_species: []
  excited_or_degenerate_states:
  - non-degenerate BSM Higgs states A, H, H^+-
  - pseudoscalar mass eigenstates A and a
  long_lived_particles: []
  unstable_parent_particles:
  - A
  - H
  - H^+-
  - a when kinematically able to decay invisibly to chi chi
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The model treats chi as the stable Dirac DM field; the source specifies a Z2
    transformation involving chi and P but does not expand a full stability proof in the extracted text.
  symmetries:
  - name: 2HDM Z2 flavor symmetry
    type: discrete
    exact_or_approximate: broken
    breaking: softly broken by the b_P term in the scalar potential
    breaking_scale: null
  - name: CP conservation in the BSM scalar sector
    type: discrete
    exact_or_approximate: exact
    breaking: parameters are chosen real in the discussed setup
    breaking_scale: null
  - name: dark matter stabilizing assignment
    type: discrete
    exact_or_approximate: unknown
    breaking: not specified in the extracted text beyond the transformation of chi and P
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - two Higgs doublets
  - SM fermions through type-I Yukawa interactions
  - electroweak gauge bosons through the extended Higgs sector
  dark_sector_couplings:
  - -i y_chi P chi_bar gamma5 chi
  mediator_types:
  - pseudoscalar mediator
  - extended Higgs scalars
  interaction_operators:
  - P H1^dagger H2 soft-mixing term
  - P^2 H_i^dagger H_i scalar portal terms
  - pseudoscalar Yukawa coupling between P and Dirac DM
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: strong
    velocity_dependence: unknown
    spin_dependence: spin_dependent
  annihilation_channels:
  - resonant chi chi annihilation through a to SM fermions
  - annihilation into h a
  - annihilation into h A
  - annihilation into t tbar
  - annihilation into Z h
  - annihilation into Z H
  decay_channels:
  - a to chi chi when kinematically open
  - A to h a
  - A to Z H
  - A to W H^+-
  - H to A a or h a depending masses
  self_scattering_channels: []
  cp_structure: CP-conserving scalar potential and pseudoscalar DM coupling in the benchmark setup
  flavor_structure: type-I 2HDM Yukawa sector with moderately fermiophobic choices such as tan beta around
    5 in benchmarks
  tree_or_loop_level: both
parameters:
  core:
  - name: CP-odd heavy scalar mass
    symbol: m_A
    description: Mass scanned in the proposed m_A-m_H benchmark plane.
    range: scanned
    unit: GeV
    role: core
    status: inferred
  - name: CP-even BSM scalar mass
    symbol: m_H
    description: Mass scanned in the proposed m_A-m_H benchmark plane.
    range: scanned
    unit: GeV
    role: core
    status: inferred
  - name: charged Higgs mass
    symbol: m_Hpm
    description: Charged Higgs mass used to define non-degenerate benchmark panels.
    range: benchmark-dependent
    unit: GeV
    role: core
    status: inferred
  - name: light pseudoscalar mass
    symbol: m_a
    description: Benchmark pseudoscalar mass.
    value: 100
    unit: GeV
    role: core
    status: inferred
  - name: Dirac dark matter mass
    symbol: m_chi
    description: Benchmark dark matter mass.
    value: 10
    unit: GeV
    role: core
    status: inferred
  - name: alignment parameter
    symbol: cos(beta-alpha)
    description: Set to the alignment limit in the common benchmarks.
    value: 0
    role: core
    status: inferred
  - name: tan beta
    symbol: tan(beta)
    description: Ratio of the two Higgs vacuum expectation values; common benchmark value is moderately
      fermiophobic.
    value: 5
    role: core
    status: inferred
  - name: pseudoscalar mixing angle
    description: Mixing between the 2HDM CP-odd state and P; smaller-than-maximal values are preferred
      by electroweak precision limits for non-degenerate spectra.
    range: below maximal mixing 1/sqrt(2)
    role: core
    status: inferred
  - name: dark-sector Yukawa coupling
    symbol: y_chi
    description: Pseudoscalar Yukawa coupling between P and chi.
    value: 1
    role: core
    status: inferred
  - name: quartic coupling lambda_3
    symbol: lambda_3
    description: Quartic parameter chosen to help satisfy bounded-from-below conditions in non-degenerate
      spectra.
    value: 6
    role: core
    status: inferred
  - name: portal quartics lambda_P1 and lambda_P2
    symbol: lambda_P1, lambda_P2
    description: Scalar portal quartics in the benchmark setup.
    value: 0
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: invisible mediator branching ratio
    symbol: Br(a -> chi chi)
    description: For the common benchmark choices m_a=100 GeV, m_chi=10 GeV, and y_chi=1, the text states
      Br(a -> chi chi) is about 100 percent.
    value: approximately 100 percent in the common benchmark
    role: derived
    status: inferred
