parameters:
  core:
  - name: dark matter mass
    symbol: m_dm
    description: Mass of the LDM particle; the paper discusses sub-muon masses and g-2 motivated MeV values.
    range: m_dm < m_mu; example values around 21.8 or 43.6 MeV depending on self-conjugacy
    unit: MeV
    role: core
    status: inferred
  - name: primordial annihilation rate
    symbol: (sigma v)_prim
    description: Early-universe annihilation rate needed for the dark matter abundance.
    value: about 1e-26 cm^3 s^-1
    role: core
    status: inferred
  - name: Milky Way annihilation rate
    symbol: (sigma v)_MW
    description: Low-velocity annihilation rate required in the Milky Way to avoid excess low-energy photons
      while allowing positron production.
    value: about 1e-31 (m_dm/MeV)^2 cm^3 s^-1
    role: core
    status: inferred
  - name: s-wave coefficient
    symbol: a
    description: Velocity-independent coefficient in sigma v = a + b v^2.
    range: a less than about 1e-31 (m_dm/MeV)^2 cm^3 s^-1; paper estimates 2.16e-31 (m_dm/MeV)^2 cm^3
      s^-1 for the 511 keV line
    unit: cm^3 s^-1
    role: core
    status: inferred
  - name: p-wave coefficient
    symbol: b
    description: Velocity-suppressed coefficient in sigma v = a + b v^2.
    value: about 1e-25 (m_dm/MeV)^2 cm^3 s^-1
    role: core
    status: inferred
  - name: F particle mass
    symbol: m_F
    description: Mass of heavy F mediator particles coupled to dark matter and charged leptons.
    range: m_F > 100 GeV to satisfy accelerator limits in the paper discussion
    unit: GeV
    role: core
    status: inferred
