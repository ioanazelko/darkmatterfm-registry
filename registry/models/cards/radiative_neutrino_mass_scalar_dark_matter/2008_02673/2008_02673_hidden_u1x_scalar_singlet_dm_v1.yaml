  - two-loop radiative neutrino mass scalar DM
  short_description: A local hidden U(1)_X extension where a scalar singlet dark matter candidate is stabilized
    by a remnant Z2 symmetry and annihilates through interactions with exotic charged leptons and Standard
    Model leptons.
  historical_origin_or_motivation: The model links two-loop radiative neutrino-mass generation, lepton-flavor
    phenomenology, and a scalar singlet dark matter candidate protected by hidden gauge symmetry breaking.
  status: speculative
  model_kind: complete_theory
