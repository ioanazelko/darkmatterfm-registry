identity:
  name: Leptonic axion portal cascade dark matter
  family: cascade_annihilation_dark_matter
  aliases:
  - leptonic axion portal
  - leptonic axion cascade annihilation
  short_description: A cascade-annihilation variant in which vector-like fermion dark matter gets mass
    from a TeV-scale complex scalar, annihilates through a leptonic axion sector, and the light pseudoscalar
    decays preferentially to leptons rather than hadrons.
  historical_origin_or_motivation: Constructed as a less constrained variant of the axion portal for PAMELA/ATIC-motivated
    cascade annihilation, avoiding the hadronic axion couplings of the minimal axion portal.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - cascade annihilation dark matter
  - axion portal
  - spontaneously broken leptonic symmetry
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper gives example Yukawa interactions for vector-like fermion dark matter, a complex scalar
    S_l, leptonic Higgs fields, and a softly broken leptonic symmetry; it does not provide a full ultraviolet
    completion.
particle_content:
  dark_matter_candidate:
    name: vector-like fermion dark matter psi/psi^c
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - complex scalar S_l
  - pseudoscalar leptonic axion a_l
  - light scalar s_l
  - electron-type and neutrino-type Higgs fields charged under the leptonic symmetry
  mediators:
  - leptonic axion a_l
  - light scalar s_l
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles: []
  unstable_parent_particles:
  - s_l scalar that decays to two a_l pseudoscalars
  - a_l pseudoscalar that decays to charged leptons
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The assigned text treats the vector-like fermion as dark matter but does not
    spell out an independent stabilizing symmetry; the leptonic U(1) structure controls the light mediator
    decays.
  symmetries:
  - name: U(1)_X leptonic symmetry
    type: global
    exact_or_approximate: broken
    breaking: spontaneously broken by the TeV-scale vacuum expectation value of S_l and softly broken
      to give a_l a mass
  - name: hadron-blind leptonic charge assignment
    type: global
    exact_or_approximate: approximate
    breaking: quarks are assumed uncharged under the leptonic symmetry so the axion has no hadronic couplings
  topological_defects_possible: unknown
interactions:
  portals:
  - axion
  - other
  standard_model_targets:
  - electrons
  - muons
  - charged leptons
  - neutrinos through leptonic Higgs sector
  dark_sector_couplings:
  - Yukawa coupling S_l psi psi^c giving the vector-like dark matter mass
  - dark matter annihilation through s_l and a_l
  - leptonic Higgs interactions coupling a_l to leptons
  mediator_types:
  - pseudoscalar axion-like mediator
  - light scalar mediator
  interaction_operators:
  - S_l psi psi^c
  - S_l h_e h_nu
  - leptonic Higgs Yukawa couplings to charged leptons
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - psi psi^c annihilation to s_l a_l
  - cascade decays ending in e+e- or mu+mu- depending on a_l mass
  decay_channels:
  - s_l to a_l a_l
  - a_l to e+ e- for 2 m_e < m_a_l < 2 m_mu
  - a_l to mu+ mu- if kinematically open
  self_scattering_channels:
  - Sommerfeld or bound-state enhancement from exchange of the light scalar s_l
  cp_structure: a_l is a pseudoscalar axion-like state
  flavor_structure: leptophilic; standard model quarks are assumed not to carry the leptonic charge
  tree_or_loop_level: tree
parameters:
  core:
  - name: dark matter mass
    symbol: m_DM
    range: TeV scale; best-fit values are fit in the paper for PAMELA/ATIC cascade scenarios
    unit: GeV
    role: core
    status: inferred
    notes: The text describes TeV-scale dark matter and fits m_DM in cascade scenarios.
  - name: leptonic axion decay constant
    symbol: f_a
    value: order TeV
    unit: TeV
    role: core
    status: inferred
    notes: Vacuum expectation value of S_l is assumed to be order TeV.
  - name: leptonic axion mass
    symbol: m_a_l
    range: 2 m_e < m_a_l < 2 m_mu for the electron-dominant case; could be above 2 m_mu for muon decays
    role: core
    status: inferred
    notes: Absence of hadronic couplings allows masses below the muon threshold.
  - name: light scalar mass
    symbol: m_s_l
    range: free parameter
    role: core
    status: inferred
    notes: The masses of s_l and a_l are treated as free parameters.
  - name: annihilation boost factor
    symbol: B
    range: fit-dependent, order 1000 for PAMELA/ATIC-motivated halo annihilation
    role: derived
    status: inferred
