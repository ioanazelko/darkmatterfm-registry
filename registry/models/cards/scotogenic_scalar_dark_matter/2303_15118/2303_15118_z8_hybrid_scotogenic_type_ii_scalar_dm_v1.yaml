identity:
  name: Z8 hybrid scotogenic/type-II seesaw scalar dark matter model
  family: scotogenic_scalar_dark_matter
  aliases:
  - hybrid scoto/type-II seesaw model
  - Z8^e-mu scalar DM option
  short_description: A hybrid scotogenic and type-II seesaw model in which a spontaneously broken Z8 flavour
    symmetry leaves an exact dark Z2 that stabilizes the lightest neutral scalar S_1 as a WIMP dark matter
    candidate.
  historical_origin_or_motivation: Connects neutrino-mass generation, spontaneous CP violation, charged-lepton-flavour
    phenomenology, and scalar dark matter in a restrictive Z8 flavour setup.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Standard Model extension
  - scotogenic model
  - type-II seesaw
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The assigned text gives the Yukawa Lagrangian and field content for the Z8^e-mu case and analyzes
    its scalar-DM phenomenology.
particle_content:
  dark_matter_candidate:
    name: lightest neutral scalar S_1
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - singlet fermion f
  - two inert scalar doublets eta_1 and eta_2
  - dark neutral scalars S_k
  - dark charged scalars S_i^+
  mediators:
  - SM-like Higgs h_1
  - dark charged scalars S_i^+
  - singlet fermion f
  dark_radiation_species: []
  excited_or_degenerate_states:
