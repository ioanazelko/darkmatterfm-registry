  - coannihilations involving S_i and S_j^+
  decay_channels: []
  self_scattering_channels: []
  cp_structure: CP is imposed in the Lagrangian and broken spontaneously by the singlet VEV phase.
  flavor_structure: Z8^e-mu flavour charge assignment leaves a restricted set of Yukawa couplings and
    two texture-zero conditions in the neutrino mass matrix.
  tree_or_loop_level: both
