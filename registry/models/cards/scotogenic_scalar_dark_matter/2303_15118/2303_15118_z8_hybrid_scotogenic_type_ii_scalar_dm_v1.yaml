  - dark charged scalars S_i^+
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact dark Z2 remains after spontaneous breaking of the imposed Z8 flavour
    symmetry, making the lightest odd particle stable.
  symmetries:
  - name: Z8 flavour symmetry
    type: discrete
    exact_or_approximate: broken
    breaking: spontaneously broken by the complex singlet vacuum expectation value, with a soft-breaking
      term used to avoid domain walls and allow an arbitrary CP phase
    breaking_scale:
      name: singlet vacuum expectation value
      symbol: u
      description: VEV of the complex singlet that breaks Z8 and sets M_f through u y_f/sqrt(2).
      value: null
      range: null
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - arxiv:2303.15118
      notes: The text states a hierarchy w << v << u but does not give a fixed value.
  - name: dark Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken remnant under which f and eta_1,2 are odd
    breaking_scale: null
  - name: CP symmetry
    type: discrete
    exact_or_approximate: broken
    breaking: imposed at the Lagrangian level and broken spontaneously by the complex singlet VEV
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - lepton doublets
  - charged leptons
  - Higgs sector
  dark_sector_couplings:
  - Yukawa couplings between lepton doublets, inert doublets, and f
  - triplet Yukawa coupling to lepton doublets
  - singlet coupling y_f f f
  mediator_types:
  - scalar
  - fermion
  interaction_operators:
  - L_Yuk includes lepton-doublet couplings to eta_i and f, triplet couplings to lepton doublets, and
    y_f f f
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
