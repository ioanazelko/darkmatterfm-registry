  short_description: A rank-6 E6-inspired supersymmetric construction with exact custodial Z_H2 symmetry,
    matter parity, and an induced Z_E symmetry, yielding at least two stable weakly interacting states
    that can contribute to dark matter.
  historical_origin_or_motivation: Developed to control flavor, baryon-number, and lepton-number problems
    in E6-inspired SUSY models while retaining exotic low-energy states and dark-matter candidates.
  status: speculative
  model_kind: complete_theory
