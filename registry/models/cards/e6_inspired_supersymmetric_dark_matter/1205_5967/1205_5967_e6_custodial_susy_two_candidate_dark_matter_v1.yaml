  - rank-6 gauge symmetry with two extra U(1) factors
  - 5D and 6D orbifold GUT constructions
  - Exceptional Supersymmetric Standard Model
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies E6-derived matter content, renormalizable superpotential terms, discrete
    symmetries, and orbifold GUT embeddings, but the extraction keeps only the dark-matter-relevant model
    card.
