constraints:
- id: gw190425_chandrasekhar_limit
  name: GW190425 interpretation bounds the dark Chandrasekhar mass
  constraint_type: astrophysical
  observable_channel: gravitational_waves
  applies: parameter_dependent
  constrained_parameters:
  - M_DC
  - M_min
  - m_x
  excluded_regions:
  - Dark Chandrasekhar masses above the inferred low-mass cutoff if GW190425 is a dark black-hole binary
  allowed_regions:
  - M_DC below about 1.4 solar masses and m_x greater than about 0.95 GeV under the GW190425-as-DBH hypothesis
  benchmark_implications:
  - Provides a direct particle-mass lower bound only for the DBH interpretation of GW190425.
  likelihood_available: partial
  likelihood_reference: null
  data_release: LIGO/Virgo O1-O3 compact-binary catalog through 2019 in the primary paper
  recasting_needed: partial
  robustness: medium
  assumptions:
  - id: gw190425_is_dbh
    description: The low-mass event GW190425 is produced by a dark black-hole binary.
    scope: event interpretation
    status: assumed
    impact_if_violated: If false, the particle-mass bound becomes a forecast/illustration rather than
      a measurement.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2009_05209'
    notes: null
  caveats:
  - Astrophysical classification of GW190425 dominates this constraint.
  source_reference_ids:
  - '2009_05209'
  notes: Primary text quotes greater than 99.9 percent confidence for the illustrative mass-limit statement.
- id: ligo_null_dbh_fraction_bound
  name: LIGO/Virgo null or sparse DBH counts constrain the compact-object fraction
  constraint_type: astrophysical
  observable_channel: gravitational_waves
  applies: 'yes'
  constrained_parameters:
  - f
  - M_min
  - population slope
  excluded_regions:
  - Large compact-object fractions producing too many detectable dark black-hole mergers
  allowed_regions:
  - Small f values or mass functions with rates below current LIGO/Virgo sensitivity
  benchmark_implications:
  - Even nondetections in sub-solar and low-mass compact binaries can carve out dissipative-DM cooling
    models.
  likelihood_available: partial
  likelihood_reference: null
  data_release: LIGO/Virgo O1-O3 compact-binary catalog through 2019 in the primary paper
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
  - id: popiii_like_binary_scaling
    description: Dark black-hole binary formation is modeled with Population-III-like rate scalings.
    scope: population model
    status: approximate
    impact_if_violated: Different binary formation channels would change the inferred f limit.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2009_05209'
    notes: null
  caveats:
