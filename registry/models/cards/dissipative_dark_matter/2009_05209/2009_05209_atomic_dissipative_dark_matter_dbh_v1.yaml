theory_to_observable_routing:
  routes:
  - id: atomic_dbh_gw_population_route
    description: Map atomic dark matter microphysics to dark-star collapse, DBH masses, merger rates,
      and compact-binary likelihoods.
    source_model_features:
    - dark U(1) atomic sector
    - radiative and molecular dark cooling
    - dark Chandrasekhar and Jeans mass scales
    - subcomponent compact-object formation
    input_parameters:
    - m_x
    - m_c
    - alpha_D
    - f
    - M_min
    - population slope
    derived_quantities:
    - M_DC
    - M_DJ
    - DBH mass function
    - expected LIGO/Virgo event counts
    forward_model_chain:
    - step_id: cooling
      step_type: semi_analytic_model
      tool_or_code: null
      inputs:
      - m_x
      - m_c
      - alpha_D
      outputs:
      - cooling curve
      - minimum Jeans mass
      validity: Order-of-magnitude because simulations set the numerical coefficient.
      notes: Primary paper gives the analytic scaling and stresses simulation dependence.
    - step_id: mass_function
      step_type: data_transform
      tool_or_code: null
      inputs:
      - M_DC
      - M_DJ
      - f
      outputs:
      - DBH mass spectrum
      validity: Valid for the assumed population model.
      notes: GW190425 enters as a possible low-mass event.
    - step_id: gw_likelihood
      step_type: likelihood
      tool_or_code: null
      inputs:
      - DBH mass spectrum
      - detector selection
      outputs:
      - posterior on f and M_min
      validity: Primary analysis uses LIGO/Virgo data through 2019.
      notes: Rebuilding this requires the GW catalog and selection model.
    observable_ids:
    - gw_dark_black_hole_mass_spectrum
    - dark_atomic_cooling_small_scale_effects
    - compact_object_multimessenger_nulls
    constraint_ids:
    - gw190425_chandrasekhar_limit
    - ligo_null_dbh_fraction_bound
    - atomic_dm_large_scale_viability
    - compact_object_fraction_bounds
