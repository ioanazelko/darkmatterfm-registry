  source_reference_ids:
  - '2009_05209'
  - '2209_00064'
  notes: null
- id: atomic_dm_large_scale_viability
  name: Atomic dissipative dark matter must remain compatible with large-scale structure
  constraint_type: cosmological
  observable_channel: large_scale_structure
  applies: parameter_dependent
  constrained_parameters:
  - alpha_D
  - m_c
  - m_x
  - dark ionization history
  excluded_regions:
  - Too-efficient dark acoustic/cooling behavior that spoils large-scale structure or halo observations
  allowed_regions:
  - Benchmarks where most dark matter remains effectively CDM-like and only a small fraction cools into
    compact objects
  benchmark_implications:
  - Allows DBH searches to probe a small collapsed subcomponent without requiring all dark matter to be
    compact.
  likelihood_available: unknown
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: medium
  assumptions:
