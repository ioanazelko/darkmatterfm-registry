identity:
  name: Abelian excited dark matter with metastable Majorana states
  family: excited_dark_matter
  aliases:
  - XDM with kinetically mixed U(1) gauge boson
  - metastable Abelian dark matter
  short_description: A hidden U(1) excited-dark-matter model with three Majorana dark fermion states,
    a kinetically mixed dark gauge boson, and dark scalars arranged so metastable down-scattering can
    source 511 keV positrons while thermal freeze-out sets the relic abundance.
  historical_origin_or_motivation: Built to provide a simpler Abelian alternative to nonabelian excited-dark-matter
    models for the INTEGRAL 511 keV signal, with possible direct-detection and hidden-photon tests.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
