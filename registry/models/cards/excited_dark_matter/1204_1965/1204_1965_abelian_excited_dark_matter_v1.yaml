  - kinetically_mixed_dark_photon
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes a hidden-sector Lagrangian with three Weyl fermions, a dark U(1) gauge boson,
    dark scalars, Yukawa terms, gauge kinetic mixing, and Higgs-portal terms.
particle_content:
  dark_matter_candidate:
    name: three nearly degenerate Majorana dark fermions chi_1, chi_2, chi_3
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - two charged Weyl fermions before symmetry breaking
  - real singlet Weyl fermion
  - complex dark scalar
  - real singlet dark scalar
  mediators:
  - kinetically mixed dark gauge boson Z'
  - dark scalar mixed with the Standard Model Higgs
  dark_radiation_species: []
  excited_or_degenerate_states:
  - chi_2
  - metastable chi_3
  long_lived_particles:
  - chi_3
  unstable_parent_particles:
  - chi_2
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Hidden U(1) charge assignments and a discrete interchange symmetry structure
    the mass eigenstates; the heaviest state chi_3 is cosmologically metastable while chi_2 decays promptly.
  symmetries:
  - name: U(1)_d
    type: gauge
    exact_or_approximate: broken
    breaking: Broken by a complex dark-scalar vev that gives mass to Z prime.
    breaking_scale:
      name: dark scalar vev
      symbol: phi vev
      value: about 4.6 GeV for fiducial parameters
      unit: GeV
      role: core
      status: inferred
      source_reference_ids: []
  - name: fermion interchange symmetry
    type: discrete
    exact_or_approximate: approximate
    breaking: Used to impose y1 = -y2 and split chi_2 and chi_3 lifetimes.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  standard_model_targets:
  - electromagnetic current
  - electrons and positrons
  - protons in direct detection
  - Standard Model Higgs sector
  dark_sector_couplings:
  - dark U(1) gauge coupling g
  - Yukawa couplings between Weyl fermions and dark scalars
  - scalar cubic coupling used in relic-density discussion
  mediator_types:
  - dark gauge boson Z'
  - dark Higgs/scalar mediator
  interaction_operators:
  - gauge kinetic mixing with electromagnetic/hypercharge field strength
  - Higgs-portal scalar mixing terms
  - Yukawa mass-mixing terms
  scattering:
    elastic: unknown
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: strong
    spin_dependence: unknown
  annihilation_channels:
  - chi_2 chi_2 -> Z' Z'
  - chi_3 chi_3 -> Z' Z'
  - chi_2 chi_3 -> Standard Model fermion pairs
  - chi_1 chi_1 annihilation through singlet scalar channels
  decay_channels:
  - chi_2 -> chi_1 e+ e- through Z prime
  - chi_3 -> chi_1 e+ e- through scalar mixing, highly suppressed
  self_scattering_channels:
  - chi_3 chi_3 -> chi_2 chi_2 down-scattering
  cp_structure: unknown
  flavor_structure: unknown
  tree_or_loop_level: tree
