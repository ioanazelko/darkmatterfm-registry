identity:
  name: Down-scattering excited Dark Matter
  family: excited_dark_matter
  aliases:
  - DeDM
  short_description: A dark matter model in which a dominant Dirac fermion annihilates through an s-channel
    scalar into a complex scalar dark-sector state with a MeV-scale excitation whose decay yields low-energy
    e+e-, while loop-induced photon operators accommodate a high-energy gamma-ray line.
  historical_origin_or_motivation: The paper proposes DeDM to avoid the Boltzmann-tail problem of vanilla
    excited dark matter for the INTEGRAL 511 keV line and to connect it to the Fermi-LAT 130/135 GeV line.
  status: speculative
  model_kind: simplified_model
