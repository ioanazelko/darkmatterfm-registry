identity:
  name: Not-so-inelastic dark matter (niDM)
  family: inelastic_dark_matter
  aliases:
  - niDM
  - not-so-inelastic DM
  short_description: A U(1) prime dark-photon model with two Majorana dark fermions whose elastic coupling
    is controlled by a left-right Yukawa/Majorana asymmetry parameter, interpolating between inelastic
    DM and Majorana DM.
  historical_origin_or_motivation: Motivated by relaxing the usual m_L = m_R assumption in inelastic dark
    matter while preserving attractive relic-density and experimental features.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - inelastic_dark_matter
  - majorana_dark_matter
  - dark_photon_model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper presents a gauge-invariant anomaly-free U(1) prime extension with fermions, a singlet
    scalar, a dark photon, kinetic mixing, and a Higgs portal term.
particle_content:
  dark_matter_candidate:
    name: lighter Majorana state chi
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - excited Majorana state chi_star
  - dark photon A_prime
  - SM-singlet scalar S
  mediators:
  - dark photon A_prime
  - SM-singlet scalar S
  dark_radiation_species: []
  excited_or_degenerate_states:
  - chi_star
  long_lived_particles:
  - chi_star may be long-lived on detector scales depending on parameters
  unstable_parent_particles:
  - dark photon A_prime
  - excited state chi_star
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The lighter Majorana state is treated as the stable DM particle; the exact low-energy
    stabilizing remnant is not explicitly named in the local text.
  symmetries:
  - name: U(1)'
    type: gauge
    exact_or_approximate: broken
    breaking: spontaneously broken by the singlet scalar S acquiring a vev
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  standard_model_targets:
  - electrically charged SM fermions through dark-photon kinetic mixing
  - SM Higgs through the scalar portal term (assumed decoupled for phenomenology)
  dark_sector_couplings:
  - diagonal elastic A_prime couplings
  - off-diagonal inelastic A_prime coupling between chi and chi_star
  - Yukawa couplings y_L and y_R to S
  mediator_types:
  - dark photon A_prime
  - SM-singlet scalar S
  interaction_operators:
  - kinetic mixing between U(1) prime and hypercharge
  - Yukawa Majorana mass terms from S
  - Dirac mass term between chiral dark fermions
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: strong
    spin_dependence: unknown
  annihilation_channels:
  - chi chi and chi chi_star annihilation through A_prime to SM fermions
  - elastic and inelastic annihilation contributions in freeze-out
  decay_channels:
  - chi_star decays to chi plus SM fermions through off-shell A_prime
  - A_prime decays to dark fermion pairs when kinematically allowed
  self_scattering_channels: []
  cp_structure: CP-conserving benchmark; complex phase would change the inelastic channel to p-wave
  flavor_structure: two chiral dark fermions with equal U(1) prime charge
  tree_or_loop_level: tree
parameters:
  core:
  - name: DM mass
    symbol: m_chi
    description: Mass of the lighter Majorana DM state.
    range: benchmark windows around 200-500 MeV and 3-8 GeV
    unit: GeV
    role: core
    status: inferred
  - name: excited-state mass splitting
    symbol: Delta_m
    description: Relative mass splitting (m_chi_star - m_chi)/m_chi.
    role: core
    status: inferred
  - name: left-right asymmetry
    symbol: Delta_y
    description: Parameter characterising the difference between m_L and m_R or y_R and y_L; Delta_y ->
      0 recovers iDM.
    role: core
    status: inferred
  - name: dark photon mass
    symbol: m_A_prime
    description: Dark photon mass; benchmark m_A_prime = 3 m_chi.
    value: 3 m_chi benchmark
    role: core
    status: assumed
  - name: dark fine structure constant
    symbol: alpha_prime
    description: Dark U(1) prime coupling alpha_prime = g_prime^2/(4 pi); benchmark alpha_prime=0.5.
    value: 0.5
    role: core
    status: assumed
  - name: kinetic mixing
    symbol: epsilon
    description: Kinetic mixing controlling coupling of A_prime to SM fermions and fixed by relic-density
      requirement along benchmark curves.
    role: core
    status: inferred
  nuisance: []
  derived:
  - name: elastic fine-structure constant
    symbol: alpha_el_prime
    description: Diagonal elastic coupling strength after rotating to the mass basis.
    role: derived
    status: inferred
  - name: inelastic fine-structure constant
    symbol: alpha_inel_prime
    description: Off-diagonal inelastic coupling strength after rotating to the mass basis.
    role: derived
    status: inferred
  - name: inelastic relic fraction
    symbol: f_iDM
    description: Relative contribution of inelastic interactions to the relic abundance integral.
    role: derived
    status: inferred
