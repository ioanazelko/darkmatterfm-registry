identity:
  name: Vector-contact inelastic scalar dark matter EFT
  family: inelastic_dark_matter
  aliases:
  - minimal inelastic scalar DM with vector DM-lepton contact operators
  - dark U(1)_X vector completion
  short_description: A two-real-scalar inelastic dark matter EFT with vector-type dimension-6 lepton contact
    operators, illustrated by a dark U(1)_X gauge-boson completion.
  historical_origin_or_motivation: Constructed as the vector-interaction branch of the paper's EFT explanation
    of the XENON1T electron-recoil excess.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - minimal inelastic scalar dark matter
  - dimension-6 DM-lepton EFT
  - dark U(1)_X gauge completion
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff:
    name: vector cutoff
    symbol: Lambda_V
    description: Effective cutoff for vector-type DM-lepton operators.
    value: '74.8'
    range: 68.2-92.9
    unit: GeV
    role: core
    status: inferred
  embedded_in_larger_framework: 'yes'
  notes: The EFT vector operators can be generated by integrating out a dark U(1)_X gauge boson in the
    paper's illustrative UV completion.
particle_content:
  dark_matter_candidate:
    name: real scalar pair X and X'
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - dark U(1)_X gauge boson A'
  - complex scalar singlets S and S' in the UV completion
  - right-handed neutrinos in the UV completion
  mediators:
  - integrated-out vector mediator
  - dark U(1)_X gauge boson A'
  dark_radiation_species: []
  excited_or_degenerate_states:
  - heavier component X'
  - lighter component X
  long_lived_particles:
  - X' with lifetime much longer than the age of the Universe in the EFT estimate
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A Z2 parity stabilizes the scalar DM components; the illustrative UV completion
    also has a spontaneously broken dark U(1)_X.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not specified
    breaking_scale: null
  - name: U(1)_X
    type: gauge
    exact_or_approximate: broken
    breaking: broken at the weak scale by a singlet scalar
    breaking_scale:
      name: U(1)_X breaking scale
      symbol: v_S
      description: Sample weak-scale singlet VEV in the UV completion.
      value: O(100)
      unit: GeV
      role: core
      status: inferred
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - electrons
  - leptons
  - right-handed leptons
  - right-handed quarks in the UV completion
  dark_sector_couplings:
  - vector DM-lepton current operator
  - X' e -> X e exothermic scattering
  - XX' annihilation to lepton pairs
  - dark U(1)_X gauge interaction
  mediator_types:
  - heavy vector mediator
  - dark U(1)_X gauge boson
  interaction_operators:
  - O_VL=(L gamma_mu L)(X' d^mu X - X d^mu X')
  - O_VR=(l_R gamma_mu l_R)(X' d^mu X - X d^mu X')
