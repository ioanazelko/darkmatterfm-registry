  self_scattering_channels:
  - X'X' -> XX, constrained to freeze out before electron conversion decoupling
  cp_structure: CP-conserving vector operators in the EFT basis
  flavor_structure: left- or right-handed lepton currents; U(1)_X completion includes specified right-handed
