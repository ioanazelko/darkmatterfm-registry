  - XX' -> lepton pairs
  - XX -> lepton pairs
  - X'X' -> lepton pairs
  decay_channels:
  - X' -> X plus photons through loops, highly suppressed
  self_scattering_channels:
  - X'X' -> XX
  cp_structure: CP-conserving scalar operators in the EFT basis
  flavor_structure: lepton-flavor operators for e, mu, tau; electron channel drives the recoil fit
  tree_or_loop_level: both
parameters:
