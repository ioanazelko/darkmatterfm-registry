identity:
  name: Scalar-contact inelastic scalar dark matter EFT
  family: inelastic_dark_matter
  aliases:
  - minimal inelastic scalar DM with scalar DM-lepton contact operators
  short_description: A two-real-scalar inelastic dark matter EFT with heavy scalar-type mediators generating
    dimension-6 DM-lepton contact interactions.
  historical_origin_or_motivation: Constructed as an EFT explanation of the XENON1T electron-recoil excess
    with a heavy mediator integrated out.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - minimal inelastic scalar dark matter
  - dimension-6 DM-lepton EFT
  - second-Higgs-doublet or vector-like-lepton UV completion
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff:
    name: scalar cutoff
    symbol: Lambda_S
    description: Effective cutoff for scalar-type DM-lepton operators.
    value: '1.11'
    range: 1.110-1.113
    unit: TeV
    role: core
    status: inferred
  embedded_in_larger_framework: 'yes'
  notes: The scalar operator is written before electroweak symmetry breaking and can be UV-completed by
    an extra heavy Higgs doublet or vector-like leptons.
particle_content:
  dark_matter_candidate:
    name: real scalar pair X and X'
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles: []
  mediators:
  - integrated-out heavy scalar mediator
  - extra heavy Higgs doublet H2
  - vector-like heavy leptons
  dark_radiation_species: []
  excited_or_degenerate_states:
  - heavier component X'
  - lighter component X
  long_lived_particles:
  - X' with lifetime much longer than the age of the Universe in the model estimate
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 parity makes X and X' odd and stabilizes the dark matter components.
  symmetries:
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: not specified
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - electrons
  - leptons
  dark_sector_couplings:
  - scalar DM-lepton contact operators
  - X' e -> X e exothermic scattering
  - XX', XX, and X'X' annihilation to lepton pairs
  mediator_types:
  - heavy scalar mediator
  - second Higgs doublet
  - vector-like heavy leptons
  interaction_operators:
  - O_S=(L H l_R)[X'X, X^2, X'^2]+h.c.
  - broken-phase dimension-5 scalar DM-lepton contact terms
  scattering:
    elastic: unknown
    inelastic: 'yes'
    momentum_dependence: mild
    velocity_dependence: mild
    spin_dependence: spin_independent
