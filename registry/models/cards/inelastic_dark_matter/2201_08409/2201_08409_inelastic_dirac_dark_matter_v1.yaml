model_id: 2201_08409_inelastic_dirac_dark_matter_v1
identity:
  name: Inelastic Dirac Dark Matter
  family: inelastic_dark_matter
  aliases:
  - i2DM
  short_description: A feebly coupled inelastic dark matter model with two Dirac dark fermions, a broken
    dark U(1)_D force, and a kinetically mixed dark photon mediator.
  historical_origin_or_motivation: Introduced as a Dirac-fermion alternative to strongly constrained pseudo-Dirac
    inelastic dark matter, with relic abundance set by partner annihilation or coscattering at small mixing.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - inelastic dark matter
  - kinetically mixed dark photon
  - dark U(1)_D gauge theory
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper gives gauge-invariant dark-sector interactions in the unbroken phase and a mass-eigenstate
    Lagrangian after U(1)_D breaking; the analysis assumes the dark scalar is heavy.
particle_content:
  dark_matter_candidate:
    name: chi_1, the lighter Dirac dark fermion
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - chi_2, a heavier Dirac dark partner
  - dark scalar phi_D responsible for U(1)_D breaking
  mediators:
  - dark photon A_prime
  dark_radiation_species: []
  excited_or_degenerate_states:
  - chi_2 with mass m_2 = m_1(1 + Delta)
  long_lived_particles:
  - chi_2 can be long-lived at small mixing and feeble couplings
  unstable_parent_particles:
  - dark photon A_prime can decay to pairs of dark fermions in the paper's benchmark hierarchy
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The paper treats chi_1 as the stable lighter dark fermion dark matter candidate;
    an explicit stabilizing symmetry beyond the broken dark U(1)_D structure is not identified in the
    extracted text.
  symmetries:
  - name: U(1)_D
    type: gauge
    exact_or_approximate: broken
    breaking: Spontaneously broken by the vacuum expectation value of the dark scalar phi_D, which gives
      the dark photon a mass and induces dark-fermion mixing.
    breaking_scale:
      name: dark scalar vacuum expectation value
      symbol: v_D
      description: Scale of spontaneous U(1)_D breaking with m_A_D = g_D v_D.
      range: null
      unit: null
      role: core
      status: inferred
      notes: null
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - electromagnetic current of charged Standard Model fermions
  - quarks and leptons through dark-photon mixing
  dark_sector_couplings:
  - U(1)_D gauge coupling g_D
  - dark-fermion mixing angle theta
  - dark Yukawa coupling between phi_D, psi_D, and psi_0
  mediator_types:
  - massive dark photon A_prime
  - small Z-boson admixture from kinetic mixing
  interaction_operators:
  - kinetic mixing between hypercharge and dark U(1)_D field strengths
  - A_prime coupling to SM electromagnetic current
  - A_prime coupling to chi_1, chi_2, and off-diagonal chi_1-chi_2 currents
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - chi_1 chi_2 -> f f through a virtual dark photon
  - chi_2 chi_2 -> f f partner annihilation
  - chi_i chi_j -> Standard Model leptons or hadrons
  decay_channels:
  - A_prime -> chi_i chi_j
  - chi_2 -> chi_1 f f through a virtual dark photon
  self_scattering_channels: []
  cp_structure: unknown
  flavor_structure: lepton-flavor-universal SM couplings are used in the effective interaction discussion
  tree_or_loop_level: tree
operators:
  renormalizable_terms:
  - Dirac masses for psi_D and psi_0
  - dark Yukawa interaction phi_D psi_D psi_0
  - dark U(1)_D gauge interaction
  - hypercharge-dark gauge kinetic mixing
  eft_operators: []
  contact_or_light_mediator: light_mediator
  coupling_types:
  - vector
  - kinetic_mixing
  - dark_yukawa
  - mass_mixing
parameters:
  core:
  - name: lighter dark fermion mass
    symbol: m_1
    description: Mass of chi_1, the dark matter candidate.
    range: MeV-GeV focus in the paper
    unit: GeV
    role: core
    status: inferred
    notes: null
  - name: relative mass splitting
    symbol: Delta
    description: Defined as (m_2 - m_1) / m_1 for the heavier dark partner chi_2.
    range: compressed spectra emphasized; examples include Delta = 0.01, 0.05, and 0.1
    unit: null
    role: core
    status: inferred
    notes: null
  - name: dark photon mass
    symbol: m_A_prime
    description: Mass of the kinetically mixed dark photon mediator.
    range: analysis focuses on m_A_prime > 2 m_2
    unit: GeV
    role: core
    status: inferred
    notes: null
  - name: dark fine-structure coupling
    symbol: alpha_D
    description: Dark gauge coupling combination alpha_D = g_D^2/(4 pi).
    range: null
    unit: null
    role: core
    status: inferred
    notes: null
  - name: kinetic mixing
    symbol: epsilon
    description: Kinetic mixing between the dark photon and hypercharge/SM electromagnetic current.
    range: feeble; examples and viable regions use small epsilon
    unit: null
    role: core
    status: inferred
    notes: null
  - name: dark fermion mixing
    symbol: theta
    description: Mixing angle controlling the relative coupling strength of chi_1 and chi_2 to the dark
      photon.
    range: small mixing is central to the coscattering regime
    unit: null
    role: core
    status: inferred
    notes: null
  derived:
  - name: effective interaction strength
    symbol: y
    description: Combination controlling scattering rates and decays for a heavy virtual dark photon,
      scaling as epsilon^2 alpha_D (m_1/m_A_prime)^4.
    range: null
    unit: null
    role: derived
    status: inferred
    notes: null
  - name: heavier dark partner mass
    symbol: m_2
    description: Mass of chi_2 related to m_1 by the relative splitting Delta.
    range: m_2 = m_1(1 + Delta)
    unit: GeV
    role: derived
    status: inferred
    notes: null
