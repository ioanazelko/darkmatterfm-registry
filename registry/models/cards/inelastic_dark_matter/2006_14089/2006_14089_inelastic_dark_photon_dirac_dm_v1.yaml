identity:
  name: Inelastic dark-photon Dirac fermion thermal relic for the XENON1T excess
  family: inelastic_dark_matter
  aliases:
  - exothermic dark photon dark matter
  - sub-GeV inelastic Dirac fermion dark matter
  short_description: A sub-GeV Dirac fermion dark matter model split into two keV-separated states by
    a dark U(1) scalar, coupled to the Standard Model through a lighter kinetically mixed dark photon
    and thermally produced by secluded freeze-out.
  historical_origin_or_motivation: Constructed to explain the XENON1T low-energy electron recoil excess
    while retaining a thermal relic abundance.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - dark photon
  - inelastic dark matter
  - secluded thermal relic
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The assigned text writes a dark U(1)_D Lagrangian with kinetic mixing, a Dirac fermion, and a
    scalar responsible for the mass splitting.
particle_content:
  dark_matter_candidate:
    name: Dirac fermion chi split into chi_1 and chi_2
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - complex scalar charged under U(1)_D
  - optional auxiliary fermion chi_E
  mediators:
  - dark photon V
  - optional lighter dark photon V_E
  excited_or_degenerate_states:
  - chi_2 excited state
  - chi_1 ground state
  long_lived_particles:
  - chi_2 is required to live longer than the age of the universe in the target parameter space
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: Dark U(1)_D charge structure and the small splitting leave chi_1 stable and require
    chi_2 to be cosmologically long-lived in the viable region.
  symmetries:
  - name: U(1)_D
    type: gauge
    exact_or_approximate: unknown
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - electrons
  - nuclei
  - SM photon through kinetic mixing
  dark_sector_couplings:
  - dark gauge coupling alpha_D
  - Yukawa coupling y_D between chi and the scalar
  mediator_types:
  - dark photon
  interaction_operators:
  - kinetic mixing V_{mu nu} F^{mu nu}
  - Yukawa splitting term y_D phi chi^T C^{-1} chi
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels:
  - chi_1 chi_1 and chi_2 chi_2 annihilation to V V in the secluded regime
  decay_channels:
  - chi_2 to chi_1 plus neutrinos or photons is highly suppressed for few-keV splitting
  - V can decay invisibly to auxiliary dark-sector states in the example completion
  self_scattering_channels:
  - chi_2 chi_2 to chi_1 chi_1 inter-conversion
  cp_structure: unknown
  flavor_structure: electron and photon portal interactions are emphasized
  tree_or_loop_level: tree
parameters:
  core:
  - name: Dirac dark matter mass
    symbol: M_chi
    description: Mass of the inelastic Dirac fermion dark matter candidate.
    range: Sub-GeV; fit discussion spans about 10 MeV to 1 GeV.
    unit: GeV
    role: core
    status: inferred
    notes: The paper also highlights sensitivity down to about 0.3 GeV in future nuclear recoil searches.
  - name: Dark photon mass
    symbol: M_V
    description: Mass of the kinetically mixed dark photon mediator.
    range: M_V < M_chi in the secluded freeze-out regime; benchmark M_V = 0.1 GeV is discussed.
    unit: GeV
    role: core
    status: inferred
  - name: Inelastic mass splitting
    symbol: delta
    description: Mass difference M_chi2 - M_chi1.
    value: 2.8 keV best-fit example; generally a few keV.
    unit: keV
    role: core
    status: inferred
  - name: Dark gauge coupling
    symbol: alpha_D
    description: Gauge coupling controlling annihilation to dark photons and inter-conversion.
    value: approximately 4e-5 * (M_chi/GeV) * (1 - M_V^2/M_chi^2)^(-1/4) for the relic abundance relation
      in the text.
    role: core
    status: inferred
  - name: Scalar Yukawa coupling
    symbol: y_D
    description: Yukawa coupling that generates the chi_1/chi_2 mass splitting when the scalar gets a
      vev.
    value: delta / v_phi; normalized example delta ~ keV for y_D ~ 1e-7 and v_phi ~ 10 GeV.
    role: core
    status: inferred
  - name: Auxiliary invisible-decay sector benchmark
    description: Optional extra dark photon and fermion used to make V decay mostly invisibly.
    value: M_chiE = 25 MeV, alpha_E = 0.01, M_VE = 20 MeV, epsilon_E = 1e-4.
    role: benchmark
    status: assumed
