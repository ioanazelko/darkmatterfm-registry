identity:
  name: Leptonic scalar portal fermionic dark matter
  family: leptonic_scalar_portal_dark_matter
  aliases:
  - light fermion leptonic scalar portal DM
  short_description: A dark matter model in which two light fermionic dark-sector states psi1 and psi2
    annihilate through a complex scalar mediator that couples nondiagonally to electrons and muons.
  historical_origin_or_motivation: Introduced to explain both the muon g-2 anomaly and the observed dark
    matter relic abundance with a low-mass scalar portal to leptons.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - leptonic scalar portal
  - low-mass dark sector
  lagrangian_available: partial
  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The e-mu mediator interaction is treated as an effective operator with a possible vectorlike-fermion
    completion; the dark fermion interaction is written explicitly.
particle_content:
  dark_matter_candidate:
    name: psi1 and psi2 light fermionic dark matter
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: multi_component
  additional_dark_sector_particles:
  - psi1
  - psi2
  mediators:
  - complex scalar mediator phi carrying lepton numbers
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The allowed interactions conserve electron and muon lepton flavors in the massless-neutrino
    approximation and assign dark-sector charges to the fermions.
  symmetries:
  - name: U(1)_Le x U(1)_Lmu lepton flavor
    type: global
    exact_or_approximate: exact
    breaking: neutrino masses neglected
    breaking_scale: null
  - name: dark fermion number
    type: global
    exact_or_approximate: exact
    breaking: unknown
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - other
  standard_model_targets:
