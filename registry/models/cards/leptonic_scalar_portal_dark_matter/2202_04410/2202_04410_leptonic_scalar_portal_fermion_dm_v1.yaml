  - muon
  - Higgs boson through optional phi-H coupling
  dark_sector_couplings:
  - g_psi1psi2 phi psi1 psi2 + H.c.
  mediator_types:
  - complex scalar phi
  interaction_operators:
  - L_e_mu = -h_e_mu phi e_L mu_R + H.c.
  - L_psi1psi2 = g_psi1psi2 phi psi1 psi2 + H.c.
  - optional Higgs coupling lambda_H H^dagger H phi phi^*
  annihilation_channels:
  - psi1 psi2 -> e+ mu-
  - psi1 psi2 -> e- mu+
  decay_channels:
  - phi -> psi1 psi2
  tree_or_loop_level: tree
