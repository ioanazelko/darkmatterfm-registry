  source_reference_ids:
  - '2312_15016'
  notes: null
- id: condensate_regime
  applies_to: cosmological_history
  condition: For the large number densities needed for testable half-lives, phi forms a Bose-Einstein
    condensate and the perturbative free-particle capture picture breaks down.
  valid_range: T_phi below the critical temperature T_C for the chosen m_phi and n_phi
  status: inferred
  extrapolation_risk: high
  caveats:
