  - name: inflaton mass
    symbol: m
    description: Mass in V(phi)=1/2 m^2 phi^2.
    value: about 10^13 GeV from background-radiation normalization
    unit: GeV
    role: core
    status: inferred
    notes: Paper also discusses H during inflation of order 10^14 GeV in the BICEP2-motivated setup.
  - name: potential coupling
    symbol: g
    description: Inflaton-irrupton coupling controlling M_eff=g|phi-phi_*|.
    range: scanned through M_g rather than g directly
    role: core
    status: inferred
  - name: critical inflaton value
    symbol: phi_*
    description: Inflaton value at which the irrupton effective mass vanishes.
    range: chosen in the super-Planckian inflaton excursion; numerical examples use phi_*/M_Pl=0.8 and
      discuss phi_*>1.1 for viable relic abundance
    unit: M_Pl
    role: core
    status: inferred
  - name: late-time irrupton mass
    symbol: M_eff
    description: M_eff today equals g phi_* in the potential-coupled model.
    range: can be much larger than H; relic abundance examples have a minimum near M_eff/m about 30
    role: core
    status: inferred
