  - heavy subdominant inert doublet dark matter
  - H0 inert scalar subcomponent
  short_description: An inert doublet model variant in which the CP-even neutral inert scalar H0 is heavier
    than half the Higgs mass, annihilates efficiently into W, Z, Higgs, and top channels, and typically
    supplies only a small fraction of the dark matter while strengthening the electroweak phase transition.
  historical_origin_or_motivation: The paper extends earlier inert-doublet electroweak-baryogenesis studies
    by moving away from the Higgs-resonance relic-density region and allowing the inert scalar to be a
    subdominant dark matter component.
  status: speculative
  model_kind: simplified_model
