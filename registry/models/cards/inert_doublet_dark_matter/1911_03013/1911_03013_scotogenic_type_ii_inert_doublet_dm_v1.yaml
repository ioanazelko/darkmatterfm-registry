  - type-II seesaw
  - inert doublet dark matter
  - leptogenesis
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper supplies Yukawa terms, scalar potential, scalar masses, thermal cross sections, and
    coupled Boltzmann equations.
particle_content:
  dark_matter_candidate:
    name: eta_R, real neutral component of inert doublet eta
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert doublet charged scalar eta^+
  - inert doublet neutral pseudoscalar eta_I
  - three right-handed neutrinos N_i
  - SU(2)_L triplet scalar Delta
  mediators:
  - triplet scalar Delta
  - right-handed neutrinos N_i
  - SM gauge and Higgs bosons
  dark_radiation_species: []
  excited_or_degenerate_states:
