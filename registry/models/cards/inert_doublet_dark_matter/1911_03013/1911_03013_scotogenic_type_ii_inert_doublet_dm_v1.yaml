  - eta^+
  long_lived_particles:
  - eta_R dark matter
  unstable_parent_particles:
  - triplet scalar Delta
  - right-handed neutrinos N_i
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: A discrete Z_2 symmetry makes the inert doublet and RHNs odd, stabilizing the
    lightest neutral inert scalar.
  symmetries:
  - name: Z_2 inert parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the model setup
    breaking_scale: null
  - name: electroweak SU(2)_L
    type: gauge
    exact_or_approximate: broken
    breaking: standard electroweak symmetry breaking plus triplet VEV v_Delta
    breaking_scale:
      name: electroweak scale
      symbol: v
      description: SM Higgs VEV used in scalar masses.
      value: 246
      unit: GeV
      role: core
      status: established
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - other
  standard_model_targets:
  - SM gauge bosons
  - SM Higgs
  - lepton doublets
  dark_sector_couplings:
  - inert-doublet quartic Higgs couplings
  - Y^N L eta N
  - Y^Delta L^C Delta L
  - complex trilinear mu eta eta Delta
  mediator_types:
  - scalar doublet
  - scalar triplet
  - right-handed neutrino
  interaction_operators:
  - Y^N L eta N
  - Y^Delta L^C Delta L
  - mu eta eta Delta + h.c.
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - eta_R eta_R -> SM SM
  - dominant W+ W- channel in benchmarks
  - eta eta -> L L asymmetry-related scatterings
  decay_channels:
  - Delta-mediated lepton-number-violating channels
  - RHN-related channels when kinematically allowed
  self_scattering_channels: []
  cp_structure: CP asymmetry arises from the complex trilinear mu coupling and absorptive triplet propagator
    width in tree-level interference.
  flavor_structure: Neutrino masses receive scotogenic loop and type-II seesaw contributions parameterized
    by PMNS data, F_I and F_II.
  tree_or_loop_level: both
