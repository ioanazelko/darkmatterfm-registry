identity:
  name: Scotogenic type-II seesaw inert-doublet dark matter cogenesis model
  family: inert_doublet_dark_matter
  aliases:
  - tree-level interference baryogenesis with inert doublet DM
  - scotogenic plus type-II seesaw inert scalar DM
  short_description: A TeV-scale scotogenic plus type-II seesaw model in which a Z_2-stabilized neutral
    inert-doublet scalar is cold dark matter and its freeze-out is correlated with baryogenesis.
  historical_origin_or_motivation: The paper introduces tree-level interference as a baryogenesis mechanism
    and illustrates it in a realistic inert-doublet dark matter model.
  status: speculative
  model_kind: complete_theory
theory:
