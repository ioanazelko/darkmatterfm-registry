identity:
  name: Type-II seesaw inert-doublet dark matter
  family: inert_doublet_dark_matter
  aliases:
  - Z2-odd doublet Type-II seesaw dark matter
  - eta0 dark matter in Type-II seesaw
  short_description: A Type-II seesaw scalar extension with a Z2-odd inert SU(2) doublet whose lightest
    neutral component is stable and can be a WIMP-like cold dark matter candidate while the triplet generates
    Majorana neutrino masses.
  historical_origin_or_motivation: The paper is motivated by simultaneously explaining dark matter and
    neutrino masses in an extended Type-II seesaw framework.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Type-II seesaw
  - inert doublet model
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper gives kinetic/Yukawa terms and a renormalizable scalar potential for the SM Higgs doublet,
    scalar triplet, and Z2-odd inert doublet.
particle_content:
  dark_matter_candidate:
    name: eta0, the lightest neutral component of the Z2-odd inert doublet
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - charged inert scalar eta+
  - inert CP-odd scalar a0
  mediators:
  - SM-like h0
  - heavy CP-even H0
  - electroweak gauge bosons
  - Type-II seesaw triplet scalars
  dark_radiation_species: []
  excited_or_degenerate_states:
  - a0 and eta+ when nearly degenerate with eta0
  long_lived_particles:
  - eta0 protected by unbroken Z2 parity
  unstable_parent_particles:
  - heavier Z2-odd inert scalars decay to eta0
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An unbroken Z2 parity makes the inert doublet odd while the SM particles and
    triplet are even; the lightest Z2-odd particle is stable.
  symmetries:
  - name: Z2 parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken because the inert doublet has zero vacuum expectation value
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - Higgs doublet
  - electroweak gauge bosons
  - bottom quarks through scalar-mediated annihilation
  dark_sector_couplings:
  - quartic scalar interactions between H, Delta, and eta
  - electroweak gauge interactions of the inert doublet
  mediator_types:
  - CP-even scalar mediators h0 and H0
  - W and Z gauge bosons
  - triplet scalars
  interaction_operators:
  - renormalizable scalar-potential quartics lambda_5 through lambda_9
  - Yukawa coupling of the triplet to lepton doublets
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: mild
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - eta0 eta0 -> b bbar at low mass
  - eta0 eta0 -> W+ W-
  - eta0 eta0 -> Z Z
  - annihilation or coannihilation with eta+ and a0 when mass splittings are small
  - annihilation into triplet-scalar components in parts of parameter space
  decay_channels:
  - eta+ -> W+ eta0
  - a0 -> Z eta0
  self_scattering_channels: []
  cp_structure: The scalar potential can contain CP phases, but the paper removes two by field redefinitions
    and focuses on eta0 as the LOP.
  flavor_structure: Type-II seesaw triplet Yukawa couplings generate the neutrino mass matrix.
  tree_or_loop_level: tree
