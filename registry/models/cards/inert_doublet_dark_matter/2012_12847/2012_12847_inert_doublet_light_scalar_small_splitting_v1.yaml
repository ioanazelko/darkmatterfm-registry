identity:
  name: Inert Doublet Model light scalar dark matter with small non-universal splitting
  family: inert_doublet_dark_matter
  aliases:
  - IDM light H dark matter small-splitting spectrum
  short_description: A light inert-doublet scalar dark matter scenario in which the CP-even neutral scalar
    H is the lightest Z2-odd state and a small non-universal inert-scalar mass splitting yields viable
    thermal relic abundance while supporting electroweak phase-transition studies.
  historical_origin_or_motivation: The paper develops IDM dark matter and electroweak phase-transition
    parameter space and proposes a new viable small-splitting light-DM spectrum.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - Inert Doublet Model
  - Higgs-portal scalar dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The model adds a second electroweak doublet H_2, odd under Z2, with the usual IDM scalar potential
    and no new Yukawa couplings because of Z2 invariance.
particle_content:
  dark_matter_candidate:
    name: CP-even neutral inert scalar H
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - CP-odd neutral inert scalar A
  - charged inert scalars H^+ and H^-
  mediators:
  - SM Higgs boson h
  - electroweak gauge bosons
  - inert scalar coannihilation partners
  dark_radiation_species: []
  excited_or_degenerate_states:
  - A nearly degenerate with H in the small-splitting spectrum
  - H^+ and H^- with a larger splitting from H
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact discrete Z2 symmetry makes H_2 odd and all Standard Model fields even,
    preventing the lightest Z2-odd particle from decaying to Standard Model particles.
  symmetries:
  - name: Z2 inert parity
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken at zero temperature in the DM vacuum
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - SM Higgs boson
  - electroweak gauge bosons
  - SM fermions through off-shell Higgs or W/Z bosons
  dark_sector_couplings:
  - lambda_2 inert-doublet self-coupling
  - lambda_345 Higgs portal coupling
  - lambda_3, lambda_4, lambda_5 scalar-potential couplings
  mediator_types:
  - SM Higgs h
  - W and Z gauge bosons
  - A and H^+ coannihilation states
  interaction_operators:
  - H_1-H_2 scalar potential terms
  - h H H Higgs portal interaction
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  annihilation_channels:
  - H H -> h* -> b b in the funnel region
  - H H -> SM states through on-shell h near m_h/2
  - H H -> W+ f fbar and Z* Z final states near the tail region
  - coannihilations with A and H^+ when splittings are small
  decay_channels: []
  self_scattering_channels: []
  cp_structure: The IDM alone has real couplings and does not provide additional CP violation.
  flavor_structure: No new Yukawa couplings from the inert doublet due to Z2 invariance.
  tree_or_loop_level: tree
parameters:
  core:
  - name: dark matter scalar mass
    symbol: m_H
    description: Mass of the CP-even neutral inert scalar H in the light-DM scenario.
    range: 55-75
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2012_12847'
  - name: Higgs portal coupling
    symbol: lambda_345
    description: Combination lambda_3 + lambda_4 + lambda_5 governing the h H H interaction.
    range: absolute value around or below 0.01 in the surviving light-DM region; benchmark EWPhT discussion
      uses 0.005
    unit: null
    role: core
    status: established
    source_reference_ids:
    - '2012_12847'
  - name: neutral inert-scalar splitting
    symbol: m_A - m_H
    description: Mass splitting between the CP-odd inert scalar A and the DM scalar H in the new small-splitting
      light-DM spectrum.
    value: '8'
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2012_12847'
  - name: charged inert-scalar splitting
    symbol: m_Hplus - m_H
    description: Mass splitting between the charged inert scalar and the DM scalar H in the non-universal
      small-splitting spectrum.
    value: '25'
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - '2012_12847'
  - name: inert doublet self-coupling
    symbol: lambda_2
    description: Quartic self-coupling of the inert doublet, varied in the finite-temperature and EWPhT
      analysis.
    range: model-dependent; example EWPhT scan uses 0.4
    unit: null
    role: core
    status: established
    source_reference_ids:
    - '2012_12847'
