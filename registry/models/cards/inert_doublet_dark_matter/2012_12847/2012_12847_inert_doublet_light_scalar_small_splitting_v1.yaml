validity_domain:
- id: vd_light_small_splitting_region
  applies_to: parameter
  condition: The light-DM small-splitting scenario emphasized by the paper.
  valid_range: 55 GeV < m_H < 75 GeV, |lambda_345| about 0.01 or smaller, m_A - m_H = 8 GeV, m_Hplus -
    m_H = 25 GeV
  status: established
  extrapolation_risk: medium
  caveats:
  - The paper separately notes a high-mass IDM region, but this row captures the new light small-splitting
    spectrum.
  source_reference_ids:
  - '2012_12847'
  notes: The non-universal splitting suppresses coannihilations enough to avoid under-abundant dark matter.
- id: vd_z2_inert_vacuum
  applies_to: model
  condition: The inert doublet remains Z2-odd with vanishing zero-temperature vev so the lightest odd
    scalar is stable.
  valid_range: null
  status: established
  extrapolation_risk: high
  caveats:
  - If Z2 is broken in the final vacuum, H is not stable dark matter.
  source_reference_ids:
  - '2012_12847'
  notes: null
assumptions:
  global:
  - id: assump_h_is_dm
    description: The CP-even neutral inert scalar H is taken as the lightest Z2-odd dark matter particle.
    scope: theory
    status: assumed
    impact_if_violated: Replacing H by A requires the corresponding lambda_345 sign exchange described
      in the paper.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2012_12847'
    notes: The text states H/A exchange gives analogous results with lambda_345 -> lambda_345bar.
  - id: assump_standard_freezeout
    description: The relic abundance is computed with the standard Boltzmann freeze-out treatment including
      coannihilations.
    scope: production
    status: assumed
    impact_if_violated: The inferred viable splittings and portal couplings would need recalculation.
    can_be_relaxed: unknown
    source_reference_ids:
    - '2012_12847'
    notes: null
  - id: assump_extra_cp_violation
    description: The IDM alone does not provide the CP violation needed for electroweak baryogenesis,
      so additional CP-violating sources are considered agnostically.
    scope: theory
    status: assumed
    impact_if_violated: The dark matter model remains defined, but baryogenesis motivation is incomplete.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '2012_12847'
    notes: null
