symmetries:
  stabilizing_mechanism: U(1)_H is broken to an exact Z2 parity; the inert Z2 keeps Phi_2 from coupling
    to Standard Model fermions and stabilizes H^0.
  symmetries:
  - name: inert Z2 parity
    type: discrete
    exact_or_approximate: exact
    breaking: Unbroken in the low-energy model.
    breaking_scale: null
  - name: U(1)_H
    type: global
    exact_or_approximate: broken
    breaking: Broken to Z2 by sizable U(1)_H-breaking quartic coupling lambda_5.
    breaking_scale: null
  topological_defects_possible: unknown
