  - name: dark matter mass
    symbol: m_H0
    description: Mass range for light H^0 dark matter after inflationary and low-energy requirements are
      imposed.
    range: 50 GeV < m_H0 < 80 GeV in the paper's direct-detection-limited light region; generally below
      100 GeV is possible
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper says single-Higgs inflation permits light dark matter below 100 GeV.
