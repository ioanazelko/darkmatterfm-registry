  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff:
    name: unitarity scale from nonminimal gravity coupling
    symbol: Lambda_U
    description: Scale at which nonminimal Higgs-gravity couplings can challenge perturbative unitarity
      in the vacuum.
    value: set by the relevant nonminimal coupling xi_eff
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper imposes perturbativity and stability at the unitarity scale.
  embedded_in_larger_framework: 'yes'
  notes: The low-energy dark matter theory is the inert doublet model, while the inflationary completion
    uses nonminimal Higgs-gravity couplings.
