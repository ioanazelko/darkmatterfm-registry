  short_description: A two-Higgs-doublet inert model variant in which U(1)_H is broken to an exact Z2
    parity, single-field Higgs inflation is possible, and the stabilized inert scalar H^0 can be light
    dark matter below 100 GeV through Higgs-quartic annihilation with suppressed coannihilation.
  historical_origin_or_motivation: Developed to study how inflationary stability conditions restrict low-energy
    inert-doublet dark matter parameter space.
  status: speculative
  model_kind: complete_theory
theory:
