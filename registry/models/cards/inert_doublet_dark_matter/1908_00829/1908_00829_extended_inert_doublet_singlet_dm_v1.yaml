    inert doublet and a Z2-even real singlet, with the neutral inert scalar H_0 as thermal dark matter
    and singlet-Higgs mixing enabling strong first-order electroweak phase transitions.
  historical_origin_or_motivation: The paper uses a singlet extension of the inert doublet model to obtain
    viable H_0 dark matter and gravitational-wave-producing electroweak phase transitions.
