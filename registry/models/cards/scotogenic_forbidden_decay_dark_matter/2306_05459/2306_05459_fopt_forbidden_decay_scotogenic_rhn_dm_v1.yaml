theory_to_observable_routing:
  routes:
  - id: route_fopt_cogenesis
    description: Track finite-temperature masses, forbidden N1 decays, lepton asymmetry, and sphaleron
      conversion.
    source_model_features:
    - scotogenic RHN dark matter
    - first-order electroweak phase transition
    input_parameters:
    - finite-temperature potential
    - Yukawa couplings
    - M1
    - inert scalar masses
    - T_n
    derived_quantities:
    - decay window
    - lepton asymmetry
    - baryon asymmetry
    forward_model_chain:
    - step_id: thermal_potential
      step_type: semi_analytic_model
      tool_or_code: finite-temperature effective potential
      inputs:
      - scalar potential parameters
      outputs:
      - T_n
      - order parameter
      validity: Perturbative finite-temperature treatment.
      notes: Primary paper scans the inert doublet parameter space for FOPT.
    - step_id: forbidden_decay_rates
      step_type: analytic_formula
      tool_or_code: finite-temperature decay rates
      inputs:
      - thermal masses
      - Yukawa couplings
      outputs:
      - N1 decay rate
      validity: Decay open only in the finite-temperature window.
      notes: This is the defining cogenesis mechanism.
    - step_id: sphaleron_conversion
      step_type: analytic_formula
      tool_or_code: electroweak sphaleron conversion
      inputs:
      - lepton asymmetry
      - T_s > T_Sph
      outputs:
      - baryon asymmetry
      validity: Before sphaleron decoupling.
      notes: Primary paper imposes T_s > T_Sph.
    observable_ids:
    - obs_forbidden_decay_baryogenesis
    constraint_ids:
    - con_fopt_temperature_window
    likelihoods:
    - baryon asymmetry target
    required_code_resources:
    - finite-temperature potential code
    - Boltzmann/asymmetry solver
    validation_tests:
    - Reproduce T_n below 34 GeV for benchmarks.
    route_status: planned
    agent_notes: No public workflow was included in the assignment text.
    caveats:
    - Finite-temperature perturbation theory uncertainty.
  - id: route_gw_spectrum
    description: Convert first-order phase-transition parameters into a stochastic gravitational-wave
      spectrum and compare with planned interferometers.
    source_model_features:
    - strong first-order phase transition
    input_parameters:
    - T_n
    - alpha
    - beta/H
    - wall velocity
    derived_quantities:
    - Omega_GW(f)
    - peak frequency
    forward_model_chain:
    - step_id: pt_parameters
      step_type: data_transform
      tool_or_code: phase-transition scan output
      inputs:
      - finite-temperature potential
      outputs:
      - alpha
      - beta/H
      - T_n
      validity: Benchmark dependent.
      notes: Derived from the same FOPT scan.
    - step_id: gw_prediction
      step_type: analytic_formula
      tool_or_code: standard phase-transition GW formulae
      inputs:
      - alpha
      - beta/H
      - T_n
      outputs:
      - Omega_GW(f)
      validity: Sound-wave/turbulence assumptions.
      notes: Compare to LISA, BBO, DECIGO, ARES bands.
    observable_ids:
    - obs_fopt_gravitational_waves
    constraint_ids:
    - con_fopt_temperature_window
    likelihoods:
    - planned detector sensitivity curves
    required_code_resources:
    - GW spectrum calculator
    validation_tests:
    - Check benchmark peaks lie inside LISA/BBO bands.
    route_status: planned
    agent_notes: The arXiv fallback source supports eLISA phase-transition sensitivity, not this model-specific
      spectrum.
    caveats:
    - Detector forecasts and phase-transition modeling uncertainty.
  - id: route_relic_mass_ordering
    description: Filter the FOPT parameter scan by N1 stability and relic-density compatibility.
    source_model_features:
    - unbroken Z2
    - right-handed-neutrino dark matter
    input_parameters:
    - M1
    - M_H
    - M_A
    - annihilation rates
    derived_quantities:
    - Omega_N1 h^2
    - stability flag
    forward_model_chain:
    - step_id: mass_order_filter
      step_type: validation
      tool_or_code: dark-sector spectrum check
      inputs:
      - M1
      - M_H
      - M_A
      outputs:
      - N1 stable flag
      validity: Zero-temperature spectrum.
      notes: Primary paper excludes points where N1 is not the stable DM.
    - step_id: relic_solution
      step_type: boltzmann_solver
      tool_or_code: thermal relic calculation
      inputs:
      - annihilation/coannihilation rates
      outputs:
      - Omega_N1 h^2
      validity: Standard thermal history.
      notes: Primary paper states stable points also satisfy the relic abundance.
    observable_ids:
    - obs_rhn_relic_density
    constraint_ids:
    - con_dm_mass_ordering
    likelihoods:
    - Planck relic-density target
    required_code_resources:
    - relic solver
    validation_tests:
    - Check mass-ordering and relic target together.
    route_status: planned
    agent_notes: Scan-level statement only; no likelihood table extracted.
    caveats:
    - Relic solution depends on inert-doublet spectrum.
