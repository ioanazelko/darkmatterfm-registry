  short_description: A supersymmetric Peccei-Quinn construction in which a new weakly coupled sector undergoes
    a late transition below the QCD scale, yielding cold remnant a1 pseudoscalars and Phi0 radial scalar
    oscillations as dark matter candidates.
  historical_origin_or_motivation: Built to evade the conventional axion cosmological upper bound on the
    PQ scale without anthropic initial-angle selection and while preserving the strong-CP solution.
  status: speculative
  model_kind: complete_theory
