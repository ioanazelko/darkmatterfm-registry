  source_reference_ids:
  - src_primary
  notes: null
theory_to_observable_routing:
  routes:
  - id: route_relic_direct_detection
    description: Scan the conformal U(1)_X singlet-fermion model in M_chi, M2, and theta, compute relic
      density and SI scattering, and compare with Planck/direct-detection bounds.
    source_model_features:
    - classically scale-invariant Higgs portal
    - two degenerate Dirac singlet fermions
    - mixed h1/h2 scalar mediators
    input_parameters:
    - M_chi
    - M_2
    - theta
    derived_quantities:
    - M_Ax
    - g_X
    - g_S
    - Omega_CDM h^2
    - sigma_SI
    forward_model_chain:
    - step_id: dependent_params
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - M_chi
      - M_2
      - theta
      outputs:
      - M_Ax
      - g_X
      - g_S
      validity: uses mass relations from the conformal model
      notes: null
    - step_id: rates
      step_type: boltzmann_solver
      tool_or_code: CalcHEP + micrOMEGAs
      inputs:
      - model file
      - dependent parameters
      outputs:
      - relic density
      - sigma_SI
      validity: primary paper tool chain
      notes: null
    - step_id: bounds
      step_type: recasting
      tool_or_code: null
      inputs:
      - Omega_CDM h^2
      - sigma_SI
      outputs:
      - allowed/excluded regions
      validity: scan-level comparison to experimental limits
      notes: null
    observable_ids:
    - obs_spin_independent_scalar_exchange
    - obs_relic_resonance_structure
    constraint_ids:
    - c_relic_direct_detection_scan
    - c_lep_xenon_lhc_mixing
    likelihoods:
    - Planck relic density
    - LUX/XENON/SuperCDMS SI limits
    required_code_resources:
    - CalcHEP model
    - micrOMEGAs
    validation_tests:
    - Reproduce relic-density resonance bands and SI scatter plot.
    route_status: partially_implemented
    agent_notes: null
    caveats:
    - Current output stores paper-level constraints, not machine-readable scan grids.
  - id: route_scalar_collider
    description: Translate scalar mixing and mass choices into invisible Higgs, h2, Higgs self-coupling,
      and A_X collider signatures.
    source_model_features:
    - Higgs-singlet scalar mixing
    - dark gauge boson tied to conformal mass relations
    input_parameters:
    - theta
    - M_2
    - M_chi
    - M_Ax
    derived_quantities:
    - BR(h1 invisible)
    - h2 production rate
    - h2 decay modes
    - triple-Higgs deviation
    - A_X pair-production difficulty
    forward_model_chain:
    - step_id: higgs_widths
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - theta
      - M_chi
      outputs:
      - BR(h1->invisible)
      validity: valid if h1->chi chi is open
      notes: null
    - step_id: scalar_searches
      step_type: recasting
      tool_or_code: null
      inputs:
      - theta^2
      - M_2
      - branching fractions
      outputs:
      - LEP/LHC/future bounds
      validity: approximate translation used by paper
      notes: null
    - step_id: gauge_boson
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - M_Ax
      - theta
      outputs:
      - A_X decay width
      - production suppression
      validity: qualitative collider conclusion
      notes: null
    observable_ids:
    - obs_scalar_and_higgs_collider_signatures
    constraint_ids:
    - c_scalar_collider_bounds
    - c_lep_xenon_lhc_mixing
    likelihoods:
    - LEP/LHC scalar limits
    - invisible Higgs bounds
    - future ILC/VLHC projections
    required_code_resources:
    - HiggsBounds-like scalar recast
    - collider simulation for h2/A_X
    validation_tests:
    - Reproduce quoted theta^2 examples for h2 -> ZZ and invisible-Higgs projections.
    route_status: planned
    agent_notes: null
    caveats:
    - A_X collider route is weak in the near-term parameter space.
