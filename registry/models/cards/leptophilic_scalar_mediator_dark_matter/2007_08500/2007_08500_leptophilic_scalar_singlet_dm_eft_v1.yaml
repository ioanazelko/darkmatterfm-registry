  short_description: A fermionic singlet dark matter EFT with CP-even scalar singlet mediators tied to
    broken lepton Z2 symmetries, light-lepton masses, and leptophilic interactions.
  historical_origin_or_motivation: The paper extends a scalar-singlet dark matter EFT to address XENON1T
    electron recoils, light lepton masses, and relic-density possibilities.
  status: speculative
  model_kind: effective_field_theory
