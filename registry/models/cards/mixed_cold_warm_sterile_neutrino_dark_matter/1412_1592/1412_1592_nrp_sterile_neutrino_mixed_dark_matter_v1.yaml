  - src_1412_1592_1403_0954
theory_to_observable_routing:
  routes:
  - agent_notes: Primary paper used simulations and CVFs; production reuse should validate against their
      benchmark spectra.
    caveats: []
    constraint_ids:
    - lyman_alpha_mixed_dm_bound
    - satellite_cvf_constraint
    derived_quantities:
    - linear transfer function
    - half-mode scale
    - subhalo mass or velocity function
    description: Propagate the mixed sterile-neutrino phase-space distribution into Lyman-alpha and satellite
      observables.
    forward_model_chain:
    - inputs:
      - M_s
      - r_warm
      notes: Normalize the total dark matter density to the observed value.
      outputs:
      - matter power spectrum
      - transfer function
      step_id: distribution
      step_type: boltzmann_solver
      tool_or_code: CLASS/CAMB with sterile-neutrino distribution module
      validity: valid for the chosen non-resonant momentum distribution
    - inputs:
      - transfer function
      notes: Include resolution and halo-to-halo variance tests.
      outputs:
      - subhalo V_max function
      step_id: subhalos
      step_type: simulation
      tool_or_code: N-body simulation or calibrated subhalo emulator
      validity: approximate if using an emulator calibrated on WDM/MDM simulations
    - inputs:
      - transfer function
      - subhalo catalog
      notes: Keep baryonic uncertainties explicit.
      outputs:
      - allowed warm fraction and mass regions
      step_id: likelihoods
      step_type: likelihood
      tool_or_code: Lyman-alpha and satellite-count likelihoods
      validity: requires hydrodynamical nuisance treatment for Lyman-alpha
    id: route_mixed_dm_structure
    input_parameters:
    - M_s
    - r_warm
    - cosmological parameters
    - primordial spectrum
    likelihoods:
    - Lyman-alpha likelihood
    - Local Group satellite CVF likelihood
    observable_ids:
    - mixed_nrp_matter_power_suppression
    - subhalo_cvf_suppression
    required_code_resources:
    - CLASS or CAMB
    - N-body or emulator code
    - SUBFIND-style subhalo finder
    route_status: planned
    source_model_features:
    - cold plus warm mixed dark matter
    - non-resonant Dodelson-Widrow sterile-neutrino component
    validation_tests:
    - recover primary transfer-function trends
    - compare CDM, MDM and WDM benchmark CVFs
  - agent_notes: Useful only after choosing a target profile and instrumental background model.
    caveats: []
    constraint_ids:
    - xray_decay_line_constraint
    derived_quantities:
    - decay lifetime
    - line energy
    - expected photon flux
    description: Convert sterile-neutrino mixing and fraction into X-ray line flux constraints.
    forward_model_chain:
    - inputs:
      - M_s
      - sin^2(2theta)
      notes: Scale the flux by the sterile-neutrino dark-matter fraction.
      outputs:
      - radiative lifetime
      - line energy
      step_id: decay
      step_type: analytic_formula
      tool_or_code: null
      validity: standard sterile-neutrino decay approximation
    - inputs:
      - dark-matter column density
      - instrument response
      notes: Use consistent energy resolution and background model.
      outputs:
      - predicted line counts
      step_id: target_flux
      step_type: data_transform
      tool_or_code: X-ray target J/D-factor calculation
      validity: target-dependent
    - inputs:
      - predicted counts
      - spectra
      notes: Do not treat a candidate line as confirmed without independent evidence.
      outputs:
      - mixing-angle exclusion
      step_id: xray_likelihood
      step_type: likelihood
      tool_or_code: X-ray line-search likelihood
      validity: requires public or reconstructed spectral likelihood
    id: route_xray_decay_flux
    input_parameters:
    - M_s
    - sin^2(2theta)
    - r_warm
    - target dark-matter column density
    likelihoods:
    - X-ray spectral line likelihood
    observable_ids:
    - sterile_decay_xray_line
    required_code_resources:
    - sterile-neutrino decay calculator
    - X-ray spectral-analysis tools
    route_status: planned
    source_model_features:
    - decaying sterile-neutrino subcomponent
    - radiative decay line
    validation_tests:
    - reproduce 3.5 keV line-flux scaling
    - check subdominant-fraction rescaling
