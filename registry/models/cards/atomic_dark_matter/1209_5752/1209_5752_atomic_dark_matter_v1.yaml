      observables.
    constraint_ids:
    - constr_lyman_dao
    - constr_dark_radiation
    - constr_halo_ellipticity
    derived_quantities:
    - ionization fraction x_D
    - drag opacity
    - k_DAO
    - M_min
    - Delta N_eff
    - self-scattering rate
    description: Route atomic dark-sector microphysics through recombination, kinetic decoupling, perturbations,
      CMB, matter power, and halo constraints.
    forward_model_chain:
    - inputs:
      - m_D
      - alpha_D
      - B_D
      - xi
      notes: Compute ionization fraction and thermal/kinetic decoupling.
      outputs:
      - dark recombination history
      - x_D
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Requires case-B dark recombination for most appreciably recombining models.
    - inputs:
      - drag opacity
      - dark radiation hierarchy
      notes: Solve coupled DM/DR perturbations and identify DAO/acoustic damping.
      outputs:
      - CMB spectra
      - matter transfer function
      step_id: s2
      step_type: boltzmann_solver
      tool_or_code: modified CAMB/CLASS-style solver
      validity: Linear perturbation regime.
    - inputs:
      - matter transfer function
      notes: Translate DAO scale to minimal halo mass and Ly-alpha-style cuts.
      outputs:
      - k_DAO
      - M_min
      step_id: s3
      step_type: data_transform
      tool_or_code: null
      validity: Approximate summaries of the full transfer function.
    - inputs:
      - self-scattering cross sections
      - halo density/velocity
      notes: Apply ellipticity/collisionality criteria.
      outputs:
      - halo collisionality flag
      step_id: s4
      step_type: semi_analytic_model
      tool_or_code: null
      validity: Approximate halo treatment; simulations needed for precision.
    id: route_atomic_boltzmann
    input_parameters:
    - m_D
    - alpha_D
    - B_D
    - xi
    likelihoods:
