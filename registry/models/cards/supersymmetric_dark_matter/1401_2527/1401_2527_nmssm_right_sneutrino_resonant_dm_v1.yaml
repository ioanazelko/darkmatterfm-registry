    range: about 130-135 GeV
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
  - name: right-neutrino singlet coupling
    symbol: y_r
    description: Dimensionless coupling of the NMSSM singlet to right-handed neutrino superfields, generating
