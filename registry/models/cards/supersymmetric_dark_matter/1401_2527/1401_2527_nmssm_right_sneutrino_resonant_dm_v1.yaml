    value: 0.1120 +/- 0.011
    role: derived
    status: assumed
    source_reference_ids: []
  - name: resonance offset
    symbol: delta
    description: Parameter quantifying whether the pole lies above or below twice the dark matter mass.
    range: small positive or negative values considered near resonance
    role: derived
    status: established
    source_reference_ids: []
