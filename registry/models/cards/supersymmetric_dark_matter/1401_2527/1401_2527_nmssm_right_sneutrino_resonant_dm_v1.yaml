    role: core
    status: established
    source_reference_ids: []
  - name: right-sneutrino soft trilinear
    symbol: T_r
    description: Soft trilinear coupling controlling singlet-Higgs and right-sneutrino interactions.
    role: core
    status: established
    source_reference_ids: []
  - name: neutrino Yukawa coupling
    symbol: y_nu
    description: Yukawa coupling entering the seesaw neutrino mass matrix in the NMSSM extension.
    value: O(1e-6) can reproduce neutrino data in the paper's discussion
    role: core
    status: established
    source_reference_ids: []
  - name: singlet-like Higgs mediator mass
    symbol: m_H2 or m_As
    description: Mediator mass lies near twice the sneutrino mass for resonant annihilation.
    range: near 2 m_snu_R
    unit: GeV
    role: core
    status: established
    source_reference_ids: []
