  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes W = W_MSSM + lambda S H_u H_d + kappa S^3/3 + y_nu H_u L nu_R + y_r S nu_R nu_R/2
    and the corresponding soft terms.
