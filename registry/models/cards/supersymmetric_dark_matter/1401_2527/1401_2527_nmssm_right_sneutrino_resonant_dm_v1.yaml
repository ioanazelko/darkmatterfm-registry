identity:
  name: NMSSM right-sneutrino resonant dark matter
  family: supersymmetric_dark_matter
  aliases:
  - Right-sneutrino dark matter in the scale-invariant NMSSM
  - Singlet-Higgs-resonant right-chiral sneutrino dark matter
  short_description: A scale-invariant NMSSM extension with right-handed neutrino superfields, where mostly
    right-chiral sneutrino dark matter annihilates near a singlet-like CP-even or CP-odd Higgs resonance
    and can satisfy the relic-density target.
  historical_origin_or_motivation: Developed to explain a tentative 130-135 GeV monochromatic photon line
    while evading continuum and direct-detection bounds that challenge the MSSM variant.
  status: speculative
  model_kind: complete_theory
