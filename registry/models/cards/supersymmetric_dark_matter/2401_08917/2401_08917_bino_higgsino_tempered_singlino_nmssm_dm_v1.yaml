  - bino-higgsino-singlino blind-spot NMSSM
  short_description: A Z3-symmetric NMSSM scenario in which a singlino-dominated neutralino LSP is tempered
    by nearby bino and higgsino states, producing thermal annihilation or co-annihilation regimes and
    generalized direct-detection blind spots.
  historical_origin_or_motivation: Motivated by R-parity-conserving supersymmetry, the NMSSM solution
    of the mu problem, singlino WIMP dark matter, and newly identified bino-higgsino-singlino blind-spot
    regions with photon-rich electroweakino cascades.
  status: speculative
  model_kind: complete_theory
