  - singlino-dominated neutralino WIMP
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the Z3 NMSSM superpotential W = W_MSSM(mu=0) + lambda S Hu Hd + kappa S^3/3
    and soft terms, then works in a decoupled-wino setup with a 4 by 4 bino-higgsino-singlino neutralino
    sector.
