  - type-I seesaw
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff:
    name: stochastic superspace cutoff scale
    symbol: xi
    description: High scale at which stochastic superspace soft-breaking boundary conditions are set;
      viable neutralino-LSP regions require a generally large cutoff scale.
    value: null
    range: M_GUT < xi < M_Planck, with viable neutralino-LSP regions at large xi
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1003_4782'
    notes: The text uses a cutoff scale between the GUT and Planck scales.
  embedded_in_larger_framework: 'yes'
  notes: The ordinary spacetime Lagrangian is defined by averaging the supersymmetric Lagrangian over
    a Lorentz-invariant probability distribution for the Grassmann coordinates, producing constrained
    soft terms.
