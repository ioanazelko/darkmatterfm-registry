identity:
  name: Stochastic superspace neutralino LSP with type-I seesaw
  family: supersymmetric_dark_matter
  aliases:
  - stochastic supersymmetry neutralino dark matter
  - stochastic superspace seesaw model
  short_description: A stochastic-superspace supersymmetric model variant in which R-parity is conserved,
    a neutralino can be the LSP in the viable high-cutoff region, and a type-I seesaw extension adds neutrino
    masses while preserving the neutralino dark-matter possibility.
  historical_origin_or_motivation: The paper aims to make the stochastic superspace soft-breaking framework
    more realistic by updating sparticle spectra and adding neutrino masses, while retaining viable neutralino-LSP
    regions in the R-parity-conserving seesaw case.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
