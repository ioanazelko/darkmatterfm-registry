theory_to_observable_routing:
  routes:
  - id: route_sdf_freezeout
    description: Solve eta2 thermal freeze-out including annihilation and coannihilation channels.
    source_model_features:
    - Z2-stabilized singlet-doublet fermion
    - Dirac scotogenic neutrino mass
    input_parameters:
    - M_eta2
    - mixing
    - Yukawa couplings
    - mass splittings
    derived_quantities:
    - Omega_eta2 h^2
    - annihilation fractions
    forward_model_chain:
    - step_id: cross_sections
      step_type: analytic_formula
      tool_or_code: model annihilation amplitudes
      inputs:
      - spectrum
      - couplings
      outputs:
      - annihilation and coannihilation rates
      validity: Perturbative singlet-doublet regime.
      notes: Include SM and right-handed-neutrino final states.
    - step_id: freezeout
      step_type: boltzmann_solver
      tool_or_code: thermal relic solver
      inputs:
      - rates
      - mass splittings
      outputs:
      - Omega_eta2 h^2
      validity: Standard freeze-out.
      notes: Compare to Planck target.
    observable_ids:
    - obs_singlet_doublet_freezeout
    constraint_ids:
    - con_planck_thermal_relic
    likelihoods:
    - Planck relic-density target
    required_code_resources:
    - Boltzmann/relic solver
    validation_tests:
    - Recover primary relic-density contours.
    route_status: planned
    agent_notes: Needs model implementation to reproduce scan.
    caveats:
    - Correlated with neutrino-mass fit.
  - id: route_sdf_direct_detection
    description: Compute tree and loop contributions to spin-independent nucleon scattering and compare
      to xenon limits.
    source_model_features:
    - singlet-doublet mixing
    - loop neutrino-mass sector
    input_parameters:
    - M_eta2
    - mixing/coupling parameter
    - scalar masses
    derived_quantities:
    - sigma_SI_tree
    - sigma_SI_loop
    forward_model_chain:
    - step_id: tree_loop_amplitudes
      step_type: analytic_formula
      tool_or_code: tree and one-loop scattering amplitudes
      inputs:
      - couplings
      - masses
      outputs:
      - sigma_SI
      validity: Nonrelativistic SI limit.
      notes: Primary paper separates two parameter cases.
    - step_id: xenon_compare
      step_type: recasting
      tool_or_code: XENONnT/LZ/DARWIN curves
      inputs:
      - sigma_SI
      - M_eta2
      outputs:
      - allowed_or_excluded
      validity: Experiment SI assumptions.
      notes: LZ local text anchors current limit context.
    observable_ids:
    - obs_tree_loop_si_scattering
    constraint_ids:
    - con_xenonnt_lz_si
    likelihoods:
    - XENONnT/LZ SI limits
    required_code_resources:
    - direct-detection recast
    validation_tests:
    - Check case-1 below reach and case-2 constrained behavior.
    route_status: planned
    agent_notes: Exact OCR-lost parameter symbol should be restored before numerical recasting.
    caveats:
    - Direct-detection assumptions.
  - id: route_neff_prediction
    description: Predict Delta N_eff from thermal or nonthermal right-handed-neutrino/singlet histories.
    source_model_features:
    - Dirac neutrinos
    - hidden relativistic species
    input_parameters:
    - decoupling temperature
    - hidden-sector abundance
    - couplings
    derived_quantities:
    - Delta N_eff
    forward_model_chain:
    - step_id: thermal_history
      step_type: semi_analytic_model
      tool_or_code: thermal/nonthermal abundance calculation
      inputs:
      - interaction rates
      - temperatures
      outputs:
      - rho_hidden
      validity: Model-specific cosmology.
      notes: Primary paper explores both origins.
    - step_id: cmb_forecast
      step_type: recasting
