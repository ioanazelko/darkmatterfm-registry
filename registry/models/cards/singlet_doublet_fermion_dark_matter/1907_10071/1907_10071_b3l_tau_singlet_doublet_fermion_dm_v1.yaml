  unstable_parent_particles:
  - heavier vector-like fermion states
  - Z_{B-3L_tau} gauge boson
  - non-SM scalars
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The additional U(1)_{B-3L_tau} gauge symmetry and charge assignments naturally
    stabilize the lightest singlet-doublet fermion state without imposing an ad-hoc Z2 symmetry.
  symmetries:
  - name: U(1)_{B-3L_tau}
    type: gauge
    exact_or_approximate: broken
    breaking: Spontaneously broken by two scalar singlet vacuum expectation values.
  - name: residual gauge stabilization of vector-like fermion
    type: discrete
    exact_or_approximate: exact
  - name: Standard Model gauge symmetry
    type: gauge
    exact_or_approximate: exact
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  standard_model_targets:
  - third-generation leptons through B-3L_tau gauge interactions
  - quarks through baryon charge
  - SM Higgs sector
  - electroweak gauge bosons
  dark_sector_couplings:
  - singlet-doublet Yukawa mixing
  - vector-like fermion coupling to B-3L_tau gauge boson
  - scalar singlet interactions
  mediator_types:
  - flavoured Z prime gauge boson
  - mixed scalar mediators
  - SM electroweak gauge bosons
  interaction_operators:
  - renormalizable singlet-doublet fermion mixing terms
  - Majorana mass term splitting Dirac VLFs into pseudo-Dirac states
  - U(1)_{B-3L_tau} gauge interactions
  annihilation_channels:
  - thermal annihilation to SM particles through gauge and scalar mediators
  - coannihilation with heavier vector-like fermion states
  decay_channels:
  - heavier vector-like fermion states decay to the dark matter state plus SM bosons or leptons in collider
    studies
  self_scattering_channels: []
  cp_structure: scalar mixing phase set to zero in the paper setup
  flavor_structure: family-nonuniversal B-3L_tau charge, restricted to third-generation leptons
  tree_or_loop_level: tree
