    produced.
  historical_origin_or_motivation: The model is motivated by singlet-doublet fermion DM, neutrino mass
    through type-I seesaw, collider-accessible gauge bosons, and high-scale vacuum stability.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
