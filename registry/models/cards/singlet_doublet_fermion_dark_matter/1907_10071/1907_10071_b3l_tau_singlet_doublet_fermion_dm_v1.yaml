particle_content:
  dark_matter_candidate:
    name: lightest neutral singlet-doublet vector-like fermion mass eigenstate
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - vector-like fermion doublet
  - vector-like fermion singlet
  - charged vector-like fermion
  - right-handed neutrinos
  - two scalar singlets charged under U(1)_{B-3L_tau}
