  - flavoured Abelian gauge extension
  - type-I seesaw neutrino mass
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper specifies new particles, charges, scalar potential, fermion interactions, anomaly cancellation,
