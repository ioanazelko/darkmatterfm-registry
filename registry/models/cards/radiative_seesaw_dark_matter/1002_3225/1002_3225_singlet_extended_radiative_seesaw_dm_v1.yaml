identity:
  name: Singlet-extended radiative seesaw dark matter
  family: radiative_seesaw_dark_matter
  aliases:
  - inert-doublet radiative seesaw model with singlet scalar S
  - Breit-Wigner enhanced N_1 dark matter
  short_description: An extension of the inert-doublet radiative seesaw model in which the lightest Z_2-odd
    singlet fermion N_1 is cold dark matter and a Z_2-even complex singlet scalar S enables resonant annihilation
    enhancement.
  historical_origin_or_motivation: Motivated by preserving radiative neutrino-mass and relic-density features
    while addressing the large boost factor needed for PAMELA and Fermi-LAT charged-lepton excesses.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - radiative seesaw model
  - inert doublet model
  lagrangian_available: partial
  renormalizable: 'yes'
  embedded_in_larger_framework: unknown
  notes: The paper writes the relevant inert-doublet radiative-seesaw interactions and the added singlet-scalar
    interaction, while noting that the singlet extension is not the most general Lagrangian under the
    symmetry.
particle_content:
  dark_matter_candidate:
    name: N_1, the lightest gauge-singlet right-handed fermion
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - inert SU(2)_L doublet scalar eta
  - gauge-singlet fermions N_2 and N_3
  - complex singlet scalar S
  mediators:
  - inert doublet scalar eta
  - complex singlet scalar S
  dark_radiation_species: []
  excited_or_degenerate_states:
  - N_2 may coannihilate with N_1 in the successful case
  long_lived_particles:
  - N_1
  unstable_parent_particles:
  - S can decay dominantly to N_k when kinematically allowed
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An imposed Z_2 symmetry makes the new inert doublet and N_k odd and the SM fields
    even, guaranteeing stability of the lightest N_k.
  symmetries:
  - name: Z_2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken in the model as described
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - neutrino
  - other
  standard_model_targets:
  - left-handed lepton doublets
  - charged leptons
  dark_sector_couplings:
  - h_alpha_k L_alpha eta N_k
  - y_k S N_k N_k
  - quartic scalar couplings involving S, the inert doublet, and the Higgs doublet
  mediator_types:
  - inert doublet scalar
  - complex singlet scalar
  interaction_operators:
  - Majorana mass terms for N_k
  - Yukawa coupling between lepton doublets, inert scalar, and N_k
  - singlet-scalar coupling to N_k pairs
  annihilation_channels:
  - N_1 N_1 annihilation to charged leptons through the inert scalar sector
  - resonantly enhanced one-loop contribution through the singlet scalar S
  decay_channels:
  - S to N_k pairs when kinematically allowed
  self_scattering_channels: []
  tree_or_loop_level: both
