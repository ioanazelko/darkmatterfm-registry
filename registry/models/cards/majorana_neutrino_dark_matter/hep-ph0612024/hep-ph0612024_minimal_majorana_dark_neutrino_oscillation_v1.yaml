  short_description: A minimal see-saw extension in which a very weakly coupled quasi-degenerate Majorana
    neutrino is the dark matter candidate and is produced by nonadiabatic oscillations from a thermally
    coupled bright Majorana neutrino; the paper finds this minimal scenario underproduces the relic density.
  historical_origin_or_motivation: The paper asks whether a nearly decoupled Majorana neutrino in a see-saw
    model can also account for dark matter while preserving leptogenesis and active-neutrino masses.
