    symbol: mu_X
    description: Superpotential mass for X and Xbar fermionic partners.
    value: M_X1 = M_X2 = mu_X for fermionic candidates
    role: core
    status: inferred
    source_reference_ids: []
  - name: slepton mass
    symbol: M_slepton
    description: Mass of the MSSM slepton final states in simplified relic-density examples.
    range: scanned between 100 GeV and the dark matter mass in the examples
    unit: GeV
    role: core
    status: inferred
    source_reference_ids: []
  - name: B-L mass-to-coupling ratio
    symbol: M_Z_BL/g_BL
    description: Ratio used in relic-density scans and gauge-sector discussion.
    value: 4 TeV in one figure discussion
    unit: TeV
    role: core
    status: inferred
    source_reference_ids: []
