validity_domain:
- id: no-dark-scalar-vev
  applies_to: model
  condition: The stability branch assumes v_X = v_Xbar = 0 and M_X^2 > 0 so the dark scalar fields do
    not acquire VEVs.
  valid_range: M_X^2 > 0 on the trivial-VEV branch
  status: inferred
  extrapolation_risk: high
  caveats:
  - Other vacuum branches can change the spectrum and stability argument.
  source_reference_ids:
  - '1207_2529'
  notes: null
- id: no-right-handed-neutrino-operators
  applies_to: model
  condition: The paper assumes X and Xbar do not couple through operators involving right-handed neutrinos.
  valid_range: 2p - n n_BL != 0 for integer n and p in the paper notation
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Allowing these operators could open additional decay or interaction channels.
  source_reference_ids:
  - '1207_2529'
  notes: null
- id: sfermion-final-state-regime
  applies_to: parameter
  condition: The main relic-density examples focus on X heavier than at least one MSSM sfermion, especially
    sleptons.
  valid_range: M_X above a relevant sfermion mass in the simplified scans
  status: assumed
  extrapolation_risk: medium
  caveats:
  - For lighter X, the paper states loop-level fermion channels require a future dedicated treatment.
  source_reference_ids:
  - '1207_2529'
  notes: null
