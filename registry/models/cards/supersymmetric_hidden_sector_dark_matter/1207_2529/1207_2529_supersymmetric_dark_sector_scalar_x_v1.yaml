identity:
  name: Supersymmetric dark-sector scalar X dark matter
  family: supersymmetric_hidden_sector_dark_matter
  aliases:
  - B-L linked supersymmetric dark matter sector
  - scalar X dark matter with visible-sector R-parity violation
  short_description: A B-L linked supersymmetric dark sector with two chiral superfields in which the
    lightest scalar X is stable even if R parity is broken in the visible sector and freezes out mainly
    through annihilation into sfermions.
  historical_origin_or_motivation: Designed to make a dark matter candidate stable through the structure
    of a supersymmetric dark sector rather than imposing visible-sector R parity.
  status: speculative
  model_kind: simplified_model
theory:
  theory_level: simplified_model
  parent_frameworks:
  - minimal B-L extension of the MSSM
  - supersymmetric dark sector
  - gauge mediation
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the dark-sector superspace Lagrangian and embeds the visible sector in a minimal
    B-L MSSM where right-handed sneutrino VEVs break B-L and R parity.
particle_content:
  dark_matter_candidate:
    name: lightest scalar X in the dark sector
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - chiral superfield X
  - chiral superfield Xbar
  - fermionic partners of X and Xbar
  mediators:
  - B-L gauge boson Z_BL
  - B-L D-term interaction
  dark_radiation_species: []
  excited_or_degenerate_states:
  - heavier scalar partner Xbar
  - fermionic dark-sector partners with mass mu_X
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The dark scalars do not acquire VEVs for the relevant parameter branch, B-L D-terms
    split the spectrum, and the lightest dark-sector scalar X has no lighter dark state to decay into
    even with visible-sector R-parity violation.
  symmetries:
  - name: U(1)_{B-L}
    type: gauge
    exact_or_approximate: broken
    breaking: broken by right-handed sneutrino VEVs in the visible sector
    breaking_scale:
      name: B-L breaking scale
      symbol: v_R
      description: Sets M_ZBL = g_BL v_R / 2 in the paper.
      value: model-dependent
      role: core
      status: inferred
      source_reference_ids: []
  - name: dark-sector supersymmetry
    type: unknown
    exact_or_approximate: exact
    breaking: assumed protected from large visible-sector soft terms by gauge mediation
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  standard_model_targets:
  - MSSM sfermions
  - sleptons
  - Standard Model fermions through loop-level channels when sfermion channels are closed
  dark_sector_couplings:
  - B-L gauge coupling g_BL
  - B-L charge n_BL
  - supersymmetric mass mu_X
  mediator_types:
  - B-L gauge boson Z_BL
  - D-term scalar interaction
  - sfermions in final states
  interaction_operators:
  - superspace kinetic coupling X^dagger exp(g_BL n_BL V_BL) X
  - superpotential mass term mu_X X Xbar
  annihilation_channels:
  - X X* -> sfermion pair
  - X X* -> slepton pair in simplified scans
  - loop-level annihilation into Standard Model fermions when X is below the slepton threshold
  scattering:
    elastic: 'yes'
    inelastic: unknown
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: spin_independent
  tree_or_loop_level: both
parameters:
