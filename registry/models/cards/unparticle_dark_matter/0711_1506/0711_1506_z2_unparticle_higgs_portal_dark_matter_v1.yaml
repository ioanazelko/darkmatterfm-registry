    breaking: electroweak symmetry breaking gives the unparticle a mass through the Higgs coupling
    breaking_scale:
      name: electroweak vacuum expectation value
      symbol: v
      description: Higgs vev that generates the unparticle mass through the Higgs-portal operator.
      value: 246
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - primary
  topological_defects_possible: unknown
