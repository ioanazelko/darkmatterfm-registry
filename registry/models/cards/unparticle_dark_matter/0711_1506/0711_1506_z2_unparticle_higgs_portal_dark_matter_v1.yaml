  short_description: A cold-dark-matter model in which scalar unparticles from a hidden conformal sector
    are made stable by a Z2 parity, acquire mass through the Standard Model Higgs doublet, and freeze
    out through Higgs-mediated annihilation.
  historical_origin_or_motivation: Proposed as a WIMP-like dark-matter candidate in Georgi-style unparticle
    physics, with stability supplied by a parity analogous to R parity or T parity.
  status: speculative
  model_kind: effective_field_theory
