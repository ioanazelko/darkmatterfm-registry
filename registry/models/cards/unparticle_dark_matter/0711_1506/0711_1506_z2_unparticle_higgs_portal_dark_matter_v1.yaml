    range: paper uses the cutoff in the low-energy EFT; detailed numerical value is not fixed in the extracted
      text
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - primary
  embedded_in_larger_framework: 'yes'
  notes: The paper reviews the UV operator flowing to an unparticle operator below the scale Lambda_U
    and then focuses on a scalar unparticle pair coupled to H dagger H.
