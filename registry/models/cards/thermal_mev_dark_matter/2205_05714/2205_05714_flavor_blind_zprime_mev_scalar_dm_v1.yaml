      is needed for broader variants.
    caveats:
    - S-wave electromagnetic annihilation has additional indirect-detection constraints not structured
      here.
    constraint_ids:
    - con_planck_neff_mass_floor
    - con_bbn_cmb_light_wimp
    derived_quantities:
    - Y_chi
    - T_gamma/T_nu
    - chemical potentials
    - N_eff
    description: Solve the coupled MeV-era relic abundance and N_eff evolution for the Z-prime-mediated
      scalar benchmark.
    forward_model_chain:
    - inputs:
      - matrix elements
      - thermal distributions
      notes: Needs separate terms for electromagnetic and neutrino sectors.
      outputs:
      - annihilation and energy-exchange rates
      step_id: compute_collision_terms
      step_type: analytic_formula
      tool_or_code: model-specific collision integrals
      validity: valid for the off-shell mediator benchmark and approximations in the primary paper
    - inputs:
      - rates
      - Hubble expansion
      - entropy densities
      notes: Track freeze-out through neutrino decoupling.
      outputs:
      - Y_chi(T)
      - T_gamma(T)
      - T_nu(T)
      step_id: integrate_mev_evolution
      step_type: boltzmann_solver
      tool_or_code: coupled temperature/yield ODE solver
      validity: core numerical calculation of the primary paper
    - inputs:
      - N_eff
      - relic abundance
      notes: Reproduce the roughly 7 MeV exclusion for the flavor-blind p-wave benchmark.
      outputs:
      - excluded mass range
      step_id: compare_planck
      step_type: likelihood
      tool_or_code: CMB N_eff comparison
      validity: Planck comparison quoted by primary paper
    id: route_coupled_boltzmann_neff
    input_parameters:
    - m_chi
    - annihilation branching ratios
    - Z-prime scale
    - initial sector temperatures
    likelihoods:
    - CMB N_eff likelihood
    - BBN light-element likelihood for broader recasts
    observable_ids:
    - obs_neff_from_mev_annihilation
    - obs_relic_abundance_joint_solution
    required_code_resources:
    - coupled Boltzmann/ODE solver
    - BBN code for light-element yields
    - Planck N_eff likelihood
    route_status: partially_implemented
    source_model_features:
    - complex scalar MeV dark matter
    - off-shell flavor-blind Z-prime mediator
    - thermal contact with electrons and neutrinos
    validation_tests:
    - recover Standard Model N_eff when dark sector is removed
    - reproduce quoted m_chi around 7 MeV Planck exclusion
