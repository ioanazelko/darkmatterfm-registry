model_id: 1201_1205_pseudo_familon_dark_matter_v1
identity:
  name: Pseudo-familon dark matter
  family: pseudo_goldstone_dark_matter
  aliases:
  - pseudo-familon
  short_description: A non-supersymmetric proof-of-principle model in which a pseudo-Goldstone boson of
    an approximate lepton-family U(1) symmetry is a long-lived dark matter candidate that decays mainly
    to charged leptons and obtains its relic density through Higgs-portal annihilation mediated by a singlet
    scalar.
  historical_origin_or_motivation: Motivated by pseudo-Majoron dark matter but modified so the pseudo-Goldstone
    boson couples primarily to charged leptons rather than neutrinos.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - non-supersymmetric Standard Model extension
  - approximate global lepton-family symmetry
  lagrangian_available: partial
  renormalizable: 'no'
  eft_cutoff:
    name: lepton flavor scale
    symbol: Lambda
    description: Scale generating higher-dimension lepton Yukawa operators and familon couplings.
    value: about the reduced Planck scale
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - '1201.1205'
    notes: Paper takes Lambda near M_* and obtains Lambda around 1e18 GeV up to order-one uncertainty.
  embedded_in_larger_framework: unknown
  notes: The model uses higher-dimension flavor operators, an approximate global U(1), and TeV-scale soft
    symmetry-breaking scalar terms.
particle_content:
  dark_matter_candidate:
    name: pseudo-familon
    spin: '0'
    statistics: boson
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - complex scalar Phi whose vev breaks the lepton-family U(1)
  - real scalar singlet S_0 with fluctuation S
  - right-handed neutrinos used for a seesaw sector
  mediators:
  - singlet scalar S
  - Standard Model Higgs h
  dark_radiation_species: []
  excited_or_degenerate_states: []
  long_lived_particles:
  - pseudo-familon with lifetime of order 1e26 s
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The pseudo-familon is long-lived because the approximate global U(1) is broken
    only softly and its charged-lepton decay couplings are tied to extremely small off-diagonal lepton
    Yukawa entries; an imposed scalar-sector Z2 removes rapid scalar decay channels.
  symmetries:
  - name: G = U(1) lepton-family symmetry
    type: global
    exact_or_approximate: broken
    breaking: Spontaneously broken by the Phi vev and softly explicitly broken by TeV-scale scalar terms.
    breaking_scale:
      name: familon symmetry-breaking scale
      symbol: v_phi
      description: Large scale of spontaneous breaking of the global U(1).
      value: about 1e17
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '1201.1205'
      notes: Paper quotes an explicit-to-spontaneous breaking ratio of roughly 1e3 GeV / 1e17 GeV.
  - name: scalar-sector Z2
    type: discrete
    exact_or_approximate: approximate
    breaking: Tiny lepton-flavor couplings violate the effective Z2 through loop-suppressed decay channels.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  standard_model_targets:
  - charged leptons
  - Standard Model Higgs bosons
  dark_sector_couplings:
  - higher-dimension familon couplings to off-diagonal charged-lepton Yukawa entries
  - soft symmetry-breaking m1^2 Phi^2 and m2 S_0 Phi^2 terms
  - S h^2 coupling in the low-energy scalar potential
  mediator_types:
  - real scalar singlet
  - Higgs portal
  interaction_operators:
  - effective lepton-flavor-violating pseudo-familon couplings proportional to Lambda^-4 times powers
    of Phi/Lambda
  - low-energy S phi^2 and S h^2 scalar interactions
  scattering:
    elastic: unknown
    inelastic: not_applicable
    momentum_dependence: unknown
    velocity_dependence: unknown
    spin_dependence: not_applicable
  annihilation_channels:
  - pseudo-familon pseudo-familon -> h h through s-channel S exchange
  decay_channels:
  - pseudo-familon -> e^- tau^+
  - pseudo-familon -> e^+ tau^-
  - pseudo-familon -> mu^- tau^+
  - pseudo-familon -> mu^+ tau^-
  self_scattering_channels: []
  cp_structure: The paper chooses CP-invariant soft scalar terms for the annihilation sector.
  flavor_structure: The global symmetry acts nontrivially in lepton generation space and produces suppressed
    off-diagonal charged-lepton couplings.
  tree_or_loop_level: tree
