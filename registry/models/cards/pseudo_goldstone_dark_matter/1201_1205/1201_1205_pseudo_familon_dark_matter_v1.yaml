assumptions:
  global:
  - id: approximate_global_u1
    description: An approximate global U(1) acting in lepton generation space is present below the Planck
      scale.
    scope: theory
    status: assumed
    impact_if_violated: The pseudo-Goldstone interpretation and long lifetime would not follow.
    can_be_relaxed: unknown
    source_reference_ids:
    - '1201.1205'
    notes: The paper notes possible quantum-gravity concerns but assumes such symmetries may arise accidentally.
  - id: small_offdiagonal_lepton_entries
    description: Off-diagonal charged-lepton Yukawa entries can be extremely small due to the charge assignments
      and flavor scales.
    scope: theory
    status: assumed
    impact_if_violated: The pseudo-familon would decay too quickly to be viable dark matter.
    can_be_relaxed: unknown
    source_reference_ids:
    - '1201.1205'
    notes: This is the central longevity mechanism.
  - id: small_higgs_s_mixing_limit
    description: The relic-density example neglects Higgs-singlet mixing and takes the singlet heavier
      than the Higgs.
    scope: production
    status: approximate
    impact_if_violated: The annihilation cross section and benchmark relic density would need recalculation.
    can_be_relaxed: 'yes'
    source_reference_ids:
    - '1201.1205'
    notes: The paper describes this as a well-motivated limit.
