identity:
  name: Conformal B-L pseudo-Goldstone dark matter
  family: pseudo_goldstone_dark_matter
  aliases:
  - conformal B-L pseudo-Goldstone DM
  short_description: A conformal local B-L extension with two complex B-L-breaking singlet scalars, where
    the imaginary part of the lower-VEV scalar is a long-lived pseudo-Goldstone dark matter particle produced
    by freeze-in.
  historical_origin_or_motivation: The model aims to connect dynamical mass generation, neutrino masses,
    baryogenesis, and dark matter in a conformal B-L framework.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - local U(1)_{B-L}
  - classical conformal symmetry
  - Coleman-Weinberg symmetry breaking
  - seesaw neutrino masses
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The tree-level scalar potential has no mass terms; hierarchical B-L scales v_B and v_A arise
    dynamically/induced by the scalar potential.
particle_content:
  dark_matter_candidate:
    name: imaginary component of Phi_A pseudo-Goldstone boson
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - two SM-singlet B-L scalars Phi_A and Phi_B
  - three right-handed neutrinos
  mediators:
  - B-L gauge boson Z_prime
  - B-L-breaking scalars
  - right-handed neutrinos
  unstable_parent_particles:
  - right-handed neutrinos in leptogenesis sector
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: The candidate is unstable but naturally long-lived because it is a pseudo-Goldstone
    mode with highly suppressed decay; the paper quotes lifetimes above 1e28 seconds.
  symmetries:
  - name: U(1)_{B-L}
    type: gauge
    exact_or_approximate: broken
    breaking: two-stage breaking by Phi_B and Phi_A vevs
  - name: classical conformal symmetry
    type: global
    exact_or_approximate: broken
    breaking: Coleman-Weinberg dimensional transmutation
  - name: pseudo-Goldstone shift-like protection
    type: approximate
    exact_or_approximate: approximate
    breaking: small scalar-potential terms permit slow decay
  topological_defects_possible: unknown
interactions:
  portals:
  - vector
  - higgs
  - neutrino
  standard_model_targets:
  - B-L current
  - SM Higgs doublet
  - active neutrinos through seesaw mixing
  dark_sector_couplings:
  - B-L gauge coupling g_BL
  - scalar quartics and Phi_A^3 Phi_B term
  - right-handed-neutrino Yukawa couplings
  mediator_types:
  - B-L gauge boson
  - singlet scalar
  - right-handed neutrino
  annihilation_channels:
  - freeze-in production through B-L mediated SM fermion annihilation into the dark scalar pair
  decay_channels:
  - dominant dark matter decay to two neutrinos in the allowed long-lived regime
  tree_or_loop_level: both
parameters:
  core:
  - name: primary B-L breaking scale
    symbol: v_B
    description: Higher B-L-breaking vev generated by Coleman-Weinberg dynamics.
    range: scanned between 100 GeV and 1e19 GeV
    unit: GeV
    role: core
    status: inferred
  - name: secondary B-L breaking scale
    symbol: v_A
    description: Lower induced B-L-breaking vev associated with the pseudo-Goldstone scalar.
    range: scanned between 100 GeV and 1e19 GeV with v_A much below v_B in viable regions
    unit: GeV
    role: core
    status: inferred
  - name: dark matter mass
    symbol: m_DM
    description: Mass of the pseudo-Goldstone scalar.
    range: heavier than 100 TeV in the paper summary; freeze-in condition also gives m_DM > about 2.01e7
      GeV in one estimate
    unit: GeV
    role: core
    status: inferred
  - name: dark matter lifetime
    symbol: tau_DM
    description: Lifetime required by the paper for IceCube decaying-DM limits.
    range: greater than 1e28 seconds
    unit: s
    role: core
    status: inferred
  - name: reheat temperature
    symbol: T_R
    description: Reheat temperature bounded for freeze-in production.
    range: m_DM and scalar masses below T_R below M_Z_prime
    unit: GeV
    role: core
    status: inferred
