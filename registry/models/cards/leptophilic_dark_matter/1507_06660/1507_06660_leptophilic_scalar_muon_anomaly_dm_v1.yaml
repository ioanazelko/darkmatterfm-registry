  short_description: A weak-scale dark sector with a U(1)_X gauge boson, vector-like fermions, and an
    inert complex scalar leaves an exact Z2 symmetry; the real scalar eta_0 is stable and annihilates
    mainly to muons and neutrinos.
  historical_origin_or_motivation: Built to address b -> s mu+ mu- anomalies and the muon g-2 discrepancy
