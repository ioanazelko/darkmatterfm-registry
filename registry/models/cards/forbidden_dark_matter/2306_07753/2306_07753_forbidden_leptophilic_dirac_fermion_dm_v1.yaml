  embedded_in_larger_framework: 'yes'
  notes: The effective post-electroweak-symmetry-breaking Lagrangian is written explicitly. The paper
    notes that electroweak gauge invariance would require an ultraviolet completion, such as a two-Higgs-doublet
    model plus an SU(2)_L scalar singlet.
