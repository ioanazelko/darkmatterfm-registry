  family: forbidden_dark_matter
  aliases:
  - forbidden dark matter annihilation into leptons
  short_description: A simplified forbidden-dark-matter model in which a singlet Dirac fermion annihilates
    into slightly heavier muon or tau leptons through a real scalar mediator, with relic density computed
    using full momentum-dependent Boltzmann collision terms.
  historical_origin_or_motivation: The paper develops the forbidden-DM paradigm where high-momentum particles
    in the thermal tail allow annihilation into heavier Standard Model final states.
  status: speculative
  model_kind: simplified_model
