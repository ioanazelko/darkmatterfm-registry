identity:
  name: Composite Inelastic Dark Matter
  family: composite_inelastic_dark_matter
  aliases:
  - CiDM
  short_description: A dark matter model in which the dominant dark matter is a composite dark meson of
    a confining SU(N_c) sector; hyperfine transitions to a nearly degenerate vector meson produce inelastic
    scattering through an axially coupled U(1)_A' mediator kinetically mixed with hypercharge.
  historical_origin_or_motivation: Motivated by the DAMA annual modulation signal and by the inelastic
    dark matter interpretation requiring an excited state split by about 100 keV.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: uv_complete
  parent_frameworks:
  - QCD-like confining dark sector
  - inelastic dark matter
  - kinetic-mixing dark photon mediator
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper gives an explicit gauge-sector Lagrangian for two dark Dirac fermions, a confining
    SU(N_c), an axial U(1)_A', kinetic mixing with hypercharge, and a charge-2 dark Higgs.
