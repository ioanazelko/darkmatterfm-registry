  notes: null
- id: charged_metastability_window
  applies_to: parameter
  condition: Charged F-balls are metastable only where the charged free-energy correction creates an energy
    barrier and volume energy does not erase it.
  valid_range: parameter range denoted Eq. lambdapara and subsequent inequalities in the paper
  status: established
  extrapolation_risk: medium
  caveats:
  - Fragmented states still have lower energy, so survival can depend on tunneling or thermal fluctuations.
  source_reference_ids:
  - hep-ph0112315
  notes: null
