  short_description: 'A cold dark matter candidate made of large charged non-topological solitons: closed
    domain walls carrying localized fermions, metastabilized against fragmentation by long-range electric
    energy within a restricted parameter range.'
  historical_origin_or_motivation: The paper revisits Fermi balls as CDM candidates, shows neutral F-balls
    fragment, and develops the charged F-ball metastability and allowed-parameter analysis.
  status: speculative
  model_kind: simplified_model
