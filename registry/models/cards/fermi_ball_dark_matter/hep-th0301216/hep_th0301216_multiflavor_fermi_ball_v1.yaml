validity_domain:
- id: thin_wall_limit
  applies_to: model
  condition: The spherical Fermi-ball radius R is much larger than the domain-wall thickness delta_b.
  valid_range: R >> delta_b
  status: assumed
  extrapolation_risk: high
  caveats:
  - Energy is expanded in powers of delta_b/R.
  source_reference_ids:
  - hep-th0301216
  notes: The paper explicitly states that it considers thin-wall Fermi balls.
- id: small_z2_breaking
  applies_to: theory
  condition: The difference between the two scalar-vacuum energies is small compared with the quartic
    scale.
  valid_range: '|epsilon(v)-epsilon(-v)| << lambda v^4'
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Analytic solutions neglect the small symmetry-breaking term for simplicity.
  source_reference_ids:
  - hep-th0301216
  notes: null
- id: positive_curvature_correction
  applies_to: parameter
  condition: In the proportional-fragmentation special case, the next-to-leading coefficient C(lambda,G_i,N_i)
    must be positive for the single Fermi ball to be energetically preferred.
  valid_range: C > 0
  status: established
  extrapolation_risk: medium
  caveats:
  - The paper evaluates a simplified common-G and common-N case numerically.
  source_reference_ids:
  - hep-th0301216
  notes: Allowed stable regions broaden as the number of flavors increases.
