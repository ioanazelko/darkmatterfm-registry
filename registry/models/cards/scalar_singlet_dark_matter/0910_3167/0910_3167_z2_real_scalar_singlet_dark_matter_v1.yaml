validity_domain:
- id: z2_unbroken_s_zero_vacuum
  applies_to: model
  condition: The Z2 symmetry is imposed and the true vacuum has <S>=0, so S is stable and there are no
    domain walls from singlet symmetry breaking.
  status: assumed
  extrapolation_risk: high
  caveats:
  - If the S=0 electroweak/dark-matter vacuum is not the global minimum, the dark-matter construction
    fails.
  source_reference_ids:
  - 0910_3167
  notes: null
- id: perturbative_stable_to_cutoff
  applies_to: parameter
  condition: The one-loop RGE-improved effective potential remains stable and scalar couplings remain
    perturbative up to the chosen cutoff Lambda.
  status: approximate
  extrapolation_risk: medium
  caveats:
  - Allowed regions depend strongly on Lambda, M_h, M_S, a_2, and b_4.
  source_reference_ids:
  - 0910_3167
  notes: null
- id: thermal_relic_region
  applies_to: parameter
  condition: The annihilation cross section set mainly by a_2 and M_S yields a singlet relic density that
    does not overclose the observed cold dark matter density, and may saturate the WMAP range for appropriate
    parameters.
  status: approximate
  extrapolation_risk: medium
  caveats:
  - The paper follows prior singlet-DM relic-density calculations and uses HDECAY for Higgs decay widths.
  source_reference_ids:
  - 0910_3167
  notes: null
assumptions:
  global:
  - id: exact_z2
    description: The scalar potential respects an exact Z2 symmetry under which S is odd, eliminating
      a1 and b3 terms.
    scope: theory
    status: assumed
    impact_if_violated: The singlet would generally be unstable and would no longer be the dark-matter
      candidate considered here.
    can_be_relaxed: 'no'
    source_reference_ids:
    - 0910_3167
    notes: null
  - id: s_zero_true_vacuum
    description: The electroweak/dark-matter vacuum has h=v0 and S=0 and is the true vacuum.
    scope: theory
    status: assumed
    impact_if_violated: A deeper S not equal to zero minimum would invalidate the stable singlet dark-matter
      setup and could create domain-wall problems.
    can_be_relaxed: 'no'
    source_reference_ids:
    - 0910_3167
    notes: null
  - id: thermal_production
    description: Relic-density comparisons assume thermal production of singlet dark matter.
    scope: production
    status: assumed
    impact_if_violated: The mapping from a2 and M_S to Omega_S h^2 would change.
