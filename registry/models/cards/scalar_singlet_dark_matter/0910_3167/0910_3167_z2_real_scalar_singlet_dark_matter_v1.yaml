    range: scanned; examples include light singlet masses around or above tens of GeV depending on b4
      and cutoff
    unit: GeV
    role: core
    status: established
    source_reference_ids:
    - 0910_3167
    notes: The paper states that for Lambda=1 TeV and M_h=120 GeV, b4=0 implies M_S about 50 GeV as a
      lower bound.
  - name: Higgs mass
    symbol: M_h
    description: Standard Model-like Higgs mass used in the stability and relic-density scans.
    range: varied in the analysis; examples include 120 GeV and 200 GeV
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
