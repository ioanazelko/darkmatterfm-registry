identity:
  name: Z2 real scalar singlet dark matter
  family: scalar_singlet_dark_matter
  aliases:
  - scalar singlet dark matter
  - singlet scalar dark matter
  short_description: A real gauge-singlet scalar S is added to the Standard Model scalar sector; an unbroken
    Z2 symmetry and zero singlet vev make S stable so it can be cold dark matter. This paper develops
    the model through one-loop vacuum stability, perturbativity, and relic-density consistency requirements.
  historical_origin_or_motivation: Motivated by the possibility that a scalar singlet is a low-energy
    remnant of a more complex high-energy model and can account for the observed cold dark-matter relic
    abundance.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Standard Model scalar singlet extension
  lagrangian_available: partial
  renormalizable: 'yes'
  eft_cutoff:
    name: cutoff scale
    symbol: Lambda
    description: Scale up to which the scalar potential is required to remain stable and perturbative.
    range: 1 TeV to 10^19 GeV in illustrative scans
    unit: GeV
    role: core
    status: assumed
    source_reference_ids:
    - 0910_3167
    notes: The paper studies several cutoff choices including 1 TeV, 10^6 GeV, 10^9 GeV, and 10^19 GeV.
  embedded_in_larger_framework: unknown
  notes: The paper writes the most general renormalizable Higgs-plus-singlet scalar potential and then
    imposes a Z2 symmetry for the dark-matter case.
