    a Z2-stabilized inert scalar singlet dark matter candidate, scalar and Z prime portals, neutrino mass,
    and resonant leptogenesis.
  historical_origin_or_motivation: Built to address dark matter, light neutrino mass, leptogenesis, and
    flavor-sector constraints in one B-L gauge framework with fractional-charge exotic fermions.
  status: speculative
  model_kind: complete_theory
