  renormalizable: 'no'
  embedded_in_larger_framework: 'yes'
  notes: The paper gives gauge, Yukawa, and scalar-potential terms; it also uses dimension-five interactions
    for neutrino/leptogenesis ingredients.
particle_content:
  dark_matter_candidate:
    name: inert scalar singlet phi_DM = (S_DM + i A_DM)/sqrt(2)
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - four exotic right-handed fermions N_1R, N_2R, N_3R, N_4R with fractional B-L charges
  - scalar singlets phi_1, phi_2, phi_3 for B-L breaking and exotic fermion masses
  mediators:
  - Z prime gauge boson of U(1)_B-L
  - CP-even scalars H_1 and H_2
  - SM-like Higgs
  dark_radiation_species: []
  excited_or_degenerate_states:
