    type: gauge
    exact_or_approximate: broken
    breaking: spontaneous breaking by phi_1, phi_2, and phi_3 vacuum expectation values
    breaking_scale: null
  - name: Z2
    type: discrete
    exact_or_approximate: exact
    breaking: unbroken dark-matter parity
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
