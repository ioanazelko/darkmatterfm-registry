  long_lived_particles:
  - Z2-stabilized inert scalar singlet
  unstable_parent_particles:
  - heavy exotic fermions participating in resonant leptogenesis
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An added Z2 symmetry makes the inert scalar singlet stable; U(1)_B-L is spontaneously
    broken by scalar singlet vacuum expectation values.
  symmetries:
