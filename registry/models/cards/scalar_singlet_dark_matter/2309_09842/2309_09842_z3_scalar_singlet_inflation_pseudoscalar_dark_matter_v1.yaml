parameters:
  core:
  - name: dark_matter_mass
    symbol: m_A
    description: Mass of the pseudoscalar A; the text gives m_A^2 from the trilinear singlet term.
    range: model-dependent through M_phi and v1
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
  - name: singlet_vev
    symbol: v1
    description: Vacuum expectation value of the neutral complex singlet.
    range: DM scans include v1 values around 1e7 to 1e12 GeV for freeze-out; freeze-in abundance is found
      for low v1 around 1e9 GeV.
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
  - name: singlet_quartic_coupling
    symbol: lambda2
    description: Quartic coupling associated with the singlet/inflaton direction.
    range:
      min: '5.3e-13'
      max: '1.3e-10'
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Range quoted from the RG running discussion.
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
  - name: higgs_singlet_portal_coupling
    symbol: lambda3
    description: Portal coupling controlling hAA and hprimeAA interactions and the thermalization of A.
    range: freeze-in correct abundance for lambda3 roughly O(1e-7 to 1e-6) in the text discussion
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
  - name: neutral_fermion_yukawa
    symbol: y_N
    description: Yukawa coupling of the neutral fermionic singlet, needed to recover negative running
      of the quartic coupling.
    range:
      min: 8e-4
      max: 3e-3
      inclusive_min: true
      inclusive_max: true
      unit: null
      notes: Quoted from the parameter running section.
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
  - name: trilinear_singlet_mass_parameter
    symbol: M_phi
    description: Mass parameter in the cubic singlet term that generates the pseudoscalar mass.
    range: freeze-out correct abundance for M_phi around 1e6 to 1e8 GeV in the text discussion
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '2309_09842'
