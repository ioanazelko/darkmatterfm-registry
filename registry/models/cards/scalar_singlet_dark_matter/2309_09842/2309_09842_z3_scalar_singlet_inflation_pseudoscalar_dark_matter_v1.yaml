identity:
  name: Z3 complex scalar singlet inflection-point inflation pseudoscalar dark matter
  family: scalar_singlet_dark_matter
  aliases:
  - pseudoscalar A dark matter
  - inflaton-pseudoscalar singlet dark matter
  short_description: A Z3-symmetric Standard Model extension with a neutral complex scalar singlet whose
    real component realizes inflection-point inflation and whose imaginary component A is a stable pseudoscalar
    dark matter candidate.
  historical_origin_or_motivation: The construction connects Planck-constrained inflection-point inflation
    to a low-energy scalar singlet dark matter sector and tests whether the same parameter space can yield
    the observed abundance.
  status: speculative
  model_kind: simplified_model
