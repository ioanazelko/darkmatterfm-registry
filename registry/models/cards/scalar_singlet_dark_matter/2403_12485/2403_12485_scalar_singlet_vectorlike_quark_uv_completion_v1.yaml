  short_description: A renormalizable extension with a Z2-odd real scalar singlet dark matter particle
    and Z2-odd vector-like quarks that can explain a B to K plus invisible excess while producing the
    dark matter relic density by thermal freeze-out.
  historical_origin_or_motivation: The paper constructs a renormalizable UV completion of a low-energy
    scalar-current operator for B to K plus invisible decays and links it to the observed dark matter
    abundance.
  status: speculative
  model_kind: complete_theory
