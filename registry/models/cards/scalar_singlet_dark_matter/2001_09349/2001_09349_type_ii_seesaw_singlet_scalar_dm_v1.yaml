identity:
  name: Type-II seesaw scalar singlet dark matter model
  family: scalar_singlet_dark_matter
  aliases:
  - scalar triplet extension with singlet scalar DM
  - Type-II seesaw with scalar singlet DM
  short_description: A Type-II seesaw scalar sector with a Z2-odd real singlet scalar thermal dark matter
    candidate coupled through Higgs-doublet and scalar-triplet portal terms.
  historical_origin_or_motivation: Motivated by relaxing direct-detection pressure on Higgs-portal scalar
    dark matter using a Y=2 triplet scalar sector that also generates Majorana neutrino masses.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: simplified_model
  parent_frameworks:
  - Standard Model plus Type-II seesaw scalar triplet
  - scalar singlet dark matter
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: 'yes'
  notes: The paper writes the full Lagrangian as SM plus Type-II seesaw plus dark matter and interaction
    terms, and states it is not concerned with ultraviolet completion.
particle_content:
  dark_matter_candidate:
    name: Z2-odd SU(2)_L x U(1)_Y singlet scalar
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles: []
