  - heavy CP-even scalar H
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact Z2 symmetry makes the singlet scalar odd and the doublet and triplet
    even, forbidding singlet mixing and stabilizing the dark matter candidate.
  symmetries:
  - name: Z2 parity
    type: discrete
    exact_or_approximate: exact
    breaking: not discussed
    breaking_scale: null
  - name: SU(3)_C x SU(2)_L x U(1)_Y gauge symmetry
    type: gauge
    exact_or_approximate: exact
    breaking: electroweak symmetry breaking by doublet and triplet VEVs
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - other
  standard_model_targets:
  - SM Higgs doublet
  - Y=2 electroweak scalar triplet
  - SM fermions and gauge bosons through scalar mixing and decays
  dark_sector_couplings:
  - singlet self-coupling lambda_S
  - doublet portal lambda_D S^2 Phi^dagger Phi
  - triplet portal lambda_T S^2 Tr(Delta^dagger Delta)
  mediator_types:
  - scalar
  interaction_operators:
