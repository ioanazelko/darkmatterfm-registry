  self_scattering_channels: []
  cp_structure: Scalar-sector phases are mostly taken real in the paper except for the Type-II seesaw
    trilinear parameter.
  flavor_structure: Triplet Yukawa couplings generate Majorana neutrino masses; the singlet DM field is
    flavor neutral.
  tree_or_loop_level: tree
