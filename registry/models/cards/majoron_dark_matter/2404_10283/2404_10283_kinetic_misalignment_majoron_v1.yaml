    texture.
  applies: parameter_dependent
  assumptions:
  - can_be_relaxed: 'yes'
    description: The Lmu-Ltau sector uses the minimal texture with right-handed neutrinos described in
      the related paper.
    id: minimal_lmutau_texture
    impact_if_violated: Nonminimal flavor terms can loosen the predictions.
    notes: null
    scope: flavor_model
    source_reference_ids:
    - arxiv:1705.00419
    status: assumed
  benchmark_implications:
  - Laboratory consistency is needed for the low-scale phenomenological application of the model.
  caveats:
  - Not a dark-matter likelihood; included as model-context routing.
  constrained_parameters:
  - g_{mu-tau}
  - m_Zprime
  - neutrino mass matrix
  constraint_type: laboratory
  data_release: Neutrino-oscillation and muon-g-2/trident context from related U(1)Lmu-Ltau paper
  excluded_regions:
  - Muon g-2 motivated gauge-boson regions can be restricted by neutrino trident searches.
  id: con_lmutau_neutrino_trident_gminus2
  likelihood_available: 'no'
  likelihood_reference: null
  name: Lmu-Ltau gauge-sector laboratory consistency
  notes: null
  observable_channel: muon g-2 and neutrino trident
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - arxiv:2404.10283
  - arxiv:1705.00419
theory_to_observable_routing:
  routes:
  - agent_notes: null
    caveats:
    - No structure-transfer prediction for the eV majoron field was extracted.
    constraint_ids:
    - con_majoron_lifetime_cmb_bao
    - con_kinetic_misalignment_dm_bau_region
    - con_lmutau_neutrino_trident_gminus2
    derived_quantities:
    - Y_B-L
    - Y_B
    - Omega_J h^2
    - tau_J
    description: Trace the rotating B-L scalar condensate into baryon asymmetry, coherent majoron dark
      matter, late neutrino decay, and laboratory consistency.
    forward_model_chain:
    - inputs:
      - S_i
      - m_S
      - n
      - explicit breaking coefficient
      notes: null
      outputs:
      - Y_B-L
      step_id: s1
      step_type: analytic_formula
      tool_or_code: null
      validity: Valid while the scalar rotation persists and explicit breaking is perturbative.
    - inputs:
      - Y_B-L
      - T_sph
      - f
      notes: null
      outputs:
      - Y_B
      step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses source sphaleron conversion expression.
    - inputs:
      - m_J
      - f
      - sum m_nu^2
      notes: null
      outputs:
      - tau_J
      - Omega_J h^2
      step_id: s3
      step_type: analytic_formula
      tool_or_code: null
      validity: Source majoron-neutrino decay and kinetic-misalignment abundance relations.
    - inputs:
      - tau_J
      - decay products
      notes: null
      outputs:
      - CMB/BAO decaying-DM likelihood target
      step_id: s4
      step_type: recasting
      tool_or_code: null
      validity: Dedicated neutrino-majoron likelihood not run.
    id: route_majoron_kinetic_misalignment
    input_parameters:
    - m_J
    - f
    - S_i
    - m_S
    - n
    - M_i
    - g_{mu-tau}
    - m_Zprime
    likelihoods:
    - CMB/BAO decaying-DM likelihood
    - baryon-asymmetry target
    - neutrino-trident constraints
    observable_ids:
    - obs_majoron_decay_cmb_bao
    - obs_majoron_kinetic_misalignment_bau_dm
    - obs_lmutau_neutrino_gminus2_context
    required_code_resources:
    - Boltzmann solver with decaying-DM support
    - parameter scanner for rotating scalar history
    - neutrino/flavor likelihoods
    route_status: planned
    source_model_features:
    - global U(1)B-L breaking scalar
    - majoron kinetic misalignment
    - gauged U(1)Lmu-Ltau
    - right-handed neutrinos
    validation_tests:
    - recover tau_J > 250 Gyr
    - recover Y_B about 9e-11 benchmark
    - check rotation persists through leptogenesis
