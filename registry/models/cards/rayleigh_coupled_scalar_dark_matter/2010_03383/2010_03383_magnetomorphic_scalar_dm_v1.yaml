  notes: null
- id: radiation_era_transition
  applies_to: cosmological_history
  condition: Baseline parameter-space bounds assume the inverse phase transition occurs during radiation
    domination with a frozen-in PMF.
  valid_range: T_* above the electroweak-scale discussion and example T_reh = 10^10 GeV
  status: assumed
  extrapolation_risk: medium
  caveats:
