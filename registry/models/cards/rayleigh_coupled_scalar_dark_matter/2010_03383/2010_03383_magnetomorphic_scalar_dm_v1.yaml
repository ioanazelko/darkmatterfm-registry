    or inflation.
  source_reference_ids:
  - '2010_03383'
  notes: null
- id: pmf_spectrum_assumption
  applies_to: model
  condition: The displayed isocurvature/statistical-anisotropy prediction is worked out for a nearly scale-invariant
    PMF with a long-wavelength background component.
  valid_range: nearly flat PMF spectrum in the paper example
  status: assumed
  extrapolation_risk: medium
  caveats:
  - Different PMF spectra would alter the imprinted scalar perturbations.
  source_reference_ids:
  - '2010_03383'
  notes: null
- id: magnetomorphic_fraction_bound
  applies_to: parameter
  condition: The PMF-imprinted component cannot be arbitrarily large because the paper imposes isocurvature
