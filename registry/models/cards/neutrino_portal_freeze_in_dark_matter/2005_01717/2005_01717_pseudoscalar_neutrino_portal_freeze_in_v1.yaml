    description: Initial dark-sector energy density is negligible.
    id: asm_negligible_initial_dark_density
    impact_if_violated: A primordial dark population would change the freeze-in yield.
    notes: null
    scope: cosmological initial condition
    source_reference_ids:
    - src_2005_01717_primary
    status: assumed
  benchmark_implications:
  - Relic abundance is the central normalization for both scalar and pseudoscalar scenarios.
