validity_domain:
- id: pbh_abundance_mapping_assumptions
  applies_to: model
  condition: PBH abundance and induced-GW mapping use Gaussian curvature perturbations, a Press-Schechter
    treatment, a modified Gaussian window function, delta_c = 0.42, and no critical-collapse correction.
  valid_range: 0.2 <= M_PBH / M_sun <= 5 and 0.015 <= A_s <= 0.040 in the paper's scan
  status: assumed
  extrapolation_risk: high
  caveats:
  - The paper states that the relation between A_s and f_PBH depends crucially on the window-function
    choice.
  - Non-Gaussianity, critical collapse, and transfer-function effects are not included in the baseline
    calculation.
  source_reference_ids:
  - '2009_11853'
  notes: These assumptions are central to the paper's conclusion that a substantial solar-mass PBH abundance
    can explain the NANOGrav hint.
