- id: con_double_well_cmb_consistency
  name: CMB-scale inflation consistency
  constraint_type: cosmological
  observable_channel: CMB scalar tilt and tensors
  applies: 'yes'
  constrained_parameters:
  - A_s
  - n_s
  - r
  - v
  - xi
  - n
  excluded_regions:
  - Tree-level Higgs-like double wells in the tested non-minimal setup cannot simultaneously produce PBHs
    and a consistent CMB region according to the primary text.
  allowed_regions:
  - Coleman-Weinberg-like double well with n=4 is used to fit CMB scales while producing the small-scale
    peak.
  benchmark_implications:
  - The CMB plateau and small-scale feature must be engineered together.
  likelihood_available: partial
  likelihood_reference: null
  data_release: Planck/BICEP CMB observables quoted by the primary paper
  recasting_needed: partial
  robustness: medium
  assumptions:
  - id: single-field-effective-description
    description: The effective double-well model and perturbation variables capture the relevant inflationary
      dynamics.
    scope: CMB and PBH model building
    status: assumed
    impact_if_violated: Multifield or reheating effects can change the mapping.
    can_be_relaxed: partial
    source_reference_ids:
    - arxiv:2305.09630
    notes: null
  caveats:
  - No Planck likelihood was rerun.
  source_reference_ids:
  - arxiv:2305.09630
  notes: null
theory_to_observable_routing:
  routes:
  - id: route_double_well_power_to_pbh_sigw
    description: Solve double-well inflationary perturbations, map the small-scale curvature peak to PBH
      abundance, and compute the correlated induced gravitational-wave signal.
    source_model_features:
    - double-well inflaton potential
    - minimum crossing or roll-back
    - ultra-slow-roll/constant-roll phase
    - curvature power peak
    input_parameters:
    - v
    - xi
    - n
    - initial field value
    - N_I
    - N_II
    - P_R,max
    derived_quantities:
    - curvature power spectrum
    - PBH mass scale
    - PBH abundance fraction
    - induced GW spectrum
    forward_model_chain:
    - step_id: s1
      step_type: simulation
      tool_or_code: Mukhanov-Sasaki solver
      inputs:
      - inflation trajectory
      - potential parameters
      outputs:
      - P_R(k)
      - CMB observables
      validity: Primary paper tracks modes until the spectrum freezes.
      notes: null
    - step_id: s2
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - P_R(k)
      - collapse threshold
      outputs:
      - M_PBH
      - f_PBH
      validity: Order-of-magnitude PBH formation route.
      notes: null
    - step_id: s3
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - P_R(k)
      outputs:
      - Omega_GW(f)
      validity: Second-order scalar-induced gravitational waves.
      notes: null
    - step_id: s4
      step_type: recasting
      tool_or_code: null
      inputs:
      - f_PBH(M)
      - Omega_GW(f)
      - CMB observables
      outputs:
      - PBH constraints
      - GW constraints
      - CMB consistency
      validity: Needs current likelihoods for production use.
      notes: null
    observable_ids:
    - obs_double_well_pbh_abundance
    - obs_double_well_sigw
    constraint_ids:
    - con_double_well_asteroid_window
    - con_double_well_sigw_probe
    - con_double_well_cmb_consistency
    likelihoods:
    - PBH abundance likelihood unavailable
    - GW likelihood unavailable
    - CMB likelihood not rerun
    required_code_resources:
    - inflation background and perturbation solver
    - PBH abundance calculator
    - induced-GW integrator
    validation_tests:
    - recover M_PBH=1e17-1e22 g target window
    - recover P_R,max order 1e-2
    - recover CMB n_s/r quoted by primary
    route_status: planned
    agent_notes: null
    caveats:
    - Primary paper intentionally avoids precise PBH abundance prediction.
