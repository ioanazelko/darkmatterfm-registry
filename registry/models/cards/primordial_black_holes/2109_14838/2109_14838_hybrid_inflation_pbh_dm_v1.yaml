parameters:
  core:
  - name: hybrid inflation vacuum scale
    symbol: V0
    description: Constant term in the effective single-field hybrid-inflation potential.
    role: core
    status: inferred
  - name: chaotic potential coefficient
    symbol: lambda_p
    description: Coefficient of the polynomial-like inflaton potential lambda_p phi^p.
    role: core
    status: inferred
  - name: chaotic exponent
    symbol: p
    description: Power in the chaotic polynomial-like potential.
    range: p>0; examples include 2/3, 1, and 2
    role: core
    status: inferred
  - name: radiative correction coefficient
    symbol: A
    description: Coleman-Weinberg one-loop coefficient in V=V0+lambda_p phi^p + A phi^4 log(phi).
    range: fermionic corrections use A<0 in the paper
    role: core
    status: inferred
  - name: critical waterfall value
    symbol: phi_c
    description: Field value ending hybrid inflation via the waterfall transition.
    role: core
    status: inferred
  - name: kinetic peak height
    symbol: h
    description: Height of G(phi) peak used to enhance small-scale power.
    role: core
    status: inferred
  - name: kinetic peak width
    symbol: w
    description: Width of Gaussian, polynomial, or step kinetic peak function.
    role: core
    status: inferred
  - name: kinetic peak location
    symbol: phi_p
    description: Inflaton value where K(phi) peaks and triggers ultra-slow-roll enhancement.
    role: core
    status: inferred
  - name: PBH formation threshold
    symbol: delta_c
    description: Critical density perturbation used for PBH formation.
    value: 0.4
    role: core
    status: assumed
  - name: collapse efficiency
    symbol: gamma
    description: Factor relating PBH mass to horizon mass.
    value: 0.2
    role: core
    status: assumed
  nuisance: []
  derived:
  - name: PBH dark matter fraction
    symbol: Y_PBH
    description: Current PBH energy density fraction relative to dark matter.
    range: benchmark peaks range from about 0.003 to 0.80 depending on data set
    role: derived
    status: inferred
  - name: curvature power spectrum peak
    symbol: P_R
