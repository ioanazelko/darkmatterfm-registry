constraints:
- id: con_cmb_isocurvature
  name: CMB isocurvature bound on clustered PBHs
  constraint_type: cosmological
  observable_channel: PBH isocurvature power
  applies: 'yes'
  constrained_parameters:
  - f_PBH
  - xi_star
  - P_PBH(k)
  - beta_iso
  excluded_regions:
  - The primary paper uses beta_iso < 0.035 at k_low = 0.002 Mpc^-1 for uncorrelated cold dark matter
    isocurvature to constrain f_PBH^2 xi_star.
  allowed_regions:
  - Weak clustering or low PBH fraction can satisfy the bound; the blue-tilted spectrum makes the large-scale
    application conservative.
  benchmark_implications:
  - Strong initial clustering can significantly tighten PBH abundance constraints.
