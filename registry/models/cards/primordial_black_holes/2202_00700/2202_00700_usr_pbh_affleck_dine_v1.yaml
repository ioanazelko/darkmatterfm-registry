    notes: The paper focuses on the highest cutoff, Lambda = M_P, to maximize the constant baryon-asymmetry
      plateau.
  embedded_in_larger_framework: 'yes'
  notes: The inflaton dynamics are represented through a broken-power-law curvature spectrum template
    and a transient USR phase; the Affleck-Dine sector is given by an effective Lagrangian with derivative
    couplings and baryon-number violation.
