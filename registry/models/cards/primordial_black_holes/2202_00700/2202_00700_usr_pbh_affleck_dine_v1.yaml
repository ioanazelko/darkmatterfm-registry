  short_description: A primordial-black-hole dark-matter scenario in which a transient ultra-slow-roll
    phase of single-field inflation creates a sharply peaked small-scale curvature spectrum, producing
    asteroid-mass PBHs after horizon reentry while an Affleck-Dine scalar generates the baryon asymmetry.
  historical_origin_or_motivation: The paper motivates the scenario as a way to connect PBH dark matter
    and the baryon density through the cosmic coincidence problem, while keeping induced gravitational-wave
    predictions testable.
  status: speculative
  model_kind: phenomenological_parameterization
