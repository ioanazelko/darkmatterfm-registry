  short_description: A supersymmetric Affleck-Dine leptogenesis scenario in which high-lepton bubbles
    form lepton-charge Q-balls (L-balls) that collapse into primordial black holes, giving an allowed
    PBH abundance as a dark-matter subcomponent or black-hole seed population.
  historical_origin_or_motivation: The paper revisits AD baryogenesis PBH formation, finds the high-baryon-bubble
    version excluded by residual baryon density, and proposes a high-lepton-bubble L-ball alternative.
  status: speculative
  model_kind: effective_field_theory
