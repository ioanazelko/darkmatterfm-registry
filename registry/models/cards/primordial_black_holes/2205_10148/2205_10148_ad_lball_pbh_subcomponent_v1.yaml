  embedded_in_larger_framework: 'yes'
  notes: The paper gives the Affleck-Dine scalar potential, stochastic field evolution, L-ball formation/evaporation/decay
    estimates, and PBH abundance calculations for threshold masses near 30 solar masses and 1e4 solar
    masses.
