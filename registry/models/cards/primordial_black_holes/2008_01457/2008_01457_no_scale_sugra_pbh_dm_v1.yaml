parameters:
  core:
  - name: Kahler exponential switch parameter
    symbol: a
    description: Coefficient of the exponential deformation; the paper uses a=0 for the undeformed case
      and a=-4 when the extra term is active.
    value: '-4'
    role: core
    status: inferred
  - name: Kahler exponential shape parameter
    symbol: b
    description: Extra parameter tuned to produce an inflection point and PBH abundance.
    range: benchmark-dependent values in the paper tables
    role: core
    status: inferred
  - name: Wess-Zumino coupling ratio
    symbol: lambda/mu
    description: Ratio varied near 1/3 in the modified no-scale model.
    range: about 0.33327 to 1/3 in reported benchmark sets
    role: core
    status: inferred
  - name: model parameter fixed by Planck data
    symbol: beta
    description: Parameter affecting the total number of e-folds in the modified Kahler potential setup.
    value: '0.065'
    role: core
    status: inferred
  - name: collapse threshold
    symbol: delta_c
    description: Critical overdensity for PBH collapse used in abundance calculations.
    range: 0.4-0.5; benchmark calculations use 0.45
    role: cosmological
    status: inferred
  - name: collapse efficiency
    symbol: gamma
    description: Factor in the PBH mass-wave-number relation.
    value: '0.2'
    role: cosmological
    status: inferred
  - name: effective degrees of freedom at PBH formation
    symbol: g_star
    description: Standard Model degrees of freedom used in the PBH mass relation.
    value: '106.75'
    role: cosmological
    status: inferred
  derived:
  - name: PBH dark matter fraction
    symbol: Omega_PBH/Omega_DM
    description: Maximum PBH fraction obtained in allowed benchmark regions.
    range: up to about 0.2-0.25
    role: derived
    status: inferred
  - name: scalar power peak
    symbol: P_R_peak
    description: Numerical Mukhanov-Sasaki calculation yields a peak large enough for PBH production.
    value: larger than 1e-2
    role: derived
    status: inferred
