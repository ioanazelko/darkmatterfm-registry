validity_domain:
- id: validity_survival_mass
  applies_to: model
  condition: PBHs must form above the Hawking evaporation survival threshold, cited as about 1e15 g, to
    remain until the present day.
  status: established
  extrapolation_risk: high
  caveats:
  - Lower-mass PBHs evaporate and cannot be present-day dark matter.
  source_reference_ids:
  - '2001_09160'
  notes: null
- id: validity_all_dm_window
  applies_to: parameter
  condition: All-DM examples require the PBH mass function to peak in an open sublunar mass window while
    leaving a larger-mass tail.
  status: inferred
  extrapolation_risk: medium
  caveats:
  - The tail controls microlensing and compact-object implications; do not replace the model by a monochromatic
    mass.
  source_reference_ids:
  - '2001_09160'
  notes: null
- id: validity_reheating_bbn
  applies_to: cosmological_history
  condition: The latest reheating temperature after an intermediate matter-dominated phase should not
    be below a few MeV for Big Bang nucleosynthesis.
  status: assumed
  extrapolation_risk: high
  caveats:
  - Large PBH masses may imply low reheating and require compatible baryogenesis.
  source_reference_ids:
  - '2001_09160'
  notes: null
