theory_to_observable_routing:
  routes:
  - agent_notes: The abundance formula is available but the distribution/transfer implementation is not.
    caveats: []
    constraint_ids:
    - con_freezein_relic_density
    - con_lyman_warm_n1
    derived_quantities:
    - Gamma(S -> N1 l)
    - Omega_N1 h^2
    - N1 momentum distribution
    description: Compute N1 abundance from thermal scalar decays in the 2HDM+3NR model.
    forward_model_chain:
    - inputs:
      - scalar masses
      - (Y_nu)_{i1}
      notes: null
      outputs:
      - partial widths to N1
      step_id: decay_widths
      step_type: analytic_formula
      tool_or_code: null
      validity: Leading freeze-in approximation from the primary paper.
    - inputs:
      - partial widths
      - thermal scalar densities
      notes: null
      outputs:
      - N1 yield
      - Omega h^2
      step_id: yield_integral
      step_type: boltzmann_solver
      tool_or_code: null
      validity: Assumes scalar parents are thermal.
    - inputs:
      - N1 production spectrum
      notes: null
      outputs:
      - matter transfer function
      step_id: spectrum_to_lyman
      step_type: transfer_function
      tool_or_code: CLASS/CAMB recast
      validity: Required for a real Lyman-alpha limit.
    id: route_scalar_decay_freezein
    input_parameters:
    - M1
    - M_A
    - M_H
    - M_H+
    - (Y_nu)_{i1}
    - g_*
    likelihoods:
    - Planck relic-density target
    - Lyman-alpha likelihood
    observable_ids:
    - obs_n1_warmdm_lyman
    required_code_resources:
    - freeze-in Boltzmann integrator
    - linear transfer solver
    route_status: planned
    source_model_features:
    - thermal heavy scalars
    - feeble N1 Yukawa column
    - 7.1 keV sterile neutrino
    validation_tests:
    - Reproduce Omega_N1 h^2 = 0.12 benchmark line.
  - agent_notes: Useful for checking whether relic-density and X-ray requirements can be satisfied simultaneously.
    caveats: []
    constraint_ids:
    - con_xray_yukawa_suppression
    derived_quantities:
    - radiative width
    - 3.5 keV line flux
    description: Map the suppressed N1 Yukawa/mixing to X-ray line constraints.
    forward_model_chain:
    - inputs:
      - M1
      - (Y_nu)_{i1}
      notes: null
      outputs:
      - active-sterile mixing proxy
      step_id: mixing_translation
      step_type: analytic_formula
      tool_or_code: null
      validity: Uses the relation stated in the primary paper.
    - inputs:
      - radiative width
      - DM column density
      notes: null
      outputs:
      - line flux
      step_id: xray_flux
      step_type: data_transform
      tool_or_code: null
      validity: Target astrophysics controls the comparison.
    id: route_n1_xray_decay
    input_parameters:
    - M1
    - sum_i |(Y_nu)_{i1}|^2
    - target dark-matter column
    likelihoods:
    - X-ray line limits and line-fit likelihoods
    observable_ids:
    - obs_n1_35kev_xray_line
    required_code_resources:
    - X-ray spectral recast
    route_status: planned
    source_model_features:
    - 7.1 keV N1
    - suppressed first-column Yukawa texture
    validation_tests:
    - Recover the 7.1 keV to 3.5 keV kinematic relation.
  - agent_notes: This route keeps dark matter from being evaluated separately from the texture constraints
      that define the model.
    caveats:
    - Flavor anomalies have changed historically and require current data in future work.
    constraint_ids:
    - con_2hdm_flavor_lhc
    - con_freezein_relic_density
    - con_xray_yukawa_suppression
    derived_quantities:
    - DM abundance
    - X-ray width
    - B-observable shifts
    - charged-Higgs rates
    description: Jointly scan the mass-powered 2HDM texture against N1 dark matter and flavor/collider
      observables.
    forward_model_chain:
    - inputs:
      - fermion masses
      - texture exponents
      notes: null
      outputs:
      - Yukawa matrices
      step_id: texture_build
      step_type: analytic_formula
      tool_or_code: null
      validity: Follows the primary paper ansatz.
    - inputs:
      - Yukawa matrices
      - scalar masses
      notes: null
      outputs:
      - flavor and collider predictions
      step_id: observable_scan
      step_type: recasting
      tool_or_code: null
      validity: Requires flavor tools not supplied in text.
    id: route_joint_flavor_dm_fit
    input_parameters:
    - texture exponents
    - scalar masses
    - Yukawa normalizations
    likelihoods:
    - flavor averages
    - LHC charged-Higgs searches
    - relic density
    observable_ids:
    - obs_flavor_precision_correlations
    required_code_resources:
    - flavor calculator
    - freeze-in module
    route_status: planned
    source_model_features:
    - mass-powered Yukawa matrices
    - heavy scalar spectrum
    - sterile N1 dark matter
    validation_tests:
    - Check the paper benchmark regions before extending.
